<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign Organization Management Pro Prep · Набор для подготовки аналитика</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/docusign-org-cert/">
<meta name="description" content="Подготовка к экзамену Docusign Organization Management Pro. Подробное руководство по Документация администратора: организации, профили разрешений администратора, управление пользователями, массовые действия, совместное использование и передача прав собственности, управление доступом и Документ-монитор, а также практический экзамен из 40 вопросов, оцениваемый по реальному проходному баллу 80%.">

<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>

<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Вернуться ко всем комплектам">← Все комплекты</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Docusign Org Management Pro Prep</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Дом</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Учебное руководство</button>
  <button class="nav-btn" id="navExam" onclick="setView('exam')">Практический экзамен</button>

</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dsorgcert';
const EXAM_MINUTES = 30;   // Docusign estimates ~30 min. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Антропный API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':"Верно"},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель Документация, помогающий кому-то подготовиться к экзамену Docusign Organization Management Pro. Этот экзамен охватывает Документация администратора: организации, профили разрешений администратора организации, централизованное управление пользователями, массовые действия с файлами CSV, совместное использование и передачу владения конвертами, управление доступом (заявленные домены, единый вход, политики входа, своевременная подготовка, подключенные приложения) и оповещения Документ-монитор и экспорт данных. Речь идет об уровне организации в Документация администратора, а не о настройках внутри одной учетной записи электронной подписи.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, что, скорее всего, об этом спросят на экзамене. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== EXAM AREAS ==============
   The four areas are pulled straight from the sentence Docusign uses to describe the
   exam scope: administrator and user management, bulk actions, sharing and transferring
   ownership, access management and Docusign Monitor. Docusign does NOT publish weights
   for this exam. The percentages below are OUR study allocation and are labeled as such. */
const DOMAIN_INFO = {
  d1:{label:"Зона 1", name:"Организации, администраторы и управление пользователями", weight:30, color:'var(--c-d1)',
      hint:"Создание организации, связывание учетных записей, девять профилей разрешений администратора, страница «Пользователи», членство, группы и лицензии.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=rrf1583359212854&topicId=god1583359152535.html&_LANG=enus',
      docLabel:"Администраторы организации, руководство администратора Документация"},
  d2:{label:"Зона 2", name:"Массовые действия", weight:20, color:'var(--c-d2)',
      hint:"Экспорт списков пользователей, добавление, обновление и закрытие форматов CSV, экспорт и импорт настроек учетной записи, экспорт профилей разрешений.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=rrf1583359212854&topicId=eec1583359153905.html&_LANG=enus',
      docLabel:"Массовые действия, руководство администратора Документация"},
  d3:{label:"Зона 3", name:"Совместное использование и передача права собственности", weight:20, color:'var(--c-d3)',
      hint:"Разрешения и даты общего доступа, общие конверты в режиме обслуживания, правила передачи конвертов, ограничения и журналы.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=rrf1583359212854&topicId=pea1583359198663.html&_LANG=enus',
      docLabel:"Обзор передачи конвертов, руководство администратора Документация"},
  d4:{label:"Зона 4", name:"Управление доступом и Документ-монитор", weight:30, color:'var(--c-d4)',
      hint:"Заявленные домены, поставщики удостоверений, политики входа, своевременная подготовка, подключенные приложения, оповещения монитора, пороговые значения и экспорт CSV.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=gso1581445176035&topicId=pmk1581445325570.html&_LANG=enus',
      docLabel:"Защитите развертывание Документация с помощью Документ-монитор"}
};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:"Организации, администраторы и управление пользователями",
    must:[
      `<strong>Организация — это уровень над учетными записями.</strong> Это позволяет одной группе администраторов управлять пользователями и настройками для многих учетных записей Документация из одного места. Почти каждый неправильный ответ на этом экзамене является ответом на уровне учетной записи на вопрос уровня организации.`,
      `<strong>Для создания организации нужны две вещи</strong>: вы должны быть администратором учетной записи с <em>Все возможности администрирования</em>, и для учетной записи должна быть включена поддержка Документация администратора. Если вы не видите <em>Начать</em> раздел, учетная запись не активирована, и это звонок в службу поддержки.`,
      `<strong>Учетная запись, из которой вы создаете организацию, становится учетной записью по умолчанию.</strong>, и вы автоматически становитесь администратором организации. Учетная запись по умолчанию — это то, что используется при своевременной подготовке при появлении нового пользователя.`,
      `<strong>Учетную запись по умолчанию невозможно отсоединить.</strong> Вы можете изменить связанную учетную запись по умолчанию, но никогда не сможете отменить связь с текущей.`,
      `<strong>Привязка учетной записи имеет три требования</strong>: ты держишь <em>Администратор</em> профиль разрешений в организации, вы являетесь администратором учетной записи со всеми возможностями администрирования для этой учетной записи, и эта учетная запись еще не связана с другим местом. Учетная запись одновременно принадлежит одной организации.`,
      `<strong>Учетные записи внешних доменов приглашаются, но не связываются.</strong> Это учетные записи электронной подписи, в которых хранятся пользователи, чья электронная почта находится в заявленном вами домене. Приглашения отправляются в <strong>пять последних активных администраторов учетных записей</strong>, которые принимают или отказываются, а отказ требует причины.`,
      `<strong>В каждой организации есть хотя бы один администратор организации.</strong>, и по умолчанию его создал администратор электронной подписи. Компания Документация рекомендует иметь <strong>по крайней мере два</strong> для преемственности.`,
      `<strong>Существует девять профилей разрешений администратора.</strong> <em>Администратор</em> это полный контроль. Остальные восемь делегированы: администратор подключения, администратор пользователей, администратор пользователей с ограниченным доступом, администратор настроек, администратор нотариусов, администратор отчетов о продуктах, администратор отчетов безопасности и администратор устройств безопасности.`,
      `<strong>Изучите три, которые сдают экзамен.</strong> <em>Администратор пользователей</em> управляет только пользователями. <em>Администратор настроек</em> управляет только учетными записями и настройками учетных записей, включая привязку и отмену привязки. <em>Администратор отчетов безопасности</em> получает Документ-монитор и ничего больше.`,
      `<strong>У администратора пользователей есть потолок.</strong> Они могут добавлять, редактировать и закрывать любого пользователя, не являющегося администратором, и могут применять только профили разрешений неадминистратора. Они не могут назначать или изменять профиль разрешений администратора, а также не могут добавлять, редактировать или закрывать других администраторов Документ.`,
      `<strong>Администратор пользователей — ограниченный доступ — это та же работа для именованных учетных записей.</strong> Вы выбираете, в каких учетных записях делегированный администратор может управлять пользователями, и больше он ничего не получает.`,
      `<strong>Меню навигации сообщает вам профиль.</strong> Админ все видит. Администратор пользователей видит пользователей, учетные записи и массовые действия. Администратор настроек видит учетные записи и массовые действия. Администратор отчетов о продуктах видит массовые действия. Администратор отчетов безопасности видит Документ-монитор.`,
      `<strong>Только администратор и администратор пользователей могут закрывать пользователей.</strong> в том смысле, в котором показано в таблице профилей: близкие пользователи — это строка, доступная только администратору, в то время как оба могут просматривать, добавлять и редактировать пользователей, не являющихся администраторами.`,
      `<strong>Добавление администратора — это приглашение, а не переключение.</strong> Вы добавляете их из <em>Пользователи</em>, <em>Администраторы</em> вкладка, затем <em>Добавить администратора</em>. Они приземляются как <strong>в ожидании</strong> и должен активировать членство по электронной почте, прежде чем что-нибудь произойдет.`,
      `<strong>Ожидающее приглашение не может быть отредактировано.</strong> <em>Редактировать</em> показывает только имя и профиль. Чтобы изменить любой из них, удалите приглашение и снова добавьте пользователя.`,
      `<strong>Страница «Пользователи» имеет две категории.</strong>: <em>Пользователи учетной записи</em>, которые являются участниками связанных учетных записей, и <em>пользователи домена</em>, которые владеют какой-либо учетной записью Документация в домене, на который вы заявили права. Пользователи домена являются причиной того, что домен так важен.`,
      `<strong>Некоторые элементы управления существуют только для пользователей домена.</strong> Редактирование адреса электронной почты, настройка политики входа, ручная активация ожидающих членства и подключенных приложений для каждого пользователя — это функции пользователя домена. На обычном аккаунте пользователя их нет.`,
      `<strong>Изменения профиля разветвляются, а изменения членства — нет.</strong> Изменение адреса пользователя, должности и номера телефона в организации распространяется на все его учетные записи. Администратор учетной записи может изменить только одно членство и вообще не может трогать детали профиля.`,
      `<strong>Группы живут в настройках организации после задействования CLM.</strong> Учетная запись CLM должна управлять группами в Документация администратора. Учетная запись только для электронной подписи может управлять ими в любом месте. Группа, созданная для учетной записи с поддержкой CLM, отображается как в электронная подпись, так и в Администратор CLM.`,
      `<strong>Каждый пользователь автоматически попадает в группу «Все».</strong>, и ни один пользователь не может быть удален из списка «Все» или из списка «Администраторы».`,
      `<strong>Лицензии предоставляются одного типа на человека.</strong> В планах IAM пользователь может иметь только один тип лицензии для каждой учетной записи. Добавьте их с бесплатной лицензией, если у них уже есть полная, и они получат полную лицензию. Бесплатные лицензии не ограничены и не учитываются в платном пуле.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Администратор организации означает администратор учетных записей». Это не так. Администратор организации с профилем администратора контролирует единый вход, домены и всех пользователей в связанных учетных записях, не обладая правами на эти учетные записи. Чтобы также управлять самой учетной записью, им необходимо <em>Все возможности администрирования</em> на этот счет. Именно поэтому для привязки аккаунта нужны обе шапки сразу.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="padding:5px 11px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b>Организация</b></span>
      <span style="color:var(--dim)">держит →</span>
      <span style="padding:5px 11px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Связанный аккаунт</span>
      <span style="padding:5px 11px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Связанный аккаунт</span>
      <span style="padding:5px 11px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Связанный аккаунт</span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Одна из них — учетная запись по умолчанию. Его нельзя отсоединить, и при своевременной подготовке к нему добавляются новые пользователи.</div>`},

  {key:'d2', title:"Массовые действия: экспорт, импорт и форматы CSV.",
    must:[
      `<strong>Массовые действия доступны в организации в разделе Массовые действия.</strong>, и эта функция поставляется с <em>Управление организацией</em> добавить. У администраторов отдельных учетных записей есть отдельная функция «Массовые действия пользователей», что является классическим неправильным ответом.`,
      `<strong>Есть четыре плитки</strong>: ПОЛЬЗОВАТЕЛИ, АККАУНТЫ, ПРОФИЛИ РАЗРЕШЕНИЙ и вкладка «Активность», на которой отслеживается каждое задание. Каждый экспорт и импорт отслеживаются из Активность с помощью значка обновления и <em>Вид</em> затем <em>Скачать</em> шаг в конце.`,
      `<strong>Одновременно может выполняться только один экспорт или импорт.</strong> Начни секунду и подожди.`,
      `<strong>Хранение и сохранение.</strong> В общей сложности организация владеет <code>100</code> экспорт пользователей и экспорт настроек учетной записи, сохраняются для <code>90</code> дни. Вы можете удалить их вручную с помощью <em>Удалить экспорт</em>.`,
      `<strong>Три типа экспорта пользователей</strong>: <em>Пользователи и членство</em> (все во всех связанных аккаунтах), <em>пользователи домена</em> (данные профиля, учетная запись по умолчанию, политика входа и последний вход в систему) и <em>Пользователи внешнего домена</em> (пользователи домена, сидящие в учетных записях вне организации).`,
      `<strong>Отсутствие заявленного домена означает один тип экспорта.</strong> Организации без заявленного домена видят только <em>Пользователи и членство</em>. Два из трех экспортов существуют из-за заявки на домен.`,
      `<strong>Кто может экспортировать пользователей.</strong> Профили администратора и пользователей. Экспорт и импорт настроек учетной записи принадлежат Администратору и Администратору настроек.`,
      `<strong>Добавить пользователей в формате CSV, пять обязательных столбцов.</strong>: <code>AccountID</code>, <code>FirstName</code>, <code>LastName</code>, <code>UserEmail</code>, <code>eSignPermissionProfile</code>. Все остальное не является обязательным.`,
      `<strong>Обновить пользователей и закрыть пользователей — это другое трио.</strong>: <code>AccountID</code>, <code>APIUserName</code>, <code>UserEmail</code>. В тот момент, когда в вопросе упоминается существующий пользователь, <code>APIUserName</code> есть в ответе.`,
      `<strong>Идентификатор аккаунта — это 32-значный идентификатор учетной записи API.</strong>, находится в разделе «Приложения и ключи» учетной записи. Не имя счета и не номер счета, который вы видите в счете. Для CSV-файла близких пользователей: <code>AccountID</code> также должно быть <strong>первый столбец</strong>.`,
      `<strong>Правила заголовка.</strong> Заголовки не чувствительны к регистру и, за исключением первого столбца «Закрыть пользователей» и импорта настроек учетной записи, они не обязательно должны располагаться в указанном порядке. Текст все равно должен точно совпадать.`,
      `<strong>Столбцы имен имеют либо или.</strong> Использовать <code>FirstName</code>плюс<code>LastName</code>или используйте <code>UserName</code>. Поместите и то, и другое. <code>UserName</code> побеждает.`,
      `<strong>Колонны CLM перемещаются парами.</strong> <code>EnableCLM</code> для установки в TRUE требуется <code>CLMPermissionProfile</code>, а для назначения профиля CLM требуется <code>EnableCLM</code>. Одно без другого — ловушка.`,
      `<strong>Группа против групп — это настоящее различие.</strong> Единственное число <code>Group</code> только добавляет одну группу на столбец, а повторяющиеся столбцы добавляют больше. Множественное число <code>Groups</code> добавляет и удаляет, переписывая весь список в одной ячейке как <code>[Группа 1],[Группа2]</code>. Если появляются оба, единственное число <code>Group</code> столбец выигрывает и <code>Groups</code> игнорируется.`,
      `<strong>Для изменения адреса электронной почты требуется отдельный столбец.</strong> <code>UserEmail</code> идентифицирует пользователя и <code>UpdatedUserEmail</code> несет новый адрес. Перезапись <code>UserEmail</code> никого не переименовывает.`,
      `<strong>Политика входа принимает три значения</strong>: <code>None</code>, <code>FedAuthRequired</code> (необходимо использовать поставщика удостоверений) и <code>FedAuthBypass</code> (поставщик удостоверений или учетные данные Документация). Это применимо только при наличии зарезервированного домена и единого входа.`,
      `<strong>Массовое добавление только добавляет и массовое обновление только обновлений.</strong> Изменения существующих пользователей в файле добавления игнорируются. Новые пользователи в файле обновления не создаются. Коды доступа вообще нельзя использовать с действием массового добавления.`,
      `<strong>Две точные цифры по импорту.</strong>Импорт настроек учетной записи охватывает до <code>40</code> счета одновременно. Закрытие пользователей внешнего домена достигает максимума в <code>2,000</code> пользователей на сайт, на CSV.`,
      `<strong>Импорт настроек учетной записи — импорт с фиксированным порядком столбцов.</strong>: <code>Category</code>, <code>Key</code>, затем столбец для каждой учетной записи, каждый из которых начинается с имени учетной записи с идентификатором учетной записи и средой (демо или рабочая) под ним. Начнём с экспорта, потому что планы разные.`,
      `<strong>Экспорт профилей разрешений доступен только для чтения и доступен для всей организации.</strong> Он возвращает идентификатор и имя учетной записи, имя и идентификатор профиля, дату последнего изменения, количество пользователей, владеющих каждым профилем, а также список привилегий и значений. Два столбца намеренно отсутствуют по сравнению с экспортом на уровне аккаунта: <em>Разрешить автоматическую пометку</em> и <em>Включить предложение ключевых терминов по типу документа</em>.`,
      `<strong>Закрытие пользователей имеет побочный эффект для подписывающей группы.</strong>тот<em>Удаление пользователей из подписывающих групп</em> поле выбрано по умолчанию. Очистите его, и закрытые пользователи продолжат получать уведомления о группах подписи, пока вы не отредактируете группы вручную.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Один шаблон CSV охватывает объемную работу». Есть четыре разные формы, и экзамен выбирает одну из них. Добавить желания <code>eSignPermissionProfile</code> и имена. Обновить и закрыть желание <code>APIUserName</code>. Требуется импорт настроек учетной записи <code>Category</code> и <code>Key</code> в установленном порядке. Всегда загружайте шаблон из диалогового окна, в котором вы на самом деле находитесь.`,
    viz:`<div style="display:grid;gap:6px;font-size:12.5px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><b>Добавить пользователей</b> <span style="color:var(--dim)">Идентификатор учетной записи · Имя · Фамилия · Электронная почта пользователя · eSignPermissionProfile</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><b>Обновить пользователей</b> <span style="color:var(--dim)">AccountID · APIUserName · UserEmail</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><b>Закрыть пользователей</b> <span style="color:var(--dim)">Идентификатор аккаунта (первый столбец) · Имя пользователя API · электронная почта пользователя</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><b>Импорт настроек учетной записи</b> <span style="color:var(--dim)">Категория · Ключ · один столбец на аккаунт, по порядку</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Только обязательные столбцы. Все остальное не является обязательным.</div>`},

  {key:'d3', title:"Совместное использование и передача права собственности",
    must:[
      `<strong>Делиться и передавать — противоположности.</strong> Совместное использование позволяет второму пользователю работать с конвертами, которые все еще принадлежат первому. При передаче права собственности перемещаются, поэтому конверты полностью покидают исходную учетную запись.`,
      `<strong>Совместный доступ — это текущая функция.</strong> Администратор открывает <em>Пользователи</em>, находит человека, затем <em>Действия</em> и <em>Управление общим доступом</em>. Общие конверты, старая функция, находятся в режиме обслуживания и больше не обновляются.`,
      `<strong>Общий доступ имеет три уровня разрешений, и они суммируются.</strong> <em>Управлять от имени</em> это просмотр, просмотр истории, загрузка и перемещение по папкам. <em>Редактировать от имени</em> добавляет правильно, повторно отправить и аннулировать. <em>Отправить от имени</em> добавляет отправку и редактирование черновиков поверх обоих.`,
      `<strong>Отсутствие разрешения на отправку означает только управление.</strong> Пользователю, который не может отправлять конверты, может быть предоставлен только уровень управления чужим конвертом.`,
      `<strong>Общий доступ устарел.</strong> Дата начала — сегодня или любая дата в будущем. Дата окончания не является обязательной, и если вы ее установите, срок действия доступа истечет сам по себе, без каких-либо действий вручную. Оставьте это поле пустым, и доступ будет действовать до тех пор, пока кто-нибудь его не удалит.`,
      `<strong>Три жестких ограничения на общий доступ.</strong> Вы можете выбрать до <code>100</code> пользователей одновременно. Совместное использование осуществляется от пользователя к пользователю и <strong>никогда в группу</strong>. Оба человека должны быть на одной учетной записи.`,
      `<strong>Неактивные и ожидающие пользователи исключены.</strong> Им не может быть предоставлен общий доступ, а их конверты нельзя передать кому-либо еще.`,
      `<strong>Для закрытого пользователя доля не является инструментом.</strong> Сначала передайте их конверты себе или другому активному пользователю, а затем работайте с ними.`,
      `<strong>Изменения общего доступа проверяются.</strong> В журнале аудита фиксируются все изменения с полями <em>Пользователь Агента</em> (человек, действующий в интересах кого-то другого), <em>ПринципалПользователь</em> (человек, от имени которого действовал), <em>Разрешение</em> (Отправить или управлять) и <em>Ид авторизации пользователя</em>.`,
      `<strong>Право собственности принадлежит отправителю.</strong> Пользователи владеют конвертами, которые они отправляют. Полученные конверты принадлежат отправителю и не подлежат передаче получателю.`,
      `<strong>Передача конвертов находится в представлении организации.</strong> и является частью дополнения «Управление организацией». Если его нет в меню, Документация необходимо включить его для вашей организации.`,
      `<strong>Два правила определяют, возможен ли вообще трансфер.</strong> Обе учетные записи должны быть связаны с вашей организацией и обе должны находиться в одной среде сайта Документация, например от NA1 до NA1. Вы не можете перенести NA1 в NA2.`,
      `<strong>Вам потребуются все возможности администрирования в исходной учетной записи.</strong> На странице «Передача конвертов» перечислены только учетные записи, на которых вы их храните.`,
      `<strong>Любые передачи статусов, кроме Черновика.</strong> Черновые конверты не могут быть переданы. Потолок <code>2,000</code> подходящие конверты одновременно.`,
      `<strong>Передача является полной, а не копией.</strong> Элементы удаляются от первоначального владельца и добавляются к новому владельцу. В истории сохраняются все действия первоначального отправителя и сохраняется <em>Передача права собственности на конверт</em> запись с указанием нового владельца.`,
      `<strong>Два способа запустить его.</strong> <em>Перевести сейчас</em> фильтрует и отмечает конверты на экране. <em>Перенос с использованием CSV</em> загружает файл с идентификаторами конвертов, все из одной исходной учетной записи, и все они переходят к одному новому владельцу.`,
      `<strong>Создайте CSV из загрузки.</strong> Отфильтруйте список, выберите <em>Скачать CSV-файл</em>, затем разденьте его обратно на <code>EnvelopeId</code> столбец перед загрузкой. Информация о получателе и настраиваемые поля полезны для выбора, а не для передачи.`,
      `<strong>Только маршрут CSV предлагает бесплатную копию.</strong> <em>Добавить первоначального владельца в качестве точной копии</em> — это флажок в диалоговом окне «Передача с использованием CSV».`,
      `<strong>Массовая отправка имеет одну загвоздку.</strong> Передача конвертов, отправленных посредством массовой рассылки, невозможна, если у принимающего владельца нет разрешения на массовую отправку. Ошибка читается <code>cannot_copy_bulksend_list</code>.`,
      `<strong>Каждое задание попадает в журналы передачи конвертов.</strong>, сохраненный для учетной записи, из которой он поступил, со столбцом «Состояние», обновлением для заданий в очереди, представлением подробностей и загружаемым CSV-файлом с идентификаторами конвертов с результатом каждой строки.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Совместный доступ и передача конвертов — это одно и то же». Это разные уровни продукта. Совместный доступ — это инструмент на уровне учетной записи между двумя пользователями одной учетной записи с датами и ограничением выбора в 100 пользователей. Передача конвертов — это инструмент на уровне организации, который позволяет передавать право собственности между учетными записями. Количество конвертов ограничено 2000, блокируется на разных сайтах и ​​блокируется для черновиков.`,
    viz:`<div style="display:grid;gap:6px;font-size:12.5px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Общий доступ</b> <span style="color:var(--dim)">тот же аккаунт · конверты остаются у владельца · даты начала и окончания</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Передача конвертов</b> <span style="color:var(--dim)">между связанными аккаунтами, одним и тем же сайтом · смена владельца · никаких черновиков</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Сначала задайте один вопрос: будет ли он по-прежнему принадлежать первоначальному владельцу после этого?</div>`},

  {key:'d4', title:"Управление доступом и Документ-монитор",
    must:[
      `<strong>Заявка на домен является основой.</strong> Заявите права на домен электронной почты и подтвердите его, и вы сможете управлять каждым пользователем в этом домене в каждой связанной учетной записи, ограничивать личные регистрации в Документация и предоставлять административное согласие для подключенных приложений.`,
      `<strong>Домен принадлежит ровно одной организации.</strong> После утверждения и проверки ни одна другая организация не сможет претендовать на это. Одна и та же организация может претендовать на это как в демо, так и в производстве.`,
      `<strong>Проверка представляет собой запись DNS, и Документация рекомендует использовать CNAME вместо TXT.</strong> Хост CNAME — это 32-значный GUID, указывающий на <code>verifydomain.docusign.net.</code>, включая конечную точку. Форма TXT <code>документация=</code> плюс тот же GUID.`,
      `<strong>Токен должен оставаться в DNS навсегда.</strong> Документация периодически перепроверяет запись. Удалите его, и вы нарушите доступ своих пользователей. Разрешить до <strong>72 часа</strong> для распространения DNS и проверьте с помощью <em>Действия</em> затем <em>Проверьте DNS</em>, который меняет статус на Активный.`,
      `<strong>Политика входа имеет три параметра.</strong> Никто, <em>FedAuthRequired</em> (только поставщик удостоверений) и <em>Обход FedAuth</em> (поставщик удостоверений или учетные данные Документация). Политика для каждого пользователя намеренно переопределяет политику домена, поэтому Документация называет ее исключением, а не стандартом.`,
      `<strong>Держите одну обходную учетную запись.</strong> Обычной причиной является администратор, которому приходится исправлять конфигурацию единого входа, когда поставщик удостоверений не работает, а также пользователи интеграции в приложениях, которые не поддерживают единый вход.`,
      `<strong>При своевременной подготовке пользователь создается при первом входе в систему.</strong> Если электронная почта зарезервированного домена входит в систему и не найдена ни в одной учетной записи организации, создается пользователь, обычно в учетной записи организации по умолчанию с профилем разрешений по умолчанию.`,
      `<strong>JIT имеет базовую и расширенную формы.</strong> Базовый использует учетную запись по умолчанию и профиль по умолчанию. Расширенные этапы предоставляют детали подготовки в утверждении SAML, чтобы направить пользователя на определенную учетную запись и профиль.`,
      `<strong>JIT включен по умолчанию</strong> и выключается переключателем на <em>Поставщики удостоверений</em> страница. Отключение убивает оба потока, а не только расширенный.`,
      `<strong>Федеративный идентификатор — это уникальный идентификатор поставщика удостоверений.</strong> для пользователя, записанного в профиле безопасности пользователя. Если поставщик удостоверений меняет его, пользователь блокируется до тех пор, пока администратор не очистит сохраненное значение, после чего новое значение запишется при следующем входе в систему.`,
      `<strong>Подключенные приложения авторизуются для всех пользователей домена одновременно.</strong>, ограниченный указанными вами разрешениями, и прежде чем вы сможете это сделать, вы должны заявить права на домен. Авторизация для каждого пользователя существует только для пользователей домена.`,
      `<strong>Блокировка личных аккаунтов — это шапка прокси, а не настройка.</strong> Ваш прокси-инжект <code>X-Docusign-Allow-Organization</code> с идентификатором вашей организации, а демо-идентификаторы и рабочие идентификаторы различаются, поэтому укажите оба. Вы найдете идентификатор на странице «Функции» в разделе <em>Детали организации</em>.`,
      `<strong>Монитор является дополнением, доступ осуществляется по профилю.</strong> Только администратор Документация и администратор отчетов безопасности могут получить к нему доступ и управлять им. Вы включаете его в <em>Админ</em>, <em>Организация</em>, <em>Монитор</em>, затем <em>Действия</em> и <em>Давать возможность</em>.`,
      `<strong>Монитор слеп без заявленного домена.</strong> Он отслеживает только активность пользователей, чья электронная почта находится в домене, на который претендует ваша организация. Действия, связанные с учетной записью, такие как отправка конвертов и загрузка документов, по-прежнему фиксируются.`,
      `<strong>Приборная панель – это пять вещей</strong>: информационная панель, исследования пользователей, история предупреждений, список безопасных IP-адресов и настройки. Оповещения включаются и отключаются в настройках, по одному ползунку за раз.`,
      `<strong>Две цифры разделяют издания.</strong> Бесплатная версия Монитор дает <strong>3</strong> оповещения и <strong>12</strong> события с 30-дневным окном. Полный монитор дает <strong>24</strong> оповещения и <strong>106</strong> события с данными за ноябрь 2020 года, а также API, Спланк и историю оповещений. Обеим редакциям необходим заявленный домен.`,
      `<strong>Уровень серьезности оповещений по умолчанию установлен на «Авто».</strong> и может быть установлен на Высокий, Средний или Низкий. Оповещения, которые вы редактируете, также содержат порог события, необязательный список получателей и список пользователей, которым запрещено активировать оповещение.`,
      `<strong>Пороги — это то, что вы настраиваете.</strong> Подсчет оповещений об объеме, например 15 уникальных загрузок конвертов в час. Расстояние в километрах для одновременного оповещения о входе в систему.`,
      `<strong>Список безопасных IP-адресов выдает только одно предупреждение.</strong> Это приводит к <em>IP-адрес вне допустимых диапазонов</em> предупреждение, и если вы не настроите диапазоны, предупреждение никогда не сработает. Диапазоны принимают первый и последний адрес или нотацию CIDR.`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();

function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }

function toggleAllStudy(){

/* ============== EXAM + OPTIONAL TIMER ==============
   The real Pro exam has NO time limit. The timer is an optional pacing drill
   against Docusign's own 30-minute estimate, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

        <div class="start-actions">

        </div>

      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Четыре промаха – это весь бюджет.</strong> Настоящий экзамен — это 20 заданий на 80%, то есть 16 сдаются правильно, а 15 — нет. Один неправильный ответ стоит вам 5 баллов. Ответьте на все. Задание без ответа оценивается так же, как и неправильное.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;

  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();

  const dots = QUESTIONS.map((qq, n) => {

    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен по менеджменту организации${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> из ${total} ответил</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>

      <span class="section-pill" style="color:${d.color}">${d.label}</span>

    </div>

  `;

  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;

      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Вопрос${idx} из ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the Docusign University exam page states 20 items and 80% to pass.
   There is no scaled score, so we report raw percent against that same line. */
const PASS_PCT = 80;
const READY_PCT = 88; // our recommendation, NOT Docusign's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Вдали от линии 80%, есть свободное место. Забронируйте это.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"За чертой 80%, но тонкий. Закройте самое слабое место, а затем забронируйте его.", tone:'warn'};
  if(pct >= 65) return {label:"Под чертой, и это цифры, которые вам стоят. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Против настоящего бара: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% нужный</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий экзамен — это 20 заданий, оцениваемых по абсолютному проценту правильных ответов. <strong>80%</strong> проходит, поэтому четыре промаха — это весь бюджет, а один неправильный ответ стоит 5 баллов. Мы предлагаем ${READY_PCT}%+ здесь перед бронированием, просто как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаткие, и при 80% пройти это дорого. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;"> раздел исследования</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Открыть раздел обучения</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleTheme(){

  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('apk-theme', next);
  document.getElementById('themeIcon').innerHTML = "<я данные-ясный=\"" + (next === 'dark' ? 'sun' : 'moon') + '"></i>';
  if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);

}

}

  }
