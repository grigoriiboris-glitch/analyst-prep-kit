],
ESQL:[
 {id:1,q:"Данные зашумлены, но однородны (нет тенденции, нет сезона). Какой простой метод подойдет?",ans:"Простое экспоненциальное сглаживание",choices:["Простое экспоненциальное сглаживание","Holt-Winters","Линейная регрессия на 5 драйверах","АРИМА(2,1,2)"],hint:"Плоский уровень → сгладить только уровень."},
 {id:2,q:"Данные имеют устойчивую тенденцию к росту И ежегодные сезонные колебания. Лучший метод?",ans:"Holt-Winters",choices:["Holt-Winters","Простая скользящая средняя","Простое экспоненциальное сглаживание","Одно среднее"],hint:"Тренд + сезон → тройное сглаживание."},
 {id:3,q:"Вам нужна предельно простая базовая линия для сравнения с любой другой моделью. Используйте ___.",ans:"Скользящее среднее",choices:["Скользящее среднее","SARIMA","Нейронная сеть","Holt-Winters"],hint:"Эталонные модели должны превзойти."},
 {id:4,q:"Вы можете прогнозировать продажи, исходя из цены и расходов на рекламу, которые известны заранее. Какой подход?",ans:"Регрессия на драйверах",choices:["Регрессия на драйверах","Простое экспоненциальное сглаживание","Только сезонный индекс","ARIMA"],hint:"Прогноз на основе переменных-предикторов."},
 {id:5,q:"Индекс 4 квартала – 1,3; десезонный тренд говорит о 200. Сезонный прогноз — ___.",ans:"260",choices:["260","200","154","1.3"],hint:"Умножьте тренд на индекс: 200 × 1,3."},
 {id:6,q:"Вам нужен показатель ошибок, который позволит сравнивать точность продуктов самых разных размеров.",ans:"MAPE",choices:["MAPE","MAE","RMSE","Р²"],hint:"Процентная ошибка не имеет единиц измерения."},
 {id:7,q:"Что вы называете сдерживанием последних данных, их прогнозированием и продвижением раскола вперед?",ans:"Backtesting",choices:["Backtesting","Smoothing","Deseasonalizing","Differencing"],hint:"Тестируйте на многих окнах."},
 {id:8,q:"Колебания продаж становятся БОЛЬШЕ по мере роста общего уровня. Какая сезонная модель?",ans:"Multiplicative",choices:["Multiplicative","Additive","Linear","Stationary"],hint:"Качайте весы с уровнем → умножайте."},
 {id:9,q:"Ряд должен иметь постоянное среднее значение и дисперсию во времени для частей Р/О СЛЕВА. Это имущество ___.",ans:"Stationarity",choices:["Stationarity","Seasonality","Correlation","Skew"],hint:"Различение «Я» помогает достичь этого."},
 {id:10,q:"Ваша модель имеет почти нулевую ошибку в обучающих данных, но большие ошибки в тестовом наборе. Что происходит?",ans:"Overfitting",choices:["Overfitting","Underfitting","Идеальное прогнозирование","Seasonality"],hint:"Оно запомнило шум."},
 {id:11,q:"Заинтересованная сторона хочет получить «цифру» дохода через 3 года. Лучший ответ?",ans:"Укажите диапазон и обратите внимание, что неопределенность растет с горизонтом.",choices:["Укажите диапазон и обратите внимание, что неопределенность растет с горизонтом.","Назовите одну точную цифру","Отказаться от прогноза","Дайте прошлогодний номер"],hint:"Длинный горизонт = широкий веер."},
 {id:12,q:"Какое семейство функций Excel реализует экспоненциальное сглаживание для прогнозирования?",ans:"FORECAST.ETS",choices:["FORECAST.ETS","VLOOKUP","SUMIFS","CONCAT"],hint:"ETS = ошибка/тренд/сезон (семейство Холта-Уинтерса)."}
],
BUGS:[
 {id:1,config:"Метод: простая линейная линия тренда.\nДанные: ежемесячные продажи, пик которых явно приходится на декабрь.\nРезультат: прогноз проходит сквозь сезонные пики и спады.",broken:"Простой тренд игнорирует сезон — он ошибается почти каждый месяц. Вы должны смоделировать сезонность (например, сезонные индексы или Холта-Уинтерса).",choices:["Добавьте сезонный компонент (сезонные индексы или индексы Холта-Уинтерса)","Используйте более крупный шрифт на диаграмме","Переключить линию на гистограмму","Удалить точки данных за декабрь"]},
 {id:2,config:"Отчет: «Выручка в следующем квартале составит 1 283 402 доллара».\nДиапазон не указан.",broken:"Одно точное число подразумевает уверенность, которой никогда не было в прогнозе. Представьте интервал прогнозирования и предположения.",choices:["Представьте диапазон (интервал прогнозирования) с точечной оценкой.","Округлите до $1 283 400.","Добавьте больше десятичных знаков для точности","Выделите число жирным шрифтом"]},
 {id:3,config:"Оценка: подгонка модели в январе–декабре, точность также измерена в январе–декабре.\nСообщенная ошибка: почти ноль.",broken:"Подбор и градация одних и тех же данных льстит модели — ошибка, близкая к нулю, скрывает переобучение. Используйте набор тестов на устойчивость.",choices:["Оставьте недавние данные в качестве тестового набора и оцените их.","Доверьтесь околонулевой ошибке","Подходит для еще большего количества тех же данных","Сообщить об ошибке с точностью до десятичных знаков"]},
 {id:4,config:"Метод: простое экспоненциальное сглаживание (только уровень)\nДанные: продажи стабильно растут ~5% в месяц.\nРезультат: прогноз стабильно ниже фактического",broken:"У Простой RU нет термина тренда, поэтому он отстает от восходящего ряда и занижает прогнозы. Используйте метод Холта (тренд) или Холта-Винтерса.",choices:["Используйте метод с термином тренда (Холта/Холта-Уинтерса).","Поднимите альфу ровно до 1,0.","Переключиться на круговую диаграмму","Вместо этого прогнозируйте среднее значение"]},
 {id:5,config:"Настройка интервала: 95%-ный интервал прогнозирования нарисован УЗЕ, чем 80%-й интервал.",broken:"Более высокая достоверность требует более широкого интервала — 95 % должно быть шире 80 %. Они перевернуты.",choices:["Сделайте интервал 95 % шире интервала 80 %.","Сделайте оба интервала одинаковой ширины","Удалить интервал 80%","Вместо этого используйте одну строку"]},
 {id:6,config:"Модель: кривая 8-й степени, проходящая через каждую историческую точку.\nПоступают новые данные: прогноз сильно неверен",broken:"Модель запомнила шум (переобучение) — идеально для истории, бесполезно для новых данных. Используйте более простую модель и судите по ошибке удержания.",choices:["Используйте более простую модель и проверяйте на контрольном наборе","Добавьте еще больше членов кривой","Доверьтесь этому, потому что это идеально соответствует прошлому.","Удалить новые данные"]}
],
WRONG:[
 {id:1,q:"Кто-то говорит: «Более сглаживание всегда делает прогноз лучше». Почему это неправильно?",opts:["Сглаживание никогда ничего не меняет","Чрезмерное сглаживание тормозит и сглаживает реальные изменения, поэтому вы пропустите поворотные моменты, пока не станет слишком поздно.","Сглаживание работает только с сезонными данными.","Сглаживание увеличивает шум."],ans:1,exp:"Сглаживание — это компромисс, а не бесплатная победа. Слишком много приглушает реальные сдвиги и задерживает их, поэтому четкая линия может незаметно пропустить настоящий поворотный момент. Сопоставьте степень сглаживания с тем, насколько шумными и быстро перемещаются данные."},
 {id:2,q:"Модель имеет R² = 0,98 за последние 3 года. Коллега говорит: «Так что пятилетний прогноз в принципе гарантирован». В чем недостаток?",opts:["R² должно быть отрицательным","Меры R² соответствуют ПРОШЛОМУ; это ничего не говорит о том, продолжится ли тенденция или насколько точным будет будущее.","R² 0,98 невозможен","Вам нужно R² выше 1,0."],ans:1,exp:"R² is goodness of fit on historical data. A great fit can still extrapolate terribly — especially 5 years out, where the trend may not hold and uncertainty compounds. Fit ≠ future accuracy; judge forecasts on holdout error and show the widening interval."},
 {id:3,q:"Ваша команда прогнозирует спрос, но игнорирует повышение цен, которое уже запланировано на следующий квартал. В чем риск?",opts:["Никакого риска — модели справляются со всем","Модель не может предвидеть известные будущие изменения, поэтому прогноз будет необъективным; явно подстроиться под это","Цена никогда не влияет на спрос","Вам следует удалить прошлые данные"],ans:1,exp:"Модель временных рядов знает только закономерности в истории, на которой она обучалась. Известное предстоящее изменение (повышение цен, промо-акция, закрытие магазина) не будет фиксироваться автоматически — вам необходимо скорректировать прогноз или включить драйвер. Игнорирование известных событий – классический промах."},
 {id:4,q:"Прогнозируется два региона; вы хотите сравнить, какой прогноз был точнее, но они продают очень разные объемы. Какая метрика?",opts:["МАЕ, потому что оно в оригинальных единицах","MAPE, поскольку процентная ошибка не имеет единиц измерения и сопоставима в разных масштабах.","RMSE, потому что это всегда лучше","R², потому что это проценты"],ans:1,exp:"MAE и RMSE представлены в собственных единицах измерения данных, поэтому в регионе большого объема будут наблюдаться большие абсолютные ошибки независимо от относительной точности. MAPE выражает ошибку в процентах, что делает ее сопоставимой для серий самых разных масштабов."},
 {id:5,q:"Интервал прогноза имеет ОДНУЮ ширину на следующий месяц и на три года вперед. Почему это подозрительно?",opts:["Интервалы должны сокращаться со временем","Неопределенность усугубляется горизонтом, поэтому интервал должен расширяться еще больше — плоская полоса сигнализирует о чрезмерной самоуверенности.","Интервалы всегда постоянны","Это значит, что модель идеальна."],ans:1,exp:"Чем дальше вы прогнозируете, тем больше ошибок накапливается и тем меньше можно доверять сегодняшним закономерностям — поэтому правильный интервал получается разветвленным. Долгосрочный интервал, столь же узкий, как и краткосрочный, почти всегда означает, что модель занижает свою неопределенность."},
 {id:6,q:"Младший аналитик предпочитает ARIMA скользящему среднему, «потому что оно более продвинутое». Какая аргументация лучше?",opts:["Всегда используйте самую продвинутую модель","Выберите метод, который действительно соответствует данным и превосходит простой базовый показатель по ошибке удержания — часто побеждает более простой метод.","Скользящие средние никогда не действительны","ARIMA всегда точнее"],ans:1,exp:"Утонченность – это не точность. Во многих реальных бизнес-рядах скользящее среднее или экспоненциальное сглаживание соответствует или превосходит ARIMA. Пусть решает ошибка удержания, и платите за сложность (больше данных, настройку, хрупкость) только тогда, когда она оправдает себя."},
 {id:7,q:"Вы представляете руководителям единый прогноз без каких-либо диапазонов или предположений. Что пошло не так?",opts:["Ничего — ясность хорошая","Они относятся к оценке как к обещанию и могут принимать рискованные решения; всегда включайте интервал и предположения","Руководители предпочитают, чтобы диапазоны были скрыты.","Число становится более точным"],ans:1,exp:"Одинокое число читается как обязательство. Без диапазона и лежащих в его основе предположений лица, принимающие решения, не смогут взвесить риск и будут ему чрезмерно доверять. Руководствуйтесь интервалом, формулируйте предположения и скажите, что вы будете вносить изменения по мере поступления новых данных."}
],
PARSONS:[
 {id:1,q:"Упорядочите шаги для прогнозирования сезонного ряда с тенденцией:",ans:["Десезонализация (разделение фактических значений на сезонный индекс)","Сопоставьте и спроецируйте тенденцию на чистые данные","Повторная сезонность (умножьте прогноз тренда на индекс)","Добавить интервал прогнозирования"]},
 {id:2,q:"Упорядочите эти методы от самого простого к самому сложному:",ans:["Простая скользящая средняя","Простое экспоненциальное сглаживание","Холт-Винтерс (тренд + сезон)","ARIMA"]},
 {id:3,q:"Упорядочите шаги, чтобы честно оценить прогноз:",ans:["Разделить историю на обучающий набор и тестовый набор","Подгоните модель только к тренировочному набору","Прогнозирование тестового набора и сравнение с фактическими данными","Вычислить метрику ошибок (МАЭ/МАРЕ/РМСЕ)"]},
 {id:4,q:"Упорядочите компоненты разложенного временного ряда (от самой большой картины к остатку):",ans:["Trend","Seasonality","Cycle","Noise"]},
 {id:5,q:"Упорядочите шаги по передаче прогноза лицу, принимающему решения:",ans:["Ведите вперед с помощью точечного прогноза и его диапазона","Сформулируйте ключевые предположения","Покажите веерную диаграмму (увеличение неопределенности)","Назовите триггеры, которые заставят вас его пересмотреть."]}
],
CARDS:[
 {front:"Forecast",back:"Проекция исторических закономерностей в будущее.\nВсегда ДИАПАЗОН, а не одно число.\nПредполагается, что прошлые модели продолжают сохраняться.\nОшибка растет с горизонтом."},
 {front:"Decomposition",back:"Разбиение серии на части:\nТренд + Сезонность + Цикл + Шум.\nМоделируйте предсказуемые части;\nсмиритесь с шумом, который вы не можете объяснить."},
 {front:"Trend",back:"Долгосрочное направление сериала.\nВверх, вниз или ровно.\nУстойчивый костяк под покачиваниями.\nПодходит для линии или метода сглаживания тренда."},
 {front:"Seasonality",back:"Паттерн, повторяющийся в ФИКСИРОВАННЫЙ период.\nКаждый декабрь, каждую пятницу.\nИзмеряется с помощью сезонных индексов.\nОтличается от цикла (переменная длина)."},
 {front:"Cycle",back:"Более продолжительные и нерегулярные колебания (например, в экономике).\nНЕТ фиксированного периода — в отличие от сезонности.\nМожет длиться 1 год или несколько.\nСезонные модели этого не отражают."},
 {front:"Сигнал против шума",back:"Сигнал = реальный, повторяемый паттерн.\nШум = случайное, непредсказуемое изменение.\nСглаживание разделяет эти два процесса.\nЦель любого моделирования трендов."},
 {front:"Скользящее среднее",back:"Среднее значение за последние к периодов, скользящее вперед.\nОкно к = плавность и отзывчивость.\nОдинаковый вес на всех к периодах.\nВаш простой базовый прогноз."},
 {front:"Экспоненциальное сглаживание",back:"Последние данные имели больший вес; влияние ослабевает.\nновый = α·факт + (1−α)·предыдущий прогноз.\nАльфа (0–1) = шкала реактивности.\nПростой ES не имеет трендового термина."},
 {front:"Альфа(ы)",back:"Коэффициент сглаживания при экспоненциальном сглаживании.\nВысокое α → реагирует быстро (нервно).\nНизкий α → плавный и стабильный (медленный).\nМежду 0 и 1."},
 {front:"линейный тренд",back:"Лучшая прямая линия во времени.\nзначение = точка пересечения + наклон × период.\nНаклон = среднее изменение за период.\nR² = насколько хорошо это соответствует прошлому."},
 {front:"Р²",back:"Доля вариации, которую объясняет модель (0–1).\nКачество FIT на исторических данных.\nВысокий R² ≠ точный прогноз на будущее.\nНе экстраполируйте идеальную посадку слишком далеко."},
 {front:"сезонный индекс",back:"Типичный уровень за период по сравнению со средним.\n1,3 = 30% выше; 0,7 = на 30% ниже.\nИндексы в среднем составляют 1,0 за сезон.\nДесезонализация ÷, ресезонализация ×."},
 {front:"Holt-Winters",back:"Тройное экспоненциальное сглаживание.\nСглаживает уровень (α), тренд (β), сезон (γ).\nРабочая лошадка для анализа трендов и сезонных данных.\nТребуется ≥2 полных сезонных цикла."},
 {front:"ARIMA",back:"Авторегрессионное, интегрированное, скользящее среднее.\nAR = прошлые значения · I = разность · MA = прошлые ошибки.\nНужен стационарный (или разностный) ряд.\nНе автоматически лучше, чем сглаживание."},
 {front:"Stationarity",back:"Постоянное среднее значение и дисперсия во времени.\nЧто требуется для деталей ПРАВЫЙ Р/МА.\n«Я» (различение) помогает достичь этого.\nДанные тренда нестационарны."},
 {front:"Разделение обучения/тестирования",back:"Подходит для тренировочного набора;\nоценка на отложенном тестовом наборе.\nЧестный способ оценить прогноз.\nОшибка внутри выборки всегда выглядит слишком хорошо."},
 {front:"MAE / MAPE / RMSE",back:"MAE: среднее |ошибка|, исходные единицы.\nMAPE: средний % ошибки, без единиц измерения.\nRMSE: ошибки квадратуры → наказывает за большие промахи.\nВыберите тот, который соответствует вашему вопросу."},
 {front:"интервал прогнозирования",back:"Вероятный диапазон вокруг точечного прогноза.\nЗаявлено с уверенностью (80%, 95%).\n95% — это ШИРЕ, чем 80%.\nРасширяется вместе с горизонтом (веерная диаграмма)."},
 {front:"Overfitting",back:"Модель, запоминающая шум.\nОколонулевая ошибка в выборке, плохая на выходе.\nИсправление: упрощенная модель + проверка удержания.\nСамая распространенная ошибка прогнозирования."},
 {front:"Backtesting",back:"Продвигайте разделение поезд/тест вперед с течением времени.\nТестирует прогноз во многих окнах.\nЗащищает от удачного одиночного раскола.\nСтандартная проверка вне выборки."}
],
GLOSSARY:[
 ["Forecast","Проекция исторических закономерностей в будущее, всегда несущая неопределенность, лучше всего выражаемая как диапазон плюс его предположения."],
 ["Временной ряд","Последовательность значений, записанная с течением времени через равные промежутки времени — прогнозирование данных продолжается."],
 ["Decomposition","Разделение временного ряда на тренд, сезонность, цикл и шум, чтобы каждый компонент можно было моделировать отдельно."],
 ["Trend","Долгосрочное направление серии (вверх, вниз или плоское), независимое от краткосрочных колебаний."],
 ["Seasonality","Модель, повторяющаяся в течение фиксированного календарного периода (ежедневно, еженедельно, ежегодно), измеряемого с помощью сезонных индексов."],
 ["Cycle","Более длительные, нерегулярные колебания без фиксированного периода (например, деловые циклы) — в отличие от сезонности с фиксированным периодом."],
 ["Noise","Случайные, непредсказуемые вариации, оставшиеся в ряду после удаления тренда, сезонности и цикла."],
 ["Smoothing","Усреднение близлежащих точек для приглушения шума и выявления основного сигнала; меняет отзывчивость на стабильность."],
 ["Скользящее среднее","Прогноз/сглаживание, которое усредняет последние к периодов и сдвигает окно вперед; общая базовая линия."],
 ["Экспоненциальное сглаживание","Метод, который более взвешивает недавние наблюдения, при этом влияние затухает в геометрической прогрессии; настроенный альфа."],
 ["Альфа(ы)","Коэффициент сглаживания (0–1) при экспоненциальном сглаживании; высокие значения реагируют быстро, низкие значения остаются плавными."],
 ["линейный тренд","Прямолинейная модель во времени (точка + наклон × период); наклон — это среднее изменение за период."],
 ["R-квадрат (R²)","Доля вариации, которую объясняет модель (0–1) — мера соответствия прошлому, а не будущей точности."],
 ["сезонный индекс","Множитель, показывающий типичный уровень за период по сравнению со средним (1,3 = 30% выше); индексы в среднем составляют 1,0."],
 ["Deseasonalize","Разделите фактические данные на сезонный индекс, чтобы выявить основную тенденцию; повторно сезонизировать, умножив его обратно."],
 ["Holt-Winters","Тройное экспоненциальное сглаживание, которое одновременно моделирует уровень, тренд и сезонность — сезонная рабочая лошадка."],
 ["ARIMA","Авторегрессионное интегрированное скользящее среднее — модель, использующая прошлые значения (AR), разность (I) и прошлые ошибки (MA)."],
 ["Stationarity","A property where a series has constant mean and variance over time; required for ARIMA's AR/MA components."],
 ["Разделение обучения/тестирования","Подбор модели на ранних данных (обучение) и ее оценка на скрытых данных (тест) для получения достоверной оценки точности."],
 ["Backtesting","Неоднократное прокручивание разделения поезда/теста вперед для оценки прогноза по многим окнам вне выборки."],
 ["MAE","Средняя абсолютная ошибка — средняя абсолютная разница между прогнозом и фактом в исходных единицах данных."],
 ["MAPE","Средняя абсолютная процентная ошибка — средняя абсолютная ошибка в процентах, без учета единиц измерения, для сравнения между рядами."],
 ["RMSE","Среднеквадратическая ошибка — ошибки возводятся в квадрат перед усреднением, поэтому большие промахи наказываются более строго, чем MAE."],
 ["интервал прогнозирования","Диапазон, в который, вероятно, попадет фактическое будущее при заявленной достоверности; расширяется вместе с горизонтом прогноза."],
 ["Overfitting","Когда модель улавливает шум в исторических данных, почти идеально отражая прошлое, но плохо прогнозируя."]
]
};

function nextLessonId(id){const i=DATA.LESSONS.findIndex(l=>l.id===id);return (i>=0&&i<DATA.LESSONS.length-1)?DATA.LESSONS[i+1].id:null;}

  const l=DATA.LESSONS.find(x=>x.id===id);if(!l)return;

  const q=l.quiz?`<div class="quiz-wrap"><h3>Быстрая проверка</h3><p style="color:var(--text)">${esc(l.quiz.q)}</p>
    <div id="quizOpts">${l.quiz.opts.map((o,i)=>`<button class="quiz-opt" onclick="checkQuiz(${i},${l.quiz.ans},${id})">${esc(o)}</button>`).join('')}</div>
    <div class="quiz-exp" id="quizExp">${esc(l.quiz.exp)}</div></div>`:'';
  document.getElementById('view-lesson').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btn-sm" onclick="navigate('lessons')">← Уроки</button>
      <span style="color:var(--dim);font-size:13px">Lesson ${pos} of ${DATA.LESSONS.length}</span></div>

}
function checkQuiz(i,ans,id){
  const opts=document.querySelectorAll('#quizOpts .quiz-opt');
  opts.forEach(o=>o.onclick=null);
  if(i===ans){opts[i].classList.add('correct');markDone('lesson'+id);celebrate(true,"Правильный! ✨");}
  else{opts[i].classList.add('wrong');opts[ans].classList.add('correct');}
  document.getElementById('quizExp').classList.add('show');
}

// ─── GUIDED PRACTICE (lesson → its drills → next lesson) ──────────────────────
const DRILL_TYPES=[
  {key:'fills',label:"Заполните пробел",icon:'<i data-lucide="pencil"></i>',data:'FILLS'},
  {key:'esql',label:"Выберите метод",icon:'<i data-lucide="message-square"></i>',data:'ESQL'},
  {key:'bugs',label:"Исправить прогноз",icon:'<i data-lucide="bug"></i>',data:'BUGS'},
  {key:'wrong',label:"В чем дело?",icon:'<i data-lucide="search"></i>',data:'WRONG'},
  {key:'parsons',label:"Наведите порядок",icon:'<i data-lucide="puzzle"></i>',data:'PARSONS'}
];
let guided=null;let drillState={type:null,idx:null,parsPlaced:[],parsBank:[]};
function startGuided(lessonId){
  const seq=(LESSON_DRILLS[lessonId]||[]).filter(s=>{const dt=DRILL_TYPES.find(d=>d.key===s[0]);return dt&&DATA[dt.data]&&DATA[dt.data][s[1]];});
  if(!seq.length){gotoNext(lessonId);return;}
  guided={lessonId,seq,pos:0};activateView('view-practice');renderGuidedStep();
}
function renderGuidedStep(){
  if(!guided)return;
  const {seq,pos,lessonId}=guided;const step=seq[pos];
  const lesson=DATA.LESSONS.find(l=>l.id===lessonId);const isLast=pos===seq.length-1;
  const dt=DRILL_TYPES.find(d=>d.key===step[0]);const idx=step[1];const item=DATA[dt.data][idx];
  drillState={type:step[0],idx,parsPlaced:[],parsBank:[]};
  const done=S.done[`${step[0]}${idx}`];
  const dots='<div class="dots">'+seq.map((_,i)=>`<span class="dot${i<=pos?' on':''}"></span>`).join('')+'</div>';
  const header=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <button class="btn btn-sm" onclick="${lesson?('openLesson('+lessonId+')'):"navigate('practice')"}">${lesson?"← Вернуться к уроку":"← Вернуться к практике"}</button>
      <span style="color:var(--dim);font-size:13px">${lesson?('Practice '+(pos+1)+'/'+seq.length+' · '+esc(lesson.title)):("Бесплатная практика · "+esc(dt.label)+' '+(pos+1)+'/'+seq.length)}</span></div>${dots}`;
  let body='';
  if(step[0]==='fills')body=renderFill(item,done);
  else if(step[0]==='bugs')body=renderBug(item,done);
  else if(step[0]==='wrong')body=renderWrong(item,done);
  else if(step[0]==='parsons')body=renderParsons(item,done);
  else if(step[0]==='esql')body=renderEsql(item,done);
  const nav=`<div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px">
      <button class="btn" onclick="${pos>0?'guidedPrev()':(lesson?('openLesson('+lessonId+')'):"navigate('practice')")}">${pos>0?'← Back':(lesson?'← Lesson':"← Практика")}</button>
      <button class="btn btn-primary" onclick="guidedNext()">${isLast?(lesson?"Закончить → следующий урок":'Finish'):"Следующее упражнение →"}</button></div>`;
  document.getElementById('view-practice').innerHTML=header+body+nav;
  if(step[0]==='parsons'&&!done)initParsons(item);
  window.scrollTo(0,0);
}
function guidedNext(){if(!guided)return;if(guided.pos<guided.seq.length-1){guided.pos++;renderGuidedStep();}else{const l=guided.lessonId;guided=null;if(l===null){navigate('practice');celebrate(true,"Отлично — набор сверл готов!");}else gotoNext(l);}}
function guidedPrev(){if(guided&&guided.pos>0){guided.pos--;renderGuidedStep();}}
function gotoNext(lid){const n=nextLessonId(lid);if(n!==null)openLesson(n);else{navigate('home');celebrate(true,"🎉Вы прошли каждый урок!");}}

// ─── DRILL: FILLS (tap the choice) ─────────────────────────────────────────────
function renderFill(item,done){
  const correct=item.choices[0];const opts=_shuf(item.choices);
  return `<div class="card"><p class="drill-instruction">${esc(item.q)}</p>
    ${item.partial?`<div class="code-block" style="margin:10px 0">${esc(item.partial).replace('___','<span style="color:var(--accent);font-weight:700">[ ? ]</span>')}</div>`:''}
    <div id="fillChoices">${opts.map(c=>`<button class="fill-choice${done&&c===correct?' correct':''}" onclick="pickFill(this)" ${done?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    <div id="fillFb" style="margin-top:10px;${done?'':'display:none'}">${done?`<span style="color:var(--success)">✓ ${esc(item.hint)}</span>`:''}</div></div>`;
}
function pickFill(btn){
  const item=DATA.FILLS[drillState.idx];const fb=document.getElementById('fillFb');
  if(btn.textContent.trim()===item.choices[0].trim()){
    btn.classList.add('correct');document.querySelectorAll('#fillChoices .fill-choice').forEach(b=>b.disabled=true);
    fb.innerHTML=`<span style="color:var(--success)">✓ ${esc(item.hint)}</span>`;fb.style.display='block';
    markDone('fills'+drillState.idx);celebrate(true,"Правильный! ✨");
  }else{btn.classList.add('wrong');btn.disabled=true;fb.innerHTML=`<span style="color:var(--err)">Не совсем — попробуйте другой.</span>`;fb.style.display='block';}
}
function _shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ─── DRILL: ESQL (Name That Chart) ─────────────────────────────────────────────
function renderEsql(item,done){
  const correct=item.choices?item.choices[0]:item.ans;const opts=_shuf(item.choices||[item.ans]);
  return `<div class="card"><p class="drill-instruction">${esc(item.q)}</p>
    <div id="esqlChoices">${opts.map(c=>`<button class="fill-choice${done&&c===correct?' correct':''}" onclick="pickEsql(this)" ${done?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    <div id="esqlFb" style="margin-top:10px;${done?'':'display:none'}">${done?`<span style="color:var(--success)">✓ ${esc(item.hint||'')}</span>`:''}</div></div>`;
}
function pickEsql(btn){
  const item=DATA.ESQL[drillState.idx];const fb=document.getElementById('esqlFb');const correct=item.choices?item.choices[0]:item.ans;
  if(btn.textContent.trim()===correct.trim()){
    btn.classList.add('correct');document.querySelectorAll('#esqlChoices .fill-choice').forEach(b=>b.disabled=true);
    fb.innerHTML=`<span style="color:var(--success)">✓ ${esc(item.hint||'')}</span>`;fb.style.display='block';
    markDone('esql'+drillState.idx);celebrate(true,"Правильный! ✨");
  }else{btn.classList.add('wrong');btn.disabled=true;fb.innerHTML=`<span style="color:var(--err)">Не совсем — попробуйте другой.</span>`;fb.style.display='block';}
}

// ─── DRILL: BUGS (Fix the Chart) ───────────────────────────────────────────────
function renderBug(item,done){
  const correct=item.choices[0];const opts=_shuf(item.choices);
  return `<div class="card"><p class="drill-instruction">Эта настройка диаграммы не работает. Нажмите правильное исправление:</p>
    <div class="code-block" style="margin:10px 0">${esc(item.config)}</div>
    <div id="bugChoices">${opts.map(c=>`<button class="fill-choice${done&&c===correct?' correct':''}" onclick="pickBug(this)" ${done?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    <div id="bugFb" style="margin-top:10px;${done?'':'display:none'}">${done?`<span style="color:var(--success)">✓ ${esc(item.broken)}</span>`:''}</div></div>`;

function renderParsons(item,done){

    <div id="parsFb" style="margin-top:10px;display:none"></div></div>`;
}
function initParsons(item){drillState.parsBank=item.ans.map((_,i)=>i).sort(()=>Math.random()-0.5);drillState.parsPlaced=[];renderParsonsUI(item);}
function renderParsonsUI(item){
  const bank=document.getElementById('parsBank'),placed=document.getElementById('parsPlaced');if(!bank||!placed)return;
  bank.innerHTML=drillState.parsBank.map(i=>`<div class="pars-piece" draggable="true" data-idx="${i}" data-from="bank" ondragstart="parsMove(event)">${esc(item.ans[i])}</div>`).join('');
  placed.innerHTML=drillState.parsPlaced.map(i=>`<div class="pars-piece placed" draggable="true" data-idx="${i}" data-from="placed" ondragstart="parsMove(event)">${esc(item.ans[i])}</div>`).join('');
  [bank,placed].forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.style.outline="2пикселей пунктирная переменная (--акцент)";};
    z.ondragleave=()=>{z.style.outline='';};
    z.ondrop=e=>{e.preventDefault();z.style.outline='';
      const idx=parseInt(e.dataTransfer.getData('idx'));const from=e.dataTransfer.getData('from');const to=z.id==='parsBank'?'bank':'placed';
      if(from===to)return;
      if(from==='bank'){drillState.parsBank=drillState.parsBank.filter(x=>x!==idx);drillState.parsPlaced.push(idx);}
      else{drillState.parsPlaced=drillState.parsPlaced.filter(x=>x!==idx);drillState.parsBank.push(idx);}
      renderParsonsUI(DATA.PARSONS[drillState.idx]);};
  });
}
function parsMove(e){e.dataTransfer.setData('idx',e.target.dataset.idx);e.dataTransfer.setData('from',e.target.dataset.from);}
function resetParsons(){initParsons(DATA.PARSONS[drillState.idx]);}
function checkParsons(){
  const item=DATA.PARSONS[drillState.idx];const fb=document.getElementById('parsFb');
  const ok=drillState.parsPlaced.join(',')===item.ans.map((_,i)=>i).join(',');
  if(ok){fb.innerHTML=`<span style="color:var(--success)">✓ Идеальный порядок!</span>`;fb.style.display='block';markDone('parsons'+drillState.idx);celebrate(true,"Решено! 🧩");}
  else{fb.innerHTML=`<span style="color:var(--err)">Не совсем — продолжайте договариваться.</span>`;fb.style.display='block';}
}
