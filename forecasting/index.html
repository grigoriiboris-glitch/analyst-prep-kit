/* GRAIN design system. The kit's own semantic vars are re-pointed onto Grain

:root{
  --bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--accent:var(--clay-400);--accent2:var(--clay-300);
  --text:var(--stone-50);--dim:var(--stone-300);--border:var(--stone-700);--success:var(--leaf-400);--err:var(--rust-400);
  --warn:var(--amber-300);--radius:8px;--font:var(--font-sans);--mono:var(--font-mono);
}
[data-theme="light"]{
  --bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--accent:var(--clay-500);--accent2:var(--clay-600);
  --text:var(--stone-900);--dim:var(--stone-600);--border:var(--stone-200);--success:var(--leaf-500);--err:var(--rust-500);--warn:var(--amber-600);
}

code,.mono{font-family:var(--mono)}
nav{background:var(--surf);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:4px;height:56px;position:sticky;top:0;z-index:100;flex-wrap:wrap}

@media(max-width:640px){
  .drill-instruction{position:sticky;top:56px;z-index:90;background:var(--surf);padding:10px 0 9px;border-bottom:1px solid var(--border,var(--bord))}
}
.nav-logo{font-weight:700;font-size:14px;margin-right:12px;color:var(--text);padding-right:12px;border-right:1px solid var(--border);white-space:nowrap;display:inline-flex;align-items:center;gap:9px}

.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.theme-btn,.settings-btn{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;padding:4px 10px;border-radius:6px;font-size:13px;font-family:var(--font)}
.theme-btn:hover,.settings-btn:hover{color:var(--text);border-color:var(--accent)}
.view{display:none;max-width:900px;margin:0 auto;padding:28px 20px}

.tag.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
h2{font-size:19px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:600;margin-bottom:8px}
p{line-height:1.6;color:var(--dim);margin-bottom:10px}
p strong{color:var(--text)}
.lead{color:var(--text);font-size:15px}
.btn{display:inline-block;padding:9px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-family:var(--font);font-weight:600;transition:.15s;background:var(--surf2);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

.path-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s}
.path-tile:hover{border-color:var(--accent);transform:translateY(-1px)}

.path-tile .count{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text)}
.path-tile .sub{font-size:12px;color:var(--dim);margin-top:2px}
.prog-bar{height:4px;background:var(--surf2);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.ral-block{background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.ral-title{font-family:var(--mono);font-size:13px;margin-bottom:10px;padding:8px 12px;background:var(--bg);border-radius:4px;border-left:3px solid var(--accent);line-height:1.6;font-weight:600}
.ral-say{font-size:14px;font-style:italic;color:var(--text);background:var(--bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:9px 13px;margin-bottom:12px;line-height:1.55}

.ral-desc{color:var(--text)}
.gotcha{background:var(--surf2);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13.5px;color:var(--text)}
.gotcha strong{color:var(--warn)}
.viz-cap{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.quiz-wrap{background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:18px}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:11px 16px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);transition:.15s}
.quiz-opt:hover{border-color:var(--accent)}

.quiz-exp.show{display:block}
.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surf);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:.15s}

.lesson-num.done{background:var(--accent);color:#fff}

.code-block{font-family:var(--mono);font-size:13px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:14px 16px;white-space:pre-wrap;line-height:1.6;color:var(--text)}

.drill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.drill-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;text-align:center}
.drill-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.drill-tile .icon{font-size:1.5rem;margin-bottom:6px}
.drill-tile .icon .lucide{width:26px;height:26px;color:var(--accent)}

.fc-outer{perspective:1000px;height:210px;margin:18px 0;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.5s;border-radius:var(--radius)}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;border:1px solid var(--border);background:var(--surf)}
.fc-back{background:var(--surf2);border-color:var(--accent);transform:rotateY(180deg);white-space:pre-line;font-size:.95rem;color:var(--text);line-height:1.7}
.fc-term{font-size:1.2rem;font-weight:700}
.gloss-search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:11px 14px;color:var(--text);font:inherit;font-size:14px;outline:none;margin-bottom:14px}
.gloss-search:focus{border-color:var(--accent)}
.gloss-item{border-bottom:1px solid var(--border);padding:13px 0}
.gloss-item:last-child{border:none}

.gloss-def{font-size:13px;color:var(--dim)}
.kit-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.kit-link{padding:8px 14px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--dim);transition:.15s}
.kit-link:hover{border-color:var(--accent);color:var(--accent)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:14px;z-index:1000;transition:.35s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.dots{margin-bottom:16px}
.dot{width:22px;height:6px;border-radius:3px;display:inline-block;background:var(--surf2);margin-right:5px}
.dot.on{background:var(--accent)}
@media(max-width:600px){.path-grid,.drill-grid{grid-template-columns:1fr 1fr}.ral-chunk{min-width:120px}}
.signin-btn{background:var(--accent);border:1px solid var(--accent);color:#fff;cursor:pointer;padding:5px 12px;border-radius:6px;font:600 12px var(--font-sans,var(--font,system-ui));white-space:nowrap}
.signin-btn:hover{opacity:.85}
.signin-btn.ghost{background:transparent;color:var(--dim);border-color:var(--line,var(--border))}
.signin-btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.user-email{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
</style>

<script>

const DATA = {
LESSONS:[
 {id:101,unit:"Глава 0: Фундаменты",title:"Что такое прогнозирование (и чем оно не является)",sub:"Экстраполяция закономерностей — с искренней неопределённостью.",core:true,
  story:"Ваш менеджер спрашивает: «Какие продажи будут в следующем квартале?» Вы не можете знать будущее, но можете прочитать закономерности прошлого и спроецировать их вперед, четко заявив, насколько вы уверены в себе. Это и есть прогнозирование: не хрустальный шар, а дисциплинированная экстраполяция закономерностей плюс честный диапазон ошибок. Примите это правильное мышление, и все остальное в этом наборе — это техника.",
  intro:"Прогноз берет исторические данные, находит <strong>узоры</strong> в нем (тренд, сезонность, уровень) и проецирует их на будущее. В основе каждого метода лежат две истины: будущее похоже на прошлое. <em>только до тех пор, пока сохраняются закономерности</em>, и каждый прогноз <strong>диапазон, а не одно число</strong>. Прогноз без заявленной неопределенности — это предположение в костюме.",
  ral:[
   {title:"Что такое прогноз на самом деле",say:"Вы не предсказываете будущее — вы расширяете закономерности, которые можно измерить, и говорите, насколько широки полосы ошибок.",
    lines:[
     ["Прогноз","проекция исторических закономерностей в будущее"],
     ["Предположение","шаблоны, которые существовали в прошлом, продолжают сохраняться"],
     ["Неопределённость","каждый прогноз — это диапазон — заявите об этом, не скрывайте"],
     ["Горизонт","насколько далеко вперед вы прогнозируете — ошибка растет с расстоянием"]
    ]},
   {title:"Чем НЕ является прогнозирование",say:"Он не видит потрясений, которых никогда не видел, а точные цифры не являются достоверными.",
    lines:[
     ["Не хрустальный шар","он не может предвидеть новый продукт, пандемию, изменение политики"],
     ["Не точно","«1 283 402 доллара» подразумевает ложную точность — укажите диапазон."],
     ["Не поставил и забыл","перепроверяйте его по мере поступления новых данных; шаблоны дрейфуют"]
    ]}
  ],
  notes:"Самая распространенная ошибка новичков — представление одного прогнозного числа без диапазона. В тот момент, когда вы это делаете, люди воспринимают это как обещание. Всегда сочетайте точечный прогноз с интервалом и лежащими в его основе предположениями.",
  viz:{html:`<h3 style="margin-bottom:10px">Прогноз — история, продолжение тренда и диапазон неопределённости</h3>
   <svg viewBox="0 0 320 130" width="100%" height="140" style="max-width:400px">

    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-dasharray="5 4" points="160,60 310,45"/>
    <text x="60" y="20" fill="var(--dim)" font-size="11">history</text>
    <text x="225" y="20" fill="var(--dim)" font-size="11">forecast + range</text>
   </svg>`,caption:"Сплошная линия = история, которую вы измерили. Пунктирная линия = прогнозируемый прогноз. Заштрихованный веер = диапазон неопределенности, который расширяется по мере дальнейшего продвижения. Прогноз — это все три вместе, а не только пунктирная линия."},
  quiz:{q:"Что самое важное следует включить в любой точечный прогноз?",opts:["Шрифт покрупнее, чтобы он выделялся","Диапазон/интервал, показывающий неопределенность","Точная цифра в долларах","3D-диаграмма"],ans:1,exp:"Прогноз — это проекция закономерностей, поэтому он всегда несет в себе неопределенность. Сочетание точечного прогноза с диапазоном (и изложение ваших предположений) не позволяет людям воспринимать оценку как обещание. Одно точное число скрывает риск."}
 },
 {id:102,unit:"Глава 0: Фундаменты",title:"Анатомия временного ряда",sub:"Тенденция, сезонность, цикл и шум.",core:true,
  story:"Прежде чем прогнозировать одно число, вы должны увидеть, из чего состоит временной ряд. Практически любой ряд — продажи, трафик, температура — можно разделить на несколько строительных блоков: долгосрочный тренд, повторяющаяся сезонная закономерность, более медленные циклы и случайный шум. Как только вы сможете назвать эти части на диаграмме, выбор правильного метода станет очевидным.",
  intro:"<strong>Разложение</strong> разбивает временной ряд на компоненты: <strong>Тренд</strong> (долгосрочное направление), <strong>Сезонность</strong> (повторяющийся шаблон с фиксированным периодом — ежедневно, еженедельно, ежегодно), <strong>Цикл</strong> (более длительные, нерегулярные колебания, как в экономике), и <strong>Шум</strong> (случайный остаток). Хороший прогноз моделирует те части, которые он может объяснить, и принимает шум, который не может объяснить.",
  ral:[
   {title:"Четыре компонента",say:"Прочтите серию, задав вопрос: куда она движется, что повторяется в календаре, что медленно движется, а что просто случайно?",
    lines:[
     ["Тренд","долгосрочное направление — вверх, вниз или плоское"],
     ["Сезонность","повторяющийся шаблон с ФИКСИРОВАННЫМ периодом (например, каждый декабрь)"],
     ["Цикл","более длительные, нерегулярные взлеты и падения (деловые циклы) — без фиксированного периода"],
     ["Шум","случайная вариация, оставшаяся после удаления остальных"]
    ]},
   {title:"Сезонность против цикла",say:"Сезонность сохраняет фиксированный календарный период; цикл нет. Их смешение приводит к неправильной модели.",
    lines:[
     ["Сезонность","фиксированный период — мороженое каждое лето, распродажа каждую пятницу"],
     ["Цикл","переменная продолжительность — рецессия может длиться 1 год или 4 года."],
     ["Зачем это нужно","сезонные методы предполагают фиксированный период; циклы им не подходят"]
    ]}
  ],
  notes:"Не путайте сезонность с циклом. Сезонность повторяется по фиксированному календарю (каждый четвертый квартал); цикл (как и экономика) колеблется в течение многих лет и не имеет фиксированной продолжительности. Сезонные модели работают только с моделями с фиксированным периодом.",
  viz:{html:`<h3 style="margin-bottom:10px">Ряд данных = тренд + сезонность + случайные колебания</h3>
   <svg viewBox="0 0 320 130" width="100%" height="140" style="max-width:400px">
    <line x1="10" y1="115" x2="310" y2="115" stroke="var(--border)"/>
    <line x1="10" y1="100" x2="310" y2="35" stroke="var(--dim)" stroke-dasharray="4 4"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="10,96 30,70 50,92 70,66 90,88 110,60 130,84 150,54 170,80 190,48 210,74 230,42 250,70 270,38 290,66 310,32"/>
    <text x="120" y="22" fill="var(--dim)" font-size="11">тренд (пунктир) + повторяющийся сезон + шум</text>
   </svg>`,caption:"Пунктирная линия — основной восходящий тренд; колебания вокруг него — это повторяющаяся сезонная закономерность плюс случайный шум. Декомпозиция — это процесс их разделения, чтобы вы могли моделировать каждую из них и прогнозировать предсказуемые части."},
  quiz:{q:"Продажи растут каждый декабрь и падают каждый январь, год за годом. Какой это компонент?",opts:["Тренд","Сезонность","Шум","Цикл"],ans:1,exp:"Закономерность, повторяющаяся в течение фиксированного календарного периода (каждый декабрь), называется сезонностью. Тренд – это долгосрочное направление; цикл колеблется в течение переменных многолетних периодов; шум — это случайный остаток. Осознание этого указывает на метод сезонного прогнозирования."}
 },
 {id:103,unit:"Глава 0: Фундаменты",title:"Сигнал против шума",sub:"Почему сглаживание раскрывает структуру, лежащую под ней.",core:true,
  story:"Необработанные данные нестабильны. Внутри этой нервозности скрывается настоящая закономерность — сигнал, погребенный под случайным шумом. Все искусство моделирования трендов состоит в том, чтобы разделить эти два фактора: сгладить шум настолько, чтобы увидеть сигнал, и не сглаживать настолько сильно, чтобы стереть реальные изменения. Это интуиция, лежащая в основе каждого метода в модуле 1.",
  intro:"Каждое измерение смешивает <strong>Сигнал</strong> (реальный базовый паттерн) с <strong>Шум</strong> (случайное колебание). <strong>Сглаживание</strong> усредняет близлежащие точки, чтобы приглушить шум и раскрыть сигнал. Искусство — это компромисс: слишком мало сглаживания — и вы гонитесь за шумом; слишком много, и вы отстанете или сгладите настоящий сдвиг. Не существует единого «правильного» количества — это зависит от того, насколько зашумлены ваши данные и насколько быстро они меняются.",
  ral:[
   {title:"Основной компромисс",say:"Сглаживание — это баланс между отзывчивостью и стабильностью. Включите громкость для спокойствия и уменьшите для быстрой реакции.",
    lines:[
     ["Сигнал","реальная, повторяемая модель, которую вы хотите спрогнозировать"],
     ["Шум","случайная вариация, не имеющая прогностической ценности"],
     ["Сглаживание","усреднение близлежащих точек для приглушения шума"],
     ["Слишком мало","вы реагируете на каждый случайный сигнал (шум переоснащения)"],
     ["Слишком","вы отстаете от реальных изменений и сглаживаете шаблон"]
    ]},
   {title:"Сколько разглаживать",say:"Универсальной настройки не существует — настраивайте шкалу в зависимости от того, насколько шумно и быстро движется ваша серия.",
    lines:[
     ["Шумные данные","→ больше сглаживания, чтобы видеть сквозь статику"],
     ["Быстро меняющиеся данные","→ меньше сглаживания, чтобы не лагать"],
     ["Всегда проверяйте здравомыслие","нанесите сглаженную линию на необработанную — отслеживается ли она?"]
    ]}
  ],
  notes:"Большее сглаживание не означает «лучше». Из-за чрезмерного сглаживания прогноз выглядит чистым, но при этом незаметно отстает от реальных поворотных моментов — вы слишком поздно обнаруживаете, что спрос уже изменился. Всегда накладывайте сглаженную линию на необработанные данные, чтобы оценить ее.",
  viz:{html:`<h3 style="margin-bottom:10px">Исходные колебания и сглаженный сигнал</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:400px">
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
    <polyline fill="none" stroke="var(--dim)" stroke-width="1.5" opacity="0.7" points="10,80 30,55 50,88 70,50 90,75 110,48 130,82 150,40 170,70 190,44 210,66 230,36 250,60 270,40 290,52 310,30"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="3" points="10,78 40,70 70,66 100,62 130,58 160,52 190,48 220,44 250,42 280,38 310,34"/>
    <text x="120" y="20" fill="var(--dim)" font-size="11">серый = необработанный · синий = сглаженный</text>
   </svg>`,caption:"Серая линия — необработанные, зашумленные данные; синяя линия сглаживает ее, показывая устойчивый восходящий сигнал. Сглаживание меняет небольшую отзывчивость на более четкое представление о реальном тренде под статикой."},
  quiz:{q:"Каков риск слишком агрессивного сглаживания временного ряда?",opts:["Диаграмма становится слишком красочной","Он отстает и сглаживает реальные изменения, скрывая поворотные моменты.","Это всегда делает прогноз более точным.","Это полностью устраняет эту тенденцию по закону."],ans:1,exp:"Тяжелое сглаживание приглушает шум, но также приглушает и задерживает реальные сдвиги. В конечном итоге вы можете получить чистую на вид линию, которая слишком поздно отреагирует на реальные изменения. Сглаживание — это компромисс между стабильностью и оперативностью, а не принцип «чем больше, тем лучше»."}
 },
 {id:1,unit:"Глава 1: Тренд и сглаживание",title:"Скользящие средние",sub:"Простейшее сглаживание — и ваш базовый прогноз.",core:true,
  story:"Первая настоящая техника, к которой вы будете постоянно обращаться: скользящая средняя. Усредните последние несколько периодов, сдвиньте окно вперед и повторите. Он сглаживает шум и дает предельно простой прогноз: следующий период — среднее значение за недавний период. Это также твой <em>Базовый уровень</em>: любая более сложная модель должна превзойти скользящее среднее, чтобы добиться своей сложности.",
  intro:"A <strong>простая скользящая средняя (SMA)</strong> заменяет каждую точку средним значением последней <em>k</em> периоды. <strong>размер окна К</strong> это циферблат: маленькое окошко реагирует быстро, но остается дергающимся; большое окно плавное, но лагает. В качестве прогноза SMA просто переносит последние средние значения вперед. Он одинаково обрабатывает каждый период в окне — его главное ограничение.",
  ral:[
   {title:"Как работает скользящая средняя",say:"Усредните последние к периодов, а затем перемещайте окно вперед на один шаг вперед.",
    lines:[
     ["Возьмите последние к значений","собрать (собрать) к самых последних периодов — к — окно, которое вы выбираете"],
     ["Сложите их, разделите на к","усредните их: (40 + 50 + 60) ÷ 3 = 50, среднее за 3 периода."],
     ["Сдвиньте окно вперед","удалить самое старое значение, добавить самое новое, снова усреднить"],
     ["Прогноз = последнее среднее значение","перенести (продлить) самое последнее среднее значение вперед как номер следующего периода"],
     ["Базовый уровень","простой эталон, который должна превзойти каждая более модная модель"]
    ]},
   {title:"Ограничение равного веса",say:"SMA рассматривает точку, полученную к периодов назад, точно так же, как вчерашнюю, что редко бывает реалистичным.",
    lines:[
     ["Равный вес","каждый период в окне считается одинаковым"],
     ["Проблема","старые данные не должны иметь такого большого значения, как недавние данные"],
     ["Исправить предварительный просмотр","взвешенное/экспоненциальное сглаживание (следующий урок)"]
    ]}
  ],
  notes:"Скользящее среднее всегда отстает от тренда: когда данные растут, среднее значение находится ниже последнего значения. Чем больше ваше окно, тем больше задержка. Не выбирайте огромное окно только потому, что оно «выглядит более гладким».",
  viz:{html:`<h3 style="margin-bottom:10px">Скользящее среднее за 3 периода</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:400px">
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
    <polyline fill="none" stroke="var(--dim)" stroke-width="1.5" opacity="0.7" points="10,80 45,55 80,85 115,50 150,72 185,46 220,78 255,42 290,60"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="3" points="45,73 80,63 115,69 150,57 185,63 220,55 255,60 290,52"/>
    <text x="100" y="20" fill="var(--dim)" font-size="11">серый = фактический · синий = 3-периодная MA</text>
   </svg>`,caption:"Каждая синяя точка представляет собой среднее значение трех последних серых точек. Линия намного более плавная, чем необработанные данные, и немного отстает — обратите внимание, что она находится ниже пиков. Это отставание — цена сглаживания."},
  quiz:{q:"Вы увеличиваете окно скользящего среднего с 3 периодов до 12. Что происходит?",opts:["Он быстрее реагирует на недавние изменения.","Он становится более плавным, но больше отстает от реальных изменений.","Это полностью удаляет тренд","Это становится экспоненциально более плавным"],ans:1,exp:"Большее окно усредняет больше (более старых) периодов, поэтому линия более плавная, но реагирует медленнее — она больше отстает от поворотных точек. Меньшие окна реагируют быстрее, но остаются более нервными. Размер окна — это компромисс между плавностью и отзывчивостью."}
 },
 {id:2,unit:"Глава 1: Тренд и сглаживание",title:"Экспоненциальное сглаживание",sub:"Последние данные имеют большее значение — взвешивайте их именно так.",core:true,
  story:"Недостаток скользящей средней в том, что последняя неделя и три месяца назад учитываются одинаково. Экспоненциальное сглаживание исправляет эту проблему: оно увеличивает вес последних периодов, при этом влияние плавно затухает по мере продвижения назад. Одна ручка настройки — альфа — контролирует, насколько быстро исчезает прошлое. Это наиболее широко используемый простой метод прогнозирования в бизнесе.",
  intro:"<strong>Экспоненциальное сглаживание</strong> прогнозирует следующее значение как смесь последнего фактического и предыдущего прогноза: <code>новый = α·(последний фактический прогноз) + (1−α)·(предыдущий прогноз)</code>. <strong>коэффициент сглаживания α</strong> (между 0 и 1) определяет, насколько он реактивен: высокое значение α опирается на недавние данные (быстрое, скачкообразное), низкое значение α опирается на историю (плавное, медленное). Старые данные никогда не исчезают полностью — их вес просто уменьшается в геометрической прогрессии.",
  ral:[
   {title:"Идея экспоненциального сглаживания",say:"Каждый новый прогноз подталкивает старый к последнему фактическому. Альфа решает, насколько велик этот толчок.",
    lines:[
     ["новый =","следующий прогноз — ценность, которую вы несете в предстоящий период"],
     ["α · (последний фактический)","возьмите (взвесьте) кусочек того, что только что произошло — α — коэффициент сглаживания 0–1"],
     ["+ (1−α) · (предыдущий прогноз)","добавьте (смешайте) оставшийся вес, примененный к вашему старому прогнозу"],
     ["α = 0,8 (высокий)","0,8 × факт + 0,2 × старый прогноз — реагирует быстро, остается нервным"],
     ["α = 0,2 (низкий)","0,2 × факт + 0,8 × старый прогноз — плавно и стабильно, медленно адаптируется"],
     ["против скользящего среднего","нет жесткого окна отключения — вся история имеет значение, все меньше и меньше"]
    ]},
   {title:"Когда его использовать",say:"Отлично подходит для рядов уровней без сильной тенденции или сезонности. Расширения справляются с этим (следующие уроки).",
    lines:[
     ["Простой RU","лучше всего, когда нет четкой тенденции или сезона — просто уровень"],
     ["метод Холта","добавляет термин тренда (описан позже)"],
     ["Холт-Винтерс","добавляет тренд И сезонность (об этом позже)"]
    ]}
  ],
  notes:"Простое экспоненциальное сглаживание не имеет трендового термина — если ваши данные неуклонно растут, простой ES будет хронически занижать прогноз. Для анализа данных вам понадобится метод Холта (тренд) или Холта-Уинтерса (тренд + сезонность).",
  viz:{html:`<h3 style="margin-bottom:10px">Высокое и низкое значение α</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:400px">
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
    <polyline fill="none" stroke="var(--dim)" stroke-width="1.5" opacity="0.6" points="10,80 45,55 80,85 115,50 150,72 185,46 220,78 255,42 290,60"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="10,80 45,63 80,77 115,61 150,68 185,55 220,70 255,53 290,57"/>
    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-dasharray="5 4" points="10,82 45,78 80,79 115,75 150,75 185,71 220,73 255,68 290,68"/>
    <text x="60" y="20" fill="var(--dim)" font-size="11">сплошной = высокий α (реактивный) · пунктирный = низкий α (гладкий)</text>
   </svg>`,caption:"Обе линии сглаживают серые фактические значения, но линия с высоким значением α (сплошная) точно повторяет выступы, а линия с низким значением α (пунктирная) скользит сквозь них. Альфа — это ваш единственный выбор между быстрой реакцией и сохранением стабильности."},
  quiz:{q:"Что делает ВЫСОКАЯ альфа (близкая к 1) при экспоненциальном сглаживании?",opts:["Полностью игнорирует последние данные","Позволяет прогнозу быстро реагировать на самые последние фактические данные.","Добавляет сезонную составляющую","Гарантирует более точный прогноз"],ans:1,exp:"Альфа — это вес по последнему факту. Высокая альфа во многом опирается на последние данные, поэтому прогноз реагирует быстро (но остается нервным). Низкая альфа опирается на накопленную историю, создавая более плавную и медленную линию. Это регулятор реактивности, а не гарантия точности."}
 },
 {id:3,unit:"Глава 1: Тренд и сглаживание",title:"Подбор линейного тренда",sub:"Прямая линия во времени — наклон, точка пересечения, R².",core:true,
  story:"Когда ряд постоянно растет или падает, вы можете обобщить его прямой линией: линейным трендом. Наклон показывает, насколько он меняется за период; продлите линию, и вы получите быстрый прогноз. R² показывает, насколько хорошо на самом деле подходит линия. Это ваш мост от сглаживания к реальным моделям.",
  intro:"A <strong>линейный тренд</strong> соответствует наилучшей прямой линии ваших данных с течением времени: <code>значение = точка пересечения + наклон × период</code>. <strong>Склон</strong> — среднее изменение за период; тот <strong>перехватывать</strong> это начальный уровень. <strong>Р²</strong> (от 0 до 1) измеряет, какую часть вариаций объясняет линия: высокий R² означает, что точки прилегают к линии, низкий R² означает, что прямая линия является плохим итогом.",
  ral:[
   {title:"Чтение подобранной линии тренда",say:"Наклон — это скорость и направление; R² — насколько доверять линии.",
    lines:[
     ["значение =","установленный уровень серии в любой выбранный вами период"],
     ["перехватывать","начать со значения линии в нулевом периоде — стартовый уровень"],
     ["+ наклон × период","добавьте среднее изменение за период, умноженное на количество прошедших периодов"],
     ["R² (подходит)","доля вариации, которую объясняет линия — 0,9 означает, что точки лежат на линии"],
     ["Прогноз","подставьте (замените) номер будущего периода и считайте значение"]
    ]},
   {title:"Когда прямая линия неверна",say:"Линейный тренд предполагает постоянную скорость изменения. Если данные кривые или имеют сезонность, линия вводит в заблуждение.",
    lines:[
     ["Изогнутый рост","→ линия ниже/перелета; рассмотрим нелинейную модель"],
     ["Сезонность присутствует","→ соответствовать тренду ПОСЛЕ удаления сезона"],
     ["Низкое сопротивление R²","→ строка не является хорошим резюме; не экстраполируй это далеко"]
    ]}
  ],
  notes:"Высокий R² означает, что линия хорошо соответствует прошлому, но НЕ означает, что тренд продолжится. Экстраполяция прямой линии далеко в будущее предполагает, что ничего не изменится, а это именно тот случай, когда прогнозы ошибаются.",
  viz:{html:`<h3 style="margin-bottom:10px">Линейный тренд (R² ≈ 0,9)</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:400px">
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
    ${[[20,92],[55,84],[90,80],[125,70],[160,66],[195,54],[230,50],[265,40],[300,30]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)"/>`).join('')}
    <line x1="15" y1="92" x2="305" y2="32" stroke="var(--accent2)" stroke-width="2.5"/>
    <text x="120" y="20" fill="var(--dim)" font-size="11">точки = фактические данные · линия = подобранный тренд</text>
   </svg>`,caption:"Подогнанная линия — это наилучшее прямолинейное суммирование точек; его наклон представляет собой среднее изменение за период. R² около 0,9 означает, что точки плотно прилегают к линии. Расширьте линию прогноза, но только до тех пор, пока справедливо предположение о прямой линии."},
  quiz:{q:"Линия тренда имеет R² = 0,95. Что это вам говорит?",opts:["Тенденция гарантированно сохранится","Эта строка объясняет 95% прошлых вариаций — она хорошо соответствует истории.","Прогноз будет точным на 95%.","Наклон составляет 0,95 за период."],ans:1,exp:"R² измеряет степень соответствия историческим данным — 0,95 означает, что линия объясняет 95% прошлых изменений. Это ничего не говорит о том, сохранится ли эта тенденция или насколько точными будут будущие прогнозы. Отличное соответствие прошлому все равно может плохо экстраполироваться."}
 },
 {id:4,unit:"Глава 1: Тренд и сглаживание",title:"Сезонность и сезонные индексы",sub:"Измеряем повторяющийся узор и удаляем его.",core:true,
  story:"Большинство бизнес-данных постоянно меняются: пик розничной торговли приходится на декабрь, спортивные залы — на январь, мороженое — летом. Если вы проигнорируете этот ритм, ваш прогноз на полгода будет неверным. Исправление состоит в том, чтобы <em>Мера</em> сезонный характер как набор индексов, затем спрогнозируйте тенденцию и умножьте сезон обратно. Это самый практичный навык в наборе.",
  intro:"A <strong>сезонный индекс</strong> говорит, насколько каждый период обычно превышает или ниже среднего значения — декабрьский показатель 1,4 означает на 40 % выше нормы; Январь на уровне 0,7 означает на 30% ниже. Для прогнозирования: <strong>десезонизировать</strong> (разделите индекс), чтобы увидеть чистый тренд, спроецируйте тренд, затем <strong>ресезонизировать</strong> (умножьте индекс обратно). Индексы в течение сезона должны составлять в среднем 1,0.",
  ral:[
   {title:"Работа с сезонными индексами",say:"Индекс представляет собой мультипликатор в среднем. Удалите его, чтобы смоделировать тенденцию, а затем верните его в прогноз.",
    lines:[
     ["сезонный индекс","множитель в среднем — 1,4 читается как 40% выше нормы, 0,7 — как 30% ниже нормы"],
     ["В среднем до 1,0","на протяжении всего сезона показатели уравновешиваются — встроенная проверка здравомыслия"],
     ["Десезонизация: фактический ÷ индекс","разделить (удалить) сезон: 140 ÷ 1,4 = 100, значение чистого тренда"],
     ["Ресезонизация: тренд × индекс","умножить (отложить назад) сезон: 200×1,3=260, окончательный прогноз"]
    ]},
   {title:"Аддитив против мультипликатива",say:"Сезонные колебания остаются прежними или растут вместе с уровнем? Это выбирает модель.",
    lines:[
     ["Мультипликативный","свинг растет с уровнем (×) — чаще всего встречается в продажах"],
     ["Добавка","свинг - постоянная величина (+) независимо от уровня"],
     ["Расскажи им обособленно","разветвление сезонных пиков → мультипликативный"]
    ]}
  ],
  notes:"Прогнозирование сезонного ряда с помощью простой линии тренда (без сезонной корректировки) является классической ошибкой: оно проходит прямо через пики и впадины и неверно почти каждый период. Всегда четко указывайте сезон.",
  viz:{html:`<h3 style="margin-bottom:10px">Сезонные индексы (среднее = 1,0)</h3>
   <div style="display:flex;align-items:flex-end;gap:6px;height:110px;font-size:10px;text-align:center;color:var(--dim)">
    ${[["Q1",0.8,64],["Q2",1.0,80],["Q3",0.9,72],["Q4",1.3,104]].map(q=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="width:40px;background:${q[1]>=1?'var(--accent)':'var(--accent2)'};height:${q[2]}px;border-radius:3px 3px 0 0"></div>${q[0]}<br><b style="color:var(--text)">${q[1]}</b></div>`).join('')}
    <div style="border-left:2px dashed var(--dim);height:80px;margin:0 6px"></div>
    <div style="align-self:center;font-size:11px">Четвертый квартал составляет 30%<br>выше среднего;<br>Первый квартал оказался на 20% ниже.</div>
   </div>`,caption:"Индекс каждого квартала показывает свой типичный уровень по сравнению со среднегодовым: четвертый квартал на уровне 1,3 — на 30% выше, первый квартал на уровне 0,8 — на 20% ниже. Четыре в среднем составляют 1,0. Спрогнозируйте тенденцию, а затем умножьте ее на это, чтобы вернуть сезон назад."},
  quiz:{q:"Сезонный индекс продукта за четвертый квартал равен 1,3, а ваш прогноз без сезонной тенденции на четвертый квартал составляет 200 единиц. Каков прогноз с учетом сезонных колебаний?",opts:["200 единиц (индекс не применяется)","260 единиц (200 × 1,3)","154 единицы (200 ÷ 1,3)","1,3 единицы"],ans:1,exp:"Повторная сезонность означает умножение прогноза тренда на сезонный индекс: 200 × 1,3 = 260. Индекс 1,3 говорит о том, что четвертый квартал обычно на 30% превышает десезонный уровень, поэтому ваш окончательный прогноз на четвертый квартал составляет 260 единиц."}
 },
 {id:5,unit:"Глава 2: Модели прогнозирования",title:"Регрессия для прогнозирования",sub:"Использование драйверов, а не только времени, для прогнозирования.",
  story:"До сих пор время было единственным фактором. Но иногда будущее зависит от того, что вы можете знать заранее — цена, расходы на маркетинг, погода, день недели. Регрессия позволяет прогнозировать значение по одному или нескольким <em>водитель</em> переменные. Это та же самая идея подгонки линий из урока о тенденциях, обобщенная на реальные предсказатели.",
  intro:"<strong>Регрессионное прогнозирование</strong> моделирует цель как функцию переменных-предикторов: <code>продажи = б0 + б1·цена + б2·расходы на рекламу + …</code>. Каждый <strong>Коэффициент</strong> — это эффект этого драйвера, удерживающий неподвижными другие. Для прогнозирования вы подключаете будущие значения драйверов. Подвох: вы должны <em>знать или предполагать</em> будущие ценности водителей, и отношения должны оставаться стабильными.",
  ral:[
   {title:"Как работает регрессионное прогнозирование",say:"Сопоставьте влияние каждого драйвера с историей, а затем подключите будущие значения драйверов для прогнозирования.",
    lines:[
     ["Предикторы (драйверы)","входные данные, которые, по вашему мнению, способствуют достижению цели (цена, расходы, сезон)"],
     ["Коэффициент","влияние одного драйвера, при этом остальные остаются постоянными"],
     ["Прогноз","подставьте будущие значения драйвера в подобранное уравнение"],
     ["Временной тренд","само время может быть одним из нескольких предсказателей."]
    ]},
   {title:"Уловы",say:"Вы можете спрогнозировать цель только в том случае, если сможете указать движущие силы — и если прошлые отношения все еще сохраняются.",
    lines:[
     ["Нужны будущие водители","неизвестная будущая цена → нет прогноза (или вы предполагаете его)"],
     ["Стабильные отношения","установленные эффекты должны продолжать удерживаться"],
     ["Корреляция ≠ причина","подходящий предиктор не обязательно является причиной"],
     ["Не переусердствуйте","слишком много предикторов → переобучение (Блок 3)"]
    ]}
  ],
  notes:"Регрессия может спрогнозировать цель только настолько далеко вперед, насколько вы можете предоставить движущие силы. Если ключевой фактор (например, рекламный бюджет на следующий квартал) сам по себе неизвестен, вы только что превратили один прогноз в два. Выбирайте водителей, которых вы действительно знаете заранее.",
  viz:{html:`<h3 style="margin-bottom:10px">Продажи и влияющий фактор (расходы на рекламу)</h3>
   <svg viewBox="0 0 300 130" width="100%" height="140" style="max-width:380px">
    <line x1="20" y1="115" x2="290" y2="115" stroke="var(--border)"/>
    <line x1="20" y1="10" x2="20" y2="115" stroke="var(--border)"/>
    ${[[50,100],[80,92],[110,82],[130,86],[160,68],[185,60],[210,52],[240,40],[265,30]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)"/>`).join('')}
    <line x1="40" y1="103" x2="285" y2="28" stroke="var(--accent2)" stroke-width="2.5"/>
    <text x="120" y="20" fill="var(--dim)" font-size="11">соответствовать требованиям, а затем учитывать будущие расходы</text>
   </svg>`,caption:"Регрессия соответствует тому, как движущий фактор (расходы на рекламу, х) соотносится с целью (продажи, й). Для прогнозирования вы указываете будущую стоимость расходов и читаете подобранную линию. Модель хороша настолько, насколько хороши ваши знания об этом будущем водителе."},
  quiz:{q:"Каково ключевое практическое ограничение использования регрессии по движущим переменным для прогнозирования?",opts:["Он может использовать только время в качестве предсказателя.","Вы должны знать или предполагать будущие значения этих драйверов.","Ему никогда не нужны исторические данные","Это всегда переигрывает"],ans:1,exp:"Чтобы спрогнозировать цель, вам необходимо включить будущие значения драйверов. Если движущая сила (например, цена или рекламный бюджет на следующий квартал) сама по себе неизвестна, вы не сможете спрогнозировать ее, не предположив или не спрогнозировав ее. Выбирайте предикторы, которые вы действительно можете знать заранее."}
 },
 {id:6,unit:"Глава 2: Модели прогнозирования",title:"Холт-Уинтерс (Тренд + Сезонность)",sub:"Экспоненциальное сглаживание, которое обрабатывает все сразу.",
  story:"Простое экспоненциальное сглаживание обеспечивает ровный уровень. Реальные данные обычно имеют тенденцию и имеют сезон. Холт-Винтерс — это обновление, которое сглаживает все три параметра — уровень, тренд и сезонность — одновременно, каждый со своим собственным циферблатом. Это рабочая лошадка по умолчанию для сезонного бизнес-прогнозирования, встроенная прямо в Excel, Tableau и Power BI.",
  intro:"<strong>Холт-Винтерс</strong> (тройное экспоненциальное сглаживание) расширяет экспоненциальное сглаживание тремя коэффициентами сглаживания: <strong>α</strong> для уровня, <strong>β</strong> по тренду и <strong>γ</strong> за сезонность. Он обновляет все три по мере поступления новых данных, поэтому отслеживает ряд, который одновременно растет и циклически меняется, без необходимости отдельной десезонализации вручную. Он поставляется с аддитивными и мультипликативными сезонными вкусами.",
  ral:[
   {title:"Три компонента, которые Холт-Винтерс разглаживает",say:"Это экспоненциальное сглаживание, применяемое одновременно к трем вещам — уровню, тренду и сезону — каждый со своим собственным коэффициентом.",
    lines:[
     ["Уровень (α)","текущее базовое значение"],
     ["Тенденция (б)","наклон — насколько быстро меняется уровень"],
     ["Сезонность (γ)","повторяющийся шаблон за период"],
     ["Результат","одна модель, которая прогнозирует тенденции, сезонные данные"]
    ]},
   {title:"Выбирая это",say:"Сопоставьте метод с тем, что на самом деле содержат ваши данные — не платите за компоненты, которые вам не нужны.",
    lines:[
     ["Только уровень","→ простое экспоненциальное сглаживание"],
     ["Уровень + тренд","→ Линейный метод Холта"],
     ["Уровень + тренд + сезон","→ Холт-Винтерс"],
     ["В инструментах","Excel ПРОГНОЗ.ETS, встроенный прогноз Таблица/Power BI использует это семейство"]
    ]}
  ],
  notes:"Холту-Уинтерсу необходимо как минимум два полных сезонных цикла истории, чтобы надежно оценить сезонную структуру, а в идеале — больше. Учитывая ежемесячные данные всего за один год, сезонные оценки шаткие. Не навязывайте слишком мало истории.",
  viz:{html:`<h3 style="margin-bottom:10px">Прогноз с учётом тренда и сезонности</h3>
   <svg viewBox="0 0 320 130" width="100%" height="140" style="max-width:400px">
    <line x1="10" y1="115" x2="310" y2="115" stroke="var(--border)"/>
    <line x1="200" y1="10" x2="200" y2="115" stroke="var(--border)" stroke-dasharray="3 3"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="10,95 35,70 60,98 85,72 110,84 135,58 160,86 185,55"/>
    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-dasharray="5 4" points="185,55 210,78 235,46 260,76 285,40 310,70"/>
    <text x="40" y="22" fill="var(--dim)" font-size="11">history</text>
    <text x="225" y="22" fill="var(--dim)" font-size="11">прогноз HW</text>
   </svg>`,caption:"Холт-Уинтерс включил в прогноз восходящий тренд И повторяющиеся сезонные колебания (пунктир). Он одновременно сглаживает уровень, тренд и сезон — именно поэтому он идеально подходит для данных, которые как растут, так и циклически повторяются."},
  quiz:{q:"Что Холт-Уинтерс добавляет к простому экспоненциальному сглаживанию?",opts:["Ничего — они идентичны","Раздельное сглаживание тренда и сезонности, а не только уровня","Это устраняет необходимость в исторических данных.","Работает только без сезонности"],ans:1,exp:"Простое экспоненциальное сглаживание отслеживает только уровень. Холт-Уинтерс добавляет трендовую составляющую (β) и сезонную составляющую (γ), сглаживая все три сразу. Это позволяет прогнозировать данные, которые одновременно носят трендовый и сезонный характер — обычный реальный случай."}
 },
 {id:7,unit:"Глава 2: Модели прогнозирования",title:"АРИМА в повседневных словах",sub:"Три буквы, демистифицированные.",
  story:"В какой-то момент вы услышите «нам стоит попробовать ARIMA» и почувствуете проблеск страха. Не. ARIMA — это всего лишь три простые идеи, скрепленные вместе: использование прошлых значений, использование прошлых ошибок и дифференциация для устранения тренда. Вам не нужна математика, чтобы знать, что он делает и когда это правильный вызов. Этот урок дает вам это рабочее понимание.",
  intro:"<strong>ARIMA</strong> расшифровывается как авторегрессия (AR), интегрированная (I), скользящая средняя (MA). <strong>AR</strong>: предсказать из прошлого <em>Значения</em>. <strong>I</strong>: <em>разница</em> ряд (вычтите предшествующее значение), чтобы удалить тренд и сделать его стационарным. <strong>MA</strong>: предсказать из прошлого <em>ошибки</em>. Каждая часть имеет порядок (п, д, д). Это гибкая модель для стационарных или разностных рядов, но она требует больше данных и внимания, чем сглаживание.",
  ral:[
   {title:"Три буквы",say:"AR использует данные о том, где вы были, MA использует данные о том, насколько вы ошибались, а я сглаживаю тенденцию, чтобы два других могли работать.",
    lines:[
     ["АР (п)","авторегрессия — использует прошлые ЗНАЧЕНИЯ ряда."],
     ["Идентификатор)","интегрированный — различает данные для устранения тренда (стационарности)"],
     ["МА (д)","скользящее среднее — использует прошлые прогнозы ОШИБКИ"],
     ["Стационарный","постоянное среднее/дисперсия во времени — что нужно ARIMA"]
    ]},
   {title:"Когда подходит ARIMA",say:"Используйте его, когда сглаживания недостаточно и у вас много чистой истории — в противном случае сохраняйте простоту.",
    lines:[
     ["Хорошо для","сложная автокорреляция, которую сглаживатель не может уловить"],
     ["SARIMA","сезонное расширение — добавляет сезонные условия АР/И/МА."],
     ["Потребности","больше данных, стационарность и настройка параметров"],
     ["Не переусердствуйте","скользящее среднее часто соответствует ARIMA в простых рядах"]
    ]}
  ],
  notes:"ARIMA не является автоматически более точным, чем экспоненциальное сглаживание: во многих реальных бизнес-рядах побеждает более простой и сглаживающий метод. Используйте ARIMA, когда структура данных более плавная, чтобы не выглядеть сложной.",
  viz:{html:`<h3 style="margin-bottom:10px">ARIMA простыми словами</h3>
   <div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px">
    ${[["AR","использует прошлое <b>Значения</b> (где был сериал)"],["I","<b>различия</b> данные для удаления тренда"],["MA","использует прошлое <b>ошибки</b> (насколько ошибочными были недавние прогнозы)"]].map(r=>`<div style="display:flex;gap:12px;align-items:center"><span style="width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${r[0]}</span><span style="color:var(--dim)">${r[1]}</span></div>`).join('')}
   </div>`,caption:"ARIMA — это всего лишь объединение этих трех идей: моделирование на основе прошлых значений (AR), сглаживание тренда путем дифференцирования (I) и исправление с использованием прошлых ошибок (MA). Знания того, что делает каждая буква, достаточно, чтобы решить, когда это правильный инструмент."},
  quiz:{q:"Что делает в ARIMA часть «Я» (интегрированная)?",opts:["Добавляет значения в промежуточную сумму","Различает ряд (вычитает предшествующее значение), чтобы удалить тренд и сделать его стационарным.","Автоматически учитывает сезонность","Использует прошлые ошибки прогноза"],ans:1,exp:"Буква «I» различает данные — заменяя каждое значение его изменением по сравнению с предыдущим периодом — чтобы исключить тенденцию и сделать ряд стационарным (стабильное среднее значение/дисперсия). Именно это позволяет частям AR и MA моделировать его. AR использует прошлые ценности; MA использует прошлые ошибки."}
 },
 {id:8,unit:"Блок 3: Оценка и общение",title:"Измерение точности прогнозов",sub:"MAE, MAPE, RMSE — и разделение поезд/тест.",core:true,
  story:"Как узнать, что прогноз хороший? Вы проверяете это на реальности. Дисциплина: сохранять последние данные, прогнозировать их и сравнивать с тем, что произошло на самом деле, используя показатели ошибок. Вот как можно честно выбирать между методами — и как избежать ловушки модели, которая идеально соответствует прошлому, но ужасно предсказывает будущее.",
  intro:"Чтобы судить о прогнозе, измерьте его <strong>ошибка</strong> (факт − прогноз) с метрикой: <strong>MAE</strong> (средняя абсолютная ошибка, в исходных единицах), <strong>MAPE</strong> (средняя абсолютная ошибка в %, без учета единиц измерения для сравнения серий) или <strong>RMSE</strong> (среднеквадратическая ошибка, которая сильнее наказывает за большие промахи). Очень важно оценить <strong>контрольный (тестовый) набор</strong> модель никогда не видела — подгонка и оценка на основе одних и тех же данных подходят каждой модели.",
  ral:[
   {title:"Три показателя повседневных ошибок",say:"Выберите показатель, соответствующий вашему вопросу: абсолютный размер (MAE), процент (MAPE) или чувствительность к большим промахам (RMSE).",
    lines:[
     ["Ошибка = факт – прогноз","вычесть прогноз из того, что произошло на самом деле, по одной ошибке за период"],
     ["MAE","усреднить абсолютные ошибки — типичная ошибка в собственных единицах данных"],
     ["MAPE","разделить каждую |ошибку| по факту, затем по среднему — безразмерный % для сравнения рядов"],
     ["RMSE","ошибки возводить в квадрат, усреднять, искоренять — большие промахи наказываются дополнительно"]
    ]},
   {title:"Обучение/тест — честный тест",say:"Оценивайте данные, которые модель никогда не видела, так же, как вы оцениваете студента на невидимом экзамене, а не за домашнюю работу.",
    lines:[
     ["Тренировочный набор","история, на которой учится модель"],
     ["Тестовый (удерживающий) набор","последние данные скрыты для оценки прогноза"],
     ["Бэктестирование","прокрутите разделение вперед, чтобы протестировать множество окон"],
     ["Почему","ошибка в выборке всегда выглядит слишком хорошо — здесь скрывается переобучение"]
    ]}
  ],
  notes:"Никогда не судите о прогнозе только на основе данных, которым он соответствует. Гибкая модель может запоминать историю (почти нулевая ошибка выборки) и при этом не работать с новыми данными. Ошибка удержания — это число, которое имеет значение.",
  viz:{html:`<h3 style="margin-bottom:10px">Разделение на обучающую и тестовую выборки</h3>
   <div style="display:flex;height:46px;border-radius:6px;overflow:hidden;font-size:12px;color:#fff;margin-bottom:8px">
    <div style="flex:4;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">Обучение (модель учится)</div>
    <div style="flex:1;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center">тест</div>
   </div>
   <div style="font-size:12px;color:var(--dim)">MAE = среднее |фактическое − прогноз| · MAPE = среднее |ошибка| ÷ актуально · RMSE наказывает за большие промахи</div>`,caption:"Подгоните модель к раннему «обучающему» фрагменту, затем спрогнозируйте сдерживаемый «тестовый» фрагмент и сравните с тем, что произошло на самом деле. Ошибка тестового набора — MAE, MAPE или RMSE — является честной мерой точности."},
  quiz:{q:"Почему вы должны оценивать прогноз на контрольном (тестовом) наборе, а не на данных, на которых он был составлен?",opts:["Это быстрее вычислить","Гибкая модель может почти идеально соответствовать обучающим данным, но не работать с новыми данными — об этом свидетельствует только ошибка удержания.","Наборы тестов всегда больше","Ошибка в выборке недопустима"],ans:1,exp:"Подбор и градация одних и тех же данных подходят для любой модели — гибкая модель может запоминать историю и показывать почти нулевую ошибку в выборке, в то же время плохо прогнозируя будущее (переобучение). Удерживающий набор, который модель никогда не видела, дает честную оценку точности."}
 },
 {id:9,unit:"Блок 3: Оценка и общение",title:"Интервалы прогнозирования",sub:"Прогноз — это диапазон, веерная диаграмма.",core:true,
  story:"Вернёмся к истине из первого урока: прогноз — это диапазон, а не число. Интервал прогнозирования делает этот диапазон явным: «мы ожидаем 200 и на 80% уверены, что он окажется между 170 и 240». Вкратце, это фан-чарт: группа, которая расширяется по мере того, как вы смотрите вперед. Демонстрация этого – вот что отличает заслуживающего доверия аналитика от слишком самоуверенного.",
  intro:"A <strong>интервал прогнозирования</strong> — это диапазон, в который вероятно попадет будущее фактическое значение при заявленной достоверности (например, 80% или 95%). Это происходит из-за разброса ошибок модели. Два факта, которые необходимо усвоить: <strong>более высокий уровень достоверности означает более широкий интервал</strong> (95% шире, чем 80%), а интервалы <strong>расширяться вместе с горизонтом</strong> — В следующем месяце это более определенно, чем в следующем году. Картина <strong>веерная диаграмма</strong>.",
  ral:[
   {title:"Чтение интервала прогнозирования",say:"Точечный прогноз – это ваша лучшая догадка; интервал — это то место, где реальность, вероятно, приземлится.",
    lines:[
     ["Точечный прогноз","единственная лучшая оценка — центральная линия"],
     ["интервал прогнозирования","вероятный диапазон вокруг него, при заявленной уверенности"],
     ["Уровень уверенности","80%, 95% — более высокая достоверность → ШИРОКИЙ интервал"],
     ["веерная диаграмма","полоса, которая расширяется по мере расширения горизонта"]
    ]},
   {title:"Почему веер расширяется",say:"Неопределенность усугубляется: каждый шаг вперед добавляет ошибку поверх предыдущей.",
    lines:[
     ["Короткий горизонт","узкая полоса — недавние модели все еще сохраняются"],
     ["Длинный горизонт","широкая полоса — небольшие ошибки усугубляются, закономерности могут смещаться"],
     ["Еда на вынос","доверяйте краткосрочным прогнозам больше, чем долгосрочным"]
    ]}
  ],
  notes:"Интервал 95 % шире, чем интервал 80 %, а не уже — для большей уверенности в том, что вы уловили истинное значение, требуется больше места. Люди часто понимают это наоборот. А подозрительно узкий дальний интервал обычно означает, что модель слишком самоуверенна.",
  viz:{html:`<h3 style="margin-bottom:10px">Чем дальше прогноз, тем шире диапазон неопределённости</h3>
   <svg viewBox="0 0 320 130" width="100%" height="140" style="max-width:400px">
    <line x1="10" y1="115" x2="310" y2="115" stroke="var(--border)"/>
    <line x1="150" y1="10" x2="150" y2="115" stroke="var(--border)" stroke-dasharray="3 3"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="10,95 50,86 90,74 130,66 150,60"/>
    <polygon points="150,60 310,20 310,90 150,60" fill="var(--accent)" opacity="0.12"/>
    <polygon points="150,60 310,38 310,72 150,60" fill="var(--accent)" opacity="0.2"/>
    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-dasharray="5 4" points="150,60 310,40"/>
    <text x="180" y="105" fill="var(--dim)" font-size="10">более широкая полоса = 95% · внутренняя = 80%</text>
   </svg>`,caption:"Пунктирная центральная линия — точечный прогноз; заштрихованные полосы представляют собой интервалы прогнозирования. Более широкая (более светлая) полоса составляет 95 %, внутренняя полоса — 80 % — более высокая достоверность шире. И то, и другое расходится с горизонтом по мере того, как неопределенность усугубляется."},
  quiz:{q:"Что верно в отношении интервалов прогнозирования?",opts:["Интервал 95 % уже интервала 80 %.","Интервал 95 % шире, чем интервал 80 %, и интервалы расширяются по мере дальнейшего прогнозирования.","Интервалы остаются одинаковой ширины на каждом горизонте","Имеет значение только точечный прогноз"],ans:1,exp:"Для большей уверенности требуется больше места, поэтому интервал 95 % ШИРИНЕ, чем интервал 80 %. А поскольку чем дальше вы смотрите вперед, тем больше ошибок, интервалы расходятся по горизонту — краткосрочные прогнозы более точные, чем долгосрочные."}
 },
 {id:10,unit:"Блок 3: Оценка и общение",title:"Распространенные ошибки и распространение прогнозов",sub:"Избегайте ловушек; представьте результат как профессионал.",core:true,
  story:"Последний урок – тот, который защищает вашу репутацию. Большинство неудачных прогнозов не являются экзотикой — это одни и те же ловушки: переоснащение, слишком далекая экстраполяция, игнорирование известных изменений, сокрытие неопределенности. И как только ваш прогноз окажется обоснованным, вам все равно придется сообщить о нем, чтобы лицо, принимающее решения, могло действовать в соответствии с ним. Вот как сделать и то, и другое.",
  intro:"Частые ловушки: <strong>Переобучение</strong> (модель, запоминающая шум), <strong>экстраполяция слишком далеко</strong> (при условии, что сегодняшняя тенденция сохранится навсегда), <strong>игнорирование известных изменений</strong> (повышение цен, которое модель не видит), и <strong>ложная точность</strong> (одно число, без диапазона). Хорошее общение — это обратная сторона: укажите диапазон и ключевые предположения, покажите веерную диаграмму и скажите, что может изменить ваше мнение.",
  ral:[
   {title:"Четыре ловушки, которых следует избегать",say:"Большинство плохих прогнозов терпят неудачу по одной из следующих причин: сверьтесь со списком перед отправкой.",
    lines:[
     ["Переобучение","модель соответствует историческому шуму → отличная в выборке, плохая на выходе"],
     ["Чрезмерная экстраполяция","проецирование тенденции далеко в прошлое, где она может удержаться"],
     ["Игнорирование известных событий","запланированный запуск/изменение цены, которое модель не видит"],
     ["ложная точность","одна цифра, без интервала — подразумевает уверенность, которой вам не хватает"]
    ]},
   {title:"Сообщение прогноза",say:"Предоставьте лицу, принимающему решение, диапазон, предположения и триггеры, которые могут его изменить.",
    lines:[
     ["Лидерство в ассортименте","сначала интервал, а не только номер точки"],
     ["Государственные предположения","«при условии, что цена и промоакции останутся стабильными»"],
     ["Показать веерную диаграмму","сделать растущую неопределенность видимой"],
     ["Назовите триггеры","какая новая информация заставит вас пересмотреть ее"]
    ]}
  ],
  notes:"Самая большая коммуникативная неудача – это представление прогноза как факта. Сопоставьте каждое число с его диапазоном и предположениями и прямо скажите, что вы будете пересматривать его по мере поступления данных. Именно эта честность заставляет людей доверять и следующему прогнозу.",
  viz:{html:`<h3 style="margin-bottom:10px">Переобученная и разумная модель</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:400px">
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
    ${[[20,80],[50,60],[80,82],[110,55],[140,74],[170,50],[200,78],[230,48]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--dim)"/>`).join('')}
    <polyline fill="none" stroke="var(--err)" stroke-width="1.5" points="20,80 50,60 80,82 110,55 140,74 170,50 200,78 230,48"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="3" points="20,76 80,70 140,63 200,57 260,51 310,46"/>
    <text x="70" y="20" fill="var(--dim)" font-size="11">красный = переобучение (преследование шума) · синий = разумная тенденция</text>
   </svg>`,caption:"Красная линия змеится через каждую точку — она запомнила шум и плохо предсказывает будущее. Синяя линия отражает реальную тенденцию и обобщает ее. Более простые и продуманные модели обычно прогнозируют лучше, чем слишком сложные."},
  quiz:{q:"Что наиболее важно сделать при представлении прогноза лицу, принимающему решения?",opts:["Назовите одно точное число, чтобы они не запутались.","Руководствуйтесь диапазоном и предположениями и говорите, что будете вносить изменения по мере поступления данных.","Скройте неуверенность, чтобы они чувствовали себя уверенно","Используйте самую сложную доступную модель"],ans:1,exp:"Прогноз, представленный в виде одного определенного числа, предполагает неверные решения. Управление интервалом прогнозирования, высказывание своих предположений и обязательство вносить изменения по мере поступления новых данных дает честную основу для действий и укрепляет доверие, которое делает ваш следующий прогноз достоверным."}
 }
],
