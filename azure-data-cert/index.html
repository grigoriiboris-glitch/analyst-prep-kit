<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DP-900 Подготовка по основам данных Azure · Подготовительный комплект для аналитика</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/azure-data-cert/">
<meta name="description" content="Подготовка к изучению основ данных Microsoft DP-900 Azure. Подробное учебное пособие по основным концепциям данных, семейству Azure SQL, Cosmos DB и Azure Storage, а также стеку аналитики (Fabric, Databricks, Power BI), а также практический экзамен из 48 вопросов, вес которого соответствует официальному описанию навыков.">
<link rel="stylesheet" href="../assets/grain/grain.css">
<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Small inline viz helpers */
.vz-chip{padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border);font-size:12px;white-space:nowrap}
.vz-arrow{color:var(--dim);font-size:12px}
.vz-card{border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);font-size:13px}
.vz-card b{display:block}
.vz-card span{color:var(--dim);font-size:12px}
.vz-note{color:var(--dim);font-size:12px;margin-top:7px}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>
</head>
<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Вернуться ко всем комплектам">← Все комплекты</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>DP-900 Подготовка к основам данных Azure</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dp900cert';
const EXAM_MINUTES = 45;   // Microsoft: "You will have 45 minutes to complete this assessment."
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Anthropic API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель данных Azure, помогающий сдавать новое исследование по аналитике данных для экзамена Microsoft DP-900 «Основы данных Azure». Этот экзамен охватывает основные понятия данных (структурированные, полуструктурированные и неструктурированные данные, форматы файлов, транзакционные и аналитические рабочие нагрузки, роли данных), реляционные данные в Azure (нормализация, типы операторов SQL, объекты базы данных, семейство Azure SQL, база данных Azure для MySQL и PostgreSQL), нереляционные данные в Azure (хранилища BLOB-объектов, файлов и таблиц, Azure Cosmos DB и ее API), а также аналитические рабочие нагрузки в Azure (прием, хранилища данных, озера и домики у озера, Microsoft Fabric, Azure Databricks, пакетная и потоковая передача, Power BI). Используйте только факты из Microsoft Learn.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, что, скорее всего, об этом спросят на экзамене. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

  d4:{label:"Зона 4", name:"Рабочие нагрузки аналитики в Azure", weight:29, range:"от 25 до 30%", color:'var(--c-d4)',
      hint:"ETL против ELT, склады против озер против озер, Fabric и Databricks, пакетная обработка против потоковой передачи, концентраторы событий и потоковая аналитика, модели и визуальные эффекты Power BI.",

};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:"Основные концепции данных: формы данных, хранилища, рабочие нагрузки, роли.",
    must:[
      `<strong>Три формы данных, а тест — это схема.</strong> <em>Structured</em> данные следуют фиксированной схеме, поэтому каждая запись имеет одни и те же поля. Представьте себе электронную таблицу, в которой каждая строка имеет одинаковые столбцы. Обычно он табличный и находится в реляционных таблицах.`,
      `<strong>Полуструктурированные данные имеют некоторую структуру, но допускают вариации.</strong> между записями. У одного клиента есть два адреса электронной почты, у другого — ни одного. JSON является распространенным примером. Форма изгибается для каждой записи, чего не может сделать фиксированная таблица.`,
      `<strong>Неструктурированные данные вообще не имеют определенной структуры.</strong> Документы, изображения, аудио, видео и двоичные файлы. Microsoft Learn также теперь упоминает <em>векторные данные</em> (встраивания) как растущий тип, используемый помощниками ИИ.`,
      `<strong>Две широкие категории хранилищ данных: хранилища файлов и базы данных.</strong> Файлы хранятся в файловой системе или облачном хранилище. База данных — это специальная система для управления записями данных, а не файлами.`,
      `<strong>Текст с разделителями (CSV, TSV, фиксированная ширина) — удобочитаемый вариант.</strong> для структурированных данных, которые необходимо читать многим приложениям. Поля разделяются запятой или табуляцией, строки заканчиваются на новой строке, а первая строка может содержать имена полей.`,
      `<strong>JSON использует фигурные скобки для объектов и квадратные скобки для коллекций.</strong> Он подходит как для структурированных, так и для полуструктурированных данных, поскольку атрибут сам по себе может быть объектом или списком. XML выполняет аналогичную работу с тегами угловых скобок, но он более многословен и в большинстве случаев заменяется.`,
      `<strong>Паркет столбчатый, Авро – рядный.</strong> Parquet хранит каждый столбец вместе в группах строк с метаданными, поэтому он является фактическим стандартом для озерных домиков и отлично подходит для аналитики. Avro хранит заголовок JSON, а также двоичные блоки целых записей, что удобно для сжатия и перемещения данных по сети.`,
      `<strong>Delta Lake — это паркет плюс журнал транзакций.</strong> Журнал добавляет транзакции ACID, управление версиями и надежные обновления поверх файлов в озере данных. И Microsoft Fabric, и Azure Databricks используют его в качестве стандартного формата.`,
      `<strong>BLOB означает большой двоичный объект.</strong>: необработанный двоичный файл, который приложение должно интерпретировать, например изображения, видео, аудио и документы, специфичные для приложения. Это файловое слово, обозначающее неструктурированные данные.`,
      `<strong>Реляционные базы данных хранят структурированные данные в таблицах с первичными ключами.</strong> Ключ уникально идентифицирует каждую строку и на него ссылаются другие таблицы, что позволяет нормализовать базу данных, чтобы каждый факт сохранялся один раз. Их запрашивает SQL, основанный на стандарте ANSI.`,
      `<strong>Четыре типа нереляционных (NoSQL) баз данных.</strong> <em>Key-value</em>: уникальный ключ и значение любого формата. <em>Document</em>: хранилище ключей и значений, где значением является документ JSON. <em>Семейство колонн</em>: строки и столбцы, столбцы сгруппированы в семейства. <em>Graph</em>: сущности как узлы со ссылками как отношения.`,
      `<strong>OLTP — это действующая система, которая записывает транзакции</strong>: банковский перевод, касса. Он имеет большой объем, оптимизирован как для чтения, так и для записи и построен на операциях CRUD (создание, получение, обновление, удаление). Эти системы запускают бизнес-приложения (LOB).`,
      `<strong>ACID — это обещание, которое дает транзакция OLTP.</strong> <em>Atomicity</em>: все или ничего. <em>Consistency</em>: одно допустимое состояние в другое. <em>Isolation</em>: параллельные транзакции не мешают. <em>Durability</em>: однажды совершенный, он остается зафиксированным, даже если отключится электричество.`,
      `<strong>Аналитическая обработка доступна только для чтения или преимущественно для чтения.</strong> над большими объемами исторических данных или снимков. Общий конвейер: ETL или ELT в озеро данных, загрузка в озеро или хранилище, агрегирование в OLAP или семантическую модель, а затем создание отчета по нему.`,
      `<strong>Озеро данных — это файлы, хранилище данных — реляционное, а озеро — и то, и другое.</strong> Озера собирают большие объемы файловых данных. Хранилища содержат реляционную схему, оптимизированную для чтения. Lakehouses помещают реляционные запросы поверх хранилища озер.`,
      `<strong>Модель OLAP (теперь обычно называемая семантической моделью, исторически кубом) предварительно агрегирует показатели по измерениям.</strong> так что вы можете детализировать данные вверх и вниз, например, продажи по региону, затем по городу, а затем по адресу. Поскольку числа агрегируются, сводные запросы выполняются быстро.`,
      `<strong>Кто где работает</strong>: ученые, работающие с данными, работают с необработанными файлами в озере данных, аналитики данных запрашивают таблицы в хранилище, бизнес-пользователи используют предварительно агрегированную модель в виде отчетов и информационных панелей.`,
      `<strong>Три роли, три предложения.</strong> A <em>Администратор базы данных</em> управляет базами данных: доступность, производительность, резервное копирование, восстановление и доступ к ним. А <em>Дата-инженер</em> строит и контролирует конвейеры, которые принимают, очищают и перемещают данные между системами. А <em>Аналитик данных</em> изучает данные, строит модели и превращает их в отчеты и визуализации для принятия решений.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Полуструктурированный — это просто беспорядок». Это означает, что структура может меняться для каждой записи, а не то, что ее нет. Документ JSON с вложенными объектами хорошо организован, но два документа в одной коллекции могут содержать разные поля. Если вопрос описывает записи с разным количеством телефонных номеров или поля, которые есть только в некоторых записях, то он является полуструктурированным, а не неструктурированным. Неструктурированное зарезервировано для таких вещей, как изображения и аудио, где нет структуры полей.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch">
      <div class="vz-card" style="flex:1;min-width:160px"><b>Structured</b><span>Фиксированная схема, таблицы. Таблицы CSV, SQL.</span></div>
      <div class="vz-card" style="flex:1;min-width:160px"><b>Semi-structured</b><span>Некоторая структура, варьируется в зависимости от записи. JSON, XML.</span></div>
      <div class="vz-card" style="flex:1;min-width:160px"><b>Unstructured</b><span>Нет полевой структуры. Изображения, аудио, видео, PDF-файлы.</span></div>
    </div><div class="vz-note">Спросите: «Все ли записи имеют одинаковые поля?» Да означает структурированный. В основном означает полуструктурированный. Вопрос не относится к средствам неструктурированным.</div>`},

  {key:'d2', title:"Реляционные данные в Azure: нормализация, SQL, объекты, семейство Azure SQL.",
    must:[
      `<strong>Реляционная таблица моделирует одну сущность.</strong> Каждая строка представляет собой один экземпляр (один клиент, один заказ). Каждый столбец представляет собой один атрибут с заданным типом данных. Столбец может иметь значение NULL, если значение отсутствует, если только оно не объявлено NOT NULL.`,
      `<strong>Нормализация в четыре шага</strong>, согласно Microsoft Learn: отделите каждую сущность в отдельную таблицу, отделите каждый атрибут в отдельный столбец, идентифицируйте каждую строку с помощью первичного ключа и свяжите связанные сущности с помощью внешних ключей.`,
      `<strong>Зачем нормализовать: меньше дублирования и больше целостности.</strong> Адрес клиента сохраняется один раз, поэтому его изменение означает изменение одной строки. Каждый столбец содержит один тип данных, поэтому цены должны быть десятичными, а количества — целыми числами.`,
      `<strong>Внешний ключ указывает на первичный ключ другой таблицы.</strong>, а база данных может обеспечить ссылочную целостность: нет заказа для несуществующего клиента. Ключ, составленный из нескольких столбцов, представляет собой <em>composite</em> ключ.`,
      `<strong>DDL определяет структуру</strong>: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>RENAME</code>. При удалении таблицы теряются все ее строки. В DDL речь идет о форме объектов, а не о строках внутри них.`,
      `<strong>DCL контролирует доступ</strong>: <code>GRANT</code>, <code>DENY</code>, <code>REVOKE</code>. Это группа администраторов. Отозвать удаляет разрешение, которое вы предоставили ранее; Deny полностью блокирует его.`,
      `<strong>DML манипулирует строками</strong>: <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>. Операторы UPDATE или DELETE без предложения WHERE затрагивают каждую строку, и SQL никогда не спрашивает «вы уверены».`,
      `<strong>Три диалекта, которые нужно распознать.</strong> Transact-SQL (T-SQL) для SQL Server и семейства Azure SQL. pgSQL для PostgreSQL. PL/SQL для Oracle. SQL был стандартизирован ANSI в 1986 году и ISO в 1987 году; поставщики добавляют свои собственные расширения сверху.`,
      `<strong>Представление — это виртуальная таблица, основанная на запросе SELECT.</strong> Это сохраненное окно в одной или нескольких таблицах, запрашиваемое и фильтруемое как таблица. Он не копирует данные.`,
      `<strong>Хранимая процедура — это сохраненный SQL, который вы запускаете по команде.</strong>, часто с параметрами, для инкапсуляции логики, необходимой приложению. Вы вызываете его с помощью EXEC и передаете значения.`,
      `<strong>Указатель подобен указателю в конце книги.</strong> Отсортированная копия одного столбца с указателями на строки, поэтому WHERE в этом столбце находит строки без сканирования всей таблицы. Это требует затрат на хранение и замедляет вставку, обновление и удаление, поскольку его необходимо поддерживать.`,
      `<strong>Azure SQL — это семья из трех человек</strong> на основе движка SQL Server. <em>SQL Server на виртуальных машинах Azure</em> это IaaS. <em>Управляемый экземпляр Azure SQL</em> это ПааС. <em>База данных SQL Azure</em> это ПааС. Лестница простирается от максимального контроля к минимуму административной работы.`,
      `<strong>SQL Server на виртуальных машинах Azure — это вариант «поднять и переместить».</strong>: полностью совместим с локальной средой, вы управляете операционной системой, исправлениями, резервными копиями и всем остальным. Выбирайте его, если вам нужен доступ на уровне ОС или полный контроль. Доступность 99,99%.`,
      `<strong>Управляемый экземпляр Azure SQL имеет почти 100% совместимость с SQL Server.</strong> с автоматическими обновлениями, резервным копированием и восстановлением. Используйте его для большинства миграций в облако, когда вам нужны минимальные изменения в приложениях. Каждый экземпляр может содержать несколько баз данных; Пулы экземпляров совместно используют ресурсы. Доступность 99,99%.`,
      `<strong>База данных SQL Azure предназначена для новых облачных приложений.</strong> Он поддерживает большинство основных функций уровня базы данных, но некоторые функции уровня экземпляра отсутствуют. Две формы: а. <em>единая база данных</em> на логическом сервере или <em>Эластичный пул</em> где несколько баз данных совместно используют память, хранилище и вычислительные ресурсы. Доступность 99,995%.`,
      `<strong>Бессерверные технологии и гипермасштабирование — это варианты базы данных SQL Azure.</strong> Бессерверные весы выполняют вычисления автоматически, и вы платите за использование. Hyperscale поддерживает очень большие базы данных (до 100 ТБ) с быстрым резервным копированием и восстановлением независимо от размера.`,
      `<strong>База данных Azure для MySQL — это PaaS в MySQL Community Edition.</strong>, классический выбор для приложений из стека LAMP. Автоматическое резервное копирование с восстановлением на определенный момент времени до 35 дней (7 по умолчанию). Flexible Server — рекомендуемый вариант развертывания для новых рабочих нагрузок.`,
      `<strong>База данных Azure для PostgreSQL — это PaaS PostgreSQL.</strong>, гибридная база данных реляционных объектов, которая может хранить пользовательские типы данных и геометрические данные, дополненная модулями кода. Его диалект — pgsql. История запросов хранится в <code>azure_sys</code> база данных, просмотренная насквозь <code>query_store.qs_view</code>. Flexible Server — текущий вариант развертывания.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Управляемый экземпляр и база данных SQL — это одно и то же, но с разными именами». Они оба PaaS, но экзамен живет в промежутке. Управляемый экземпляр предоставляет вам целый SQL-сервер <em>instance</em> в облаке с почти 100% совместимостью, поэтому это решение проблемы миграции. База данных SQL дает вам <em>database</em> с основными функциями и максимальным уровнем доступности, поэтому это решение для нового облачного приложения. Если в вопросе говорится «минимальные изменения в существующем локальном решении», выберите «Управляемый экземпляр». Если там написано «новое приложение» или «эластичный пул», выберите «База данных SQL».`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="vz-chip"><b>SQL Server on Azure VM</b><br><span style="color:var(--dim)">IaaS · you manage OS · lift and shift</span></span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Azure SQL Managed Instance</b><br><span style="color:var(--dim)">PaaS · near-100% compatible · migrations</span></span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Azure SQL Database</b><br><span style="color:var(--dim)">PaaS · new cloud apps · 99.995%</span></span>
    </div><div class="vz-note">Left to right: more control and more admin work, to less of both. The exam asks which rung fits a scenario.</div>`},

  {key:'d3', title:"Нереляционные данные в Azure: хранилище, озеро данных, файлы, таблицы, Cosmos DB.",
    must:[
      `<strong>Azure Storage — это одна учетная запись и три вида хранилища.</strong> <em>Контейнеры BLOB-объектов</em> для двоичных файлов в большом масштабе, <em>общие файловые ресурсы</em> как корпоративный сетевой диск, и <em>tables</em> для данных «ключ-значение». Учетная запись хранения может содержать все три.`,
      `<strong>Большие двоичные объекты живут в контейнерах, а доступ контролируется на уровне контейнера.</strong> Папки внутри контейнера по умолчанию виртуальные: всего лишь <code>/</code> в имени большого двоичного объекта. Microsoft Entra ID с Azure RBAC — рекомендуемый способ входа и назначения разрешений.`,
      `<strong>Три типа больших двоичных объектов.</strong> <em>Блокировать BLOB-объекты</em> для больших дискретных объектов, которые изменяются редко (блоки до 4000 МиБ, blob до 190,7 ТиБ). <em>Страничные BLOB-объекты</em> для произвольного чтения и записи страниц по 512 байт, до 8 ТБ, используется для виртуальных дисков ВМ. <em>Добавить большие двоичные объекты</em> только для добавления в конец, чуть больше 195 ГБ максимум, думаю журналы.`,
      `<strong>Четыре уровня доступа: Горячий, Холодный, Холодный, Архив.</strong> Стоимость хранения падает, а стоимость доступа возрастает по мере снижения. Горячий — значение по умолчанию. Минимальный срок пребывания во избежание платы за досрочное удаление: «холодный» — 30 дней, «холодный» — 90 дней, архивный — 180 дней.`,
      `<strong>Архив оффлайн.</strong> Чтение из Hot, Cool и Cold занимает миллисекунды. Архивный большой двоичный объект может занять до 15 часов, чтобы стать доступным, и вам необходимо сначала переместить его в режим «Горячий», «Холодный» или «Холодный» (этап называется <em>rehydration</em>. Вы не можете прочитать это там, где оно находится.`,
      `<strong>Политики управления жизненным циклом автоматически перемещают большие двоичные объекты вниз по уровням.</strong> по мере их старения, в зависимости от количества дней с момента модификации, и могут удалять старые большие двоичные объекты. Так вы избежите высоких цен за данные, которые никто не читает.`,
      `<strong>Варианты резервирования простыми словами.</strong> LRS хранит три копии в одном центре обработки данных. ZRS распределяет копии по трем зонам доступности в регионе. GRS и GZRS также асинхронно копируют во второй удаленный регион. RA-GRS и RA-GZRS позволяют вам читать из этого второго региона до любого переключения при сбое.`,
      `<strong>Azure Data Lake Storage Gen2 — это хранилище BLOB-объектов с иерархическим пространством имен.</strong> Реальные папки, а не виртуальные, со списками управления доступом в стиле POSIX для файлов и папок. Он совместим с распределенными файловыми системами в стиле Hadoop, чего и ожидают Spark и Databricks.`,
      `<strong>Вы получаете Data Lake Storage Gen2, включив иерархическое пространство имен.</strong> в учетной записи хранения, при создании или при последующем обновлении. Обновление является односторонним. Вы не можете вернуться к плоскому пространству имен.`,
      `<strong>OneLake — это озеро данных Fabric, построенное на базе Data Lake Storage Gen2.</strong> Один на каждого арендатора Fabric, общий для каждой рабочей нагрузки и хранящий данные в Delta Parquet. <em>Shortcuts</em> укажите на внешнее хранилище, не копируя его.`,
      `<strong>Файлы Azure — это общий файловый ресурс облачной сети.</strong> До 256 ТиБ на одну учетную запись на основе SSD, больше для жесткого диска, один файл до 4 ТиБ и до 2000 одновременных дескрипторов на файл или каталог. Загрузите с помощью портала или AzCopy и кэшируйте локально с помощью синхронизации файлов Azure.`,
      `<strong>Azure Files поддерживает SMB и NFS.</strong> SMB работает в Windows, Linux и macOS. NFS предназначен только для Linux (ядро 4.3 или более поздней версии), требует учетной записи уровня SSD и виртуальной сети. Два уровня носителей: HDD и SSD, причем SSD быстрее и дороже.`,
      `<strong>Хранилище таблиц Azure — это ключ-значение NoSQL, а не реляционная таблица.</strong> Каждая строка нуждается в <em>ключ раздела</em> больше имеет <em>ключ строки</em>и метка времени фиксирует изменения. Помимо этого, строки могут иметь разные столбцы. Никаких внешних ключей, отношений, хранимых процедур или представлений.`,
      `<strong>Данные таблицы намеренно денормализованы</strong>: одна строка содержит весь объект, включая номера телефонов и адреса. Строки с одинаковым ключом раздела хранятся вместе в порядке ключей строк, что делает <em>point</em> запросы (одна строка) и <em>range</em> запросы (блок строк в одном разделе) быстрые.`,
      `<strong>Azure Cosmos DB — это полностью управляемая, глобально распределенная, многомодельная база данных NoSQL PaaS.</strong> Он не зависит от схемы, автоматически индексирует каждое свойство и реплицируется в любые добавляемые вами регионы Azure. Чтение около 4 мс и запись около 5 мс на 99-м процентиле.`,
      `<strong>Cosmos DB's hierarchy is account, database, container, items.</strong> The container is the unit of storage and scaling; that is where you set the partition key, throughput, indexing and time-to-live. A logical partition holds up to 20 GB, so pick a partition key with many distinct, evenly spread values.`,
      `<strong>Throughput is measured in Request Units per second (RU/s)</strong>; one RU is roughly a 1 KB read. Modes: <em>dedicated</em> to one container, <em>shared</em> across up to 25 containers in a database, or <em>serverless</em> pay-per-request (single region only). <em>Autoscale</em> sets a ceiling and adjusts inside it. Five consistency levels run from Strong to Eventual; Session is the common starting point.`,
      `<strong>Five Cosmos DB APIs, matched to the data model.</strong> <em>NoSQL</em> (native, JSON documents, SQL-like queries, recommended for new apps; formerly called the SQL API). <em>MongoDB</em> (BSON documents, MQL, <code>db.products.find()</code>). <em>Table</em> (key-value with PartitionKey and RowKey, the upgrade path from Azure Table storage). <em>Apache Cassandra</em> (column family, CQL). <em>Apache Gremlin</em> (graph: vertices and edges). Pick by the workload you are migrating.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «В Cosmos DB для NoSQL нет SQL, потому что там написано NoSQL». Собственный API запрашивает документы JSON с синтаксисом, подобным SQL, например <code>SELECT * FROM customers c WHERE c.id = "joe@litware.com"</code>. Название говорит о том, что модель данных нереляционная, а не о том, что язык запросов является иностранным. Обнаруживается и обратная ловушка: в названии хранилища таблиц Azure есть слово «таблица», но это хранилище «ключ-значение» без соединений, внешних ключей и хранимых процедур. Читайте модель данных, а не имя.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="vz-chip"><b style="color:var(--accent)">Hot</b> default · ms reads</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Cool</b> 30-day minimum</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Cold</b> 90-day minimum</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Archive</b> 180-day minimum · offline · up to 15 h to rehydrate</span>
    </div><div class="vz-note">Storage cost drops left to right. Access cost and latency rise. Only Archive has to be rehydrated before you can read it.</div>`},

  {key:'d4', title:"Рабочие нагрузки аналитики в Azure: прием, хранилища, Fabric, потоковая передача, Power BI.",
    must:[
      `<strong>Архитектура крупномасштабной аналитики состоит из четырех уровней.</strong>: прием и обработка (ETL или ELT), хранилище аналитических данных (склад, озеро или озеро), аналитическая модель данных (семантическая модель) и визуализация данных. Microsoft Learn теперь добавляет аналитику с помощью искусственного интеллекта на пятое место.`,
      `<strong>ETL преобразуется перед загрузкой; ELT загружается первым и преобразуется внутри хранилища.</strong> В любом случае результат оптимизирован для аналитических запросов. ELT — распространенный шаблон в современных домиках у озера, поскольку у магазина есть вычислительная мощность для преобразования.`,
      `<strong>Конвейер — это действия плюс связанные услуги.</strong> Действия оперируют данными, начиная с входного набора данных и заканчивая выходным набором данных. Связанные услуги — это соединения с источниками и пунктами назначения. Фабрика данных Azure и Фабрика данных Fabric используют эту модель, поэтому навыки передаются.`,
      `<strong>Фабрика данных Azure — это автономная служба конвейера Azure.</strong> Используйте его, когда место назначения находится за пределами структуры, например базы данных SQL Azure, или при подключении к локальным источникам в гибридной установке. Фабрика данных Fabric — рекомендуемый выбор, когда вся работа выполняется в Fabric; он добавляет <em>Потоки данных второго поколения</em>, инструмент преобразования Power Query с простым кодом.`,
      `<strong>У Fabric есть три способа получения данных без написания конвейера.</strong> <em>Shortcuts</em> наличие эталонного внешнего хранилища (ADLS Gen2, S3, Google Cloud Storage). <em>Mirroring</em> реплицирует такую ​​базу данных, как база данных SQL Azure, Cosmos DB или Snowflake, в OneLake почти в реальном времени. <em>Eventstream</em> принимает потоковые события.`,
      `<strong>Хранилище данных — это реляционное хранилище, имеющее форму звездообразной схемы.</strong> Числовые значения располагаются в центре <em>fact</em> таблицы, относящиеся к <em>dimension</em> таблицы, которые вы агрегируете по (клиент, продукт, магазин, время). Добавление таблиц по измерениям (продукт в категорию) делает его <em>snowflake</em> схема. Выбирайте хранилище, когда данные структурированы и команда пишет SQL.`,
      `<strong>Озеро данных — это хранилище файлов, к которому обращаются распределенные механизмы, такие как Apache Spark.</strong>, с использованием <em>schema-on-read</em>: табличная форма применяется при чтении данных, но не применяется при их записи. Выберите озеро для смешанных структурированных, полуструктурированных и неструктурированных данных.`,
      `<strong>Озеро данных — это гибрид</strong>: необработанные файлы в озере, где конечная точка аналитики SQL представляет их в виде таблиц. Delta Lake заставляет его работать, добавляя принудительное применение схемы и транзакции поверх Parquet. На его основе построены как Fabric, так и Azure Databricks.`,
      `<strong>Microsoft Fabric — единая аналитическая платформа SaaS.</strong>: обработка данных, складирование, аналитика в реальном времени, обработка данных и Power BI в одном рабочем пространстве браузера — и все это на OneLake. Вы не управляете серверами. <em>Ткань Лейкхаус</em> для смешанных данных и работы Spark; <em>Склад тканей</em> для реляционного хранилища, совместимого с SQL Server, со строгим соблюдением схемы.`,
      `<strong>Azure Databricks — это платформа Apache Spark.</strong>, работающий как управляемая служба внутри вашей подписки, с Delta Lake в качестве собственного формата. Части: блокноты (Python, SQL, Scala, R), хранилище SQL Databricks для запросов бизнес-аналитики, каталог Unity для управления и декларативные конвейеры Lakeflow для приема. Выберите его для работы с кодом в Spark и существующих навыков работы с Databricks.`,
      `<strong>Пакетный сбор записей и обработка группы сразу</strong>, по расписанию или когда прибудет достаточно. Выставление счетов по кредитным картам является хрестоматийным примером. Сильные стороны: большие объемы, работа в непиковое время. Слабые стороны: задержки в несколько часов и одна плохая запись могут остановить всю работу.`,
      `<strong>Потоковая передача обрабатывает каждую запись по мере ее поступления.</strong>, в режиме реального времени, для срочных реакций, таких как пожарная сигнализация. Он работает с самыми последними данными или скользящим окном, обрабатывает небольшие микропакеты и выполняет простые агрегаты, такие как скользящие средние. Задержка составляет секунды или миллисекунды.`,
      `<strong>Архитектура потоковой обработки в четырех частях</strong>: событие производит данные, <em>source</em> (часто очередь) захватывает его, <em>Постоянный запрос</em> выбирает, проецирует или агрегирует его во временных окнах, а <em>sink</em> получает результат. Большинство решений сочетают пакетную и потоковую передачу; лямбда-архитектура — это именованный шаблон.`,
      `<strong>Источники: Центры событий Azure, Центр Интернета вещей Azure, Data Lake Storage Gen2, Apache Kafka.</strong> Центры событий принимают большие объемы событий, поддерживают порядок внутри раздела и гарантируют хотя бы однократную доставку. IoT Hub — это та же идея, адаптированная для устройств.`,
      `<strong>Процессоры: Azure Stream Analytics, структурированная потоковая передача Spark, аналитика в реальном времени Fabric.</strong> Stream Analytics — это PaaS: определите задание потоковой передачи, примените постоянный запрос, запишите в выходные данные. Структурированная потоковая передача выполняется на Spark в Databricks или Fabric. Пакеты разведки в реальном времени <em>Eventstreams</em>, <em>Eventhouse</em> (запрашивается с помощью KQL), информационные панели в реальном времени и <em>Activator</em> для автоматизированных действий. Приемники для результатов: концентраторы событий для дополнительной обработки, Data Lake Storage Gen2 или OneLake для файлов, база данных или структура SQL Azure для таблиц и Power BI, когда вопрос заканчивается «визуализировать в реальном времени».`,
      `<strong>Рабочий процесс Power BI: настольный компьютер для обслуживания мобильных устройств.</strong> Моделируйте и создавайте отчеты в <em>Рабочий стол Power BI</em> (Окна). Опубликовать в <em>Служба Power BI</em> для совместного использования, планирования обновления и создания информационных панелей и приложений. Используйте в браузере или <em>Телефонное приложение Power BI</em>. Внутри Fabric Power BI находится в рабочих пространствах OneLake и <em>Прямое озеро</em> Режим читает таблицы Delta без импорта или обновления.`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

/* ===== Concept confidence + needs-review filter ===== */
function studyItemHTML(key,i,m){
  const id = key+'-'+i;
  const lvl = state.conf[id];
  const chip = (l,txt)=>`<button class="conf-чип ${lvl===l?('on '+l):''}" onclick="rateConf('${id}','${l}')">${txt}</button>`;
  return `<li>${m}<div class="li-foot"><span class="conf-chips">${chip('low',"✗ Пока нет")}${chip('mid','~ Almost')}${chip('high',"✓ Иметь это")}</span><button class="hint-btn" onclick="hintStudy('${key}',${i})">Застряли? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-${id}"></div></li>`;
}
function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();
}
function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){
  if(!state.reviewFilter && needsReviewCount()===0){ toast("Сначала оцените концепцию «Еще нет» или «Почти», а затем отфильтруйте только их."); return; }
  state.reviewFilter = !state.reviewFilter;
  save(); render();
}
function openReview(){ state.reviewFilter = true; save(); setView('study'); }

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){
  state.openSections[key] = !state.openSections[key];
  save(); render();
}
function toggleAllStudy(){
  const open = !allStudyOpen();
  STUDY.forEach(s => state.openSections[s.key] = open);
  save(); render();
}

/* ============== EXAM + OPTIONAL TIMER ==============
   The real exam gives you 45 minutes. The timer here matches that and is optional. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Время вышло. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Практический экзамен · ${QUESTIONS.length} questions</h2>
        <p>Распределено по четырем официальным областям в тех же пропорциях, что и Microsoft. Один вопрос за раз. Выберите ответ, и он зафиксирует вас и продвинет вас дальше. Некоторые вопросы типа «выберите все подходящие» без частичной оценки, поэтому прочитайте их дважды. Все оценивается сразу при отправке.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Начните без ограничения по времени</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Приурочено, ${EXAM_MINUTES}:00 как настоящий экзамен ⏱</button>
        </div>
      </div>
      <div class="method-callout">
        <strong>Настоящий экзамен дает вам ${EXAM_MINUTES} минут.</strong> Microsoft не публикует фиксированное количество вопросов, а некоторые вопросы представляют собой пробные элементы без оценок, которые вы не можете идентифицировать. Untimed подойдет для первого прохода. Запустите его один раз перед бронированием, чтобы потренироваться не думать слишком много.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Штрафа за угадывание нет.</strong> Microsoft выставляет баллы без каких-либо сбавок за неправильные ответы, поэтому отвечайте на все. Задание без ответа оценивается так же, как и неправильное.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">Посмотреть результаты →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<класс кнопки="${cls}" onclick="gotoQ(${n})" title="Вопрос ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен DP-900${state.timed?' · timed':''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="экзамен-таймер${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}> ← Предыдущий</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}
      Ничто не оценивается, пока вы не отправите заявку.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<класс кнопки="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-карта${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: Microsoft reports a scaled score from 1 to 1,000 and 700 passes.
   A scaled score is not a raw percent, so we cannot reproduce it. We report raw percent
   and treat 70% as OUR readiness line (real exam: 700 of 1,000 scaled). */
const PASS_PCT = 70;   // our readiness bar (real exam: 700 of 1000 scaled)
const READY_PCT = 80;  // our recommendation, NOT Microsoft's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Свободно от нашей линии готовности 70%, есть свободное место. Пройдите бесплатную официальную оценку практики и запишитесь на нее.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"Выше нашей границы в 70%, но тонкая. Закройте самое слабое место, а затем забронируйте его.", tone:'warn'};
  if(pct >= 55) return {label:"Под чертой, и это словарный запас, который вам стоит. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Напротив нашей шкалы готовности: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% (реальный экзамен: 700 из 1000 по шкале)</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий экзамен сообщает <strong>масштабированный счет от 1 до 1000 и 700 проходов</strong>. Microsoft утверждает, что это не просто 70% вопросов, потому что для более сложных наборов вопросов требуется меньше баллов. Мы не можем воспроизвести масштабирование, поэтому показываем необработанные проценты и лечим <strong>70% как наша линия готовности</strong>. Мы предлагаем ${READY_PCT}%+ здесь перед бронированием, просто как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'}); вернуть ложь;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаки, и эта область ${d.range} настоящего экзамена. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('apk-theme', next);
  document.getElementById('themeIcon').innerHTML = "<я данные-lucid=\"" + (next === 'dark' ? 'sun' : 'moon') + '"></i>';
  if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();
}
(function initTheme(){
  const saved = localStorage.getItem('apk-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').innerHTML = "<я данные-lucid=\"" + (document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon') + '"></i>';
})();

function resetAll(){
  if(!confirm("Удалить все ответы и сбросить экзамен + учебное пособие?")) return;
  localStorage.removeItem(STORE);
  location.reload();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

<script>
// Same robust Lucide refresh as the other kits. Strips data-lucide from output
// and pauses the observer during refresh so it never loops.
function grainRefreshIcons(){
  if(!window.lucide) return;
  if(window._grainObs) window._grainObs.disconnect();
  lucide.createIcons();
  document.querySelectorAll('svg[data-lucide]').forEach(function(s){ s.removeAttribute('data-lucide'); });
  if(window._grainObs) window._grainObs.observe(document.body,{childList:true,subtree:true});
}
(function(){
  function init(){
    grainRefreshIcons();
    if(window.MutationObserver && !window._grainObs){
      window._grainObs=new MutationObserver(grainRefreshIcons);
      window._grainObs.observe(document.body,{childList:true,subtree:true});
    }
  }
  init();
  if(typeof window.lucide==='undefined'){
    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
  }
})();
