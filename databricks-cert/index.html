<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}

<script>
/* ============== STATE ============== */

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Anthropic API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `You are a plain-spoken Databricks tutor helping someone study for the Databricks Accredited Lakehouse Platform Fundamentals exam (also called Databricks Fundamentals). That exam is a concept exam with no code: what a lakehouse is versus a data warehouse or data lake, the medallion architecture, the control plane and compute plane, Delta Lake (ACID, time travel, schema enforcement, Parquet plus a transaction log), Apache Spark and Photon, Unity Catalog (catalog.schema.table, privileges, lineage, audit, sharing), Databricks SQL, SQL warehouses, AI/BI dashboards, Genie, notebooks, Lakeflow Jobs and pipelines, MLflow, and which persona uses which tool.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

  {key:'d3', title:"Каталог Unity и управление",
    must:[
      `<strong>Каталог Unity — это уровень управления данными и искусственным интеллектом.</strong> В документах говорится, что он «автоматически работает при каждом взаимодействии данных и искусственного интеллекта в ваших рабочих пространствах». Единое место для управления доступом, происхождением, аудитом и обнаружением в рабочих областях.`,
      `<strong>Он включен по умолчанию</strong> для рабочих пространств, созданных после 8 ноября 2023 г. Новые учетные записи получают его без настройки. Старое метахранилище Hive для каждой рабочей области является устаревшим вариантом.`,
      `<strong>Метастор — это контейнер верхнего уровня.</strong> Он содержит метаданные и разрешения для ваших ресурсов данных и находится на уровне учетной записи, поэтому многие рабочие области могут использовать его совместно.`,
      `<strong>Трехуровневое пространство имен</strong>: <code>каталог.схема.таблица</code>. Каталог содержит схемы. Схема (также называемая базой данных) содержит таблицы, представления, тома, функции и модели. Вы обращаетесь к любому объекту всеми тремя именами.`,
      `<strong>Скажи это вслух</strong>: «Каталог, схема, таблица. Большая коробка, средняя коробка, сама вещь».`,
      `<strong>Некоторые объекты живут над каталогами</strong>, непосредственно в хранилище метаданных: учетные данные хранилища, внешние расположения и подключения. Они рассказывают Unity Catalog, как получить доступ к облачному хранилищу и внешним системам.`,
      `<strong>Защищаемые объекты</strong> это все, на что вы можете предоставить права: каталоги, схемы, таблицы, представления, тома, функции и модели. Тома — это то, как Unity Catalog управляет нетабличными файлами, такими как изображения или PDF-файлы.`,
      `<strong>Управляемый против внешнего.</strong> Для управляемой таблицы или тома метаданными управляет каталог Unity. <em>and</em> владеет файлами в хранилище. Для внешнего доступом управляет каталог Unity, но файлы остаются там, где вы их поместили.`,
      `<strong>Контроль доступа основан на привилегиях</strong>, с грантами SQL: <code>ПРЕДОСТАВИТЬ ВЫБОР НА ТАБЛИЦЕ... ДЛЯ...</code>. Привилегии наследуются по нисходящей, поэтому предоставление каталога применяется к каждой схеме и таблице в нем.`,
      `<strong>Также существует детальный контроль.</strong>: фильтры строк и маски столбцов скрывают строки или столбцы для каждого пользователя, а политики на основе атрибутов и привязки рабочей области добавляют больше способов определения того, кто что видит.`,
      `<strong>Родословная происходит автоматически.</strong> Каталог Unity отслеживает, «как данные и ресурсы ИИ передаются и соединяются, от исходных данных до моделей, сервисов и панелей мониторинга». Никто не обязан документировать это вручную.`,
      `<strong>Журналы аудита фиксируют доступ.</strong> Каждый доступ к данным и действие системы протоколируются, и именно это команда соответствия использует, чтобы ответить «кто и когда читал эту таблицу».`,
      `<strong>Обозреватель каталогов — это пользовательский интерфейс обнаружения.</strong> Здесь пользователи просматривают каталоги, ищут таблицы, читают описания и видят происхождение. Поиск и обнаружение — это функция управления, а не просто удобство.`,
      `<strong>OpenSharing — это продукт для совместного использования</strong>, построенный на основе открытого протокола Databricks. В документах это описано как возможность делиться данными и ресурсами ИИ с людьми за пределами вашей организации, «независимо от того, используют ли они Databricks».`,
      `<strong>Назовите псевдоним, который нужно знать.</strong> OpenSharing назывался <strong>Дельта-совместное использование</strong>, и в аккредитации и обучающих видеороликах по-прежнему может использоваться это имя. Протокол тот же.`,
      `<strong>Три слова, чтобы поделиться</strong>: а <em>provider</em> акции, а <em>recipient</em> получает, и <em>share</em> — это коллекция совместно используемых ресурсов, доступная только для чтения.`,
      `<strong>Два режима обмена.</strong> Совместное использование блоков данных между блоками данных не требует токенов и обеспечивает полное управление. Открытый общий доступ использует токены, поэтому Spark, pandas, Power BI и другие инструменты могут читать общий ресурс. Ни один из них не копирует данные.`,
      `<strong>Модели тоже регулируются.</strong> Модели MLflow, зарегистрированные в каталоге Unity, получают те же права, происхождение и аудит, что и таблицы. «Данные и искусственный интеллект» в названии продукта являются буквальными.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Каталог Unity — это просто список имен таблиц». Это то, что решает, разрешено ли вам открывать стол. Привилегии, фильтры строк и столбцов, происхождение, журналы аудита и совместное использование — все это зависит от него. Старый метамагазин Hive представлял собой список имен. Unity Catalog — это система безопасности, которая также хранит список.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:13px">
      <span style="padding:5px 10px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b>metastore</b></span>
      <span style="color:var(--dim)">⊃</span>
      <span style="padding:5px 10px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">catalog</b></span>
      <span style="color:var(--dim)">.</span>
      <span style="padding:5px 10px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">schema</b></span>
      <span style="color:var(--dim)">.</span>
      <span style="padding:5px 10px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">table</b></span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Трехуровневое пространство имен. Пример: <code>продажи.финансы.счета</code>. Гранты наследуются по нисходящей.</div>`},

  {key:'d4', title:"Databricks SQL, рабочие процессы и персоны",
    must:[
      `<strong>Databricks SQL — это хранилище данных в Lakehouse.</strong> В документации говорится, что он «работает непосредственно на вашем озере данных, поддерживает ANSI SQL с расширениями Delta Lake» и позволяет создавать хранилище данных «без перемещения данных».`,
      `<strong>Хранилище SQL — это вычислительная машина для SQL.</strong> Определение из документации: «вычислительный ресурс, который позволяет запрашивать и исследовать данные в Databricks». Три типа: бессерверный, профессиональный и классический.`,
      `<strong>Бессерверное хранилище — рекомендуемое хранилище SQL.</strong> Он запускается мгновенно, самостоятельно масштабируется, а Databricks занимается «управлением емкостью, исправлениями, обновлениями и оптимизацией производительности». Pro и Classic работают в вашей собственной облачной учетной записи.`,
      `<strong>Редактор SQL</strong> здесь аналитик пишет и выполняет запросы с помощью ИИ, комментариев и истории версий. История запросов и профили запросов показывают, что выполнялось и почему было медленно.`,
      `<strong>Панели управления AI/BI</strong> являются встроенным продуктом информационной панели. Вы определяете наборы данных из таблиц, представлений или запросов, добавляете визуализации, а затем публикуете. Опубликованной информационной панелью можно поделиться с кем угодно в учетной записи Databricks, даже без доступа к рабочей области.`,
      `<strong>Джинн отвечает на вопросы простыми словами.</strong> Документы описывают его как место, где можно «задавать вопросы о данных на естественном языке и получать ответы, основанные на данных вашей организации», управляемое через каталог Unity.`,
      `<strong>Назовите псевдоним, который нужно знать.</strong> Документы теперь говорят <strong>Genie</strong> с Genie One для бизнес-пользователей, Genie Agents для групп обработки данных и Genie Code для разработчиков. Он продавался как <strong>Гений AI/BI</strong> а в более старых материалах написано «Пространства джиннов». Та же идея: диалоговая аналитика управляемых данных.`,
      `<strong>Ноутбуки — это рабочий стол</strong> для инженеров и ученых. В одном блокноте можно сочетать Python, SQL, Scala и R с совместным редактированием в реальном времени, комментариями, автоматическим управлением версиями и встроенными визуализациями.`,
      `<strong>Лейкфлоу Джобс — оркестратор.</strong> Задание «используется для планирования и координации задач на Databricks в рабочем процессе». Задача может представлять собой блокнот, конвейер, SQL-запрос, скрипт Python и т. д. с зависимостями между ними.`,
      `<strong>Задания выполняются по триггерам.</strong> По времени (каждый день в 2 часа ночи) или по событию (новые файлы поступают в облачное хранилище). В более старых материалах этот продукт называется <strong>Workflows</strong>. То же самое.`,
      `<strong>MLflow — это инструмент жизненного цикла машинного обучения.</strong>, с открытым исходным кодом и запущен Databricks. Параметры журналов отслеживания экспериментов, метрики и артефакты. Модели упакованы в стандартном формате. Реестр моделей управляет версиями и развертыванием.`,
      `<strong>Управляемый MLflow на Databricks</strong> добавляет то, чего не хватает открытому исходному коду: встроенную безопасность, модель, выступающую в качестве конечной точки REST, и реестр в каталоге Unity, поэтому модели получают то же управление, что и таблицы.`,
      `<strong>Партнерское соединение</strong> «позволяет создавать пробные учетные записи с избранными технологическими партнерами Databricks и подключать рабочее пространство Databricks к партнерским решениям из пользовательского интерфейса Databricks». Он предоставляет вам склад и учетные данные.`,
      `<strong>Персоны и кто чем пользуется.</strong> <em>Дата-инженер</em>: Lakeflow Connect, конвейеры и задания, ноутбуки. <em>Аналитик данных</em>: Databricks SQL, редактор SQL, информационные панели AI/BI, Genie. <em>Специалист по данным/инженер ML</em>: блокноты, MLflow, обслуживание моделей. <em>Бизнес-пользователь</em>: информационные панели и Genie.`,
      `<strong>Скажи это вслух</strong>: «Инженеры двигают это, аналитики задают вопросы, ученые моделируют, бизнес спрашивает Джина».`,
      `<strong>Три семейства вариантов использования, названные на экзамене</strong>: инженерия данных (прием и преобразование с помощью Lakeflow в таблицах Delta), аналитика SQL и бизнес-аналитика (Databricks SQL, информационные панели, партнерские инструменты бизнес-аналитики), а также наука о данных и машинное обучение (ноутбуки, MLflow, обслуживание).`,
      `<strong>То, что экзамен хочет, чтобы вы повторили.</strong> Одна платформа, одна копия данных, одна модель управления, поэтому в одну и ту же золотую таблицу подаются отчет Power BI, вопросы Genie и модель ML, а каталог Unity регистрирует все три.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Databricks SQL — это отдельная база данных, в которую вы загружаете данные». Ничего никуда не загружается. Хранилище SQL — это вычислительная машина, которая считывает те же дельта-таблицы в вашем облачном хранилище, которые считываются блокнотами и заданиями. Выключите хранилище, и данные останутся там. Это разделение хранилища и вычислительных ресурсов из области 1, которое снова появляется.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Дата-инженер</b> <span style="color:var(--dim);font-size:13px">Лейкфлоу, блокноты</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Аналитик данных</b> <span style="color:var(--dim);font-size:13px">Databricks SQL, информационные панели</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Специалист по данным</b> <span style="color:var(--dim);font-size:13px">блокноты, MLflow</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Бизнес-пользователь</b> <span style="color:var(--dim);font-size:13px">Джинн, информационные панели</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Четыре персонажа, одна копия данных, один уровень управления под всеми ними.</div>`}
];

/* ============== PRACTICE EXAM: 40 questions ==============
   d1: 12 · d2: 10 · d3: 8 · d4: 10
   The real accreditation is 25 multiple-choice items, untimed, not proctored.
   Every answer traces to docs.databricks.com pages loaded on 2026-08-22.
   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Lakehouse concepts (12) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`Which statement best describes a data lakehouse?`,
    choices:[`Хранилище данных, перенесенное в облако`, `Система управления данными, сочетающая в себе преимущества озер данных и хранилищ данных.`, `Озеро данных, к которому подключен механизм запросов SQL.`, `Услуга управляемой базы данных, предлагаемая облачным провайдером.`],
    correct:1,
    explain:`That is the Databricks definition word for word. The lakehouse keeps the open, low-cost storage of a lake and adds the transactions, performance and governance of a warehouse.`},
  {id:'q2', domain:'d1', type:'ms', q:`Каковы недостатки традиционного хранилища данных, которые призван исправить Lakehouse? <em>Выберите все, что применимо.</em>`,
    choices:[`Собственные форматы хранения`, `Плохая поддержка машинного обучения на необработанных или неструктурированных данных.`, `Невозможность запуска SQL`, `Дорогостоящий ETL для загрузки данных перед их использованием.`],
    correct:[0,1,3],
    explain:`Warehouses are excellent at SQL. Their problems are proprietary formats, weak ML support and the expensive ETL pipelines needed to feed them.`},
  {id:'q3', domain:'d1', type:'mc', q:`A company stores raw files cheaply in cloud object storage but has no transactions, no schema control and poor data quality. What do they have?`,
    choices:[`Хранилище данных`, `Озеро данных`, `Дом у озера`, `Медальонная архитектура`],
    correct:1,
    explain:`Cheap raw storage without reliability or governance is the classic data lake. Adding Delta Lake and Unity Catalog is what turns it into a lakehouse.`},
  {id:'q4', domain:'d1', type:'ms', q:`Какие три технологии Databricks называет основой своего «дома у озера»? <em>Выберите все, что применимо.</em>`,
    choices:[`Апач Спарк`, `Дельта озера`, `Каталог Unity`, `Hadoop MapReduce`],
    correct:[0,1,2],
    explain:`Spark for compute, Delta Lake for ACID transactions and schema enforcement, Unity Catalog for governance and lineage. MapReduce is not part of it.`},
  {id:'q5', domain:'d1', type:'mc', q:`In the medallion architecture, which layer holds raw data exactly as it arrived, with minimal validation?`,
    choices:[`Bronze`, `Silver`, `Gold`, `Platinum`],
    correct:0,
    explain:`Bronze is raw ingestion and the single source of truth for reprocessing. Silver is cleaned and validated. Gold is aggregated and business-ready. There is no platinum layer in the Databricks docs.`},
  {id:'q6', domain:'d1', type:'mc', q:`A finance dashboard needs monthly revenue by region, already aggregated and modelled. Which medallion layer should it read from?`,
    choices:[`Bronze`, `Silver`, `Gold`, `Любой слой, они эквивалентны`],
    correct:2,
    explain:`Gold tables are the aggregated, domain-specific, business-aligned layer built for dashboards and reports. Silver is clean but still detailed. Bronze is raw.`},
  {id:'q7', domain:'d1', type:'mc', q:`Deduplication, schema enforcement and null handling are the main work of which medallion layer?`,
    choices:[`Bronze`, `Silver`, `Gold`, `Плоскость управления`],
    correct:1,
    explain:`Silver is the cleaning and validation layer. Its output is a trustworthy, detailed version of the bronze data that analysts and data scientists can work from.`},
  {id:'q8', domain:'d1', type:'mc', q:`Where is the Databricks control plane located?`,
    choices:[`В вашем облачном аккаунте рядом с вашими данными`, `В учетной записи Databricks`, `На ноутбуке пользователя`, `Внутри каждого хранилища SQL`],
    correct:1,
    explain:`The docs are explicit: the control plane "is located in the Databricks account, not your cloud account." It holds the backend services such as the web app and job scheduling.`},
  {id:'q9', domain:'d1', type:'mc', q:`With <em>classic</em> Вычисление, где проходит вычислительная плоскость?`,
    choices:[`В учетной записи Databricks`, `В вашем собственном облачном аккаунте`, `Разделить поровну между двумя`, `На оборудовании, принадлежащем Databricks, в центре обработки данных`],
    correct:1,
    explain:`Classic compute runs in the customer's cloud account. Serverless compute is the variant that runs in the Databricks account. Either way, that is where your data is processed.`},
  {id:'q10', domain:'d1', type:'mc', q:`What does "separation of storage and compute" let a lakehouse do?`,
    choices:[`Постоянно храните все данные в памяти`, `Масштабируйте и платите за обработку независимо от хранящихся данных`, `Избегайте использования облачного объектного хранилища`, `Работайте без облачного провайдера`],
    correct:1,
    explain:`Data sits in cloud object storage. Compute is spun up and down on its own. You can have a petabyte stored with no compute running, or a huge cluster against a small table.`},
  {id:'q11', domain:'d1', type:'mc', q:`Which describes the relationship between Databricks and cloud providers?`,
    choices:[`Databricks сама является облачным провайдером, конкурирующим с AWS.`, `Databricks работает на AWS, Microsoft Azure и Google Cloud и использует их хранилище.`, `Databricks работает только на собственных частных серверах.`, `Databricks работает только на AWS`],
    correct:1,
    explain:`Databricks is a platform deployed inside one of the three major clouds. Your data stays in that cloud's object storage and the control plane is run by Databricks.`},
  {id:'q12', domain:'d1', type:'mc', q:`Why do open formats such as Parquet matter to the lakehouse?`,
    choices:[`Они сжимают лучше, чем любой проприетарный формат.`, `Другие инструменты и механизмы могут читать те же данные без привязки.`, `Они необходимы облачным провайдерам`, `Они устраняют необходимость в управлении`],
    correct:1,
    explain:`Open formats mean pandas, PyTorch, BI tools and other query engines can read the files directly. That is the lock-in problem of proprietary warehouse formats, solved.`},

  /* ---------- AREA 2 · Delta Lake and Apache Spark (10) ---------- */
  {id:'q13', domain:'d2', type:'mc', q:`What does Delta Lake add to Parquet files to make them a reliable table?`,
    choices:[`Новый формат двоичных файлов, заменяющий Parquet.`, `Файловый журнал транзакций`, `Сервер реляционной базы данных`, `Compression`],
    correct:1,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

      <strong>Платная ступенька выше этого.</strong> <a href="https://www.databricks.com/learn/certification/data-analyst-associate" target="_blank" rel="noopener">Сертифицированный специалист по аналитике данных Databricks</a>: 200 долларов США, 45 вопросов, 90 минут, под наблюдением, срок действия 2 года (ознакомьтесь с официальной страницей 22 августа 2026 г.). Он ожидает практической работы с Databricks SQL. Сначала изучите основы; каждое понятие здесь предполагается там.
    </div>

    <div class="method-callout" style="border-left-color:var(--c-d2)">
      <strong>Также здесь:</strong> the <a href="../sql-cert/">Комплект подготовки SQL</a> для стороны запроса и <a href="../tableau-cert/">Tableau</a> and <a href="../powerbi-cert/">Power BI</a> наборы сертификатов для инструментов, которые находятся поверх хранилища SQL.
    </div>
  `;
}

function renderStudy(){

    <div class="study-intro">

      <p>Каждая точка ведет на docs.databricks.com. Каждая область ссылается на свою страницу документа внизу. Области и веса — это наше распределение, а не план Databricks.</p>

/* ===== Concept confidence + needs-review filter ===== */
function studyItemHTML(key,i,m){
  const id = key+'-'+i;
  const lvl = state.conf[id];
  const chip = (l,txt)=>`<button class="conf-chip ${lvl===l?('on '+l):''}" onclick="rateConf('${id}','${l}')">${txt}</button>`;
  return `<li>${m}<div class="li-foot"><span class="conf-chips">${chip('low',"✗ Пока нет")}${chip('mid','~ Almost')}${chip('high',"✓ Иметь это")}</span><button class="hint-btn" onclick="hintStudy('${key}',${i})">Застрявший? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-${id}"></div></li>`;
}
function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();
}
function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){
  if(!state.reviewFilter && needsReviewCount()===0){ toast("Сначала оцените концепцию «Еще нет» или «Почти», а затем отфильтруйте только их."); return; }
  state.reviewFilter = !state.reviewFilter;
  save(); render();
}
function openReview(){ state.reviewFilter = true; save(); setView('study'); }

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){
  state.openSections[key] = !state.openSections[key];
  save(); render();
}
function toggleAllStudy(){
  const open = !allStudyOpen();
  STUDY.forEach(s => state.openSections[s.key] = open);
  save(); render();
}

/* ============== EXAM + OPTIONAL TIMER ==============
   The real accreditation has NO time limit. The timer is OUR optional pacing drill, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Практический экзамен · ${QUESTIONS.length} questions</h2>
        <p>Распределение по четырем областям. Один вопрос за раз. Выберите ответ, и он зафиксирует вас и продвинет вас дальше. Некоторые вопросы типа «выберите все подходящие» без частичной оценки, поэтому прочитайте их дважды. Все оценивается сразу при отправке.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Начните без ограничения по времени</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Тренировка по темпу, ${EXAM_MINUTES}:00 ⏱</button>
        </div>
      </div>
      <div class="method-callout">
        <strong>На настоящем экзамене нет часов.</strong> Databricks дает вам неограниченное время для ответа на 25 вопросов, поэтому честная репетиция не ограничена по времени. ${EXAM_MINUTES}Упражнение с минутной стимуляцией — это наше число, а не их, и оно здесь только в том случае, если вы хотите попрактиковаться в том, чтобы не думать слишком много.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Пять промахов – это вероятный бюджет.</strong> Databricks не публикует проходной балл; Широко сообщается о 80%. На 25 вопросов это 20 верно. В этом комплекте 40 вопросов и оценки на тех же 80%. Ответьте на все. Задание без ответа оценивается так же, как и неправильное.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">Посмотреть результаты →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен по основам Лейкхауса${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}>← Предыдущий</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}
      Ничто не оценивается, пока вы не отправите заявку.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: Databricks does NOT publish a pass score on the accreditation page.
   80% is widely reported, so 80% is OUR bar here, and the page says so. Raw percent, no scaling. */
const PASS_PCT = 80;
const READY_PCT = 88; // our recommendation, NOT Databricks'. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Вдали от линии 80%, есть свободное место. Забронируйте это.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"За чертой 80%, но тонкий. Закройте самое слабое место, а затем забронируйте его.", tone:'warn'};
  if(pct >= 65) return {label:"Под чертой. Обычно вам обходятся похожие пары. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Посмотрите бесплатный курс Databricks, прочитайте все четыре раздела, а затем повторите его.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Против нашего бара: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% (наш)</span></div>
      <p class="score-sub" style="margin-top:14px">Databricks не публикует проходной балл на странице аккредитации. <strong>80%</strong> широко сообщается, так что это линия, по которой мы оцениваем, на основе чистого процента правильности. На реальных 25 вопросах это будет 20 правильных ответов. Мы предлагаем ${READY_PCT}%+ здесь перед бронированием, просто как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаткие, и при 80% пройти это дорого. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;"> раздел исследования</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Открыть раздел обучения</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

<script>
// Same robust Lucide refresh as the other kits. Strips data-lucide from output
// and pauses the observer during refresh so it never loops.
function grainRefreshIcons(){
  if(!window.lucide) return;
  if(window._grainObs) window._grainObs.disconnect();
  lucide.createIcons();
  document.querySelectorAll('svg[data-lucide]').forEach(function(s){ s.removeAttribute('data-lucide'); });
  if(window._grainObs) window._grainObs.observe(document.body,{childList:true,subtree:true});
}
(function(){
  function init(){
    grainRefreshIcons();
    if(window.MutationObserver && !window._grainObs){
      window._grainObs=new MutationObserver(grainRefreshIcons);
      window._grainObs.observe(document.body,{childList:true,subtree:true});
    }
  }
  init();
  if(typeof window.lucide==='undefined'){
    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
  }
})();
