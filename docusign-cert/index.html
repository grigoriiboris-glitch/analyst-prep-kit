<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign eSignature Administration Pro Prep · Подготовительный комплект для аналитика</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/docusign-cert/">
<meta name="description" content="Подготовка к экзамену Docusign eSignature Administration Pro — учетным данным администратора Docusign начального уровня. Подробное учебное пособие по настройкам экзаменационных тестов, а также практический экзамен из 40 вопросов, оцениваемый по реальному проходному баллу 80%.">
<link rel="stylesheet" href="../assets/grain/grain.css">
<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.lesson-link{font-size:12px;font-weight:600;white-space:nowrap}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}
.section-header .section-count{font-size:12px;color:var(--dim);margin-left:auto}

/* ONE-AT-A-TIME EXAM STEPPER (Excel-kit drill pattern: dot strip + single card + prev/next) */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>
</head>
<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Вернуться ко всем комплектам">← Все комплекты</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Docusign Admin Pro Подготовка</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Учебное руководство</button>
  <button class="nav-btn" id="navExam" onclick="setView('exam')">Практический экзамен</button>
  <button class="nav-btn" id="navResults" onclick="setView('results')" style="display:none">Results</button>
  <div class="nav-spacer"></div>
  <button class="nav-btn" onclick="resetAll()" title="Сбросить прогресс"><i data-lucide="rotate-ccw"></i>Reset</button>
  <button class="nav-btn" onclick="toggleTheme()"><span id="themeIcon"><i data-lucide="sun"></i></span></button>
</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dscert';
const EXAM_MINUTES = 40;   // Docusign estimates ~40 min. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};          // {qid: number | number[] (ms)}
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;  // study guide shows only low/mid-rated concepts
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null; // null = not chosen yet
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared Anthropic key as the SQL / Excel / Python / Power BI / Tableau / Stats kits
   (localStorage 'apk-coach-key'), so a key saved in any of them works here too. */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Anthropic API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `You are a plain-spoken Docusign tutor helping someone study for the Docusign eSignature Administration Pro exam. That exam covers account setup, users and groups, branding, sending and signing settings, and sharing envelopes between users.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== EXAM AREAS ==============
   Docusign's own description of the Pro exam names four things the credential proves:
   "set up an account; manage users on the account; configure settings for branding,
   sending, and signing; as well as, share envelopes between users."
   Docusign does NOT publish percentage weights for this exam. The percentages below
   are OUR study allocation, based on how much of the admin surface each area covers.
   They are labeled as such everywhere they appear. ============== */
const DOMAIN_INFO = {
  d1:{label:"Зона 1", name:"Настроить учетную запись", weight:25, color:'var(--c-d1)',
      hint:`Настройки учетной записи, безопасность и аутентификация, региональные настройки и журнал аудита.`,
      docPath:'https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=nfw1583277366851.html&_LANG=enus',
      docLabel:"Настройки учетной записи в руководстве по администрированию учетной записи Docusign"},
  d2:{label:"Зона 2", name:"Управление пользователями и группами", weight:30, color:'var(--c-d2)',
      hint:`Добавление и активация пользователей, профилей разрешений и делегированного администрирования, групп и групп подписи.`,
      docPath:'https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=mfo1583277360424.html&_LANG=enus',
      docLabel:"Параметры профиля разрешений в руководстве по администрированию учетной записи Docusign."},
  d3:{label:"Зона 3", name:"Настройки брендинга, отправки и подписи", weight:30, color:'var(--c-d3)',
      hint:`Подписание и отправка брендов, настройки подписи, настройки отправки, роли получателей, напоминания и срок действия.`,
      docPath:'https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=rgk1583277353500.html&_LANG=enus',
      docLabel:"Настройки процесса подписания в руководстве по администрированию учетной записи Docusign"},
  d4:{label:"Зона 4", name:"Делитесь конвертами между пользователями", weight:15, color:'var(--c-d4)',
      hint:`Совместный доступ, правила коммерческого учета, передача вручную, хранение и очистка.`,
      docPath:'https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=imk1656607611659.html&_LANG=enus',
      docLabel:"Управляйте общим доступом к конвертам в руководстве по администрированию учетной записи Docusign."}
};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:"Настройка учетной записи: настройки, безопасность, аудит",
    must:[
      `<strong>Где живет админ.</strong> Все на этом экзамене находится под <em>Settings</em> в веб-приложении. Руководство по администрированию учетной записи разделено на пять блоков: <strong>Account</strong> (план и выставление счетов, профиль учетной записи, безопасность, региональные настройки, бренды, штампы), <strong>Пользователи и группы</strong>, <strong>Подписание и отправка</strong>, <strong>Integrations</strong>и <strong>logs</strong> (журнал аудита, журнал массовых действий).`,
      `<strong>Три тайм-аута сессии, одно правило.</strong> Тайм-аут сеанса веб-приложения (собственные пользователи в браузере), Тайм-аут сеанса получателя (подписавшие) и Тайм-аут сеанса мобильного приложения. Все трое берут <code>1</code>–<code>120</code> минуты, и все три по умолчанию <strong>20</strong>.`,
      `<strong>Исключение группы подписывания.</strong> Тайм-аут сеанса получателя не применяется к подписывающей группе. Как только один из членов группы откроет конверт, никто другой в группе не сможет войти, пока этот человек не выберет <em>Закончить позже</em> чтобы освободить его. Застрявшая группа подписания почти всегда такова.`,
      `<strong>Аутентификация получателя — это трехстороннее переключение учетной записи.</strong> Либо каждый конверт должен проходить аутентификацию, либо отправитель может выбирать для каждого конверта, либо аутентификация отключена для учетной записи. Некоторые методы требуют затрат денег, поэтому это решение принимается на уровне учетной записи, а не на уровне отправителя.`,
      `<strong>Триггеры аутентификации</strong> контролировать, как часто: <em>первый раз на устройстве</em> (тот же браузер и устройство никогда не подвергались повторному вызову), <em>Каждый раз, когда получатель получает доступ к конверту</em>или надстройку, позволяющую открывать заполненные конверты без повторной аутентификации.`,
      `<strong>Требования к входу - это отдельная лестница</strong> от аутентификации, и экзамен их путает. Вход в систему не требуется · Требуется вход в систему, если у подписывающего лица есть учетная запись · Требуется учетная запись, вход в систему один раз за сеанс · Требуется учетная запись, вход в систему для каждого нового документа. Последние два означают отправителя <em>невозможно отправить кому-либо без учетной записи Docusign</em>.`,
      `<strong>Скажи это вслух</strong>: "Аутентификация запрашивает <em>докажи, что ты это ты</em>. Требуется вход в систему <em>у вас есть учетная запись здесь?</em>."`,
      `<strong>Региональные настройки</strong> представляют собой одну страницу: часовой пояс, формат даты и язык учетной записи.`,
      `<strong>Stamps</strong> (широко используется в Японии) загружаются в настройки учетной записи, а затем <em>назначено пользователям или группам</em>. Загрузка марки никому не дает возможности ее использовать. Задание делает.`,
      `<strong>Журнал аудита представляет собой журнал изменений настроек, а не журнал конвертов.</strong> Он записывает настройки учетной записи, настройки пользователя, платежную карту и адрес, изменения плана, изменения профиля разрешений, настройки общего доступа к конвертам, брендинг, раскрытие электронной записи и подписи, а также настраиваемые поля документа и конверта. Работа с конвертами зависит от собственной истории конверта и сертификата о завершении.`,
      `<strong>Две ловушки журнала аудита.</strong> Он показывает максимум <strong>100 событий</strong> на экране. Экспортируйте CSV, чтобы увидеть больше. И он регистрирует изменения <em>to</em> профили разрешений, но <strong>а не создание или удаление</strong> одного.`,
      `<strong>Столбцы журнала аудита</strong>: Дата события, Пользователь, Описание, Поле, Старое значение, Новое значение. Пустое старое значение просто означает, что предыдущего значения не было. Флажки прочитаны <code>True</code> / <code>False</code>. Пользователь «Docusign System» означает автоматизированный процесс (активация пользователем своей учетной записи, смена плана); «Пользователь системы Docusign» означает сотрудник Docusign, который выполнил ваш запрос.`,
      `<strong>Данные начинаются с 1 июня 2015 года.</strong> В журнале аудита ничего более раннего нет, независимо от возраста учетной записи.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Журнал аудита покажет мне, кто открыл конверт». Это не так. Журнал аудита предназначен для изменений в <em>account</em>: настройки, пользователи, брендинг, обмен. Кто просмотрел, подписал или отклонил документ, живет в этом конверте. <em>History</em> и его <em>Сертификат об окончании</em>. Если возникает вопрос, где доказать действия подписывающего лица, ответом будет сертификат, а не журнал аудита.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Журнал аудита</b> <span style="color:var(--dim);font-size:13px">кто сменил аккаунт</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Сертификат об окончании</b> <span style="color:var(--dim);font-size:13px">кто что сделал с конвертом</span></div>
    </div>`},

  {key:'d2', title:"Управление пользователями и группами: профили, делегирование, группы подписи.",
    must:[
      `<strong>Для добавления пользователя требуется два человека.</strong> Вы добавляете адрес электронной почты и профиль (и, при необходимости, код доступа); Docusign отправляет приглашение по электронной почте; пользователь выбирает <em>Activate</em>, выбирает «Создать учетную запись» или «Отклонить», передает код доступа, если вы его установили, а затем устанавливает пароль. Только тогда они активны.`,
      `<strong>Два способа, которыми приглашение умирает</strong>, и оба требуют повторной отправки со страницы «Пользователи»: пользователь <em>declines</em> оно или пользователь <em>неправильно вводит код доступа</em>. Неправильный код не дает второй попытки. Это делает приглашение недействительным.`,
      `<strong>Массовые действия</strong> добавлять или обновлять множество пользователей из CSV-файла, и каждый запуск записывается в файл <em>Журнал массовых действий</em>, отличающийся от журнала аудита.`,
      `<strong>Профиль разрешений — это роль.</strong> Параметр «Разрешения администратора» имеет ровно три значения: <strong>None</strong> (без доступа администратора), <strong>Разрешить все</strong> (полное представление администрирования и то, что использует встроенный профиль администратора DS), и <strong>Разрешить некоторые</strong> (делегированное управление).`,
      `<strong>Профили разрешений по умолчанию не могут быть изменены.</strong> Чтобы изменить его, скопируйте его и отредактируйте копию.`,
      `<strong>Делегированное администрирование = десять флажков.</strong> Пользователи и группы · Общий доступ · Передача конвертов · Хранение документов · Настройки учетной записи · Отчетность · Безопасность · Группы подписи · Подключение · Штампы. Каждая область, к которой может получить доступ делегат, — «Редактировать», «Просмотр» или «Нет»; все, для чего установлено значение «Нет», даже не отображается для них в консоли администратора.`,
      `<strong>Пользователи и группы имеют четыре ступени.</strong>, а на экзамене спрашивают про средние двойки. Только просмотр (видеть все, ничего не менять) · <em>Редактировать только группы</em> (управление группами, а не пользователями) · Редактировать пользователей и группы (добавляет пользователей, не являющихся администраторами) · Редактировать пользователей, группы и администраторов (также добавляет администраторов).`,
      `<strong>Два разрешения тянут за собой третье.</strong> Selecting <em>Общий доступ</em> or <em>Передача конвертов</em> автоматически включает пользователей и группы в <strong>Только просмотр</strong>, потому что оба действуют на вещи других людей. Вы не можете иметь ни одного, не просмотрев хотя бы список пользователей.`,
      `<strong>Настройки учетной записи более узкие, чем кажется.</strong> Делегат с настройками учетной записи может управлять учетной записью, настройками подписи и отправки, а также интеграцией, но <strong>not</strong> пользователи, <strong>not</strong> группы, <strong>not</strong> настройки безопасности и <strong>not</strong> Подключить конфигурацию. Подключиться — это отдельный флажок.`,
      `<strong>Хранение документов имеет вторую силу</strong>: делегат с ним может включить, отключить или изменить политику хранения. <em>and</em> используйте целевую очистку, чтобы поместить отдельные конверты в очередь очистки.`,
      `<strong>Делегатам Connect также необходимы права на отправку.</strong> Администратор Connect должен иметь возможность отправлять конверты, иначе настроенные им веб-перехватчики уведомлений о событиях никогда не сработают от него.`,
      `<strong>Разрешения уровня пользователя стоит запомнить в виде лестниц.</strong> Шаблоны: Нет/Использовать/Создать/ <em>Share</em>. PowerForms: нет/стандартный пользователь (только отправка)/администратор (создание, управление, загрузка). Рабочие процессы и веб-формы: нет/использовать/создать. Адресная книга: использовать только личную / использовать только общую / использовать личную и общую / <em>Share</em>. Только верхняя ступенька позволяет пользователю делиться своими контактами.`,
      `<strong>Для некоторых пользовательских разрешений также необходимо включить настройку учетной записи.</strong> Требуется «Разрешить отправку в массовый список» <em>Включить массовых получателей</em>; Требуется «Разрешить вложения подписывающего лица» <em>Включить поле прикрепления подписывающего лица</em>; Требуется «Разрешить выбор языка» <em>Включите индивидуальный адрес электронной почты и язык для каждого получателя</em>. Если отправитель сообщает, что какая-то функция отсутствует, проверьте оба уровня.`,
      `<strong>Группы организуют ваших собственных пользователей.</strong> Они существуют для двух целей: ограничить общий доступ к шаблонам и решить, какие бренды может использовать участник. В каждой учетной записи есть две группы, которые вы не можете редактировать или удалять: <strong>Everyone</strong> (все активные пользователи) и <strong>Administrators</strong> (все с администратором «Разрешить все»).`,
      `<strong>Делегированные администраторы не входят в группу «Администраторы».</strong> В эту группу входят только полные администраторы «Разрешить все».`,
      `<strong>Подписывающая группа — это получатель, а не организационное подразделение.</strong> Добавьте его в конверт, как любого другого получателя; тот участник, который открывает и подписывает, записывается в историю и в сертификат об окончании. Члены <strong>не нужна учетная запись Docusign</strong>.`,
      `<strong>Альтернативный адрес электронной почты меняет ситуацию.</strong> Дайте подписывающей группе один общий адрес для уведомлений, и две вещи изменятся: только участники группы смогут работать с конвертом, и участники теперь <strong>должен иметь учетную запись Docusign</strong> и войдите в систему, чтобы получить к нему доступ.`,
      `<strong>Скажи это вслух</strong>: «Группа сортирует мои сотрудники. Группа подписывает мой документ».`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Делегированный администратор означает уменьшенную версию полного администратора». Это не складывается таким образом. Делегирование — это набор независимых переключателей, и два из них ведут себя определенным образом: <em>Настройки учетной записи</em> намеренно исключает пользователей, группы, безопасность и Connect; и <em>Общий доступ</em> or <em>Передача конвертов</em> автоматически принудительно включить пользователей и группы в режиме «Только просмотр». Ответы на экзамен, в которых говорится, что делегат с настройками учетной записи может сбросить пароль, неверны.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Профиль разрешений</b> что может сделать один пользователь</span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Group</b> templates + brands</span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Группа подписания</b> получатель</span>
    </div>`},

  {key:'d3', title:"Настройки брендинга, отправки и подписи",
    must:[
      `<strong>Два бренда, две аудитории.</strong> A <em>signing</em> бренд - это то, что твой <strong>recipients</strong> см.: электронные письма с уведомлениями и представление подписи. А <em>sending</em> бренд - это то, что твой <strong>собственные пользователи</strong> см. внутри приложения Docusign.`,
      `<strong>Подсчеты разные.</strong> Вы можете хранить множество подписанных брендов, установить один из них в качестве учетной записи по умолчанию и позволить отправителям выбирать конверты по отдельности. Вы указываете <strong>single</strong> отправка бренда всем участникам аккаунта.`,
      `<strong>Бренды придерживаются шаблонов.</strong> Подписывающий бренд сохраняется вместе с шаблоном, а PowerForm наследует подписывающий бренд шаблона, из которого он взят. Группам также можно назначить, какие бренды могут использовать их участники.`,
      `<strong>Напоминания и сроки действия являются настройками учетной записи по умолчанию.</strong> с переключателем блокировки отправителя. Первое напоминание через N дней, затем каждые N дней; истекает через N дней после отправки, предупреждают за N дней. Все значения <code>1</code>–<code>999</code>.`,
      `<strong>Нулевая ловушка.</strong> Установка дней <em>between</em> напоминания о <code>0</code> не означает «напоминать постоянно» и не означает «никогда». Он отправляет первое напоминание, а затем ничего.`,
      `<strong>Auto-navigation</strong> решает, как подписывающая сторона перемещается по полям: «Только страница» (без автоматического перехода), «Навигация по обязательным полям», «Навигация по пустым обязательным полям», «Навигация по всем полям» и три варианта «Страница, затем…», которые сначала появляются вверху каждой страницы. Отправителям может быть разрешено отключать его для каждого конверта.`,
      `<strong>Водяные знаки существуют, чтобы остановить бумагу.</strong> Пока конверт находится в обработке, загруженная или распечатанная копия имеет водяной знак, а все цифровые подписи удаляются. Когда все подпишутся, водяной знак исчезнет и подписи вернутся.`,
      `<strong>Исключение водяного знака</strong>: если <em>Разрешить получателям подписывать на бумаге</em> включен, водяной знак не отображается на документах, которые просматриваются или загружаются для подписи. Эти две функции взаимно компенсируются, и это именно то, что требуется на экзамене.`,
      `<strong>Параметры получателя, которые сочетаются с переопределением отправителя</strong>: подпишите на бумаге и измените ответственность за подписание. Оба имеют учетную запись по умолчанию и отдельный флажок «Разрешить отправителям переопределять».`,
      `<strong>Другие варианты получателя</strong>: при отказе требуется указать причину · войти на мобильном устройстве · редактировать документы (разметка документа) · создать учетную запись Docusign после подписания · подтвердить перед выходом из активного сеанса подписания · напомнить подписывающему лицу нажать «Готово». Автономное подписание <strong>только iOS</strong>.`,
      `<strong>Адаптивная подпись имеет три настройки.</strong>: оптимизировать просмотр для устройства пользователя (Docusign решает для каждого документа: с помощью искусственного интеллекта для большинства учетных записей, базовый, если вы отказались от функций искусственного интеллекта), «Открывать только в режиме просмотра для мобильных устройств» и «Открывать только в режиме просмотра на рабочем столе».`,
      `<strong>Роли получателей включены для каждой учетной записи.</strong> прежде чем отправители смогут их использовать: свидетельское подписание · массовые получатели · <em>Необходимо просмотреть</em> (должен получить заполненные документы, ничего не подписывает) · <em>Укажите получателей</em> (называет людей, занимающих или занимающих их должность) · <em>Разрешить редактировать</em> (можно исправить конверт в процессе, и для этого требуется, чтобы у получателя была действующая учетная запись Docusign) · <em>Обновить получателей</em> (редактирует данные для остальных получателей) · личное (размещенное) подписание.`,
      `<strong>Личное подписание имеет дополнение</strong>: информационный запрос, который хост должен получить от подписывающей стороны перед началом подписания. Ответ сохраняется и распечатывается в Акте об окончании.`,
      `<strong>Видимость документа</strong> скрывает документы в конверте из нескольких документов от получателей, которым не на чем подписывать. Пять состояний: Выкл. · необходимо подписаться для просмотра, если только не является участником учетной записи отправителя · необходимо подписаться для просмотра, если только отправитель · плюс две их версии «отправитель может установить».`,
      `<strong>Маркировка идентификатора конверта представляет собой таблицу истинности с двумя флажками.</strong> «Включить включение идентификатора конверта» = его может установить отправитель. «Включить идентификатор конверта по умолчанию» = включено. К <em>force</em> штамп на каждом конверте, включите значение по умолчанию и выключите переключатель «отправитель может установить».`,
      `<strong>Настройки поля, которые стоит знать</strong>: поля формул (вычисляемые) · условные поля · условная маршрутизация · поле вложения подписывающего лица (с опциями, позволяющими разрешить несколько вложений и добавить вложение непосредственно после собственного документа) · реплицирующиеся поля с общей меткой данных либо в одном документе, либо во всех из них.`,
      `<strong>Требовать шаблон для всех конвертов</strong> полностью удаляет опцию «Отправить конверт», но не останавливает API. Разработчик по-прежнему может отправлять сообщения без шаблонов через API.`,
      `<strong>Конверт правильный</strong> имеет одну настройку: может ли отправитель <em>добавить документы</em> после того, как кто-то уже завершил свое действие. Если эта функция отключена, документы можно будет добавлять только тогда, когда никто не предпринял никаких действий.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Брендинг — это один из параметров». Это два, нацеленные на двух разных людей. Если в вопросе говорится, что получатели получают электронные письма с неправильным логотипом, это <em>signing</em> бренд. Если там написано, что ваши сотрудники видят неправильный логотип при входе в систему, это проблема. <em>sending</em> бренд. Изменение одного никогда не исправляет другое.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Подписание бренда</b> <span style="color:var(--dim);font-size:13px">получатели · электронные письма + просмотр подписи · много, один по умолчанию</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Отправка бренда</b> <span style="color:var(--dim);font-size:13px">ваши пользователи · внутри приложения · один для учетной записи</span></div>
    </div>`},

  {key:'d4', title:"Делитесь конвертами между пользователями: доступ, передача, хранение",
    must:[
      `<strong>Делиться и передавать — разные глаголы.</strong> Совместное использование позволяет кому-то другому <em>also</em> видеть и действовать на конвертах. Передача <em>перемещает право собственности</em>. Первоначальный владелец их теряет.`,
      `<strong>Общий доступ</strong> это текущая функция. Администратор предоставляет пользователю A доступ к конвертам пользователя B; Затем A может отправлять сообщения и управлять ими от имени B, просматривать черновики конвертов, перемещать их, создавать собственные папки и видеть, у кого еще есть доступ. У каждого гранта есть статус, уровень разрешений, а также даты начала и окончания.`,
      `<strong>Два жестких ограничения на общий доступ.</strong> Это работает только <em>между пользователями одного аккаунта</em>, и его можно предоставить только между пользователем, <strong>никогда не объединять пользователей в группы</strong>.`,
      `<strong>Общие конверты (старая функция) находятся в режиме обслуживания.</strong> Он по-прежнему работает, но не может работать с черновиками, папками и списком доступа. Новая работа проходит через Управление общим доступом.`,
      `<strong>Каждое изменение общего доступа заносится в журнал аудита.</strong> Так вы ответите: «Кто дал этому человеку доступ к моим конвертам».`,
      `<strong>Правила коммерческого учета представляют собой автоматические передачи.</strong> Установите его для пользователя или группы, и право собственности перейдет к целевому пользователю, когда конверты будут отправлены. <em>sent</em> или когда они <em>completed</em>, в выбранную вами папку.`,
      `<strong>Первоначальный владелец теряет конверт.</strong> когда срабатывает передача под опеку. Единственный способ сохранить доступ — если правило добавляет их в качестве <strong>получатель точной копии</strong>.`,
      `<strong>Правила коммерческого учета редактировать нельзя.</strong> После создания вам остается только отключить, включить или удалить и перестроить.`,
      `<strong>Ручная передача закрывает рычаг.</strong> Когда кто-то закрывает или меняет роль, перенесите его конверты и шаблоны со страницы «Пользователи» или страницы «Коммерческий учет» по одному или сразу из CSV-файла.`,
      `<strong>Конвертами закрытого пользователя нельзя поделиться</strong>, только перенесено. Сначала переместите их активному пользователю, а затем работайте с ними там.`,
      `<strong>Шаблоны имеют свои собственные правила владения.</strong> Любой, кому предоставлен доступ к шаблону, может редактировать или удалять его, а администратор может редактировать или удалять. <em>any</em> шаблон на аккаунте независимо от того, кто им владеет.`,
      `<strong>Хранение документов представляет собой трехэтапный конвейер.</strong> Конверт заполнен, аннулирован или отклонен → он ожидает истечения срока хранения (<code>1</code>–<code>9999</code> дней) → он сидит в <strong>очистить очередь</strong> примерно на 14 дней → он удаляется навсегда. Отсчет времени начинается при завершении, аннулировании или уменьшении, а не при отправке.`,
      `<strong>Очистка удаляет документы по умолчанию.</strong>, и ничего больше. Еще два дополнительных флажка: <em>Удаление полей и метаданных</em> также удаляет поля и вложения API, а также <em>Удаление личной информации</em> заменяет имена, адреса, электронные письма и IP-адреса надписью «Отредактировано» на конверте, в его истории и сертификате завершения.`,
      `<strong>Редактирование невозможно отменить.</strong>, и он намеренно оставляет временные метки. Вы записываете, что что-то произошло в 14:14, и теряете запись о том, кто это сделал.`,
      `<strong>Включение или изменение политики</strong> подает затронутые конверты в очередь на очистку в течение 24 часов, и это применяется к каждому заполненному, аннулированному или отклоненному конверту, уже находящемуся в учетной записи, а не только к будущим.`,
      `<strong>Отключение политики очищает очередь.</strong> Все, что ожидает очистки, вытягивается обратно. Это и есть аварийная остановка.`

    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Срок хранения — это момент, когда конверт удаляется». Это когда конверт <em>входит в очередь</em>. 30-дневная политика означает примерно 44 дня до окончательного удаления: 30 дней хранения плюс около 14 дней в очереди на очистку. Если в вопросе указывается номер хранения и спрашивается, когда документы действительно исчезли, добавьте очередь.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">

      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b style="color:var(--accent)">очистить очередь</b> ~14 дней</span>

      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b style="color:var(--accent)">Gone</b></span>

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

  const inProgress = state.examStart !== null && !state.submitted;

/* ============== EXAM + OPTIONAL TIMER ==============
   The real Pro exam has NO time limit. The timer here is an optional pacing
   drill against Docusign's own ~40-minute estimate, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){

        <div class="start-actions">

        <strong>На настоящем экзамене нет часов.</strong> Docusign оценивает около ${EXAM_MINUTES} минут и сохраняет ваш прогресс, если вы остановитесь на полпути, поэтому честная репетиция не рассчитана по времени. Упражнение на темп подойдет только в том случае, если вы хотите попрактиковаться в том, чтобы не думать слишком много. На самом деле это не так.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Шесть промахов – это весь бюджет.</strong> Настоящий экзамен — это 30 заданий на 80%, то есть 24 сдаются правильно, а 23 — нет. Ответьте на все. Задание без ответа оценивается так же, как и неправильное.
      </div>

  }

  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен по администрированию Pro${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>

  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;

      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the Docusign University exam page states 30 items and 80% correct to pass.
   There is no scaled score. We report raw percent against that same 80% line. */
const PASS_PCT = 80;
const READY_PCT = 88; // our recommendation, NOT Docusign's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Вдали от линии 80%, есть свободное место. Забронируйте это.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"За чертой 80%, но тонкий. Закройте самое слабое место, а затем забронируйте его.", tone:'warn'};
  if(pct >= 65) return {label:"Под чертой и это детали, стоящие вас. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, открыв рядом с собой открытую учетную запись Docusign, а затем повторите попытку.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Против настоящего бара: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% нужный</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий экзамен — это 30 заданий, оцениваемых по абсолютному проценту правильных ответов. <strong>80%</strong> пасов, так что шесть промахов — это весь бюджет. Мы предлагаем ${READY_PCT}%+ здесь перед бронированием, просто как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаткие, и при 80% пройти это дорого. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;"> раздел исследования</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Открыть раздел обучения</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('apk-theme', next);
  document.getElementById('themeIcon').innerHTML = "<я данные-lucid=\"" + (next === 'dark' ? 'sun' : 'moon') + '"></i>';
  if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();
}
(function initTheme(){
  const saved = localStorage.getItem('apk-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').innerHTML = "<я данные-lucid=\"" + (document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon') + '"></i>';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

<script>
// Same robust Lucide refresh as the other kits. Strips data-lucide from output
// and pause the observer during refresh so it never loops.
function grainRefreshIcons(){
  if(!window.lucide) return;
  if(window._grainObs) window._grainObs.disconnect();
  lucide.createIcons();
  document.querySelectorAll('svg[data-lucide]').forEach(function(s){ s.removeAttribute('data-lucide'); });
  if(window._grainObs) window._grainObs.observe(document.body,{childList:true,subtree:true});
}
(function(){
  function init(){
    grainRefreshIcons();
    if(window.MutationObserver && !window._grainObs){
      window._grainObs=new MutationObserver(grainRefreshIcons);
      window._grainObs.observe(document.body,{childList:true,subtree:true});
    }
  }
  init();
  if(typeof window.lucide==='undefined'){
    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
  }
})();
</script>
