name: Build static Russian version

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.json'
      - '.gitignore'
      - 'tools/static-russian-translation.mjs'
      - '.github/workflows/static-russian-localization.yml'

permissions:
  contents: write

# Only one current full-site build; newer pushes supersede earlier runs.
concurrency:
  group: static-russian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-russian:
    if: ${{ !contains(github.event.head_commit.message, '[static-ru]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build-only parser dependencies
        run: npm install --no-save --no-package-lock parse5 acorn

      - name: Restore static translation cache
        uses: actions/cache/restore@v4
        with:
          path: tools/static-ru-cache.json
          key: static-russian-cache-v1-${{ hashFiles('tools/static-russian-translation.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            static-russian-cache-v1-

      - name: Generate static Russian text
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node tools/static-russian-translation.mjs

      - name: Save translation cache even when rate-limited
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/static-ru-cache.json
          key: static-russian-cache-v1-${{ hashFiles('tools/static-russian-translation.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit generated Russian pages with concurrent-push recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_output() {
            git add -A
            if git diff --cached --quiet; then
              echo "No new static Russian text to commit."
              return 1
            fi
            git commit -m "chore: generate static Russian translations [static-ru]"
          }

          if ! commit_output; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Static Russian pages pushed to main."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not push after 3 attempts because main kept changing." >&2
              exit 1
            fi

            echo "Push race (attempt $attempt); retrying against current main with the translation cache."
            cp tools/static-ru-cache.json /tmp/static-ru-cache.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/static-ru-cache.json tools/static-ru-cache.json

            node tools/static-russian-translation.mjs
            if ! commit_output; then
              echo "Latest main already contains all generated translations."
              exit 0
            fi
          done
