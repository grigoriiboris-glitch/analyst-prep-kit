name: Build static Russian version

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.json'
      - 'tools/static-russian-translation.mjs'
      - '.github/workflows/static-russian-localization.yml'

permissions:
  contents: write

jobs:
  static-russian:
    if: ${{ !contains(github.event.head_commit.message, '[static-ru]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build-only parser dependencies
        run: npm install --no-save --no-package-lock parse5 acorn

      - name: Generate static Russian text
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node tools/static-russian-translation.mjs

      - name: Commit generated Russian pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new localization output."
            exit 0
          fi
          git commit -m "chore: generate static Russian translations [static-ru]"
          git push origin HEAD:main
