name: Build static Russian version

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.json'
      - '.gitignore'
      - 'tools/static-russian-translation.mjs'
      - '.github/workflows/static-russian-localization.yml'

permissions:
  contents: write

# Only one current full-site build; newer pushes supersede earlier runs.
concurrency:
  group: static-russian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-russian:
    if: ${{ !contains(github.event.head_commit.message, '[static-ru]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build-only parser dependencies
        run: npm install --no-save --no-package-lock parse5 acorn

      - name: Generate static Russian text
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node tools/static-russian-translation.mjs

      - name: Commit generated Russian pages and recover from concurrent pushes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_output() {
            git add -A
            if git diff --cached --quiet; then
              echo "No new static Russian text to commit."
              return 1
            fi
            git commit -m "chore: generate static Russian translations [static-ru]"
          }

          if ! commit_output; then
            exit 0
          fi

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Main changed during translation; replaying the generated localization cache on latest main."
          if [ -f tools/static-ru-cache.json ]; then
            cp tools/static-ru-cache.json /tmp/static-ru-cache.json
          fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/static-ru-cache.json ]; then
            cp /tmp/static-ru-cache.json tools/static-ru-cache.json
          fi

          node tools/static-russian-translation.mjs
          git add -A
          if git diff --cached --quiet; then
            echo "Latest main already contains all generated translations."
            exit 0
          fi
          git commit -m "chore: generate static Russian translations [static-ru]"
          git push origin HEAD:main
