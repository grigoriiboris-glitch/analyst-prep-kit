name: Validate learning modules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-learning-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test static Russian markup protection
        run: node --test tests/static-russian-markup-guard.test.js
      - name: Test Russian editorial copy corrections
        run: node --test tests/russian-editorial-copy.test.mjs
      - name: Test technical exercise syntax stays English
        run: node --test tests/technical-exercise-syntax.test.js
      - name: Check Russian localization script syntax
        run: |
          node --check tools/static-russian-translation.mjs
          node --check tools/russian-editorial-copy.mjs
      - name: Check JavaScript syntax and module acceptance criteria
        run: node tools/check-new-modules.js
      - name: Install PostgreSQL WASM engine for course tests
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.12
      - name: Test AI context and recommended learning order
        run: node --test tests/ai-context-and-learning-order.test.js
      - name: Test AI lesson-context copy
        run: node --test tests/ai-context-copy.test.js
      - name: Test SQL Mermaid table visualizations
        run: node --test tests/sql-mermaid.test.js
      - name: Test PostgreSQL course and practice queries
        run: node --test tests/postgresql-module.test.js
      - name: Audit static Russian-only HTML
        run: node tools/check-static-russian.js
      - name: Test progress persistence, cloud merge, safe import and rewards
        run: node --test tests/progress-sync.test.js
