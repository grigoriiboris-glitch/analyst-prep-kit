<style>
/* GRAIN design system. The kit's own semantic vars are re-pointed onto Grain
   tokens (assets/grain/) — no one-off hex. :root = warm dark variant;
   [data-theme="light"] = the full Grain cream look (the default). A dedicated
   Grain dark palette is a later token job (out of scope). */
:root{
  --bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--accent:var(--clay-400);--accent2:var(--clay-300);
  --text:var(--stone-50);--dim:var(--stone-300);--border:var(--stone-700);--success:var(--leaf-400);--err:var(--rust-400);
  --warn:var(--amber-300);--radius:8px;--font:var(--font-sans);--mono:var(--font-mono);
}
[data-theme="light"]{
  --bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--accent:var(--clay-500);--accent2:var(--clay-600);
  --text:var(--stone-900);--dim:var(--stone-600);--border:var(--stone-200);--success:var(--leaf-500);--err:var(--rust-500);--warn:var(--amber-600);
}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono)}
nav{background:var(--surf);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:4px;height:56px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
/* Task instructions. Mobile learning apps keep the prompt large, full-contrast
   and pinned to the top of the exercise so it stays readable while you work;
   16-18px at ~1.5 line-height is the mobile body-copy floor for readability. */
.drill-instruction{font-size:17px;line-height:1.55;color:var(--text,var(--ink,var(--txt)));font-weight:500;margin:0 0 14px}
@media(max-width:640px){
  .drill-instruction{position:sticky;top:56px;z-index:90;background:var(--surf);padding:10px 0 9px;border-bottom:1px solid var(--border,var(--bord))}
}
.nav-logo{font-weight:700;font-size:14px;margin-right:12px;color:var(--text);padding-right:12px;border-right:1px solid var(--border);white-space:nowrap;display:inline-flex;align-items:center;gap:9px}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.nav-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:14px 10px;font-size:13px;font-family:var(--font);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.spacer{flex:1}
.theme-btn,.settings-btn{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;padding:4px 10px;border-radius:6px;font-size:13px;font-family:var(--font)}
.theme-btn:hover,.settings-btn:hover{color:var(--text);border-color:var(--accent)}
.view{display:none;max-width:900px;margin:0 auto;padding:28px 20px}
.view.active{display:block}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--surf2);color:var(--dim);border:1px solid var(--border)}
.tag.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
h2{font-size:19px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:600;margin-bottom:8px}
p{line-height:1.6;color:var(--dim);margin-bottom:10px}
p strong{color:var(--text)}
.lead{color:var(--text);font-size:15px}
.btn{display:inline-block;padding:9px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-family:var(--font);font-weight:600;transition:.15s;background:var(--surf2);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:13px}
.resume-card{background:var(--accent);border-radius:var(--radius);padding:24px 28px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer}
.resume-card h2{color:#fff;margin-bottom:4px}
.resume-card p{color:rgba(255,255,255,.85);margin:0}
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.path-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s}
.path-tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.path-tile h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-bottom:6px}
.path-tile .count{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text)}
.path-tile .sub{font-size:12px;color:var(--dim);margin-top:2px}
.prog-bar{height:4px;background:var(--surf2);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.ral-block{background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.ral-title{font-family:var(--mono);font-size:13px;margin-bottom:10px;padding:8px 12px;background:var(--bg);border-radius:4px;border-left:3px solid var(--accent);line-height:1.6;font-weight:600}
.ral-say{font-size:14px;font-style:italic;color:var(--text);background:var(--bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:9px 13px;margin-bottom:12px;line-height:1.55}
.ral-say::before{content:'\1F5E3\FE0F ';font-style:normal;margin-right:4px}
.ral-line{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border)}
.ral-line:last-child{border:none}
.ral-chunk{font-family:var(--mono);color:var(--accent);flex-shrink:0;min-width:190px;font-weight:600}
.ral-arrow{color:var(--border);flex-shrink:0}
.ral-desc{color:var(--text)}
.gotcha{background:var(--surf2);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13.5px;color:var(--text)}
.gotcha strong{color:var(--warn)}
.viz-cap{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.quiz-wrap{background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:18px}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:11px 16px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);transition:.15s}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:rgba(46,158,107,.16);border-color:var(--success);color:var(--success)}
.quiz-opt.wrong{background:rgba(207,34,46,.12);border-color:var(--err);color:var(--err)}
.quiz-exp{margin-top:12px;padding:12px 14px;background:var(--surf);border-radius:6px;font-size:13px;color:var(--dim);display:none}
.quiz-exp.show{display:block}
.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surf);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:.15s}
.lesson-row:hover{border-color:var(--accent);transform:translateX(3px)}
.lesson-num{width:28px;height:28px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim);flex-shrink:0}
.lesson-num.done{background:var(--accent);color:#fff}
.lesson-info{flex:1;min-width:0}
.lesson-title{font-weight:600;font-size:14px}
.lesson-sub{font-size:12px;color:var(--dim)}
.unit-label{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:14px 0 6px}
.fill-choice{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:11px 16px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);transition:.15s}
.fill-choice:hover{border-color:var(--accent)}
.fill-choice.correct{background:rgba(46,158,107,.16);border-color:var(--success);color:var(--success)}
.fill-choice.wrong{background:rgba(207,34,46,.12);border-color:var(--err);color:var(--err);opacity:.7}
.code-block{font-family:var(--mono);font-size:13px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:14px 16px;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.pars-piece{font-family:var(--mono);font-size:13px;background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:9px 12px;cursor:grab;user-select:none}
.pars-piece:hover{border-color:var(--accent)}
.pars-piece.placed{border-color:var(--accent)}
.drill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.drill-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;text-align:center}
.drill-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.drill-tile .icon{font-size:1.5rem;margin-bottom:6px}
.drill-tile .icon .lucide{width:26px;height:26px;color:var(--accent)}
.drill-tile h3{font-size:.9rem;margin:0 0 4px}
.drill-tile p{font-size:11px;margin:0}
.fc-outer{perspective:1000px;height:210px;margin:18px 0;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.5s;border-radius:var(--radius)}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;border:1px solid var(--border);background:var(--surf)}
.fc-back{background:var(--surf2);border-color:var(--accent);transform:rotateY(180deg);white-space:pre-line;font-size:.95rem;color:var(--text);line-height:1.7}
.fc-term{font-size:1.2rem;font-weight:700}
.gloss-search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:11px 14px;color:var(--text);font:inherit;font-size:14px;outline:none;margin-bottom:14px}
.gloss-search:focus{border-color:var(--accent)}
.gloss-item{border-bottom:1px solid var(--border);padding:13px 0}
.gloss-item:last-child{border:none}
.gloss-term{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:4px}
.gloss-def{font-size:13px;color:var(--dim)}
.kit-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.kit-link{padding:8px 14px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--dim);transition:.15s}
.kit-link:hover{border-color:var(--accent);color:var(--accent)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:14px;z-index:1000;transition:.35s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.dots{margin-bottom:16px}
.dot{width:22px;height:6px;border-radius:3px;display:inline-block;background:var(--surf2);margin-right:5px}
.dot.on{background:var(--accent)}
@media(max-width:600px){.path-grid,.drill-grid{grid-template-columns:1fr 1fr}.ral-chunk{min-width:120px}}
.signin-btn{background:var(--accent);border:1px solid var(--accent);color:#fff;cursor:pointer;padding:5px 12px;border-radius:6px;font:600 12px var(--font-sans,var(--font,system-ui));white-space:nowrap}
.signin-btn:hover{opacity:.85}
.signin-btn.ghost{background:transparent;color:var(--dim);border-color:var(--line,var(--border))}
.signin-btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.user-email{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
</style>

<script>
// ─── DATA (filled in by build steps) ───────────────────────────────────────
const DATA = {
LESSONS:[
 {id:101,unit:"Модуль 0: Как работают диаграммы",title:"Что на самом деле делает диаграмма",sub:"Превращая числа в формы, которые ваш глаз может сравнивать.",core:true,
  story:"Прежде чем выбрать полосу, линию или круговую диаграмму, сделайте шаг назад. У диаграммы есть только одна задача: брать числа, которые трудно сравнить в таблице, и превращать их в фигуры — длины, положения, срезы — которые ваш глаз мгновенно сравнивает. Каждое хорошее решение по графику начинается с этой идеи. Получите это, и «какой график?» перестает быть догадками.",
  intro:"Диаграмма <strong>кодирует</strong> data: it maps each number onto a visual property like the <em>Длина</em> бара, <em>позиция</em> точки или <em>угол</em> ломтика. Ваш глаз расшифровывает эти формы гораздо быстрее, чем читает столбец цифр. Итак, реальный вопрос, стоящий за каждым графиком, заключается в следующем: <em>какое визуальное свойство позволяет легче увидеть это сравнение?</em>",
  ral:[
   {title:"Таблица и диаграмма — одни и те же данные, разная скорость",say:"В таблице хранятся точные значения. Диаграмма заставляет сравнение бросаться в глаза. Используйте таблицу, когда людям нужна точная цифра; используйте диаграмму, когда им нужен шаблон.",
    lines:[
     ["Таблица","содержит точные цифры — Запад 412, Восток 388, Юг 284, Север 195 — читайте по одной"],
     ["Диаграмма","те же четыре числа, нарисованные (закодированные) в виде полосок — число Уэста самое длинное, поэтому Уэст сразу выигрывает"],
     ["Кодирование","правило сопоставления, которое превращает число в фигуру — здесь 412 становится самой длинной полосой"],
     ["Вопрос","«какой регион продается больше всего?» — единственное сравнение, для ответа на которое создана эта диаграмма"]
    ]},
   {title:"Тест декодирования",say:"Диаграмма работает, если незнакомец может ответить на ваш вопрос менее чем за пять секунд, не читая чисел. Если им придется его изучить, значит, кодировка неправильная.",
    lines:[
     ["Самый большой/самый маленький","глаз находит (выбирает) самые длинные и самые короткие бары без чтения — здесь запад и север"],
     ["Тренд","рост, падение или выравнивание с течением времени — читайте направление, а не цифры"],
     ["Часть целого","насколько велика одна деталь по сравнению с общей суммой, к которой она принадлежит"]
    ]}
  ],
  notes:"Диаграмма, для объяснения которой нужен абзац, обычно терпит неудачу. Форма должна нести послание; этикетки и названия только подтверждают это.",
  viz:{html:`<h3 style="margin-bottom:10px">Одни и те же четыре числа — два способа показать</h3>
   <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
    <div style="font-family:var(--mono);font-size:13px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:12px 16px">Запад  412<br>Восток  388<br>Юг 284<br>Север 195</div>
    <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px">
     ${[["West",412],["East",388],["South",284],["North",195]].map(r=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="width:42px;color:var(--dim)">${r[0]}</span><span style="height:18px;background:var(--accent);border-radius:3px;width:${r[1]/412*100}%"></span></div>`).join('')}
    </div>
   </div>`,caption:"В таблице приведены точные цифры; полосы позволяют мгновенно ранжировать регионы. Длина полосы — это кодировка: чем больше, тем больше. В этом обмене цифр на длину и заключается вся суть диаграммы."},
  quiz:{q:"Как лучше всего описать, что делает диаграмма?",opts:["Данные выглядят профессионально","Он кодирует числа как визуальные формы, которые глаз может быстро сравнить.","Он хранит точные значения для поиска.","Он заменяет необходимость в какой-либо таблице данных."],ans:1,exp:"Диаграмма отображает числа на визуальные свойства (длину, положение, угол), чтобы ваш глаз мог их сразу сравнить. Таблицы по-прежнему лучше, когда кому-то нужно точное значение — диаграммы выигрывают, когда им нужна закономерность."}
 },
 {id:102,unit:"Модуль 0: Как работают диаграммы",title:"Визуальные кодировки (и какие глаза считывают лучше всего)",sub:"Положение и длина важнее цвета, площади и угла.",core:true,
  story:"Не все кодировки одинаковы. Десятилетия исследований восприятия выявили четкий рейтинг: глаз судит. <em>позиция</em> и <em>Длина</em> точно, но неряшливо <em>Область</em>, <em>угол</em>, и <em>цветовой оттенок</em>. Благодаря этому рейтингу гистограмма почти всегда превосходит круговую диаграмму, и это причина половины вариантов выбора диаграмм, которые вы когда-либо делали.",
  intro:"Кодировка — это визуальный канал, который передает число. Наиболее распространенные из них, от наиболее к наименее точному, читаются: <strong>позиция</strong> (где точка находится на оси) → <strong>Длина</strong> (длина бара) → <strong>angle/slope</strong> → <strong>Область</strong> (размер круга или плитки) → <strong>цветовой оттенок</strong>. Выберите самый высокий канал, который позволяют ваши данные, и диаграмма практически сконструируется сама собой.",
  ral:[
   {title:"Рейтинг точности",say:"Позиция и длина — это точные каналы — используйте их для наиболее важного сравнения. Цвет и площадь относятся к грубым, вторичным сигналам, а не к точным значениям.",
    lines:[
     ["позиция","наиболее точный — точки разброса, верхняя часть полосы"],
     ["Длина","очень точно — здесь живут гистограммы"],
     ["Угол/наклон","умеренный — направление линейного графика, кусочки круговой диаграммы"],
     ["Область","слабый — размер пузырька, фрагменты древовидной карты (только приблизительная величина)"],
     ["цветовой оттенок","самый слабый по стоимости — отличный по категории, плохой по количеству"]
    ]},
   {title:"Что это означает на практике",say:"Поместите самое важное число в канал позиции или длины. Сохраните цвет и размер для второго, менее точного слоя.",
    lines:[
     ["Точное сравнение","→ полоса (длина) или разброс (позиция)"],
     ["Приблизительная величина","→ пузырьковая или древовидная карта (область) приемлема"],
     ["Ярлык категории","→ цвет хорошо справляется с этой задачей"]
    ]}
  ],
  notes:"Вот почему круговые диаграммы вызывают затруднения: люди плохо оценивают угол и площадь, поэтому ранжировать фрагменты одинакового размера практически невозможно. Гистограмма тех же данных использует длину — и ранжирование становится очевидным.",
  viz:{html:`<h3 style="margin-bottom:10px">Что больше: 27% или 24%?</h3>
   <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">
    <div style="text-align:center"><svg width="120" height="120" viewBox="0 0 32 32" style="transform:rotate(-90deg)">
      <circle r="16" cx="16" cy="16" fill="var(--surf2)"/>
      <circle r="8" cx="16" cy="16" fill="transparent" stroke="var(--accent)" stroke-width="16" stroke-dasharray="13.6 36.7"/>
      <circle r="8" cx="16" cy="16" fill="transparent" stroke="var(--accent2)" stroke-width="16" stroke-dasharray="12 38.3" stroke-dashoffset="-13.6"/>
     </svg><div style="font-size:12px;color:var(--dim);margin-top:4px">пирог — трудно сказать</div></div>
    <div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px">
     ${[["A · 27%",27],["B · 24%",24]].map(r=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="width:60px;color:var(--dim)">${r[0]}</span><span style="height:18px;background:var(--accent);border-radius:3px;width:${r[1]/27*100}%"></span></div>`).join('')}
     <div style="font-size:12px;color:var(--dim)">бары — очевидно</div></div>
   </div>`,caption:"На диаграмме фрагменты 27% и 24% выглядят одинаково: угол и площадь являются слабыми каналами. Что касается баров, длина делает победителя мгновенным. Те же цифры, но совершенно разная читаемость."},
  quiz:{q:"Почему гистограмма обычно лучше круговой диаграммы при сравнении категорий?",opts:["В столбцах используется цвет, который лучше всего читается глазом.","В столбцах используется длина/положение, которые глаз определяет гораздо точнее, чем угол или площадь.","Круговые диаграммы не могут отображать более двух категорий.","Гистограммы занимают меньше места"],ans:1,exp:"Глаз точно считывает положение и длину, но плохо оценивает угол и площадь. Столбцы кодируют значение как длину, поэтому ранжирование легко. Срезы круговой диаграммы кодируют значение как угол/площадь, поэтому одинаковые фрагменты трудно отличить друг от друга."}
 },
 {id:103,unit:"Модуль 0: Как работают диаграммы",title:"Чтение любой оси",sub:"Масштаб, нулевая базовая линия и то, что скрывает усеченная ось.",core:true,
  story:"Ось — это то место, где спокойно лежат диаграммы. Прежде чем доверять какой-либо диаграмме — своей или чужой — прочтите ось. Он начинается с нуля? Масштаб линейный? Интервалы ровные? График с красивым трендом и вводящей в заблуждение осью хуже, чем отсутствие графика, потому что он выглядит авторитетным, но при этом ошибается.",
  intro:"Ось определяет <strong>шкала</strong> который превращает позиции в ценности. Две вещи, которые нужно проверять каждый раз: <strong>Базовый уровень</strong> (Гистограммы должны начинаться с нуля, иначе длина будет лежать) и <strong>интервал между интервалами</strong> (ровные шаги, без пропущенных диапазонов). Линейные графики могут начинаться выше нуля, чтобы показать детали, но столбцы никогда не должны этого делать.",
  ral:[
   {title:"Контрольный список осей",say:"Прочтите ось перед формой. Усеченный базовый уровень может превратить изменение на 3% в нечто, похожее на удвоение.",
    lines:[
     ["Базовый уровень","где начинается ось (ее пол) — от 800 бары 860 против 820 выглядят как выброс; от 0, честный разрыв в 5%"],
     ["Линейный против логарифмического","четные шаги (10, 20, 30) или пропорциональные шаги (10, 100, 1000)? — журнал сжимает большие диапазоны вместе"],
     ["Четные интервалы","сканируйте деления — пропущенный или растянутый зазор искажает форму"],
     ["Двойные оси","две разные шкалы, использующие одну таблицу — прочитайте каждую сторону, прежде чем доверять совпадению"]
    ]},
   {title:"Столбец или линия по правилу базовой линии",say:"Сообщение такта — это его длина, поэтому обрезка базовой линии искажает его. Сообщение линии — это ее наклон, поэтому при ее маркировке допустимо ненулевое начало.",
    lines:[
     ["Гистограмма","длина = значение → должно начинаться с нуля"],
     ["Линейный график","наклон = изменение → можно увеличить масштаб, но четко обозначить его"],
     ["Эмпирическое правило","если отрезание оси меняет историю, вы вводите в заблуждение"]
    ]}
  ],
  notes:"Усечение оси Y гистограммы — это самый распространенный способ, которым диаграммы вводят в заблуждение — случайно или намеренно. Разница в 5% может выглядеть как 5х. Когда вы видите эффектную гистограмму, сначала проверьте базовую линию.",
  viz:{html:`<h3 style="margin-bottom:10px">Одни данные — две точки отсчёта</h3>
   <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
    <div style="text-align:center"><div style="display:flex;align-items:flex-end;gap:10px;height:120px">
      <div style="width:34px;background:var(--accent);height:120px;border-radius:3px 3px 0 0"></div>
      <div style="width:34px;background:var(--accent2);height:114px;border-radius:3px 3px 0 0"></div>
     </div><div style="font-size:12px;color:var(--err);margin-top:4px">базовый уровень 800 — выглядит огромным</div></div>
    <div style="text-align:center"><div style="display:flex;align-items:flex-end;gap:10px;height:120px">
      <div style="width:34px;background:var(--accent);height:104px;border-radius:3px 3px 0 0"></div>
      <div style="width:34px;background:var(--accent2);height:99px;border-radius:3px 3px 0 0"></div>
     </div><div style="font-size:12px;color:var(--success);margin-top:4px">базовый уровень 0 — истинный разрыв</div></div>
   </div>`,caption:"Обе пары — 860 против 820 — разница около 5%. Уменьшите базовую линию до 800 (слева), и будет выглядеть так, будто одна полоса возвышается над другой. Начните с нуля (справа), и вы увидите небольшой, честный разрыв."},
  quiz:{q:"Вы видите гистограмму, на которой один столбец выглядит в три раза выше другого, но значения составляют 102 и 98. Что следует проверить в первую очередь?",opts:["Цветовая палитра","Начинается ли ось Y с нуля","Название диаграммы","Будь то 3D-диаграмма"],ans:1,exp:"Обычная причина – усеченная базовая линия. Если ось начинается, скажем, с 95 вместо 0, крошечный разрыв в 4 единицы растягивается до резкой разницы в высоте. Столбцы должны начинаться с нуля, поскольку их сообщение имеет длину."}
 },
 {id:1,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Гистограмма",sub:"Сравнение категорий — рабочая лошадка BI.",core:true,
  story:"Если вы глубоко изучите один график, сделайте его гистограммой. Это наиболее часто используемая диаграмма в бизнес-аналитике по определенной причине: она кодирует значение как длину, канал, который глаз считывает наиболее точно, поэтому сравнение категорий не составляет труда. Освойте, когда его использовать, как его сортировать, а также правило нулевой базовой линии, и вы охватите большую часть своих отчетов.",
  intro:"Гистограмма сравнивает числовые значения между <strong>категории</strong> — выручка по регионам, продажи по продуктам, билеты по командам. На одной оси перечислены категории; другая — это ось ценностей, которая <strong>должен начинаться с нуля</strong>. Сортировка столбцов по значению (а не по алфавиту) превращает приличную гистограмму в отличную.",
  ral:[
   {title:"Когда использовать гистограмму",say:"Используйте гистограмму всякий раз, когда вы сравниваете числа по нескольким именованным категориям. Это значение по умолчанию — отключайте его только в том случае, если у вас есть конкретная причина.",
    lines:[
     ["Лучшее для","сравнение (ранжирование) одного числа по названным категориям — регионам, продуктам, командам"],
     ["Ось значений","всегда начинается с нуля — длина столбца — это значение"],
     ["Сортировать по значению","сначала упорядочите самые большие столбцы — от Западного 412 до Северного 195 — чтобы рейтинг читался сверху вниз."],
     ["Турники","переворачивайте полосы вбок, если названия категорий длинные — метки остаются читаемыми"]
    ]},
   {title:"Варианты гистограммы",say:"Сгруппированные столбцы сравнивают несколько серий рядом; Столбцы, сложенные друг на друга, показывают части целого, но сравнивать легко только нижний сегмент.",
    lines:[
     ["Сгруппированные (кластеризованные)","две плюс серии на категорию, рядом"],
     ["Сложенный","сумма сегментов дает общую сумму — нижний сегмент читается лучше всего"],
     ["100% сложено","каждая полоса заполняется до 100% — сравнивается состав, а не итоги"]
    ]}
  ],
  notes:"Не сортируйте столбцы по алфавиту, когда возникает вопрос: «Какой самый большой?» — алфавитный порядок скрывает рейтинг. И никогда не обрезайте ось значений: столбцы должны начинаться с нуля.",
  viz:{html:`<h3 style="margin-bottom:10px">Выручка по регионам (по порядку)</h3>
   <div style="display:flex;flex-direction:column;gap:9px">
    ${[["West",412],["East",388],["South",284],["North",195]].map(r=>`<div style="display:flex;align-items:center;gap:10px;font-size:13px"><span style="width:46px;color:var(--dim)">${r[0]}</span><span style="height:22px;background:var(--accent);border-radius:3px;width:${r[1]/412*100}%"></span><span style="color:var(--dim);font-size:12px">$${r[1]}</span></div>`).join('')}
   </div>`,caption:"Категории на одной оси, значения на другой, отсортированы от большего к меньшему. Глаз точно считывает длину такта, поэтому ранжирование очевидно. Это диаграмма, которую вы будете строить чаще всего."},
  quiz:{q:"Вы хотите сравнить общий доход по 6 категориям продуктов. Какой график и настройка лучше всего?",opts:["Круговая диаграмма со всеми 6 фрагментами","Гистограмма, отсортированная по убыванию дохода, ось начинается с нуля.","Линейная диаграмма, соединяющая 6 категорий","Трехмерная гистограмма для визуального эффекта"],ans:1,exp:"Шесть категорий, сравниваемых по значению, — это пример гистограммы из учебника. Сортируйте по убыванию, чтобы ранжирование было мгновенным, и оставляйте ось значений на нуле, чтобы длины были честными. Линия подразумевает тенденцию, которой нет в категориях; пирог состоит из 6 кусков, которые трудно оценить."}
 },
 {id:2,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Линейный график",sub:"Показаны изменения с течением времени — тенденции и направление.",core:true,
  story:"Если в вопросе есть слово «с течением времени» — доход за месяцы, количество регистраций за недели — линейный график является ответом. Он кодирует изменения как наклон, поэтому глаз естественным образом следует за тенденцией. Ключевое правило: строки предназначены для непрерывных упорядоченных данных, таких как даты. Используйте один для категорий, и вы подразумеваете тенденцию, которой нет.",
  intro:"Линейный график отображает значение в зависимости от <strong>непрерывная упорядоченная ось</strong> — почти всегда время. Точки связаны, поэтому <strong>Склон</strong> между ними показывает скорость изменения. Несколько строк сравнивают несколько серий за один и тот же период. В отличие от столбцов, ось линейного графика не обязательно должна начинаться с нуля: ее смыслом является форма тренда, а не абсолютная высота.",
  ral:[
   {title:"Когда использовать линейный график",say:"Используйте линейный график для изменения значения во времени. Связь между точками — это обещание того, что ось X непрерывна и упорядочена.",
    lines:[
     ["Лучшее для","одно значение движется по непрерывной оси — здесь ежемесячный доход с января по июль."],
     ["Склон","угол между точками несет в себе послание — эта линия рано опускается, а затем постепенно поднимается к июлю."],
     ["Несколько строк","наложение (укладка на одну ось) 2–4 серий для сравнения; больше поворотов к спагетти"],
     ["Нулевой базовый уровень","необязательно для линий — вы можете увеличить масштаб (начиная с нуля), чтобы показать детали, но пометьте их."]
    ]},
   {title:"Ловушки линейного графика",say:"Никогда не соединяйте категории линией — это ошибочно подразумевает, что они перетекают друг в друга. И пусть количество строк будет достаточно небольшим, чтобы можно было следовать.",
    lines:[
     ["Категории на х","→ используйте столбцы, а не линию (нет непрерывного порядка)"],
     ["Слишком много строк","→ выделите один, затемните остальные или используйте небольшие кратные"],
     ["Неравномерные временные промежутки","→ расположить ось по реальным датам, а не по строкам"]
    ]}
  ],
  notes:"Линейная диаграмма, соединяющая отдельные категории (например, «Запад, Восток, Юг»), является классической ошибкой: она подразумевает непрерывное движение между несуществующими регионами. Линии предназначены для вещей с естественным порядком: даты, возраст, последовательные шаги.",
  viz:{html:`<h3 style="margin-bottom:10px">Динамика выручки по месяцам</h3>
   <svg viewBox="0 0 320 120" width="100%" height="130" style="max-width:380px">
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="10,90 60,72 110,78 160,50 210,40 260,26 310,18"/>
    ${[[10,90],[60,72],[110,78],[160,50],[210,40],[260,26],[310,18]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join('')}
    <line x1="10" y1="105" x2="310" y2="105" stroke="var(--border)"/>
   </svg>
   <div style="font-size:12px;color:var(--dim)">Янв → Июль</div>`,caption:"Время течет вдоль оси X; Связанная линия позволяет легко отслеживать восходящий тренд и его падения. Наклон — это послание: вы сразу же увидите ускорение роста во второй половине года."},
  quiz:{q:"Для какого вопроса линейный график является ПРАВИЛЬНЫМ выбором?",opts:["Как соотносятся доходы в наших пяти регионах?","Как изменился ежемесячный доход за последний год?","Какую долю в общем объеме продаж составляет каждый продукт?","У какого торгового представителя было больше всего заказов?"],ans:1,exp:"«Изменения за последний год» — это непрерывные, упорядоченные, привязанные ко времени данные — именно то, что показывает линейный график. Остальные три сравнивают отдельные категории или части целого, что требует столбцов или диаграммы частей к целому."}
 },
 {id:3,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Диаграмма рассеяния",sub:"Отношения между двумя числовыми переменными.",
  story:"Если вы хотите узнать, движутся ли два числа вместе, приведет ли увеличение расходов на рекламу к увеличению продаж? доставка больших заказов занимает больше времени? — Диаграмма рассеяния — это инструмент. Он использует положение по двум осям, наиболее точное кодирование, поэтому корреляции и выбросы выявляются сразу.",
  intro:"На точечной диаграмме одна числовая переменная помещается на ось X, а другая — на ось Y, а затем для каждого элемента рисуется точка. <strong>узор облака</strong> раскрывает взаимосвязь: восходящее облако означает положительную корреляцию, нисходящее облако означает отрицательную, бесформенная капля означает отсутствие связи. Точки вдали от толпы <strong>Выбросы</strong> стоит исследовать.",
  ral:[
   {title:"Чтение диаграммы рассеяния",say:"Сначала посмотрите на форму облака, а затем на выбросы. Чем плотнее облако обнимает линию, тем крепче отношения.",
    lines:[
     ["Две числовые оси","х — расходы на рекламу, й — доход — каждая точка — это одна кампания, размещенная обоими числами."],
     ["Восходящее облако","точки растут слева направо — более высокие расходы обычно сопровождаются более высокими доходами (положительный результат)"],
     ["Нисходящее облако","точки падают слева направо — когда одно число увеличивается, другое падает (отрицательное)"],
     ["Выбросы","единственная точка в пакете — здесь скромные расходы, необычно высокий доход — часто реальная история"]
    ]},
   {title:"Корреляция – это не причинно-следственная связь",say:"Разброс показывает, что две вещи движутся вместе. Никогда не доказано, что одно является причиной другого — третий фактор часто является движущей силой обоих.",
    lines:[
     ["Корреляция","переменные движутся вместе — что показывает разброс"],
     ["Причинно-следственная связь","одна переменная вызывает изменение другой — разброс не может это доказать"],
     ["Линия тренда","дополнительное наложение, суммирующее направление и силу"]
    ]}
  ],
  notes:"Диаграмма рассеяния, показывающая корреляцию, не является доказательством причинно-следственной связи. Продажи мороженого и смертность от утопления коррелируют — потому что оба этих показателя растут летом, а не потому, что одно вызывает другое. Всегда спрашивайте, что еще может объяснить эту закономерность.",
  viz:{html:`<h3 style="margin-bottom:10px">Расходы на рекламу и выручка</h3>
   <svg viewBox="0 0 300 140" width="100%" height="150" style="max-width:360px">
    <line x1="20" y1="120" x2="290" y2="120" stroke="var(--border)"/>
    <line x1="20" y1="10" x2="20" y2="120" stroke="var(--border)"/>
    ${[[50,100],[80,92],[95,80],[120,84],[140,66],[165,60],[185,50],[210,44],[240,30],[265,22],[150,40]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)" opacity="0.8"/>`).join('')}
   </svg>
   <div style="font-size:12px;color:var(--dim)">х: расходы на рекламу →   й: доход ↑</div>`,caption:"Каждая точка представляет собой одну кампанию, расположенную по расходам на рекламу (х) и доходам (й). Восходящее облако сигнализирует о положительной взаимосвязи — чем больше расходов, тем больше доходов — но это не доказывает, что расходы стали причиной этого."},
  quiz:{q:"На вашей диаграмме рассеяния количества часов обучения и результатов тестов видно четкое восходящее облако. Какой правильный вывод вы можете сделать?",opts:["Большее изучение приводит к более высоким баллам","Эти две переменные положительно коррелируют — они имеют тенденцию расти вместе.","Между ними нет никаких отношений","Количество изученных часов является выбросом"],ans:1,exp:"Восходящее облако показывает положительную корреляцию — переменные движутся вместе. Это не доказывает причинно-следственную связь: мотивированные студенты могут больше учиться и получать более высокие баллы по другим причинам. Разброс показывает связь, а не причину."}
 },
 {id:4,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Круговые и кольцевые диаграммы",sub:"От части к целому — и почему их следует использовать экономно.",
  story:"Круговые диаграммы имеют плохую репутацию, и в большинстве случаев они ее заслужили. Но они не бесполезны: для отображения одного или двух фрагментов как части целого пирог выглядит нормально. Навык заключается в знании узкого случая, когда круговая диаграмма работает, и использовании гистограммы везде.",
  intro:"Круговая (или кольцевая) диаграмма показывает <strong>части целого</strong> — каждый срез — это доля категории, равная 100%. Подвох: он кодирует значение как <strong>угол и площадь</strong>, каналы, которые глаз читает хуже всего. Таким образом, пироги работают только тогда, когда ломтиков очень мало и сообщение примерно такое: «эта часть составляет примерно половину/четверть», а не точное ранжирование.",
  ral:[
   {title:"Узкий случай, когда пирог работает",say:"Два или три фрагмента, где история представляет собой одно явное большинство. Кроме того, отсортированная гистограмма всегда читается лучше.",
    lines:[
     ["Лучшее для","2–3 фрагмента, которые в сумме составляют реальное целое — здесь подписки плюс разовые = весь доход."],
     ["Сообщение","«одна часть доминирует» — 68% подписок читаются мгновенно; точного ранжирования не будет"],
     ["Пончик","пирог с вырезанным центром — те же правила, а в отверстие можно вместить все"],
     ["Жесткий лимит","примерно через 4 среза углы размываются — переключитесь на отсортированную гистограмму"]
    ]},
   {title:"Почему бары обычно выигрывают",say:"Срезы одинакового размера практически невозможно ранжировать на глаз. Те же доли, что и отсортированные слитки, мгновенно очищаются.",
    lines:[
     ["Много ломтиков","→ нечитаемый; вместо этого столбцы отсортированы по значению"],
     ["Сравниваем два пирога","→ очень тяжело; используйте сгруппированные или 100% сложенные столбцы"],
     ["Нужен точный %","→ маркируйте каждый срез или просто используйте гистограмму"]
    ]}
  ],
  notes:"Никогда не используйте круговую диаграмму, содержащую более четырех секторов, и никогда не сравнивайте две круговые диаграммы рядом — глаз не может отследить изменение углов между ними. В случае сомнений полоса со 100% сложением показывает состав более четко.",
  viz:{html:`<h3 style="margin-bottom:10px">Когда с пирогом все в порядке: одно явное большинство</h3>
   <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
    <svg width="120" height="120" viewBox="0 0 32 32" style="transform:rotate(-90deg)">
     <circle r="16" cx="16" cy="16" fill="var(--accent2)"/>
     <circle r="8" cx="16" cy="16" fill="transparent" stroke="var(--accent)" stroke-width="16" stroke-dasharray="34 16.3"/>
    </svg>
    <div style="font-size:13px;color:var(--dim)"><span style="color:var(--accent);font-weight:700">68% подписок</span><br><span style="color:var(--accent2);font-weight:700">32% Единоразово</span><br><span style="font-size:12px">Два куска, одно очевидное большинство — пирог здесь читается нормально.</span></div>
   </div>`,caption:"Две части с явным большинством — это тот случай, когда пирог хорошо справляется: вы сразу видите, что подписки доминируют. Добавьте третий или четвертый аналогичный фрагмент, и ясность упадет; переключитесь на бары."},
  quiz:{q:"Когда круговая диаграмма является приемлемым выбором?",opts:["Всякий раз, когда у вас есть категориальные данные","Для 2–3 кусочков, где один явно доминирует над всем","Для сравнения значений многих продуктов","Чтобы показать тенденцию за 12 месяцев"],ans:1,exp:"Круговые диаграммы работают только для нескольких частей целого, где сообщение составляет примерное большинство — угол и площадь являются слабыми каналами. Многие срезы, точное ранжирование или тенденции во времени требуют использования полос или линий."}
 },
 {id:5,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Древовидные карты и тепловые карты",sub:"Отображение величины сразу по многим категориям.",
  story:"Иногда у вас слишком много категорий для баров, и значение имеет большее значение, чем точность — скажем, доход по 40 продуктам или активность по часам и дням. Древовидные и тепловые карты меняют точность на плотность: они упаковывают множество значений в компактное пространство, используя площадь и цвет, поэтому вы быстро видите общую картину и горячие точки.",
  intro:"A <strong>Древовидная карта</strong> показывает частичное целое для многих категорий в виде вложенных прямоугольников — большая плитка = большее значение. А <strong>тепловая карта</strong> упорядочивает значения в сетке и кодирует значение каждой ячейки как интенсивность цвета. Оба используют более слабые каналы (площадь, цвет), поэтому они предназначены для обнаружения. <em>узоры и отличительные черты</em>, не читая точных цифр.",
  ral:[
   {title:"Древовидная карта — область для многих частей",say:"Используйте древовидную карту, если на гистограмме слишком много столбцов и вам в основном нужно увидеть, какие категории являются самыми большими.",
    lines:[
     ["Кодирование","площадь плитки = значение — плитка Латте самая большая, потому что Латте приносит больше всего; вложение показывает иерархию"],
     ["Лучшее для","сразу несколько категорий, когда примерный размер и группировка имеют большее значение, чем точные цифры"],
     ["Читает","выскакивают большие плитки (Латте, затем Колд Брю); почти равные плитки, такие как «Мокка» и «Эспрессо», трудно ранжировать"]
    ]},
   {title:"Тепловая карта — цвет в сетке",say:"Используйте тепловую карту, чтобы найти горячие и холодные точки в двух измерениях, например день недели по часам.",
    lines:[
     ["Кодирование","интенсивность цвета ячейки = значение; две оси = две категории"],
     ["Лучшее для","выявление закономерностей по сетке (часы наибольшей нагрузки, слабые регионы)"],
     ["Читает","кластеры и крайности появляются; точные значения требуют меток"]
    ]}
  ],
  notes:"Древовидные и тепловые карты выглядят впечатляюще, но жертвуют точностью — площадь и цвет невозможно прочитать точно. Используйте их, чтобы выявить вопрос «Где мне следует смотреть?», а затем столбчатую диаграмму или таблицу для точного отслеживания.",
  viz:{html:`<h3 style="margin-bottom:10px">Древовидная карта: доход по продуктам</h3>
   <div style="display:flex;gap:4px;height:120px">
    <div style="flex:5;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px">Латте</div>
    <div style="flex:3;display:flex;flex-direction:column;gap:4px">
     <div style="flex:2;background:var(--accent2);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px">Холодное пиво</div>
     <div style="flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)">Мокко</div>
    </div>
    <div style="flex:2;background:var(--surf2);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)">Эспрессо</div>
   </div>`,caption:"Площадь каждой плитки — это ее доход, поэтому крупнейшие продавцы занимают большую часть места — с первого взгляда доминирует латте. Отлично подходит для многих продуктов одновременно, но вы не можете определить точную сумму денег только по размеру плитки."},
  quiz:{q:"Для чего лучше всего использовать древовидные и тепловые карты?",opts:["Точное считывание точных значений","Определение того, какие категории или ячейки выделяются сразу во многих","Отображение тенденции с течением времени","Сравнение ровно двух чисел"],ans:1,exp:"Оба упаковывают множество значений в компактное пространство, используя площадь или цвет — слабые каналы для точности, но сильные для выявления закономерностей. Используйте их, чтобы найти большие плитки или горячие камеры, а затем используйте панель или таблицу для получения точных цифр."}
 },
 {id:6,unit:"Модуль 1: Диаграммы, которые вы будете использовать чаще всего",title:"Схема водопада",sub:"Как начальное значение становится конечным значением.",
  story:"Финансовые и операционные службы больше всего любят одну диаграмму: водопад. Он отвечает: «Как мы перешли от показателей прошлого квартала к показателям этого квартала?» показывая каждую прибыль и потерю как плавающий шаг. Когда кто-то просит вас «соединить» две суммы — начало, плюс это, минус то, равняется концу — ответом будет водопад.",
  intro:"Каскадная диаграмма начинается с первоначальной суммы, затем показывает серию <strong>увеличивается и уменьшается</strong> в виде плавающих столбцов, заканчивающихся окончательной суммой. Это делает <strong>вклад каждого шага</strong> видимый — какие факторы увеличили число, а какие снизили. Это стандартная диаграмма-мост для объяснения изменений.",
  ral:[
   {title:"Анатомия водопада",say:"Анкерные стержни располагаются на базовой линии в начале и конце; плавающие полосы между ними показывают, что добавлено к общей сумме или вычтено из нее.",
    lines:[
     ["Начать якорь","400 в первом квартале — начальная сумма, находящаяся (приземленная) на базовой линии."],
     ["Плавающие бары","+60 Новый всплывает вверх с 400, затем -25 Отток снижается — каждое изменение висит в воздухе."],
     ["Конечный якорь","435 во втором квартале, снова на исходном уровне — 400 плюс 60 минус 25."],
     ["цвет","один цвет для прибылей (зеленый +60), другой для убытков (красный -25), поэтому направление читается без надписей."]
    ]},
   {title:"Когда его использовать",say:"Стремитесь к водопаду всякий раз, когда возникает вопрос: «Что привело к изменению этих двух чисел?»",
    lines:[
     ["Лучшее для","соединение начального итога с конечным итогом через прибыли/убытки"],
     ["Обычное использование","мост доходов, драйверы прибыли, изменение численности персонала"],
     ["Не для","простое сравнение категорий — это гистограмма"]
    ]}
  ],
  notes:"Водопад предназначен для объяснения изменения между двумя итоговыми значениями, а не для сравнения независимых категорий. Если ваши столбцы не «перетекают» от начального значения к конечному, вам нужна обычная гистограмма.",
  viz:{html:`<h3 style="margin-bottom:10px">Мост доходов: Q1 → Q2</h3>
   <div style="display:flex;align-items:flex-end;gap:8px;height:130px;font-size:10px;text-align:center;color:var(--dim)">
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="width:34px;background:var(--dim);height:80px;border-radius:3px"></div>Q1<br>400</div>
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="width:34px;background:var(--success);height:30px;border-radius:3px;margin-bottom:80px"></div>Новый<br>+60</div>
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="width:34px;background:var(--err);height:20px;border-radius:3px;margin-bottom:90px"></div>отток<br>−25</div>
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="width:34px;background:var(--accent);height:95px;border-radius:3px"></div>Q2<br>435</div>
   </div>`,caption:"Начните с первого квартала (400), добавьте новый доход (+60, зеленый), вычтите отток (-25, красный) и получите второй квартал (435). Плавающие шаги показывают, что именно привело к изменению, — гораздо яснее, чем два рядом стоящих итоговых значения."},
  quiz:{q:"Заинтересованное лицо спрашивает: «Почему прибыль упала с 2 миллионов долларов до 1,6 миллиона долларов — что послужило причиной этого?» Какой график лучше всего отвечает на этот вопрос?",opts:["Круговая диаграмма категорий расходов","Водопадная диаграмма, соединяющая 2 миллиона долларов с 1,6 миллионами долларов с каждой прибылью и убытком.","Диаграмма рассеяния прибыли в зависимости от времени","Один бар, показывающий 1,6 миллиона долларов."],ans:1,exp:"«Что послужило причиной изменения между двумя итоговыми показателями?» это точный вариант использования водопада. Он показывает каждый фактор в виде плавающего шага от начала в 2 миллиона долларов до конца в 1,6 миллиона долларов, поэтому вы видите, какие элементы добавлены, а какие вычтены."}
 },
 {id:7,unit:"Глава 2: Как графики вводят в заблуждение",title:"Как лгут графики",sub:"Уловки, которые искажают — выявите их и избегайте.",core:true,
  story:"Грамотность в отношении графиков наполовину заключается в защите: распознавании случаев, когда диаграмма вводит вас в заблуждение, случайно или намеренно. Одни и те же трюки появляются снова и снова — усеченные оси, инвертированные шкалы, тщательно подобранные диапазоны, 3D-искажение. Научитесь их замечать, и привлекательный график больше никогда вас не обманет — и вы не создадите его случайно.",
  intro:"Большинство вводящих в заблуждение графиков используют одно из нескольких движений: <strong>усеченная ось</strong> что преувеличивает небольшие различия, <strong>выбранный диапазон дат</strong> что скрывает реальную тенденцию, <strong>двойная ось</strong> которое имитирует корреляцию, или <strong>3Д/эффекты площади</strong> которые искажают кодировку. Никто не требует лжи о цифрах — они просто искажают то, как их читает глаз.",
  ral:[
   {title:"Распространенные приемы искажения",say:"Каждый из них сохраняет данные честными, но нарушает кодировку, поэтому форма рассказывает более убедительную историю, чем подтверждают цифры.",
    lines:[
     ["усеченная ось","базовый уровень выше нуля → небольшие разрывы выглядят огромными"],
     ["Выбор вишни","приблизиться к датам, которые подчеркивают историю"],
     ["Двухосная подделка","две шкалы выстроены в линию, чтобы подразумевать корреляцию"],
     ["3Д/площадь","перспектива и площадь преувеличивают одни ценности по сравнению с другими"],
     ["Инвертированная ось","перевернуть шкалу, чтобы обратить вспять кажущуюся тенденцию"]
    ]},
   {title:"Ваша защита",say:"Прежде чем доверять графику, каждый раз запускайте одни и те же проверки — большинство искажений не проходят первую проверку.",
    lines:[
     ["Проверьте базовый уровень","ось значений начинается с нуля? (бары должны)"],
     ["Проверьте диапазон","временное окно подозрительно узкое?"],
     ["Проверьте обе оси","на двухосной диаграмме прочтите каждую шкалу"],
     ["Недоверие 3D","декоративная глубина почти всегда искажает"]
    ]}
  ],
  notes:"Самые опасные вводящие в заблуждение графики — это не фальшивые данные, а настоящие данные с искаженной кодировкой. Вот почему они выживают при проверке фактов. Всегда читайте оси, прежде чем читать форму.",
  viz:{html:`<h3 style="margin-bottom:10px">Вишневый выбор ассортимента</h3>
   <div style="display:flex;gap:20px;flex-wrap:wrap">
    <div style="flex:1;min-width:150px"><svg viewBox="0 0 160 90" width="100%" height="90"><polyline fill="none" stroke="var(--err)" stroke-width="2.5" points="10,30 50,20 90,38 130,15"/></svg><div style="font-size:11px;color:var(--err)">«Продажи растут!» (4 отборные недели)</div></div>
    <div style="flex:1;min-width:150px"><svg viewBox="0 0 160 90" width="100%" height="90"><polyline fill="none" stroke="var(--dim)" stroke-width="2.5" points="10,20 35,25 60,18 85,55 110,30 135,38 150,15"/></svg><div style="font-size:11px;color:var(--dim)">Весь год: фактически плоский и волатильный</div></div>
   </div>`,caption:"Левый график показывает четыре выбранные недели и свидетельствует о росте. Справа показаны одни и те же данные за весь год — ровные и неровные. Те же числа; тщательно подобранный ассортимент создает нереальную тенденцию."},
  quiz:{q:"Диаграмма показывает реальные и точные цифры, но все равно вводит в заблуждение. Какова САМАЯ вероятная причина?",opts:["Все-таки данные должны быть фейковыми","Кодировка искажена — например. усеченная ось или выбранный диапазон","Графики не могут вводить в заблуждение, если цифры реальны","Цвета неправильные"],ans:1,exp:"Наиболее распространенные вводящие в заблуждение диаграммы используют точные данные с искаженной кодировкой: базовая линия выше нуля, выбранное окно, управляемая двойная ось или трехмерные эффекты. Цифры подтверждаются, но форма рассказывает более убедительную историю, чем подтверждают данные."}
 },
 {id:8,unit:"Глава 2: Как графики вводят в заблуждение",title:"Вводящие в заблуждение сравнения",sub:"Яблоки к апельсинам, отсутствующий контекст и плохие базовые показатели.",
  story:"Помимо трюков с осями, диаграммы вводят в заблуждение из-за несправедливых сравнений: числа без базовой линии, части, которые не суммируются в целом, или две группы совершенно разных размеров, показанные как равные. Они тоньше, чем усеченная ось, потому что сама диаграмма выглядит нормально — проблема в том, что сравнивается.",
  intro:"Сравнение справедливо только тогда, когда сравниваемые вещи действительно сопоставимы. Следите за <strong>недостающий контекст</strong> (число, которому не с чем сравнивать), <strong>неравные основания</strong> (сравнение необработанных данных в группах очень разного размера) и <strong>часть к целому, что не складывается</strong>. Обычно решение заключается в нормализации — используйте ставки и проценты, а не необработанные значения.",
  ral:[
   {title:"Красные флажки недобросовестного сравнения",say:"Если сравнение кажется неуместным, проверьте, имеют ли эти две вещи одну и ту же основу и один и тот же контекст.",
    lines:[
     ["Нет базовой линии","единственное число («500 жалоб»), рядом с которым ничего нет, — пустяки, а не доказательства"],
     ["неравные основания","В регионе А 500 против 100 в регионе Б, но А обслуживает в 10 раз больше клиентов, поэтому приблизительные подсчеты переворачивают правду"],
     ["Ставки против количества","разделите по базе (на 1000 клиентов), чтобы обе группы находились в равных условиях."],
     ["Не суммирует","«части», которые добавляют больше 100%, нарушают обещание «части к целому» — перепроверьте категории"]
    ]},
   {title:"Как сделать это справедливым",say:"Нормализуйте так, чтобы сравнение было яблоком с яблоком, и всегда указывайте число, с которым можно сравнивать.",
    lines:[
     ["Добавить контекст","по сравнению с прошлым годом, по сравнению с целевым показателем, по сравнению со средним значением"],
     ["Нормализовать","конвертировать необработанные значения в ставки или проценты"],
     ["Сопоставьте базу","сравнивать группы одинакового размера или цифры на единицу"]
    ]}
  ],
  notes:"«В регионе А было 500 жалоб, в регионе Б — 100» ничего не говорит вам, если в регионе А клиентов в десять раз больше. В пересчете на одного клиента в регионе А дела обстоят намного лучше. Всегда спрашивайте: сравнение с чем и из скольки?",
  viz:{html:`<h3 style="margin-bottom:10px">Абсолютные значения и доли</h3>
   <div style="display:flex;gap:20px;flex-wrap:wrap">
    <div style="flex:1;min-width:150px"><div style="font-size:11px;color:var(--dim);margin-bottom:6px">Жалобы (необработанные)</div>
     <div style="display:flex;align-items:flex-end;gap:12px;height:80px"><div style="width:34px;background:var(--err);height:80px;border-radius:3px"></div><div style="width:34px;background:var(--accent);height:24px;border-radius:3px"></div></div>
     <div style="font-size:11px;color:var(--err)">А выглядит намного хуже</div></div>
    <div style="flex:1;min-width:150px"><div style="font-size:11px;color:var(--dim);margin-bottom:6px">На 1000 клиентов</div>
     <div style="display:flex;align-items:flex-end;gap:12px;height:80px"><div style="width:34px;background:var(--accent);height:30px;border-radius:3px"></div><div style="width:34px;background:var(--err);height:60px;border-radius:3px"></div></div>
     <div style="font-size:11px;color:var(--success)">А на самом деле лучше</div></div>
   </div>`,caption:"По приблизительным подсчетам, регион А (левые столбцы) выглядит как проблема. Но компания А обслуживает в 10 раз больше клиентов — в пересчете на 1000 человек, доля жалоб у А составляет половину от количества жалоб у Б. Те же данные; справедливое сравнение переворачивает вывод."},
  quiz:{q:"В регионе А зарегистрировано 500 жалоб, в регионе Б — 100. Почему вывод «А хуже» может оказаться ошибочным сравнением?",opts:["500 на самом деле не больше 100","Группы могут быть разного размера — сравнивайте жалобы по каждому клиенту, а не простое количество.","Жалобы не могут быть зафиксированы","Число регионов B слишком мало, чтобы иметь значение"],ans:1,exp:"Необработанные подсчеты вводят в заблуждение, когда основания различаются. Если у компании A в 10 раз больше клиентов, то процент жалоб на одного клиента может быть намного ниже, чем у компании B. Нормализуйте показатель (на 1000 клиентов), чтобы сравнение было справедливым."}
 },
 {id:9,unit:"Блок 3: Выбор и общение",title:"Выбор правильного графика",sub:"Простой путь принятия решения от вопроса к диаграмме.",core:true,
  story:"Пока что все строится на следующем: учитывая вопрос и некоторые данные, какой график? Вам не нужно запоминать 50 типов диаграмм. Вам нужен один путь принятия решения, который начинается с <em>Вопрос</em> — сравнение, тенденция, взаимосвязь, отношение части к целому или распределение — и почти каждый раз приводит к правильному ответу.",
  intro:"Выберите диаграмму из <strong>Вопрос</strong>, а не данные. Пять форм вопросов охватывают почти все: <strong>сравнение</strong> (→ бар), <strong>тенденция с течением времени</strong> (→ линия), <strong>отношение</strong> (→ разброс), <strong>часть к целому</strong> (→ батончик или ограниченный пирог), и <strong>Распределение</strong> (→ гистограмма/рамка). Сопоставьте форму вашего вопроса с таблицей, и вы будете правы гораздо чаще, чем нет.",
  ral:[
   {title:"Вопрос → карта-схема",say:"Произнесите свой вопрос вслух, найдите его форму в этом списке, и последует таблица.",
    lines:[
     ["«Сравнить категории»","→ гистограмма, отсортированная по значению"],
     ["«Как оно изменилось с течением времени?»","→ линейный график"],
     ["— Эти два числа связаны?","→ график рассеяния"],
     ["«Какая доля от целого?»","→ батончик (или пирог, если 2–3 ломтика)"],
     ["— Как оно распределено?","→ гистограмма или коробчатая диаграмма"]
    ]},
   {title:"Тай-брейки",say:"Если две диаграммы могут работать, по умолчанию используется та, которая имеет более строгую кодировку — обычно это полоса.",
    lines:[
     ["Множество категорий","→ полоса (или древовидная карта, если вам нужен только приблизительный размер)"],
     ["Несколько четких деталей","→ пирог приемлем; в противном случае бар"],
     ["Когда не уверен","→ отсортированная гистограмма — безопасный и честный вариант по умолчанию."]
    ]}
  ],
  notes:"Не начинайте с «Мне нужна крутая диаграмма» и ищите данные, подходящие для нее. Начните с вопроса. Скучная, правильная гистограмма лучше впечатляющей диаграммы, отвечающей на неправильный вопрос.",
  viz:{html:`<h3 style="margin-bottom:10px">Вопрос → диаграмма</h3>
   <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px">
    ${[["Сравнить категории","Bar"],["Меняться со временем","Line"],["Связь между двумя числами","Scatter"],["Часть целого","Бар/фут (≤3)"],["Распространение/распространение","Гистограмма/Коробка"]].map(r=>`<div style="display:flex;gap:10px;align-items:center"><span style="flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:7px 12px">${r[0]}</span><span style="color:var(--accent)">→</span><span style="width:130px;font-weight:600;color:var(--accent)">${r[1]}</span></div>`).join('')}
   </div>`,caption:"Все решение в одной таблице: слева назовите форму вашего вопроса, справа прочитайте схему. Пять паттернов охватывают подавляющее большинство реальной аналитической работы."},
  quiz:{q:"Ваша заинтересованная сторона спрашивает: «Есть ли связь между возрастом клиента и размером заказа?» Какой график подходит?",opts:["Гистограмма","Линейный график","График рассеяния","Круговая диаграмма"],ans:2,exp:"«Есть ли связь между двумя числами?» это вопрос диаграммы рассеяния. Возраст на одной оси, размер заказа на другой; форма облака показывает, движутся ли они вместе. Столбцы сравнивают категории, линии показывают временные тенденции, круговые диаграммы показывают части целого."}
 },
 {id:10,unit:"Блок 3: Выбор и общение",title:"Объяснение диаграммы заинтересованным сторонам",sub:"От «вот диаграмма» до «вот что это значит».",core:true,
  story:"Последний навык — тот, который помогает аналитикам продвигаться по службе: превращать диаграмму в предложение, которое запомнит занятый руководитель. Диаграмма на слайде — это не понимание, а ваше объяснение. Начните с выводов, укажите на доказательства и закончите словами «ну и что». Сделайте это хорошо, и люди начнут доверять вашим диаграммам, потому что вы уже объяснили им, что они означают.",
  intro:"Отличное объяснение диаграммы имеет простую структуру: <strong>сначала еда на вынос</strong> (одно предложение, которое вы хотите запомнить), затем <strong>доказательства</strong> (укажите на конкретную отметку на схеме), затем <strong>'Ну и что'</strong> (решение или действие, которое оно подразумевает). Заголовки должны отражать суть, а не просто обозначать оси: «Доходы Запада упали на 18% в третьем квартале», а не «Доходы по регионам».",
  ral:[
   {title:"Объясняющая структура диаграммы",say:"Прежде чем говорить о деталях, скажите вывод. Занятые люди решают, продолжать ли слушать в первом предложении.",
    lines:[
     ["сначала еда на вынос","одно предложение: единственное, что нужно запомнить"],
     ["Укажите на доказательства","«видеть этот бар/это падение» — привязать слова к отметке"],
     ["«Ну и что»","решение или действие, которое поддерживает карта"],
     ["Заголовки статистики","в заголовке указано находка, а не только оси"]
    ]},
   {title:"Привычки, которые вызывают доверие",say:"Сделайте так, чтобы в диаграмму было легко поверить: четко обозначайте ее, показывайте контекст и не заставляйте людей искать суть.",
    lines:[
     ["Аннотируйте точку","вызвать ключевую отметку прямо на графике"],
     ["Дайте контекст","по сравнению с прошлым годом, по сравнению с целевым показателем — никогда не используйте только цифры"],
     ["Одна диаграмма, одно сообщение","если он дает два очка, разделите его на две части"]
    ]}
  ],
  notes:"«Доход по регионам» — это ярлык, а не вывод. «Запад — наш единственный сокращающийся регион» — вот что помнят заинтересованные стороны. Потратьте свой заголовок на понимание — это самый читаемый текст на слайде.",
  viz:{html:`<h3 style="margin-bottom:10px">Обычный заголовок и заголовок с выводом</h3>
   <div style="display:flex;flex-direction:column;gap:10px">
    <div style="background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:10px 14px"><span style="color:var(--dim);font-size:11px">WEAK TITLE</span><br><span style="font-weight:700">Доход по регионам</span><br><span style="font-size:12px;color:var(--dim)">…заставляет читателя работать</span></div>
    <div style="background:var(--surf2);border:1px solid var(--accent);border-radius:6px;padding:10px 14px"><span style="color:var(--accent);font-size:11px">STRONG TITLE</span><br><span style="font-weight:700">Запад — наш единственный регион с падающими доходами</span><br><span style="font-size:12px;color:var(--dim)">…протягивает читателю вывод</span></div>
   </div>`,caption:"Та же диаграмма, два названия. Слабый размечает оси и оставляет размышления читателю. Сильный заявляет о выводе — поэтому сообщение попадает в цель, даже если он прочитает только заголовок."},
  quiz:{q:"Как лучше всего назвать и объяснить диаграмму заинтересованной стороне?",opts:["Обозначьте оси нейтрально и позвольте им сделать свой собственный вывод.","Сделайте вывод: изложите суть идеи в заголовке и сначала скажите вывод.","Покажите диаграмму без заголовка, чтобы избежать предвзятости.","Включите все числа, чтобы ничего не пропустить"],ans:1,exp:"Ведите с выносом. Проницательный заголовок («Запад — наш единственный сокращающийся регион») плюс объяснение, ставящее в первую очередь заключение, означают, что сообщение доходит даже до беглого читателя. Ярлыки нейтральной оси заставляют людей выполнять аналитическую работу, для выполнения которой вы были наняты."}
 }
],
FILLS:[
 {id:1,q:"Основная задача диаграммы — представить ___ числа как визуальные формы, которые глаз может сравнивать.",partial:"Диаграмма преобразует ___ данные в фигуры.",ans:"кодировать",choices:["кодировать","Магазин","скрывать","Формат"],hint:"Кодирование — это сопоставление числа с визуальным свойством, например длиной или положением."},
 {id:2,q:"Визуальный канал, который глаз считывает НАИБОЛЕЕ точно, — это ___.",partial:"Самый точный канал: ___",ans:"позиция",choices:["позиция","цветовой оттенок","Область","угол"],hint:"Положение (и длина) области удара, угол и цвет для точного считывания."},
 {id:3,q:"Ось значений гистограммы всегда должна начинаться с ___.",partial:"Ось значений столбца начинается с ___",ans:"ноль",choices:["ноль","минимальное значение","100","средний"],hint:"Сообщение полоски — это ее длина, поэтому ненулевая базовая линия искажает ее."},
 {id:4,q:"Для сравнения значений по категориям используется диаграмма по умолчанию — диаграмма ___.",partial:"Сравнить категории → ___ диаграмма",ans:"Бар",choices:["Бар","линия","пирог","Разброс"],hint:"Столбцы кодируют значение в виде длины — рабочая сравнительная таблица."},
 {id:5,q:"Чтобы показать, как значение меняется с течением времени, используйте диаграмму ___.",partial:"Изменение с течением времени → ___ диаграмма",ans:"Линия",choices:["линия","Бар","пирог","Древовидная карта"],hint:"Линия соединяет упорядоченные точки, поэтому наклон показывает тенденцию."},
 {id:6,q:"Чтобы показать, движутся ли две числовые переменные вместе, используйте график ___.",partial:"Связь между двумя числами → ___ сюжет",ans:"Точечная",choices:["Разброс","Бар","пирог","водопад"],hint:"Две числовые оси; форма облака раскрывает взаимосвязь."},
 {id:7,q:"Круговая диаграмма должна содержать не более ___ секторов.",partial:"Круговая диаграмма максимум ≈ ___ фрагментов",ans:"четыре",choices:["четыре","десять","двадцать","двести"],hint:"Угол и площадь — слабые каналы — после ~4 срезов переключитесь на столбцы."},
 {id:8,q:"Диаграмма, которая соединяет начальную и конечную сумму посредством прибылей и убытков, представляет собой ___ диаграмму.",partial:"Начало → +/− шагов → конец = ___ диаграммы",ans:"водопад",choices:["водопад","сложенный бар","Пончик","тепловая карта"],hint:"Плавающие полоски показывают вклад каждого шага в изменение."},
 {id:9,q:"Срезание базовой линии гистограммы выше нуля ___ небольших различий.",partial:"Усеченные базовые ___ различий",ans:"преувеличивает",choices:["преувеличивает","прячет","переворачивает","игнорирует"],hint:"Это самый распространенный способ, которым графики вводят в заблуждение: крошечные разрывы выглядят огромными."},
 {id:10,q:"Чтобы справедливо сравнить количество жалоб от групп разного размера, преобразуйте их в ___.",partial:"Разные размеры групп → сравнить по ___",ans:"ставка",choices:["ставка","необработанный подсчет","Общий","цвет"],hint:"Нормализуйте до 1000 (ставка), чтобы основания совпадали."},
 {id:11,q:"Вы выбираете правильную диаграмму, начиная с ___, а не с данных.",partial:"Начни с ___",ans:"Вопрос",choices:["Вопрос","тип данных","инструмент","цветовая палитра"],hint:"Сначала назовите форму вашего вопроса; следующий график."},
 {id:12,q:"В ярком названии диаграммы указывается ___, а не только метки осей.",partial:"В хорошем названии указано ___",ans:"Вывод",choices:["Вывод","имя файла","Дата","автор"],hint:"«Запад сокращается» лучше, чем «Доходы по регионам»."}
],
ESQL:[
 {id:1,q:"Вопрос: «Как изменился ежемесячный доход за последний год?» Какой график?",ans:"Линейный график",choices:["Линейный график","Круговая диаграмма","График рассеяния","Древовидная карта"],hint:"Изменение со временем → линия."},
 {id:2,q:"Вопрос: «Какой из 8 наших продуктов продавался больше всего?» Какой график?",ans:"Гистограмма (отсортированная)",choices:["Гистограмма (отсортированная)","Круговая диаграмма","Линейный график","водопад"],hint:"Сравнить категории по значению → отсортированная полоса."},
 {id:3,q:"Вопрос: «Есть ли связь между расходами на рекламу и доходами?» Какой график?",ans:"График рассеяния",choices:["График рассеяния","Гистограмма","Кольцевая диаграмма","тепловая карта"],hint:"Две числовые переменные → разброс."},
 {id:4,q:"Вопрос: «Как мы перешли от прошлогодней прибыли к прибыли этого года?» Какой график?",ans:"Диаграмма водопада",choices:["Диаграмма водопада","Круговая диаграмма","Линейный график","Гистограмма"],hint:"Соедините начальный итог с конечным итогом → водопад."},
 {id:5,q:"Вопрос: «Какая доля общего дохода приходится на подписки по сравнению с единоразовыми?» (2 части) Какой график?",ans:"Пирог или 100% сложенный батончик",choices:["Пирог или 100% сложенный батончик","График рассеяния","Линейный график","Гистограмма"],hint:"Две четкие части целого — здесь допустим пирог."},
 {id:6,q:"Вопрос: «Какие часы и какие дни недели самые загруженные?» (две категории, одно значение) Какая диаграмма?",ans:"тепловая карта",choices:["тепловая карта","Линейный график","Круговая диаграмма","Гистограмма"],hint:"Значение по сетке двух категорий → тепловая карта."},
 {id:7,q:"Назовите канал, который гистограмма использует для кодирования значения.",ans:"Длина",choices:["Длина","цветовой оттенок","угол","Текстура"],hint:"Более длинная полоса = большее значение."},
 {id:8,q:"Назовите канал, который круговая диаграмма использует для кодирования значения.",ans:"Угол/площадь",choices:["Угол/площадь","Длина","позиция","Склон"],hint:"Слабые каналы — почему пироги плохо читаются."},
 {id:9,q:"Диаграмма показывает резкий скачок, но ось Y начинается с отметки 950 (а не с 0). В чем проблема?",ans:"Усеченная ось преувеличивает изменение",choices:["Усеченная ось преувеличивает изменение","Цвета неправильные","Слишком много категорий","Это должно быть 3D"],hint:"Базовая линия выше нуля растягивает небольшие промежутки."},
 {id:10,q:"Как вы называете одинокую точку, расположенную далеко от остальной части облака на диаграмме рассеяния?",ans:"Выброс",choices:["Выброс","Базовый уровень","Линия тренда","Легенда"],hint:"Зачастую это самый интересный момент для исследования."},
 {id:11,q:"В двух регионах зарегистрировано 500 жалоб на 100. Чего не хватает, чтобы сравнение было справедливым?",ans:"Размер группы (сравните по каждому клиенту)",choices:["Размер группы (сравните по каждому клиенту)","3D-эффект","Больше цветов","Круговая диаграмма"],hint:"Нормализовать необработанные значения по скорости."},
 {id:12,q:"Заинтересованная сторона будет читать только заголовок. Что там должно быть сказано?",ans:"Понимание (например, «Запад сокращается»)",choices:["Понимание (например, «Запад сокращается»)","«Диаграмма 1»","Имена осей","Источник данных"],hint:"Ведите с выносом."}
],
BUGS:[
 {id:1,config:"Диаграмма: круговая диаграмма\nДанные: 9 категорий товаров одинакового размера.\nЦель: показать, какой товар продавался больше всего",broken:"Девять одинаковых частей пирога невозможно ранжировать: угол и площадь — слабые каналы.",choices:["Используйте гистограмму, отсортированную по продажам по убыванию.","Добавьте метки данных к каждому фрагменту","Для наглядности переключитесь на 3D-круговую диаграмму.","Используйте более яркую цветовую палитру"]},
 {id:2,config:"Диаграмма: гистограмма\nОсь значений: начинается с 95 (значения 98 и 102).\nРезультат: одна полоса выглядит в 3 раза выше другой.",broken:"Усеченная базовая линия преувеличивает крошечный разрыв в 4 единицы, превращая его в огромную разницу в высоте.",choices:["Установите ось значений, чтобы она начиналась с нуля","Сделайте полосы шире","Добавить линию тренда","Сортировка столбцов по алфавиту"]},
 {id:3,config:"Диаграмма: Линейная диаграмма\nОсь X: регион (запад, восток, юг, север)\nРезультат: линия, соединяющая четыре региона.",broken:"Линия подразумевает непрерывное, упорядоченное развитие, но регионы не имеют естественного порядка, поэтому связь бессмысленна.",choices:["Используйте гистограмму: регионы — это категории, а не последовательность.","Обратное направление линии","Добавить больше регионов","Сделайте линию толще"]},
 {id:4,config:"Диаграмма: гистограмма дохода по продуктам\nПорядок: в алфавитном порядке (капучино, колд брю, эспрессо…)\nВопрос: какой товар пользуется наибольшим спросом?",broken:"Алфавитный порядок скрывает рейтинг — глаз не может быстро найти самую большую полосу.",choices:["Сортировка столбцов по убыванию дохода","Раскрасьте каждую полосу по-разному","Переключиться на круговую диаграмму","Добавить вторую ось"]},
 {id:5,config:"Диаграмма: точечная диаграмма\nОтображается заинтересованным сторонам как: «Это доказывает, что расходы на рекламу увеличивают доход».\nДанные: расходы и доходы положительно коррелируют.",broken:"Разброс показывает корреляцию, а не причинно-следственную связь — третий фактор (например, сезонность) может влиять на оба фактора.",choices:["Скажем, они коррелируют, а не то, что одно вызывает другое.","Добавьте 3D-эффект к точкам","Удалите выбросы","Соедините точки линией"]},
 {id:6,config:"Диаграмма: две круговые диаграммы рядом\nЦель: сравнить ассортимент продукции в этом году с прошлым годом.",broken:"Сравнивать два круга очень сложно — глаз не может уловить изменение углов между ними.",choices:["Используйте 100% сложенный батончик (один батончик в год).","Делайте пироги больше","Используйте одинаковые цвета на обоих","Добавьте третий пирог"]},
 {id:7,config:"Диаграмма: трехмерная круговая диаграмма в разобранном виде\nЦель: показать долю доходов каждого региона.",broken:"Трехмерная перспектива искажает область — фрагменты спереди кажутся больше, чем есть на самом деле, что вводит читателя в заблуждение.",choices:["Используйте плоскую гистограмму (или простую двумерную круговую диаграмму, если фрагментов мало).","Поворот 3D-круга","Добавьте больше глубины 3D-эффекту","Взорвите каждый кусочек дальше"]}
],
WRONG:[
 {id:1,q:"Вы хотите показать доход для 6 регионов, чтобы читатель мог их ранжировать. Какой подход лучше и почему?",opts:["Круговая диаграмма, потому что она показывает части целого.","Сортированная гистограмма, поскольку длина считывается точно, а сортировка показывает рейтинг.","Линейный график, потому что он выглядит современно","Трехмерная гистограмма для визуального эффекта"],ans:1,exp:"Ранжирование категорий — это работа с гистограммой: длина — это точный канал, а сортировка ставит порядок прямо перед читателем. Круговая диаграмма скрывает рейтинг по углам; линия означает тренд, которого нет в регионах; 3D искажает."},
 {id:2,q:"Диаграмма коллеги показывает, что продажи «удвоились», но вы заметили, что ось Y начинается с отметки 480 (значения: 500 → 520). Что происходит на самом деле?",opts:["Продажи действительно выросли вдвое","Усеченный базовый уровень преувеличивает увеличение примерно на 4% до визуального удвоения.","Неверный тип диаграммы","Данные являются фейковыми"],ans:1,exp:"С 500 до 520 — это увеличение на 4%. Поскольку ось начинается с отметки 480, этот крошечный разрыв заполняет большую часть графика и выглядит как удвоение. Цифры реальные; усеченная базовая линия искажает то, как они читают. Всегда проверяйте базовую линию."},
 {id:3,q:"Кто-то показывает, что продажи мороженого и случаи солнечных ожогов растут вместе, и приходит к выводу, что мороженое вызывает солнечные ожоги. В чем недостаток?",opts:["Диаграмма должна быть пирогом","Корреляция не является причинно-следственной связью: лето (третий фактор) движет обоими.","Мороженое действительно вызывает солнечные ожоги","Ось обрезана"],ans:1,exp:"Оба повышаются летом, поэтому они коррелируют, но ни один из них не является причиной другого. Разброс или двойная линия могут показывать переменные, движущиеся вместе; оно никогда не сможет доказать причину. Всегда спрашивайте, какой скрытый фактор может управлять обоими."},
 {id:4,q:"Панель мониторинга сравнивает «жалобы» в виде необработанных столбцов: Регион А — 500, Регион Б — 100. А обслуживает 50 000 клиентов; Б обслуживает 5000 человек. Что вводит в заблуждение?",opts:["Ничего: 500 хуже 100.","Неравные базы: на одного клиента ставка A (1%) составляет половину ставки B (2%).","Полоса региона B слишком коротка","Жалобы не должны быть зафиксированы"],ans:1,exp:"При необработанных подсчетах игнорируется тот факт, что компания А обслуживает в 10 раз больше клиентов. Нормализовано: у А 10 жалоб на 1000, а у Б — 20 — на самом деле дела у А идут лучше. Сравнивайте показатели, а не исходные данные, когда размеры групп различаются."},
 {id:5,q:"Вам нужно объяснить диаграмму доходов руководителям, которые прочитают ее за 5 секунд. Что важнее всего?",opts:["Включая каждую точку данных, чтобы ничего не пропало","Познавательный заголовок и краткое объяснение","Нейтральный заголовок метки оси, чтобы вы не предвзято относились к ним.","Большая красочная трехмерная диаграмма."],ans:1,exp:"Скиммеры читают заголовок и, возможно, одно предложение. Проницательный заголовок («Запад — наш единственный сокращающийся регион») и объяснение, ставящее в первую очередь заключение, немедленно доносят суть сообщения. Нейтральные метки и дампы данных заставляют их проводить ваш анализ."},
 {id:6,q:"На диаграмме изображены 12 перекрывающихся линий для 12 продуктов с течением времени. Читатели не могут за этим следить. Лучшее исправление?",opts:["Добавьте больше цветов","Выделите одну или две линии, которые имеют значение, а остальные закрасьте серым (или используйте небольшие кратные строки).","Переключиться на одну круговую диаграмму","Увеличьте диаграмму"],ans:1,exp:"Двенадцать строк — это спагетти. Выделите одну или две серии, которые несут сообщение, и заглушите остальные, или разбейте их на небольшие серии (сетка мини-линейных диаграмм). Больше цветов только добавляет шума."},
 {id:7,q:"Какой вариант названия лучше всего подойдет заинтересованной стороне?",opts:["«Доход по регионам» — нейтрально и безопасно","«Запад — наш единственный регион с падающими доходами», — говорится в выводе","Без названия, чтобы оставаться объективным","«Диаграмма 3 (окончательная, версия 2)»"],ans:1,exp:"Заголовок — это наиболее читаемый текст на слайде. Потратьте их на понимание, чтобы сообщение выдержало даже взгляд. Нейтральные метки описывают оси, но оставляют читателю возможность провести анализ, для которого вас наняли."}
],
PARSONS:[
 {id:1,q:"Порядок действий для выбора правильного графика:",ans:["Сформулируйте вопрос (сравнить? тенденция? связь?)","Сопоставьте форму вопроса с типом диаграммы","Проверьте кодировку (нулевая базовая линия и т. д.)","Создавайте и называйте с пониманием"]},

GLOSSARY:[

const SK='clk-v1';
let S={done:{},lastLesson:null,theme:'light'};
function load(){try{const s=JSON.parse(localStorage.getItem(SK));if(s)S={...S,...s};}catch(e){}
  document.documentElement.setAttribute('data-theme',S.theme||'light');updateThemeBtn();}
function save(){localStorage.setItem(SK,JSON.stringify(S));}
function markDone(key){if(!S.done[key]){S.done[key]=true;save();}}
function toggleTheme(){S.theme=(S.theme==='light')?'dark':'light';document.documentElement.setAttribute('data-theme',S.theme);save();updateThemeBtn();}
function updateThemeBtn(){const b=document.getElementById('themeBtn');if(!b)return;b.innerHTML=(S.theme==='light')?"<i data-lucide=\"sun\" style=\"width:14px;height:14px;vertical-align:-2px\"></i>Свет":"<i data-lucide=\"moon\" style=\"width:14px;height:14px;vertical-align:-2px\"></i> Темный";if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();}
function showToast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
function celebrate(ok,msg){showToast(msg);}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function activateView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));}
function navigate(view,arg){
  guided=null;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===view));
  window.scrollTo(0,0);
  if(view==='home'){activateView('view-home');renderHome();}
  else if(view==='lessons'){activateView('view-lessons');renderLessons();}
  else if(view==='practice'){activateView('view-practice');renderDrillList();}
  else if(view==='cards'){activateView('view-cards');renderCards();}
  else if(view==='glossary'){activateView('view-glossary');renderGlossary();}
  else if(view==='settings'){activateView('view-settings');renderSettings();}
}

function renderLessons(){
  let html="<h1>Уроки</h1><p>Работайте сверху вниз. Каждый урок заканчивается несколькими быстрыми практическими упражнениями перед следующим.</p>";
  let unit=null;
  DATA.LESSONS.forEach(l=>{
    if(l.unit!==unit){unit=l.unit;html+=`<div class="unit-label">${esc(unit)}</div>`;}
    const done=S.done['lesson'+l.id];
    html+=`<div class="lesson-row" onclick="openLesson(${l.id})">
      <div class="lesson-num${done?' done':''}">${done?'✓':''}</div>
      <div class="lesson-info"><div class="lesson-title">${esc(l.title)}${l.core?" <span class=\"tag accent\" style=\"font-size:10px\">Основной</span>":''}</div><div class="lesson-sub">${esc(l.sub||'')}</div></div>
      <span style="color:var(--dim)">›</span></div>`;
  });
  document.getElementById('view-lessons').innerHTML=html;
}

function openLesson(id){
  const l=DATA.LESSONS.find(x=>x.id===id);if(!l)return;
  S.lastLesson=id;save();
  activateView('view-lesson');window.scrollTo(0,0);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.v==='lessons'));

  let ral='';
  (l.ral||[]).forEach(b=>{
    ral+='<div class="ral-block">';
    if(b.title)ral+=`<div class="ral-title">${esc(b.title)}</div>`;
    if(b.say)ral+=`<div class="ral-say">${esc(b.say)}</div>`;
    if(b.code)ral+=`<div class="code-block" style="margin-bottom:10px">${esc(b.code)}</div>`;

  const viz=l.viz?`<div class="card">${l.viz.html||''}<div class="viz-cap">${esc(l.viz.caption||'')}</div></div>`:'';
  const q=l.quiz?`<div class="quiz-wrap"><h3>Быстрая проверка</h3><p style="color:var(--text)">${esc(l.quiz.q)}</p>

  document.getElementById('view-lesson').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btn-sm" onclick="navigate('lessons')">← Уроки</button>
      <span style="color:var(--dim);font-size:13px">урок${pos} из ${DATA.LESSONS.length}</span></div>

    ${l.notes?`<div class="gotcha"><strong>Осторожно:</strong> ${l.notes}</div>`:''}
    ${viz}
