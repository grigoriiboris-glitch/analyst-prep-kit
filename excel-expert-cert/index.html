<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:58px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}

<div class="toast" id="toast"></div>

<script>
/* ============== STATE ============== */
const STORE = 'apk-excelexpertcert';
const EXAM_MINUTES = 50;   // Certiport lists 50 minutes for MOS exams (Exam lengths page, read 2026-08-22).
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ API Антропный на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':"Верно"},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель Excel, помогающий кому-то подготовиться к экзамену Специалист по Майкрософт Офис Эксперт по Excel (MO-211, Майкрософт 365 Приложения). Этот экзамен основан на производительности в реальном Excel и охватывает защиту и настройки книги, настраиваемые числовые форматы, проверку данных, условное форматирование, расширенные формулы (LET, XLOOKUP, IFS, SWITCH, SUMIFS, PMT, NPER, FILTER, SORTBY), анализ «что если», аудит формул, записанные макросы, сводные таблицы, сводные диаграммы и расширенные типы диаграмм.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, какую задачу вам, скорее всего, поставит экзамен. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

      `<strong>Цвета и условия указаны в квадратных скобках.</strong> <code>[Красный]</code>, <code>[Синий]</code> и еще шесть названных цветов; такие условия, как <code>[<=100][Красный];[>100][Синий]</code>. Коды даты <code>д дд ддд дддд</code>, <code>м мм ммм мммм</code>, <code>уууууу</code>; <code>@</code> это текстовый заполнитель.`,
      `<strong>Проверка данных — это Данные ▸ Проверка данных.</strong>тот<em>Настройки</em> на вкладке «Разрешить» выбирается тип «Любое значение», «Целое число», «Десятичный», <strong>список</strong>, Дата, Время, Длина текста, <strong>Обычай</strong>. Обычай принимает формулу, которая должна возвращать TRUE, поэтому <code>=A2<>""</code> или <code>=СЧЁТЕСЛИ($A:$A,A2)=1</code> честная игра.`,
      `<strong>Источником списка являются либо типизированные значения, разделенные запятыми, либо диапазон.</strong>Держать<em>Раскрывающийся список внутри ячейки</em> проверено, или стрелка исчезнет. <em>Входное сообщение</em> Вкладка показывает подсказку, когда ячейка выбрана; тот <em>Оповещение об ошибке</em> Вкладка управляет тем, что происходит при неправильном вводе.`,
      `<strong>Три стиля оповещения об ошибках — любимая ловушка экзамена.</strong> <strong>Останавливаться</strong> категорически отвергает запись. <strong>Предупреждение</strong> спрашивает «Да» или «Нет» и позволяет пользователю сохранить неправильное значение. <strong>Информация</strong> просто говорит им и принимает это. Только Останавливаться фактически блокирует.`,
      `<strong>Обведите неверные данные находит то, что проскользнуло до существования правила.</strong> Данные ▸ Раскрывающийся список «Проверка данных» ▸ <strong>Обведите неверные данные</strong> рисует красные овалы вокруг каждой ячейки, нарушая ее правило. <em>Очистить круги проверки</em> удаляет их.`,
      `<strong>Группируйте и разгруппируйте строки или столбцы в разделе «Данные» ▸ «Структура».</strong> Выберите строки, Данные ▸ <strong>Группа</strong>и слева появятся кнопки контура. <code>Альт+Шифт+=</code> показывает детали, <code>Alt+Shift+-</code> скрывает это. Кнопки уровня 1 2 3 сворачивают весь лист на эту глубину.`,
      `<strong>Для промежуточного итога сначала требуется сортировка.</strong> Отсортируйте по столбцу, по которому хотите разбить, затем Данные ▸ Структура ▸ <strong>Итого</strong>. Заполнять <em>При каждом изменении в</em>, <em>Использовать функцию</em>, <em>Добавить промежуточный итог</em>. Снимите флажок <em>Заменить текущие промежуточные итоги</em> вложить второй уровень. <em>Удалить все</em> очищает это.`,
      `<strong>Промежуточный итог выделен серым цветом внутри таблицы Эксель.</strong> Сначала преобразуйте таблицу в диапазон (Дизайн таблицы ▸ Преобразовать в диапазон). Под капотом каждая строка промежуточного итога представляет собой <code>ПРОМЕЖУТОЧНЫЙ ИТОГО()</code> формула, поэтому она игнорирует строки, скрытые фильтрацией.`,
      `<strong>Удалить дубликаты — Данные ▸ Удалить дубликаты.</strong> Отметьте столбцы, определяющие «дубликат»; строка удаляется только тогда, когда она соответствует каждому отмеченному столбцу. <strong>первое вхождение сохраняется</strong>, остальные будут удалены без возможности восстановления, поэтому, если у вас есть сомнения, сначала скопируйте данные.`,
      `<strong>Пользовательское правило начинается с меню «Главная» ▸ «Условное форматирование» ▸ «Новое правило».</strong> Выберите тип правила: отформатируйте все ячейки по их значениям (гистограммы данных, цветовые шкалы, наборы значков), только ячейки, которые содержат: верхние или нижние позиции, выше или ниже среднего, уникальные или повторяющиеся или <strong>Используйте формулу, чтобы определить, какие ячейки нужно форматировать.</strong>.`,
      `<strong>Правило формулы записывается для левой верхней ячейки выделенного фрагмента.</strong> Excel копирует его по всему диапазону, как заливку, поэтому привяжите его с помощью <code>$</code> нарочно. Чтобы заштриховать целые строки, где столбец D превышает 500, выделите строки и напишите <code>=$D2>500</code>. Заблокируйте столбец, оставьте строку относительной.`,
      `<strong>Управление правилами управляет порядком и областью действия.</strong> Главная ▸ Условное форматирование ▸ <strong>Управление правилами</strong> показывает правила для выделения или всего листа. Правила оцениваются сверху вниз; Двигаться вверх и Вниз меняют приоритет и <strong>Стоп, если правда</strong> останавливает оценку после срабатывания правила. Параметр «Стоп, если истина» недоступен для гистограмм, цветовых шкал или наборов значков.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Предупреждения и информационные оповещения также останавливают неверные данные, просто они звучат мягче». Нет. Только <strong>Останавливаться</strong> стиль отклоняет запись. Предупреждение спрашивает: «Продолжить?» и принимает значение Да; Информация принимает его, как только пользователь нажимает ОК. Если в задаче написано «предотвратить», «нельзя разрешить» или «отклонить», ответ — «Стоп». Если написано «предупреждать, но разрешать», это предупреждение.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:160px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);font-family:var(--mono);font-size:12.5px"><b style="font-family:var(--font)">#,##0.00;[Красный](#,##0.00);"-";@</b><div style="color:var(--dim);font-family:var(--font);font-size:12px;margin-top:4px">позитивный; отрицательный; ноль; текст</div></div>
      <div style="flex:1;min-width:160px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>=$D2>500</b><div style="color:var(--dim);font-size:12px;margin-top:4px">правило формулы: заблокировать столбец, освободить строку, записанную для верхней левой ячейки</div></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">На самом деле речь идет о двух струнах. Произнесите каждую часть вслух.</div>`},

  {key:'d3', title:"Создавайте расширенные формулы и макросы: логика, поиск, даты, «что если», аудит, запись.",
    must:[
      `<strong>IFS заменяет вложенный IF.</strong> <code>=IFS(тест1, значение1, тест2, значение2, ...)</code>, до 127 пар, возвращает первое значение TRUE. Без совпадения он возвращается <code>#Н/Д</code>, поэтому идиома представляет собой последнюю пару <code>ВЕРНО, «Другое»</code> как всеобщее.`,
      `<strong>SWITCH сравнивает одно выражение со списком значений.</strong> <code>=SWITCH(выражение, значение1, результат1, [значение2, результат2], ..., [по умолчанию])</code>. По умолчанию это последний аргумент сам по себе. Используйте IFS для диапазонов и сравнений, SWITCH для точных совпадений.`,
      `<strong>Все семейство IFS имеет один порядок аргументов.</strong> <code>СУММЕСЛИМ(диапазон_суммы, диапазон_критериев1, критерий1, ...)</code>, <code>AVERAGEIFS</code>, <code>MAXIFS</code>, <code>MINIFS</code> сначала поместите диапазон для расчета. <code>COUNTIFS(диапазон_критерия1, критерий1, ...)</code> не имеет диапазона сумм. Единственное число <code>СУММЕСЛИ(диапазон, критерии, [диапазон_суммы])</code> диапазон сумм ставится последним, что является ловушкой.`,
      `<strong>Критерии — это строки.</strong> <code>">="&B1</code>, <code>"<>Бананы"</code>, <code>"А*"</code>. Подстановочные знаки: <code>*</code> любой набор персонажей, <code>?</code> один персонаж, <code>~</code> чтобы избежать буквальной звезды или вопросительного знака. Каждый диапазон критериев должен иметь ту же форму, что и диапазон суммы.`,
      `<strong>И, ИЛИ и НЕ заходить внутрь ЕСЛИ.</strong> <code>=ЕСЛИ(И(A2>0, B2="Оплачено"), "ОК", "Проверить")</code>. И требует, чтобы каждый тест был ИСТИННЫМ, ИЛИ нужен один, а НЕ переворот. Они возвращают TRUE или FALSE, что также требуется для формулы условного формата или пользовательской проверки.`,
      `<strong>LET называет значение один раз и повторно использует его.</strong> <code>=LET(имя1, значение1, [имя2, значение2, ...], вычисление)</code>, до 126 пар имя-значение, а последним аргументом должно быть вычисление. <code>=LET(х, A1*2, ЕСЛИ(х>10, х, 0))</code>. Имена должны начинаться с буквы и не могут выглядеть как ссылка на ячейку.`,
      `<strong>XLOOKUP имеет шесть аргументов, и по умолчанию используется точное совпадение.</strong> <code>=XLOOKUP(искомое_значение, искомый_массив, возвращаемый_массив, [если_не_найден], [режим_соответствия], [режим_поиска])</code>. Он смотрит влево или вправо, возвращает целые строки и <code>if_not_found</code> заменяет <code>#Н/Д</code> без ЕСЛИОШИБКИ.`,
      `<strong>Знайте номера режим_сопоставления и режим_поиска.</strong>режим_сопоставления<code>0</code> точный (по умолчанию), <code>-1</code> точный или ближайший меньший, <code>1</code> точный или следующий больший, <code>2</code> подстановочный знак. режим_поиска <code>1</code> от первого до последнего (по умолчанию), <code>-1</code> от последнего к первому, <code>2</code> и <code>-2</code> двоичный поиск по отсортированным данным.`,
      `<strong>ВПР и ГПР по-прежнему отображаются в контуре.</strong> <code>=ВПР(значение, таблица, индекс_столбца, [просмотр_диапазона])</code> смотрит только вправо от первого столбца, и <code>range_lookup</code> по умолчанию — TRUE (приблизительно), поэтому введите <code>FALSE</code> для точного. HLOOKUP — это то же самое, но с индексом строки.`,
      `<strong>ИНДЕКС и ПОИСКПОЗ — это поиск, который работает в любом направлении.</strong> <code>=ИНДЕКС(диапазон возвращаемого_диапазона, ПОИСКПОЗ(значение,диапазон_поиска, 0))</code>. ПОИСКПОЗ возвращает позицию, ИНДЕКС возвращает элемент в этой позиции. тип_соответствия <code>0</code> является точным; <code>1</code> (по умолчанию) требуются возрастающие данные; <code>-1</code> нужен спуск.`,
      `<strong>СЕЙЧАС и СЕГОДНЯ не принимайте аргументов</strong> и оба пересчитывают. <code>=СЕГОДНЯ()</code> это дата; <code>= СЕЙЧАС()</code> это дата плюс время, поэтому <code>=СЕЙЧАС()-СЕГОДНЯ()</code> это часть сегодняшнего дня, которая прошла. Ни один из них не является фиксированной отметкой времени; <code>Ctrl+;</code> является.`,
      `<strong>ДЕНЬНЕД возвращает число, ДЕНЬНЕД возвращает дату.</strong> <code>=ДЕНЬНЕД(дата, [тип_возврата])</code> дает от 1 до 7; тип 1 (по умолчанию) начинается в воскресенье, тип 2 начинается в понедельник, тип 3 начинается от 0 до 6 с понедельника. <code>=РАБДЕНЬ(начальная_дата, дни, [праздники])</code> добавляет рабочие дни, пропуская выходные и любые даты в диапазоне праздников.`,
      `<strong>Консолидация суммирует один и тот же макет из нескольких листов.</strong> Данные ▸ Инструменты работы с данными ▸ <strong>Консолидировать</strong>: выберите функцию, добавьте каждый исходный диапазон, отметьте галочкой <em>Верхний ряд</em> и <em>Левый столбец</em> для консолидации по категории (соответствующие метки), а не по позиции, и отметьте галочкой <strong>Создание ссылок на исходные данные</strong> чтобы сохранить его в живых.`,
      `<strong>В Поиск цели ровно три поля.</strong> Данные ▸ Анализ «что если» ▸ <strong>Поиск цели</strong>: <em>Установить ячейку</em> (формула), <em>Ценить</em> (результат, который вы хотите), <em>Сменив ячейку</em> (один вход, от которого зависит формула). Только одна переменная.`,
      `<strong>Диспетчер сценариев хранит именованные наборы входных данных.</strong> Данные ▸ Анализ «что если» ▸ <strong>Менеджер сценариев</strong> ▸ Добавьте, назовите его, выберите <em>Изменение ячеек</em> (до 32), введите значения. <strong>показывать</strong> меняет их местами; <strong>краткое содержание</strong> создает сводку сценария или отчет сводной таблицы сценария на основе выбранных ячеек результатов.`,
      `<strong>PMT и NPER — это две названные финансовые функции.</strong> <code>=PMT(ставка, например, пв, [фв], [тип])</code> возвращает платеж, отрицательный, потому что это выводятся наличные. <code>=NPER(ставка, вечернее время, PV, [фв], [тип])</code> возвращает количество платежей. Сохраняйте единообразие единиц измерения: средние значения за месяц <code>rate/12</code> и <code>лет*12</code>.`,
      `<strong>FILTER и SORTBY — динамические массивы.</strong> <code>= ФИЛЬТР (массив, включить, [если_пусто])</code> выдает соответствующие строки и возвращает <code>#КАЛК!</code> ни на одном совпадении, если только <code>if_empty</code> дано. <code>=СОРТИРОВКА(массив, по_массив1, [сорт_порядок1], ...)</code> сортирует один диапазон по другому; заказ <code>1</code> по возрастанию (по умолчанию) или <code>-1</code> нисходящий.`,
      `<strong>Аудит формул — это одна группа ленты.</strong>: Формулы ▸ Аудит формул. <strong>Отслеживание прецедентов</strong> рисует стрелки из ячеек, которые использует формула; <strong>Зависимые от трассировки</strong> рисует стрелки к формулам, использующим эту ячейку; <strong>Удалить стрелки</strong> очищает их. Синие стрелки — это нормально, красные стрелки указывают на ошибки.`,
      `<strong>Окно просмотра, проверка ошибок и оценка формулы — это три другие кнопки.</strong> <strong>Окно просмотра</strong> закрепляет ячейки из других листов, чтобы вы могли видеть их значение и формулу во время работы. <strong>Проверка ошибок</strong> обходит клетки зеленого треугольника по одной; его правила находятся в меню «Файл» ▸ «Параметры» ▸ «Формулы». <strong>Оценить формулу</strong> выполняет расчет по частям с помощью Оценивать, Шаг вперед и Выйдите.`,
      `<strong>Запишите макрос на вкладке «Разработчик».</strong> Разработчик ▸ <strong>Запись макроса</strong>: дай это <em>Имя макроса</em> (без пробелов; начинайте с буквы), необязательно <em>Сочетание клавиш</em>, выбирать <em>Сохранить макрос в</em> (Эта книга, Новая книга, Личная книга макросов), добавьте описание, ОК, выполните действия, <strong>Остановить запись</strong>. Включите вкладку «Файл» ▸ «Параметры» ▸ «Настроить ленту», если она скрыта.`,
      `<strong>Отредактируйте макрос в редакторе Визуальный Бейсик.</strong> Разработчик ▸ <strong>Макросы</strong> (<code>Alt+F8</code>), выберите его, <strong>Редактировать</strong>или нажмите <code>Alt+F11</code>. Переименование означает изменение <code>Подимя()</code> линия.<em>Используйте относительные ссылки</em> на вкладке «Разработчик» решает, будет ли записанный ход «перейти к B5» или «спуститься на две строки отсюда».`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «SUMIF и SUMIFS принимают свои аргументы в одном и том же порядке». Они этого не делают, и экзамен любит подмену. <code>СУММЕСЛИ(диапазон, критерии, [диапазон_суммы])</code> сначала тесты, а потом суммы. <code>СУММЕСЛИМ(диапазон_суммы, диапазон_критериев1, критерий1, ...)</code> Сначала суммы, а потом тесты. AVERAGEIF и AVERAGEIFS следуют одному и тому же разделению. Если вы помните только одно правило, помните: «Множественное число S означает сначала диапазон суммы».`,
    viz:`<div style="display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">точно, в любом направлении</span><br>=XПРОМ(<b>id</b>, A:A, C:C, «нет»)</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">то же самое, классический способ</span><br>=ИНДЕКС(C:C, ПОИСКПОЗ(<b>id</b>, А:А, 0))</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">только выглядит правильно, нужно ЛОЖЬ</span><br>=ВПР(<b>id</b>, А:С, 3, ЛОЖЬ)</div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px;font-family:var(--font)">Три написания одного поиска. Экзамен принимает любой, который возвращает правильное значение.</div>`},

  {key:'d4', title:"Управление расширенными диаграммами и таблицами: двухосные, статистические диаграммы, сводные таблицы, сводные диаграммы.",
    must:[
      `<strong>Двухосевая диаграмма — это комбинированная диаграмма с одним рядом на вторичной оси.</strong> Выберите диаграмму ▸ Дизайн диаграммы ▸ <strong>Изменить тип диаграммы</strong> ▸ <strong>Комбо</strong>, выберите тип диаграммы для каждой серии и отметьте галочкой <strong>Вторичная ось</strong> для того, чьи числа находятся в другом масштабе. Предустановка <em>Кластеризованный столбец — линия на вторичной оси</em> делает это в один клик.`,

    explain:`Список с источником <code>=$H$2:$H$6</code>. Только стиль «Стоп» отклоняет вход; И «Предупреждение», и «Информация» позволяют пользователю сохранить неверное значение.`},
  {id:'q14', domain:'d2', type:'mc', q:`Пользователь вводит недопустимое значение в проверенную ячейку, и появляется диалоговое окно с кнопками «Да» и «Нет». Какой стиль оповещения об ошибках установлен?`,
    choices:[`Останавливаться`, `Предупреждение`, `Информация`, `Обычай`],
    correct:1,
    explain:`Предупреждение спрашивает, продолжать ли, и принимает значение Да. «Стоп» предлагает только «Повторить» или «Отменить». Информация показывает «ОК» и принимается.`},
  {id:'q15', domain:'d2', type:'mc', q:`Правила проверки были добавлены после ввода данных. Как увидеть, какие существующие клетки их разрушают?`,
    choices:[`Данные ▸ Проверка данных ▸ Обведите неверные данные`, `Формулы ▸ Проверка ошибок`, `Home ▸ Find &amp; Select ▸ Go To Special ▸ Data validation`, `Обзор ▸ Проверить доступность`],
    correct:0,
    explain:`Обведите неверные данные красными кружками вокруг ячеек, которые нарушают их правило. Параметр «Перейти к специальному» выбирает только те ячейки, которые имеют проверку, действительную или нет.`},
  {id:'q16', domain:'d2', type:'mc', q:`Данные ▸ Промежуточный итог выделен серым цветом. Почему?`,
    choices:[`Данные не отсортированы`, `Данные отформатированы в виде таблицы Эксель.`, `Лист имеет более одного уровня структуры.`, `Столбец содержит текст`],
    correct:1,
    explain:`Промежуточные итоги не поддерживаются внутри таблицы Эксель. Преобразуйте его в диапазон (Дизайн таблицы ▸ Преобразовать в диапазон), и команда вернет результат. Несортированные данные дают неправильные промежуточные итоги, но кнопка не становится серой.`},
  {id:'q17', domain:'d2', type:'mc', q:`Вы запускаете «Удалить дубликаты», отметив только столбец «Электронная почта». Две строки имеют общий адрес электронной почты, но имеют разные имена. Что происходит?`,
    choices:[`Ни одна строка не удаляется, поскольку имена различаются.`, `Второй ряд удаляется; первое вхождение сохраняется`, `Обе строки удалены`, `Excel спрашивает, какой из них сохранить`],
    correct:1,
    explain:`Дубликаты оцениваются только по отмеченным столбцам. Первое вхождение остается, а последующие совпадения удаляются без возможности восстановления.`},
  {id:'q18', domain:'d2', type:'mc', q:`A2: F50 выбран. Какое правило формулы затеняет всю строку, если значение этой строки в столбце E больше 1000?`,
    choices:[`<code>=Е2>1000</code>`, `<code>=$E2>1000</code>`, `<code>=$E$2>1000</code>`, `<code>=E$2>1000</code>`],
    correct:1,
    explain:`Правило записывается для верхней левой ячейки (A2) и копируется по всему диапазону. Блокировка колонны с помощью <code>$Е</code> каждая ячейка в строке смотрит на столбец E, а номер разблокированной строки перемещается вниз.`},
  {id:'q19', domain:'d2', type:'ms', q:`Какие утверждения об условном форматировании ▸ Управление правилами верны? <em>Выберите все, что применимо.</em>`,
    choices:[`Правила оцениваются сверху вниз.`, `Стоп, если правда останавливает оценку более низких правил, если правило истинно.`, `Стоп, если правда можно установить в правиле панели данных.`, `Двигаться вверх и Вниз меняют приоритет`],
    correct:[0,1,3],
    explain:`Высшие правила побеждают. Параметр «Стоп, если Верно» останавливает применение более низких правил, но недоступен для гистограмм, цветовых шкал и наборов значков.`},
  {id:'q20', domain:'d2', type:'mc', q:`Какое сочетание клавиш скрывает строки сведений выбранной группы структуры?`,
    choices:[`Альт+Шифт+=`, `Alt+Shift+-`, `Ctrl+9`, `Ctrl+Shift+(`],
    correct:1,
    explain:`<code>Alt+Shift+-</code> сворачивает группу; <code>Альт+Шифт+=</code> расширяет его. Ctrl+9 скрывает строки без контура.`},

  /* ---------- AREA 3 · Advanced formulas and macros (13) ---------- */
  {id:'q21', domain:'d3', type:'mc', q:`Какая формула возвращает «А» для 90 и выше, «Б» для 80–89 и «С» для всего остального?`,
    choices:[`<code>=IFS(A2>=90,"A",A2>=80,"B","C")</code>`, `<code>=ЕСЛИ(A2>=90,"A",A2>=80,"B",ИСТИНА,"C")</code>`, `<code>=ПЕРЕКЛЮЧАТЕЛЬ(A2,90,"A",80,"B","C")</code>`, `<code>=ЕСЛИ(A2>=90,"A","B","C")</code>`],
    correct:1,
    explain:`IFS нужны пары, так что все дело в том, <code>ВЕРНО, "С"</code>. Без него значения ниже 80 возвращают #Н/Д. ВЫКЛЮЧАТЕЛЬ проверяет точные совпадения, а не диапазоны.`},
  {id:'q22', domain:'d3', type:'mc', q:`Какая формула суммирует столбец D, где в столбце B указано «Восток», а в столбце C больше 500?`,
    choices:[`<code>=СУММИФ(B:B,"Восток",C:C,">500",D:D)</code>`, `<code>=СУММИФ(D:D,B:B,"Восток",C:C,">500")</code>`, `<code>=СУММЕСЛИ(B:B,"Восток",C:C,">500",D:D)</code>`, `<code>=СУММИФ(D:D,B:B="Восток",C:C>500)</code>`],
    correct:1,
    explain:`SUMIFS сначала помещает диапазон суммы, затем диапазон критериев и пары критериев с критериями в виде текста. СУММЕСЛИ принимает только одно условие.`},
  {id:'q23', domain:'d3', type:'mc', q:`Что значит<code>=LET(х, A1*12, ЕСЛИ(х>100, х, 0))</code> делать?`,
    choices:[`Возвращает ошибку, поскольку LET нужны три пары.`, `Сохраняет A1*12 как х, затем возвращает х, если оно больше 100, и 0 в противном случае.`, `Создает именованный диапазон с именем х в диспетчере имен.`, `Умножает A1 на 12 и на 100.`],
    correct:1,
    explain:`LET связывает имя со значением на время действия формулы, а затем оценивает окончательный расчет. Имя существует только внутри формулы.`},
  {id:'q24', domain:'d3', type:'mc', q:`XLOOKUP возвращает #Н/Д, если идентификатор отсутствует. Какой аргумент заменяет это на «Не найдено»?`,
    choices:[`режим_сопоставления`, `if_not_found`, `режим_поиска`, `return_array`],
    correct:1,
    explain:`Четвертый аргумент, <code>if_not_found</code>, является встроенным резервным вариантом: <code>=XLOOKUP(id, A:A, C:C, «Не найден»)</code>. Обертка IFERROR не требуется.`},
  {id:'q25', domain:'d3', type:'mc', q:`В XLOOKUP какой режим режим_сопоставления возвращает точное совпадение или следующее меньшее значение?`,
    choices:[`0`, `1`, `-1`, `2`],
    correct:2,
    explain:`0 — только точный, -1 — точный или ближайший к нему меньший, 1 — точный или ближайший к нему больший, 2 — подстановочный знак.`},
  {id:'q26', domain:'d3', type:'mc', q:`Искомое значение находится в столбце D, а возвращаемое значение — в столбце A. Какая формула работает?`,
    choices:[`<code>=ВПР(G2,A:D,1,ЛОЖЬ)</code>`, `<code>=ИНДЕКС(A:A,MATCH(G2,D:D,0))</code>`, `<code>= ПРОСМОТР (G2, A: D, 1, ЛОЖЬ)</code>`, `<code>=ПОИСКПОЗ(G2,D:D,0)</code>`],
    correct:1,
    explain:`ВПР возвращает только столбцы справа от столбца поиска. ИНДЕКС/МАТЧ (или XLOOKUP) смотрит в любом направлении. Только ПОИСКПОЗ возвращает позицию, а не значение.`},
  {id:'q27', domain:'d3', type:'mc', q:`<code>=ДЕНЬНЕД(A2,2)</code> возвращает 1. Какой день в A2?`,
    choices:[`Воскресенье`, `Понедельник`, `Суббота`, `Пятница`],
    correct:1,
    explain:`тип_возврата 2 нумерует неделю с понедельника = 1 по воскресенье = 7. Тип по умолчанию 1 начинается с воскресенья = 1.`},
  {id:'q28', domain:'d3', type:'mc', q:`Какая формула дает дату поставки через 10 рабочих дней после B2, пропуская праздники в H2:H8?`,
    choices:[`<code>=В2+10</code>`, `<code>= РАБДЕНЬ(B2,10,H2:H8)</code>`, `<code>=ДЕНЬНЕД(B2,10,H2:H8)</code>`, `<code>=ЧИСТЫЕДНИ(B2,10,H2:H8)</code>`],
    correct:1,
    explain:`РАБДЕНЬ(начальная_дата, дни, [праздники]) проходит через выходные и указанные праздники и возвращает дату. ДЕНЬНЕД возвращает номер дня; ЧИСТРАБДНИ подсчитывает дни между двумя датами.`},
  {id:'q29', domain:'d3', type:'mc', q:`Формула выплаты кредита находится в B5. Вы хотите, чтобы платеж составил 900, изменив процентную ставку в B3. Что находится в каждой коробке в Поиск цели?`,
    choices:[`Установите ячейку B3, значение 900, изменив ячейку B5.`, `Установите ячейку B5, значение 900, изменив ячейку B3.`, `Установите ячейку B5, значение B3, изменив ячейку 900.`, `Установите ячейку B3, значение B5, изменив ячейку 900.`],
    correct:1,
    explain:`Установить ячейку — это формула. Значение — цель. Изменение ячейки — это единственный ввод, от которого зависит формула.`},
  {id:'q30', domain:'d3', type:'mc', q:`Какая формула возвращает ежемесячный платеж по кредиту в размере 200 000 долларов США под 6% годовых в течение 30 лет?`,
    choices:[`<code>=ПЛТ(6%,30,200000)</code>`, `<code>=ПЛТ(6%/12,30*12,200000)</code>`, `<code>=КПЕР(6%/12,30*12,200000)</code>`, `<code>=ПЛТ(200000,6%/12,360)</code>`],
    correct:1,
    explain:`PMT(ставка, например, пв). Ставка и периоды должны иметь одну единицу измерения, поэтому месяц означает 6%/12 и 30*12. Результат отрицательный, поскольку это исходящий платеж.`},
  {id:'q31', domain:'d3', type:'ms', q:`Какие утверждения о ФИЛЬТРЕ и СОРТИРОВКЕ верны? <em>Выберите все, что применимо.</em>`,
    choices:[`<code>FILTER</code> возвращает #CALC! когда ничего не соответствует и не задан if_empty`, `<code>SORTBY</code> сортировка_порядок использует 1 для возрастания и -1 для убывания.`, `<code>SORTBY</code> можно сортировать только по первому столбцу массива`, `Оба результата переливаются в соседние ячейки.`],
    correct:[0,1,3],
    explain:`FILTER(множество, включать, [if_empty]) и SORTBY(множество, by_array1, [сортировка_заказ1], ...) являются функциями динамического массива. SORTBY сортирует по любому отдельному диапазону, а не только по первому столбцу.`},
  {id:'q32', domain:'d3', type:'mc', q:`При редактировании формул здесь вам необходимо видеть значение ячейки на другом листе. Какой инструмент аудита формул?`,
    choices:[`Зависимые от трассировки`, `Окно просмотра`, `Оценить формулу`, `Показать формулы`],
    correct:1,
    explain:`Окно просмотра закрепляет ячейки из любого листа или книги и показывает их значение и формулу по мере их изменения.`},
  {id:'q33', domain:'d3', type:'mc', q:`Записанный макрос всегда должен форматировать текущую выбранную ячейку, а не фиксированный адрес. Какая опция на вкладке «Разработчик» должна быть включена во время записи?`,
    choices:[`Макробезопасность`, `Используйте относительные ссылки`, `Режим дизайна`, `Запись в личной книге макросов`],
    correct:1,
    explain:`При использовании относительных ссылок записи перемещаются относительно активной ячейки. Без этого регистратор записывает абсолютные адреса типа диапазон("B5").`},

  /* ---------- AREA 4 · Advanced charts and tables (12) ---------- */
  {id:'q34', domain:'d4', type:'mc', q:`Столбчатая диаграмма показывает доход в миллионах и единицах в сотнях, поэтому единицы невидимы. Какие шаги это исправить?`,
    choices:[`Измените тип диаграммы ▸ Комбинация ▸ отметьте «Вторичная ось для единиц измерения».`, `Добавить элемент диаграммы ▸ Метки данных`, `Переключить строку/столбец`, `Ось формата ▸ Логарифмический масштаб на главной оси`],
    correct:0,
    explain:`Двухосевая (комбинированная) диаграмма отображает единицы измерения на собственной вторичной оси, обычно в виде линии. Вторичные оси недоступны на трехмерных диаграммах.`},
  {id:'q35', domain:'d4', type:'mc', q:`Где находится настройка ширины ячейки для гистограммы?`,
    choices:[`Дизайн диаграммы ▸ Добавить элемент диаграммы`, `Формат оси ▸ Параметры оси на горизонтальной оси.`, `Выберите данные`, `Форматирование серии данных ▸ Ширина зазора`],
    correct:1,
    explain:`Ячейки гистограммы («Автоматически», «Ширина ячейки», «Количество ячеек», «Переполненная ячейка», «Нижняя ячейка») — это параметры оси категорий.`},
  {id:'q36', domain:'d4', type:'mc', q:`На диаграмме «Водопад» последний столбец «Чистый доход» плавает, а не начинается с нуля. Что это исправляет?`,
    choices:[`Добавить линию тренда`, `Выберите только эту точку данных ▸ Форматировать точку данных ▸ Установить как итоговую`, `Измените диаграмму на столбец с накоплением`, `Сортировка данных по убыванию`],
    correct:1,
    explain:`Установка «Итог» привязывает точку к оси, чтобы она отображалась как промежуточный итог или итог, а не как увеличение или уменьшение.`},
  {id:'q37', domain:'d4', type:'mc', q:`Какой путь ленты вставляет диаграмму Санберст?`,
    choices:[`Вставить ▸ Вставить статистическую диаграмму`, `Вставить ▸ Вставить иерархическую диаграмму`, `Вставить ▸ Вставить водопад, воронку, запас, поверхность или радарную диаграмму.`, `Вставить ▸ Вставить комбинированную диаграмму`],
    correct:1,
    explain:`Санберст и Древовидная карта — это иерархические диаграммы. Гистограмма и Коробка & Усы — это статистические диаграммы; Водопад и Воронка имеют общую кнопку водопада.`},
  {id:'q38', domain:'d4', type:'mc', q:`Какой параметр находится в параметре «Форматировать ряд данных» для диаграммы «Ящик с усами»?`,
    choices:[`Установить как итог`, `Ширина бункера`, `Расчет квартиля: инклюзивная или исключительная медиана`, `Вторичная ось`],
    correct:2,
    explain:`Параметры серии Коробка & Усы включают отображение внутренних точек, отображение точек выбросов, отображение маркеров среднего значения, отображение средней линии и метод расчета квартилей.`},
  {id:'q39', domain:'d4', type:'mc', q:`Когда следует установить флажок «Добавить эти данные в модель данных» при создании сводной таблицы?`,
    choices:[`Всегда; это делает сводную таблицу быстрее`, `Когда вам нужно связать несколько таблиц или использовать Разное количество`, `Когда источником является таблица Excel`, `Если вы планируете добавить вычисляемое поле`],
    correct:1,
    explain:`Модель данных обеспечивает связи между таблицами и подсчетом уникальных значений. Это также меняет ситуацию: вычисляемые поля заменяются показателями в сводной таблице модели данных.`},
  {id:'q40', domain:'d4', type:'mc', q:`Один срез должен фильтровать две сводные таблицы, созданные из одного источника. Какая команда?`,
    choices:[`Срез ▸ Соединения отчетов`, `Анализ сводной таблицы ▸ Изменение источника данных`, `Данные ▸ Отношения`, `Параметры сводной таблицы ▸ Разрешить несколько фильтров для каждого поля.`],
    correct:0,
    explain:`Выберите срез ▸ вкладка «Срез» ▸ «Соединения с отчетами» и отметьте каждую сводную таблицу. Они должны использовать общий источник данных.`},
  {id:'q41', domain:'d4', type:'mc', q:`Поле строки сводной таблицы содержит ежедневные даты в течение трех лет. Вам нужны продажи по месяцам и годам. Какое действие?`,
    choices:[`Щелкните правой кнопкой мыши дату ▸ Сгруппировать ▸ выберите «Месяцы и годы».`, `Вставить временную шкалу`, `Настройки поля значения ▸ Суммировать по количеству`, `Дизайн ▸ Макет отчета ▸ Табличный`],
    correct:0,
    explain:`Group by Months and Years together so each January stays with its own year. A Timeline filters by date; it does not regroup the rows.`},
  {id:'q42', domain:'d4', type:'mc', q:`Вам нужен новый столбец «Значения», равный «Продажи, умноженные на 1,2», который будет синхронизироваться при обновлении сводной таблицы. Какой инструмент?`,
    choices:[`Формула в столбце рядом со сводной таблицей`, `Анализ сводной таблицы ▸ Поля, элементы и наборы ▸ Вычисляемое поле`, `Анализ сводной таблицы ▸ Поля, элементы и наборы ▸ Вычисляемый элемент`, `Настройки поля значения ▸ Показать значения как ▸ % от`],
    correct:1,
    explain:`Вычисляемое поле использует имена полей (<code>=Продажи*1.2</code>), появится в списке полей и обновится данными. Вместо этого вычисляемый элемент добавляет строку в поле.`},
  {id:'q43', domain:'d4', type:'mc', q:`Продажи каждого региона должны отображаться в процентах от общего объема продаж по всем регионам. Какой выбор настроек поля значений?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

function studyItemHTML(key,i,m){

function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();
}
function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){
  if(!state.reviewFilter && needsReviewCount()===0){ toast("Сначала оцените концепцию «Еще нет» или «Почти», а затем отфильтруйте только их."); return; }
  state.reviewFilter = !state.reviewFilter;
  save(); render();
}

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){
  state.openSections[key] = !state.openSections[key];

function toggleAllStudy(){
  const open = !allStudyOpen();

/* ============== EXAM + OPTIONAL TIMER ==============
   The real MOS exam is 50 minutes of live tasks. The timer here is an optional pacing
   drill against that same length. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}>← Предыдущий</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}
      Ничто не оценивается, пока вы не отправите заявку.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Вопрос${idx} из ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} из ${QUESTIONS.length}. Вопросы без ответа считаются неправильными. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the real exam reports a scaled 1 to 1000 score with 700 to pass (Certiport).
   There is no published mapping from tasks to scaled score, so we grade this knowledge
   check on raw percent and use 70% as OUR line, labelled as ours on the page. */
const PASS_PCT = 70;   // ours, mirrors the 700/1000 shape
const READY_PCT = 85;  // our recommendation, NOT Microsoft's. Margin for the live-app gap

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Очистите нашу 70%-ю линию с комнатой. Теперь повторите ходы в реальном Excel и забронируйте его.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"Выше нашей границы в 70%, но тонкая. Закройте слабое место, повторите его на практике, а затем зарезервируйте.", tone:'warn'};
  if(pct >= 55) return {label:"Под чертой. Поработайте над учебным пособием по приведенным ниже областям, а затем пересдайте его.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практические упражнения · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Против нашей линии: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% (наш)</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий MO-211 оценивает живые задания в Excel по шкале от 1 до 1000 с вероятностью прохождения 700, поэтому воспринимайте это как проверку знаний, а не прогнозирование оценки. ${PASS_PCT}Линия % принадлежит нам и лишь отражает эту форму. ${READY_PCT}%+ здесь плюс удобная практика в приложении = готово.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Повторите это в реальном Excel и двигайтесь дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} раздел исследования</a> один раз, затем выполните задачу в Эксель.`
          : p >= 50 ? `Шаки. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;"> раздел исследования</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Открыть раздел обучения</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать упражнение <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и повторить практическое упражнение?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
