.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}

.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}

.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}

.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}

.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}

.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}

.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}

.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}

.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

.footer-links a:hover{color:var(--accent)}

<script>
/* ============== STATE ============== */
const STORE = 'apk-excelexpertcert';
const EXAM_MINUTES = 50;   // Certiport lists 50 minutes for MOS exams (Exam lengths page, read 2026-08-22).
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Антропный API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель Excel, помогающий кому-то подготовиться к экзамену Специалист по Microsoft Office Эксперт по Excel (MO-211, Майкрософт 365 Приложения). Этот экзамен основан на производительности в реальном Excel и охватывает защиту и настройки книги, настраиваемые числовые форматы, проверку данных, условное форматирование, расширенные формулы (LET, XLOOKUP, IFS, SWITCH, SUMIFS, PMT, NPER, FILTER, SORTBY), анализ «что если», аудит формул, записанные макросы, сводные таблицы, сводные диаграммы и расширенные типы диаграмм.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, какую задачу вам, скорее всего, поставит экзамен. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== STUDY GUIDE ==============

      `<strong>Управляйте этими ссылками в разделе «Данные» ▸ «Запросы и соединения» ▸ «Ссылки на книгу».</strong> На панели можно обновить, изменить источник, открыть источник или <strong>Разрыв ссылок</strong>, который заменяет каждую связанную формулу ее текущим значением и не может быть отменен.`,

      `<strong>Совместное редактирование заменило старую функцию «Общая книга».</strong> Ему нужен файл в OneDrive или SharePoint в современном формате (<code>.xlsx</code>, <code>.xlsm</code>, <code>.xlsb</code>) и включить автосохранение. На собственной странице Майкрософт говорится, что устаревшая функция «была заменена на совместное редактирование», поэтому, если вопрос предлагает и то, и другое, текущим ответом является совместное редактирование.`

      `<strong>Источником списка являются либо типизированные значения, разделенные запятыми, либо диапазон.</strong> Keep <em>Раскрывающийся список внутри ячейки</em> проверено, или стрелка исчезнет. <em>Входное сообщение</em> Вкладка показывает подсказку, когда ячейка выбрана; тот <em>Оповещение об ошибке</em> Вкладка управляет тем, что происходит при неправильном вводе.`,
      `<strong>Три стиля оповещения об ошибках — любимая ловушка экзамена.</strong> <strong>Stop</strong> категорически отвергает запись. <strong>Warning</strong> спрашивает «Да» или «Нет» и позволяет пользователю сохранить неправильное значение. <strong>Information</strong> просто говорит им и принимает это. Только Останавливаться фактически блокирует.`,
      `<strong>Обведите неверные данные находит то, что проскользнуло до существования правила.</strong> Данные ▸ Раскрывающийся список «Проверка данных» ▸ <strong>Обведите неверные данные</strong> рисует красные овалы вокруг каждой ячейки, нарушая ее правило. <em>Очистить круги проверки</em> удаляет их.`,
      `<strong>Группируйте и разгруппируйте строки или столбцы в разделе «Данные» ▸ «Структура».</strong> Выберите строки, Данные ▸ <strong>Group</strong>и слева появятся кнопки контура. <code>Альт+Шифт+=</code> показывает детали, <code>Alt+Shift+-</code> скрывает это. Кнопки уровня 1 2 3 сворачивают весь лист на эту глубину.`,
      `<strong>Для промежуточного итога сначала требуется сортировка.</strong> Отсортируйте по столбцу, по которому хотите разбить, затем Данные ▸ Структура ▸ <strong>Subtotal</strong>. Заполнять <em>При каждом изменении в</em>, <em>Использовать функцию</em>, <em>Добавить промежуточный итог</em>. Снимите флажок <em>Заменить текущие промежуточные итоги</em> вложить второй уровень. <em>Удалить все</em> очищает это.`,
      `<strong>Промежуточный итог выделен серым цветом внутри таблицы Эксель.</strong> Сначала преобразуйте таблицу в диапазон (Дизайн таблицы ▸ Преобразовать в диапазон). Под капотом каждая строка промежуточного итога представляет собой <code>ПРОМЕЖУТОЧНЫЙ ИТОГО()</code> формула, поэтому она игнорирует строки, скрытые фильтрацией.`,
      `<strong>Удалить дубликаты — Данные ▸ Удалить дубликаты.</strong> Отметьте столбцы, определяющие «дубликат»; строка удаляется только тогда, когда она соответствует каждому отмеченному столбцу. <strong>первое вхождение сохраняется</strong>, остальные будут удалены без возможности восстановления, поэтому, если у вас есть сомнения, сначала скопируйте данные.`,
      `<strong>Пользовательское правило начинается с меню «Главная» ▸ «Условное форматирование» ▸ «Новое правило».</strong> Выберите тип правила: отформатируйте все ячейки по их значениям (гистограммы данных, цветовые шкалы, наборы значков), только ячейки, которые содержат: верхние или нижние позиции, выше или ниже среднего, уникальные или повторяющиеся или <strong>Используйте формулу, чтобы определить, какие ячейки нужно форматировать.</strong>.`,
      `<strong>A formula rule is written for the top-left cell of the selection.</strong> Excel copies it across the range like a fill, so anchor with <code>$</code> on purpose. To shade whole rows where column D is over 500, select the rows and write <code>=$D2&gt;500</code>. Lock the column, leave the row relative.`,
      `<strong>Управление правилами управляет порядком и областью действия.</strong> Главная ▸ Условное форматирование ▸ <strong>Управление правилами</strong> показывает правила для выделения или всего листа. Правила оцениваются сверху вниз; Двигаться вверх и Вниз меняют приоритет и <strong>Стоп, если правда</strong> останавливает оценку после срабатывания правила. Параметр «Стоп, если истина» недоступен для гистограмм, цветовых шкал или наборов значков.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Предупреждения и информационные оповещения также останавливают неверные данные, просто они звучат мягче». Нет. Только <strong>Stop</strong> стиль отклоняет запись. Предупреждение спрашивает: «Продолжить?» и принимает значение Да; Информация принимает его, как только пользователь нажимает ОК. Если в задаче написано «предотвратить», «нельзя разрешить» или «отклонить», ответ — «Стоп». Если написано «предупреждать, но разрешать», это предупреждение.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:160px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);font-family:var(--mono);font-size:12.5px"><b style="font-family:var(--font)">#,##0.00;[Red](#,##0.00);"-";@</b><div style="color:var(--dim);font-family:var(--font);font-size:12px;margin-top:4px">positive ; negative ; zero ; text</div></div>
      <div style="flex:1;min-width:160px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>=$D2&gt;500</b><div style="color:var(--dim);font-size:12px;margin-top:4px">formula rule: lock the column, free the row, written for the top-left cell</div></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">The two strings this area is really about. Say each part out loud.</div>`},

  {key:'d3', title:"Создавайте расширенные формулы и макросы: логика, поиск, даты, «что если», аудит, запись.",
    must:[
      `<strong>IFS заменяет вложенный IF.</strong> <code>=IFS(тест1, значение1, тест2, значение2, ...)</code>, до 127 пар, возвращает первое значение TRUE. Без совпадения он возвращается <code>#Н/Д</code>, поэтому идиома представляет собой последнюю пару <code>ВЕРНО, «Другое»</code> как всеобщее.`,
      `<strong>SWITCH сравнивает одно выражение со списком значений.</strong> <code>=SWITCH(выражение, значение1, результат1, [значение2, результат2], ..., [по умолчанию])</code>. По умолчанию это последний аргумент сам по себе. Используйте IFS для диапазонов и сравнений, SWITCH для точных совпадений.`,
      `<strong>Все семейство IFS имеет один порядок аргументов.</strong> <code>СУММЕСЛИМ(диапазон_суммы, диапазон_критериев1, критерий1, ...)</code>, <code>AVERAGEIFS</code>, <code>MAXIFS</code>, <code>MINIFS</code> сначала поместите диапазон для расчета. <code>COUNTIFS(диапазон_критерия1, критерий1, ...)</code> не имеет диапазона сумм. Единственное число <code>СУММЕСЛИ(диапазон, критерии, [диапазон_суммы])</code> диапазон сумм ставится последним, что является ловушкой.`,
      `<strong>Критерии — это строки.</strong> <code>">="&B1</code>, <code>"<>Бананы"</code>, <code>"А*"</code>. Подстановочные знаки: <code>*</code> любой набор персонажей, <code>?</code> один персонаж, <code>~</code> чтобы избежать буквальной звезды или вопросительного знака. Каждый диапазон критериев должен иметь ту же форму, что и диапазон суммы.`,
      `<strong>AND, OR and NOT go inside IF.</strong> <code>=IF(AND(A2&gt;0, B2="Paid"), "OK", "Check")</code>. AND needs every test TRUE, OR needs one, NOT flips. They return TRUE or FALSE, which is also what a conditional-format formula or a Custom validation wants.`,
      `<strong>LET names a value once and reuses it.</strong> <code>=LET(name1, value1, [name2, value2, ...], calculation)</code>, up to 126 name-value pairs, and the last argument must be the calculation. <code>=LET(x, A1*2, IF(x&gt;10, x, 0))</code>. Names must start with a letter and cannot look like a cell reference.`,
      `<strong>XLOOKUP имеет шесть аргументов, и по умолчанию используется точное совпадение.</strong> <code>=XLOOKUP(искомое_значение, искомый_массив, возвращаемый_массив, [если_не_найден], [режим_соответствия], [режим_поиска])</code>. Он смотрит влево или вправо, возвращает целые строки и <code>if_not_found</code> replaces <code>#Н/Д</code> без ЕСЛИОШИБКИ.`,
      `<strong>Знайте номера режим_сопоставления и режим_поиска.</strong> match_mode <code>0</code> точный (по умолчанию), <code>-1</code> точный или ближайший меньший, <code>1</code> точный или следующий больший, <code>2</code> подстановочный знак. режим_поиска <code>1</code> от первого до последнего (по умолчанию), <code>-1</code> от последнего к первому, <code>2</code> and <code>-2</code> двоичный поиск по отсортированным данным.`,
      `<strong>ВПР и ГПР по-прежнему отображаются в контуре.</strong> <code>=ВПР(значение, таблица, индекс_столбца, [просмотр_диапазона])</code> смотрит только вправо от первого столбца, и <code>range_lookup</code> по умолчанию — TRUE (приблизительно), поэтому введите <code>FALSE</code> для точного. HLOOKUP — это то же самое, но с индексом строки.`,
      `<strong>ИНДЕКС и ПОИСКПОЗ — это поиск, который работает в любом направлении.</strong> <code>=ИНДЕКС(диапазон возвращаемого_диапазона, ПОИСКПОЗ(значение,диапазон_поиска, 0))</code>. ПОИСКПОЗ возвращает позицию, ИНДЕКС возвращает элемент в этой позиции. тип_соответствия <code>0</code> является точным; <code>1</code> (по умолчанию) требуются возрастающие данные; <code>-1</code> нужен спуск.`,
      `<strong>СЕЙЧАС и СЕГОДНЯ не принимайте аргументов</strong> и оба пересчитывают. <code>=СЕГОДНЯ()</code> это дата; <code>= СЕЙЧАС()</code> это дата плюс время, поэтому <code>=СЕЙЧАС()-СЕГОДНЯ()</code> это часть сегодняшнего дня, которая прошла. Ни один из них не является фиксированной отметкой времени; <code>Ctrl+;</code> является.`,
      `<strong>WEEKDAY returns a number, WORKDAY returns a date.</strong> <code>=WEEKDAY(date, [return_type])</code> gives 1 to 7; type 1 (default) starts at Sunday, type 2 starts at Monday, type 3 runs 0 to 6 from Monday. <code>=WORKDAY(start_date, days, [holidays])</code> adds working days, skipping weekends and any dates in the holidays range.`,
      `<strong>Консолидация суммирует один и тот же макет из нескольких листов.</strong> Данные ▸ Инструменты работы с данными ▸ <strong>Consolidate</strong>: выберите функцию, добавьте каждый исходный диапазон, отметьте галочкой <em>Верхний ряд</em> and <em>Левый столбец</em> для консолидации по категории (соответствующие метки), а не по позиции, и отметьте галочкой <strong>Создание ссылок на исходные данные</strong> чтобы сохранить его в живых.`,
      `<strong>В Поиск цели ровно три поля.</strong> Данные ▸ Анализ «что если» ▸ <strong>Поиск цели</strong>: <em>Установить ячейку</em> (формула), <em>Ценить</em> (результат, который вы хотите), <em>Сменив ячейку</em> (один вход, от которого зависит формула). Только одна переменная.`,
      `<strong>Scenario Manager stores named sets of inputs.</strong> Data ▸ What-If Analysis ▸ <strong>Scenario Manager</strong> ▸ Add, name it, pick the <em>Changing cells</em> (up to 32), type the values. <strong>Show</strong> swaps them in; <strong>Summary</strong> builds a Scenario Summary or Scenario PivotTable report from chosen result cells.`,
      `<strong>PMT и NPER — это две названные финансовые функции.</strong> <code>=PMT(ставка, например, пв, [фв], [тип])</code> возвращает платеж, отрицательный, потому что это выводятся наличные. <code>=NPER(ставка, вечернее время, PV, [фв], [тип])</code> возвращает количество платежей. Сохраняйте единообразие единиц измерения: средние значения за месяц <code>rate/12</code> and <code>лет*12</code>.`,
      `<strong>FILTER и SORTBY — динамические массивы.</strong> <code>= ФИЛЬТР (массив, включить, [если_пусто])</code> выдает соответствующие строки и возвращает <code>#КАЛК!</code> ни на одном совпадении, если только <code>if_empty</code> дано. <code>=СОРТИРОВКА(массив, по_массив1, [сорт_порядок1], ...)</code> сортирует один диапазон по другому; заказ <code>1</code> по возрастанию (по умолчанию) или <code>-1</code> нисходящий.`,
      `<strong>Formula auditing is one ribbon group</strong>: Formulas ▸ Formula Auditing. <strong>Trace Precedents</strong> draws arrows from the cells a formula uses; <strong>Trace Dependents</strong> draws arrows to the formulas that use this cell; <strong>Remove Arrows</strong> clears them. Blue arrows are fine, red arrows point at errors.`,
      `<strong>Watch Window, Error Checking and Evaluate Formula are the other three buttons.</strong> <strong>Watch Window</strong> pins cells from other sheets so you can see their value and formula while you work. <strong>Error Checking</strong> walks green-triangle cells one at a time; its rules are at File ▸ Options ▸ Formulas. <strong>Evaluate Formula</strong> steps through a calculation one piece at a time with Evaluate, Step In and Step Out.`,
      `<strong>Record a macro from the Developer tab.</strong> Developer ▸ <strong>Record Macro</strong>: give it a <em>Macro name</em> (no spaces; start with a letter), an optional <em>Shortcut key</em>, choose <em>Store macro in</em> (This Workbook, New Workbook, Personal Macro Workbook), add a description, OK, do the steps, <strong>Stop Recording</strong>. Turn the tab on at File ▸ Options ▸ Customize Ribbon if it is hidden.`,
      `<strong>Отредактируйте макрос в редакторе Визуальный Бейсик.</strong> Разработчик ▸ <strong>Macros</strong> (<code>Alt+F8</code>), выберите его, <strong>Edit</strong>или нажмите <code>Alt+F11</code>. Переименование означает изменение <code>Подимя()</code> линия.<em>Используйте относительные ссылки</em> на вкладке «Разработчик» решает, будет ли записанный ход «перейти к B5» или «спуститься на две строки отсюда».`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «SUMIF и SUMIFS принимают свои аргументы в одном и том же порядке». Они этого не делают, и экзамен любит подмену. <code>СУММЕСЛИ(диапазон, критерии, [диапазон_суммы])</code> сначала тесты, а потом суммы. <code>СУММЕСЛИМ(диапазон_суммы, диапазон_критериев1, критерий1, ...)</code> Сначала суммы, а потом тесты. AVERAGEIF и AVERAGEIFS следуют одному и тому же разделению. Если вы помните только одно правило, помните: «Множественное число S означает сначала диапазон суммы».`,
    viz:`<div style="display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">exact, any direction</span><br>=XLOOKUP(<b>id</b>, A:A, C:C, "none")</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">same thing, the classic way</span><br>=INDEX(C:C, MATCH(<b>id</b>, A:A, 0))</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">only looks right, needs FALSE</span><br>=VLOOKUP(<b>id</b>, A:C, 3, FALSE)</div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px;font-family:var(--font)">Three spellings of one lookup. The exam accepts any that returns the right value.</div>`},

  {key:'d4', title:"Управление расширенными диаграммами и таблицами: двухосные, статистические диаграммы, сводные таблицы, сводные диаграммы.",
    must:[
      `<strong>Двухосевая диаграмма — это комбинированная диаграмма с одним рядом на вторичной оси.</strong> Выберите диаграмму ▸ Дизайн диаграммы ▸ <strong>Изменить тип диаграммы</strong> ▸ <strong>Combo</strong>, выберите тип диаграммы для каждой серии и отметьте галочкой <strong>Вторичная ось</strong> для того, чьи числа находятся в другом масштабе. Предустановка <em>Кластеризованный столбец — линия на вторичной оси</em> делает это в один клик.`,
      `<strong>Или делайте это последовательно.</strong> Щелкните серию правой кнопкой мыши ▸ Форматировать серию данных ▸ Параметры серии ▸ <strong>Вторичная ось</strong>. Добавьте заголовок оси с помощью «Дизайн диаграммы» ▸ «Добавить элемент диаграммы» ▸ «Названия осей» ▸ «Вторичная вертикаль». Вторичные оси недоступны на трехмерных диаграммах.`,
      `<strong>The six named chart types and where each lives.</strong> <strong>Histogram</strong> and <strong>Box &amp; Whisker</strong>: Insert ▸ Insert Statistic Chart. <strong>Waterfall</strong> and <strong>Funnel</strong>: Insert ▸ Insert Waterfall, Funnel, Stock, Surface or Radar Chart. <strong>Sunburst</strong>: Insert ▸ Insert Hierarchy Chart. <strong>Combo</strong>: Insert ▸ Insert Combo Chart. All are also on the All Charts tab of Recommended Charts.`,
      `<strong>Ячейки гистограммы устанавливаются на оси, а не на данных.</strong> Щелкните правой кнопкой мыши горизонтальную ось ▸ Формат оси ▸ Параметры оси: <em>Automatic</em>, <em>Ширина бункера</em>, <em>Количество бункеров</em>, плюс <em>Переливной контейнер</em> and <em>Поддон для нижнего слива</em> комковать хвосты. Парето — это отсортированная гистограмма с накопительной линией.`,
      `<strong>Параметры Коробка & Усы находятся в серии данных формата.</strong> Отображение внутренних точек, отображение точек выбросов, отображение маркеров среднего значения, отображение средней линии и <em>Квартильный расчет</em> как инклюзивная или исключительная медиана. Он показывает распределение; это не столбчатая диаграмма с полосами ошибок.`,
      `<strong>Водопад имеет переключатель Установить как общий.</strong> Дважды щелкните один столбец, чтобы выбрать именно эту точку ▸ щелкните правой кнопкой мыши ▸ Форматировать точку данных ▸ отметьте галочкой <strong>Установить как итог</strong> поэтому он начинается с нуля, а не с плавающей точкой. Легенда гласит: Увеличение, Уменьшение, Итого.`,
      `<strong>Воронке нужны два столбца, этапы и значения, сначала самые большие.</strong> Санбёрст хочет, чтобы иерархия располагалась в соседних столбцах, внешнее кольцо справа; внутреннее кольцо — это верхний уровень. Оба созданы с использованием вкладок «Дизайн диаграммы» и «Формат», как и любая другая диаграмма.`,
      `<strong>Линии тренда продолжаются через «Добавить элемент диаграммы».</strong> Дизайн диаграммы ▸ Добавить элемент диаграммы ▸ <strong>Trendline</strong>: линейный, экспоненциальный, логарифмический, полиномиальный, степенной, скользящее среднее. Формат добавляет линию тренда <em>Прогноз вперед/назад</em>, <em>Отображение уравнения на диаграмме</em> and <em>Отображение значения R-квадрата</em>. На трехмерных, составных или круговых диаграммах нет линий тренда.`,
      `<strong>Создайте сводную таблицу, выбрав «Вставка» ▸ «Сводная таблица».</strong> Подтвердите диапазон или таблицу, выберите «Новый рабочий лист» или «Существующий рабочий лист» и установите флажок <strong>Добавьте эти данные в модель данных</strong> только тогда, когда вам нужно связать несколько таблиц или использовать Отдельный счет. Обновите, щелкнув правой кнопкой мыши ▸ Обновить или Анализ сводной таблицы ▸ Обновить все.`,
      `<strong>Список полей имеет четыре зоны перетаскивания.</strong>: Фильтры, Столбцы, Строки, Значения. Текстовые поля по умолчанию размещаются в строках, числа — в значениях как сумма, даты — в столбцах с автоматической группировкой дат. Перетащите, чтобы изменить порядок. Одно и то же поле можно удалить в Значения ​​более одного раза.`,
      `<strong>Выбор полей и опций означает два диалога.</strong> Щелкните правой кнопкой мыши поле строки ▸ <strong>Настройки поля</strong> (промежуточные итоги, макет, произвольное имя). Щелкните правой кнопкой мыши в любом месте ▸ <strong>Параметры сводной таблицы</strong> (общие итоги, «Показать пустые ячейки», классический макет, разрешить несколько фильтров для каждого поля). Варианты макета, такие как «Компактный», «Структурный», «Табличный» и «Повторить все метки элементов», находятся в разделе «Дизайн ▸ Макет отчета».`,
      `<strong>Slicers and Timelines are the visible filters.</strong> PivotTable Analyze ▸ <strong>Insert Slicer</strong> for any field; PivotTable Analyze ▸ <strong>Insert Timeline</strong> for date fields, with Years, Quarters, Months, Days levels. A slicer can drive several PivotTables from the same source through Slicer ▸ <strong>Report Connections</strong>.`,
      `<strong>Сгруппируйте данные сводной таблицы из контекстного меню.</strong> Щелкните дату правой кнопкой мыши ▸ <strong>Group</strong> ▸ выберите «Секунды через годы» (выберите «Месяцы» и «Годы» вместе, чтобы не перепутать январь). Щелкните правой кнопкой мыши число ▸ Сгруппировать ▸ установить. <em>By</em> до интервала. Удерживая клавишу Ctrl, щелкните несколько элементов ▸ Сгруппировать, чтобы создать группу вручную. Разгруппировать находится рядом с ним.`,
      `<strong>A calculated field is a new Values column built from other fields.</strong> PivotTable Analyze ▸ Fields, Items, &amp; Sets ▸ <strong>Calculated Field</strong>, name it, write a formula from field names such as <code>=Sales*1.2</code>. It works on the summed totals, cannot use cell references or names, and is not available on Data Model PivotTables (those use Measures).`,
      `<strong>Вычисляемый элемент — это родственный элемент, которого не хватает большинству людей.</strong> То же меню, <strong>Расчетный элемент</strong>, но добавляет новый элемент внутри поля, например регион «Запад + Юг», вычисляемый для каждой записи. Поля добавляют столбцы; элементы добавляют строки.`,
      `<strong>Настройки поля значения имеют две вкладки.</strong> Щелкните правой кнопкой мыши значение ▸ <strong>Настройки поля значения</strong>. <em>Суммировать значения по</em>: сумма, количество, среднее, максимальное, минимальное, произведение, числовые значения, стандартное отклонение, переменная и определенное количество с моделью данных. <em>Показать значения как</em>: % от общего итога, % от итога по столбцу, % от итога по строке, % от итога родительской строки, разница от, % разницы от, промежуточный итог, ранжирование от большего к наименьшему, индекс. <strong>Числовой формат</strong> Кнопка находится в том же диалоговом окне.`,
      `<strong>A PivotChart is a chart bound to a PivotTable.</strong> Click in the PivotTable ▸ Insert ▸ <strong>PivotChart</strong>, or Insert ▸ PivotChart ▸ PivotChart &amp; PivotTable to build both from raw data. Filtering either one filters both. Scatter, bubble and stock types are not available for PivotCharts.`,
      `<strong>PivotChart options are the field buttons and the Analyze tab.</strong> The grey buttons on the chart filter fields in place; hide them with PivotChart Analyze ▸ <strong>Field Buttons</strong>. Styles and colors come from the Design tab like any chart. Right-click a category label ▸ <strong>Expand/Collapse</strong> drills into the next level, and double-clicking a Values cell in the PivotTable (Show Details) dumps the underlying rows to a new sheet.`
    ],

  {id:'q3', domain:'d1', type:'ms', q:`Какие действия блокирует просмотр ▸ защита книги? <em>Выберите все, что применимо.</em>`,

  {id:'q4', domain:'d1', type:'mc', q:`Где изменить параметр безопасности макросов, который применяется к каждой открываемой книге Excel?`,

  {id:'q5', domain:'d1', type:'mc', q:`Формулы на большом листе больше не обновляются при изменении входных данных, а в строке состояния отображается надпись «Вычислить». Какая настройка была изменена?`,

  {id:'q7', domain:'d2', type:'mc', q:`Столбец A содержит полные имена. Вы вводите имя из A2 в B2 и хотите, чтобы Excel заполнил остальную часть столбца B по шаблону. Какой ярлык?`,

  {id:'q8', domain:'d2', type:'mc', q:`Вам нужно, чтобы в ячейках отображались 100, 200, 400, 800. В разделе «Главная ▸ Заполнить ▸ Серия» какое значение типа и шага?`,

  {id:'q10', domain:'d2', type:'mc', q:`Пользовательский числовой формат состоит из двух разделов, например <code>0,0;[Красный]-0,0</code>. Как отображается ноль?`,

  {id:'q13', domain:'d2', type:'mc', q:`Правило проверки должно отклонять любую запись, которая не является одним из значений в H2:H6. Какой тип разрешения и стиль оповещения об ошибках?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

function studyItemHTML(key,i,m){

  return `<li>${m}<div class="li-foot"><span class="conf-chips">${chip('low',"✗ Пока нет")}${chip('mid','~ Almost')}${chip('high',"✓ Иметь это")}</span><button class="hint-btn" onclick="hintStudy('${key}',${i})">Застряли? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-${id}"></div></li>`;
}
function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();
}
function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){
  if(!state.reviewFilter && needsReviewCount()===0){ toast("Сначала оцените концепцию «Еще нет» или «Почти», а затем отфильтруйте только их."); return; }

}
function openReview(){ state.reviewFilter = true; save(); setView('study'); }

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){

  save(); render();
}
function toggleAllStudy(){
  const open = !allStudyOpen();

/* ============== EXAM + OPTIONAL TIMER ==============
   The real MOS exam is 50 minutes of live tasks. The timer here is an optional pacing
   drill against that same length. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Практические упражнения · ${QUESTIONS.length} questions</h2>
        <p>Распространены по четырем официальным областям в опубликованных пропорциях. Один вопрос за раз. Выберите ответ, и он зафиксирует вас и продвинет вас дальше. Несколько вопросов типа «выберите все подходящие» без частичного зачета, поэтому прочитайте их дважды. Все оценивается сразу при отправке.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Начните без ограничения по времени</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Тренировка по темпу, ${EXAM_MINUTES}:00 ⏱</button>
        </div>
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Это проверка знаний, а не экзамен.</strong> Настоящий МО-211 вручает вам рабочие тетради и оценивает то, что вы с ними сделали. ${EXAM_MINUTES} минут. Необходимо знать правильный ход. Этого недостаточно. После этого упражнения откройте Excel и повторите каждое неверное действие дважды.
      </div>
      <div class="method-callout">
        <strong>Зачем вообще таймер.</strong> Сертипорт указывает 50 минут для 23–27 задач, что составляет менее двух минут каждая. Тренировка по темпу здесь, чтобы вопрос «где этот диалог» перестал быть вопросом, на который вы отвечаете медленно.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">Посмотреть результаты →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<класс кнопки="${cls}" onclick="gotoQ(${n})" заголовок="Вопрос ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">МО-211 Учебное упражнение Эксперт Excel${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<класс диапазона="экзамен-таймер${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}> ← Предыдущий</button>

      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}
      Ничто не оценивается, пока вы не отправите заявку.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<класс кнопки="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <класс div="q-карта${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the real exam reports a scaled 1 to 1000 score with 700 to pass (Certiport).
   There is no published mapping from tasks to scaled score, so we grade this knowledge
   check on raw percent and use 70% as OUR line, labelled as ours on the page. */
const PASS_PCT = 70;   // ours, mirrors the 700/1000 shape
const READY_PCT = 85;  // our recommendation, NOT Microsoft's. Margin for the live-app gap

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Очистите нашу 70%-ю линию с комнатой. Теперь повторите ходы в реальном Excel и забронируйте его.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"Выше нашей границы в 70%, но тонкая. Закройте слабое место, повторите его на практике, а затем зарезервируйте.", tone:'warn'};
  if(pct >= 55) return {label:"Под чертой. Поработайте над учебным пособием по приведенным ниже областям, а затем пересдайте его.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практические упражнения · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Против нашей линии: <сильный стиль="цвет:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% (наш)</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий MO-211 оценивает живые задания в Excel по шкале от 1 до 1000 с вероятностью прохождения 700, поэтому воспринимайте это как проверку знаний, а не прогнозирование оценки. ${PASS_PCT}Линия % принадлежит нам и лишь отражает эту форму. ${READY_PCT}%+ здесь плюс удобная практика в приложении = готово.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Повторите это в реальном Excel и двигайтесь дальше."
          : p >= 80 ? `Почти там. Перечитайте <href="#изучать-${k}" onclick="setView('study',{scrollToSection:'${k}'}); вернуть ложь;">${d.label} раздел исследования</a> один раз, затем выполните задачу в Эксель.`
          : p >= 50 ? `Шаки. <href="#изучать-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать упражнение <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и повторить практическое упражнение?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('apk-theme', next);
  document.getElementById('themeIcon').innerHTML = "<я данные-ясный=\"" + (next === 'dark' ? 'sun' : 'moon') + '"></i>';
  if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();
}
(function initTheme(){
  const saved = localStorage.getItem('apk-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').innerHTML = "<я данные-ясный=\"" + (document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon') + '"></i>';

function resetAll(){
  if(!confirm("Удалить все ответы и сбросить упражнение + учебное пособие?")) return;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
