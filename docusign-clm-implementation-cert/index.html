<meta charset="UTF-8">

<title>Документация CLM Подготовка к внедрению · Подготовительный комплект для аналитика</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/docusign-clm-implementation-cert/">
<meta name="description" content="Подготовка к экзамену Документация CLM Внедрение Про. Подробное руководство по планированию внедрения, построению рабочих процессов, интеграции Salesforce и вводу в эксплуатацию, а также практический экзамен из 50 вопросов, оцениваемый по реальному проходному баллу 80%.">

<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>

<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Вернуться ко всем комплектам">← Все комплекты</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Документация CLM Подготовка к внедрению</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Дом</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Учебное руководство</button>
  <button class="nav-btn" id="navExam" onclick="setView('exam')">Практический экзамен</button>
  <button class="nav-btn" id="navResults" onclick="setView('results')" style="display:none">Результаты</button>

  <button class="nav-btn" onclick="resetAll()" title="Сбросить прогресс"><i data-lucide="rotate-ccw"></i>Сбросить</button>
  <button class="nav-btn" onclick="toggleTheme()"><span id="themeIcon"><i data-lucide="sun"></i></span></button>
</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dsclmimplcert';
const EXAM_MINUTES = 60;   // Docusign's own estimate. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Антропный API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':"Верно"},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель Документация CLM, помогающий кому-то подготовиться к экзамену Документация CLM Implementation Pro. Этот экзамен посвящен внедрению Документация CLM для клиента: планированию и администрированию учетной записи, проектированию папок и атрибутов, построению рабочих процессов в Дизайнер рабочих процессов, интеграции этих рабочих процессов с Salesforce через Средство запуска приложений Docusign и внедрению решения. Речь идет о Документация CLM, а НЕ CLM.CM (более старая платформа SpringCM).`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, что, скорее всего, об этом спросят на экзамене. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== EXAM AREAS ==============
   Docusign publishes NO weights for this exam. The four areas below follow the four
   trainings Docusign recommends for it, and the percentages are OUR study allocation.
   The page says so. Treat them as a budget, not a blueprint. */
const DOMAIN_INFO = {
  d1:{label:"Зона 1", name:"Планирование реализации и администрирование", weight:25, color:'var(--c-d1)',
      hint:"Фазы проекта, настройка учетной записи и организации, проектирование структуры папок, атрибуты и типы документов, группы, упаковка компонентов от UAT до производства.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=pxt1643324456371&topicId=oyp1576609934128.html&_LANG=enus',
      docLabel:"Упаковка компонентов в Документация CLM"},
  d2:{label:"Зона 2", name:"Создание рабочих процессов", weight:30, color:'var(--c-d2)',
      hint:"Конструктор рабочих процессов, пять категорий шагов, переменные и XML, этапы создания документов и электронной подписи, выражения, обработка ошибок.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=yks1643320936212&topicId=ycn1576610109905.html&_LANG=enus',
      docLabel:"Типы этапов рабочего процесса в Документация CLM"},
  d3:{label:"Зона 3", name:"Интеграция с Salesforce", weight:30, color:'var(--c-d3)',
      hint:"Средство запуска приложений Документация, подключение учетных записей, пользователя интеграции, сопоставление объектов Salesforce, запуск рабочих процессов CLM из Salesforce, федеративная безопасность.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=ysk1643667858834&topicId=wqv1646856749787.1.html&_LANG=enus',
      docLabel:"Сопоставьте объекты Salesforce с вашей учетной записью CLM"},
  d4:{label:"Зона 4", name:"Расширенные рабочие процессы и запуск в эксплуатацию", weight:15, color:'var(--c-d4)',
      hint:"Подпроцессы, интеллектуальные правила и запуск по расписанию, управление версиями и тестированием, ограничение в 300 выражений, миграция контента, внедрение.",
      docPath:'https://support.docusign.com/s/document-item?bundleId=pxt1643324456371&topicId=woi1737643109961.html&_LANG=enus',
      docLabel:"Ограничения службы Документация CLM"}
};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:"Планирование реализации и администрирование",
    must:[
      `<strong>Реализация — это последовательность, а порядок — это экзаменационный балл.</strong> Вы устанавливаете учетную запись и организацию, затем структуру папок, затем атрибуты и типы документов, затем группы и безопасность, затем рабочие процессы, затем интеграцию с Сейлфорс. Построение рабочего процесса до того, как атрибуты появятся, означает перестроение рабочего процесса.`,
      `<strong>Две роли администратора, и это работа разных людей.</strong>тот<em>администратор организации</em> создает учетную запись, назначает пользователя-администратора CLM и включает приложение CLM. <em>CLM-администратор</em> управляет самой учетной записью CLM. В реальном проекте один человек часто владеет обоими, но экзамен их разделяет.`,
      `<strong>Пользователи, группы и профили разрешений находятся в Документация администратора.</strong> для учетных записей Документация CLM, а не внутри приложения CLM. CLM.CM — это платформа, которая управляет ими внутри приложения, и это отвлекает.`,
      `<strong>Прежде чем создавать структуру папок, спроектируйте ее с учетом двух жестких ограничений.</strong> В папке хранится максимум <code>10,000</code> направляйте дочерние объекты, считая документы и подпапки вместе. В дереве папок отображается максимум <code>100</code> подпапки в любой папке.`,
      `<strong>Превышение лимита в 10 000 скроет все.</strong> Не только перелив: продукт прячется <em>Все</em> объекты в этой папке и предупреждает, что их слишком много для отображения. Поиск по-прежнему находит содержимое, и именно это клиент сразу замечает.`,
      `<strong>Взыскание представляет собой одноразовую письменную услугу.</strong> Администратор просит службу поддержки клиентов сделать временное исключение. Документация Инжиниринг может снять ограничение максимум на <strong>Семь дней</strong>. В запросе необходимо назвать корневую папку и путь к папке, объяснить, зачем вам это нужно, объяснить, как структура выросла до 10 000 объектов, и сказать, как вы не допустите повторения этого. Вы должны письменно подтвердить, что не будете просить другого.`,
      `<strong>Ограничение на 100 подпапок влияет только на дерево в левой части страницы «Документы».</strong> Скрытые папки по-прежнему доступны, если перейти в середину страницы. Обычными виновниками являются автоматические создатели: картографирование Salesforce, умные правила и рабочие процессы. Спроектируйте их так, чтобы они расходились веером, а не накапливались.`,
      `<strong>Атрибуты — это уровень метаданных.</strong>, и они имеют свои собственные потолки: значение атрибута сохраняется <code>400</code> символы, имя атрибута содержит <code>50</code>, имя группы атрибутов сохраняется <code>50</code>. CSV, используемый для заполнения значений атрибутов, в прошлом начал снижать производительность. <code>10,000</code> ряды.`,
      `<strong>Типы документов делятся на три категории</strong>: <em>Автономные документы</em> (первичные договоры), <em>Поправки</em> (они изменяют другой документ в том же соглашении), и <em>Добавки</em> (контекст, обычно просматриваемый и подтвержденный, а не подписанный).`,
      `<strong>Изучите два коротких списка, а не длинный.</strong> Поправок по умолчанию всего три: Дополнение, Поправка, Порядок изменения. Дополнений всего четыре: Приложение, Приложение, Приложение, Дополнительный документ. Все остальное в списке по умолчанию является автономным.`,
      `<strong>Вы переименовываете типы документов, а не заменяете их.</strong>На<em>Типы документов</em>под<em>Документы и папки</em>, выбирать <em>Редактировать</em> и каждый тип получает <em>Альтернативное имя</em> и <em>Видимость</em> параметр. Две вещи нравятся экзамену: <strong>управление партией должно быть включено</strong> использовать пользовательские типы документов, а альтернативное имя не позволяет <strong>нет</strong> изменить классификацию типа.`,
      `<strong>Упаковка компонентов – это способ перемещения конфигурации между учетными записями.</strong>, обычно UAT в производство. Перейти к <em>Развертывание</em>под<em>Управление аккаунтом</em>, назовите пакет, выберите компоненты на вкладках, выберите место хранения и сохраните. Продукт записывает файл с <code>.spackage</code> расширение.`,
      `<strong>Знайте флажки опций пакета.</strong> <em>Пакет автоматической установки</em>, <em>Перезаписать существующие объекты при установке пакета</em>, <em>Включить настройки учетной записи</em>, <em>Включить настройки брендинга аккаунта</em>, и <em>Включите настройку навигационных вкладок, меню и панелей инструментов на уровне учетной записи.</em>. На вкладке «Папки» вы также можете отметить галочкой <em>Включить документы</em> и <em>Включить групповую безопасность</em>.`,
      `<strong>Установка пакета — это загрузка документа, а не пункта меню.</strong> Вы загружаете <code>.spackage</code> из исходной учетной записи, загрузите его в папку целевой учетной записи, дважды щелкните имя файла, дождитесь страницы развертывания и выберите <em>Установить</em>. В электронном письме вам сообщат, сработало ли это.`,
      `<strong>Два правила для пакетов, о которых спрашивают.</strong> Вам нужно как минимум <em>Просмотр и редактирование</em> на <code>.spackage</code> файл, чтобы открыть его, и чтобы установить его, вы должны быть администратором CLM. <strong>Пакет нельзя редактировать в целевой учетной записи.</strong>; если это неправильно, вы создаете новый в исходном коде. Вы можете переустанавливать один и тот же пакет столько раз, сколько захотите, и таким же образом выполняется откат компонента.`,
      `<strong>Упаковка предназначена для компонентов, а не содержимого.</strong> Папки и группы атрибутов являются компонентами. Это явно не способ перенести массу документов. Массовое перемещение контента осуществляется по SFTP, а SFTP позволяет <code>20</code> одновременные соединения.`,
      `<strong>Массовая сборка метаданных состоит из трех частей, и вы делаете это по порядку.</strong> Сначала создайте атрибуты и группы атрибутов, затем файл входных данных (обычно CSV), а затем файл <em>Сопоставление импорта атрибутов</em>, затем Правило документа, которое запускает <em>Массовый импорт метаданных</em> действие. Он обрабатывает до <strong>500 документов одновременно</strong>, и каждый файл должен находиться в одной папке.`,
      `<strong>Карта имеет форму, которую вы должны распознать.</strong>На<em>Сопоставления импорта атрибутов</em>под<em>Документы и папки</em>, вы устанавливаете Тип на <code>CSV</code>, набор <em>Данные начинаются со строки</em>к<code>2</code> потому что строка 1 — это заголовки, и создайте по одному элементу сопоставления для каждого столбца. Столбец 1 — это <em>Имя файла</em>, а каждый второй элемент записывается <code>Группа атрибутов. Поле атрибута</code>.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Упаковка компонентов переносит учетную запись». Это не так. Он переносит выбранные компоненты, в основном конфигурацию, из одной учетной записи CLM в другую. Документы перемещаются, только если вы отметите галочку <em>Включить документы</em> на вкладке «Папки», и Документация прямо говорит, что упаковка не предназначена для переноса большого количества контента. Миграция контента — это отдельная работа, обычно это SFTP плюс массовый импорт метаданных.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Аккаунт и организация</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Структура папок</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">Атрибуты и типы документов</b></span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Группы и безопасность</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Рабочие процессы</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Salesforce</span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Выделенный шаг — это тот шаг, который люди пропускают, и от которого зависит каждый последующий шаг.</div>`},

  {key:'d2', title:"Создание рабочих процессов",
    must:[
      `<strong>Рабочие процессы живут под администратором.</strong>Выбирать <em>Админ</em> в заголовке навигации, затем <em>Рабочие процессы</em>под<em>Инструменты автоматизации</em>. <em>Конфигурация</em> вкладка содержит проекты; на главной странице отображается текущая активность.`,
      `<strong>Первое проектное решение принимается в диалоговом окне «Новый рабочий процесс».</strong>, который спрашивает <em>Какой тип контента положит начало этому рабочему процессу?</em> и дает пять ответов: конфигурация создания документа, документ, пользовательский XML, папка или <em>Этот рабочий процесс начнется без контента</em>. Выберите последний, и ваша переменная входящего содержимого станет пустой, что обычно не то, что вам нужно.`,
      `<strong>Пользовательский XML — это ответ на дополнительный рабочий процесс.</strong> В Документация прямо говорится, что вы можете загрузить XML из родительского рабочего процесса для создания подпроцесса. Если вопрос описывает дочерний процесс, которому необходимы данные родительского процесса, типом начального ответа является пользовательский XML.`,
      `<strong>Строительство не является публикацией.</strong> После создания или редактирования проекта вы должны опубликовать версию, над которой работаете, прежде чем ее можно будет запустить. На панели инструментов <em>Сохраните изменения</em>, затем <em>Создание и публикация версий</em>, затем <em>Публиковать</em> для этой версии. На панели «Версии и публикация» это отображается как <em>Опубликовано</em>. Сохраненные, но неопубликованные проекты находятся на <em>Конфигурация</em> вкладка.`,
      `<strong>Два ограничения, с которыми люди сталкиваются в первый день.</strong> Имя рабочего процесса ограничено <code>100</code> буквенно-цифровые символы и <strong>дизайнер рабочих процессов поддерживает только английский язык</strong>: аккаунт <em>Язык учетной записи по умолчанию</em> Для работы дизайнера настройка должна быть английской.`,
      `<strong>Существует пять категорий предопределенных шагов, и Документация называет их именно так.</strong>: этапы автоматизированного управления документами, действия человека, этапы механизма, этапы интеграции, а также этапы планирования и коммуникации. Большинство вопросов по дизайну на самом деле сводятся к тому, «к какой категории это относится».`,
      `<strong>Автоматизированные этапы управления документами делают то, что в противном случае человек делал бы вручную.</strong>: создавать документы на основе шаблонов, создавать папки, применять безопасность к документам и папкам, копировать и перемещать документы, отправлять документы по электронной почте, блокировать документы, назначать атрибуты документов и искать документы и папки.`,
      `<strong>Для выполнения человеческих действий требуется человек, и они отображаются как задачи рабочего процесса на страницах задач пользователей.</strong> Редактирование документа, его утверждение, выбор того, какие документы или какие люди присоединятся к рабочему процессу, заполнение электронной формы — все это человеческие действия.`,
      `<strong>Шаги двигателя строят логику.</strong> <em>Решение</em> маршруты по условиям, <em>Правило</em> изучает состояние, <em>Для цикла</em> и <em>Для каждого цикла</em> повторять, <em>Преобразование Json в XML</em> и <em>Создать переменную из CSV</em> изменить форму данных, <em>Получить следующее значение автономера</em> тянет следующий номер авто, <em>Регистратор</em> пишет на монитор, и <em>Ресурсная переменная</em> загружает пользователя или группу CLM в переменную Актер.`,
      `<strong>тот<em>Заканчивать</em> На практике этот шаг не является обязательным.</strong> Он сообщает движку, где рабочий процесс успешно завершается, и <strong>он должен присутствовать и быть достигнут, чтобы возобновить ожидающий родительский рабочий процесс</strong>. Проект без этапа «Завершение», который прекращается при утверждении, по-прежнему отображается как «Завершен» в мониторе активности. Добавьте «Готово» и те же отчеты об ошибках, что и «Сбой».`,
      `<strong>Шаги интеграции – внешний мир</strong>: <em>Добавить историю действий Salesforce</em>, <em>Добавить задачу Salesforce</em>, <em>Создать новый объект Salesforce</em>, <em>Salesforce ETL</em>, <em>Соединения</em> (приобретены коннекторы для Финансовые показатели NetSuite и Финансовые показатели рабочего дня), <em>Excel ЭТЛ</em>, <em>HTTP-клиент</em>, <em>Вызов веб-службы</em>, и <em>Рабочий процесс Маэстро</em>.`,
      `<strong>Этапы планирования и связи контролируют время и сообщения</strong>: <em>электронная почта</em>, <em>Таймер Триггер</em>, <em>Ждите сигнала</em> (удерживает путь до тех пор, пока через API не поступит сигнал), <em>Обновить информацию</em> (изменяет текст в столбце «Информация» на страницах «Задачи» и «Действия рабочего процесса») и <em>Группа</em>, который является лишь визуальным элементом для организации холста.`,
      `<strong>Каждый рабочий процесс имеет переменную входящего содержимого с именем <code>Params</code> по умолчанию.</strong> В нем хранится информация, которая запустила рабочий процесс, и то, что в нем находится, зависит от того, как был запущен рабочий процесс. Документация прямо говорит о правиле: <strong>не изменяйте содержимое Параметры.</strong> Скопируйте его в новую переменную и манипулируйте ею, чтобы оригинал оставался доступным для отладки.`,
      `<strong>Знайте типы переменных по тому, что они содержат.</strong> A <em>Дата</em> переменная содержит дату. Ан <em>Список идентификаторов</em> Переменная содержит идентификаторы многих документов или папок, что позволяет дешево хранить результаты этапа поиска. Ан <em>Итератор</em> переменная указывает на повторяющийся узел внутри другой переменной XML. Ан <em>Актер</em> переменная содержит пользователей или группы.`,
      `<strong>Три семейства переменных, а не одно.</strong> Переменные, которые вы создаете, <em>система</em> переменные, которые фиксируют точки данных о рабочем процессе, и <em>каре</em> переменные, которые собирают данные выполнения рабочего процесса. Если вопрос спрашивает, откуда берутся данные о выполнении во время выполнения, это не созданная вами переменная.`,
      `<strong>Документация публикует соглашение об именах, и экзамен может опираться на него.</strong> Используйте краткое, осмысленное и описательное имя, начинайте каждое слово с заглавной буквы и используйте целые слова, а не сокращения. <code>EffectiveDate</code>, нет <code>effdt</code>.`,
      `<strong><em>Создать переменную из CSV</em> содержит три ограничения, которые стоит запомнить.</strong> Загруженный CSV-файл не может превышать <code>1 МБ</code>, создаваемая им переменная не может превышать <code>5 МБ</code>, и файл должен находиться в папке Документация CLM как минимум с двумя столбцами и строкой заголовка. Обычно он сочетается с циклом, который применяет атрибуты или создает папки.`,
      `<strong><em>HTTP-клиент</em> — это общий исходящий вызов, и он работает только по протоколу HTTPS.</strong> Документация поддерживает протоколы версий 1.0 и 1.1. Вы должны передать ему переменную ответа и переменную кода состояния ответа, и он предоставит <em>Успех</em> и <em>Отказ</em> выходы, чтобы вы могли маршрутизировать ошибки вместо остановок.`,
      `<strong>Обработка ошибок задумана, а не прикручена.</strong> Шаги предоставляют выходные условия последнего действия, такие как <em>Успех</em>, <em>Отказ</em> и <em>Время ожидания истекло</em>, а соединители настраиваются через <em>Перейдите по этой ссылке, если результат последнего действия</em> падать. Оставьте линию «Отказ» неподключенной, и рабочий процесс автоматически прекратится, и это именно тот сценарий, который описан в экзамене.`,
      `<strong>На этапе «Пуск» имеется переключатель уведомления об ошибке.</strong> <em>Отправка уведомления, когда рабочий процесс обнаруживает ошибку</em> это флажок в меню «Пуск» с <em>Пользователи для получения уведомлений</em> список выбора рядом с ним. Отдельно на уровне аккаунта <em>Пользователь уведомления об ошибках расширенного рабочего процесса</em> Параметр определяет, кому будет отправлено электронное письмо, когда экземпляр приостанавливается из-за достижения предела выражения. Два разных уведомления, и реализация должна установить оба.`,
      `<strong>Родитель и ребенок обсуждают два названных шага.</strong> <em>Установить выходные данные рабочего процесса</em> передает выходные данные дочернего рабочего процесса обратно родительскому и <em>Обновить родительскую переменную</em> записывает в родительскую переменную. Имя процесса необходимо указать только в родительском элементе; подпроцессы работ признаются частью одного и того же общего процесса.`,
      `<strong>Выражения написаны на C#, а пространства имен включены в список разрешенных.</strong> Построитель выражений создает и проверяет их, и можно использовать только пространства имен из опубликованного списка разрешений Документ. На свиданиях Документация говорит, что используйте <em>Текущая дата</em>, который соответствует часовому поясу аккаунта, а не <code>ДатаВремя.Сейчас</code>, который следует за машиной.`,
      `<strong>Фирменная работа — это шаг, а не отдельный продукт.</strong> <em>Подождите подписи</em> и человек <em>Рассмотрение и отправка на подпись</em> Отправьте документы на электронную подпись из рабочего процесса, а CLM ограничивает каждый документ или конверт, который он отправляет. <code>25 МБ</code>, или <code>100 МБ</code> если для учетной записи включена фрагментированная загрузка.`,
      `<strong>Переменные размеры имеют три отдельных потолка.</strong> Одна переменная может достигать <code>5 МБ</code>, все переменные в одном рабочем процессе могут составлять <code>25 МБ</code>, а имя переменной ограничено <code>250</code> буквенно-цифровые символы. Заполнение целых документов переменными XML — это то, как реализации достигают этих целей.`,
      `<strong>Рабочий день длится восемь часов, а не двадцать четыре.</strong> Именно так CLM рассчитывает сроки выполнения и напоминания, поэтому шаг, настроенный на «1 день» из 24 часов, превращается в три рабочих дня. Клиенты воспринимают это как ошибку; это документированное поведение.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Если рабочий процесс завершился, значит, он сработал». Не без <em>Заканчивать</em> шаг. Документация дает точный сценарий: рабочий процесс без этапа «Завершение», который останавливается на этапе утверждения из-за сбоя, по-прежнему отображается как <strong>полный</strong> в мониторе активности рабочего процесса. Поместите Заканчивать на холст, и тот же запуск отобразится как <strong>Отказ</strong>. Он нужен каждому проекту, который вы передаете клиенту, и подпроцессу, прежде чем его родительский процесс возобновится.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>автоматизированный документооборот</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Человек</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>двигатель</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Интеграция</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>планирование и общение</b></span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Пять категорий шагов, по словам самого Документ. Сделайте шаг не туда, и вопрос станет проще для кого-то другого.</div>`},

  {key:'d3', title:"Интеграция с Salesforce",
    must:[
      `<strong>Автономного пакета CLM не существует.</strong> Управляемый пакет <strong>Средство запуска приложений Документация</strong>, и оно унифицировано: установка любого приложения приводит к установке их всех. Он содержит CLM для Salesforce, Основы CLM для Salesforce, Генерал для Salesforce, электронная подпись для Salesforce и набор инструментов электронная подпись для Salesforce Апекс.`,
      `<strong>Устанавливайте с использованием производственных учетных данных даже в песочнице.</strong> Средство запуска приложений поставляется с AppExchange, и для установки вы используете учетные данные администратора Salesforce, что сбивает людей с толку при первой сборке в песочнице.`,
      `<strong>Не путайте его с устаревшим приложением.</strong> <em>Документооборот</em>, ранее известное как SpringCM Файл Это, — это старое приложение CLM. <em>Документация CLM</em> является текущим в панели запуска приложений. Инструкции различаются, и устаревшее название является любимым отвлекающим фактором.`,
      `<strong>Подключение осуществляется на странице настройки Документ.</strong>, используя учетные данные администратора Документация и Сейлфорс. Подключающийся пользователь Salesforce становится <strong>пользователь интеграции</strong>, и эта учетная запись является той, под которой выполняется каждый последующий вызов.`,
      `<strong>Два жестких требования к пользователю интеграции.</strong> Он должен иметь доступ системного администратора Salesforce, а его профиль Salesforce должен иметь <strong><em>Включить MFA для входа в API</em> установлено значение Ложь</strong>. Второй параметр интеграции является наиболее часто задаваемым.`,
      `<strong>Документация рекомендует универсального пользователя интеграции</strong>, что-то вроде <code>docusign-admin@company.com</code> что ни один человек не входит в систему. Названный сотрудник в качестве пользователя интеграции означает, что вся интеграция прерывается, когда он уходит.`,
      `<strong>Одна организация Salesforce на одну учетную запись Документ.</strong> Документация не поддерживает подключение нескольких организаций Salesforce к одной учетной записи Документ. Если клиент спросит, ответ будет отрицательным, а не «настройте тщательно».`,
      `<strong>Если полный администратор не разрешен, вместо этого вы клонируете профиль.</strong>Назовите это<em>Пользователь интеграции Документация</em> и предоставить <em>Управление пользователями</em>, <em>API включен</em>, <em>Просмотр установки и конфигурации</em>, <em>Изменение метаданных с помощью функций API метаданных</em>, <em>Настроить приложение</em> и <em>Управление пользовательскими разрешениями</em>, плюс <em>Посмотреть все</em> на каждом объекте, который должен прочитать Панель запуска приложений.`,
      `<strong>Для вас отображаются два объекта.</strong> Когда вы подключаете организацию Salesforce к учетной записи CLM, Документация сопоставляет <strong>счет</strong> и <strong>Возможность</strong> автоматически. Любой другой стандартный или пользовательский объект создается вручную.`,
      `<strong>Маршрут сопоставления — это маршрут Salesforce, а не CLM.</strong> Панель запуска приложений, затем <em>Средство запуска приложений Документация</em>, затем <em>Интеграция</em> в левом столбце, затем <em>MAP NEW</em>, тогда <em>Выберите объект</em>, <em>Поиск объекта</em> и <em>Поля поиска</em> вкладки, затем <em>Подтверждать</em>.`,
      `<strong>Называйте сопоставленные папки из полей и всегда указывайте идентификатор.</strong> CLM не допускает дублирования имен папок, поэтому сопоставление имени и идентификатора записи сохраняет имена уникальными. Сопоставление идентификатора также означает обновление имен папок CLM при переименовании записи Сейлфорс. Сохраняйте расположение папки, назначенное Документ.`,
      `<strong>Открытие записи создает папку.</strong> Когда пользователь открывает запись из сопоставленного объекта, Документация создает папку в CLM, и она появляется в папке этой записи. <strong>Документирование файлов CLM</strong> компонент. Папки создаются по требованию, а не в ходе предварительной массовой сборки.`,
      `<strong>Пути к сопоставленным папкам ограничены <code>240</code> персонажи</strong>, считая имя сопоставленного объекта и каждую папку над ним. CLM автоматически удаляет все, что превышает ограничение, что приводит к созданию повторяющихся имен папок, когда уникальная часть пути находится в конце. Поставьте отличительное значение заранее.`,
      `<strong>В именах сопоставленных папок символы заменяются символами подчеркивания.</strong> Список <code># & * | \\ : ? < > /</code> плюс вкладка, <code>+</code>, <code>-</code> и <code>%</code>. Имена учетных записей с амперсандом — обычный сюрприз.`,
      `<strong>Сопоставление Salesforce — это автоматизированное создание папок.</strong>, поэтому ограничения папок - это ваша проблема: <code>10,000</code> направлять дочерние объекты в папку и <code>100</code> подпапки, показанные в дереве. Задокументированное исправление заключается в разделении на подпапки, например каталог учетной записи, разбитый по первой букве имени учетной записи.`,
      `<strong>Три документированных способа запуска рабочего процесса CLM из Сейлфорс.</strong> A <em>Запустить рабочий процесс Документация CLM</em> действие внутри потока Salesforce, файлов CLM <em>пользовательское действие</em> установлен на <em>Начать рабочий процесс</em>и пользовательскую кнопку на макете страницы.`,
      `<strong>Действие Поток имеет две ошибки.</strong>Это требует <strong>Средство запуска приложений Документация v6.3 или выше</strong>и его <em>Имя рабочего процесса</em> ввод должен быть точным именем <strong>активный</strong> Рабочий процесс CLM. Напишите его с ошибкой или укажите на неактивный, и Salesforce не сможет его активировать. Другой его вход <em>Идентификатор записи</em>.`,
      `<strong>Пользовательские действия создаются в CLM, а не в Сейлфорс.</strong>Перейти к <em>Админ</em>, затем <em>Навигация и действия</em>, затем <em>Действия с файлами CLM</em>, затем <em>Пользовательские действия</em>, затем <em>Новое действие</em>, и установите <em>Что должно делать это действие?</em>к<em>Начать рабочий процесс</em>. Вы можете поставить галочку <em>Передать выбранные элементы с помощью этого действия</em> для отправки идентификаторов документов и <em>Передайте информацию о пользователе с помощью этого действия</em> для отправки вызывающего пользователя.`,
      `<strong>Пять шагов Salesforce включены в рабочие процессы CLM.</strong> <em>Salesforce ETL</em> считывает данные в реальном времени из Сейлфорс. <em>Обновить Salesforce</em> записывает значения полей обратно. <em>Создать новый объект Salesforce</em> создает запись. <em>Добавить историю действий Salesforce</em> и <em>Добавить задачу Salesforce</em> регистрировать активность.`,
      `<strong>Salesforce ETL — это ответ на вопрос «данные изменились после запуска рабочего процесса».</strong> Он извлекает текущие значения, поэтому рабочий процесс, запущенный при создании возможности, по-прежнему может считывать статус или дату, введенные позже. И то, и <em>Обновить Salesforce</em> моделируются на SOQL.`,
      `<strong>Сопоставление безопасности сопоставляет профиль с группой.</strong> В CLM перейдите в <em>Админ</em>, затем <em>Соединения</em>, затем <em>Salesforce</em>, затем <em>Создать новое сопоставление</em>и свяжите профиль Salesforce с одной или несколькими группами Документ CLM. Пользователи Salesforce в этом профиле получают права группы CLM на контент.`,
      `<strong>Федеративная безопасность — более тяжелый вариант.</strong> Это касается Salesforce <em>Профиль</em> или <em>роль</em> безопасность всего содержимого CLM, настраиваемая на странице администрирования CLM, поэтому безопасность остается управляемой в Сейлфорс. Это <strong>нельзя применить к отчетам CLM</strong>, поскольку отчеты запускаются в учетной записи CLM.`,
      `<strong>Два предупреждения о федеральной безопасности, которые вы должны уметь произнести.</strong> Не обновляйте организацию Salesforce, пока она применяется, и не подключайте эту организацию к другой учетной записи CLM. Слова Документация: невыполнение предписанных шагов разрушает всю безопасность файлов CLM, и вам придется перестроить весь каталог CLM.`

  {key:'d4', title:"Расширенные рабочие процессы и запуск в эксплуатацию",

      `<strong>Ограничение новое, и даты являются частью факта.</strong> Это относится к новым редакциям рабочего процесса, созданным не позднее <strong>12 августа 2025 г.</strong> в средах UAT, а также во время или после <strong>2 сентября 2025 г.</strong> в производстве. Более старая версия, которую вы никогда не публикуете повторно, не затрагивается.`,

      `<strong>Рядом с ним есть еще три потолка рабочего процесса.</strong> Экземпляр рабочего процесса может выполняться <code>10,000</code> деятельность в целом, <code>5,000</code> из них последовательно без участия человека или асинхронных действий, а результат вычисления одного выражения ограничен <code>1 МБ</code>.`,
      `<strong>Превышение лимита активности также приостанавливается и назначается дата очистки.</strong> Вы можете увидеть количество под <em>Всего выполненных мероприятий</em> на панели «Информация о рабочем процессе» после открытия рабочего процесса на странице «Рабочие процессы». Служба поддержки может повысить лимит приостановленного рабочего процесса, чтобы вы могли возобновить его.`,
      `<strong>UAT намеренно меньше, чем Производство, и на экзамене это можно использовать.</strong> Рабочих процессов, запущенных в час: <code>100</code> в UAT против <code>1,000</code> в производстве. Выполнение рабочего процесса: <code>500</code> каждые 15 минут в UAT против <code>12,000</code> в производстве. Нагрузочный тест, проходящий в UAT, доказывает меньше, чем думает клиент.`,
      `<strong>Срок действия длительных рабочих процессов истекает.</strong> Экземпляр может находиться в состоянии «Выполнение» или «Приостановлено» в течение <code>365</code> дней на производстве и <code>90</code> дней в UAT. Очистка начинается через 30 дней после приостановки работы системы, а завершенные или неудачные рабочие процессы очищаются через 7–30 дней.`,
      `<strong>Проектируйте, ориентируясь на пределы, а не требуя большего.</strong> Переместите повторяющуюся работу с выражениями в подрабочие процессы, вырезайте выражения внутри циклов и передавайте формирование данных в XML или на этап создания документа вместо объединения выражений в цепочку.`,
      `<strong>Три вещи начинают рабочий процесс, и они не взаимозаменяемы.</strong> Человек запускает его вручную. А <em>Умное правило</em> запускается, когда что-то происходит. А <em>Расписание</em> начинается, когда приходит время. Salesforce и API — это четвертый и пятый маршруты, и именно их реализация обычно заканчивается подключением.`,
      `<strong>Умные правила управляются событиями и имеют три формы.</strong>: интеллектуальные правила для документов (активируемые при активности документа), интеллектуальные правила для папок (активируемые при активности папки) и запланированные интеллектуальные правила. <em>Прикованный</em> — четвертая запись в списке, но это не событие; это означает, что правило вызывается другим правилом.`,
      `<strong>Документируйте события, которые стоит знать поименно</strong>: <em>Документ добавлен</em> срабатывает при первом добавлении или загрузке документа. <em>Папка с введенным документом</em> срабатывает, когда документ копируется, перемещается <em> или </em> загружено. <em>Документ зарегистрирован</em> срабатывает при загрузке новой версии.<em>Группа атрибутов назначена</em> срабатывает, когда применяется ранее определенная группа атрибутов.`,
      `<strong>События документа запускаются для любого документа</strong>, поэтому Документация советует администраторам использовать <strong>фильтры</strong> чтобы ограничить объем правил для документов и папок. Нефильтрованное правило для занятой папки — это классическая ошибка реализации.`,
      `<strong>Сработавшее интеллектуальное правило не является мгновенным интеллектуальным правилом.</strong> Очередь правил, а правило, действие которого запускает рабочий процесс, может быть отложено, если учетная запись достигла разрешенного предела рабочего процесса. Никогда не проектируйте процесс, предполагающий, что правило срабатывает в ту же секунду, что и событие.`,
      `<strong>Расписания бывают ровно двух видов.</strong>Ан <em>Явный</em> расписание называет конкретные даты и время. А <em>повторяющийся</em> расписание определяет день и время относительно часа, недели или месяца.`,
      `<strong>Что может запланированное умное правило</strong>: отправьте электронное письмо, запустите рабочий процесс, отправьте собственный отчет или переместите один или несколько документов в корзину. Последний — то, как вы создаете автоматическое удержание.`,
      `<strong>Скажи это вслух</strong>: «Умное правило ждет, пока что-то произойдет. Расписание ждет, пока придет время. Рабочий процесс запускает процесс, как только один из них нажимает на курок».`,
      `<strong>Тестируйте в UAT, продвигайте посылками.</strong> Схема реализации заключается в сборке и тестировании в учетной записи UAT, упаковке компонентов, установке в производство, а затем переустановке пакета, если вам нужно восстановить оригиналы. Ничто в рабочем процессе не перестраивается вручную в производстве.`,
      `<strong>Миграция контента — это отдельный рабочий процесс.</strong> Массовая загрузка документов с помощью SFTP в одну папку, а затем применение метаданных с помощью сопоставления импорта атрибутов и <em>Массовый импорт метаданных</em> правило документа, <code>500</code> документы за один раз.`,
      `<strong>Два важных числа, о которых люди забывают.</strong> Отчет, экспортированный в CSV, останавливается на <code>5,000</code> записей, поэтому отчет о сверке миграции большего размера необходимо сначала сохранить в папке CLM, а затем экспортировать. И файл закончился <code>268 МБ</code> не может быть проиндексирован, поэтому он никогда не появится в поиске, какими бы чистыми ни были метаданные.`,

    explain:`До <strong>500 документов</strong> за раз. Все файлы должны находиться в одной и той же папке, поскольку действие не предназначено для применения атрибутов к нескольким папкам. Это обычный шаг при миграции из устаревшей системы.`},
  {id:'q9', domain:'d1', type:'ms', q:`Создание сопоставления импорта атрибутов для CSV. Какие из них верны? <em>Выберите все, что применимо.</em>`,
    choices:[`Установите тип CSV.`, `Установите значение «Начало данных со строки» на 2, поскольку строка 1 содержит заголовки.`, `Назначьте параметр «Имя файла» столбцу 1.`, `Поля атрибутов вводятся только как поля атрибутов, без префикса группы.`],
    correct:[0,1,2],
    explain:`Тип — CSV, данные начинаются со строки — 2, а столбец 1 — это имя файла. Поля атрибутов отформатированы <code>Группа атрибутов. Поле атрибута</code>, поэтому префикс группы является обязательным, а не необязательным.`},
  {id:'q10', domain:'d1', type:'mc', q:`Какие типы документов по умолчанию классифицируются как изменения? `,
    choices:[`Дополнение, Поправка, Порядок изменения`, `Приложение, Приложение, Приложение, Дополнительный документ`, `Генеральное соглашение об оказании услуг, техническое задание, форма заказа`, `Поправка, Приложение, Порядок изменения, Дополнение`],
    correct:0,
    explain:`Поправок всего три: Дополнение, Поправка, Порядок изменения. Четырьмя дополнениями являются Приложение, Приложение, Приложение и Дополнительный документ. Все остальное в списке по умолчанию является отдельным документом.`},
  {id:'q11', domain:'d1', type:'ms', q:`Клиент хочет, чтобы вместо «Главного соглашения об обслуживании» отображался «Контракт с поставщиком». Что правда в этом? <em>Выберите все, что применимо.</em>`,
    choices:[`Вы добавляете альтернативное имя на странице «Типы документов» в разделе «Документы и папки».`, `Управление вечеринками должно быть включено для использования пользовательских типов документов.`, `Классификация типа документа изменится в соответствии с новым именем.`, `Документы, которые уже существуют в CLM, будут отображать новое имя.`],
    correct:[0,1,3],
    explain:`Альтернативное имя — это изменение отображения. Это применимо к существующим документам и требует включения управления партиями, но это не так. <strong>нет</strong> изменить классификацию типа. Генеральное соглашение об обслуживании остается отдельным документом, как бы вы его ни называли.`},
  {id:'q12', domain:'d1', type:'mc', q:`Где управляются пользователи, группы и профили разрешений для учетной записи Документация CLM?`,
    choices:[`В админке Документация`, `В разделе «Управление пользователями» боковой панели администратора CLM.`, `На странице настройки Документация Salesforce`, `На странице «Развертывание» в разделе «Управление учетной записью».`],
    correct:0,
    explain:`Для учетных записей Документация CLM управление пользователями, группами и профилями разрешений осуществляется в <strong>Документация администратора</strong>. CLM.CM — это платформа, которая управляет ими внутри приложения и является отвлекающим фактором, который используется на экзамене.`},

  /* ---------- AREA 2 · Building workflows (15) ---------- */
  {id:'q13', domain:'d2', type:'mc', q:`Вы создаете дочерний рабочий процесс, который должен получать данные от своего родителя. Какой тип начального контента вы выбираете в диалоговом окне «Новый рабочий процесс»?`,
    choices:[`Документ`, `Папка`, `Пользовательский XML`, `Этот рабочий процесс начнется без контента`],
    correct:2,
    explain:`Пользовательский XML. В Документация говорится, что вы можете загрузить XML из родительского рабочего процесса для создания подпроцесса. Выбор «начать без содержимого» оставляет переменную входящего содержимого пустой, что является классическим неправильным ответом.`},
  {id:'q14', domain:'d2', type:'ms', q:`Какие из этих категорий представляют собой предопределенные этапы рабочего процесса в Документация CLM? <em>Выберите все, что применимо.</em>`,
    choices:[`Автоматизированные этапы управления документами`, `Шаги двигателя`, `Этапы планирования и коммуникации`, `Этапы отчетности и аналитики`],
    correct:[0,1,2],
    explain:`Пять категорий — это автоматизированное управление документами, человек, механизм, интеграция, планирование и коммуникация. Категории отчетности и аналитики нет.`},
  {id:'q15', domain:'d2', type:'mc', q:`Рабочий процесс без шага «Завершение» останавливается при утверждении из-за сбоя. Как это отображается в мониторе активности рабочего процесса?`,
    choices:[`Failure`, `Paused`, `Complete`, `Aborted`],
    correct:2,
    explain:`Это показывает как <strong>полный</strong>, и именно поэтому шаг Заканчивать имеет значение. Добавьте на холст шаг «Завершение», и тот же запуск будет отмечен как «Сбой». Также необходимо достичь завершения, прежде чем возобновится ожидающий родительский рабочий процесс.`},
  {id:'q16', domain:'d2', type:'mc', q:`На каком этапе выходные данные дочернего рабочего процесса передаются обратно родительскому процессу?`,
    choices:[`Обновить родительскую переменную`, `Установить выходные данные рабочего процесса`, `Logger`, `Ресурсная переменная`],
    correct:1,
    explain:`<em>Установить выходные данные рабочего процесса</em> передает выходные данные дочернего рабочего процесса родительскому. <em>Обновить родительскую переменную</em> записывает непосредственно в родительскую переменную, что представляет собой другую работу. <em>Ресурсная переменная</em> загружает пользователя или группу CLM в переменную Актер.`},
  {id:'q17', domain:'d2', type:'mc', q:`Каково документированное правило относительно переменной Параметры?`,
    choices:[`Перед использованием переименуйте его в «Входящие».`, `Не изменяйте его содержимое; скопируйте его в новую переменную, если вам нужно манипулировать данными`, `Очистите его после завершения первого шага, чтобы сэкономить место.`, `Его необходимо воссоздавать вручную для каждого рабочего процесса.`],
    correct:1,
    explain:`Параметры содержит все, что вызвало рабочий процесс. Документация советует не изменять его, поскольку сохранение точных данных запуска помогает при отладке. Если вам нужно изменить данные, скопируйте их в новую переменную и работайте там. Название можно изменить, но содержание – нет.`},
  {id:'q18', domain:'d2', type:'mc', q:`Какой тип переменной лучше всего подходит для хранения результатов шага «Найти документы по папке», когда вам нужны только идентификаторы?`,
    choices:[`Пользовательская переменная XML`, `Переменная списка идентификаторов`, `Переменная-итератор`, `Переменная актера`],
    correct:1,
    explain:`Ан <em>Список идентификаторов</em> переменная хранит идентификаторы нескольких документов или папок. Он предназначен для вывода результатов поиска и сохраняет небольшую переменную, поскольку содержит только идентификаторы.`},
  {id:'q19', domain:'d2', type:'ms', q:`Какие ограничения применяются к шагу «Создать переменную из CSV»? <em>Выберите все, что применимо.</em>`,
    choices:[`Загруженный CSV-файл не может превышать 1 МБ.`, `Создаваемая переменная не может превышать 5 МБ.`, `CSV должен содержать как минимум два столбца со строкой заголовка.`, `CSV-файл необходимо загружать с локального компьютера при каждом запуске.`],
    correct:[0,1,2],
    explain:`CSV до 1 МБ, результирующая переменная до 5 МБ, минимум два столбца и строка заголовка. Файл уже должен находиться в папке Документация CLM, а не быть загружен с локального компьютера во время выполнения.`},
  {id:'q20', domain:'d2', type:'mc', q:`На каком этапе выполняются исходящие вызовы HTTPS из рабочего процесса CLM?`,
    choices:[`Вызов веб-службы`, `HTTP-клиент`, `Connections`, `Excel ЭТЛ`],
    correct:1,
    explain:`<em>HTTP-клиент</em> выполняет исходящие вызовы HTTPS или REST и поддерживает только протокол HTTPS версий 1.0 и 1.1. <em>Вызов веб-службы</em> вызывает настроенную веб-службу из списка веб-служб, что представляет собой другую настройку.`},
  {id:'q21', domain:'d2', type:'mc', q:`Шаг рабочего процесса настроен со сроком выполнения «1 день», что означает 24 часа. Сколько рабочих дней рассчитывает CLM?`,
    choices:[`One`, `Two`, `Three`, `Это зависит от часового пояса аккаунта`],
    correct:2,
    explain:`CLM измеряет рабочий день как <strong>восемь часов</strong>, поэтому 24 часа превращаются в три рабочих дня. Клиенты сообщают об этом как об ошибке; это документированное поведение, и его стоит объяснить перед запуском в эксплуатацию.`},
  {id:'q22', domain:'d2', type:'ms', q:`Какие из этих утверждений верны в отношении публикации рабочего процесса CLM? <em>Выберите все, что применимо.</em>`,
    choices:[`Сохранения дизайна достаточно, чтобы сделать его исполняемым.`, `Вы используете кнопку «Создать и опубликовать версии» на панели инструментов.`, `На панели «Версии и публикация» версия отображается как опубликованная.`, `Неопубликованные проекты отображаются на вкладке «Конфигурация» страницы «Рабочие процессы».`],
    correct:[1,2,3],
    explain:`Сохранение не является публикацией. Вы сохраняете, а затем используете <em>Создание и публикация версий</em>, затем выберите <em>Публиковать</em> для этой версии, и на панели отображается статус «Опубликовано». Сохраненные, но неопубликованные проекты находятся на вкладке «Конфигурация».`},
  {id:'q23', domain:'d2', type:'mc', q:`В учетной записи клиента языком учетной записи по умолчанию является французский. Как это влияет на построение рабочего процесса?`,
    choices:[`Названия шагов отображаются на французском языке, но конструктор работает нормально.`, `Дизайнер рабочих процессов не будет работать; он поддерживает только английский язык`, `Затрагивается только построитель выражений.`, `Ничего, потому что язык — это настройка для каждого пользователя.`],
    correct:1,
    explain:`Конструктор рабочих процессов поддерживает только английский язык, а для параметра учетной записи «Язык учетной записи по умолчанию» должен быть установлен английский язык. Это настоящий блокировщик реализации при международных развертываниях, поэтому проверьте его, прежде чем определять время сборки.`},
  {id:'q24', domain:'d2', type:'mc', q:`На каком языке написаны выражения в рабочих процессах Документация CLM?`,
    choices:[`JavaScript`, `C#`, `Apex`, `Python`],
    correct:1,
    explain:`Выражения рабочего процесса CLM созданы на языке C#, созданы и проверены в построителе выражений. Можно использовать только пространства имен из опубликованного списка разрешений Документация, поэтому вам доступны не все библиотеки C#.`},
  {id:'q25', domain:'d2', type:'mc', q:`Документация рекомендует использовать в выражении рабочего процесса текущую дату, а не ДатаВремя.Сейчас. Почему?`,
    choices:[`Текущая дата быстрее оценивается`, `Текущая дата соответствует часовому поясу учетной записи; ДатаВремя.Сейчас соответствует часовому поясу машины.`, `ДатаВремя.Сейчас не находится в белом списке пространства имен.`, `Текущая дата возвращает строку, которую легче сравнивать.`],
    correct:1,
    explain:`<em>Текущая дата</em> использует часовой пояс учетной записи. <code>ДатаВремя.Сейчас</code> использует часовой пояс компьютера, на котором выполняется код. Использовать <code>ДатаВремя.UTCNow</code> и конвертируйте, когда вам действительно нужна определенная зона.`},
  {id:'q26', domain:'d2', type:'ms', q:`Какие из этих этапов являются этапами рабочего процесса двигателя? <em>Выберите все, что применимо.</em>`,
    choices:[`Decision`, `Для каждого цикла`, `Получить следующее значение автономера`, `Добавить задачу Salesforce`],
    correct:[0,1,2],
    explain:`«Принятие решения», «Цикл для каждого» и «Получить следующее значение автонумерации» — это этапы механизма, которые создают логику рабочего процесса. <em>Добавить задачу Salesforce</em> является шагом интеграции, поскольку он достигает внешнего приложения.`},
  {id:'q27', domain:'d2', type:'mc', q:`Где включить уведомление, которое срабатывает, когда в рабочем процессе возникает ошибка?`,
    choices:[`На шаге «Пуск» флажок «Отправлять уведомление, когда рабочий процесс обнаруживает ошибку»`, `На этапе «Готово» в разделе «Выходы»`, `На каждом отдельном шаге в условиях вывода «Последнее действие»`, `В Документация администратора, в разделе «Настройки учетной записи».`],
    correct:0,
    explain:`Это флажок на <strong>Начать</strong> шаг, с <em>Пользователи для получения уведомлений</em> список выбора рядом с ним. Это отдельно от уровня аккаунта. <em>Пользователь уведомления об ошибках расширенного рабочего процесса</em> параметр, который обрабатывает экземпляры, приостановленные из-за достижения предела выражения.`},

  /* ---------- AREA 3 · Salesforce integration (15) ---------- */
  {id:'q28', domain:'d3', type:'mc', q:`Какой управляемый пакет вы устанавливаете в Salesforce, чтобы использовать CLM для Salesforce?`,
    choices:[`Документирование CLM для Salesforce`, `Средство запуска приложений Документация`, `Документооборот`, `SpringCM Файл Это`],
    correct:1,
    explain:`<strong>Средство запуска приложений Документация</strong> это единый пакет. При установке любого одного приложения устанавливаются все из них: CLM для Salesforce, Основы CLM для Salesforce, Генерал для Salesforce, электронная подпись для Salesforce и Электронная подпись для набора инструментов Salesforce Апекс. Документооборот — это устаревшее приложение, ранее называвшееся SpringCM Файл  это.`},
  {id:'q29', domain:'d3', type:'ms', q:`Какие требования предъявляются к пользователю интеграции Документация? <em>Выберите все, что применимо.</em>`,
    choices:[`Он должен иметь доступ системного администратора Сейлфорс.`, `В его профиле Salesforce для параметра «Включить MFA для входов в API» должно быть установлено значение «Неверно».`, `Документация рекомендует использовать общую учетную запись, а не имя конкретного человека.`, `Это должен быть пользователь Облако Опыт работы в продажах.`],
    correct:[0,1,2],
    explain:`Доступ системного администратора, параметр «Включить MFA для входов в систему API», установленный на «Неверно», и общую учетную запись, например документ-администратор@компания.com, чтобы интеграция не прерывалась при увольнении сотрудника. Опыт Облако не имеет к этому никакого отношения.`},
  {id:'q30', domain:'d3', type:'mc', q:`Клиент хочет, чтобы две организации Salesforce были подключены к одной учетной записи Документ. Что ты им скажешь?`,
    choices:[`Это работает, если в каждой организации есть собственный пользователь интеграции.`, `Документация не поддерживает подключение нескольких организаций Salesforce к одной учетной записи Документ.`, `Для этого необходимо сначала включить Федеральная безопасность.`, `Поддерживается только для организаций-песочниц.`],
    correct:1,
    explain:`Документация не поддерживает это. Это обзорный ответ, а не ответ по конфигурации, и его стоит поднять как можно раньше, поскольку он меняет архитектуру учетной записи, которую необходимо купить клиенту.`},
  {id:'q31', domain:'d3', type:'ms', q:`Какие объекты Документация автоматически сопоставляет с вашей учетной записью CLM при подключении к Salesforce? <em>Выберите все, что применимо.</em>`,
    choices:[`Account`, `Opportunity`, `Contact`, `Case`],
    correct:[0,1],
    explain:`Учетная запись и возможность отображаются для вас. Любой другой стандартный или настраиваемый объект, включая «Контакт» и «Обращение», необходимо сопоставить вручную на странице «Интеграция».`},
  {id:'q32', domain:'d3', type:'mc', q:`Каков лимит символов в пути к сопоставленной папке?`,
    choices:[`100 символов`, `240 символов`, `255 символов`, `1000 символов`],
    correct:1,
    explain:`<strong>240 символов</strong>, считая имя сопоставленного объекта и каждую папку над ним. CLM удаляет все, что выходит за пределы лимита, то есть повторяющиеся имена папок появляются, когда уникальная часть пути находится в конце.`},
  {id:'q33', domain:'d3', type:'mc', q:`Почему Документация рекомендует сопоставлять как имя записи, так и идентификатор записи при присвоении имен сопоставленным папкам?`,
    choices:[`Поскольку CLM не допускает дублирования имен папок, а идентификатор также обеспечивает синхронизацию имен CLM при изменении имен Сейлфорс.`, `Поскольку идентификатор необходим для работы Федеральная безопасность.`, `Поскольку имена папок должны начинаться с числового значения`, `Поскольку компонент Документирование файлов CLM сортирует по идентификатору`],
    correct:0,
    explain:`Две причины в одном ответе. CLM не допускает дублирования имен папок, поэтому идентификатор гарантирует уникальность, а сопоставление идентификатора также означает обновление имен папок CLM при переименовании записи Сейлфорс.`},
  {id:'q34', domain:'d3', type:'mc', q:`Учетная запись называется «Смит & Сыновья». Что происходит с амперсандом в имени сопоставленной папки CLM?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);
