<meta charset="UTF-8">

<title>Подготовка микрокредитов Фонд Альтерикс · Набор для подготовки аналитика</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/alteryx-cert/">
<meta name="description" content="Подготовка к получению микро-кредитов Фонд Альтерикс. Подробное учебное пособие по концепциям данных, базовой статистике, интерфейсу Дизайнер и типам файлов, а также 17 инструментам из официального плана, а также практический экзамен из 40 вопросов, который отражает реальный экзамен.">

<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>

<body>
<nav>

  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>

<main id="app"></main>

<script>
/* ============== STATE ============== */
const STORE = 'apk-alteryxcert';

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Антропный API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный наставник Альтерикс Дизайнер, помогающий кому-то учиться на микро-сертификаты Фонд Альтерикс. Этот экзамен охватывает основные понятия данных (структурированные и неструктурированные данные, количественные и качественные данные, типы данных, такие как строка, целое число, фиксированное десятичное число, число с плавающей запятой, логическое значение и дата-время, метаданные, базовая статистика) и основы Альтерикс Дизайнер (интерфейс, рабочие процессы, типы файлов Дизайнер, такие как .yxmd .yxwz .yxmc .yxdb .yxzp, а также следующие инструменты: просмотр, входные данные, выходные данные, текстовый ввод, данные). Очистка, Фильтр, Формула, Образец, Выбор, Сортировка, Текст в столбцы, Подведение итогов, Комментарий, Контейнер инструментов, объединение, объединение, дата и время). Он тестирует последнюю версию Дизайнер рабочего стола с отключенным AMP-движок.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, что, скорее всего, об этом спросят на экзамене. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

      <b>Mode</b><span><span style="font-family:var(--mono)">3</span> <span style="color:var(--dim)">appears twice</span></span>
      <b>Range</b><span><span style="font-family:var(--mono)">28</span> <span style="color:var(--dim)">30 minus 2, all outlier</span></span>
    </div>`},

  {key:'d3', title:"Интерфейс дизайнера, рабочие процессы и файлы",
    must:[
      `<strong>Холст — это место, где живет рабочий процесс.</strong> Перетащите на него инструменты, подключите их, запустите. Стандартный рабочий процесс сохраняется в виде <code>.yxmd</code> файл.`,
      `<strong>Палитра инструментов содержит все инструменты, сгруппированные по категориям.</strong> Ввод/вывод, подготовка, объединение, анализ, преобразование, документирование и многое другое, а также <em>Favorites</em> категорию, которую вы заполняете сами. Перетащите инструмент из палитры на холст, чтобы использовать его.`,
      `<strong>В окне конфигурации отображаются настройки для всего, что выбрано.</strong> Инструмент, соединение или ничего не выбирало сам рабочий процесс. Последний случай — это окно «Конфигурация рабочего процесса» с вкладками «Холст», «Рабочий процесс», «Среда выполнения», «События» и «Метаинформация».`,
      `<strong>В окне «Результаты» отображаются данные по мере их поступления.</strong> Выберите любой инструмент после запуска и просмотрите его ввод и вывод, а также вкладку «Сообщения» с ошибками, предупреждениями и ссылками на записанные файлы. Без инструмента просмотра он отображается до <code>1 МБ</code> данных на инструмент.`,
      `<strong>Окно обзора представляет собой мини-карту.</strong> Небольшая картинка всего рабочего процесса для панорамирования больших. Он также показывает, какие инструменты завершили работу.`,
      `<strong>Поиск находится вверху справа.</strong> Он осуществляет поиск в инструментах дизайнера, элементах сервера, ресурсах Соединять, содержимом справки и сообщениях сообщества из одного окна. Введите «присоединиться», и инструмент будет в одном клике.`,
      `<strong>Конструктор интерфейсов создает интерфейс приложения или макроса.</strong> Только полная пользовательская лицензия. Это не то место, где вы настраиваете обычные инструменты.`,
      `<strong>Помощь доступна повсюду в Дизайнер.</strong> <code>F1</code> открывает справку Альтерикс. Щелкните правой кнопкой мыши любой инструмент и выберите <em>Help</em> для страницы этого инструмента. Выберите значок инструмента на палитре, и появится его описание, часто с <em>Открыть пример</em> ссылка на пример рабочего процесса.`,
      `<strong>Меню «Справка» также содержит руководства, примеры рабочих процессов, «Сообщество», «Что нового» и «О программе».</strong> В программе «О программе» отображается версия и серийный номер, по которым вы можете проверить, используете ли вы последнюю версию Дизайнер рабочего стола.`,
      `<strong>Ярлыки, которые спрашивают.</strong> <code>Ctrl+R</code> запускает или останавливает рабочий процесс. <code>Ctrl+S</code> сохраняет. <code>Ctrl+Shift+B</code> добавляет обзор после выбранных инструментов. <code>Ctrl+N</code> новый рабочий процесс. <code>Ctrl+Z</code> отменяет до 32 действий.`,
      `<strong>Рабочий процесс — это инструменты, соединения и аннотации.</strong> Инструменты делают свою работу. Соединения переносят данные от выходной привязки к входной привязке. Поля аннотаций и комментариев описывают это. Каждый проект нуждается в входе и выходе.`,
      `<strong>Anchors are the connection points on a tool.</strong> Inputs on the left, outputs on the right. Some tools have several and letter them: Join has L, J and R outputs; Filter has T and F.`,
      `<strong>На вкладке «Время выполнения» конфигурации рабочего процесса находятся настройки разработки.</strong> <em>Лимит записи для всех входов</em> для быстрых тестовых прогонов, <em>Отключить все инструменты просмотра</em>, <em>Отключить все инструменты, записывающие выходные данные</em>, предел ошибок преобразования и <em>Используйте движок AMP</em> флажок.`,
      `<strong>AMP — это многопоточный движок.</strong> Оригинальный движок однопоточный. На экзамене проверяется последняя версия Дизайнер <strong>с отключенным AMP</strong>, поэтому поведение по умолчанию, такое как создание текстового ввода <code>String</code> Поля — это исходный движок.`,
      `<strong>Направление макета холста — это настройка.</strong> На вкладке «Холст» можно выбрать «Горизонтально» или «Вертикально», чтобы инструменты соединялись слева направо или сверху вниз.`,
      `<strong>Три типа рабочего процесса, три расширения.</strong> <code>.yxmd</code> Стандартный рабочий процесс. <code>.yxwz</code> Аналитическое приложение — рабочий процесс с пользовательским интерфейсом. <code>.yxmc</code> Макрос — рабочий процесс, который выполняется как отдельный инструмент внутри другого рабочего процесса.`,
      `<strong>Еще два, которые вы должны знать.</strong> <code>.yxdb</code> — это файл базы данных Альтерикс: наиболее эффективный формат для чтения и записи, без ограничений по размеру, сохраняет типы полей и метаданные. <code>.yxzp</code> — это пакет: рабочий процесс плюс все его зависимости, заархивированные в один файл, так же, как вы отправляете рабочий процесс кому-то другому.`,
      `<strong>Остальные члены семьи.</strong> <code>.yxwg</code> группа рабочих процессов. <code>.yxi</code> пакетный установщик инструментов. <code>.yxft</code> файл типа поля, сохраненный с помощью инструмента «Выбор». <code>.yxwv</code> файл значений приложения. <code>.bak</code> рабочий процесс, каким он был до последнего сохранения. <code>.cydb</code> База данных Калгари для быстрого индексированного поиска.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «.yxzp — это рабочий процесс». Это молния. Он имеет <code>.yxmd</code>, <code>.yxmc</code> or <code>.yxwz</code> плюс входные файлы, макросы и другие зависимости, необходимые для рабочего процесса. Когда в вопросе говорится: «Поделитесь рабочим процессом с коллегой, у которого нет ваших файлов», ответ экспортируется как <code>.yxzp</code>, не сохранять как <code>.yxmd</code>.`,
    viz:`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;font-size:12px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--surf)"><b style="font-family:var(--mono)">.yxmd</b><br><span style="color:var(--dim)">standard workflow</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--surf)"><b style="font-family:var(--mono)">.yxwz</b><br><span style="color:var(--dim)">analytic app</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--surf)"><b style="font-family:var(--mono)">.yxmc</b><br><span style="color:var(--dim)">macro</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--surf)"><b style="font-family:var(--mono)">.yxdb</b><br><span style="color:var(--dim)">Alteryx data file</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--surf)"><b style="font-family:var(--mono)">.yxzp</b><br><span style="color:var(--dim)">workflow + dependencies</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">The five extensions the outline names. md = workflow, wz = wizard (app), mc = macro, db = data, zp = zip.</div>`},

  {key:'d4', title:"17 инструментов: что делает каждый",
    must:[
      `<strong>Входные данные (Вход/Выход) открывает файл или базу данных.</strong> Такие параметры, как ограничение количества записей, первая строка содержит имена полей, запуск онлайн-импорта, кодовая страница и разделитель, различаются в зависимости от типа файла. Один инструмент ввода данных может читать множество файлов с подстановочным знаком, например <code>2019*.csv</code> если они имеют одни и те же поля.`,
      `<strong>Выходные данные (вход/выход) записывают результат.</strong> Параметры вывода зависят от цели: «Перезаписать файл», «Добавить к существующему», «Создать новый лист», «Перезаписать лист», «Удалить» и «Добавить». <em>Взять имя файла/таблицы из поля</em> записывает по одному файлу для каждого значения с добавлением суффикса, добавлением префикса, изменением имени файла или изменением всего пути к файлу.`,
      `<strong>Текстовый ввод (вход/выход) — это небольшая таблица, которую вы вводите.</strong> Данные сохраняются внутри рабочего процесса, поэтому вы можете поделиться ими без входного файла. Импорт ограничен 10 000 ячеек. При выключенном AMP создается <code>String</code> поля имеют размер наибольшего значения.`,
      `<strong>Обзор (Вход/Выход) показывает все.</strong> Полные данные, профиль для каждого столбца с индикатором качества данных и максимальными значениями, а также карта для пространственных данных. Три способа добавить его: перетащить из палитры, щелкнуть инструмент правой кнопкой мыши и <em>Добавить просмотр после</em>, или <code>Ctrl+Shift+B</code>. У него нет выходного якоря.`,
      `<strong>Селект (Подготовка) – менеджер полей.</strong> Установите или снимите флажки для полей, переименуйте, измените порядок, измените тип и размер, добавьте описание. <em>Unknown</em> Поле отмечено по умолчанию, и именно туда попадают все новые поля. Параметры позволяют сохранить макет как <code>.yxft</code>.`,
      `<strong>Фильтр (Подготовка) разбивает строки на два потока.</strong> <code>T</code> выводит строки, соответствующие условию, <code>F</code> выводит строки, которые этого не делают. Ничего не удаляется. Базовый фильтр проверяет один столбец; Пользовательский фильтр принимает выражение для многих.`,
      `<strong>Фильтр имеет нулевые операторы.</strong> <em>НУЛЕВЫЙ</em>, <em>НЕ НУЛЬ</em>и для строк <em>Пусто</em> (пусто или пусто) и <em>Не пусто</em>. Строки, где условие не может быть вычислено, переходят к F.`,
      `<strong>Формула (подготовка) создает или перезаписывает столбец с выражением.</strong> Один инструмент может содержать множество выражений, и они выполняются по порядку, сверху вниз, поэтому выражение может использовать столбец, созданный над ним. <code>Ctrl+Space</code> перечисляет функции. Фиксированное десятичное число неявно преобразуется в двойное внутри выражения.`,
      `<strong>Сортировка (подготовка) строк заказов.</strong> Допускается несколько столбцов сортировки, и побеждает верхняя запись. По возрастанию используется значение по умолчанию. <em>Использовать порядок словаря</em> сортирует строчные буквы перед прописными и числовые строки по значению.`,
      `<strong>Образец (Подготовка) сохраняет срез.</strong> Шесть режимов: первые N строк, последние N строк, пропуск первых N строк, 1 из каждых N строк, 1 из N шансов включить каждую строку, первые N% строк. Функция Группировать по делает выборку каждой группы отдельно.`,
      `<strong>Очистка данных (подготовка) — макрос, который приводит в порядок поля.</strong> Удалите пустые строки и столбцы, замените пустые значения пробелами (строки) или 0 (цифры), удалите начальные и конечные пробелы, табуляции и разрывы строк, все пробелы, буквы, цифры или знаки препинания и измените регистр на Верхний, Нижний или Заголовок. Он не является динамическим: новые имена полей, которые он никогда не видел, игнорируются.`,
      `<strong>Текст в столбцы (анализ) разбивает одно поле на разделители.</strong> Каждый символ-разделитель обрабатывается отдельно, поэтому разделить слово на слово невозможно. Разделить на столбцы создает N новых столбцов; выберите, что произойдет с дополнительным текстом: оставить в последнем столбце, удалить с предупреждением, удалить без предупреждения или с ошибкой. Разделение на строки делает одну строку на единицу.`,
      `<strong>ДатаВремя (Разобрать) преобразуется в двух направлениях.</strong> <em>Формат даты/времени для строки</em> and <em>Строка в формате даты/времени</em>. Новый столбец по умолчанию имеет значение <code>DateTime_Out</code>. Используйте спецификаторы, такие как <code>dd</code>, <code>MM</code>, <code>yyyy</code>или стиль процентов, но не оба в одном формате. Родной формат Альтерикс: <code>yyyy-MM-dd</code>.`,
      `<strong>Подвести итог (трансформировать) суммирует и возвращает только результат.</strong> Группировать по, сумме, подсчету, подсчету различных, мин, макс, первому, последнему, среднему, медиане, моде, стандартному отклонению, процентилю, объединению и т. д. Поля вывода названы в честь действия, например: <code>Sum_Sales</code>. Без группы по весь поток становится одной строкой. Объедините результат обратно, если вам нужны исходные строки.`,
      `<strong>Объединение таблиц (JOIN) (Объединиться) соответствует двум потокам.</strong> Inputs <code>L</code> and <code>R</code>. Выходы <code>L</code> (оставили несовпадающие строки), <code>J</code> (совпадающие строки), <code>R</code> (правые строки, которые не совпали). Соединение по определенному полю общего ключа или объединение по позиции записи, если обе таблицы имеют одинаковую структуру. Полное внешнее соединение — это J плюс L плюс R, поэтому после соединения часто следует соединение.`,
      `<strong>Союз (Объединение таблиц (JOIN)) укладывает потоки друг на друга.</strong> Автоматическая настройка по имени выстраивает столбцы с одинаковыми именами. Автоматическая настройка по положению выстраивает их по порядку. Настроить столбцы вручную позволяет сопоставить их. Отсутствующие столбцы: все выходные поля заполняются нулями, выходное общее подмножество сохраняет только общие столбцы.`,
      `<strong>Скажите это вслух:</strong> «Объединение таблиц (JOIN) идет вбок, Союз идет вниз». Объединение таблиц (JOIN) добавляет столбцы, сопоставляя строки. Союз добавляет строки и сохраняет столбцы.`,
      `<strong>Контейнер комментариев и инструментов (документация) не содержит данных.</strong> Комментарий — это текстовое поле с формой, шрифтом, цветами и фоновым изображением, не имеющее привязок. Контейнер инструментов группирует инструменты с заголовком, может сворачиваться и может быть <em>disabled</em> поэтому инструменты внутри не запускаются.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Фильтр удаляет строки». Он ничего не удаляет. Каждая строка уходит через T или F. Если в вопросе говорится, что строки «исчезли» после фильтра, строки находятся на якоре F и ничего с ним не связано. Та же привычка отвечает на Объединение таблиц (JOIN): не совпавшие строки не теряются, они находятся на L или R.`,
    viz:`<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px">
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surf)">L in</span><span style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surf)">R in</span></div>
      <span style="color:var(--dim)">→</span>
      <div style="padding:10px 14px;border:2px solid var(--accent);border-radius:8px;font-weight:700">Join</div>
      <span style="color:var(--dim)">→</span>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surf)"><b>L</b> left only, no match</span>
        <span style="padding:3px 8px;border:1px solid var(--accent);border-radius:4px;background:var(--surf)"><b style="color:var(--accent)">J</b> matched rows</span>
        <span style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surf)"><b>R</b> right only, no match</span>
      </div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Join's anchors. Inner join = J. Left join = J + L through a Union. Full outer = all three.</div>`}
];

/* ============== PRACTICE EXAM: 40 questions ==============
   d1: 8 · d2: 6 · d3: 12 · d4: 14
   The real exam is 40 questions, multiple choice and multiple response, 1 point each,
   partial credit on multiple response, 1 hour. Alteryx does not publish a passing score.
   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Data concepts (8) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`Что из этого является примером неструктурированных данных?`,
    choices:[`CSV-файл с ежемесячными продажами.`, `Папка сообщений электронной почты клиентов.`, `SQL-таблица сотрудников`, `Лист Excel с одной строкой на заказ`],
    correct:1,
    explain:`Электронные письма представляют собой свободный текст без фиксированных строк и столбцов. Остальные три — это таблицы, представляющие собой структурированные данные.`},
  {id:'q2', domain:'d1', type:'ms', q:`Какие из этих данных являются количественными? <em>Выберите все, что применимо.</em>`,
    choices:[`Сумма заказа в долларах`, `Регион клиента`, `Количество товаров в корзине`, `Цвет продукта`],
    correct:[0,2],
    explain:`Количественные данные — это измеренная сумма, которую вы можете добавить или усреднить. Общая сумма заказа и количество товаров соответствуют критериям. Регион и цвет — качественные категории.`},
  {id:'q3', domain:'d1', type:'mc', q:`Поле содержит имена клиентов на нескольких языках, и его длина сильно различается. Какой тип Альтерикс подходит лучше всего?`,
    choices:[`String`, `WString`, `V_String`, `V_WString`],
    correct:3,
    explain:`V означает переменную длину, а W означает ширину, что соответствует Юникод. V_WString обрабатывает любой символ любой длины и подстраивается под данные.`},
  {id:'q4', domain:'d1', type:'mc', q:`Какова точность и масштаб поля Альтерикс с фиксированной десятичной дробью по умолчанию?`,

  {id:'q5', domain:'d1', type:'mc', q:`Какой целочисленный тип содержит значение 3 000 000 000?`,

  {id:'q6', domain:'d1', type:'mc', q:`Каков формат поля даты Альтерикс?`,

  {id:'q7', domain:'d1', type:'mc', q:`Какое утверждение о метаданных верно?`,

  {id:'q8', domain:'d1', type:'mc', q:`В качестве какого значения поле Бул в Альтерикс хранит значение Неверно?`,

  /* ---------- AREA 2 · Statistics basics and types in operations (6) ---------- */
  {id:'q9', domain:'d2', type:'mc', q:`Цены на дома на улице составляют 200 тысяч, 210 тысяч, 215 тысяч, 220 тысяч и 2000 тысяч. Какая мера лучше всего описывает типичный дом?`,
    choices:[`Mean`, `Median`, `Range`, `Стандартное отклонение`],
    correct:1,
    explain:`Один особняк доводит среднее значение до 569 тыс., что означает отсутствие дома на улице. Медиана, 215 тыс., почти не смещается из-за выброса.`},
  {id:'q10', domain:'d2', type:'mc', q:`Какую статистику можно рассчитать по качественному полю, например «Цвет продукта»?`,
    choices:[`Mean`, `Стандартное отклонение`, `Mode`, `Range`],
    correct:2,
    explain:`Режим является наиболее частым значением и работает с категориями. Среднее значение, стандартное отклонение и диапазон — все это необходимые числа.`},
  {id:'q11', domain:'d2', type:'mc', q:`В чем слабость диапазона как меры спреда?`,
    choices:[`Сначала необходимо отсортировать данные`, `Это в разных единицах данных`, `Одна крайняя ценность решает все полностью`, `Его нельзя использовать с целыми числами.`],
    correct:2,
    explain:`Диапазон равен максимуму минус минимуму, поэтому его задает один выброс на обоих концах. Стандартное отклонение использует все значения и выражается в тех же единицах, что и данные.`},
  {id:'q12', domain:'d2', type:'mc', q:`В поле «Продажи» отображаются только действия «Объединить», «Самое длинное», «Самое короткое» и «Подсчет» в инструменте «Суммировать». Почему?`,
    choices:[`Рабочий процесс еще не запущен`, `Поле имеет строковый тип, поэтому числовые действия не предлагаются.`, `Подведение итогов требует группы в первую очередь`, `Механизм AMP отключен.`],
    correct:1,
    explain:`Суммировать предлагает действия по типам данных. Сумма, Среднее, Мин и Макс отображаются только в числовых полях. Сначала измените тип с помощью инструмента «Выбор».`},
  {id:'q13', domain:'d2', type:'ms', q:`Какие действия «Суммировать» отвечают на вопрос «сколько разных клиентов разместили заказы»? <em>Выберите все, что применимо.</em>`,
    choices:[`Count`, `Подсчитайте различные`, `Группируйте по клиентам и рассчитывайте на результат`, `Sum`],
    correct:[1,2],
    explain:`Функция Подсчитайте различные напрямую подсчитывает уникальные значения. Группируя по Заказчику и подсчитывая полученные строки, получаем одинаковое число. Обычный счет считает заказы, а не клиентов. Сумма добавляет значения.`},
  {id:'q14', domain:'d2', type:'mc', q:`Фильтр с условием <code>[Сумма] > 100</code> пропускаем «99» к T. Какова наиболее вероятная причина?`,
    choices:[`Фильтр находится в базовом режиме.`, `Сумма представляет собой строку, поэтому сравнение происходит посимвольно.`, `Сумма содержит нули`, `Анкеры T и F поменяны местами.`],
    correct:1,
    explain:`В строке «99» больше, чем «100», поскольку «9» идет после «1». Преобразуйте сумму в числовой тип с помощью кнопки «Выбрать» перед фильтрацией.`},

  /* ---------- AREA 3 · Designer interface, workflows and files (12) ---------- */
  {id:'q15', domain:'d3', type:'mc', q:`В каком окне отображаются настройки выбранного вами инструмента?`,

    explain:`В окне конфигурации отображаются настройки выбранного инструмента или соединения. Если ничего не выбрано, отображается собственная конфигурация рабочего процесса.`},
  {id:'q16', domain:'d3', type:'mc', q:`После запуска рабочего процесса вы хотите видеть данные, поступающие из инструмента, и любые сообщения об ошибках. Куда ты смотришь?`,

    explain:`В окне «Результаты» отображается состояние данных каждого инструмента после запуска, а также вкладка «Сообщения» с ошибками, предупреждениями и ссылками на выходные файлы.`},
  {id:'q17', domain:'d3', type:'mc', q:`Что делает окно Обзор?`,
    choices:[`Перечисляет все инструменты в палитре.`, `Показывает небольшую карту всего рабочего процесса панорамирования и список инструментов, которые уже завершены.`, `Показывает профиль данных выбранного поля.`, `Показывает XML рабочего процесса.`],

    explain:`Окно обзора представляет собой мини-карту. Это наиболее полезно для больших рабочих процессов, а также показывает, какие инструменты завершили работу.`},
  {id:'q18', domain:'d3', type:'ms', q:`Какой из этих вариантов открывает справку для инструмента в Дизайнер? <em>Выберите все, что применимо.</em>`,
    choices:[`Нажмите F1`, `Щелкните инструмент правой кнопкой мыши и выберите «Справка».`, `Выберите значок инструмента на палитре, чтобы прочитать его описание и ссылку «Открыть пример».`, `Нажмите Ctrl+Р.`],
    correct:[0,1,2],
    explain:`F1 открывает справку Альтерикс, в контекстном меню есть пункт «Справка», а описание палитры часто ссылается на пример рабочего процесса. Ctrl+R запускает рабочий процесс.`},
  {id:'q19', domain:'d3', type:'mc', q:`Какое сочетание клавиш запускает рабочий процесс?`,

    correct:1,
    explain:`Ctrl+R запускает или останавливает рабочий процесс. Ctrl+S сохраняет, Ctrl+Shift+B добавляет обзор после выбранных инструментов, F1 открывает справку.`},
  {id:'q20', domain:'d3', type:'mc', q:`Из каких трёх вещей состоит рабочий процесс?`,
    choices:[`Инструменты, соединения, аннотации`, `Входные данные, формулы, выходные данные`, `Файлы, базы данных, отчеты`, `Макросы, приложения, пакеты`],
    correct:0,
    explain:`Инструменты выполняют работу, соединения переносят данные от выходных привязок к входным привязкам, а аннотации или поля комментариев объясняют это.`},
  {id:'q21', domain:'d3', type:'mc', q:`Где бы вы установили ограничение на запись для каждого ввода, чтобы рабочий процесс выполнялся быстро во время разработки?`,
    choices:[`Каждый инструмент входных данных, только по одному`, `Конфигурация рабочего процесса, вкладка «Среда выполнения»`, `Опции, настройки пользователя`, `Инструмент «Обзор»`],
    correct:1,
    explain:`На вкладке «Время выполнения» конфигурации рабочего процесса имеется ограничение записи для всех входных данных, а также флажок «Отключить все инструменты просмотра», «Отключить все инструменты, записывающие выходные данные» и флажок «Механизм AMP».`},
  {id:'q22', domain:'d3', type:'mc', q:`Какое расширение файла имеет аналитическое приложение?`,

  {id:'q23', domain:'d3', type:'mc', q:`Коллеге нужен ваш рабочий процесс и все входные файлы и макросы, от которых он зависит, в одном файле. Что вы отправляете?`,

    explain:`.yxzp — это пакет рабочего процесса: рабочий процесс и все его зависимости собраны вместе. Один только .yxmd не содержит ни одного файла, который он читает.`},
  {id:'q24', domain:'d3', type:'mc', q:`Какой тип файла описан Альтерикс как наиболее эффективный для чтения и записи без ограничения размера?`,

    correct:2,
    explain:`.yxdb — это файл базы данных Альтерикс. Он сохраняет типы полей и метаданные, не имеет ограничений на размер строк или файлов и является самым быстрым форматом для Дизайнер.`},
  {id:'q25', domain:'d3', type:'mc', q:`Что такое макрос в Альтерикс Дизайнер?`,

    correct:1,
    explain:`Макрос — это рабочий процесс, упакованный как инструмент многократного использования, сохраненный как .yxmc. Инструмент очистки данных сам по себе является макросом.`},
  {id:'q26', domain:'d3', type:'mc', q:`В каком состоянии движка сдается экзамен Фундамент?`,
    choices:[`Механизм AMP включен`, `Механизм AMP отключен`, `Либо экзамен позволяет избежать различий в двигателях`, `Серверный движок`],
    correct:1,
    explain:`В официальном руководстве по подготовке говорится, что на экзамене тестируется последняя версия Дизайнер рабочего стола с отключенным движком AMP, поэтому ожидаемым ответом является поведение исходного движка.`},

  /* ---------- AREA 4 · The 17 tools (14) ---------- */
  {id:'q27', domain:'d4', type:'mc', q:`Какая выходная привязка инструмента «Соединение» содержит совпадающие записи?`,
    choices:[`L`, `J`, `R`, `T`],
    correct:1,
    explain:`J хранит объединенные записи. L содержит записи левого ввода без совпадений, R содержит записи правого ввода без совпадений. T принадлежит фильтру.`},
  {id:'q28', domain:'d4', type:'mc', q:`Вы хотите, чтобы к каждому клиенту, включая тех, у кого нет заказов, были прикреплены сведения о заказе там, где они существуют. Потребители находятся на входе L. Что вы делаете?`,
    choices:[`Используйте только выход J`, `Объедините выходы J и L`, `Объедините выходы J и R`, `Используйте только выход L`],
    correct:1,
    explain:`Это левое соединение. У J есть клиенты с заказами. У L есть клиенты, которых нет. Союз складывает их. Вместо этого J плюс R отдавали бы все приказы.`},
  {id:'q29', domain:'d4', type:'mc', q:`Инструмент «Фильтр» настроен на <code>[Регион] = "Запад"</code>. Куда идут строки со словом «Восток»?`,
    choices:[`Они удалены`, `К якорю Т`, `К якорю F`, `Только к окну результатов`],
    correct:2,
    explain:`Фильтр никогда не удаляется. Строки, соответствующие условию, выходят через T, строки, не выходящие через F.`},
  {id:'q30', domain:'d4', type:'mc', q:`Какой инструмент объединяет два набора данных с одинаковыми столбцами в один более длинный набор данных?`,
    choices:[`Join`, `Union`, `Summarize`, `Текст в столбцы`],
    correct:1,
    explain:`Союз добавляет строки. Объединение таблиц (JOIN) добавляет столбцы путем сопоставления. Скажите это вслух: «Объединение таблиц (JOIN)» идет вбок, «Союз» идет вниз.`},
  {id:'q31', domain:'d4', type:'ms', q:`Что из этого может сделать инструмент «Выбор»? <em>Выберите все, что применимо.</em>`,
    choices:[`Переименование поля`, `Изменение типа и размера данных поля`, `Удалить строки, которые не соответствуют условию`, `Изменение порядка полей`],
    correct:[0,1,3],
    explain:`Выбор управляет полями: включать, переименовывать, перепечатывать, изменять размер, переупорядочивать, описывать. Удаление строк — это работа Фильтр.`},
  {id:'q32', domain:'d4', type:'mc', q:`Что делает поле «Неизвестно» в инструменте «Выбор»?`,
    choices:[`Помечает поля с нулевыми значениями`, `Улавливает любые новые поля, которые поступают позже, и проверяется по умолчанию.`, `Содержит поля неподдерживаемых типов.`, `Является заполнителем для инструмента «Формула».`],
    correct:1,
    explain:`По умолчанию выбран вариант «Неизвестно», поэтому проходят новые входящие поля. Снимите этот флажок, чтобы удалить любое поле, которое вы не назвали, и перетащите его, чтобы указать, где будут появляться новые поля.`},
  {id:'q33', domain:'d4', type:'mc', q:`Какой инструмент возвращает только агрегированный результат, например общий объем продаж по региону, и удаляет исходные строки?`,
    choices:[`Formula`, `Sort`, `Summarize`, `Sample`],
    correct:2,
    explain:`Обобщать выводит только результаты своих действий. Чтобы сохранить исходные строки рядом с итоговыми значениями, соедините результат обратно в поле «Группировать по».`},
  {id:'q34', domain:'d4', type:'mc', q:`Какое имя выходного поля по умолчанию используется, когда Подвести итог суммирует поле Продажи?`,
    choices:[`Sales`, `Sum_Sales`, `Total`, `Sales_Sum`],

    explain:`При суммировании имен сначала выводятся действия: Сумма_Продаж, Count_Sales, Средние_продажи. Переименовать можно в конфигурации.`},
  {id:'q35', domain:'d4', type:'mc', q:`Какой режим выборки возвращает первую строку из каждой группы из N строк?`,
    choices:[`Первые N строк`, `1 из каждых N строк`, `Шанс 1 из N включить каждую строку`, `Первые N% строк`],
    correct:1,
    explain:`1 из каждых N строк — обычный узор. Шанс 1 из N является случайным. Первые N строк — это верхний срез. Для первого N% требуется два прохода по данным.`},
  {id:'q36', domain:'d4', type:'mc', q:`Поле полного имени должно стать первым и последним столбцами. Какой инструмент?`,
    choices:[`Текст в столбцы`, `Formula`, `DateTime`, `Union`],
    correct:0,
    explain:`Текст по столбцам разбивается по разделителю (здесь это пробел) на заданное количество столбцов. Каждый символ-разделитель обрабатывается отдельно, поэтому разделить слово на слово невозможно.`},
  {id:'q37', domain:'d4', type:'mc', q:`Даты поступают в виде строк типа «15.03.2024». Какой инструмент преобразует их, чтобы математические вычисления с датами работали, и какое имя нового столбца по умолчанию?`,
    choices:[`Формула, столбец Дата_выхода`, `ДатаВремя, столбец ДатаВремя_Выход`, `Выберите, столбец Дата`, `Очистка данных, столбец Clean_Date`],
    correct:1,
    explain:`Инструмент ДатаВремя преобразует строку в формат даты/времени и по умолчанию называет новый столбец ДатаВремя_Выход. Выбирать может перепечатать, но не может проанализировать строку дд/мм/гггг.`},
  {id:'q38', domain:'d4', type:'ms', q:`Что из этого предлагает инструмент очистки данных? <em>Выберите все, что применимо.</em>`,
    choices:[`Удалить начальные и конечные пробелы`, `Замените нули на 0 в числовых полях.`, `Объединение двух файлов по ключу`, `Изменить текст на регистр заголовка`],
    correct:[0,1,3],
    explain:`Очистка данных удаляет нули и нежелательные символы, заменяет нули пробелами или 0 и изменяет регистр. Соединение — это инструмент «Соединение».`},
  {id:'q39', domain:'d4', type:'mc', q:`Какой самый быстрый способ добавить инструмент «Обзор» после выбранного вами инструмента?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

/* ============== EXAM + OPTIONAL TIMER ==============
   The real exam allots 1 hour for 40 questions. The timer is an optional pacing
   drill at that same 60 minutes, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){

      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;

  const pct = Math.round(100*answered/total);

  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';

    return `<класс кнопки="${cls}" onclick="gotoQ(${n})" заголовок="Вопрос ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен Фонда Альтерикс${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<класс диапазона="экзамен-таймер${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}> ← Предыдущий</button>

    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}

}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<класс кнопки="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <класс div="q-карта${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: Alteryx does NOT publish a passing score for the Foundation Micro-Credential.
   PASS_PCT is OUR readiness bar and the page says so. Raw percent, 1 point per question. */
const PASS_PCT = 70;  // ours, not Alteryx's
const READY_PCT = 80; // our recommendation for margin

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Очистите нашу 70%-ную планку, есть свободное место. Садись.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"Планка выше 70%, но худая. Закройте свое самое слабое место и сядьте на него.", tone:'warn'};
  if(pct >= 55) return {label:"Под нашим баром. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Напротив нашего бара: <сильный стиль="цвет:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против нашего ${PASS_PCT}% готовности</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий экзамен состоит из 40 вопросов по 1 баллу каждый с частичным зачетом за несколько ответов. <strong>Альтерикс не публикует проходной балл</strong>, так ${PASS_PCT}% — это наша шкала готовности, а не их. Мы предлагаем ${READY_PCT}%+ здесь, прежде чем сесть, как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <href="#изучать-${k}" onclick="setView('study',{scrollToSection:'${k}'}); вернуть ложь;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаки. <href="#изучать-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
