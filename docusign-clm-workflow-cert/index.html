<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}

.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}

.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}

.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}

.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}

.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}

.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}

.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}

<script>
/* ============== STATE ============== */

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Anthropic API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `Вы откровенный преподаватель Docusign CLM, помогающий кому-то подготовиться к экзамену Docusign CLM Workflow Pro. Этот экзамен охватывает администрирование рабочих процессов Docusign CLM: конструктор рабочих процессов, этапы рабочего процесса (автоматическое управление документами, человек, механизм, интеграция, планирование и связь), переменные и выражения Params XML, XPath и C#, этапы создания документов и электронной подписи, способы запуска рабочих процессов, ограничения услуг, обработку ошибок и публикацию. Речь идет о Docusign CLM, а НЕ CLM.CM (более старая платформа SpringCM).`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Объясните этот экзаменационный вопрос иначе, чем написано здесь:
"${fact}"

Правила: максимум 3 предложения. Одна идея в предложении. Используйте повседневное сравнение, если это помогает. Скажите, что, скорее всего, об этом спросят на экзамене. Никакой преамбулы, никакого повторения вопроса.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} Студент неправильно ответил на этот практический вопрос.

Вопрос: ${stripTags(q.q)}
Они выбрали: ${picked}
Правильный ответ: ${right}

Максимум в трех предложениях скажите, что вас, вероятно, смутило, а затем приведите одно простое правило, которое разделяет эти два понятия. Никакой преамбулы.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

      `<strong>Четыре системные переменные</strong>: <code><%#System.Link%></code> (ссылка на задачу, уникальная для экземпляра), <code><%#Система.Дата%></code>, <code><%#System.Time%></code> (оба по локали сервера) и <code>%#System.Uid%</code>, идентификатор экземпляра. Docusign советует всегда включать Uid в электронные письма о сбоях или ошибках. Чтобы просмотреть список, экспортируйте рабочий процесс в формате JSON.`,
      `<strong>Переменные курсора начинаются с ^.</strong> CLM создает их, например, после завершения действия. <code>^Найти идентификаторы документов 1.</code> после шага «Найти документ» находит один документ. Они отображаются в списке «Переменные и значения» на странице «Действия». Выражения могут их читать: <code>GetVariableValue("^Одобрить 1 комментарий")</code>.`,
      `<strong>Обновление значения переменной имеет три выхода.</strong>: <em>Updated</em>, <em>Не обновлено</em> and <em>Failed</em>. Его данные живут только внутри одного экземпляра. Чтобы получить данные, вы запускаете дополнительный рабочий процесс с <em>Workflow</em> шаг, использовать <em>Обновить родительскую переменную</em> от дочернего процесса (этот шаг можно использовать только в дочернем рабочем процессе) или используйте <em>Установить выходные данные рабочего процесса</em>. Вы не можете использовать обновление значения переменной для системных переменных, переменных курсора или параметров.`,
      `<strong>Оценка xPath</strong> запускает выражение XPath для переменной (Params, XML-документа, XML-папки, чего-либо со схемой XML) и возвращает один из четырех типов результатов: <em>Boolean</em>, <em>Number</em> (Двойной), <em>String</em>, или <em>Набор узлов</em>. Собственный пример Docusign: <code>//ScorecardElement[./Topic/text()='Компенсация' и ./RiskLevel/text()='Высокий']</code>.`,
      `<strong>Three ways to load a variable from a file.</strong> <em>Update Variable From XML</em> uses an XPath to pull a node from an XML file in CLM. <em>Update Variable from CSV</em> looks up a row by a column value (the lookup column should be unique; if not, the first match wins). <em>Create Variable from CSV</em> ingests a whole CSV into a Custom XML variable: the CSV must be in a CLM folder, have a header row and at least two columns, stay under <code>1 MB</code>, and the variable it creates cannot exceed <code>5 MB</code>.`,
      `<strong>Выражения — это C#.</strong> Вы открываете построитель выражений с помощью значка рядом с полем, вводите поле ввода C# и <em>Save</em> подтверждает это. Можно использовать только пространства имен из белого списка Docusign. Прочитайте переменную, отличную от XML, с помощью <code>GetVariableValue("имя")</code> и переменная XML с <code>_context.XmlVariables["имя"].ValueString</code>.`,
      `<strong>Текущая дата превосходит DateTime.Now.</strong> <em>Текущая дата</em> дает дату в часовом поясе вашей учетной записи. <em>ДатаВремя.Сейчас</em> дает время машины, выполняющей выражение, без гарантированного часового пояса. Используйте DateTime.Now только тогда, когда время суток имеет значение и <em>ДатаВремя.UtcNow</em> плюс конвертация, когда вам нужна конкретная зона.`,
      `<strong>Не пишите выражение для задания, которое может выполнить поле.</strong> Лучшая практика Docusign: замените выражения, которые вызывают только GetVariableValue, или объедините строки, например, помещая переменные прямо в поле. <code><%#Variable.SubmitedBy%></code>. Объедините выражения, которые работают с одними и теми же данными. Каждое выражение учитывается в лимите 300 на 15 минут.`,
      `<strong>Решение против правила.</strong> A <em>Rule</em> оценивает одно условие и выводит <em>True</em> or <em>False</em>. А <em>Decision</em> занимает несколько <em>If</em> условия, каждое из которых имеет свою собственную именованную выходную строку плюс <em>Else</em> путь по умолчанию. За задачей маршрутизации «обычно следует этап принятия решения».`,
      `<strong>Шаги цикла.</strong> <em>Для цикла</em> увеличивает переменную на 1 каждый цикл, пока она не совпадет <em>Количество петель</em>. <em>Для каждого цикла</em> выполняет итерацию Итератора по XML, последовательного по умолчанию или параллельного, с выходными данными <em>Step</em>, <em>Конец цикла</em> and <em>Failure</em>. <em>Следующий цикл</em> — это дополнительный визуальный маркер завершения. Это не обязательно, но все равно учитывается в лимите активности.`,
      `<strong>Шаги поиска имеют четыре выхода, а успех — это ловушка.</strong> Поиск документов по папке и поиск документов по метаданным. <code>50</code> документы по умолчанию и до <code>200</code>. Их результаты <em>Success</em> (запустилось без ошибок, найдено или нет), <em>Failure</em>, <em>Match</em> (по крайней мере один найден) и <em>Нет совпадений</em>. Find Party также возвращает значение до 200. Find User может храниться только в переменной Actor.`,
      `<strong>Обновить значение метаданных документа можно двумя способами.</strong> <em>Выберите атрибут</em> устанавливает атрибуты по одному. <em>XML</em> для массовых обновлений и удалений требуется одна полезная нагрузка: она начинается с <code><UpdateMetadata UpdateType="Patch"></code> or <code>"Помещать"</code> (PATCH используется по умолчанию) и <code>Удалить = "истина"</code> работает только под PATCH. Обновления XML касаются только пользовательских атрибутов; стандартные атрибуты, такие как Party, проходят <em>Изменение атрибутов соглашения CLM</em>.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Если шаг «Найти» пошел по пути успеха, он что-то нашел». Успешный поиск документов по папке означает, что шаг был выполнен без ошибок независимо от того, вернулся документ или нет. Пути, которые говорят что-либо о результатах, <em>Match</em> and <em>Нет совпадений</em>. Рабочий процесс, который завершается успешно, а затем пытается использовать найденный документ, представляет собой классическую ошибку «работает при тестировании, завершается сбоем в пустой папке».`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Created</b> <span style="color:var(--dim);font-size:13px">Date, Number, Text, ID List, Iterator, Actor, Custom XML, Document, Folder</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>System</b> <span style="color:var(--dim);font-size:13px">System.Link, Date, Time, Uid</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Caret ^</b> <span style="color:var(--dim);font-size:13px">made by a completed step</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Params is the created one you never edit in place.</div>`},

  {key:'d3', title:"Этапы создания, проверки и подписи",
    must:[
      `<strong>Действия, выполняемые человеком, становятся задачами на странице «Задачи» исполнителя, а список</strong>: утверждение, выбор, выбор документов, выбор пользователей, создание или загрузка документа, сверка данных, редактирование документа, редактирование формы, заполнение формы, форма полностраничного редактирования, просмотр и отправка на внешнее рассмотрение, просмотр и отправка на подпись, просмотр данных и маршрутизация. Если названия шага вопроса нет в этом списке, возможно, это автоматизированный шаг.`,
      `<strong>Утвердите маршруты по решению.</strong> Выбор уполномоченного по утверждению или отклонению становится выходным путем шага. Надписи кнопок можно настраивать (по умолчанию <em>Approve</em> and <em>Reject</em>), а комментарии могут быть обязательными, необязательными или опущенными. А <em>Сценическое имя</em> подает отчет «Шаги рабочего процесса»; а <em>Отображаемое имя</em> — это то, что пользователь видит в столбце «Имя задачи».`,
      `<strong>Назначение имеет три циферблата.</strong> Назначьте пользователю или группе задач. Для нескольких человек, <em>Любой правопреемник</em> выполняет задание по первому ответу, при этом <em>Все правопреемники</em> ждет всех. <em>Распределяйте задачи по порядку</em> передает его первому человеку, затем следующему.`,
      `<strong>Группа задач — это совокупность пользователей, которые совместно используют список задач.</strong> Участникам может быть предоставлено семь разрешений: «Владелец группы задач», «Просмотр группы задач», «Просмотр выделенного элемента», «Специальная задача выбора» (заявка), «Может выполнять распределение на основе пользователей» (перераспределение), «Вернуть в группу задач» и «Автоматическая отправка» (позволить рабочим процессам автоматически назначаться этому участнику). Оставьте поле «Назначенный группы задач» пустым, и задача станет доступна всей группе.`,
      `<strong>Сроки выполнения: от 0 до 999 единиц месяцев, недель, дней, часов или минут.</strong>, с возможностью до пяти дополнительных приращений. Если вы установили дату сдачи, вам также следует подключить <em>Тайм-аут – действие</em> путь, потому что именно туда идет шаг, когда никто не действует.`,
      `<strong>Рабочий день составляет 8 часов.</strong> With <em>Используйте только рабочие дни</em>, «1 день» (24 часа) превращается в три рабочих дня. Чтобы выполнить задачу на два рабочих дня позже, установите время ожидания <code>16 часов</code>. Параметр 2 дня и 8 часов становится 7 рабочими днями.`,
      `<strong>When the first reminder fires.</strong> With <em>Send reminder after execution</em> selected, the first reminder goes out that long <em>after the task is created</em>. Without it, it goes out that long <em>before the due date</em>. No due date at all, and it fires after the First Reminder interval from creation. A reminder runs on a parallel thread; the task stays pending.`,
      `<strong>Выбор против маршрутизации.</strong> Оба просят человека выбрать путь. Choice имеет фиксированный список вводимых вами параметров. Маршрутизация может заполнять свои параметры из списка, разделенного запятыми или вертикальной чертой, встроенного в построитель выражений, поэтому варианты выбора могут быть динамическими. Оба шага' <em>Ссылка на следующий шаг</em> Опция работает только в том случае, если следующий шаг человека назначен тому же пользователю, и ее нельзя включать на последнем шаге человека.`,
      `<strong>Отмена шага.</strong> Tick <em>Включить отмену шага</em> на человеческом шаге и <em>Шаг отменен</em> появляется вывод. Вы должны подключить его, иначе отмена может привести к сбою рабочего процесса. Отменяемыми этапами являются «Утверждение», «Выбор», «Редактирование документа», «Просмотр и отправка на внешнее рассмотрение», «Просмотр и отправка на подпись», «Просмотр данных» и «Маршрутизация». Пользователь отказывается от просмотра документа с помощью <em>Отменить текущий шаг</em> на вкладке «Активность». Открытые задачи на этом шаге отменяются, извлечённый документ регистрируется, а завершенные задачи остаются нетронутыми.`,
      `<strong>Кто может отменить.</strong> Собственные авторизованные пользователи или группы задач этого шага, а также лица, обладающие делегированными разрешениями, включающими <em>Отмена шага рабочего процесса</em>. Отдельный трюк для «Выбор пользователей» и «Выбор документов»: включите <em>ActionRejected</em> вывод, и в задаче появляется кнопка «Отмена», направляющая туда, куда вы указали эту строку.`,
      `<strong>Генерация документов — это автоматизированный этап.</strong> Вы называете существующий <em>Конфигурация создания документа</em> и <em>Template</em> внутри него, при необходимости, идентификатор объекта Salesforce и данные канала либо как <em>Обновить значения</em> пары или входную переменную XML. Его результаты <em>Success</em>, <em>Условный успех</em> and <em>Failure</em>.`,
      `<strong>Два отправителя подписи, один официант.</strong> <em>Отправить на подпись</em> является автоматическим. <em>Рассмотрение и отправка на подпись</em> — это человеческая задача, в ходе которой пользователь готовит конверт. <strong>Параметр «Ожидание подписи» необходимо использовать с параметрами «Просмотр» и «Отправить на подпись», но не следует использовать с параметрами «Отправить на подпись».</strong> Оба отправителя принимают форматы DOC, DOCX и PDF, а получателям не обязательно быть пользователями CLM.`,
      `<strong>Фирменные пошаговые правила, которые молча терпят неудачу в дикой природе.</strong> Если получатель в поле «Кому» также отображается в примененном шаблоне конверта, этот шаг не будет выполнен. <em>Дни истечения срока действия</em> достигает максимума в <code>180</code>. А <em>Пароль подписывающего лица</em> является необязательным. Электронная подпись <em>Отправить позже</em> опция несовместима с функцией «Просмотр и отправка на подпись», а подготовка длинного конверта может попасть в CLM. <em>Таймаут простоя сеанса</em>.`,
      `<strong>Документы, Документы и шаблоны, Шаблон конверта.</strong> Plain <em>Documents</em> отправляет файлы без шаблона. <em>Документы и шаблоны</em> применяет метаданные шаблона конверта (получатели, сообщение) к каждому документу, но не к документам шаблона. <em>Шаблон конверта</em> поле применяет настройки, получателей <em>and</em> документы из шаблона ко всему выбранному. Шаблоны уже должны существовать в учетной записи электронной подписи.`,
      `<strong>Подождите, пока Signature наблюдает за событиями аудита</strong>: нет, отправлено, просмотрено, подписано, отклонено, делегировано, письмо отклонено, запечатано. Его выходные данные: «Отменено», «Подписано», «Отклонено», «Обновлено», «Сбой» и «Тайм-аут». <em>Отменить электронную подпись</em> это отдельный автоматический шаг, который отменяет запрос.`,
      `<strong>Электронная почта против электронного документа.</strong> <em>Email</em> (этап планирования и связи) отправляет сообщение с параметрами «От», «Кому», «CC», «СК», «Тема» и «Тело», а тема и тело могут быть выражениями. <em>Отправить документ по электронной почте</em> (автоматический этап документа) прикрепляет документы, отправляет их как <em>Native</em> or <em>PDF</em>, позволяет <code>50</code> получатели и <code>20,48 МБ</code> вложений и может добавить подпись CLM отправителя из «Моих настроек».`,
      `<strong>Просмотр данных</strong> назначает до <code>50</code> атрибуты одного пользователя или одной группы задач для просмотра и заполнения в задаче. Поддерживаются: сторона, тип, значение, дата вступления в силу, дата истечения срока действия и пользовательское число, десятичное число, дата, раскрывающийся список, динамический раскрывающийся список и каскадный раскрывающийся список. Не поддерживается: атрибуты Actor и Autonumber. Для этапов извлечения данных ИИ требуется этап просмотра данных в том же рабочем процессе.`,
      `<strong>Update Security</strong> sets a user's access on documents or folders: Inherit from Parent Folder, No Access, View, View &amp; Create, View &amp; Edit, View, Edit &amp; Delete, View, Edit, Delete &amp; Set Access, or a Security Variable. Docusign's best practices: select <em>Wait for the update to complete</em>, assign to groups not users, skip administrators (they already have full access), avoid duplicate rules, and apply security right after creating a folder.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Отправить на подпись, затем дождаться подписи». Документ Docusign прямолинеен: дождитесь пары подписи с <em>Рассмотрение и отправка на подпись</em> и не должен использоваться с <em>Отправить на подпись</em>. Автоматический отправитель уже отслеживает конверт по собственному пути вывода. Поставьте официанта после неправильного отправителя, и рабочий процесс останется там.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Send for Signature</b> <span style="color:var(--dim);font-size:13px">automatic, no task</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Review and Send for Signature</b> <span style="color:var(--dim);font-size:13px">human task, then ↓</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);border-color:var(--accent)"><b>Wait for Signature</b> <span style="color:var(--dim);font-size:13px">only after the human one</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Same pattern for external review: an automatic sender, a human sender, one waiter.</div>`},

  {key:'d4', title:"Запуск рабочих процессов, лимиты и администрирование",
    must:[
      `<strong>В любом случае начинается опубликованный рабочий процесс.</strong> Вручную на вкладке Конфигурация. Из <em>Умное правило</em> чьи действия <em>Начать рабочий процесс</em>. Из <em>Конфигурация создания документа</em> связано с этим. Из электронной подписи <em>Соглашение Действие</em> установите значение «Начать рабочий процесс». Из потока продаж Salesforce <em>Запустить рабочий процесс Docusign CLM</em> действие. Из файлов CLM <em>пользовательское действие</em>. Из родительского рабочего процесса <em>Workflow</em> шаг. Или он ожидает в середине потока вызова API с <em>Ждите сигнала</em>.`,
      `<strong>Умное правило: действие «Начать рабочий процесс»</strong> действителен с <em>События документа</em> and <em>Запланированные события</em>, и для этого требуется «ранее определенный и опубликованный расширенный рабочий процесс». Пример правила Docusign: событие <em>Документ добавлен</em>, <em>Выполнить как: указанный пользователь</em>, фильтрует подпапку и имя типа «NDA», действие <em>Начать рабочий процесс</em>.`,
      `<strong>Схема работы Salesforce</strong> требуется Docusign Apps Launcher 6.3 или выше. Действие занимает <em>Идентификатор записи</em> и <em>Имя рабочего процесса</em>, а имя должно совпадать с точным именем активного рабочего процесса CLM. Ошибка в написании или неактивный рабочий процесс означает, что Salesforce не сможет его запустить. Старый маршрут — это пользовательская кнопка на макете страницы.`,
      `<strong>Дополнительное действие CLM Files</strong> встроен в администраторе под <em>Навигация и действия</em>, настройка <em>Действия с файлами CLM</em>. Его <em>Что должно делать это действие?</em> is <em>Начать рабочий процесс</em>, и он может передавать выбранные идентификаторы документов и идентификатор триггерного пользователя в рабочий процесс.`,
      `<strong>Действия по соглашению передают данные конверта в рабочий процесс в виде пользовательского XML.</strong> Затем вы извлекаете поля с помощью Evaluate xPath, например имя получателя в <code>/Параметры/конверт/получатели/подписавшие/элемент/имя/текст()</code> или название первого документа в <code>/Params/envelope/envelopeDocuments/item[order/text()=1]/name/text()</code>.`,
      `<strong>Ограничение в 300 выражений приостанавливается, оно не дает сбоя.</strong>Экземпляр рабочего процесса может оценить <code>300</code> выражения в любом 15-минутном окне. При этом CLM приостанавливает работу экземпляра и отправляет электронное письмо пользователям в <em>Пользователь уведомления об ошибках расширенного рабочего процесса</em> настройка аккаунта. Если никто не предпринимает никаких действий до запланированного дня очистки, рабочий процесс прерывается и очищается. Это касается новых редакций, созданных с 12 августа 2025 г. (UAT) и 2 сентября 2025 г. (Производственная версия).`,
      `<strong>Лимит активности — 10 000 на инстанс.</strong> для редакций, опубликованных после 28 апреля 2022 г. (UAT) и 13 мая 2022 г. (Производство); в более старых версиях сохраняется 100 000. Каждый выполненный шаг — это одно действие, включая следующий цикл. При превышении лимита экземпляр приостанавливается и назначается дата очистки, и только служба поддержки Docusign может поднять ее. Отдельно не более <code>5,000</code> действия могут выполняться последовательно без участия человека или асинхронных действий.`,
      `<strong>Выполнение или пауза имеет срок годности.</strong> 365 дней в производстве и 90 дней в UAT, затем CLM прерывает проверку и планирует очистку. Рабочий процесс, который система приостановила из-за достижения какого-либо ограничения, начинает очищаться через 30 дней после приостановки.`,
      `<strong>График очистки — это настройка учетной записи.</strong> <em>Дней после завершения рабочего процесса</em> and <em>Дни после сбоя рабочего процесса</em> оба принимают <code>7</code> to <code>30</code> и по умолчанию <code>7</code>. <em>Отложить очистку для рабочих процессов с подпроцессами</em>, в настройках «Рабочий процесс и задачи», сохраняет родительские, дочерние и одноуровневые данные до завершения последнего.`,
      `<strong>Пропускная способность на аккаунт.</strong> Рабочих процессов, запущенных в час: <code>100</code> в UAT <code>1,000</code> в производстве. Казни за 15 минут: <code>500</code> в UAT <code>12,000</code> в производстве. Выполнение засчитывается при запуске рабочего процесса. <em>or</em> возобновляется с асинхронного этапа, такого как отправка на подпись.`,
      `<strong>Ограничения по размеру.</strong> Одна переменная: <code>5 МБ</code>. Все переменные в одном рабочем процессе: <code>25 МБ</code>. Вывод одной оценки выражения: <code>1 МБ</code>. Пользовательский интерфейс показывает максимум <code>1,000</code> выполненные шаги рабочего процесса.`,
      `<strong>Редактирование конфиденциальных значений.</strong> В переменной отметьте галочкой <em>Не отображать значение переменной</em> и монитор процесса показывает <em>Redacted</em> в разделе «Информация о шаге» и «Переменные и значения». Он не редактирует данные, передаваемые функцией Update Parent Variable, и записанное в журнал выражение по-прежнему отображает данные переменной. Docusign предупреждает, что ненужное редактирование вредит работе службы поддержки по устранению неполадок.`,
      `<strong>УАТ к Производство экспортное и импортное.</strong> Экспортируйте JSON из UAT, импортируйте его в новый рабочий процесс в Production, переименуйте, сохраните, переназначьте любые шаги рабочего процесса Maestro в рабочие процессы Production Workflow Builder, затем опубликуйте и запустите. Имена Workflow Builder должны быть уникальными в рабочей среде, иначе вызов завершится неудачно.`,
      `<strong>Детские рабочие процессы и абортированные родители.</strong> Если родительский процесс завершается сбоем или прерывается, дочерний процесс, ожидающий асинхронного шага (например, «Ожидание подписи»), прерывается, когда CLM его проверяет, примерно через 24 часа после даты последней обработки действия. Дочерний элемент, который закончит до того, как проверка выживет.`,
      `<strong>Три этапа уборки.</strong> <em>Logger</em> записывает сообщение в монитор рабочего процесса. <em>Обновить информацию</em> устанавливает столбец «Информация» на страницах «Задачи» и «Действия рабочего процесса». <em>Установить имя процесса рабочего процесса</em> называет процесс в отчете «Шаги рабочего процесса», и его необходимо настроить только в родительском элементе.`,
      `<strong>Этапы интеграции</strong>: Http-клиент (исходящий HTTPS/REST), вызов веб-службы, Salesforce ETL (данные Salesforce в реальном времени в формате XML), обновление Salesforce (по образцу SOQL), создание нового объекта Salesforce, добавление задачи Salesforce, добавление истории активности Salesforce, Excel ETL, соединения (соединители NetSuite и Workday Financials, добавляемые первыми на странице «Соединения») и рабочий процесс Maestro (запускает рабочий процесс Workflow Builder).`

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const inProgress = state.examStart !== null && !state.submitted;
  return `

/* ============== EXAM + OPTIONAL TIMER ==============
   The real Pro exam has NO time limit. The timer is an optional pacing drill
   against Docusign's own ~50-minute estimate, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Упражнение по темпу завершено. Экзамен сдан.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Практический экзамен · ${QUESTIONS.length} questions</h2>

        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Начните без ограничения по времени</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Тренировка по темпу, ${EXAM_MINUTES}:00 ⏱</button>
        </div>
      </div>
      <div class="method-callout">
        <strong>На настоящем экзамене нет часов.</strong> Docusign оценивает около ${EXAM_MINUTES} минут и сохраняет ваш прогресс, если вы остановитесь на полпути, поэтому честная репетиция не рассчитана по времени. Упражнение на темп подойдет только в том случае, если вы хотите попрактиковаться в том, чтобы не думать слишком много.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Восемь промахов – это весь бюджет.</strong> Настоящий экзамен — это 40 заданий на 80%, то есть 32 сдаются правильно, а 31 — нет. Ответьте на все. Задание без ответа оценивается так же, как и неправильное.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">Посмотреть результаты →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?"Сдать экзамен":'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<класс кнопки="${cls}" onclick="gotoQ(${n})" title="Вопрос ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Практический экзамен по CLM Workflow Pro${state.timed?" · упражнение на темп":''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="экзамен-таймер${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Зафиксируйте и отправьте →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Зафиксировать и продолжить →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Сдать экзамен →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}> ← Предыдущий</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Далее →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? "Выберите каждый подходящий вариант, а затем зафиксируйте его. Никакого частичного кредита. Вам нужны все правильные и ни одного неправильного."
      : "Выберите ответ, и он зафиксируется, а затем продвинет вас дальше. Используйте «Предыдущий» или панели выше, чтобы изменить его перед отправкой."}
      Ничто не оценивается, пока вы не отправите заявку.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<класс кнопки="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : "Берегись: "}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Все еще неясно? Получить подсказку →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-карта${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?"<span class=\"ms-tag\">· множественный ответ</span>":''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`Вы ответили ${answered} of ${QUESTIONS.length}. Вопросы без ответа считаются неправильными, как и настоящий экзамен. Все равно отправить?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the Docusign University exam page states 40 items and 80% to pass.
   There is no scaled score, so we report raw percent against that same line. */
const PASS_PCT = 80;
const READY_PCT = 88; // our recommendation, NOT Docusign's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:"Вдали от линии 80%, есть свободное место. Забронируйте это.", tone:'good'};
  if(pct >= PASS_PCT) return {label:"За чертой 80%, но тонкий. Закройте самое слабое место, а затем забронируйте его.", tone:'warn'};
  if(pct >= 65) return {label:"Под чертой, и это цифры, которые вам стоят. Поработайте над учебным пособием, а затем пересдайте это.", tone:'warn'};
  return {label:"Холодный старт. Прочтите все четыре раздела до конца, а затем повторите это.", tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Практический экзамен · Результаты</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">На фоне реального бара: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">против. ${PASS_PCT}% нужный</span></div>
      <p class="score-sub" style="margin-top:14px">Настоящий экзамен — это 40 заданий, оцениваемых по абсолютному проценту правильных ответов. <strong>80%</strong> пасов, так что восемь промахов — это весь бюджет. Мы предлагаем ${READY_PCT}%+ здесь перед бронированием, просто как запас для набора вопросов, который формулирует вещи по-другому.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? "Чистая развертка. Двигаться дальше."
          : p >= 80 ? `Почти там. Перечитайте <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'}); вернуть ложь;">${d.label} раздел исследования</a> один раз.`
          : p >= 50 ? `Шаткие, и при 80% пройти это дорого. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Сначала сосредоточьтесь здесь. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Просмотрите ответы и пояснения</button>
      <button class="btn btn-ghost" onclick="setView('study')">Открыть учебное пособие</button>
      <button class="btn btn-primary" onclick="retake()">Пересдать экзамен <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm("Очистить свои ответы и пересдать пробный экзамен?")) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
