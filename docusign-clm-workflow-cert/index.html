<meta name="description" content="Подготовка к экзамену Документируйте CLM Workflow Pro. Подробное учебное пособие по Конструктор рабочих процессов CLM, переменным и XML, шагам создания и подписи, триггерам и ограничениям обслуживания, а также практический экзамен из 44 вопросов, оцениваемый по реальному проходному баллу 80%.">

<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>

<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Вернуться ко всем комплектам">← Все комплекты</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Подготовка Документация CLM Рабочий процесс Про</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>

  <button class="nav-btn" id="navExam" onclick="setView('exam')">Практический экзамен</button>

<main id="app"></main>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dsclmwfcert';
const EXAM_MINUTES = 50;   // Docusign estimates ~50 min. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? "Ключ сохранен. Подсказки включены." : "Ключ очищен.");
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = "Добавьте свой ключ Антропный API на главной странице в разделе «Подсказки», чтобы включить подсказки."; return; }
  el.textContent = "Думая…";
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || "Запрос отклонен. Проверьте свой ключ."; return; }
    el.textContent = data.content?.[0]?.text || "Никакого ответа. Проверьте свой ключ.";
  } catch(e){ el.textContent = "Запрос не выполнен. Проверьте свой ключ и соединение."; }
}
const TUTOR_ROLE = `You are a plain-spoken Docusign CLM tutor helping someone study for the Docusign CLM Workflow Pro exam. That exam covers administering Docusign CLM workflows: the workflow designer, workflow steps (automated document management, human, engine, integration, scheduling and communication), variables and the Params XML, XPath and C# expressions, document generation and eSignature steps, how workflows are started, service limits, error handling and publishing. It is about Docusign CLM, NOT CLM.CM (the older SpringCM platform).`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : "(нет ответа)");
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== EXAM AREAS ==============
   Docusign says the exam covers "skills used when administering Docusign CLM Workflows"
   and publishes NO domain list and NO weights. The four areas below follow the shape of

   starting and limits). The percentages are OUR study allocation and are labeled as such
   on the page. */

      docPath:'https://support.docusign.com/s/document-item?language=en_US&bundleId=yks1643320936212&topicId=ref34fe83d1-1d73-4e4e-9685-283c759b8526.html&_LANG=enus',

      hint:"Действия и задачи, выполняемые человеком, группы задач, сроки выполнения и напоминания, отмена, создание документов, отправка на подпись или проверка и отправка на подпись, ожидание подписи, электронная почта или документ электронной почты, обновление безопасности.",
      docPath:'https://support.docusign.com/s/document-item?language=en_US&bundleId=yks1643320936212&topicId=qkt1576610095922.html&_LANG=enus',
      docLabel:"Этапы человеческого рабочего процесса в Документация CLM"},
  d4:{label:"Зона 4", name:"Запуск рабочих процессов, лимиты и администрирование", weight:15, color:'var(--c-d4)',
      hint:"Каждый способ запуска рабочего процесса, ограничения выражения и активности, что означает «приостановлено», графики очистки, редактирование, UAT в производство, этапы интеграции.",
      docPath:'https://support.docusign.com/s/document-item?language=en_US&bundleId=pxt1643324456371&topicId=woi1737643109961.html&_LANG=enus',
      docLabel:"Ограничения службы Документация CLM"}
};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:"Основы Дизайнер рабочих процессов: холст, шаги, версии, публикация",
    must:[
      `<strong>Где живут рабочие процессы.</strong> Select <em>Admin</em> в заголовке навигации, затем <em>Workflows</em> under <strong>Инструменты автоматизации</strong>. Страница «Рабочие процессы» имеет две вкладки: <strong>Configuration</strong> (дизайны) и <strong>Activity</strong> (работающие и готовые экземпляры). <em>Новый рабочий процесс</em> offers <em>Расширенный рабочий процесс</em> or <em>Используйте шаблон</em>.`,
      `<strong>Имя рабочего процесса содержит 100 буквенно-цифровых символов.</strong> Рабочий процесс <em>variable</em> имя сохраняется <code>250</code>. Два разных лимита, и экзамен любит их менять местами.`,
      `<strong>Пять ответов на вопрос «Какой тип контента положит начало этому рабочему процессу?»</strong>: <em>Конфигурация создания документов</em>, <em>Документ</em> (созданный, отредактированный или загруженный), <em>Пользовательский XML</em>, <em>Папка</em>, и <em>Этот рабочий процесс начнется без контента</em>. Выберите последний и входящую переменную содержимого (<code>Params</code>) пусто.`,
      `<strong>Дизайнер только английский.</strong> Документация говорит, чтобы сохранить <em>Язык учетной записи по умолчанию</em> настройка учетной записи на английском языке при использовании конструктора рабочих процессов. Другие языки могут вызвать проблемы с рабочими процессами.`,
      `<strong>Строим на холсте.</strong> The <strong>Start</strong> шаг уже находится на холсте, когда открывается дизайнер. Вы ищете <em>Добавить шаги</em> список, перетащите шаг на холст, выберите шаг и перетащите линию к следующему, затем установите поля каждого шага в <strong>Свойства шага</strong> панель справа.`,
      `<strong>Каждая соединительная линия несет в себе условие.</strong> Select the arrow and choose from <em>Перейдите по этой ссылке, если результат последнего действия</em>, например <code>Success</code>. Шаги маршрутизируются по их последнему результату действия, и каждый тип шага имеет свой собственный список выходов.`,
      `<strong>Шаг «Начало» имеет три настройки, которые стоит знать.</strong>: <em>Имя рабочего процесса</em>, <em>Отправка уведомления, когда рабочий процесс обнаруживает ошибку</em> (с <em>Пользователи для получения уведомлений</em>), и <em>Отслеживайте и записывайте активность рабочего процесса</em> для отчетности.`,
      `<strong>Отделка не является украшением.</strong> Шаг Заканчивать сообщает механизму, где рабочий процесс успешно завершается. Он должен присутствовать и быть достигнутым, чтобы возобновить ожидающий родительский рабочий процесс. Без него рабочий процесс, который останавливается на неудачном этапе, отображается как <em>Complete</em> в мониторе активности. У вас может быть более одного шага завершения.`,
      `<strong>Сохранение не является публикацией.</strong> <em>Сохраните изменения</em> предоставляет вам неопубликованный рабочий процесс на вкладке Конфигурация. Чтобы запустить его, выберите <em>Создание и публикация версий</em> кнопку и на <strong>Версии и публикация</strong> выбор панели <em>Publish</em> для версии, над которой вы работаете. Затем он показывает <em>Published</em> статус.`,
      `<strong>Запуск вручную.</strong> На вкладке Конфигурация установите флажок рядом с опубликованным рабочим процессом и выберите <em>Начать рабочий процесс</em>. Вы можете выбрать документ, чтобы начать его, или выбрать <em>PROVIDE CUSTOM PARAMETERS</em> и вставьте параметры. Затем экземпляр появится на странице «Активность».`,
      `<strong>Клонировать = Экспортировать JSON, Импортировать JSON.</strong> Откройте проект, выберите <em>Export</em> and <em>Экспорт JSON</em>, создайте новый расширенный рабочий процесс, выберите <em>Import</em>, выберите файл, дайте ему новое имя и сохраните. Изменения клона никогда не затрагивают оригинал. При переходе от UAT к производству используются одни и те же экспорт и импорт.`,
      `<strong>Удаление является щадящим.</strong> При удалении рабочего процесса выполняемые экземпляры завершаются без ошибок. Только после того, как они закончат, рабочий процесс исчезнет из учетной записи.`,
      `<strong>Имя и описание шага.</strong> Каждому шагу автоматически присваивается уникальное имя шага, и Документация рекомендует оставить имя по умолчанию. Описание шага отображается под шагом на холсте. <em>and</em> в мониторе процесса, поэтому это важно для устранения неполадок.`,
      `<strong>Пять семейств ступеней</strong>: <em>автоматизированный документооборот</em> (создавать, перемещать, отправлять по электронной почте, блокировать, атрибутировать документы), <em>human</em> (задачи на странице Задачи), <em>engine</em> (переменные, циклы, решения, подпроцессы), <em>integration</em> (Salesforce, REST, API электронной подписи) и <em>планирование и общение</em> (таймеры, напоминания, электронные письма).`,
      `<strong>Дорожка, Пул и Группа не являются ступеньками.</strong> Это наглядные пособия, которые рисуют на холсте цветную рамку с надписью и изменяемым размером. Они ничего не делают во время выполнения. Дорожка может находиться внутри пула.`,
      `<strong>Шесть шаблонов рабочих процессов</strong>: внутреннее утверждение, запуск другого процесса, редактирование документа, согласование, маршрутизация и подпись. Они предназначены для «администраторов и полных подписчиков с привилегиями рабочего процесса», их можно открыть в дизайнере для детальной настройки, а выбор их триггера — <em>Пропустить сейчас</em> or <em>Генерация документов</em>.`,
      `<strong>Страница «Активность» — это монитор процесса.</strong> Фильтровать по <em>Workflow</em>, <em>Последнее обновление</em> and <em>Статус рабочего процесса</em>, затем выберите имя рабочего процесса, чтобы открыть его. На панели «Информация о рабочем процессе» отображается <em>Всего выполненных мероприятий</em>и <em>Переменные и значения</em> список показывает все переменные, включая курсорные.`,
      `<strong>Поиск внутри большого дизайна.</strong> Дизайнер может искать шаги, группы или дорожки по имени, поэтому ответом на вопрос «как найти один шаг в 200-шаговом рабочем процессе» является собственный поиск дизайнера, а не фильтр активности.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Я сохранил его, поэтому он будет работать». Сохранение создает <em>unpublished</em> рабочий процесс. Ничто, запускающее рабочий процесс (интеллектуальное правило, конфигурация создания документа, поток Salesforce, настраиваемое действие, диалоговое окно «Запуск рабочего процесса»), не может использовать его до публикации версии. Действие Схема работы Salesforce идет дальше и требует <em>exact</em> имя <em>active</em> рабочий процесс. Если в вопросе говорится: «Рабочий процесс никогда не запускается», сначала найдите слово «опубликовано».`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Новый рабочий процесс</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Начальный контент</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Перетаскивайте шаги, соединяйте линии</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Сохранить (неопубликовано)</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">Опубликовать версию</b></span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Начните, затем посмотрите «Активность»</span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Выделенный шаг — это тот, который люди пропускают. Ничто не может запустить неопубликованный рабочий процесс.</div>`},

  {key:'d2', title:"Данные в рабочих процессах: переменные, XML-параметры, xPath, выражения.",
    must:[
      `<strong>Переменные — это контейнеры.</strong> Существует три вида: переменные <em>ты создаешь</em>, <strong>system</strong> переменные, которые собирают данные об экземпляре, и <strong>caret</strong> переменные, которые CLM создает при выполнении действия. Совет Документация: следите за небольшим количеством переменных и используйте переменные XML для одновременного хранения нескольких точек данных.`,
      `<strong>Параметры — это входящий контент.</strong> Он хранит все, что инициировало рабочий процесс. Имя по умолчанию: <code>Params</code> и вы можете переименовать его. Правило, которое хочет экзамен: <strong>не изменять параметры</strong>. Скопируйте его в другую переменную и работайте с копией, чтобы исходные данные триггера оставались нетронутыми для отладки.`,
      `<strong>Параметры из создания документа</strong> переносит значения формы в узел с именем <code>TemplateFieldData</code>. Схема Параметры заполняется только после того, как связанная конфигурация создания документа один раз инициировала рабочий процесс. Метод Документация: построить <em>empty</em> рабочего процесса, подключите его к конфигурации, запустите один раз, а затем скопируйте XML в реальный рабочий процесс.`,
      `<strong>Простые типы переменных</strong>: <em>Date</em>, <em>Number</em> (должно быть целым числом, которое можно использовать непосредственно в выражениях C#), <em>Text</em>, и <em>Список идентификаторов</em> (только идентификаторы многих документов или папок, что позволяет уменьшить размер переменной). Ан <em>Iterator</em> указывает на повторяющийся узел внутри другой переменной XML.`,
      `<strong>Переменные типа XML</strong>: <em>Actor</em> (пользователь CLM с предопределенной схемой: имя, адрес электронной почты, идентификатор пользователя), <em>Пользовательский XML</em> (любая структура; вставьте или загрузите XML для определения схемы или определите узлы по одному), <em>Document</em>, и <em>Folder</em>. Найти документ сохраняется в переменной Документ; Найдите папку в переменной  папка.`,
      `<strong>Правила именования Документация прямо заявляют.</strong> Используйте краткое и значимое имя. Начинайте с заглавной буквы каждого слова. Используйте целые слова, без сокращений. Имя переменной может быть до <code>250</code> буквенно-цифровые символы.`,
      `<strong>Четыре системные переменные</strong>: <code><%#System.Link%></code> (ссылка на задачу, уникальная для экземпляра), <code><%#Система.Дата%></code>, <code><%#System.Time%></code> (оба по локали сервера) и <code>%#System.Uid%</code>, идентификатор экземпляра. Документация советует всегда включать Уид в электронные письма о сбоях или ошибках. Чтобы просмотреть список, экспортируйте рабочий процесс в формате JSON.`,
      `<strong>Переменные курсора начинаются с ^.</strong> CLM создает их, например, после завершения действия. <code>^Найти идентификаторы документов 1.</code> после шага «Найти документ» находит один документ. Они отображаются в списке «Переменные и значения» на странице «Действия». Выражения могут их читать: <code>ПолучитьПеременнаяЗначение("^Одобрить 1 комментарий")</code>.`,
      `<strong>Обновление значения переменной имеет три выхода.</strong>: <em>Updated</em>, <em>Не обновлено</em> and <em>Failed</em>. Его данные живут только внутри одного экземпляра. Чтобы получить данные, вы запускаете дополнительный рабочий процесс с <em>Workflow</em> шаг, использовать <em>Обновить родительскую переменную</em> от дочернего процесса (этот шаг можно использовать только в дочернем рабочем процессе) или используйте <em>Установить выходные данные рабочего процесса</em>. Вы не можете использовать обновление значения переменной для системных переменных, переменных курсора или параметров.`,
      `<strong>Оценка xPath</strong> запускает выражение xPath для переменной (Параметры, XML-документа, XML-папки, чего-либо со схемой XML) и возвращает один из четырех типов результатов: <em>Boolean</em>, <em>Number</em> (Двойной), <em>String</em>, или <em>Набор узлов</em>. Собственный пример Документация: <code>//Элемент системы показателей[./Тема/текст()='Компенсация' и ./Уровень риска/текст()='Высокий']</code>.`,
      `<strong>Три способа загрузки переменной из файла.</strong> <em>Обновить переменную из XML</em> использует xPath для извлечения узла из XML-файла в CLM. <em>Обновить переменную из CSV</em> ищет строку по значению столбца (столбец поиска должен быть уникальным; в противном случае выигрывает первое совпадение). <em>Создать переменную из CSV</em> принимает весь CSV-файл в пользовательскую переменную XML: CSV-файл должен находиться в папке CLM, иметь строку заголовка и как минимум два столбца, оставаться под <code>1 МБ</code>, а создаваемая им переменная не может превышать <code>5 МБ</code>.`,
      `<strong>Выражения — это C#.</strong> Вы открываете построитель выражений с помощью значка рядом с полем, вводите поле ввода C# и <em>Save</em> подтверждает это. Можно использовать только пространства имен из белого списка Документ. Прочитайте переменную, отличную от XML, с помощью <code>ПолучитьПеременнаяЗначение("имя")</code> и переменная XML с <code>_context.XmlVariables["имя"].ValueString</code>.`,
      `<strong>Текущая дата превосходит ДатаВремя.Сейчас.</strong> <em>Текущая дата</em> дает дату в часовом поясе вашей учетной записи. <em>ДатаВремя.Сейчас</em> дает время машины, выполняющей выражение, без гарантированного часового пояса. Используйте ДатаВремя.Сейчас только тогда, когда время суток имеет значение и <em>ДатаВремя.UTCNow</em> плюс конвертация, когда вам нужна конкретная зона.`,
      `<strong>Не пишите выражение для задания, которое может выполнить поле.</strong> Лучшая практика Документация: замените выражения, которые вызывают только ПолучитьПеременнаяЗначение, или объедините строки, например, помещая переменные прямо в поле. <code><%#Variable.SubmitedBy%></code>. Объедините выражения, которые работают с одними и теми же данными. Каждое выражение учитывается в лимите 300 на 15 минут.`,
      `<strong>Решение против правила.</strong> A <em>Rule</em> оценивает одно условие и выводит <em>True</em> or <em>False</em>. А <em>Decision</em> занимает несколько <em>If</em> условия, каждое из которых имеет свою собственную именованную выходную строку плюс <em>Else</em> путь по умолчанию. За задачей маршрутизации «обычно следует этап принятия решения».`,
      `<strong>Шаги цикла.</strong> <em>Для цикла</em> увеличивает переменную на 1 каждый цикл, пока она не совпадет <em>Количество петель</em>. <em>Для каждого цикла</em> выполняет итерацию Итератора по XML, последовательного по умолчанию или параллельного, с выходными данными <em>Step</em>, <em>Конец цикла</em> and <em>Failure</em>. <em>Следующий цикл</em> — это дополнительный визуальный маркер завершения. Это не обязательно, но все равно учитывается в лимите активности.`,
      `<strong>Шаги поиска имеют четыре выхода, а успех — это ловушка.</strong> Поиск документов по папке и поиск документов по метаданным. <code>50</code> документы по умолчанию и до <code>200</code>. Их результаты <em>Success</em> (запустилось без ошибок, найдено или нет), <em>Failure</em>, <em>Match</em> (по крайней мере один найден) и <em>Нет совпадений</em>. Найти группу также возвращает значение до 200. Найти пользователя может храниться только в переменной Актер.`,
      `<strong>Обновить значение метаданных документа можно двумя способами.</strong> <em>Выберите атрибут</em> устанавливает атрибуты по одному. <em>XML</em> для массовых обновлений и удалений требуется одна полезная нагрузка: она начинается с <code><UpdateMetadata UpdateType="Patch"></code> or <code>"Помещать"</code> (PATCH используется по умолчанию) и <code>Удалить = "истина"</code> работает только под PATCH. Обновления XML касаются только пользовательских атрибутов; стандартные атрибуты, такие как Вечеринка, проходят <em>Изменение атрибутов соглашения CLM</em>.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Если шаг «Найти» пошел по пути успеха, он что-то нашел». Успешный поиск документов по папке означает, что шаг был выполнен без ошибок независимо от того, вернулся документ или нет. Пути, которые говорят что-либо о результатах, <em>Match</em> and <em>Нет совпадений</em>. Рабочий процесс, который завершается успешно, а затем пытается использовать найденный документ, представляет собой классическую ошибку «работает при тестировании, завершается сбоем в пустой папке».`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Created</b> <span style="color:var(--dim);font-size:13px">Дата, число, текст, список идентификаторов, итератор, субъект, пользовательский XML, документ, папка</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>System</b> <span style="color:var(--dim);font-size:13px">Система.Ссылка, дата, время, Уид</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Каретка ^</b> <span style="color:var(--dim);font-size:13px">выполненный шаг</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Параметры — это созданный файл, который вы никогда не редактируете на месте.</div>`},

  {key:'d3', title:"Этапы создания, проверки и подписи",
    must:[
      `<strong>Действия, выполняемые человеком, становятся задачами на странице «Задачи» исполнителя, а список</strong>: утверждение, выбор, выбор документов, выбор пользователей, создание или загрузка документа, сверка данных, редактирование документа, редактирование формы, заполнение формы, форма полностраничного редактирования, просмотр и отправка на внешнее рассмотрение, просмотр и отправка на подпись, просмотр данных и маршрутизация. Если названия шага вопроса нет в этом списке, возможно, это автоматизированный шаг.`,
      `<strong>Утвердите маршруты по решению.</strong> Выбор уполномоченного по утверждению или отклонению становится выходным путем шага. Надписи кнопок можно настраивать (по умолчанию <em>Approve</em> and <em>Reject</em>), а комментарии могут быть обязательными, необязательными или опущенными. А <em>Сценическое имя</em> подает отчет «Шаги рабочего процесса»; а <em>Отображаемое имя</em> — это то, что пользователь видит в столбце «Имя задачи».`,
      `<strong>Назначение имеет три циферблата.</strong> Назначьте пользователю или группе задач. Для нескольких человек, <em>Любой правопреемник</em> выполняет задание по первому ответу, при этом <em>Все правопреемники</em> ждет всех. <em>Распределяйте задачи по порядку</em> передает его первому человеку, затем следующему.`,
      `<strong>Группа задач — это совокупность пользователей, которые совместно используют список задач.</strong> Участникам может быть предоставлено семь разрешений: «Владелец группы задач», «Просмотр группы задач», «Просмотр выделенного элемента», «Специальная задача выбора» (заявка), «Может выполнять распределение на основе пользователей» (перераспределение), «Вернуть в группу задач» и «Автоматическая отправка» (позволить рабочим процессам автоматически назначаться этому участнику). Оставьте поле «Назначенный группы задач» пустым, и задача станет доступна всей группе.`,
      `<strong>Сроки выполнения: от 0 до 999 единиц месяцев, недель, дней, часов или минут.</strong>, с возможностью до пяти дополнительных приращений. Если вы установили дату сдачи, вам также следует подключить <em>Тайм-аут – действие</em> путь, потому что именно туда идет шаг, когда никто не действует.`,
      `<strong>Рабочий день составляет 8 часов.</strong> With <em>Используйте только рабочие дни</em>, «1 день» (24 часа) превращается в три рабочих дня. Чтобы выполнить задачу на два рабочих дня позже, установите время ожидания <code>16 часов</code>. Параметр 2 дня и 8 часов становится 7 рабочими днями.`,
      `<strong>Когда сработает первое напоминание.</strong> With <em>Отправить напоминание после выполнения</em> выбрано, первое напоминание будет длиться так долго <em>после создания задачи</em>. Без него он так долго гаснет <em>до наступления срока</em>. No due date at all, and it fires after the First Reminder interval from creation. A reminder runs on a parallel thread; the task stays pending.`,
      `<strong>Выбор против маршрутизации.</strong> Оба просят человека выбрать путь. Выбор имеет фиксированный список вводимых вами параметров. Маршрутизация может заполнять свои параметры из списка, разделенного запятыми или вертикальной чертой, встроенного в построитель выражений, поэтому варианты выбора могут быть динамическими. Оба шага' <em>Ссылка на следующий шаг</em> Опция работает только в том случае, если следующий шаг человека назначен тому же пользователю, и ее нельзя включать на последнем шаге человека.`,
      `<strong>Отмена шага.</strong> Tick <em>Включить отмену шага</em> на человеческом шаге и <em>Шаг отменен</em> появляется вывод. Вы должны подключить его, иначе отмена может привести к сбою рабочего процесса. Отменяемыми этапами являются «Утверждение», «Выбор», «Редактирование документа», «Просмотр и отправка на внешнее рассмотрение», «Просмотр и отправка на подпись», «Просмотр данных» и «Маршрутизация». Пользователь отказывается от просмотра документа с помощью <em>Отменить текущий шаг</em> на вкладке «Активность». Открытые задачи на этом шаге отменяются, извлечённый документ регистрируется, а завершенные задачи остаются нетронутыми.`,
      `<strong>Кто может отменить.</strong> Собственные авторизованные пользователи или группы задач этого шага, а также лица, обладающие делегированными разрешениями, включающими <em>Отмена шага рабочего процесса</em>. Отдельный трюк для «Выбор пользователей» и «Выбор документов»: включите <em>ActionRejected</em> вывод, и в задаче появляется кнопка «Отмена», направляющая туда, куда вы указали эту строку.`,
      `<strong>Генерация документов — это автоматизированный этап.</strong> Вы называете существующий <em>Конфигурация создания документа</em> и <em>Template</em> внутри него, при необходимости, идентификатор объекта Salesforce и данные канала либо как <em>Обновить значения</em> пары или входную переменную XML. Его результаты <em>Success</em>, <em>Условный успех</em> and <em>Failure</em>.`,
      `<strong>Два отправителя подписи, один официант.</strong> <em>Отправить на подпись</em> является автоматическим. <em>Рассмотрение и отправка на подпись</em> — это человеческая задача, в ходе которой пользователь готовит конверт. <strong>Параметр «Ожидание подписи» необходимо использовать с параметрами «Просмотр» и «Отправить на подпись», но не следует использовать с параметрами «Отправить на подпись».</strong> Оба отправителя принимают форматы DOC, DOCX и PDF, а получателям не обязательно быть пользователями CLM.`,
      `<strong>Фирменные пошаговые правила, которые молча терпят неудачу в дикой природе.</strong> Если получатель в поле «Кому» также отображается в примененном шаблоне конверта, этот шаг не будет выполнен. <em>Дни истечения срока действия</em> достигает максимума в <code>180</code>. А <em>Пароль подписывающего лица</em> является необязательным. Электронная подпись <em>Отправить позже</em> опция несовместима с функцией «Просмотр и отправка на подпись», а подготовка длинного конверта может попасть в CLM. <em>Таймаут простоя сеанса</em>.`,
      `<strong>Документы, Документы и шаблоны, Шаблон конверта.</strong> Plain <em>Documents</em> отправляет файлы без шаблона. <em>Документы и шаблоны</em> применяет метаданные шаблона конверта (получатели, сообщение) к каждому документу, но не к документам шаблона. <em>Шаблон конверта</em> поле применяет настройки, получателей <em>and</em> документы из шаблона ко всему выбранному. Шаблоны уже должны существовать в учетной записи электронной подписи.`,
      `<strong>Подождите, пока Подпись наблюдает за событиями аудита</strong>: нет, отправлено, просмотрено, подписано, отклонено, делегировано, письмо отклонено, запечатано. Его выходные данные: «Отменено», «Подписано», «Отклонено», «Обновлено», «Сбой» и «Тайм-аут». <em>Отменить электронную подпись</em> это отдельный автоматический шаг, который отменяет запрос.`,
      `<strong>Электронная почта против электронного документа.</strong> <em>Email</em> (этап планирования и связи) отправляет сообщение с параметрами «От», «Кому», «CC», «СК», «Тема» и «Тело», а тема и тело могут быть выражениями. <em>Отправить документ по электронной почте</em> (автоматический этап документа) прикрепляет документы, отправляет их как <em>Native</em> or <em>PDF</em>, позволяет <code>50</code> получатели и <code>20,48 МБ</code> вложений и может добавить подпись CLM отправителя из «Моих настроек».`,
      `<strong>Просмотр данных</strong> назначает до <code>50</code> атрибуты одного пользователя или одной группы задач для просмотра и заполнения в задаче. Поддерживаются: сторона, тип, значение, дата вступления в силу, дата истечения срока действия и пользовательское число, десятичное число, дата, раскрывающийся список, динамический раскрывающийся список и каскадный раскрывающийся список. Не поддерживается: атрибуты Актер и Автономер. Для этапов извлечения данных ИИ требуется этап просмотра данных в том же рабочем процессе.`,
      `<strong>Обновление безопасности</strong> sets a user's access on documents or folders: Inherit from Parent Folder, No Access, View, View &amp; Create, View &amp; Edit, View, Edit &amp; Delete, View, Edit, Delete &amp; Set Access, or a Security Variable. Docusign's best practices: select <em>Дождитесь завершения обновления</em>, назначайте группы, а не пользователей, пропускайте администраторов (у них уже есть полный доступ), избегайте дублирования правил и применяйте безопасность сразу после создания папки.`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Отправить на подпись, затем дождаться подписи». Документ Документация прямолинеен: дождитесь пары подписи с <em>Рассмотрение и отправка на подпись</em> и не должен использоваться с <em>Отправить на подпись</em>. Автоматический отправитель уже отслеживает конверт по собственному пути вывода. Поставьте официанта после неправильного отправителя, и рабочий процесс останется там.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Отправить на подпись</b> <span style="color:var(--dim);font-size:13px">автоматический, без задачи</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Рассмотрение и отправка на подпись</b> <span style="color:var(--dim);font-size:13px">человеческая задача, то ↓</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);border-color:var(--accent)"><b>Подождите подписи</b> <span style="color:var(--dim);font-size:13px">только после человеческого</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Та же схема для внешнего просмотра: автоматический отправитель, отправитель-человек, один официант.</div>`},

  {key:'d4', title:"Запуск рабочих процессов, лимиты и администрирование",
    must:[
      `<strong>В любом случае начинается опубликованный рабочий процесс.</strong> Вручную на вкладке Конфигурация. Из <em>Умное правило</em> чьи действия <em>Начать рабочий процесс</em>. Из <em>Конфигурация создания документа</em> связано с этим. Из электронной подписи <em>Соглашение Действие</em> установите значение «Начать рабочий процесс». Из потока продаж Salesforce <em>Запустить рабочий процесс Документация CLM</em> действие. Из файлов CLM <em>пользовательское действие</em>. Из родительского рабочего процесса <em>Workflow</em> шаг. Или он ожидает в середине потока вызова API с <em>Ждите сигнала</em>.`,
      `<strong>Умное правило: действие «Начать рабочий процесс»</strong> действителен с <em>События документа</em> and <em>Запланированные события</em>, и для этого требуется «ранее определенный и опубликованный расширенный рабочий процесс». Пример правила Документация: событие <em>Документ добавлен</em>, <em>Выполнить как: указанный пользователь</em>, фильтрует подпапку и имя типа «NDA», действие <em>Начать рабочий процесс</em>.`,
      `<strong>Схема работы Salesforce</strong> требуется Средство запуска приложений Документация 6.3 или выше. Действие занимает <em>Идентификатор записи</em> и <em>Имя рабочего процесса</em>, а имя должно совпадать с точным именем активного рабочего процесса CLM. Ошибка в написании или неактивный рабочий процесс означает, что Salesforce не сможет его запустить. Старый маршрут — это пользовательская кнопка на макете страницы.`,
      `<strong>Дополнительное действие CLM-файлы</strong> встроен в администраторе под <em>Навигация и действия</em>, настройка <em>Действия с файлами CLM</em>. Его <em>Что должно делать это действие?</em> is <em>Начать рабочий процесс</em>, и он может передавать выбранные идентификаторы документов и идентификатор триггерного пользователя в рабочий процесс.`,
      `<strong>Действия по соглашению передают данные конверта в рабочий процесс в виде пользовательского XML.</strong> Затем вы извлекаете поля с помощью Оценить xPath, например имя получателя в <code>/Параметры/конверт/получатели/подписавшие/элемент/имя/текст()</code> или название первого документа в <code>/Params/envelope/envelopeDocuments/item[order/text()=1]/name/text()</code>.`,
      `<strong>Ограничение в 300 выражений приостанавливается, оно не дает сбоя.</strong>Экземпляр рабочего процесса может оценить <code>300</code> выражения в любом 15-минутном окне. При этом CLM приостанавливает работу экземпляра и отправляет электронное письмо пользователям в <em>Пользователь уведомления об ошибках расширенного рабочего процесса</em> настройка аккаунта. Если никто не предпринимает никаких действий до запланированного дня очистки, рабочий процесс прерывается и очищается. Это касается новых редакций, созданных с 12 августа 2025 г. (UAT) и 2 сентября 2025 г. (Производственная версия).`,
      `<strong>Лимит активности — 10 000 на инстанс.</strong> для редакций, опубликованных после 28 апреля 2022 г. (UAT) и 13 мая 2022 г. (Производство); в более старых версиях сохраняется 100 000. Каждый выполненный шаг — это одно действие, включая следующий цикл. При превышении лимита экземпляр приостанавливается и назначается дата очистки, и только служба поддержки Документация может поднять ее. Отдельно не более <code>5,000</code> действия могут выполняться последовательно без участия человека или асинхронных действий.`,
      `<strong>Выполнение или пауза имеет срок годности.</strong> 365 дней в производстве и 90 дней в UAT, затем CLM прерывает проверку и планирует очистку. Рабочий процесс, который система приостановила из-за достижения какого-либо ограничения, начинает очищаться через 30 дней после приостановки.`,
      `<strong>График очистки — это настройка учетной записи.</strong> <em>Дней после завершения рабочего процесса</em> and <em>Дни после сбоя рабочего процесса</em> оба принимают <code>7</code> to <code>30</code> и по умолчанию <code>7</code>. <em>Отложить очистку для рабочих процессов с подпроцессами</em>, в настройках «Рабочий процесс и задачи», сохраняет родительские, дочерние и одноуровневые данные до завершения последнего.`,
      `<strong>Пропускная способность на аккаунт.</strong> Рабочих процессов, запущенных в час: <code>100</code> в UAT <code>1,000</code> в производстве. Казни за 15 минут: <code>500</code> в UAT <code>12,000</code> в производстве. Выполнение засчитывается при запуске рабочего процесса. <em>or</em> возобновляется с асинхронного этапа, такого как отправка на подпись.`,
      `<strong>Ограничения по размеру.</strong> Одна переменная: <code>5 МБ</code>. Все переменные в одном рабочем процессе: <code>25 МБ</code>. Вывод одной оценки выражения: <code>1 МБ</code>. Пользовательский интерфейс показывает максимум <code>1,000</code> выполненные шаги рабочего процесса.`,
      `<strong>Редактирование конфиденциальных значений.</strong> В переменной отметьте галочкой <em>Не отображать значение переменной</em> и монитор процесса показывает <em>Redacted</em> в разделе «Информация о шаге» и «Переменные и значения». Он не редактирует данные, передаваемые функцией Обновить родительскую переменную, и записанное в журнал выражение по-прежнему отображает данные переменной. Документация предупреждает, что ненужное редактирование вредит работе службы поддержки по устранению неполадок.`,
      `<strong>УАТ к Производство экспортное и импортное.</strong> Экспортируйте JSON из UAT, импортируйте его в новый рабочий процесс в Производство, переименуйте, сохраните, переназначьте любые шаги рабочего процесса Маэстро в рабочие процессы Построитель производственных процессов, затем опубликуйте и запустите. Имена Построитель рабочих процессов должны быть уникальными в рабочей среде, иначе вызов завершится неудачно.`,
      `<strong>Детские рабочие процессы и абортированные родители.</strong> Если родительский процесс завершается сбоем или прерывается, дочерний процесс, ожидающий асинхронного шага (например, «Ожидание подписи»), прерывается, когда CLM его проверяет, примерно через 24 часа после даты последней обработки действия. Дочерний элемент, который закончит до того, как проверка выживет.`,
      `<strong>Три этапа уборки.</strong> <em>Logger</em> записывает сообщение в монитор рабочего процесса. <em>Обновить информацию</em> устанавливает столбец «Информация» на страницах «Задачи» и «Действия рабочего процесса». <em>Установить имя процесса рабочего процесса</em> называет процесс в отчете «Шаги рабочего процесса», и его необходимо настроить только в родительском элементе.`,
      `<strong>Этапы интеграции</strong>: HTTP-клиент (исходящий HTTPS/REST), вызов веб-службы, Salesforce ETL (данные Salesforce в реальном времени в формате XML), обновление Salesforce (по образцу SOQL), создание нового объекта Salesforce, добавление задачи Salesforce, добавление истории активности Salesforce, Excel ЭТЛ, соединения (соединители NetSuite и Финансовые показатели рабочего дня, добавляемые первыми на странице «Соединения») и рабочий процесс Маэстро (запускает рабочий процесс Построитель рабочих процессов).`
    ],
    miscon:`<strong>Заблуждение, которое следует разоблачить:</strong> «Приостановленный рабочий процесс не удался». Приостановка — это реакция CLM на ограничение обслуживания: слишком много выражений, слишком много действий. Экземпляр активен, электронное письмо отправляется пользователям расширенного уведомления об ошибках рабочего процесса, и служба поддержки может снять ограничение активности, чтобы вы могли возобновить ее. Что превращает паузу в настоящую потерю, так это бездействие, потому что рабочий процесс, приостановленный по лимиту, начинает очищаться через 30 дней.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">

      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>10,000</b> <span style="color:var(--dim);font-size:13px">действий за экземпляр, затем приостановилось</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>365 / 90</b> <span style="color:var(--dim);font-size:13px">дней Выполнение или пауза (Прод), затем прерывание</span></div>

   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Workflow Designer fundamentals (11) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`What is the maximum length of a workflow name in Docusign CLM?`,

    correct:1,
    explain:`Имена рабочих процессов ограничены <strong>100</strong> буквенно-цифровые символы. Число 250 — это предел рабочего процесса. <em>variable</em> имя.`},
  {id:'q2', domain:'d1', type:'ms', q:`Какие параметры отображаются в разделе «Какой тип контента будет запускать этот рабочий процесс?» при создании расширенного рабочего процесса? <em>Выберите все, что применимо.</em>`,
    choices:[`Конфигурация создания документов`, `Пользовательский XML`, `Умное правило`, `Этот рабочий процесс начнется без контента`],
    correct:[0,1,3],
    explain:`Пять вариантов: конфигурация создания документа, документ, пользовательский XML, папка и запуск без содержимого. Умное правило – это способ <em>trigger</em> рабочий процесс, а не начальный тип контента.`},
  {id:'q3', domain:'d1', type:'mc', q:`An administrator chooses "This workflow will start without content". What is true about the Params variable?`,
    choices:[`Он содержит папку, с которой запустился рабочий процесс.`, `Это пусто`, `Он удален из рабочего процесса.`, `Он содержит пользователя, который запустил рабочий процесс.`],
    correct:1,
    explain:`Docusign's wording: if you choose this option, your incoming content (Params) variable is empty. The variable still exists; it just has nothing in it.`},
  {id:'q4', domain:'d1', type:'mc', q:`A workflow has no Finish step. It stops at an Approve step because of a failure. What does the activity monitor show?`,
    choices:[`Failed`, `Paused`, `Complete`, `Aborted`],
    correct:2,
    explain:`Без шага «Завершение» рабочий процесс выглядит как <strong>Complete</strong> хотя оно и не закончилось. Шаг Заканчивать позволяет движку выделять ошибки и возобновлять ожидающий родительский процесс.`},
  {id:'q5', domain:'d1', type:'mc', q:`After editing a workflow, what must happen before the changes can execute?`,
    choices:[`Select Save your changes; saving makes the version live`, `Откройте панель «Версии и публикация» и выберите «Опубликовать» для версии.`, `Запустите рабочий процесс на вкладке «Активность».`, `Экспортируйте рабочий процесс в формате JSON и повторно импортируйте его.`],
    correct:1,
    explain:`При сохранении у вас останется неопубликованный рабочий процесс. <em>Создание и публикация версий</em> Кнопка открывает панель «Версии и публикация», где вы выбираете «Опубликовать», и версия показывает статус «Опубликовано».`},
  {id:'q6', domain:'d1', type:'mc', q:`How do you create a copy of an existing workflow design so you can change it for a different purpose?`,
    choices:[`Выберите «Клонировать» на вкладке «Конфигурация».`, `Экспортируйте дизайн в формате JSON, создайте новый расширенный рабочий процесс и импортируйте JSON.`, `Выберите «Сохранить как» на панели инструментов дизайнера.`, `Опубликуйте новую версию оригинала и переименуйте ее.`],
    correct:1,
    explain:`Cloning is export and import: Export JSON from the original, New Workflow, Advanced Workflow, then Import the file and give it a new name. The same mechanism moves a workflow from UAT to Production.`},
  {id:'q7', domain:'d1', type:'mc', q:`What happens to in-progress instances when an administrator deletes a workflow?`,
    choices:[`Они немедленно прерываются`, `Они завершаются без ошибок, а затем рабочий процесс больше не доступен.`, `Они приостановлены до восстановления рабочего процесса.`, `Их очищают на следующий день чистки.`],
    correct:1,
    explain:`Deleting a workflow lets in-progress instances complete without error. The workflow disappears from the account after they finish.`},
  {id:'q8', domain:'d1', type:'mc', q:`Which setting is found on the Start step of an advanced workflow?`,
    choices:[`Отправка уведомления, когда рабочий процесс обнаруживает ошибку`, `Дни после сбоя рабочего процесса`, `Используйте только рабочие дни`, `Дождитесь завершения обновления`],
    correct:0,
    explain:`The Start step holds the Workflow Name, the error notification checkbox with its Users To Receive Notification list, and Track and record workflow activity. The purge days are account settings; business days belong to human steps; the wait option belongs to Update Security.`},
  {id:'q9', domain:'d1', type:'mc', q:`Which of these is NOT a functional workflow step?`,
    choices:[`Logger`, `Lane`, `Таймер Триггер`, `Rule`],

    explain:`Lane, Pool and Group are visual aids that label sections of the canvas. Docusign states they are not functional workflow steps. Logger, Timer Trigger and Rule all execute.`},
  {id:'q10', domain:'d1', type:'mc', q:`How many predefined workflow templates does Docusign CLM provide, and which of these is one of them?`,
    choices:[`Четыре, включая массовый импорт`, `Шесть, включая переговоры`, `Шесть, включая «умное правило»`, `Восемь, включая сверку данных`],
    correct:1,
    explain:`Six templates: Internal Approval, Start Another Process, Edit Document, Negotiation, Routing and Signature. Data Reconciliation is a human step, not a template.`},
  {id:'q11', domain:'d1', type:'mc', q:`Where do you read the number under "Total Activities Executed" for a running workflow?`,

    correct:1,
    explain:`Open Admin, Workflows, filter the Activity list if needed, select the workflow name, and read Total Activities Executed on the Workflow Information panel. A paused-for-limit workflow shows a message under Status.`},

  {id:'q12', domain:'d2', type:'mc', q:`What does Docusign say you should do with the Params variable when you need to manipulate its data?`,

  {id:'q14', domain:'d2', type:'ms', q:`Какие из этих переменных типа XML используются в рабочем процессе Документация CLM? <em>Выберите все, что применимо.</em>`,

  {id:'q17', domain:'d2', type:'mc', q:`Переменная с именем <code>^Найти идентификаторы документов 1.</code> появится в списке «Переменные и значения». Что создало это?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast("Завершите и отправьте экзамен, чтобы увидеть результаты."); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

function rateConf(id,lvl){
