   notes:"Контекст фильтра похож на комнату, в которой задают вопрос: спросите: «Каков доход?» в комнате Западного региона, и вы получите ответ Запада. CALCULATE — это то, как вы меняете комнату, прежде чем ответить. Это путь к ВСЕМ, ВСЕМ ИСКЛЮЧЕНИЮ, ФИЛЬТРУ, СВЯЗИ ПОЛЬЗОВАТЕЛЯ и временной аналитике: каждый раз, когда вам нужно вычислить что-то, «игнорируя» или «переопределяя» фильтр, вы можете это сделать с помощью ВЫЧИСЛЕНИЯ.",
   viz:{measure:{name:"Западный доход",value:"$412"},caption:"CALCULATE(SUM(Sales[Revenue]), Sales[Region] = \"Запад\") переопределяет контекст фильтра, чтобы суммировать только западный регион, даже если остальная часть отчета показывает все."},
   quiz:{q:"Что делает CALCULATE с контекстом фильтра?",opts:["Он игнорирует все существующие фильтры","Он оценивает выражение в соответствии с установленными вами фильтрами.","Работает только с SUM","Он копирует контекст фильтра из другой меры."],ans:1,exp:"Подумайте о том, чтобы задать тот же вопрос в другой комнате: CALCULATE оценивает свой первый аргумент (любое выражение DAX) после изменения фильтров вокруг него. Аргументы фильтра могут добавлять новые фильтры, переопределять существующие или удалять их с помощью ALL."},
   parsons:{prompt:"Упорядочите показатель доходов Запада — CALCULATE сначала принимает выражение, а затем фильтр.",lines:["West Revenue = CALCULATE(","SUM(Sales[Revenue]),","Sales[Region] = \"West\"",")"],answer:[0,1,2,3]},
   explain:{is:"CALCULATE оценивает выражение после изменения окружающих его фильтров — он может добавить фильтр, заменить его или удалить их.",
     use:"Именно так вы получаете доход Запада на карту, которая еще не отфильтрована для Запада, и она лежит в основе почти каждой расширенной меры, которую вы напишете. Сначала идет выражение, затем условия — противоположность тому, как вы произносите это вслух.",
     like:"Задаю тот же вопрос в другой комнате. — Сколько здесь? на кухне означает совсем другое, чем у входной двери, и вы выбираете комнату, прежде чем спросить."},
   build:{q:"Вам нужен доход каждого региона в процентах от ВСЕХ регионов, даже если срез фильтруется по одному региону. Какая мера дает знаменатель?",opts:["Весь доход = SUM(Sales[Revenue])","Весь доход = CALCULATE(SUM(Sales[Revenue]), ALL(Sales))","Весь доход = CALCULATE(SUM(Sales[Revenue]), Sales[Region] = \"All\")","Весь доход = DIVIDE(SUM(Sales[Revenue]), 1)"],ans:1,exp:"ALL(Sales) удаляет фильтры из таблицы, поэтому показатель суммирует все регионы независимо от среза. Простая СУММА учитывает срез и дает отфильтрованную сумму; «Все» не является значением региона в данных."},
   close:"Теперь вы можете намеренно переопределить контекст фильтра — это основной навык расширенного DAX. Далее: анализ времени, наиболее часто используемое приложение CALCULATE.",
   unlock:"Почти каждый «причудливый» шаблон DAX — % от общего числа, доля родительского объекта, рост по сравнению с прошлым годом — это просто ВЫЧИСЛЕНИЕ плюс один модификатор контекста (ВСЕ, ВСЕИСКЛЮЧАЯ, временной сдвиг). Научитесь называть, что делает аргумент фильтра, и незнакомые меры начнут читаться как предложения."
  },
  {id:8, unit:"Глава 2: DAX и меры", title:"Временной интеллект", sub:"Сравнение дат с начала года, предыдущего периода и дат",
   story:"Вы можете переопределить контекст фильтра с помощью CALCULATE. Временной интеллект — его наиболее распространенное применение: годовой доход, сравнение за предыдущий период, рост по месяцам. Такие функции, как TOTALYTD и DATEADD, запускают измерение в другой момент времени, что важно для любой информационной панели продаж или финансов.",
   intro:"Временной интеллект — это приложение-календарь ваших данных. Оно уже знает, что означают «прошлый месяц» и «с начала года», поэтому вам не нужно указывать даты. Функции анализа времени позволяют сравнивать периоды, накапливать итоговые данные за год и измерять изменения с течением времени. Им требуется правильная таблица дат с непрерывными датами.",
   ral:{
     code:"YTD Revenue = TOTALYTD([Total Revenue], 'Date'[Date])\nОборот предыдущего года = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR('Date'[Date]))\nВыручка против LY% = DIVIDE([Total Revenue] - [Previous Year Revenue], [Previous Year Revenue])",
     say:"В отчете «Доход с начала года» указывается промежуточная сумма с начала года. Версия предыдущего года использует SAMEPERIODLASTYEAR для получения того же показателя годичной давности. Затем доход и процент LY сравнивают эти два значения, используя безопасное деление.",
     lines:[
       ["YTD Revenue = TOTALYTD([Total Revenue], 'Date'[Date])","TOTALYTD (накапливается с 1 января) — повторно суммирует показатель по каждой дате с начала года в контексте текущей даты."],
       ["«Дата»[Дата]","столбец даты из специальной таблицы дат — должен быть непрерывным и помечен как таблица дат."],
       ["Prior Year Revenue = CALCULATE([Total Revenue],","повторно запустите «Общий доход» под следующим фильтром сдвинутой даты."],
       ["SAMEPERIODLASTYEAR(Dates[Date]))","SAMEPERIODLASTYEAR (сдвиг на год назад) — те же даты, ровно двенадцать месяцев назад."],
       ["Revenue vs LY % = DIVIDE([Total Revenue] - [Prior Year Revenue], [Prior Year Revenue])","разделите разницу на предыдущий год — изменение в % по сравнению с прошлым годом, без пробелов для первого года"]
     ]
   },
   notes:"Анализ времени работает только в том случае, если: (1) у вас есть выделенная таблица дат, (2) в ней нет пробелов в датах, (3) она помечена как таблица дат в Power BI. Без них TOTALYTD и SAMEPERIODLASTYEAR возвращают неправильные результаты.",
   viz:{title:"Временной интеллект",html:`<div style="overflow-x:auto;font-size:11px"><table style="border-collapse:collapse;font-family:var(--mono);width:100%">
     <thead><tr><th style="text-align:left;padding:5px 10px;border-bottom:2px solid var(--accent);color:var(--accent)">Месяц</th><th style="text-align:left;padding:5px 10px;border-bottom:2px solid var(--accent);color:var(--accent)">TOTALYTD</th><th style="text-align:left;padding:5px 10px;border-bottom:2px solid var(--accent);color:var(--accent)">Предыдущий год · ТО ЖЕ ПЕРИОДЛАСТГОД</th><th style="text-align:left;padding:5px 10px;border-bottom:2px solid var(--accent);color:var(--accent)">г/г % · DIVIDE</th></tr></thead>
     <tbody>
     <tr><td style="padding:5px 10px">Ян</td><td style="padding:5px 10px">$402</td><td style="padding:5px 10px">$360</td><td style="padding:5px 10px">+12%</td></tr>
     <tr><td style="padding:5px 10px">февраль</td><td style="padding:5px 10px">$810</td><td style="padding:5px 10px">$735</td><td style="padding:5px 10px">+10%</td></tr>
     <tr><td style="padding:5px 10px">Мар</td><td style="padding:5px 10px">$1,279</td><td style="padding:5px 10px">$1,150</td><td style="padding:5px 10px">+11%</td></tr></tbody></table></div>`,caption:"Три функции анализа времени вместе: TOTALYTD суммирует данные за год, SAMEPERIODLASTYEAR извлекает данные за предыдущий год, а DIVIDE превращает эти два значения в процентное изменение по сравнению с прошлым годом. Всем нужна помеченная таблица дат."},
   quiz:{q:"Что требуется для правильной работы функций анализа времени DAX?",opts:["Расчетный столбец за год","Таблица дат без пробелов, помеченная как одна","Любой столбец даты в таблице фактов","Функция ДАТЕАДД"],ans:1,exp:"Функции логики времени просматривают таблицу дат. Она должна иметь непрерывные даты (без пробелов), охватывать весь диапазон данных и быть помечена как таблица дат (щелкните таблицу правой кнопкой мыши в представлении модели)."},
   parsons:{prompt:"Организуйте сравнительную структуру по сравнению с прошлым годом: число за этот год, число за прошлый год, затем процентное изменение.",lines:["Общий доход = SUM(Sales[Revenue])","Оборот предыдущего года = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR('Date'[Date]))","Revenue vs LY % = DIVIDE([Total Revenue] - [Prior Year Revenue], [Prior Year Revenue])"],answer:[0,1,2]},
   explain:{is:"Функции анализа времени смещают окно даты, в котором выполняется измерение — с начала года, на тот же период прошлого года, на месяц, предшествующий этому.",
     use:"Именно это превращает цифры в историю: выручка составила 1,2 миллиона фунтов стерлингов, что на 14% больше, чем в прошлом году. Это работает только в том случае, если модель имеет правильную таблицу дат без пробелов, помеченную как таблица дат.",
     like:"Каждый день рождения ставить ребенка у дверного косяка. Карандашная отметка сама по себе ничего не говорит — это разрыв с прошлогодней отметкой, на которую все смотрят."},
   build:{q:"Какая мера дает промежуточный итоговый доход с 1 января по текущую дату в контексте?",opts:["YTD Revenue = TOTALYTD([Total Revenue], 'Date'[Date])","Доход с начала года = SUM('Date'[Date])","Доход с начала года = CALCULATE([Total Revenue], Даты[Год] = 2026)","Доход с начала года = DATEADD([Total Revenue], -1, ГОД)"],ans:0,exp:"TOTALYTD накапливает показатели с начала года до контекста текущей даты. Фильтрация по году дает итоговый результат за весь год (а не текущий), а DATEADD сдвигает даты — в качестве первого аргумента он принимает столбец даты, а не показатель."},
   close:"Вы можете сравнить любые показатели во времени — с начала года, за предыдущий год, рост. Вот и готово ядро ​​DAX. Далее: срезы и фильтры — элементы управления, к которым фактически прикасается ваша аудитория.",
   unlock:"Когда анализ времени возвращает неправильные, но правдоподобные числа, сначала проверьте таблицу дат: пробел или забывание «Отметить как таблицу дат» автоматически прерывает обход. Уволенные аналитики держат одну многоразовую таблицу дат (скрипт CALENDAR()) и вставляют ее в каждую новую модель."
  },
  // UNIT 3
  {id:9, unit:"Модуль 3: Отчеты и аналитика", title:"Срезы и фильтры", sub:"Контролируйте то, что видит ваша аудитория",
   story:"Ваши меры учитывают время. Теперь пользовательские элементы управления: срезы и фильтры. Срез — это визуальный элемент на холсте: ваш менеджер нажимает \"West\", и каждый визуальный элемент обновляется. Фильтры страниц и фильтры отчетов сужают все визуальные элементы в разных областях. Визуальные фильтры применяются только к одной диаграмме. Знание того, к чему обращаться, позволяет поддерживать чистоту приборных панелей.",
   intro:"Слайсер — это пульт от телевизора, находящийся на отчете: зрители нажимают кнопку, и все обновляется; Панель «Фильтры» — это меню настроек, которое незаметно делает то же самое. Срезы — это интерактивные фильтры на холсте. Панель «Фильтры» незаметно применяет фильтры. Понимание разницы и того, когда использовать каждую из них, делает отчеты более понятными и интуитивно понятными.",
   ral:{
     code:"Срез → отображается на холсте, пользователь нажимает для фильтрации\nПанель фильтров → скрытые элементы управления, предварительно настроенные автором отчета.\n\nИерархия фильтров (самый мощный в первую очередь):\n  Визуальный уровень → Уровень страницы → Уровень отчета",
     say:"Слайсер — это элемент управления, расположенный на холсте, на который щелкает пользователь. Панель фильтров содержит скрытые фильтры, установленные вами, автором. В этой иерархии применяются фильтры: наиболее конкретен визуальный уровень, затем уровень страницы, затем уровень отчета.",
     lines:[
       ["Слайсер","визуальный элемент, с которым взаимодействует пользователь — может быть списком, раскрывающимся списком или диапазоном дат."],
       ["Фильтр визуального уровня","влияет только на этот визуальный элемент — по умолчанию невидимый для пользователя"],
       ["Фильтр уровня страницы","влияет на все визуальные эффекты на текущей странице"],
       ["Фильтр уровня отчета","влияет на все страницы и все визуальные эффекты — используйте для постоянного контекста"],
       ["Редактировать взаимодействия","контролировать, на какие визуальные эффекты влияет срез — «Формат» → «Редактировать взаимодействия»."]
     ]
   },
   notes:"Используйте «Редактировать взаимодействия» (меню «Формат») для управления областью среза — вы можете заставить срез фильтровать одни визуальные элементы, но не другие, на той же странице. Это важно для сравнения макетов.",
   viz:{title:"Срезы и фильтры",html:`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px">
     <div style="border:1px solid var(--border);border-radius:8px;padding:10px;min-width:130px">
       <div style="font-weight:700;margin-bottom:6px">🔘 Слайсер (на холсте)</div>
       <div style="color:var(--accent)">Запад ▣</div><div style="color:var(--dim)">Восток ▢ · Север ▢</div>
       <div style="color:var(--dim);margin-top:6px;font-size:10px">зрители нажимают на него</div>
     </div>
     <div style="border:1px solid var(--border);border-radius:8px;padding:10px;min-width:175px">
       <div style="font-weight:700;margin-bottom:6px">⛢ Панель фильтров (установлена ​​автором)</div>
       <div>① Визуальный уровень <span style="color:var(--dim)">— один график</span></div>
       <div>② На уровне страницы <span style="color:var(--dim)">— эта страница</span></div>
       <div>③ Уровень отчета <span style="color:var(--dim)">— каждая страница</span></div>
     </div>
   </div>`,caption:"Два инструмента фильтрации: срез — это элемент управления фильтрацией по щелчку на холсте; Панель «Фильтры» позволяет автору устанавливать фильтры для трех областей — визуальной, страницы и всего отчета."},
   quiz:{q:"Какой уровень фильтра влияет на каждый визуальный элемент на каждой странице отчета?",opts:["Фильтр визуального уровня","Фильтр уровня страницы","Фильтр уровня отчета","Слайсер"],ans:2,exp:"Фильтры уровня отчета применяются ко всем страницам. Используйте их для глобального контекста, например «показывать только за последние 3 года». Фильтры уровня страницы ограничиваются одной страницей; Фильтры визуального уровня ограничиваются одной диаграммой."},
   parsons:{prompt:"Расположите области действия фильтра от самого узкого к самому широкому.",lines:["Визуальный уровень — только одна диаграмма","Уровень страницы — каждый визуальный элемент на этой странице.","Уровень отчета — каждый визуальный элемент на каждой странице"],answer:[0,1,2]},
   explain:{is:"Срез — это элемент управления на странице, на который нажимают зрители. Панель «Фильтры» содержит фильтры, которые вы установили как автор. Оба сужают то, что показывает визуальный элемент, на уровне визуального элемента, страницы или отчета.",
     use:"Вы предоставляете зрителям срезы для выбора, который им следует сделать, и используете панельные фильтры для тех, которые им не следует делать. Когда диаграмма показывает что-то неожиданное, вы проходите три уровня по порядку: визуальный, затем страница и отчет.",
     like:"Кран, запорный кран и сеть. Все трое контролируют одну и ту же воду, и когда ничего не выходит, вы проверяете их в этом порядке, а не угадываете."},
   build:{q:"Ваш менеджер должен иметь возможность самостоятельно выбрать регион во время просмотра отчета. Что вы добавляете?",opts:["Фильтр уровня отчета по региону","Срез на холсте, привязанный к региону","Фильтр визуального уровня на каждом графике","Страница детализации для каждого региона"],ans:1,exp:"Зрители взаимодействуют со срезами — они сидят на холсте и приглашают щелкнуть мышью. Фильтры на панели являются инструментом автора и невидимы для большинства зрителей. Двенадцать фильтров визуального уровня — это двенадцать мест для синхронизации."},
   close:"Вы можете выбрать правильный элемент управления для работы: срезы для зрителей, фильтры панели для авторов, ограниченные до нужного уровня. Далее: детализация и перекрестная фильтрация.",
   unlock:"«Редактировать взаимодействия» — это ответ на целое семейство головоломок с макетом — например, срез, который должен управлять четырьмя подробными диаграммами, но не трогать карточку заголовка за текущий год. Большинство пользователей Power BI никогда не находят эту функцию; разработчики отчетов, которые это знают, перестают бороться со своими собственными слайсерами."
  },
  {id:10, unit:"Модуль 3: Отчеты и аналитика", title:"Детализация и перекрестная фильтрация", sub:"Позвольте данным вести историю",
   story:"Срезы фильтруют страницу. Детализация — это следующий уровень: щелкните правой кнопкой мыши точку данных и перейдите к странице сведений, посвященной этому элементу. Перекрестная фильтрация — это когда щелчок по полосе на одной диаграмме автоматически фильтрует другие диаграммы на странице. Оба включены по умолчанию — их понимание не позволит вам запутаться, когда график «случайно» меняется.",
   intro:"Детализация — это «увеличение» карты в приложении: щелкните регион и перейдите на страницу с подробными сведениями об этом месте. Страницы детализации позволяют пользователям щелкнуть правой кнопкой мыши точку данных и перейти на страницу сведений. Перекрестная фильтрация означает, что выбор одного визуального элемента автоматически фильтрует остальные на той же странице.",
   ral:{
     code:"Детализация:\n1. Создайте страницу сведений\n2. Перетащите поле в раздел «Детализация» на панели «Фильтры».\n3. Щелкните правой кнопкой мыши любую точку данных в отчете → Детализация →\n\nКросс-фильтр:\n• Нажатие на полосу в одном визуальном элементе выделяет или фильтрует другие.",
     say:"Для детализации создайте страницу сведений и перетащите поле в область детализации; пользователи щелкают правой кнопкой мыши любую точку данных, чтобы перейти туда. Перекрестная фильтрация происходит автоматически — щелчок по полосе в одном визуальном элементе выделяет и фильтрует остальные на странице.",
     lines:[
       ["Поле детализации","ключ, который соединяет страницу сводки со страницей сведений"],
       ["Щелкните правой кнопкой мыши → Детализация","как конечные пользователи переходят на страницу сведений"],
       ["Кнопка «Назад»","Power BI автоматически добавляет кнопку «Назад» на страницы детализации."],
       ["Перекрестная фильтрация","поведение по умолчанию — нажатие на визуальный элемент фильтрует другие"],
       ["Редактировать взаимодействия","используйте, чтобы изменить перекрестный фильтр для выделения или полностью отключить его"]
     ]
   },
   notes:"Детализация идеально подходит для рабочего процесса с кратким описанием → подробным описанием. Добавьте измерение (например, «Имя клиента») в поле детализации на странице сведений, и любой визуальный элемент, показывающий это измерение, станет доступным для детализации.",
   viz:{title:"Детализация и перекрестная фильтрация",html:`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px">
     <div style="border:1px solid var(--border);border-radius:8px;padding:10px;min-width:150px">
       <div style="font-weight:700;margin-bottom:6px">🔎 Детализация</div>
       <div style="color:var(--dim)">Щелкните правой кнопкой мыши <b style="color:var(--accent)">Запад</b> →</div>
       <div>прыгает на <b>страница подробностей</b> фильтруется на запад</div>
     </div>
     <div style="border:1px solid var(--border);border-radius:8px;padding:10px;min-width:185px">
       <div style="font-weight:700;margin-bottom:6px">↔ Перекрестная фильтрация</div>
       <div> Нажмите <b style="color:var(--accent)">Запад</b> на диаграмме Региона →</div>
       <div>Таблица продуктов на <b>та же страница</b> фильтрует на Запад</div>
     </div>
   </div>`,caption:"Два способа взаимодействия визуальных элементов: детализация с помощью щелчка правой кнопкой мыши на отдельной странице сведений; перекрестная фильтрация позволяет щелкнуть один визуальный элемент для фильтрации остальных на той же странице."},
   quiz:{q:"Что необходимо добавить на страницу сведений, чтобы создать страницу детализации в Power BI?",opts:["Кнопка «Назад»","Слайсер для бурового поля","Месторождение в сквозной скважине","Закладка"],ans:2,exp:"При добавлении поля в область детализации на панели «Фильтры» эта страница регистрируется как место назначения детализации для этого измерения. Power BI автоматически создает кнопку «Назад»."},
   parsons:{prompt:"Организуйте настройку детализации, от новой страницы до щелчка пользователя.",lines:["Создайте страницу сведений с ее визуальными эффектами.","Перетащите имя клиента в поле детализации на странице.","Power BI автоматически добавляет кнопку «Назад»","Пользователь щелкает правой кнопкой мыши клиента → Детализация → страница сведений."],answer:[0,1,2,3]},
   explain:{is:"Перекрестная фильтрация выполняется автоматически: щелчок по полосе в одном визуальном элементе фильтрует остальные, находящиеся рядом с ней. Детализация — это то, что вы создаете — страница с подробными сведениями, на которую зритель щелкает правой кнопкой мыши.",
     use:"Together they let a report answer the follow-up question without you building a second report. Cross-filtering happens for free; drill-through needs a page and a field placed in its Drill-through well before the menu option appears.",
     like:"Дергаю за одну нитку и наблюдаю, как весь джемпер стягивается, чтобы не открыть дверь, кто-то должен был сначала повесить. Во-первых, что делает ткань; другой существует только потому, что человек приспособил его."},
   build:{q:"Вы нажимаете на полосу \"West\" на диаграмме «Регион», и диаграмма продуктов рядом с ней также меняется. Что это такое?",opts:["Детализация","Перекрестная фильтрация страницы","Фильтр на уровне страницы","Разрушенные отношения"],ans:1,exp:"Перекрестная фильтрация — это взаимодействие на одной странице по умолчанию: выбор в одном визуальном фильтре или выделение остальных. При детализации осуществляется переход на другую страницу с помощью щелчка правой кнопкой мыши — другая функция, другой жест."},
   close:"Вы можете связать поток от сводки к деталям и объяснить, почему диаграммы реагируют друг на друга. Далее: принципы дизайна — сделать отчет достойным внимания.",
   unlock:"Детализация меняет экономику информационной панели: вместо того, чтобы запихивать каждую разбивку на одну страницу «на случай, если кто-то спросит», вы сохраняете сводку в чистоте и позволяете щелкнуть правой кнопкой мыши, чтобы перенаправить людей к деталям. Одна страница детализации часто заменяет три перегруженные страницы отчета."
  },
  {id:11, unit:"Модуль 3: Отчеты и аналитика", title:"Принципы проектирования информационной панели", sub:"Компоновка, иерархия и визуальная ясность",
   story:"Ваши взаимодействия работают правильно. Теперь сделайте отчет читабельным. Иерархия макета: наиболее важные ключевые показатели эффективности расположены вверху слева (куда обращают внимание в первую очередь). Максимум один-два акцентных цвета. Пустое пространство имеет большее значение, чем думают люди. Каждый визуальный элемент должен отвечать на один конкретный вопрос — если его нельзя пометить вопросом, удалите его.",
   intro:"Перегруженный отчёт похож на дорожный знак с двадцатью сообщениями: формально всё верно, но на скорости ничего не разобрать. Визуально перегруженный отчёт не будут использовать, даже если расчёты безошибочны. Хороший отчёт строится на четырёх принципах: визуальная иерархия, выравнивание, умеренная работа с цветом и контекст.",
   ral:{
     code:"1. Иерархия → самое важное число вверху слева, самое большое.\n2. Выравнивание → привязка визуальных элементов к сетке с одинаковым интервалом.\n3. Цвет → максимум 1-2 акцентных цвета, серый для контекста.\n4. Контекст → каждое число требует сравнения (с LY, с целевым показателем)",
     say:"Четыре принципа дизайна информационной панели: поместите самое важное число вверху слева и самое большое. Привяжите все к сетке с одинаковым интервалом. Используйте один или два акцентных цвета плюс серый для контекста. И каждое число требует сравнения — с прошлым годом или с целевым показателем.",
     lines:[
       ["иерархия","Чтение F-образца — поместите карточки KPI вверху слева, подробности ниже."],
       ["Выравнивание","используйте инструменты «Формат» → «Выравнивание» — никогда не допускайте расстояния между глазками"],
       ["Сдержанность цвета","используйте цвет акцента только для самых важных значений"],
       ["Серый для контекста","линии предыдущего периода, ориентиры — серый цвет отступает, позволяя цвету лидировать"],
       ["сравнение","число без контекста — пустяк — всегда показывать по сравнению с целевым или предыдущим"]
     ]
   },
   notes:"Правило «меньше кликов»: если вашей аудитории нужно больше двух кликов, чтобы ответить на самый распространенный вопрос, измените дизайн отчета. Каждая детализация должна оправдывать свою сложность.",
   viz:{title:"Структура и иерархия отчета",html:`<div style="font-size:11px;display:flex;flex-direction:column;gap:8px">
     <div style="display:flex;gap:8px"><div style="flex:1;border:2px solid var(--accent);border-radius:6px;padding:11px;text-align:center;color:var(--accent);font-weight:700">⭐ Заголовок KPI</div><div style="flex:1;border:1px solid var(--border);border-radius:6px;padding:11px;text-align:center;color:var(--dim)">KPI</div><div style="flex:1;border:1px solid var(--border);border-radius:6px;padding:11px;text-align:center;color:var(--dim)">KPI</div></div>
     <div style="border:1px solid var(--border);border-radius:6px;padding:20px;text-align:center;color:var(--dim)">📊 Дополнительная подробная таблица</div>
   </div>`,caption:"Сначала мы читаем вверху слева, поэтому ваш самый важный KPI находится там. Большие заголовки вверху, вспомогательные детали внизу — макет перемещает взгляд от «что произошло» к «почему»."},
   quiz:{q:"Согласно принципу иерархии, где следует разместить вашу самую важную карту KPI?",opts:["Внизу справа (самый заметный)","Центр холста","Вверху слева (чтение по F-образцу)","Вверху справа"],ans:2,exp:"Пользователи читают информационные панели по F-образной схеме — сначала вверху слева, затем поперек, затем вниз. Разместите номер заголовка вверху слева, чтобы его увидели первым."},
   parsons:{prompt:"Расположите этап проектирования готового отчета в том порядке, в котором применяются принципы.",lines:["Иерархия: заголовок KPI вверху слева, самый крупный.","Выравнивание: привязка визуальных элементов к сетке с одинаковым интервалом.","Цвет: один или два акцента, серый для контекста.","Контекст: каждое число сравнивается (с LY, с целью)"],answer:[0,1,2,3]},
   explain:{is:"Четыре правила делают правильный отчет читаемым: самое важное число вверху слева и самое большое, все выровнено по сетке, один или два акцентных цвета с серым для остальных и никогда число без чего-то, с чем его можно сравнить.",
     use:"Запускайте их в таком порядке — структура перед стилем — чтобы не перекрашивать диаграмму, которую вы собираетесь переместить. Правило сравнения — это то, которое игнорируется и которое замечают заинтересованные стороны.",
     like:"Витрина магазина. То, что вы больше всего хотите продать, располагается на уровне глаз посередине, все остальное спокойно выстраивается вокруг него, а ценник без слова «был» рядом ни о чем не говорит прохожему."},
   build:{q:"В отчете в качестве заголовка указано «Выручка: 1,2 миллиона долларов». В чем ошибка конструкции?",opts:["Номер должен быть справа внизу","Никаких сравнений — ничто не говорит о том, хороши ли 1,2 миллиона долларов.","Доход всегда должен представлять собой гистограмму, а не карточку.","Карте нужно больше акцентных цветов"],ans:1,exp:"Число без контекста — пустяк. 1,2 миллиона долларов — это хорошо? Добавьте сравнение — с целевым показателем, с предыдущим годом — и карточка ответит на вопрос, а не поднимет его. Размещение в левом верхнем углу подходит для заголовка, и больше цвета повредит, а не поможет."},
   close:"Вы можете сделать правильный отчет читабельным — иерархию, выравнивание, ограничения, контекст. Далее: публикация, чтобы ее мог увидеть кто-то кроме вас.",
   unlock:"У ограничения цвета есть механический трюк: сначала постройте весь отчет в оттенках серого, а затем используйте один акцентный цвет только на значениях, которые отвечают на основной вопрос страницы. Если все выделено, ничего не выделено — серый цвет делает невозможным подделку."
  },
  {id:12, unit:"Модуль 3: Отчеты и аналитика", title:"Публикация и обмен", sub:"Служба Power BI, рабочие области и доступ",
   story:"Ваша приборная панель чистая и правильная. Последний шаг: опубликуйте в службе Power BI, чтобы ваш менеджер мог просмотреть его в браузере без программного обеспечения. Создайте рабочую область, опубликуйте ее с рабочего стола, поделитесь ссылкой или встройте в Команды. Запланируйте обновление данных, чтобы они оставались актуальными без повторного запуска чего-либо вручную.",
   intro:"Публикация аналогична перемещению документа на общий диск: ваш файл перемещается с вашего рабочего стола (Рабочий стол) в место, где его может открыть вся команда (Сервис). При публикации ваш PBIX-файл отправляется в службу Power BI (веб-приложение). Отсюда вы можете делиться информационными панелями, настраивать автоматическое обновление и контролировать, кто что видит.",
   ral:{
     code:"Рабочий стол: Файл → Публикация → Выбрать рабочую область.\n           ↓\nСлужба Power BI (app.powerbi.com)\n  ├─ Рабочая область → место хранения отчета\n  ├─ Панель мониторинга → закрепленные визуальные элементы из отчетов\n  └─ Поделиться → ссылка или прямой доступ",
     say:"На рабочем столе нажмите «Файл», затем «Опубликовать» и выберите рабочее пространство. Отчет находится в службе Power BI. Панель мониторинга — это отдельная страница, на которой вы закрепляете отдельные визуальные элементы из отчетов. Поделиться дает другим ссылку или прямой доступ.",
     lines:[
       ["Публиковать","отправляет .pbix в Сервис — загружается отчет + набор данных"],
       ["Рабочая область","контейнер в Сервисе — как папка с контролем доступа"],
       ["Информационная панель","коллекция закрепленных плиток из одного или нескольких отчетов"],
       ["Делиться","предоставляет определенным пользователям доступ к просмотру отчета или информационной панели"],
       ["Запланированное обновление","настроить автоматическое обновление данных по расписанию — требуется шлюз для локальных данных"]
     ]
   },
   notes:"Публикация отчета дает доступ только к просмотру этого отчета. Если вы хотите, чтобы пользователи самостоятельно изучали данные, рассмотрите возможность предоставления им доступа к рабочей области или использованию приложения. Приложения — самый чистый способ доставки для конечных пользователей.",
   viz:{title:"Публикуйте и делитесь",html:`<div style="display:flex;align-items:center;gap:8px;font-size:11px;justify-content:center;flex-wrap:wrap">
     <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;text-align:center">🖥️Пауэр БИ<br>Рабочий стол</div>
     <span style="color:var(--accent);font-weight:700">→ Опубликовать →</span>
     <div style="border:2px solid var(--accent);border-radius:6px;padding:8px 12px;text-align:center;color:var(--accent)">☁️ Рабочее пространство<br>(Сервис)</div>
     <span style="color:var(--accent);font-weight:700">→ Поделиться →</span>
     <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;text-align:center">👥 Ваш<br>команда</div>
   </div>`,caption:"Вы создаете Рабочий стол Power BI, публикуете в рабочей области в службе Power BI (облаке), а затем публикуете ее. Рабочая область — это общая папка, в которой хранятся отчеты и информационные панели вашей команды."},
   quiz:{q:"Что такое рабочая область Power BI?",opts:["Одна страница отчета","Общий контейнер в Сервисе","Настольное приложение","Панель «Фильтры» в отчете"],ans:1,exp:"Рабочая область — это пространство для совместной работы в службе Power BI. Вы добавляете участников с разными ролями (Администратор, Участник, Участник, Зритель) и публикуете в нем контент. Приложения создаются из рабочих пространств для более удобной доставки конечному пользователю."},
   parsons:{prompt:"Укажите путь от файла рабочего стола до браузера вашего менеджера.",lines:["Создайте отчет в Рабочий стол Power BI (.pbix).","Файл → Опубликовать → выберите рабочую область.","Отчет хранится в службе Power BI.","Поделитесь ссылкой — ваш менеджер увидит ее в браузере"],answer:[0,1,2,3]},
   explain:{is:"При публикации отчет передается из Рабочий стол Power BI в службу Power BI, где он размещается в рабочей области и может быть доступен для определенных пользователей.",
     use:"Рабочий стол — это ваша личная рабочая копия; Сервис — это то, что видит команда. Изменения не появятся, пока вы не опубликуете их снова, а для отчета, читающего файл на вашем компьютере, требуется шлюз и расписание обновления, чтобы оставаться актуальным.",
     like:"Спектакль на репетиции против спектакля на премьере. Изменение реплики за кулисами ничего не дает публике, пока занавес снова не поднимется."},
   build:{q:"В вашем отчете используется локальный файл Excel, и он должен оставаться актуальным в Службе без ежедневной повторной публикации. Что вы настраиваете?",opts:["Каждое утро отправляйте .pbix своей команде по электронной почте.","Запланированное обновление и шлюз данных","Второе рабочее место","Перекрестная фильтрация на каждой странице"],ans:1,exp:"Запланированное обновление повторно запускает ваши запросы в Службе по таймеру. Поскольку файл Excel находится на локальном компьютере, для доступа к нему Службе требуется шлюз данных. Повторная публикация обновляет только дизайн отчета — обновление касается данных."},
   close:"Вы можете передать отчет со своего рабочего стола всей команде — опубликовать, поделиться им и обновить по расписанию. Вот и готов основной учебный план. Далее: трек «Миграция данных», где эти навыки встречаются в реальном проекте.",
   unlock:"«Кто может это видеть?» Это вопрос, который доставляет аналитикам неприятности, а не вопрос «прав ли DAX?» Роли в рабочей области (Администратор/Участник/Участник/Просмотрщик) плюс безопасность на уровне строк — вот реальный ответ — знание того, как управлять доступом к чтению без подсказки, как производственный опыт на собеседованиях."
  },
{id:401, unit:"Модуль 4: Миграция данных", title:"Профилирование исходных данных", sub:"Power Query: качество столбца, распределение, профиль.",
   story:"Вы переносите данные в модель Power BI. Прежде чем создавать единую меру, вы профилируете источник в Power Query — на этапе «Формирование» живут аналитики миграции. Качество столбца, распределение и профиль превращают «выглядит нормально» в точное количество действительных, ошибочных, пустых и различных значений.",
   ral:{code:"Просмотр ▸ Качество столбца → действительный/ошибочный/пустой %\nВид ▸ Распределение столбцов → количество уникальных и уникальных элементов\nПросмотр ▸ Профиль столбца → полная статистика для одного столбца", say:"Включите качество, распределение и профиль столбца на ленте Представление Power Query, чтобы перед загрузкой просмотреть процент действительных/ошибочных/пустых столбцов и различные количества для каждого столбца.",
     lines:[["Качество колонки","% действительных, ошибочных и пустых значений для каждого столбца — снимок полноты"],["Распределение столбцов","подсчет уникальных и уникальных значений — выявление повторяющихся ключей"],["Профиль столбца","мин/макс/количество/ошибка/пусто для выбранного столбца"],["профиль всей таблицы","отключить выборку из 1000 строк, чтобы профиль охватывал каждую строку"]]},
   notes:"По умолчанию Power Query профилирует только первые 1000 строк — щелкните строку состояния и выберите «Профилирование столбцов на основе всего набора данных», чтобы ваш профиль миграции отражал каждую строку. Отчетливый ≠ уникальный: Отчетливый учитывает каждое значение один раз; уникальный учитывает только значения, которые появляются ровно один раз.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Столбец</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">действительный %</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">пустой %</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">читать</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">электронная почта</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">99%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100 пусто</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">телефон</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">97.6%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">2.4%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">240 пусто</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Количество</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">полный</td></tr></tbody></table></div>", caption:"Индикатор качества столбца Power Query в полях: «Электронная почта» и «Телефон» имеют пробелы по умолчанию или исправлены на этапе «Форма»; Сумма завершена — все это происходит до того, как какие-либо данные поступят в модель."},
   quiz:{q:"По умолчанию профилирование столбцов Power Query основано на…", opts:["Весь набор данных всегда","Первые 1000 строк — не все","Случайная 10% выборка строк","Учитываются только числовые столбцы"], ans:1, exp:"Power Query по умолчанию профилирует 1000 верхних строк для обеспечения скорости. Для миграции вы переключаетесь на «на основе всего набора данных» (строка состояния), чтобы качество и количество отдельных элементов отражали каждую строку."},
   parsons:{prompt:"Настройте настройку профилирования: включите панели, расширьте выборку, затем прочитайте.",lines:["Просмотр ▸ поставить галочку Качество столбца + Распределение столбцов","Строка состояния → «Профилирование столбцов на основе всего набора данных»","Чтение действительных/ошибочных/пустых% в столбце","Примите решение об исправлениях до того, как что-либо загрузится в модель."],answer:[0,1,2,3]},
   explain:{is:"Лента просмотра Power Query может показывать для каждого столбца, какая его часть действительна, неверна или пуста, а также сколько различных записей она содержит.",
     use:"Вы включаете эти панели перед загрузкой чего-либо и переключаете строку состояния на весь набор данных. По умолчанию рассматриваются только первые тысячи строк, которые с радостью пропустят источник из миллиона строк, который развалится дальше.",
     like:"Tasting a pot of soup from the top. It is fine up there; the burnt bit is at the bottom, and you only find it by putting the spoon all the way in."},
   build:{q:"Распределение столбцов показывает 5000 различных, но только 4200 уникальных значений для Идентификатор клиента. Что это значит?",opts:["800 идентификаторов идентификатор клиента появляются более одного раза.","В столбце 800 нулей.","Профиль поврежден","Не удалось загрузить 5000 минус 4200 строк."],ans:0,exp:"Отчетливый считает каждое значение один раз; Уникальные учитываются только значения, встречающиеся ровно один раз. Разрыв в 800 значений — это повторяющиеся идентификаторы — дублирующийся сигнал, который нужно отслеживать, прежде чем этот столбец закрепит связь."},
   close:"Вы можете профилировать источник с точными цифрами вместо того, чтобы прокручивать и щуриться. Далее: удаление дубликатов только что открытого профиля.",
   unlock:"Скриншот профиля, вставленный в начальный билет — действительный %, пустой %, количество различных чисел в каждом столбце — это золото миграции: это фотография «до», которая доказывает, как выглядел источник, когда позже начинаются споры о том, откуда взялись неверные данные."
  },
{id:402, unit:"Модуль 4: Миграция данных", title:"Удаление дубликатов", sub:"Power Query: удаление/сохранение дубликатов, применяемые шаги.",
   story:"При профилировании помечаются повторяющиеся идентификаторы идентификатор клиента — обычное явление при восходящем присоединении. В Power Query вы просматриваете и удаляете их на этапе «Форма», еще до того, как данные достигнут модели, поэтому каждое повторяющееся исправление представляет собой один повторяемый шаг.",
   ral:{code:"Выберите ключевые столбцы\nГлавная ▸ Удаление строк ▸ Удаление дубликатов\n-- сначала проверьте: Главная ▸ Сохранить строки ▸ Сохранить дубликаты", say:"Выберите столбец-ключ, затем на вкладке «Главная» используйте команду «Удалить дубликаты». Можно сначала выбрать «Оставить дубликаты», чтобы проверить повторяющиеся строки перед удалением.",
     lines:[["выберите ключевые столбцы","Удаление дубликатов действует для выбранных вами столбцов."],["Удалить дубликаты","сохраняет первое вхождение каждого ключа, удаляет остальные"],["Сохраняйте дубликаты","ход обзора — показывает только те строки, ключ которых повторяется"],["Применяемые шаги","каждое преобразование записывается и автоматически повторяется при обновлении"]]},
   notes:"Power Query записывает каждое преобразование как прикладной шаг, поэтому дедупликация автоматически повторяется при каждом обновлении — в отличие от однократной очистки Эксель. Используйте «Сохранить дубликаты», чтобы сначала проверить повторы; они часто выявляют проблему с зерном, которую стоит устранить у источника.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">идентификатор клиента</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">имя</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Действие</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">C-100</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Maya Chen</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">kept (first)</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">C-100</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Maya Chen</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Удаленный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">C-101</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Джордан Ли</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">хранится</td></tr></tbody></table></div>", caption:"Удаление дубликатов в идентификатор клиента сохраняет первую строку для каждого ключа и удаляет остальные — это записывается как прикладной шаг, который повторяется при каждом обновлении."},
   quiz:{q:"Зачем выполнять дедупликацию в Power Query, а не после загрузки данных?", opts:["Это единственное место, где это возможно","Прикладной шаг повторно запускает каждое обновление.","DAX не может обнаружить дубликаты","Просто печатать быстрее"], ans:1, exp:"Преобразования Power Query — это прикладные шаги, которые повторно выполняются при каждом обновлении данных. Дедупликация делает исправление постоянным и повторяемым, а не ручную очистку, которую вам придется повторять каждый раз."},
   parsons:{prompt:"Устройте дедупликацию: просмотрите повторы, прежде чем удалять их.",lines:["Выберите ключевой столбец (идентификатор клиента)","Главная ▸ Сохранять строки ▸ Сохранять дубликаты — проверять повторы","Главная ▸ Удаление строк ▸ Удаление дубликатов","Прикладной шаг повторяется при каждом обновлении."],answer:[0,1,2,3]},
   explain:{is:"Команда «Удалить дубликаты» удаляет повторяющиеся записи с учётом выбранных столбцов. Команда «Оставить дубликаты» выполняет обратное действие и показывает только повторения.",
     use:"Всегда сначала запускайте «Сохранить дубликаты». Повторения обычно означают, что что-то не так в восходящем направлении, и их слепое удаление скрывает реальную проблему вместо того, чтобы исправить ее в источнике.",
     like:"Нашел на полке две одинаковые книги. Прежде чем отдать один, выясните, почему их два — потому что, если родственник из лучших побуждений будет присылать одно и то же каждое Рождество, вы будете делать это снова в декабре."},
   build:{q:"Вы хотите ПРОСМОТРЕТЬ повторяющиеся строки, прежде чем что-либо удалять. Какая команда?",opts:["Главная ▸ Удаление строк ▸ Удаление дубликатов","Главная страница ▸ Сохранять строки ▸ Сохранять дубликаты","Преобразовать ▸ Форматировать ▸ Очистить","Просмотр ▸ Качество столбца"],ans:1,exp:"Функция «Сохранить дубликаты» фильтрует представление, оставляя только те строки, ключ которых повторяется — перемещение просмотра. Удалить дубликаты удаляет немедленно; Чистые полоски персонажей; Качество столбца показывает проценты, а не сами строки."},
   close:"Вы можете выполнить дедупликацию с помощью этапа проверки, записанного таким образом, чтобы он повторялся постоянно. Далее: очистка текста — скрытые символы, нарушающие соответствие.",
   unlock:"Прежде чем удалять дубликаты, отсортируйте повторы по столбцу метки времени, если таковой существует. При удалении дубликатов сохраняется ПЕРВОЕ вхождение, поэтому сортировка решает, сохраните ли вы самую старую или новейшую запись каждого ключа. Этот выбор является бизнес-правилом, а не техническим."
  },
{id:403, unit:"Модуль 4: Миграция данных", title:"Очищающий текст", sub:"Power Query: преобразование ▸ формат (обрезка, очистка, регистр).",
   story:"Поиски и связи продолжают давать сбой для значений, которые выглядят одинаково — конечные пробелы и смешанный регистр из устаревшего экспорта. В Power Query команда «Преобразование ▸ Формат» стандартизирует весь столбец, чтобы его ключи соответствовали целевому значению.",
   ral:{code:"Трансформировать ▸ Форматировать ▸ Обрезать — удалить окружающие пространства.\nПреобразовать ▸ Форматировать ▸ Очистить — удалить непечатаемые символы.\nПреобразование ▸ Формат ▸ ПРОПИСНЫЕ РЕГИСТРЫ – один последовательный регистр.", say:"Используйте «Преобразование ▸ Формат», чтобы обрезать окружающие пробелы, очистить непечатаемые символы и обеспечить согласованный регистр, чтобы значения совпадали во всех таблицах.",
     lines:[["Подрезать","удаляет начальные и конечные пробелы"],["Чистый","удаляет непечатаемые символы (переносы строк, табуляции), которые остаются при экспорте"],["ПРОПИСНЫЕ/С заглавной буквы","один последовательный случай, поэтому «Калифорния» и «CA» совпадают"],["Зачем это нужно","несовпадающие пробелы или регистр молча разрывают связи между таблицами"]]},
   notes:"Подрезать + Чистый — это стандартный вариант «один-два» для устаревшего экспорта: Подрезать обрабатывает пробелы, Чистый удаляет непечатаемые символы (разрывы строк, табуляции), которые Подрезать не может. Несогласованный текст — это причина №1 разрыва связей в модели Power BI.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">сырой</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">после обрезки/чистки/ВЕРХНЕГО</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">'Запад'</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">WEST</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Калифорния</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">CA</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">«Нью-Йорк» + разрыв строки</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">NEW YORK</td></tr></tbody></table></div>", caption:"Каждое значение стандартизируется с помощью трансформировать ▸ Формат — теперь ключи соответствуют целевому стандарту, и отношения разрешаются."},
   quiz:{q:"Отношения не будут соответствовать двум значениям, которые выглядят одинаково на экране. Вероятное исправление в Power Query?", opts:["Перестроить всю модель данных","Обрезать/очистить скрытые места","Добавьте сюда новую меру DAX.","Изменение типа визуального элемента"], ans:1, exp:"Идентичные на экране значения часто отличаются конечным пробелом или непечатаемым символом. трансформировать ▸ Формат ▸ Обрезать и очистить удалите их, чтобы ключи отношений наконец совпали."},
   parsons:{prompt:"Стандартизируйте столбец «Регион» — организуйте последовательность очистки.",lines:["Выберите столбец «Регион».","Трансформировать ▸ Форматировать ▸ Обрезать — удалить окружающие пространства.","Преобразовать ▸ Форматировать ▸ Очистить — удалить непечатаемые символы.","Преобразование ▸ Формат ▸ ПРОПИСНЫЕ РЕГИСТРЫ — один согласованный случай"],answer:[0,1,2,3]},
   explain:{is:"Обрезать пробелы на концах значения, Очистить удаляет невидимые символы, а принудительное использование одного регистра делает «WEST» и \"West\" одним и тем же.",
     use:"Вы запускаете все три, прежде чем сопоставлять что-либо в таблицах. Две записи, которые выглядят одинаково на экране, постоянно не совпадают, и почти всегда это конечный пробел или случайный символ, который никто не видит.",
     like:"Два человека пишут одну и ту же фамилию, у одного из них после нее стоит пробел. На бумаге это одна семья; у двери, одного из них нет в списке."},
   build:{q:"Два значения региона печатаются одинаково, но связь отказывается им соответствовать. Какая пара преобразований удаляет то, что вы не видите?",opts:["UPPERCASE + lowercase","Trim + Clean","Заменить значения + удалить дубликаты","Разделить столбец + объединить столбцы"],ans:1,exp:"Подрезать удаляет начальные/конечные пробелы; Очистить удаляет непечатаемые символы, такие как разрывы строк и табуляции. Это два невидимых различия: различия в регистре видны, а другие команды изменяют данные, а не раскрывают скрытые символы."},
   close:"Вы можете сделать так, чтобы текстовые клавиши действительно совпадали, а не просто выглядели так, как будто они совпадают. Далее: типы и нули — другие молчаливые нарушители моделей.",
   unlock:"Устаревший экспорт не работает в темах: мейнфрейм извлекает пробелы с конечными пробелами, веб-экспорт перетаскивает разрывы строк в поля адреса. После одного спасения Trim+Clean вы начнете предварительно запускать пару в каждом столбце текстовых ключей — это ничего не стоит и удаляет целую категорию загадок 3 часов ночи."
  },
{id:404, unit:"Модуль 4: Миграция данных", title:"Приведение типов и замена нулей", sub:"Power Query: тип данных + замена значений.",
   story:"В модели необходимы типизированные столбцы: числовое значение, дата — реальная DATE(для анализа времени), непустой регион. Источник загрузил все как текст. Вы устанавливаете типы и заменяете значения NULL на этапе «Форма», перед созданием модели — текстовая дата разрывается при каждой мере анализа времени.",
   ral:{code:"Преобразование ▸ Тип данных ▸ Десятичное число (сумма)\nПреобразование ▸ Тип данных ▸ DATE(регистрация)\nЗаменить значения ▸ null → «Не назначено» (регион)", say:"Установите для суммы десятичное число и для регистрации дату с помощью типа столбца, затем замените значения, чтобы превратить нули в регионе в «Неназначенные».",
     lines:[["Тип данных ▸ Десятичное число","преобразовать суммы текста в числа, которые можно агрегировать"],["Тип данных ▸ Дата","реальная дата позволяет использовать DAX с интеллектом времени (текстовая дата нарушает его)"],["Заменить значения: ноль → по умолчанию.","заполните значение по умолчанию, чтобы обязательные столбцы не были пустыми"],["Шаг измененного типа","проверьте это — не доверяйте автоматическому обнаружению импортированных данных"]]},
   notes:"Столбец даты, оставленный как текст, автоматически нарушает каждую функцию обработки времени (TOTALYTD, SAMEPERIODLASTYEAR). Устанавливайте типы в Power Query, а не в DAX, и проверяйте шаг «Измененный тип», а не доверяйте автоматическому обнаружению. Функция «Заменить значения» заполняет значения по умолчанию для столбцов, которые требуются модели.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">source (text)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">после ввода/замены</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">тип модели</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">'144.50'</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">144.50</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Десятичный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">'2026-03-15'</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">2026-03-15</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Дата</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">нулевой</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Неназначенный</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Текст</td></tr></tbody></table></div>", caption:"Каждый столбец приведен к типу, который необходим модели, и обратно заполнены нулями — таким образом, агрегирование работает, а у анализа времени есть реальная дата для работы."},
   quiz:{q:"Столбец «Доход» импортирован как текст. Показатель Общий = SUM(Sales[Revenue]) возвращает какие данные и где это исправить?", opts:["Правильная сумма; исправление не требуется","ПУСТОЙ — исправить тип в Мощность запроса.","Ошибка; исправьте это в DAX","0; исправьте это в самом визуале"], ans:1, exp:"СУММА в текстовом столбце возвращает ПУСТО без ошибок. Исправление относится к Power Query (измененный тип), поэтому столбец вводится в модель как число, а не как обходной путь DAX."},
   parsons:{prompt:"Организуйте этап ввода: цифры, затем даты, затем нулевое заполнение, затем проверка.",lines:["Преобразование ▸ Тип данных ▸ Десятичное число (сумма)","Преобразование ▸ Тип данных ▸ DATE(регистрация)","Заменить значения: нулевой → «Не назначено» (регион)","Проверьте шаг «Измененный тип» — не доверяйте автоматическому обнаружению"],answer:[0,1,2,3]},
   explain:{is:"Установка типа данных столбца сообщает Power BI, каковы его записи; Функция «Заменить значения» заменяет пустые места на что-то значимое, например, превращает отсутствующий регион в «Неназначенный».",
     use:"И то, и другое происходит в Power Query еще до того, как что-либо достигнет модели. Затем вы проверяете шаг «Измененный тип», поскольку Power BI уже один раз угадал, и его предположения по импортированным файлам часто ошибочны.",
     like:"Filling in a form where somebody left a box empty. Writing 'not known' is honest and useful; leaving it bare means the next person cannot tell whether it was skipped or genuinely nothing."},
   build:{q:"Столбец «Регион» имеет пустые значения, но модель требует, чтобы каждая строка содержала регион. В чем суть Power Query?",opts:["Удалить строки с нулевым регионом","Заменить значения: нулевой → \"Неназначенный\"","Измените тип региона на целое число.","Напишите меру DAX, которая пропускает пробелы"],ans:1,exp:"Функция «Заменить значения» заполняет значения по умолчанию, поэтому обязательные столбцы не остаются пустыми — строки сохраняют свой доход и историю под честной меткой «Не назначено». Удаление строк приводит к удалению реальных данных, а пропуск DAX скрывает пробел, а не обрабатывает его."},
   close:"Вы можете доставить в модель типизированные столбцы, отличные от NULL, — фигуру, необходимую DAX. Далее: доказать, что миграция действительно сработала.",
   unlock:"«Неназначенное» отображается пустым по одной тонкой причине: значение нулевой незаметно исчезает с большинства визуальных элементов, но «Неназначенное» отображается как отдельная полоса. Разрыв остается видимым для заинтересованных сторон — именно это давление и приводит к исправлению исходной системы."
  },
{id:405, unit:"Модуль 4: Миграция данных", title:"Проверка и сверка", sub:"СЧЕТЧИКИ, контрольные суммы СУММА, левое анти-слияние.",
   story:"Данные загружены в модель. Теперь проверьте результат: все ли строки перенеслись, сохранились ли значения и какие записи отсутствуют в источнике или целевой таблице? Меры COUNTROWS и SUM помогают сравнить источник с целевыми данными; антисоединение в Объединение запросов показывает строки, которые не были перенесены.",
   ral:{code:"Исходные строки = COUNTROWS(Источник)\nЦелевые строки = COUNTROWS(Sales)\nИсходная сумма = SUM(Source[Amount])\nЦелевая сумма = SUM(Sales[Amount])\n-- Power Query: объединить запросы ▸ Left Anti → строки только в исходном коде", say:"Создайте показатели COUNTROWS и SUM как для исходного, так и для целевого объекта и сравните их, а затем используйте слияние Левый анти в Power Query, чтобы составить список исходных строк, не имеющих совпадений в целевом объекте.",
     lines:[["Исходные строки = COUNTROWS(Источник)","подсчитать каждую строку исходной таблицы"],["Целевые строки = COUNTROWS(Продажи)","одинаковое количество в загруженной таблице модели — одинаковое количество означает, что поступила каждая запись"],["Исходная сумма = SUM(Source[Amount])","сложить исходные суммы — контрольную сумму"],["Целевая сумма = SUM(Sales[Amount])","та же сумма по цели — совпадающие итоги доказывают, что значения сохранились в целости и сохранности"],["Объединить запросы ▸ Левый анти","сохранять (только) исходные строки, не имеющие совпадений в целевом объекте — точные записи, которые не были перенесены"]]},
   notes:"Согласование миграции похоже на проверку доставки по упаковочному листу: какие коробки так и не прибыли? Левое анти-соединение в запросах на слияние — это проверка — ИСКЛЮЧЕНИЕ Power BI: оно возвращает именно исходные строки, отсутствующие в целевом объекте. Соедините его с соответствующими показателями контрольной суммы COUNTROWS и SUM (источник или модель) для подписания — счетчик доказывает, что строки поступили, а сумма доказывает, что значения сохранились.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Проверить</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Источник</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">цель</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">соответствовать?</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">COUNTROWS</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">18,402</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">18,400</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">нет — 2 отсутствуют</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">SUM(Amount)</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$1,240,118</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$1,240,118</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Да</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Левые анти-идентификаторы</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4471, 4489</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">—</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">не мигрировал</td></tr></tbody></table></div>", caption:"Счет уменьшился на два; контрольная сумма привязана к поступившим строкам; слияние Левый анти называет точные идентификаторы, которые не были перенесены. Примите решение до подписания."},
   quiz:{q:"Левое анти-слияние источника с целью возвращает строки. Что вы нашли?", opts:["Повторяющиеся исходные строки","Исходные строки без совпадений","Строки, которые совпали нормально","Сироты в цели"], ans:1, exp:"Левое анти-соединение сохраняет только левые (исходные) строки без совпадений с правыми (целевыми) — именно те записи, которые не удалось перенести. Это эквивалент EXCEPT в Мощность запроса."},
   parsons:{prompt:"Устройте отписку: посчитайте с обеих сторон, проверьте итоги, затем назовите недостающие строки.",lines:["Исходные строки = COUNTROWS(Источник)","Целевые строки = COUNTROWS(Продажи)","Сравните подсчеты и контрольные суммы SUM.","Объединить запросы ▸ Левый анти → перечислить строки, которые не были перенесены."],answer:[0,1,2,3]},
   explain:{is:"Согласование миграции означает доказательство трех вещей: поступило одинаковое количество строк, сумма сумм составила одну и ту же цифру и каждое исключение имеет имя.",
     use:"Вы строите проверки строк и сумм с обеих сторон и сравниваете их. Только если кто-то не согласен, вы запускаете слияние Левый анти, которое работает медленно, но точно определяет, какие записи пропали.",
     like:"Распаковка вещей после переезда. Ты проверяешь количество коробок у двери, потом понимаешь, что тяжелый все еще кажется тяжелым, и только когда что-то не так, начинаешь открывать их один за другим."},
   build:{q:"Вам нужен противоположный список — целевые строки, у которых нет соответствующего исходного родительского элемента (сироты). Какое слияние?",opts:["Левое анти (источник против цели)","Правый анти (цель против источника)","Внутренний — сохраняет только совпадения.","Полный внешний — сохраняет все"],ans:1,exp:"Право анти меняет направление: он сохраняет правые (целевые) строки без совпадений с левыми — записи, которые существуют в новой системе без исходного родительского элемента. Левый анти обнаружила то, что не удалось перенести; Право анти находит то, чего там быть не должно."},
   close:"Вы можете доказать миграцию: счетчики равны, итоги равны, и каждое исключение имеет имя. На этом этап миграции данных завершен. Далее: От вопроса к метрике — преобразование запросов заинтересованных сторон в DAX.",
   unlock:"Формулировка подписания имеет значение: «Подсчеты и контрольные суммы совпадают, исключения перечислены владельцами» — это предложение, которое менеджер проекта может передать в руководящий комитет. Список строк Левый анти — это то, что превращает «в основном все в порядке» в проверяемый артефакт."
  },
{id:601, unit:"Глава 5: От вопроса к метрике", title:"Определите меру, прежде чем вычислять ее", sub:"CALCULATE кодирует меру, фильтр и временное окно вместе.",
   story:"Заинтересованная сторона просит «наш доход в этом квартале». Прежде чем писать DAX, закрепите определение: доход по каким строкам — каждый заказ или только оплаченный? В каком окне — в каком квартале, по какой дате? Мера — это агрегация плюс контекст фильтра, а CALCULATE — это функция, которая устанавливает этот контекст. Сначала назовите контекст фильтра в повседневном предложении, и DAX сразу выпадет из предложения.",
   ral:{code:"Q3 Paid Sales =\nCALCULATE(\n    SUM(Sales[Amount]),\n    Sales[Status] = \"Оплачено\",\n    DATESBETWEEN('Date'[Date],\n        DATE(2024,7,1), DATE(2024,9,30))\n)", say:"Суммируйте сумму, но внутри контекста фильтра, который сохраняет только оплаченные строки и только даты третьего квартала — оплаченный доход за третий квартал.",
     lines:[["Q3 Paid Sales = CALCULATE(","повторно запустите следующее выражение под измененными фильтрами, указанными после него"],["SUM(Sales[Amount]),","просуммируйте столбец «Сумма» — измеряемая мера"],["Sales[Status] = \"Paid\",","оставлять только строки со статусом «Оплачено» — половина определения"],["DATESBETWEEN('Date'[Date], DATE(2024,7,1), DATE(2024,9,30))","DATESBETWEEN (сохранять только даты в диапазоне) — с 1 июля по 30 сентября, читайте из отмеченной таблицы дат."],["контекст фильтра = определение","все, что делает это число конкретным, находится в аргументах CALCULATE"]]},
   notes:"Менеджер, говорящий «дайте мне данные о продажах», оставил непринятыми два решения — какие продажи и когда. Аргументы фильтра CALCULATE — это место, где записываются эти решения: это единственная функция, которая изменяет контекст фильтра, а ее аргументы фильтра — это то, как вы кодируете определение метрики. Всегда управляйте логикой даты через выделенную помеченную таблицу дат, а не через столбец даты таблицы фактов — от нее зависят функции анализа времени. Привычка на собеседовании: переформулировать расплывчатый «доход» как показатель + фильтр + окно словами («сумма суммы, только оплаченная, датированная третьим кварталом»), и CALCULATE напишет сам себя. аргумент за аргумент.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">часть определения</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">эта мера</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">часть DAX</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Мера</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">revenue (dollars)</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">SUM(Sales[Amount])</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Фильтр</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">только оплаченные заказы</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Sales[Status] = \"Paid\"</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Окно</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Третий квартал 2024 г., таблица дат</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">DATESBETWEEN('Date'[Date], …)</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">двигатель</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">изменить контекст</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">CALCULATE(...)</td></tr></tbody></table></div>"},
   quiz:{q:"Зачем направлять окно Q3 через «Дата» [Дата], а не напрямую фильтровать Продажи [Дата заказа]?", opts:["Столбцы продаж вообще невозможно фильтровать","Размеченная таблица дат обеспечивает оперативную информацию о времени.","Это ускоряет визуализацию меры.","DATESBETWEEN принимает только текстовые столбцы."], ans:1, exp:"Функции обработки времени (DATESBETWEEN, DATEADD, TOTALYTD) требуют непрерывной помеченной таблицы дат для правильного перемещения по календарю. Фильтрация собственного столбца дат таблицы фактов работает для одного статического диапазона, но не поддерживает сравнения периодов, которые вы создадите дальше."},
   parsons:{prompt:"Упорядочите показатель «Платные продажи за 3 квартал» — сначала выражение, затем каждый фильтр.",lines:["Q3 Paid Sales =","CALCULATE(","SUM(Sales[Amount]),","Sales[Status] = \"Paid\",","DATESBETWEEN('Date'[Date], DATE(2024,7,1), DATE(2024,9,30)))"],answer:[0,1,2,3,4]},
   explain:{is:"Прежде чем писать какой-либо DAX, вы определяете две вещи, которые запрос оставляет неясными: какие строки подходят и какой период времени применяется.",
     use:"«Наша выручка за этот квартал» скрывает и то, и другое — каждый заказ или только оплаченные, датированные датой заказа или датой оплаты? Сначала произнесите определение в виде предложения, и аргументы CALCULATE выпадут в том порядке, в котором вы их произнесли.",
     like:"Кто-то спрашивает, как далеко ты пробежал на этой неделе. Прежде чем ответить, вам нужно выяснить, состоится ли прогулка в магазин и в понедельник или в воскресенье началась неделя."},
   build:{q:"Заинтересованная сторона просит «наш доход в этом квартале». Какой твой первый шаг?",opts:["Напишите СУММУ(Продажи[количество]) и поместите ее на карту.","Закрепите определение словами, затем напишите DAX","Попросите ИТ-специалиста предоставить больший набор данных","Сначала создайте визуальный элемент, а затем определите меру"],ans:1,exp:"Неопределенный вопрос скрывает два решения: в каких строках (каждый заказ или только оплаченный?) и в каком окне (3 квартал календаря к какой дате?). Сначала закрепите оба слова словами, и CALCULATE запишется сам — пропустите этот шаг, и вы отправите число, которое заинтересованное лицо не имело в виду."},
   close:"Вы можете превратить расплывчатый запрос в точную меру: агрегирование, фильтр, окно — все это закодировано в CALCULATE. Далее: сегментация с помощью SWITCH(TRUE()).",
   unlock:"Привычка пересчитывать, а затем кодировать выполняет функцию управления заинтересованными сторонами: отвечать: «Так это сумма, только оплаченные заказы, с июля по сентябрь?» выявляет несоответствия определений на собрании еще до того, как вы что-либо создадите — самый дешевый момент, чтобы их обнаружить."
  },
{id:602, unit:"Глава 5: От вопроса к метрике", title:"Сегмент с помощью SWITCH(TRUE())", sub:"Распределите число по именованным уровням в вычисляемом столбце.",
   story:"«Сколько клиентов имеют высокую, среднюю и низкую ценность?» Столбца уровня нет — вы его получаете. SWITCH(TRUE()) просматривает список условий и возвращает первое из них, превращая расходы за весь период в именованный диапазон. Будучи вычисляемым столбцом, он становится реальным измерением, которое можно разрезать, группировать и размещать на оси. Это сегментация, то есть разбивка по категориям «клиенты по уровням» или «заказы по размеру».",
   ral:{code:"Уровень клиента =\nПЕРЕКЛЮЧАТЕЛЬ(\n    ИСТИНА(),\n    Клиенты[LifetimeSpend] >= 1000, «Высокий»,\n    Клиенты[LifetimeSpend] >= 250, «Средний»,\n    «Низкий»\n)", say:"Для каждого клиента проверьте условия сверху вниз и верните первую истинную метку — «Высокий» при тысяче и более, затем «Средний» при 250, в противном случае «Низкий».",
     lines:[["Уровень клиента =","вычисляемый столбец — одна сохраненная метка для каждой строки клиента, поэтому вы можете разрезать и группировать ее"],["ПЕРЕКЛЮЧАТЕЛЬ(ИСТИНА(),","ПЕРЕКЛЮЧИТЬ ИСТИНА (проверить условия сверху вниз) — вернуть результат первого условия, которое выполняется"],["Customers[LifetimeSpend] >= 1000, \"High\",","трата тысячи или более прочтений означает «Высокий» — сначала идет самый строгий тест, потому что SWITCH останавливается при первом совпадении"],["Customers[LifetimeSpend] >= 250, \"Medium\",","любой, у кого осталось 250 и более, читает «Средний»"],["\"Низкий\"","последнее значение — это еще одно — здесь приземляются все, кому меньше 250."]]},
   notes:"SWITCH(TRUE()) оценивает условия по порядку и возвращает первое значение TRUE, поэтому в первую очередь перечисляются наиболее ограничительные пороговые значения, иначе клиент стоимостью 5000 долларов попадает в средний уровень. Сделайте уровень вычисляемым столбцом (сохраненным атрибутом строки), когда вам нужно разрезать его или поместить на ось; делайте это мерой только тогда, когда сегменты зависят от контекста фильтра. Структура интервью: сегментация заключается в том, чтобы «выделить измерение, которого нет в модели, а затем агрегировать по нему».",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">категория</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Клиенты по уровням ценности</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Высокий</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">420</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Средне</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1,180</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Низкий</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">2,640</td></tr></tbody></table></div>", caption:"Клиенты по уровням ценности"},
   quiz:{q:"В SWITCH(TRUE()) условие >= 250 указано перед >= 1000. Где оказывается клиент стоимостью 5000 долларов?", opts:["В категории \"Высокий\", как и задумано","В категории \"Средне\" — по первому совпавшему условию","При пересечении условий возникает ошибка","В пустую категорию без подписи"], ans:1, exp:"SWITCH(TRUE()) возвращает значение при первом условии, которое оценивает TRUE. Расходы в 5000 долларов сначала удовлетворяют >= 250, поэтому они помечены как «Средние», а ветвь «Высокая» никогда не запускается. Упорядочите условия от наиболее строгих к наименее ограничительным."},
   parsons:{prompt:"Расположите столбец «Уровень клиента» — пороговые значения от наиболее строгих к наименее ограничительным, иначе — в последнюю очередь.",lines:["Уровень клиента =","ВЫКЛЮЧАТЕЛЬ(","ИСТИННЫЙ(),","Customers[LifetimeSpend] >= 1000, \"High\",","Customers[LifetimeSpend] >= 250, \"Medium\",","\"Низкий\")"],answer:[0,1,2,3,4,5]},
   explain:{is:"SWITCH(TRUE()) проверяет условия сверху вниз и возвращает первую подходящую метку — Высокий, Средне или Низкий — сохраненную в виде столбца.",
     use:"Вы используете его для создания группировки, которой никогда не было в источнике, поэтому она может располагаться по оси или в срезе. Пороги должны идти от самого большого вниз, иначе каждый крупный тратитель попадет в среднюю полосу.",
     like:"По прибытии почту раскладывают по трем лоткам: сначала что-нибудь срочное, затем что-нибудь с знакомой вам маркой, а все, что осталось, кладут в третий. Проверьте их наоборот, и срочное письмо окажется под каталогами."},
   build:{q:"Вам необходимо поместить уровень клиента на ось гистограммы и в срез. Это должен быть вычисляемый столбец или мера?",opts:["Мера — меры всегда предпочтительнее","Вычисляемый столбец — для осей нужны сохраненные значения.","Либо работает одинаково","Ни то, ни другое — для уровней требуется отдельная таблица."],ans:1,exp:"Оси и срезы группируют данные по сохранённым атрибутам, поэтому категория должна храниться в отдельном столбце каждой строки. У меры нет значения для каждой строки: она возвращает число в текущем контексте фильтра. Меры подходят для агрегирования, а столбцы — для измерений, по которым нужно группировать данные."},
   close:"Вы можете получить измерение, которого нет в модели, и разрезать его. Далее: ежемесячный рост с помощью DATEADD.",
   unlock:"Сегментация — это тихая сверхсила аналитика на совещаниях: «высокая/средняя/низкая ценность» превращает список клиентов из 4000 строк в три группы, с которыми можно действовать. Пороги сами по себе являются предметом делового разговора: используйте ПЕРЕКЛЮЧАТЕЛЬ, позвольте заинтересованным сторонам владеть ограничениями."
  },
{id:603, unit:"Глава 5: От вопроса к метрике", title:"Месячный рост с помощью DATEADD", sub:"Переместите контекст даты на месяц назад, а затем сравните.",
   story:"«Мы растем?» потребности в этом месяце сравниваются с прошлым месяцем. DAX делает это с помощью временной аналитики: DATEADD сдвигает текущий контекст фильтра на один месяц назад, чтобы вы могли оценить тот же показатель за предыдущий период, затем DIVIDE преобразует разницу в темпы роста. Период за периодом — это наиболее часто задаваемое число в любом обзоре, и форма VAR-и-DATEADD — стандартный способ его получения.",
   ral:{code:"Продажи в месяц % =\nVAR Cur = [Общий объем продаж]\nВАР Предыдущий =\n    CALCULATE([Общий объем продаж],\n        DATEADD('Date'[Date], -1, MONTH))\nRETURN\n    DIVIDE(Текущая - Предыдущая, Предыдущая)", say:"Получите итоговую сумму за этот период, затем пересчитайте ту же сумму с датами, сдвинутыми на один месяц назад, и выразите разницу как часть предыдущего месяца.",
     lines:[["VAR Cur = [Total Sales]","VAR (сохраните значение под именем) — зафиксируйте итог за этот месяц, прежде чем что-либо изменится."],["VAR Prev = CALCULATE([Total Sales],","повторно запустите тот же итог под фильтром сдвинутой даты, который следует ниже"],["DATEADD('Date'[Date], -1, MONTH))","DATEADD (сдвиг дат) — весь контекст даты перемещен на один месяц назад, поэтому он оценивается как значение прошлого месяца."],["RETURN DIVIDE(Cur - Prev, Prev)","RETURN the growth: this month minus last, divided by last — DIVIDE keeps the first month blank instead of erroring"]]},
   notes:"Для DATEADD требуется непрерывная помеченная таблица дат — из-за пробелов в календаре она возвращается пустой. Запишите значения в VAR, чтобы мера читалась как простая арифметика, и каждая часть оценивалась один раз. Используйте DIVIDE вместо «/», чтобы самый ранний месяц (без предшествующего периода) давал пробел, а не ошибку. Замените МЕСЯЦ на ГОД, чтобы получить годовое значение, или используйте SAMEPERIODLASTYEAR — ту же строку RETURN.",
