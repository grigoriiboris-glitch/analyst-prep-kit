// The More detail / Less detail toggle was removed 2026-07-27 (roadmap P8). Focus mode
// is the only mode now: the lesson is concept, directive, do it, with nothing folded
// one tap behind a button. The lesson `notes` ("Watch out") no longer render here; if
// they earn a place anywhere it is P3's wrap-up, after the learner has succeeded.

let _v2ParsAttempt = {};
let _v2ParsWasWrong = {};

// ─── ONE ORDERING EXERCISE ──────────────────────────────────────────────────
// The lesson Try stage and the Practice "Put in Order" drill were two builds of
// the same interaction: different chip classes, different placement bookkeeping
// (the lesson moved DOM nodes by tap, the drill dragged them), different pool
// labels, nudge controls on one and not the other, and two different checkers.
// Same problem, same pieces, same answer, built twice.
//
// Everything the learner touches now comes from here. What genuinely differs
// stays at the call site: a lesson does not scaffold, a drill does. That is
// content, not machinery.
const Ord = {
  pool: k => document.getElementById('ord-pool-' + k),
  ans:  k => document.getElementById('ord-ans-' + k),

  // `lines` is the exercise's own array; `order` is the display order of the
  // pool. Every chip carries its index into `lines`, which is what both callers
  // compare against their answer.
  html(key, lines, order){
    const seq = order || lines.map((_, i) => i);
    const chips = seq.map(i =>
      `<div class="ord-chip" draggable="true" data-line="${i}" onclick="Ord.tap('${key}',this)"
         ondragstart="Ord.dragStart(event)" ondragover="Ord.dragOver(event)"
         ondrop="Ord.drop(event,'${key}','pool')"><span class="pars-txt">${lines[i]}</span></div>`).join('');
    return `<div class="parsons-wrap">
      <div class="parsons-col">
        <label>Коснитесь фигуры, чтобы переместить ее между пулом и вашим ответом.</label>
        <div class="parsons-pool" id="ord-pool-${key}" ondragover="Ord.dragOver(event)" ondrop="Ord.drop(event,'${key}','pool')">${chips}</div>
      </div>
      <div class="parsons-col">
        <label>Ваш ответ сверху вниз</label>
        <div class="parsons-answer" id="ord-ans-${key}" ondragover="Ord.dragOver(event)" ondrop="Ord.drop(event,'${key}','ans')"></div>
      </div>
    </div>`;
  },

  // Tap a pool chip and it joins the answer; tap a placed chip and it goes back
  // to the pool in the pool's original line order, so returning a piece never
  // reshuffles what is left. Scaffolded chips are locked and ignore taps.
  tap(key, chip){
    if(chip.getAttribute('draggable') === 'false') return;
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    if(chip.parentElement === pool){ ans.appendChild(chip); }
    else {
      const line = +chip.dataset.line;
      const after = [...pool.querySelectorAll('.ord-chip')].find(c => +c.dataset.line > line);
      pool.insertBefore(chip, after || null);
    }
    Ord.sync(key);
  },

  // Nudge a placed piece: fixing one out-of-order line costs one tap instead of
  // clearing the answer and re-tapping everything (playtest S3, 2026-07-20).
  move(key, ev, dir){
    ev.stopPropagation();
    const chip = ev.currentTarget.closest('.ord-chip');
    if(!chip) return;
    const sib = dir < 0 ? chip.previousElementSibling : chip.nextElementSibling;
    if(!sib) return;
    if(dir < 0) chip.parentElement.insertBefore(chip, sib);
    else chip.parentElement.insertBefore(sib, chip);
    Ord.sync(key);
  },
  sync(key){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(pool) pool.querySelectorAll('.pars-move').forEach(m => m.remove());
    if(!ans) return;
    const chips = [...ans.querySelectorAll('.ord-chip')];
    chips.forEach((c, i) => {
      const locked = c.getAttribute('draggable') === 'false';
      let ctl = c.querySelector('.pars-move');
      if(locked){ if(ctl) ctl.remove(); return; }
      if(!ctl){
        ctl = document.createElement('span');
        ctl.className = 'pars-move';
        ctl.innerHTML = "<button type=\"button\" aria-label=\"Move this piece earlier\">↑</button>" +
                        "<button type=\"button\" aria-label=\"Move this piece later\">↓</button>";
        ctl.children[0].onclick = e => Ord.move(key, e, -1);
        ctl.children[1].onclick = e => Ord.move(key, e, 1);
        c.appendChild(ctl);
      }
      ctl.children[0].disabled = i === 0;
      ctl.children[1].disabled = i === chips.length - 1;
    });
  },

  // What the learner has placed, as indices into `lines`, and as text.
  placed(key){ const a = Ord.ans(key); return a ? [...a.querySelectorAll('.ord-chip')].map(c => +c.dataset.line) : []; },
  texts(key){ const a = Ord.ans(key); return a ? [...a.querySelectorAll('.ord-chip')].map(c => (c.querySelector('.pars-txt')||c).textContent) : []; },
  clear(key){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    [...ans.querySelectorAll('.ord-chip')].forEach(c => {
      c.setAttribute('draggable','true'); c.classList.remove('is-locked');
      const line = +c.dataset.line;
      const after = [...pool.querySelectorAll('.ord-chip')].find(x => +x.dataset.line > line);
      pool.insertBefore(c, after || null);
    });
    Ord.sync(key);
  },

  // Place the first `count` pieces of the correct answer, locked, and return the
  // rest to the pool in original line order so the remaining ordering is not
  // given away. The pool order stays put for the whole exercise.
  scaffold(key, lines, answer, count){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    const all = {};
    [...pool.querySelectorAll('.ord-chip'), ...ans.querySelectorAll('.ord-chip')]
      .forEach(c => { all[+c.dataset.line] = c; });
    pool.innerHTML = ''; ans.innerHTML = '';
    const placed = new Set();
    for(let i = 0; i < count; i++) placed.add(answer[i]);
    for(let i = 0; i < count; i++){
      const chip = all[answer[i]];
      if(!chip) continue;
      chip.setAttribute('draggable','false');
      chip.classList.add('is-locked');
      ans.appendChild(chip);
    }
    lines.forEach((_, i) => {
      if(placed.has(i)) return;
      const chip = all[i];
      if(!chip) return;
      chip.setAttribute('draggable','true');
      chip.classList.remove('is-locked');
      pool.appendChild(chip);
    });
    Ord.sync(key);
  },

  _dragged: null,
  dragStart(e){ Ord._dragged = e.target.closest('.ord-chip'); if(Ord._dragged) Ord._dragged.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; },
  dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; },
  drop(e, key, zone){
    e.preventDefault();
    if(!Ord._dragged) return;
    Ord._dragged.classList.remove('dragging');
    const el = zone === 'pool' ? Ord.pool(key) : Ord.ans(key);
    if(el) el.appendChild(Ord._dragged);
    Ord._dragged = null;
    Ord.sync(key);
  }
};

// The two words a result is allowed to use, with a glyph as well as a colour so
// it never depends on seeing colour. The explanation under a check was
// byte-identical either way, so the only way to learn your own result was to
// notice which buttons appeared.
function verdictHTML(ok){
  return ok
    ? '<div style="font-size:13px;margin:10px 0 4px;color:var(--green);font-weight:600">&#10003; Correct</div>'
    : '<div style="font-size:13px;margin:10px 0 4px;color:var(--red);font-weight:600">&#10007; Not quite</div>';
}

function v2ParsCheck(lid){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l||!l.parsons) return;
  const key = 'l'+lid;
  if(!Ord.ans(key)) return;
  const placed = Ord.placed(key);
  const fb = document.getElementById('v2pbi-pars-fb-'+lid);
  if(placed.length !== l.parsons.answer.length){
    if(fb) fb.innerHTML=`<span style="color:var(--warn);font-size:13px">Переместить все ${l.parsons.answer.length} части к вашему ответу в первую очередь.</span>`;
    return;
  }
  const correct = l.parsons.answer.every((v,i)=>v===placed[i]);
  _v2ParsAttempt[lid] = {lines: Ord.texts(key)};
  _v2ParsWasWrong[lid] = !correct;
  if(correct){
    delete _v2ParsWasWrong[lid];
    celebrate();
    if(fb) fb.innerHTML="<span style=\"color:var(--green);font-size:13px;font-weight:600\">✓ Правильно</span> <span style=\"color:var(--muted);font-size:12px\">— это правильный порядок.</span>";
    // Check and Skip are moot once it is solved, so the row swaps in place and
    // the forward press is the only obvious next tap.
    const actions = document.getElementById('v2pbi-pars-actions-'+lid);
    if(actions) actions.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lid},1)">← Назад</button>
      <button class="btn btn-primary" onclick="setPbiStage(${lid},3)">${fwdLabel(STAGE_ASK[3])}</button>`;
  } else {
    recordMiss(lid, l.parsons.prompt);
    // The pieces STAY where the learner put them. A wrong ordering is only good
    // for looking at, so wiping it throws away the one thing it bought.
    if(fb) fb.innerHTML="<span style=\"color:var(--red);font-size:13px;font-weight:600\">✗ Не совсем — попробуйте изменить порядок частей.</span>";
    const btn = document.getElementById('v2pbi-stuck-try-'+lid);
    if(btn) btn.style.display='';
    if(window.lucide) lucide.createIcons();
  }
}

// v2ResetLesson was resetLesson with a different name and one fewer key
// cleared. There is one now, up with the rest of the state handling.

// ─── HELP THAT HELPS ────────────────────────────────────────────────────────
// A real hint, from the lesson's own content, with no key and no network.
// "Stuck? Get a hint" appears exactly when a learner has just failed, and it
// used to answer "Add your Anthropic API key in Settings" — a dead affordance
// at the moment of maximum frustration. Every lesson already carries an opening
// line, a worked example and a close, so there is always something honest to
// say. The API coach is the optional SECOND step for people who have set a key,
// not the only step.
function stuckHint(lid, stageName){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l) return;
  const isTry = stageName==='try';
  const el = document.getElementById(`v2pbi-hint-${isTry?'try':'build'}-${lid}`);
  if(!el) return;
  let html='';
  if(isTry){
    // For an ordering puzzle the honest nudge is the rule that decides the
    // order, plus the shape of the worked example. It says how many steps there
    // are and what each one starts with, without saying which piece is which.
    const shape=(l.ral && (l.ral.code || l.ral.formula))||'';
    html += `<p style="margin:0 0 8px">Каждая строка может использовать только то, что уже определено в строках выше, поэтому порядок является порядком зависимости, а не предпочтения. Вот форма проработанного примера, который вы только что прочитали.</p>`;
    if(shape) html += `<div class="ladder-partial">${_escHTML(_hintShape(shape))}</div>`;
  } else {
    html += `<p style="margin:0 0 8px">${l.intro || l.sub || l.close || l.title}</p>`;
  }
  // The way out of being stuck is the worked example, not a stronger hint.
  html += `<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lid},1)">Еще раз покажите рабочий пример</button>
  </div>`;
  if(getCoachKey()){
    html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <button class="btn btn-ghost btn-sm" onclick="v2CoachStuck(${lid},'${stageName}')"><i data-lucide="sparkles" style="width:13px;height:13px;vertical-align:-2px"></i> Спросите также тренера по искусственному интеллекту.</button>
    </div>`;
  }
  el.innerHTML=html;
  el.classList.add('show');
  if(window.lucide) lucide.createIcons();
}
// The worked example with each line's body blanked. The skeleton, not the
// answer.
function _hintShape(code){
  return String(code||'').split('\n').map(line=>{
    const m = line.match(/^(\s*)(\S+)([\s\S]*)$/);
    if(!m) return line;
    return m[1] + m[2] + (m[3].trim() ? ' ___' : '');
  }).join('\n');
}
// The model answers in Markdown, and the response used to go through
// textContent, so a learner pressing the button at the moment they are most
// stuck read a literal "**Hint:** ... what does CALCULATE *filter*". Rendering
// the raw response as HTML instead would be an injection hole on a public page,
// so the text is escaped FIRST and only then are bold, italic and inline code
// turned back into tags. Nothing else in Markdown is honoured, on purpose:
// three replacements cannot smuggle a tag through, a full parser might.
function _hintMD(t){
  return _escHTML(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\n/g, '<br>');
}

// Hints — Mode 1 (Haiku, stuck-help) + Mode 3 (Sonnet, gap analysis)
// Shares the Anthropic key with the Excel & Python kits via localStorage['apk-coach-key'].
function getCoachKey(){ return localStorage.getItem('apk-coach-key')||''; }
function setCoachKey(k){ localStorage.setItem('apk-coach-key', k.trim()); showToast("Ключ сохранен."); }

async function _v2CoachCall(prompt, model, targetId){
  const key = getCoachKey();
  const el = document.getElementById(targetId);
  if(!key){
    // Only reachable if the key is cleared between opening the hint and
    // pressing this, but it names what is still on screen BEFORE what is not.
    if(el){ el.innerHTML="Подсказка выше и рабочий пример все еще здесь. Тренеру ИИ поверх них нужен ключ Антропный API, который вы можете добавить в «Настройки» → «Подсказки»."; el.classList.add('show'); }
    return;
  }
  if(el){ el.textContent="Думая…"; el.classList.add('show'); }
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(el) el.innerHTML = _hintMD(data.content?.[0]?.text || "Нет ответа — проверьте свой ключ.");
  } catch(e){ if(el) el.textContent="Запрос не выполнен — проверьте ключ в настройках."; }
}

function v2CoachStuck(lid, stageName){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l) return;
  const p = l.parsons;
  const isTry = stageName==='try';
  const prompt = isTry
    ? `You are a concise Power BI & DAX tutor. A student is arranging lines in order. Puzzle: "${p.prompt}"\nLines available:\n${p.lines.map((t,i)=>`${i}: ${t}`).join('\n')}\nGive ONE short hint (1-2 sentences) that nudges them toward the right order without revealing it.`
    : `You are a concise Power BI & DAX tutor. A student answered a multiple-choice question about "${l.title}" incorrectly. Question: "${l.build.q}"\nGive ONE short hint (1-2 sentences) pointing toward the correct answer without stating it.`;
  _v2CoachCall(prompt, 'claude-haiku-4-5-20251001', `v2pbi-coach-resp-${isTry?'try':'build'}-${lid}`);
}

function v2CoachGap(lid){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l) return;
  const p = l.parsons;
  const att = _v2ParsAttempt[lid];
  const correctLines = p.answer.map(i=>p.lines[i]).join('\n');
  const attemptLines = att ? att.lines.join('\n') : '(skipped)';
  const prompt = `You are a Power BI & DAX tutor giving brief gap analysis. Lesson: "${l.title}".\nCorrect order:\n${correctLines}\nStudent's order:\n${attemptLines}\nIn 2-3 sentences, explain the key difference and why the correct order matters. Be direct — no filler.`;
  _v2CoachCall(prompt, 'claude-sonnet-4-6', `v2pbi-coach-resp-gap-${lid}`);
}

// One stage on screen at a time, and the stage's own ask moves out of the card
// and into the pinned directive bar, so it is said once, in the slot the learner
// has been reading from since stage one. Returns the body; the frame around it
// is renderLesson's, and it is the same frame the practice steps get.
// No guide row inside the block, unlike the SQL kit's version: this kit already
// puts guideLinkHTML under every stage and every practice step, so a fourth link
// in the same viewport would be the same offer made twice.
//
// Stays above the directive, so the last thing read before acting is still the
// instruction (CURRICULUM_STANDARD, directive always visible).
function lessonExplainHTML(l){
  const e = l.explain;
  if(!e) return '';
  return `<div class="lx">
      ${e.is  ? `<div><span class="lx-k">Что это такое.</span> ${e.is}</div>` : ''}
      ${e.use ? `<div><span class="lx-k">Как вы его используете.</span> ${e.use}</div>` : ''}
      ${e.like? `<div class="lx-like"><span class="lx-k">Так.</span> ${e.like}</div>` : ''}
    </div>`;
}

        <button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lid},0)" title="Walk back through this lesson, your tick stays">↺ Обзор урока</button>
      </div>
    </div>
    ${done&&l.unlock?`<div class="unlock-card"><h4><i data-lucide="unlock" style="width:15px;height:15px;vertical-align:-2px"></i> Статистика разблокирована</h4><p>${l.unlock}</p></div>`:''}
    ${missPanelHTML(lid)}`;
  }

  return explain + directiveHTML(DIRECTIVE) + body + guideLinkHTML(lid);
}

// Every drill linked to the FIRST lesson it applies to — all 36 (FILLS/BUGS/
// PARSONS ×12) appear exactly once HERE. The lesson PATH is a filtered view of
// this map, not the whole of it: guidedSeqFor keeps fills, parsons and the two
// hand-offs and drops bugs, so lessons 3, 4, 11 and 12 have no path and the
// flow advances straight past them. Bug Hunt is unchanged on the Practice tab.
const LESSON_DRILLS = {
  1:  [['workspace']],
  2:  [['parsons',8]],
  3:  [],
  4:  [['bugs',11]],
  5:  [['fills',8],['fills',11],['bugs',0],['bugs',2],['bugs',4],['bugs',7]],

  7:  [['fills',3],['fills',9],['bugs',5],['bugs',9],['parsons',1],['parsons',7]],
  8:  [['fills',4],['fills',5],['bugs',3],['bugs',8],['bugs',10],['parsons',3],['parsons',4],['parsons',6]],
  9:  [['parsons',9]],
  10: [['parsons',11]],
  11: [],
  12: []
};

// Flashcards per lesson. NOT read by the path any more — cards came out of the
// lesson sequence and stay a whole feature on the Cards tab. Kept, and kept
// accurate, because this map plus one concat in guidedSeqFor is all it takes to
// put them back: indices are 0-based into DATA.CARDS, every card tagged to the
// FIRST lesson that teaches its concept, all 28 appearing exactly once. Unit 0
// and Units 4-7 are concept/scenario lessons with no cards of their own.
const LESSON_CARDS = {
  1:[0,1,2], 2:[3,4], 3:[26], 4:[5,6,7],
  5:[8,9,10,11], 6:[14,17,18], 7:[12,13], 8:[15,16,24],
  9:[19,25], 10:[20,21], 11:[], 12:[22,23,27]

// ─── GUIDED PATH (lesson → its drills → hand-off → next lesson) ─────────────
let guided = null;         // { lessonId, seq:[[type,idx]], pos, review?, reviewUnit?, nextLid? }
// Declared here, next to `guided`, and not down by the functions that use it:
// a `let` used by a function defined above it is a temporal-dead-zone trap in a
// single script block.
let _handoffReturn = null; // {lessonId, pos, key, view} — where the path was when it handed off

const _HANDOFFS = {
  workspace: {title:"Найдите его в рабочей области", copy:"Просмотрите реальный макет Power BI — панели, области полей, холст — затем вернитесь и продолжайте.", btn:"Открыть рабочую область →", view:'workspace'},
  lab: {title:"Посмотрите это в лаборатории DAX.", copy:"Просмотрите функции DAX, которые вы только что использовали в справочнике с возможностью поиска, затем вернитесь и продолжите.", btn:"Открыть лабораторию DAX →", view:'lab'}
};

// Cards and Bug Hunt are deliberately NOT in this sequence. Both are still
// whole features on the Practice tab, and Cards on its own tab as well; nothing
// is deleted. They came out because of what they do to the step AFTER them, not
// because of what they are.
//
// Every step the path keeps has the same shape: you produce a line of DAX, you
// press one button, the check tells you if it is right. A card has no answer
// box and no check, and Bug Hunt asks you to find a fault rather than produce a
// line, so each one moved four of six machinery slots on the way in and four on
// the way out. Switching the machinery is a cost that buys no retention
// (Monsell 2003, Trends in Cognitive Sciences 7(3):134-140). Switching the
// topic is what buys it, and the path still does that on every step.
//
// The two hand-off steps stay: they end in something you looked at and came
// back from, the same way SQL keeps its lab node. To put cards or bugs back,
// add the line to M and re-concat — renderGuidedStep still handles every step
// type, so nothing else has to change.
function guidedSeqFor(lessonId){
  const M = {fills:'FILLS', parsons:'PARSONS'};
  const all = LESSON_DRILLS[lessonId] || [];
  const drills = all.filter(s => M[s[0]] && DATA[M[s[0]]] && DATA[M[s[0]]][s[1]]);
  const hand = all.filter(s => _HANDOFFS[s[0]]);
  return drills.concat(hand);
}
function startGuided(lessonId){
  const seq = guidedSeqFor(lessonId);
  if(!seq.length){ gotoNextLesson(lessonId); return; }
  guided = {lessonId, seq, pos:0};
  // The practice steps render in the LESSON view now, in the lesson's own
  // frame, so the Lessons tab is the one that stays lit. The standalone
  // Practice tab is unchanged.
  _markNav(1);
  renderGuidedStep();
}
function _markNav(i){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const b = document.querySelectorAll('.nav-btn')[i]; if(b) b.classList.add('active');
}

// Mixed review node at a unit boundary: four items pulled from EARLIER lessons
// (interleaved retrieval — Rohrer/Cepeda). Soft-guide: fully skippable, never
// blocks the next lesson.
function startUnitReview(finishedUnit, nextLid){
  const nextPos = lessonPos(nextLid);
  const priorLessons = DATA.LESSONS.filter((l,i) => i < nextPos);
  // Same rule as guidedSeqFor: this node is in the path, so it holds the same
  // shape as every other step. It used to be three cards then three drills,
  // which put the biggest machinery change in the whole run at a unit boundary,
  // where the point is to mix topics and not to mix formats.
  const M = {fills:'FILLS', parsons:'PARSONS'};
  let drillPool = [];
  priorLessons.forEach(l => {
    (LESSON_DRILLS[l.id] || []).forEach(st => { if(M[st[0]] && DATA[M[st[0]]] && DATA[M[st[0]]][st[1]]) drillPool.push(st); });
  });
  const pick = (pool,n) => { const out=[]; while(pool.length && out.length<n){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); } return out; };
  // Round-robin by type so no two review items in a row are the same type. The
  // old pass only guaranteed the FIRST few were distinct, which is fine while
  // five types are in the pool and produces runs like parsons,parsons,parsons
  // once it holds two. The topics still mix; that is the part worth keeping.
  const pickDrills = (pool,n) => {
    const buckets={}; pick(pool,pool.length).forEach(st=>{ (buckets[st[0]]=buckets[st[0]]||[]).push(st); });
    const keys=Object.keys(buckets), out=[];
    while(out.length<n && keys.some(k=>buckets[k].length)){
      for(const k of keys){ if(out.length>=n) break; if(buckets[k].length) out.push(buckets[k].shift()); }
    }
    return out; };
  const seq = pickDrills(drillPool,4);
  if(!seq.length){ navigate('lesson', nextLid); return; }
  guided = {lessonId:null, seq, pos:0, review:true, reviewUnit:finishedUnit, nextLid};
  _markNav(1);
  renderGuidedStep();
}

// Stands under every step of a lesson, and under every step of its practice.
// It stays a link and never expands into a block of its own: help that carries
// a novice starts costing that same person once they know it (Kalyuga, Ayres,
// Chandler & Sweller 2003), and an offer taken on demand charges nothing to
// the learner who walks past it.
function guideLinkHTML(lid){
  const g = LESSON_GUIDE[lid];
  if(!g) return '';
  return guideCardHTML(g[0], g[1], 'stage');
}

// The lesson's frame, carrying a practice step. Same header row, same title,
// same skill strip, same unbroken stage bar — only the body between the
// directive and the Back/Next row swaps.
function renderGuidedStep(){
  if(!guided) return;
  const {seq, pos, lessonId, review} = guided;
  const step = seq[pos];
  const lesson = review ? null : DATA.LESSONS.find(l => l.id === lessonId);
  const isLast = pos === seq.length-1;
  let body = '';
  if(step[0]==='cards') body = guidedCardBody(step[1]);
  else if(_HANDOFFS[step[0]]) body = guidedHandoffBody(step[0]);
  else if(step[0]==='fills') body = fillBody(step[1]);
  else if(step[0]==='bugs') body = bugBody(step[1]);
  else if(step[0]==='parsons') body = parsonsBody(step[1]);
  // Say what the NEXT step asks for, so an advance is never a surprise.
  const nextLabel = isLast
    ? (review ? fwdLabel("закончить обзор") : fwdLabel("следующий урок"))
    : fwdLabel(STEP_ASK[(seq[pos+1]||[])[0]] || "продолжать идти");
  const backNav = pos > 0
    ? `<button class="btn btn-ghost btn-sm" onclick="guidedPrev()">← Назад</button>`
    : (review
      ? `<button class="btn btn-ghost btn-sm" onclick="guidedSkipAll()">Пропустить проверку</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lessonId},5)">← Урок</button>`);
  // The mixed-review bar is the same component the lesson uses, in the same
  // slot — it just has no single lesson behind it, and says so.
  const bar = review
    ? `<div class="v2-stage-bar">${seq.map((st,i)=>
        `<div class="v2-stage-dot is-practice${i<pos?' done':i===pos?' active':''}" title="${STEP_DOT_LABEL[st[0]]||'Practice'}"></div>`).join('')
      }<span class="v2-stage-label">${STEP_DOT_LABEL[step[0]]||'Practice'} · ${pos+1} of ${seq.length}</span></div>
      <p class="retrieval-note">Взято из предыдущих уроков. Смешанный обзор кажется сложнее, чем новая практика, и именно здесь он прилипает.</p>`
    : unifiedStageBar(lesson, STAGE_LABELS.length, pos);
  // Review mixes several lessons, so it has no single guide and shows none.
  document.getElementById('main').innerHTML =
    lessonFrameHTML(lesson, lesson ? state.doneLessons.includes(lesson.id) : false, bar)
    + directiveHTML(guidedDirective(step))
    + body
    + (review ? '' : guideLinkHTML(lessonId))
    + `<div class="row" style="justify-content:space-between;gap:10px;margin-top:20px">
        ${backNav}
        <button class="btn btn-primary" onclick="guidedNext()">${nextLabel}</button>
      </div>`;
  if(step[0]==='parsons') initParsons(step[1]);
  if(window.lucide) lucide.createIcons();
  window.scrollTo(0,0);
}

// The ask for a practice step, in the lesson's directive bar. Reads the drill's
// own prompt so there is one sentence, not the drill's heading plus its prompt
// plus a mechanic line.
function guidedDirective(step){
  const [kind, i] = step;
  if(_HANDOFFS[kind]) return _HANDOFFS[kind].copy;
  if(kind === 'fills')   return (DATA.FILLS[i]   || {}).q;
  if(kind === 'bugs')    return (DATA.BUGS[i]    || {}).prompt;
  if(kind === 'parsons') return (DATA.PARSONS[i] || {}).prompt;
  if(kind === 'cards')   return "Произнесите это вслух по памяти, а затем проверьте себя.";
  return '';
}

// ─── HAND-OFF STEPS ─────────────────────────────────────────────────────────
// Two of them: the Workspace and the DAX Lab. Each ends in something you went
// and looked at, so the path hands off, records exactly where it was, shows a
// crumb on the target view, and picks up from the same position when you press
// it. navigate() clears `guided` on purpose — a normal navigation IS leaving
// the path — so the return pointer is kept separately and survives exactly one
// hop, to its own target view and nowhere else.
function guidedHandoffBody(key){
  const h = _HANDOFFS[key];
  return `<div class="v2-stage-card">
    <h3><i data-lucide="compass"></i> ${h.title}</h3>
    <p style="margin:0 0 12px;color:var(--muted)">${h.copy}</p>
    <button class="btn btn-primary" onclick="openGuidedHandoff('${key}')">${h.btn}</button>
  </div>`;
}
function openGuidedHandoff(key){
  const h = _HANDOFFS[key];
  if(!h) return;
  if(guided) _handoffReturn = {lessonId: guided.lessonId, pos: guided.pos, key: key, view: h.view};
  navigate(h.view);
}
function resumeGuidedFromHandoff(){
  const r = _handoffReturn; _handoffReturn = null;
  if(!r || r.lessonId == null) return navigate('lessons');
  guided = {lessonId: r.lessonId, seq: guidedSeqFor(r.lessonId), pos: r.pos};
  _markNav(1);
  guidedNext();   // the hand-off step is the thing that was just done
}
// The crumb that rides on top of the Workspace or the DAX Lab while a return
// context is live. Rendered from navigate(), so it survives coming back to the
// view a second time rather than only appearing on the first hop.
function pathCrumbHTML(){
  if(!_handoffReturn) return '';
  const l = DATA.LESSONS.find(x => x.id === _handoffReturn.lessonId);
  return `<div class="card card-sm" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--accent);margin-bottom:14px">
    <span class="text-sm">Ориентированный путь · ${l ? 'Lesson: ' + l.title : 'lesson'} · тогда посмотри</span>
    <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="resumeGuidedFromHandoff()">Продолжить путь →</button>
  </div>`;
}

// "Recall — no peeking" flashcard step: term shown, learner recalls out loud,
// then flips to check (retrieval practice, not re-reading).
function guidedCardBody(i){
  const [term, def] = DATA.CARDS[i];
  state.cardsReviewed = state.cardsReviewed || [];
  if(!state.cardsReviewed.includes(i)){ state.cardsReviewed.push(i); saveState(); }
  return `<div class="card" style="text-align:center;padding:28px">
    <span class="badge badge-unit" style="margin-bottom:12px;display:inline-block">Напомним — не подглядывать</span>

    <p class="text-muted text-sm" style="margin-bottom:14px">Скажите вслух, что он делает (и одну распространенную ловушку), а затем проверьте себя.</p>
    <div id="gcBack" style="display:none;text-align:left;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.6">${def}</div>
    <button id="gcFlip" class="btn btn-ghost btn-sm" onclick="document.getElementById('gcBack').style.display='block';this.style.display='none'">Проверьте себя →</button>
  </div>`;
}

// The unit-boundary moment: name the skill that just went ready, then keep
// going. The kit never said what finishing a unit bought you.
function finishUnitBoundary(unit, nextLid){
  state.unitEndSeen = state.unitEndSeen || [];
  const sk = skillState(unit);
  if(sk && !state.unitEndSeen.includes(unit)){
    state.unitEndSeen.push(unit); saveState();
    const nxt = DATA.LESSONS.find(l => l.id === nextLid);
    const ready = skillsReady();
    guided = null; _handoffReturn = null;
    _markNav(1);
    const _due = reviewsDue();
    document.getElementById('main').innerHTML = `
      <div class="card" style="text-align:center;padding:30px">
        <span class="badge badge-unit" style="margin-bottom:12px;display:inline-block">${unit} · полный</span>
        <h2>Skill ${sk.n} готовый: ${sk.name}</h2>
        <p style="max-width:520px;margin:10px auto 6px">Это <strong>${ready} of ${SKILLS.length}</strong> навыки готовы. Все восемь и ты сможешь ${KIT_TARGET}.</p>
        ${_due.soon ? `<p class="text-sm text-muted" style="margin:4px auto 0">Приходи завтра — ${_due.soon} быстрый обзор${_due.soon>1?'s':''} будет ждать.</p>` : ''}
        <div class="row" style="justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="navigate('lesson',${nextLid})">Следующий: ${nxt?nxt.title:"продолжать идти"} →</button>
          <button class="btn btn-ghost btn-sm" onclick="navigate('lessons')">Все уроки</button>
        </div>
      </div>`;
    if(window.lucide) lucide.createIcons();
    window.scrollTo(0,0);
    return;
  }
  navigate('lesson', nextLid);
}

function guidedNext(){
  if(!guided) return;
  if(guided.pos < guided.seq.length-1){ guided.pos++; renderGuidedStep(); }
  else if(guided.review){ const nl = guided.nextLid, u = guided.reviewUnit; guided = null; celebrate(); finishUnitBoundary(u, nl); }
  else {
    const lid = guided.lessonId; guided = null;
    // The lesson-done reward moment lives here, AFTER the retrieval practice
    // that just ran — not at the quiz, before practice happened.
    celebrate();
    gotoNextLesson(lid);
  }
}
function guidedPrev(){ if(guided && guided.pos > 0){ guided.pos--; renderGuidedStep(); } }
function guidedSkipAll(){
  if(!guided) return;
  const g = guided; guided = null;
  if(g.review) finishUnitBoundary(g.reviewUnit, g.nextLid); else gotoNextLesson(g.lessonId);
}
function gotoNextLesson(lid){
  guided = null; _handoffReturn = null;
  const _nxt=nextLessonId(lid);
  if(_nxt===null){ navigate('home'); showToast("Вы прошли все уроки Power BI!"); return; }
  const cur = DATA.LESSONS.find(l => l.id === lid), nxt = DATA.LESSONS.find(l => l.id === _nxt);
  state.unitReviewsDone = state.unitReviewsDone || [];
  if(cur && nxt && cur.unit !== nxt.unit){
    // Unit boundary → one skippable mixed-review node (once per unit), whose
    // finish flows into the skill-ready card.
    if(!state.unitReviewsDone.includes(cur.unit)){
      state.unitReviewsDone.push(cur.unit); saveState();
      startUnitReview(cur.unit, _nxt);
      return;
    }
    // Review already done — still name the skill that just went ready, once.
    if(!(state.unitEndSeen||[]).includes(cur.unit)){ finishUnitBoundary(cur.unit, _nxt); return; }
  }
  navigate('lesson', _nxt);
}

// Bug Hunt — tap the correct fix (no free typing).

// Answered-drill state: a done drill shows its answer highlighted and stays

function _bugAdvance(idx){

function parsonsBody(idx){

function renderParsons(idx){

    </div>
    ${parsonsBody(idx)}`;
  initParsons(idx);

// Wrong-attempt count per drill index, for the progressive scaffold.
let _parsonsAttempts = {};
function initParsons(idx){
  const item = DATA.PARSONS[idx];
  const mount = document.getElementById('ord-mount-p'+idx);
  if(!item || !mount) return;
  const order = [...item.lines.keys()];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  mount.innerHTML = Ord.html('p'+idx, item.lines.map(_escHTML), order);
  // Progressive scaffolding: after two misses the first piece is placed for you,
  // after three the first two. A drill scaffolds; a lesson does not.
  const a = _parsonsAttempts[idx] || 0;
  if(a >= 2) Ord.scaffold('p'+idx, item.lines, item.answer, Math.min(a-1, item.lines.length-1));
  Ord.sync('p'+idx);
}
function resetParsons(idx){
  Ord.clear('p'+idx);
  const r = document.getElementById('parsons-result'); if(r) r.innerHTML='';
}
function checkParsons(idx){
  const p = DATA.PARSONS[idx];
  const placed = Ord.placed('p'+idx);
  const el = document.getElementById('parsons-result');
  if(placed.length !== p.answer.length){
    if(el) el.innerHTML = `<div class="text-sm" style="color:var(--warn)">Переместить все ${p.answer.length} части к вашему ответу в первую очередь.</div>`;
    return;
  }
  const correct = p.answer.every((v,i) => v === placed[i]);
  if(correct){
    if(el) el.innerHTML = `<span style="color:var(--green);font-weight:600">✓ Правильно</span> <span class="text-sm text-muted">— это правильный порядок.</span>`;
    delete _parsonsAttempts[idx];
    celebrate();
    markDone('doneParsons', p.id);
    // Check and Clear are moot once it is solved, so the row swaps in place.
    const actions = document.getElementById('parsActions-'+idx);
    if(actions) actions.innerHTML = _inGuided() ? '' :
      (idx+1 < DATA.PARSONS.length
        ? `<button class="btn btn-primary btn-sm" onclick="navigate('parsons',${idx+1})">${fwdLabel(STEP_ASK.parsons)}</button>`
        : `<button class="btn btn-primary btn-sm" onclick="navigate('practice')">Все готово →</button>`);
  } else {
    _parsonsAttempts[idx] = (_parsonsAttempts[idx]||0) + 1;
    recordMiss(_drillLesson(), p.prompt);
    // The pieces STAY where the learner put them.
    if(el) el.innerHTML = `<span style="color:var(--red);font-weight:600">✗ Не совсем — попробуйте изменить порядок частей.</span>`;
    _ladderBump();
  }
}

// ─── FLASHCARDS ────────────────────────────────────────────────────────────
let cardIdx = 0, cardFlipped = false;
function renderCards(){ cardIdx = 0; cardFlipped = false; renderCardAt(0); }
function renderCardAt(i){
  const total = DATA.CARDS.length;
  const [term, def] = DATA.CARDS[i];
  document.getElementById('main').innerHTML = `
    <h1>Flashcards</h1>
    <p class="text-sm text-muted">${i+1} of ${total} — нажмите на карту, чтобы перевернуть</p>

        <div class="flashcard-face flashcard-front"${cardFlipped?' aria-hidden="true"':''}><div class="flashcard-def">${def}</div></div>

    <p class="fc-hint">Прочтите определение, вспомните термин, затем нажмите, чтобы проверить · ← → клавиши со стрелками для навигации</p>
    <div class="flashcard-nav">
      <button class="btn btn-ghost btn-sm" onclick="prevCard()">← Предыдущий</button>

function flipCard(){
  cardFlipped = !cardFlipped;
  const inner = document.getElementById('fc-inner');
  inner.classList.toggle('flipped', cardFlipped);
  // A screen reader was reading the answer alongside the prompt, because both

/* -- ONE HELP LADDER ACROSS THE KIT --------------------------------------
   The old hint control had two rungs: the drill's hint, then the whole answer.
   Nothing, then everything. It now releases the answer in graded steps — the
   hint, then half of it, then three quarters, then all of it — and it NEVER
   completes the action for you. Even on the last rung the choices stay live and
   you still have to find and press the right one, because the pick is the rep.

   A miss climbs one rung on its own, so help arrives at the moment it is
   needed; the button climbs it on demand. One ladder runs Fill in the Blank,
   Bug Hunt and the Put in Order drill. */
function _escHTML(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var _hd={hint:'',ans:'',state:0,kind:'',idx:0};
var LADDER=[
  {label:"Показать подсказку"},
  {label:"Показать половину ответа"},
  {label:"Показать три четверти"},
  {label:"Показать весь ответ"}
];
function _ladderShellHTML(){
  return '<button class="hint-cycle-btn" id="hint-cycle-btn" onclick="cycleHint()"><i data-lucide="lightbulb" style="width:13px;height:13px;vertical-align:-2px"></i> '+LADDER[0].label+'</button>'
    +'<div class="hint-panel" id="drill-hint"></div>'
    +'<div class="answer-panel" id="drill-answer"></div>';
}
// A wrong answer climbs the ladder one rung, unprompted.
function _ladderBump(){ if(_hd.state < LADDER.length) cycleHint(); }
// The answer with only the first `frac` of it revealed. The rest is dotted out
// character for character, so the shape and the length are both still readable.
function _ladderPartial(ans, frac){
  var str=String(ans||'');
  if(str.length<2) return _escHTML(str);
  var n=Math.min(str.length-1, Math.max(1, Math.round(str.length*frac)));
  return _escHTML(str.slice(0,n))+'<span class="lp-gap">'+str.slice(n).replace(/[^\s]/g,'\u00b7')+'</span>';
}
function cycleHint(){
  if(_hd.state >= LADDER.length) return;
  _hd.state++;
  var rung=_hd.state;                    // 1..4
  var hp=document.getElementById('drill-hint');
  var ap=document.getElementById('drill-answer');
  var btn=document.getElementById('hint-cycle-btn');
  if(rung===1){
    if(hp){ hp.textContent='\u{1F4A1} '+(_hd.hint||"Прочитайте строку слева направо и скажите, для чего предназначена каждая часть."); hp.classList.add('show'); }
  } else if(rung===2 || rung===3){
    if(ap){
      ap.innerHTML='<pre class="ladder-partial">'+_ladderPartial(_hd.ans, rung===2?0.5:0.75)+'</pre>'
        +'<div class="ladder-step">'+(rung===2?"Половина этого.":"Три четверти этого.")+" Разберитесь с остальным, прежде чем смотреть дальше.</div>";
      ap.classList.add('show');
    }
  } else {
    var esc=_escHTML(_hd.ans);
    var match=findGlossaryTerm(_hd.ans+'');
    var matchTerm=match?(match.term!==undefined?match.term:match[0]):null;
    var learnHtml=matchTerm?'<button class="learn-more-link" onclick="openGlossaryFor(\''+matchTerm.replace(/'/g,"\\'")+'\')">&#x1F4D6; '+matchTerm+'</button>':'';
    if(ap){
      ap.innerHTML='<pre class="answer-code">'+esc+'</pre>'
        +"<div class=\"ladder-step\">Отображается, а не нажимается — найдите его выше и коснитесь сами. Это представитель.</div>"
        +(learnHtml?'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">'+learnHtml+'</div>':'');
      ap.classList.add('show');
    }
  }
  if(btn){
    var nxt=LADDER[rung] ? LADDER[rung].label : '';
    if(nxt) btn.innerHTML='<i data-lucide="lightbulb" style="width:13px;height:13px;vertical-align:-2px"></i> '+nxt;
    else btn.style.display='none';
  }
  if(window.lucide) lucide.createIcons();
}
function findGlossaryTerm(ansText){
  if(typeof DATA==='undefined'||!DATA.GLOSSARY)return null;
  var lower=(ansText+'').toLowerCase();
  return DATA.GLOSSARY.find(function(e){var t=(e.term!==undefined?e.term:e[0]).toLowerCase();return t.length>2&&lower.indexOf(t)!==-1;});
}
function openGlossaryFor(term){

(function(){
