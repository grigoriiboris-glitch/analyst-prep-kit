   notes:"Уровень детализации — это просто то, что обозначает одна строка — один заказ или одна строка в заказе, так же, как в квитанции есть одна общая сумма, но много строк позиций. В модели этот вопрос имеет двойное значение. Во-первых, обычная опасность: неуникальный ключ разлетается по связям и завышает показатели. Во-вторых, правило моделирования: сторона «один» в отношениях «один ко многим» ДОЛЖНА быть уникальной — в противном случае Power BI либо отказывается от связи, либо принудительно устанавливает связь «многие ко многим», что изменяет поведение фильтра таким образом, что незаметно искажает каждую меру. Тест COUNTROWS = DISTINCTCOUNT — ваше доказательство зернистости. Когда примирение возвращается в результате чистых отношений, первым подозреваемым являются разветвленные отношения.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Проверить</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">ценить</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">читать</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Количество строк</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">96,420</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">каждая строка в Заказах</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Отличительный идентификатор заказа</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">уникальные заказы</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Уровень детализации ОК</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">FALSE</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">строки ≠ различные — ID заказа повторяется, зернистость — это линия</td></tr></tbody></table></div>", caption:"Количество строк ровно в два раза превышает количество отдельных заказов, поэтому ID заказа не уникален — зернистостью является строка заказа. Построение отношения «один ко многим» на ID заказа привело бы к разветвлению и удвоению каждой меры, пересекающей отношения."},
   quiz:{q:"[Количество строк] — 96 420, но DISTINCTCOUNT ключа — 48 210. Что это значит?", opts:["Ключ повторяется — уровень детализации мельче, чем одно на заказ.","В таблице почему-то полностью отсутствует половина строк.","DISTINCTCOUNT дважды посчитал пустые значения","Отношения уже один к одному"], ans:0, exp:"Больше строк, чем отдельных ключей, означает, что ключ появляется несколько раз — здесь ровно два раза, поэтому зернистостью является строка порядка, а не порядок. Сторона связи «один» должна быть уникальной, поэтому ID заказа не может привязывать один ко многим без разветвления."},
   parsons:{prompt:"Организуйте проверку зерна, а затем ответную реакцию в случае неудачи.",lines:["Количество строк = COUNTROWS (заказы)","Различные ключи = DISTINCTCOUNT(Заказы[OrderID])","Уровень детализации ОК = [Количество строк] = [Отдельные ключи]","Если ЛОЖЬ: дедупликация или использование истинного уникального ключа."],answer:[0,1,2,3]},
   explain:{is:"Если количество строк таблицы равно количеству уникальных ключей ее ключа, каждый ключ появляется ровно один раз, и таблица находится в безопасности на «единой» стороне отношения.",
     use:"Вы доказываете это, прежде чем устанавливать какие-либо отношения. Повторяющийся ключ не приводит к ошибке — он бесшумно разворачивает строки и увеличивает каждое число, которое его пересекает, а это самый трудный класс ошибок, которые можно найти позже.",
     like:"Проверяем, чтобы на каждом месте в самолете было указано одно имя. Два человека, занимающие одно и то же место, не попадают в ворота; его ловят на высоте тридцати тысяч футов, и к этому моменту это становится проблемой для всех."},
   build:{q:"Каким свойством Power BI должна обладать «одна» сторона связи «один ко многим»?",opts:["Числовой тип данных","Ключ, значения которого никогда не повторяются","Не менее 1000 строк","Алфавитный порядок сортировки"],ans:1,exp:"Сторона «одна» должна быть уникальной, иначе связь не может быть «один ко многим» — Power BI отказывается от нее или принудительно устанавливает связь «многие ко многим», что меняет поведение фильтра и незаметно искажает показатели. Доказательство уникальности — это то, для чего нужен тест COUNTROWS = DISTINCTCOUNT."},
   close:"Вы можете доказать ключ, прежде чем доверять ему отношения. Далее: распределения — где среднее начинает врать.",
   unlock:"Если сверка отклонена на чистое кратное число — ровно 2×, ровно 3× — прекратите поиск недостающих строк. Этот отпечаток представляет собой разветвленную связь: каждому родителю соответствует N детей. Проверка зерна на ключе соединения находит его менее чем за минуту."
  },
{id:803, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Распределение и выбросы", sub:"СРЕДНЕЕ значение основано на искаженных данных — рядом с ним поместите МЕДИАНУ и разброс.",
   story:"На карточке указана СРЕДНЯЯ стоимость заказа, и заинтересованная сторона привязана к ней. Но один корпоративный заказ на сумму 9 980 долларов значительно превышает среднюю сумму, которую тратит обычный клиент — среднее значение скрывает форму. Поместите показатель МЕДИАНА рядом со СРЕДНИМ, добавьте STDEV.P для разброса, и разрыв между средним и медианным мгновенно скажет вам, искажены ли данные и имеет ли вообще значение «среднее».",
   ral:{code:"Средний заказ = AVERAGE(Заказы[Сумма])\nМедианный заказ = МЕДИАНА(Заказы[Сумма])\nСпред (SD) = STDEV.P(Заказы[Сумма])\nФлаг отклонения = IF([Средний порядок] > 1,2 * [Медианный порядок], «сдвиг вправо», «~симметричный»)", say:"Покажите среднее значение и медиану рядом со стандартным отклонением разброса и отметьте столбец как перекошенный вправо, когда среднее значение находится значительно выше медианы.",
     lines:[["Средний заказ = AVERAGE(Заказы[Сумма])","взять среднее значение суммы — сумма по подсчету"],["Медианный заказ = МЕДИАНА(Заказы[Сумма])","МЕДИАНА (берём середину) — половина ордеров находится выше неё, половина ниже."],["Spread (SD) = STDEV.P(Orders[Amount])","STDEV.P (измерить спред) — насколько суммы разбросаны вокруг среднего значения"],["IF([Mean Order] > 1.2 * [Median Order], …)","отмечайте «перекос вправо», когда среднее значение превышает медиану более чем на 20 процентов — простое и оправданное эмпирическое правило"]]},
   notes:"В DAX встроены значения MEDIAN, AVERAGE и STDEV.P, поэтому одинокому среднему показателю с искажением нет оправдания. Когда среднее значение и медиана расходятся, медиана является более честной «типичной» — она не подвержена крайностям. Визуальный элемент гистограммы (или панель распределения Power Query) отображает фигуру напрямую; длинный правый хвост – это то, что тянет среднее вверх. Выбросы — это вопрос, а не приговор: корпоративный кит реален, и его стоит сохранить, но сегментируйте его, чтобы он не искажал повседневное представление, которое подразумевает карта.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Бин</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Считать</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">140</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$40</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">170</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$80</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">95</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$120</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">44</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$160</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">20</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$200+</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">9</td></tr></tbody></table></div>", caption:"Распределение стоимости заказа (с перекосом вправо)"},
   quiz:{q:"Показатель показывает, что СРЕДНЯЯ стоимость заказа значительно превышает МЕДИАННУЮ стоимость заказа. Что это означает?", opts:["Правильный перекос из-за нескольких крупных заказов","Идеально симметричный разброс","Ошибка в показателе STDEV.P.","Никаких отклонений в данных"], ans:0, exp:"Среднее положение выше медианы является признаком перекоса вправо: несколько крупных ордеров поднимают среднее значение вверх, в то время как медиана — истинная средняя точка — остается рядом с местом падения большинства ордеров. Покажите медиану рядом со средним значением, чтобы карта не ввела в заблуждение."},
   parsons:{prompt:"Расположите честно-средний комплект: дважды по центру, разворот, затем перекошенный флажок.",lines:["Средний заказ = AVERAGE(Заказы[Сумма])","Медианный заказ = МЕДИАНА(Заказы[Сумма])","Spread (SD) = STDEV.P(Orders[Amount])","Флаг отклонения = IF([Средний порядок] > 1,2 * [Медианный порядок], «сдвиг вправо», «~симметричный»)"],answer:[0,1,2,3]},
   explain:{is:"Среднее значение подрывается крайностями; медиана является средней записью и игнорирует их. Показ обоих плюс спред подскажет вам, какому из них верить.",
     use:"Когда среднее значение значительно превышает медиану, несколько очень крупных записей тянут его вверх, поэтому утверждение «типичный заказ составляет 86 фунтов» — это утверждение, которое вы не можете защитить. Держите и то, и другое в отчете, и пусть сравнение сделает свою работу.",
     like:"Десять человек в пабе, и один из них миллиардер. На бумаге там все чрезвычайно богаты, и ни один из них не может купить ни одного раунда."},
   build:{q:"Средняя стоимость заказа — 86 долларов США, медиана — 52 доллара США. Какая цифра стоит в заголовке и почему?",opts:["Среднее значение — оно использует каждую точку данных","Медиана — она сопротивляется крайностям","Оба одинаково репрезентативны","Ни то, ни другое — используйте максимум"],ans:1,exp:"Среднее значение намного выше медианного означает, что несколько китов затягивают его — типичный клиент тратит около 52 долларов, а не 86 долларов. Медиана сопротивляется крайностям. Держите среднее значение видимым для финансовой точки зрения, но «типичное» утверждение принадлежит медиане."},
   close:"Вы можете определить, когда среднее значение лжет, и показать рядом с ним честную цифру. Далее: Парето — поиск немногих жизненно важных.",
   unlock:"Выбросы — это вопрос, а не приговор: корпоративный заказ на сумму 9 980 долларов — это реальный доход, а не ошибка, которую нужно удалить. Плюсом является сегментация: сообщайте «типичный заказ (исключая предприятие)» и «предприятие» отдельно, чтобы ни одно из представлений не искажало другое."
  },
{id:804, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Парето / ABC-анализ", sub:"Показатель текущей доли, который ранжирует немногих жизненно важных.",
   story:"Около 80% дохода обычно приходится на 20% продукции. Анализ Парето (ABC) превращает длинный список в короткий, над которым стоит действовать. В DAX вы строите показатель совокупной доли: для каждого продукта суммируйте доход каждого продукта, имеющего рейтинг выше него или выше, а затем делите его на общую сумму. Поместите его на диаграмму, отсортированную по доходам, и совокупная линия покажет, как мало продуктов достигают большей части продаж.",
   ral:{code:"Совокупный доход =\nVAR cur = [Revenue]\nRETURN\n    SUM(\n        FILTER(ALLSELECTED(Product[Name]), [Revenue] >= cur),\n        [Revenue]\n    )\n\nСовокупный % =\nDIVIDE([Совокупный доход], CALCULATE([Revenue], ALLSELECTED(Product[Name])))", say:"Для каждого продукта просуммируйте доход от каждого продукта, который имеет как минимум такой же высокий рейтинг, а затем разделите его на общую сумму по всем выбранным продуктам — текущую долю, которая составляет диаграмму Парето.",
     lines:[["VAR cur = [Revenue]","сохранить доход от этого продукта до изменения фильтра"],["FILTER(ALLSELECTED(Product[Name]), [Revenue] >= cur)","ALLSELECTED (расширить до каждого продукта, выбранного пользователем), затем оставьте те, у которых доход не ниже этого — продукты, имеющие рейтинг на уровне или выше него."],["SUMX(…, [Revenue])","пройдите этот ранжированный набор и добавьте свой доход — совокупный итог вниз по рейтингу"],["DIVIDE([Cumulative Revenue], CALCULATE([Revenue], ALLSELECTED(…)))","разделить на общую сумму по всем выбранным продуктам — текущую долю, которая рисует кривую Парето."]]},
   notes:"Вы не можете оценить одного бегуна, не видя всего забега, а показатель, расположенный в строке продукта, обычно видит только этот продукт. Это канонический шаблон DAX с промежуточным итогом по рейтингу, и ALLSELECTED является ключевым: он удаляет фильтр текущего продукта (чтобы показатель мог видеть все другие продукты, по которым можно ранжироваться), сохраняя при этом все срезы, установленные пользователем. Выигрыш — это сосредоточенность — действуйте на пунктах А, приносящих большую часть стоимости, управляйте длинным хвостом С в порядке исключения. Отсортируйте изображение по убыванию дохода и добавьте строку «Совокупный %»; если вместо этого эта линия поднимается по прямой диагонали Если рано сдаться, ни одна маленькая группа не доминирует, и Парето не является подходящей линзой.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">категория</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Revenue ($K)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Совокупный %</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">A</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">600</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">50%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">B</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">290</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">74%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">C</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">130</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">85%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">D</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">95</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">93%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">E</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">55</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">98%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">F</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">30</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td></tr></tbody></table></div>", caption:"Доход по продуктам с совокупным %"},
   quiz:{q:"В совокупном показателе ALLSELECTED(Продукт[имя]) используется так, что:", opts:["При ранжировании игнорируется собственный фильтр продуктов строки.","Срезы навсегда удаляются из отчета.","Возвращается только один товар","Показатель пересчитывается быстрее"], ans:0, exp:"Чтобы оценить, насколько велик один кусок, вам нужно увидеть всю диаграмму — и чтобы ранжировать продукт по сравнению с другими, мера должна выходить за рамки одного продукта в контексте текущей строки. ALLSELECTED поднимает собственный фильтр этой строки — предоставляя все продукты для сравнения — при этом учитываются все срезы, примененные пользователем, а это именно то, что нужно для кумулятивного ранжирования."},
   parsons:{prompt:"Определите показатель совокупного дохода: возьмите этот продукт, затем просуммируйте всех, кто находится на его уровне или выше.",lines:["Совокупный доход =","VAR cur = [Revenue]","RETURN SUMX(","FILTER(ALLSELECTED(Продукт[имя]), [Выручка] >= Дядя),","[Доход])"],answer:[0,1,2,3,4]},
   explain:{is:"Парето сначала ранжирует самые крупные элементы и отслеживает текущую долю целого, так что вы можете увидеть, как немногие из них несут большую часть этого.",
     use:"Именно так вы решаете, на что обратить внимание — какие продукты, клиенты или коды ошибок заслуживают внимания. Если линия поднимается по прямой диагонали, а не изгибается раньше, ничто не доминирует, и это само по себе является открытием.",
     like:"Ваш гардероб. Четыре-пять вещей носятся постоянно, а остальные висят там круглый год, и зная, что есть, единственный способ упаковать небольшой чемодан."},
   build:{q:"На диаграмме Парето кумулятивная линия % поднимается по почти прямой диагонали, а не изгибается раньше времени. Что читать?",opts:["Мера нарушена","Ни одна маленькая группа не доминирует над ценностью","Отсутствует верхний продукт","Данные необходимо пересортировать"],ans:1,exp:"Ранний поворот — это сигнал Парето — несколько предметов захватывают большую часть стоимости. Прямая диагональ означает, что каждый элемент вносит примерно равный вклад, поэтому принцип «сосредоточиться на немногих жизненно важных» не применим; это само по себе открытие, а не провал."},
   close:"Вы можете ранжировать немногих жизненно важных и доказать, какую долю от общего числа они несут. Далее: корреляция — и заявления, которые вы никогда не должны делать на ее основе.",
   unlock:"ABC-анализ имеет место и на другом конце: C-хвосте. Сотня продуктов, приносящих 5 % дохода, каждый из которых стоит реального каталога, запасов и накладных расходов на поддержку. «Управляйте по исключению или выведите из эксплуатации» — это рекомендация, которую совокупная линия предоставляет вам бесплатно."
  },
{id:805, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Корреляция ≠ Причинно-следственная связь", sub:"В DAX нет CORR — используйте разброс + линию тренда и никогда не преувеличивайте.",
   story:"Кто-то спрашивает, что приносит доход. Корреляция — это первый инструмент, но вот честный факт о DAX, о котором стоит узнать в интервью: встроенной функции CORR() не существует. Ежедневное движение представляет собой разбросанный визуальный элемент с линией тренда на панели «Аналитика», которая с первого взгляда показывает направление и напряженность. Коэффициент Пирсона можно построить вручную в качестве меры, но это продвинутая модель — и в любом случае корреляция никогда не является причинно-следственной связью.",
   ral:{code:"// DAX не отправляет CORR(). Ежедневное чтение:\n// Визуализация разброса: X = SUM(Расходы), Y = SUM(Доход), детали = Неделя\n// Панель аналитики ▸ Линия тренда (направление + степень соответствия)\n//\n// Для числа Пирсон r является мерой, созданной вручную\n// (ковариация ÷ произведение двух стандартных отклонений) —\n// расширенный шаблон; всегда читайте его рядом с разбросом.", say:"Постройте разброс расходов и доходов по неделям и добавьте линию тренда, чтобы увидеть взаимосвязь, а для коэффициента знайте, что существует закономерность Пирсона, но никогда не сообщайте об этом, не обращая внимания на разброс, и никогда не называйте причинно-следственную связь.",
     lines:[["Разброс + линия тренда на панели аналитики","Краткий обзор направления и плотности — повседневная корреляция, читаемая в Power BI"],["нет встроенного CORR()","R Пирсона — это измеряемый вручную показатель (ковариация ÷ SD·SD) — впечатляющий момент для интервью."],["прочитай число рядом с разбросом","один выброс может подделать коэффициент — график защищает от этого"],["Корреляция ≠ Причинно-следственная связь","скрытая третья переменная может управлять обоими — первое, что следует заподозрить"]]},
   notes:"То, что в DAX нет CORR(), действительно полезно знать — как и NPV, это мера, которую вы конструируете, а не вызываете, и это сигнализирует о том, что вы действительно работаете с инструментом. Для повседневного анализа линии разброса и тренда достаточно, чтобы ранжировать потенциальных водителей. Предостережение является самым важным в аналитике: назовите три ловушки: путаница (третья переменная управляет обеими), обратная причинно-следственная связь и совпадение. Сильный тренд требует контролируемого теста, а не причинно-следственной связи, а разброс рядом с числом защищает от единственного выброса, создающего связь, которой нет.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Расходы на маркетинг (тысяч долларов)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Revenue ($K)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">10</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">54</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">14</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">60</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">18</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">69</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">22</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">73</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">25</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">85</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">30</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">93</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">34</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">104</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">39</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">116</td></tr></tbody></table></div>", caption:"Линия тренда резко поднимается вверх (р ≈ 0,98). Но в напряженные недели расходы и доходы могут вырасти — разброс позволяет провести контролируемый тест, а не утверждение «тратьте больше, зарабатывайте больше»."},
   quiz:{q:"В DAX нет CORR(). Чтобы быстро понять, как связаны две меры, повседневный шаг заключается в следующем:", opts:["Используйте визуальный разброс с линией тренда.","Доверяйте номеру одной карты KPI","Отсортировать один из столбцов по убыванию","Сложите две меры вместе"], ans:0, exp:"При отсутствии встроенной функции корреляции практическое значение представляет собой точечную диаграмму (расходы по одной оси, доходы по другой) плюс линию тренда на панели «Аналитика» — она сразу показывает направление и плотность. Существует созданная вручную мера Пирсона, но ее всегда следует читать рядом с этим разбросом."},
   parsons:{prompt:"Организуйте корреляционное чтение, от построения наглядности до дисциплины в конце.",lines:["Постройте разброс: X = SUM(Расходы), Y = SUM(Доход), детали = Неделя.","Панель «Аналитика» ▸ добавьте линию тренда.","Чтение направления и плотности — внимание к выбросам","Подозревайте, что кто-то вмешивается, прежде чем делать какие-либо причинно-следственные претензии."],answer:[0,1,2,3]},
   explain:{is:"Две вещи, движущиеся вместе, — это отношения. Это не является доказательством того, что один из них является причиной другого.",
     use:"Power BI дает вам разброс и линию тренда; это не помешает вам преувеличивать. Плотное соответствие требует контролируемого теста, а не предложения, начинающегося с «расходовать больше средств». Всегда смотрите на картинку, ведь за одну крайнюю неделю можно изготовить выкройку, которой нет.",
     like:"Продажи мороженого и число случаев утопления растут вместе каждое лето. Ни один другому ничего не делает — на улице просто жарко."},
   build:{q:"Линия тренда показывает, что расходы и доходы растут вместе (р ≈ 0,98). Что это дает?",opts:["Утверждение: «Большие расходы приводят к большему доходу»","Контролируемый тест — третья переменная может управлять обоими","Немедленное увеличение бюджета","Ничего — корреляция бессмысленна"],ans:1,exp:"Сильная корреляция требует эксперимента, а не причинно-следственной связи. Напряженный сезон может привести к одновременному увеличению расходов и доходов (смешение), а целевые показатели доходов могут привести к увеличению расходов (обратная причинно-следственная связь). Эта тенденция является реальным свидетельством того, что отношения заслуживают проверки, а не проверенного рычага."},
   close:"Вы можете честно прочитать взаимосвязь — разброс, линию тренда и три названные ловушки. Далее: финальная дисциплина, сверка перед публикацией.",
   unlock:"«DAX не имеет CORR()» — это своего рода знания конкретного инструмента, которые можно услышать на собеседованиях. Это показывает, что вы действительно достигли этого. То же самое происходит и с называнием ловушек без подсказки: путаница, обратная причинно-следственная связь, совпадение. По одному предложению на каждое, и вы говорите как человек, которого как следует обожгли."
  },
{id:806, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Проверка здравомыслия и согласование", sub:"Прежде чем публиковать отчет, привяжите свою меру к надежному элементу управления.",
   story:"Последний шаг перед публикацией отчета — это тот, который младшие специалисты пропускают: имеет ли число смысл и связано ли оно с чем-то, кому уже доверяют? Создайте сверку: поместите показатель вашей модели рядом с контрольным показателем из отдельной доверенной таблицы, вычтите и отметьте пробел. Ноль означает, что вы проиграли. Все остальное означает «остановись и найди это», потому что заинтересованная сторона сделает это в тот момент, когда панель управления будет опубликована.",
   ral:{code:"Computed = [Revenue] // итог вашей модели\nControl = SUM(ControlTotals[Amount]) // доверенная цифра\nОтклонение = [Вычисляемое] – [Контрольное]\nПроверка ничьей = IF(ABS([Дисперсия]) < 1, «✓ ничья», «✕ проверка»)", say:"Поместите показатель вашей модели рядом с надежным контрольным итогом из отдельной таблицы, вычтите дисперсию и отметьте все, что не привязано к нулю, перед публикацией отчета.",
     lines:[["Рассчитано = [Выручка]","число, которое выдает ваша модель"],["Контроль = SUM(ControlTotals[Quantity])","просуммировать независимо доверенные цифры, загруженные как отдельная таблица"],["Отклонение = [Вычисляемое] – [Контрольное]","вычесть контрольное значение из вычисленного: ноль — это цель, а ненулевое отклонение — это флаг, а не оправдание округления."],["Проверка связи = IF(ABS([Дисперсия]) < 1, …)","ABS (опустите знак) — под долларом в любом случае написано ✓ ничьи, все остальное помечается перед отправкой отчета."]]},
   notes:"Если мера совпадает с известным контрольным значением, ей можно доверять; несовпадение означает, что нужно искать ошибку. Загрузите контрольные значения в отдельную таблицу, чтобы сверку можно было показать в отчёте и обновлять вместе с данными. При отклонении проверяйте фильтры, связи таблиц, гранулярность и дубликаты.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">метрика</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Вычисленный</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Контроль</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">дисперсия</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">статус</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Модельный доход</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4,021,880</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4,021,880</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✓ галстуки</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Количество заказов</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">96,420</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">+48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✕ ровно 2× — уровень детализации</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Клиенты</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">31,544</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">31,544</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✓ галстуки</td></tr></tbody></table></div>", caption:"Доходы и клиенты связаны друг с другом; количество ордеров ровно в два раза превышает контрольное значение — чистое кратное, которое сигнализирует о разветвленной взаимосвязи (строки ордеров считаются ордерами). Выверка произошла еще до отправки отчета."},
   quiz:{q:"[Дисперсия] = [Вычисляемое] — [Контроль] возвращает чистое 2× элемента управления. Что нужно проверить в первую очередь?", opts:["Отношения, в которых разбрасывалось уровень детализации","Изменились ли цвета темы отчета","Скрыт ли где-нибудь слайсер от просмотра","Размер шрифта на карте"], ans:0, exp:"Чистая 2-кратная дисперсия — это классический признак проблемы зернистости — обычно это отношение «один ко многим» в более детализированной таблице (например, строках заказов), в которой каждый заказ разделяется на две строки. Это не имеет ничего общего с форматированием; проверьте зернистость и кардинальность каждого отношения, которое пересекает мера."},
   parsons:{prompt:"Организуйте сверку: свой номер, доверенный номер, разрыв, флажок.",lines:["Рассчитано = [Выручка]","Контроль = SUM(ControlTotals[Quantity])","Отклонение = [Вычисляемое] – [Контрольное]","Проверка ничьей = IF(ABS([Дисперсия]) < 1, «✓ ничья», «✕ проверка»)"],answer:[0,1,2,3]},
   explain:{is:"Проверка связи помещает вашу собственную фигуру рядом с доверенной фигурой из независимого источника, вычитает их и отмечает все, что не совпадает.",
     use:"Вы добавляете доверенную фигуру в модель как отдельную таблицу, поэтому проверка повторяется при каждом обновлении и отображается в отчете. Проверка, сделанная один раз в электронной таблице, устаревает на следующий день после ее выполнения.",
     like:"Считайте показания счетчика самостоятельно перед оплатой счета. Если вы сделаете это один раз, это ничего не доказывает насчет следующего квартала — это привычка, если повторять ее, значит, вы это заметите."},
   build:{q:"Зачем загружать контрольные итоги в виде отдельной таблицы в модели, а не сверять их с боковой таблицей?",opts:["Power BI не может открывать электронные таблицы","Проверка повторяется при каждом обновлении","Контрольные суммы слишком велики для Excel","Отдельные таблицы отображаются быстрее"],ans:1,exp:"Проверка боковой таблицы происходит один раз и становится устаревшей. Контрольная таблица в модели делает проверку связи живым показателем — каждое обновление повторно подтверждает число, а разрыв появляется в отчете в тот день, когда это происходит, а не в тот день, когда заинтересованная сторона это замечает."},
   close:"Вы отправляете цифры, которые привязаны к надежному элементу управления — привычке, которая заставляет заинтересованные стороны доверять и следующей информационной панели. Это набор инструментов Инструментарий продвинутого аналитика и весь комплект Power BI в полном комплекте.",
   unlock:"— Это связано? — это последний вопрос перед публикацией и первый вопрос после вызова заинтересованных сторон. Аналитики, которые встраивают сверку в отчет, отвечают с одного взгляда; аналитики, которые не проводят день, пересчитывая цифры под давлением."
  }
],

// cleared lessonStage or misses, so Reset left you mid-lesson with your review
// list intact and read as if nothing had happened. Add a key here and both the
// defaults and Reset pick it up for free.
//
// Note the naming: this kit stores doneLessons / doneFills / doneBugs /
// doneParsons, the other way round from every other kit's lessonsDone /
// fillsDone. A wrong key name here reads undefined and quietly reports zero
// progress instead of throwing, so every lookup goes through the maps below.
const DEFAULT_STATE = {
  doneLessons: [],
  doneFills: [],
  doneBugs: [],
  doneParsons: [],
  cardsReviewed: [],
  unitReviewsDone: [],
  unitEndSeen: [],

const freshState = () => JSON.parse(JSON.stringify(DEFAULT_STATE));

function loadState(){
  try { const s = JSON.parse(localStorage.getItem(SK)); if(s) state = Object.assign(freshState(), s); } catch(e){}
  delete state.flagged;   // declared since day one, read nowhere
  if(typeof state.lessonStage !== 'object' || state.lessonStage === null) state.lessonStage = {};

function markDone(arr, id){

    if(arr === 'doneLessons'){
      const h = new Date().getHours(), dw = new Date().getDay();
      state.badgeMarks = state.badgeMarks || {};

      if(h >= 22) state.badgeMarks.night = true;

// Per-lesson reset: clears just THIS lesson's completion, its recorded misses
// and its saved stage, then reopens it at the start. It used to clear the
// completion only, so "Reset this lesson" left you on the Close card of a
// lesson that no longer counted as done.
function resetLesson(id){
  const i = state.doneLessons.indexOf(id);
  if(i > -1) state.doneLessons.splice(i,1);
  state.lessonStage = state.lessonStage || {};

// ─── KEYBOARD REACH ──────────────────────────────────────────
// The path nodes, home tiles, ordering chips, skill rows, DAX Lab rows,
// workspace hotspots and the flashcard were all divs with an onclick and no
// role or tabindex, so none of them could be reached, focused or pressed from
// a keyboard. They get role=button, tabindex=0, Enter/Space and a focus ring
// from ONE observer, not from fifteen render sites — a fix applied at the
// render site is a fix the next new render site does not get.
//
// This kit renders everything into #main, exactly like the SQL prototype, so
// the observer has one target. Real <button> elements are deliberately NOT in
// the selector: they already handle Enter, and a second handler on top would
// fire the click twice.
//
// The lucide refresher below also observes #main. That is safe because it
// strips data-lucide off its own output, so it never re-triggers itself, and
// this one sets attributes rather than replacing nodes.
const CLICKABLE_DIVS = '.pmap-node,.ord-chip,.skill-row2,.skill-strip,.flag-row,.next-row,.path-tile,.drill-tile,.dax-item,.ws-spot,.flashcard-outer';
function upgradeClickables(root){
  (root || document).querySelectorAll(CLICKABLE_DIVS).forEach(el => {
    if(el.dataset.kbd) return;
    el.dataset.kbd = '1';
    if(!el.getAttribute('role')) el.setAttribute('role','button');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    el.addEventListener('keydown', ev => {
      if(ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
      ev.preventDefault();   // Space would otherwise scroll the page
      el.click();
    });
  });
}
(function(){
  upgradeClickables(document);
  // de-test.mjs has no MutationObserver stub, so guard rather than assume it.
  if(!('MutationObserver' in window)) return;
  const target = document.getElementById('main');
  if(!target) return;
  let queued = false;
  new MutationObserver(() => {
    if(queued) return; queued = true;
    queueMicrotask(() => { queued = false; upgradeClickables(target); });
  }).observe(target, {childList:true, subtree:true});
})();

// ─── SAY IT OUT LOUD ────────────────────────────────────────────────────────
// Each piece's meaning sits directly under the line of code it explains, inside
// the same block. It used to keep the DAX in the dark block and its
// explanations in a list underneath, so reading one meant holding the other in
// your head. Splitting things you have to use together across two places
// measurably costs learning (Chandler & Sweller 1992, British Journal of
// Educational Psychology 62(2):233-246), and the cost is worst where the parts
// interact, which is every argument of a CALCULATE (Sweller & Chandler 1994,
// Cognition and Instruction 12(3):185-233).
//
// Pieces are located by scanning the code text, forward from the last match so
// a repeated token lands on the right one, then from the start because a few
// lessons list their pieces out of order. Anything not literally in the code
// keeps its own row underneath — that is most of Unit 0, whose lines are
// definitions rather than parts of an expression.
//
// One shared renderer. There were three copies: the home demo, the pre-v2
// lesson body and the Worked Example stage, and the home one had drifted into
// advertising a shape the kit no longer had.
//
// This kit's block is `l.ral`, an OBJECT with `.code`, not an array of blocks —
// so the call site is ralBlockHTML(l.ral), never l.ral.map(...).
function ralBlockHTML(r){
  const code = String((r && (r.code ?? r.formula)) || '');
  const codeLines = code.split('\n');
  const perLine = codeLines.map(()=>[]);
  const tail = [];
  let cursor = 0;
  const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, m => '\\' + m);
  ((r && r.lines) || []).forEach(pair => {
    const chunk = String(pair[0] ?? ''), desc = pair[1];
    let at = chunk.trim() ? code.indexOf(chunk, cursor) : -1;
    if(at === -1 && chunk.trim()) at = code.indexOf(chunk);
    let len = chunk.length;
    // Third try, whitespace-insensitive. Power BI's worked examples align their
    // equals signs — "Order Count   = COUNTROWS(Sales)" — while the piece is
    // written with single spaces, so a literal search misses and the meaning
    // falls to the tail instead of sitting on the line it explains. That is the
    // whole point of the block, and it was happening to 38 of 177 pieces.
    if(at === -1 && chunk.trim()){
      const re = new RegExp(chunk.trim().split(/\s+/).map(rx).join('\\s+'));
      const near = re.exec(code.slice(cursor));
      const m = near || re.exec(code);
      if(m){ at = (near ? cursor : 0) + m.index; len = m[0].length; }
    }
    if(at === -1){ tail.push([chunk, desc]); return; }
    cursor = at + len;
    perLine[code.slice(0, at).split('\n').length - 1].push([chunk, desc]);
  });
  // A note whose second half is missing is printed as one line, not as a chunk
  // followed by the word "undefined".
  const note = (c, d, cls) => d == null
    ? `<div class="ral-note${cls||''}"><span class="ral-note-desc">${_escHTML(c)}</span></div>`
    : `<div class="ral-note${cls||''}"><span class="ral-note-chunk">${_escHTML(c)}</span><span class="ral-note-desc">${d}</span></div>`;
  const rows = codeLines.map((line, i) =>
    `<div class="ral-code">${_escHTML(line) || '&nbsp;'}</div>` + perLine[i].map(p => note(p[0], p[1])).join('')
  ).join('');
  return `<div class="ral-block">
      <div class="ral-head"><i data-lucide="megaphone"></i>Прочитайте запрос вслух</div>
      <div class="ral-sql">${r && r.say ? `<div class="ral-say-inline">${r.say}</div>` : ''}${rows}${tail.map(p => note(p[0], p[1], ' ral-note-tail')).join('')}</div>
    </div>`;
}

// ─── THE TARGET, AND THE EIGHT SKILLS THAT ADD UP TO IT ─────────────────────
// The kit counted lessons and never said what finishing them buys you, so there
// was progress but nothing to be making progress TOWARD. A specific named goal
// beats "do your best" by a wide margin (Locke & Latham 2002, American
// Psychologist 57(9):705-717), and a big goal works when it splits into named
// sub-goals — a label saying what a group of steps ACHIEVES, not what topic it
// covers (Catrambone 1998, J Experimental Psychology: General 127(4):355-376).
// So each unit gets a sentence a learner could say out loud in an interview.
const KIT_TARGET = "ответить на вопросы Power BI, которые задаются на собеседовании с аналитиком начального уровня";
const SKILLS = [
  {unit:"Часть 0: Прежде чем строить",          name:"Скажите, что означает одна строка таблицы, прежде чем что-либо строить на ее основе."},
  {unit:"Глава 1: Интерфейс и данные",      name:"Загрузите файл в Рабочий стол Power BI и соедините таблицы вместе."},
  {unit:"Глава 2: DAX и меры",            name:"Напишите меру, которая по-прежнему возвращает правильное число при любом фильтре."},
  {unit:"Модуль 3: Отчеты и аналитика",        name:"Создайте страницу отчета, отвечающую на заданный вопрос."},
  {unit:"Модуль 4: Миграция данных",            name:"Переместите набор данных в новую систему и докажите, что ничего не потеряно"},
  {unit:"Глава 5: От вопроса к метрике",   name:"Превратите расплывчатый вопрос в показатель, который можно защитить"},
  {unit:"Глава 6: Финансовый анализ",        name:"Отвечайте на вопросы о деньгах из бухгалтерской книги"},
  {unit:"Модуль 7: Набор инструментов для продвинутого аналитика",  name:"Проверьте свои номера, прежде чем это сделает кто-то другой"}
];
const _SKILL_BY_UNIT = {}; SKILLS.forEach((sk,i)=>{ sk.n = i+1; _SKILL_BY_UNIT[sk.unit] = sk; });

// Progress for a drill is stored under the ITEM'S OWN id, which is index+1 in
// this kit — markDone('doneFills', f.id), not the index. LESSON_DRILLS points
// at indexes. Reading state.doneFills for an index would report the wrong drill
// done and never throw, so every lookup goes through here.
const _SKILL_DONE_KEY = {fills:'doneFills', parsons:'doneParsons', bugs:'doneBugs'};
const _DRILL_DATA = {fills:'FILLS', parsons:'PARSONS', bugs:'BUGS'};
function _drillItemId(type, idx){
  const arr = DATA[_DRILL_DATA[type]];
  const item = arr && arr[idx];
  return item ? item.id : null;
}
function stepIsDone(step){
  const key = _SKILL_DONE_KEY[step[0]];
  if(!key) return false;
  const id = _drillItemId(step[0], step[1]);
  return id != null && (state[key] || []).includes(id);
}

// One skill's state, read straight off the progress keys that already existed —
// nothing new is stored, and nothing is awarded that was not earned. A head
// start people can see they did not earn buys no extra effort (Nunes & Dreze
// 2006, J Consumer Research 32(4):504-512), which is also why the bar starts at
// zero. Practice reps are shown as EVIDENCE, never as a gate: only lessons 1-12
// carry drills, so gating a skill on practice would strand Units 4-7 forever.
function skillState(unit){
  const sk = _SKILL_BY_UNIT[unit];
  if(!sk) return null;
  const ls = DATA.LESSONS.filter(l => l.unit === unit);
  const doneL = ls.filter(l => state.doneLessons.includes(l.id));
  let reps = 0, repsTotal = 0;
  ls.forEach(l => (LESSON_DRILLS[l.id] || []).forEach(step => {
    if(!_SKILL_DONE_KEY[step[0]]) return;   // a handoff is a pointer, not a rep
    repsTotal++;
    if(stepIsDone(step)) reps++;
  }));
  return {n:sk.n, name:sk.name, unit:unit, done:doneL.length, total:ls.length,
          ready: ls.length > 0 && doneL.length === ls.length,
          reps:reps, repsTotal:repsTotal,
          next: ls.find(l => !state.doneLessons.includes(l.id)) || null};
}
function skillsReady(){
  return SKILLS.reduce((n,sk) => { const st = skillState(sk.unit); return n + (st && st.ready ? 1 : 0); }, 0);
}
// The skill to name next: one already started, else the one with fewest lessons
// left. People speed up as a goal gets visibly nearer (Kivetz, Urminsky & Zheng
// 2006, J Marketing Research 43(1):39-58), so the nearest sub-goal is the one
// worth putting on screen — not the distant total.
function nearestSkill(){
  const open = SKILLS.map(sk => skillState(sk.unit)).filter(st => st && st.total && !st.ready);
  if(!open.length) return null;
  const started = open.filter(st => st.done > 0);
  return (started.length ? started : open).reduce((a,b) =>
    (b.total - b.done) < (a.total - a.done) ? b : a);
}
// The one line that rides at the top of every lesson and every practice step.
// This is where the variation between screens comes from: lesson 12 does not
// look like lesson 3 because eleven more things are done, not because a
// different picture loaded.
function skillStripHTML(unit){
  const st = skillState(unit);
  if(!st) return '';
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  return `<div class="skill-strip${st.ready ? ' is-ready' : ''}" onclick="navigate('lessons')" title="See the whole path">
    <span class="ss-n">Навык ${st.n}<span class="ss-of">/${SKILLS.length}</span></span>
    <span class="ss-name">${st.name}</span>
    <span class="ss-bar"><i style="width:${pct}%"></i></span>
    <span class="ss-count">${st.ready ? 'Ready' : st.done + ' of ' + st.total}</span>
  </div>`;
}
// The home block that names the target and shows the eight skills under it.
function targetCardHTML(){
  const ready = skillsReady(), near = nearestSkill();
  const rows = SKILLS.map(sk => {
    const st = skillState(sk.unit);
    if(!st || !st.total) return '';
    const isNear = near && near.unit === st.unit;
    const target = st.next ? `navigate('lesson',${st.next.id})` : `navigate('lessons')`;
    return `<div class="skill-row2${st.ready ? ' is-done' : ''}${isNear ? ' is-near' : ''}" onclick="${target}">
      <span class="sr-tick">${st.ready ? '&#10003;' : st.n}</span>
      <span class="sr-name">${st.name}</span>
      ${st.reps ? `<span class="sr-reps">${st.reps}Представитель${st.reps === 1 ? '' : 's'}</span>` : ''}
      <span class="sr-meta">${st.ready ? 'Ready' : st.done + '/' + st.total}</span>
    </div>`;
  }).join('');
  const pips = SKILLS.map(sk => {
    const st = skillState(sk.unit);
    const cls = st && st.ready ? 'on' : (near && st && near.unit === st.unit ? 'near' : '');
    return `<span class="${cls}"></span>`;
  }).join('');
  // Name what is left in the nearest skill, not what is left in the kit. A
  // 39-lesson total is a number nobody acts on; "2 lessons left" is.
  const nearLine = near
    ? `<p class="target-count" style="margin:14px 0 0">Ближайший: <strong style="color:var(--text)">${near.name}</strong> — ${near.total - near.done}урок${near.total - near.done === 1 ? '' : 's'} левый.</p>`
    : `<p class="target-count" style="margin:14px 0 0">Все восемь навыков готовы. Возьмите их холодными в <a href="../final/#exam-powerbi">Заключительный экзамен</a>.</p>`;
  return `<div class="card">
    <div class="target-eyebrow">К чему вы стремитесь</div>
    <p class="target-line">Когда эти восемь будут готовы, вы сможете <strong>${KIT_TARGET}</strong>.</p>
    <div class="target-pips">${pips}</div>
    <div class="target-count">${ready} из ${SKILLS.length} навыки готовы</div>
    ${rows}
    ${nearLine}
  </div>`;
}

// ─── LESSONS LIST ──────────────────────────────────────────────────────────
function lessonPos(id){return DATA.LESSONS.findIndex(l=>l.id===id);}
function nextLessonId(id){const p=lessonPos(id);return(p>=0&&p<DATA.LESSONS.length-1)?DATA.LESSONS[p+1].id:null;}
// Playtest Batch 5: the Lessons view is a Duolingo-style vertical path map.
// One rail, one node per lesson — done / current / upcoming, where upcoming is
// dimmed, NEVER locked (soft-guide rule); the current node carries Continue.
// No unit-lab nodes here: Power BI has no UNIT_LABS slices yet (B2/B3 work).
function _ringSVG(done, total){
  // Unfilled track is --border, not --surf2 — see the .pmap:before note above.
  const r=14, c=2*Math.PI*r, p=total?done/total:0;
  return `<svg class="pmap-ring" width="34" height="34" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 17 17)"/>
    ${p>=1?'<text x="17" y="21" text-anchor="middle" font-size="13" fill="var(--accent)">✓</text>':''}
  </svg>`;
}
function renderLessons(){
  const cur = DATA.LESSONS.find(l => !state.doneLessons.includes(l.id));
  const units = [...new Set(DATA.LESSONS.map(l=>l.unit))];
  let html = `<h1>Твой учебный маршрут</h1>
    <p class="text-sm text-muted" style="margin:-6px 0 14px">Шаг за шагом, сверху вниз. Ничего впереди не заблокировано — затемнение означает, что оно приближается. Выделенный узел — ваш следующий шаг.</p>
    <div class="pmap">`;
  units.forEach(u => {
    const ls = DATA.LESSONS.filter(l=>l.unit===u);
    const d = ls.filter(l=>state.doneLessons.includes(l.id)).length;
    const sk = skillState(u);
    html += `<div class="pmap-unit">${_ringSVG(d, ls.length)}<div>
      <div class="pmap-unit-name">${u}</div>
      ${sk?`<div class="pmap-unit-skill${sk.ready?' is-ready':''}">${sk.ready?'&#10003; ':''}Навык ${sk.n}: ${sk.name}</div>`:''}
      <div class="pmap-unit-sub">${d}/${ls.length} Уроки</div></div></div>`;
    ls.forEach(l => {
      const done = state.doneLessons.includes(l.id);
      const isCur = cur && l.id === cur.id;
      html += `<div class="pmap-node ${done?'done':isCur?'current':'up'}" onclick="navigate('lesson',${l.id})">
        <div class="pmap-dot">${done?'✓':lessonPos(l.id)+1}</div>
        <div class="pmap-info">
          <div class="pmap-title">${l.title}</div>
          <div class="pmap-sub">${l.sub}</div>
          ${isCur?`<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="event.stopPropagation();navigate('lesson',${l.id})">▶ Продолжить</button>`:''}
        </div>
      </div>`;
    });
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

// ─── LESSON ────────────────────────────────────────────────────────────────
// ─── ONE FRAME FOR A LESSON AND ITS PRACTICE ────────────────────────────────
// A lesson and the practice that followed it were two differently-shaped pages.
// Crossing the seam the title vanished, the unit badge vanished, the six-dot
// stage bar was replaced by a second pager in a different style, and the header
// controls changed — the content changed AND the machinery changed in the same
// moment. Disjointed material imposes extraneous load for no benefit (Paas,
// Renkl & Sweller 2003, Educational Psychologist 38(1):1-4), and the fast,
// low-friction transition is what earns the near-transfer gain (Renkl,
// Atkinson, Maier & Staley 2002, Instructional Science 30:105-119).
//
// The title, skill strip, back control and stage bar now hold their exact
// position from the first stage of a lesson to the last drill of its practice,
// and the bar is ONE run of dots: six lesson stages, then one per practice step,
// drawn as rings so you can still see where the reading stops and the doing
// starts. This kit already rendered one stage at a time, which is the half of
// this Excel had to build from scratch.
const STAGE_LABELS = ["Разобраться","Пример","Попробовать","Собрать","Проверить","Закрыть"];
const STAGE_ASK = ["посмотреть, для чего это нужно","прочитайте рабочий пример","расставь строки по порядку","построить меру","ответить на чек","посмотри, что ты можешь теперь сделать"];
const STEP_ASK = {fills:"Заполните пробел", parsons:"Наведите порядок", bugs:"найди ошибку",
                  cards:"вспомнить это по памяти", workspace:"Найдите его в рабочей области",
                  lab:"Посмотрите это в лаборатории DAX."};
const STEP_DOT_LABEL = {fills:"Заполнение", parsons:"Порядок", bugs:"Ошибка", cards:"Вспомнить",
                        workspace:"Рабочая область", lab:"Практикум DAX"};
// One forward label everywhere, and it names what is coming. Naming the next
// task measurably reduces switch cost, though it never removes it (Monsell 2003,
// Trends in Cognitive Sciences 7(3):134-140).
function fwdLabel(ask){ return `Next: ${ask} &rarr;`; }

// gpos === null while in the lesson; a number once the learner is in practice.
function unifiedStageBar(l, stage, gpos){
  const seq = l ? guidedSeqFor(l.id) : [];
  const inPractice = gpos !== null && gpos !== undefined;
  const active = inPractice ? STAGE_LABELS.length + gpos : stage;
  const done = l ? state.doneLessons.includes(l.id) : false;
  const cells = [];
  STAGE_LABELS.forEach((L,i) => {
    const isDone = i < active, isActive = i === active;
    const can = l && (done || inPractice || i < stage) && !isActive;
    cells.push(`<div class="v2-stage-dot${isDone?' done':isActive?' active':''}" title="${L}"${
      can ? ` стиль="курсор:указатель" по клику="setPbiStage(${l.id},${i})"` : ''}></div>`);
  });
  seq.forEach((step,i) => {
    const idx = STAGE_LABELS.length + i;
    const isActive = idx === active;
    const isDone = idx < active || stepIsDone(step);
    cells.push(`<div class="v2-stage-dot is-practice${isDone?' done':isActive?' active':''}" title="${STEP_DOT_LABEL[step[0]]||'Practice'}"></div>`);
  });
  // Clamped, so a stage index past the last label can never print "undefined"
  // into the one line that is supposed to say where you are.
  const label = inPractice
    ? (STEP_DOT_LABEL[(seq[gpos]||[])[0]] || 'Practice')
    : STAGE_LABELS[Math.min(Math.max(stage,0), STAGE_LABELS.length-1)];
  return `<div class="v2-stage-bar">${cells.join('')}<span class="v2-stage-label">${label} · ${active+1} из ${cells.length}</span></div>`;
}
// The header every lesson stage and every practice step shares, in that order,
// in those slots. Nothing above the body moves between them.
function lessonFrameHTML(l, done, bar){
  const unit = l ? l.unit : ((guided && guided.reviewUnit) || "Повторение всех тем");
  return `<div class="row mb">
      <button class="btn btn-ghost btn-sm" onclick="navigate('lessons')">← Уроки</button>
      <span class="badge badge-unit">${unit}</span>
      ${done?"<span class=\"badge badge-done\">✓ Готово</span>":''}
      ${done&&l?`<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="resetLesson(${l.id})" title="Clear this lesson's progress and reopen it at the start">↺ Сбросить</button>`:''}
    </div>
    <div class="text-sm text-muted" style="margin-bottom:2px">${l ? `Lesson ${lessonPos(l.id)+1} of ${DATA.LESSONS.length}` : "Взято из предыдущих уроков"}</div>
    <h1>${l ? l.title : "Повторение всех тем"}</h1>
    ${skillStripHTML(l ? l.unit : ((guided && guided.reviewUnit) || ''))}
    ${bar||''}`;
}
function directiveHTML(text){
  return text ? `<div class="directive"><span class="d-eyebrow">сделай это</span><p>${text}</p></div>` : '';
}

function renderLesson(id){
  const l = DATA.LESSONS.find(x => x.id === id);
  if(!l) return;
  const done = state.doneLessons.includes(l.id);
  _syncRecalls(l.id, l);
  document.getElementById('main').innerHTML =
    lessonFrameHTML(l, done, unifiedStageBar(l, getPbiStage(l.id), null)) + v2PbiBody(l, done);
  if(window.lucide) lucide.createIcons();
}
// ─── AUTO MISS CAPTURE ─────────────────────────────────────────
// Replaces the old "how well do you have this?" self-rating. People are poor
// judges of their own recall, and the kit already watches every answer — so it
// records what was actually missed and schedules THAT, instead of asking. Same
// shape PrepLoop reads for its miss sweeps.
// One-time carry-over: the self-rating is gone, but someone who had already
// rated lessons "Not yet"/"Almost" should keep the review list they built.
// Convert those to a recorded miss, then drop the dead key.
function _migrateConfidence(){
  const c = state.confidence;
  if(!c || typeof c !== 'object') return;
  state.misses = state.misses || {};
  const touched = [];
  Object.keys(c).forEach(id=>{
    if((c[id]==='low'||c[id]==='mid') && !(state.misses[id]||[]).length){
      state.misses[id] = ["Перенесено с момента, когда вы оценили это \""+(c[id]==='low'?'Not yet':'Almost')+'"'];
      touched.push(+id);
    }
  });
  delete state.confidence;
  saveState();
  touched.forEach(id=>{
    const l = DATA.LESSONS.find(x=>x.id===id);
    if(l) _queueRecalls(id, l);
  });
}
function missesFor(id){ return (state.misses||{})[id]||[]; }
function recordMiss(lessonId, cue){
  if(lessonId==null) return;
  state.misses = state.misses || {};
  const arr = state.misses[lessonId] = state.misses[lessonId] || [];
  const c = String(cue||'').replace(/<[^>]*>/g,'').trim();
  if(c && !arr.includes(c)) arr.push(c);
  saveState();
  const l = DATA.LESSONS.find(x=>x.id===lessonId);
  if(l) _queueRecalls(lessonId, l);
}
function missGotIt(lessonId){
  state.misses = state.misses || {};
  delete state.misses[lessonId];
  saveState();
  const l = DATA.LESSONS.find(x=>x.id===lessonId);
  if(l) _queueRecalls(lessonId, l);
  if(typeof renderFlagged==='function') renderFlagged();
}
// The lesson-close panel: what got flagged, and why it is coming back.
function missPanelHTML(id){
  const m = missesFor(id);
  if(!m.length) return `<div class="miss-panel is-clean">
      <div class="miss-head"><i data-lucide="circle-check-big"></i> Чистый запуск — ничего не отмечено</div>
      <p class="miss-sub">У вас все получилось правильно с первого раза, поэтому в ваш список отзывов ничего не попадет.</p>
    </div>`;
  return `<div class="miss-panel">
      <div class="miss-head"><i data-lucide="repeat-2"></i> ${m.length} вещь${m.length===1?'':'s'} добавлен в ваш список отзывов</div>
      <p class="miss-sub">Записывается автоматически из того, что вы пропустили — самооценка не требуется. Они возвращаются через определенные промежутки времени.</p>
      <ul class="miss-items">${m.map(x=>`<li>${x}</li>`).join('')}</ul>
      <button class="btn btn-ghost btn-sm miss-clear" onclick="missGotIt(${id});renderLesson(${id})">У меня есть это сейчас — очистите это</button>
    </div>`;
}

// "See it on screen" — a KPI card and/or a simple bar visual (pure HTML).
// The SQL kit turned this panel off by default, because there it restated what
// the query obviously returned. This kit is the opposite case and so is the
// default: 34 of the 39 panels are a mock of the Power BI screen itself — the
// canvas, the Fields pane, Applied Steps — and the other 5 are the visual the
// measure produces. That is the artifact being taught, and no amount of reading
// the DAX tells a learner what the report looks like. So the panel stays on and
// `show:false` is the per-lesson way out; no lesson currently needs it.
function lessonPbiHTML(v){
  if(v.show===false) return '';
  let inner='';
  if(v.html)inner+=v.html;
  if(v.measure) inner+=`<div style="display:inline-block;min-width:150px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:${v.bars?'14px':'0'}"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)">${v.measure.name}</div><div style="font-size:1.8rem;font-weight:700;color:var(--accent);margin-top:2px">${v.measure.value}</div></div>`;
  if(v.bars){
    const max=Math.max(...v.bars.map(b=>b.value));
    inner+=`<div style="display:flex;flex-direction:column;gap:8px">${v.bars.map(b=>`<div style="display:flex;align-items:center;gap:10px"><span style="width:80px;font-size:12px;color:var(--dim);text-align:right;flex-shrink:0">${b.label}</span><div style="flex:1;background:var(--surf2);border-radius:4px;height:22px"><div style="width:${Math.round(b.value/max*100)}%;background:var(--accent);height:100%;border-radius:4px;min-width:2px"></div></div><span style="width:56px;font-size:12px;font-family:var(--mono);flex-shrink:0">${b.display!==undefined?b.display:b.value}</span></div>`).join('')}</div>`;
  }
  return `<div class="card" style="border-color:var(--accent);margin-top:16px"><div class="lesson-eyebrow"><i data-lucide="monitor"></i> ${v.title||"Смотрите это на экране"}</div>${inner}${v.caption?`<p style="font-size:.9rem;color:var(--muted);margin:12px 0 0;line-height:1.6">${v.caption}</p>`:''}</div>`;
}
// answerQuiz, retryQuiz and finishLesson went with the pre-v2 lesson body.
// They drove the old one-page quiz, which every one of the 39 lessons has
// opted out of since it grew a `parsons` field; the stage flow's own

// ─── INLINE-SVG CHARTS (Medium #6: real visuals on chart-centric lessons) ────
// Zero-dependency parametric SVG (same generators as the SQL kit — PBI is a
// SQL-clone so the CSS vars match). Rendered in the Worked Example stage AFTER
// the output table — the table stays the ground truth; the chart is what an
// analyst would put on the report page.
const _svgNS='xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif" style="width:100%;height:auto;max-width:520px;display:block"';
function _chartScale(vals, H, pad){
  const max=Math.max(...vals,0), min=Math.min(...vals,0), span=(max-min)||1;
  return { y:v=>pad+(max-v)/span*(H-2*pad), zero:pad+(max-0)/span*(H-2*pad), max, min };
}
function svgLineChart(c){
  const W=520,H=280,P=36,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), x=i=>L+i*(W-L-20)/(n-1);
  const pts=vals.map((v,i)=>`${x(i)},${s.y(v).toFixed(1)}`).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${s.y(v).toFixed(1)}" r="3.5" fill="var(--accent)"/><text x="${x(i)}" y="${(s.y(v)-10).toFixed(1)}" fill="var(--text)" font-size="11" text-anchor="middle">${c.fmt?c.fmt(v):v}</text>`).join('');
  const lbls=c.labels.map((t,i)=>`<text x="${x(i)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text><line x1="${L}" y1="${H-P+6}" x2="${W-16}" y2="${H-P+6}" stroke="var(--border)" stroke-width="1.5"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}${lbls}</svg>`;
}
function svgBarChart(c){
  const W=520,H=280,P=40,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), bw=Math.min(72,(W-L-24)/n*0.62), gap=(W-L-24)/n;
  const bars=vals.map((v,i)=>{
    const bx=L+12+i*gap+(gap-bw)/2, y0=s.zero, y1=s.y(v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y0-y1));
    const col=c.colors?`var(--${c.colors[i]})`:'var(--accent)';
    return `<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}"/>
      <text x="${(bx+bw/2).toFixed(1)}" y="${(top-6).toFixed(1)}" fill="var(--text)" font-size="11" text-anchor="middle">${c.fmt?c.fmt(v):v}</text>
      <text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${c.labels[i]}</text>`;
  }).join('');
  const zero=`<line x1="${L}" y1="${s.zero.toFixed(1)}" x2="${W-12}" y2="${s.zero.toFixed(1)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text>${zero}${bars}</svg>`;
}
function svgParetoChart(c){
  const W=520,H=280,P=40,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), gap=(W-L-24)/n, bw=Math.min(64,gap*0.62);
  const yPct=p=>P+(100-p)/100*(H-2*P);
  const bars=vals.map((v,i)=>{
    const bx=L+12+i*gap+(gap-bw)/2;
    return `<rect x="${bx.toFixed(1)}" y="${s.y(v).toFixed(1)}" width="${bw}" height="${(s.zero-s.y(v)).toFixed(1)}" rx="2" fill="var(--accent)"/><text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${c.labels[i]}</text>`;
  }).join('');
  const cx=i=>L+12+i*gap+gap/2;
  const line=c.cumPct.map((p,i)=>`${cx(i).toFixed(1)},${yPct(p).toFixed(1)}`).join(' ');
  const dots=c.cumPct.map((p,i)=>`<circle cx="${cx(i).toFixed(1)}" cy="${yPct(p).toFixed(1)}" r="3" fill="var(--warn)"/><text x="${cx(i).toFixed(1)}" y="${(yPct(p)-8).toFixed(1)}" fill="var(--warn)" font-size="10" text-anchor="middle">${p}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text><line x1="${L}" y1="${s.zero.toFixed(1)}" x2="${W-12}" y2="${s.zero.toFixed(1)}" stroke="var(--muted)" stroke-width="1.5"/>${bars}<polyline points="${line}" fill="none" stroke="var(--warn)" stroke-width="2"/>${dots}</svg>`;
}
function pbiChartHTML(c){
  const svg = c.type==='line'?svgLineChart(c) : c.type==='bar'?svgBarChart(c) : c.type==='pareto'?svgParetoChart(c) : '';
  if(!svg) return '';
  return `<div class="card" style="margin-top:16px"><div class="lesson-eyebrow"><i data-lucide="bar-chart-3"></i> Посмотреть диаграмму</div>${svg}${c.caption?`<p class="text-muted text-sm" style="margin:10px 0 0">${c.caption}</p>`:''}</div>`;
}
