   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Период</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Sales ($K)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Ян</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">180</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">февраль</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">196</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Мар</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">188</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">апрель</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">214</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Может</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">247</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">июнь</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">268</td></tr></tbody></table></div>", caption:"Ежемесячные продажи"},
   quiz:{q:"Зачем использовать DIVIDE([Продажи] - [Продажи за предыдущий месяц], [Продажи за предыдущий месяц]) вместо выражения ([Продажи] - [Продажи за предыдущий месяц]) / [Продажи за предыдущий месяц]?", opts:["DIVIDE вычисляет меру быстрее","Он возвращает пустое значение, если [Продажи за предыдущий месяц] равно BLANK().","Оператор / недопустим в DAX.","DIVIDE автоматически округляет результат"], ans:1, exp:"У первого периода нет предыдущего месяца, поэтому [Продажи за предыдущий месяц] возвращает BLANK(). При прямом делении это может привести к делению на ноль. DIVIDE обрабатывает такой случай и возвращает BLANK() (или указанное альтернативное значение), чтобы визуализация не показывала ошибочное число."},
   parsons:{prompt:"Организуйте измерение Мама: зафиксируйте сейчас, отложите назад, затем разделите разницу.",lines:["Продажи в месяц % =","VAR Cur = [Total Sales]","VAR Prev = CALCULATE([Total Sales], DATEADD('Date'[Date], -1, MONTH))","RETURN DIVIDE(Cur - Prev, Prev)"],answer:[0,1,2,3]},
   explain:{is:"DATEADD сдвигает окно даты назад на заданную величину, поэтому можно рассчитать одну и ту же меру как для прошлого месяца, так и для этого, и сравнить их.",
     use:"Это отвечает на вопрос: «Растем ли мы?», вопрос, лежащий в основе большинства ежемесячных отчетов. Сначала запишите обе цифры как именованные переменные, и линия роста будет восприниматься как обычная арифметика, а не как вложенные функции.",
     like:"Взвешивайтесь сегодня утром и еще раз в прошлый понедельник. Ни одна из цифр сама по себе ни о чем не говорит — все дело в разрыве между ними."},
   build:{q:"Измените этот показатель с ежемесячного на годовой. Что такое редактирование?",opts:["Замените DATEADD на TOTALYTD.","Измените МЕСЯЦ DATEADD на ГОД.","Умножьте результат на 12.","Замените DIVIDE на оператор /."],ans:1,exp:"Третий аргумент DATEADD — это единица смены: замените MONTH на YEAR, а предыдущий станет тем же периодом в прошлом году. (SAMEPERIODLASTYEAR — эквивалентное сокращение.) TOTALYTD накапливается, а не сдвигается, и арифметика не меняется."},
   close:"Вы можете ответить: «Мы растем?» с показателем периода за периодом, который изящно выдерживает первый месяц. Далее: просчет итогов с помощью TOTALYTD.",
   unlock:"Шаблон VAR также помогает отлаживать меру: выведите отдельно [Продажи] и [Продажи за предыдущий месяц], чтобы увидеть, какая часть расчёта роста даёт неверное значение. Меру, записанную одним большим вложенным выражением, проверять значительно сложнее."
  },
{id:604, unit:"Глава 5: От вопроса к метрике", title:"Промежуточные итоги с TOTALYTD", sub:"Накопите показатели по календарю — с начала года за один вызов.",
   story:"Столбчатая диаграмма показывает каждый месяц отдельно, но бизнесу нужна нарастающая линия — общий результат с начала года по текущую дату. В DAX для этого есть TOTALYTD: функция повторно вычисляет меру по датам от 1 января до текущего контекста и начинает накопление заново в январе. Это стандартный способ построить выручку с начала года и прогресс по цели без ручного расчёта дат.",
   ral:{code:"Продажи с начала года =\nTOTALYTD([Общий объем продаж], 'Date'[Date])\n\n-- общий промежуточный итог (любой кадр):\nТекущие продажи =\nCALCULATE([Общий объем продаж],\n    ФИЛЬТР(ALL('Date'[Date]),\n        'Date'[Date] <= MAX('Date'[Date])))", say:"Возьмите текущую сумму продаж за текущий год по таблице дат — каждый день с первого числа года до текущей точки — и позвольте ей перезапускаться каждый январь.",
     lines:[["Продажи с начала года = TOTALYTD([Общий объем продаж], 'Date'[Date])","накапливать общий объем продаж с 1 января до контекста текущей даты, перезапуская каждый январь."],["Текущие продажи = CALCULATE([Общий объем продаж],","общий шаблон — повторно прогоните итог под фильтром «все до сих пор», созданным ниже"],["ФИЛЬТР(ALL('Date'[Date]),","ALL(очистить фильтр по дате), затем ФИЛЬТРАТЬ (оставить только) даты, прошедшие следующий тест."],["'Date'[Date] <= MAX('Date'[Date]))","сохранять каждую дату до последней даты, видимой в текущем контексте — бегущем кадре"]]},
   notes:"Итоговый результат за год работает как одометр поездки автомобиля: он продолжает прибавляться в течение года, а затем обнуляется 1 января. TOTALYTD — это сокращение для этого — РАСЧИТАТЬ по установленной дате с начала года; TOTALQTD и TOTALMTD определяют квартал и месяц. Если вам нужно окно, которое встроенные модули не покрывают, шаблон FILTER(ALL('Date'[Date]), <= MAX(...)) является общим механизмом промежуточного итога - очистите контекст даты, затем повторно примените «все до здесь». Оба зависят от отмеченной таблицы дат. Используйте ALL (не ALLSELECTED), если промежуточная сумма должна игнорировать срез даты на странице.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Период</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Продажи с начала года (тысяч долларов США)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Ян</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">180</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">февраль</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">376</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Мар</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">564</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">апрель</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">778</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Может</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1025</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">июнь</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1293</td></tr></tbody></table></div>", caption:"Продажи за текущий год"},
   quiz:{q:"Что делает выражение FILTER(ALL('Date'[Date]), 'Date'[Date] <= MAX('Date'[Date]))?", opts:["Только одно значение текущей даты","Промежуточная сумма за каждую дату до настоящего времени","Общий итог в каждой строке","Ошибка, если не применен срез"], ans:1, exp:"ВСЕ очищает существующий фильтр дат, затем условие сохраняет каждую дату до максимального значения текущей строки включительно — поэтому ВЫЧИСЛЕНИЕ оценивает меру по всем показателям на данный момент, получая промежуточный итог. Это универсальная версия TOTALYTD."},
   parsons:{prompt:"Организуйте общую схему промежуточного итога: очистите фильтр даты, затем сохраните все до текущего момента.",lines:["Текущие продажи =","CALCULATE([Общий объем продаж],","ФИЛЬТР(ALL('Date'[Date]),","'Date'[Date] <= MAX('Date'[Date])))"],answer:[0,1,2,3]},
   explain:{is:"Текущая сумма накапливается по мере движения календаря — каждый день с первого января до любого места, где вы находитесь — и начинается заново каждый новый год.",
     use:"Это линия подъема почти в каждом отчете руководителя. TOTALYTD делает это за один вызов; шаблон ФИЛЬТР-и-ВСЕ делает то же самое для любого окна, которое вы изобретаете, и именно этого вы достигаете, когда год не является рамкой.",
     like:"Благотворительный термометр, нарисованный возле ратуши. Никто не красит это после хорошей недели; он только поднимается, пока апелляция не закончится и не начнется новая."},
   build:{q:"Вам нужен промежуточный итог за квартал, а не за год. Какой встроенный?",opts:["TOTALYTD с четвертым аргументом","TOTALQTD([Total Sales], 'Date'[Date])","SAMEPERIODLASTYEAR","DATEADD с КВАРТАЛОМ"],ans:1,exp:"TOTALQTD — четвертьродный брат TOTALYTD (TOTALMTD — месяцы) — такое же поведение накопления и сброса с ежеквартальным сбросом. SAMEPERIODLASTYEAR и DATEADD периоды смен; они не накапливаются."},
   close:"Можно построить восходящую линию — с начала года за один звонок, или любое окно с паттерном ФИЛЬТР/ВСЕ. Далее: преобразование воронки.",
   unlock:"Форму FILTER(ALL(...), <= MAX(...)) стоит запомнить, поскольку она обобщает прошлые даты: замените столбец даты рангом, и вы получите совокупную долю; добавьте ALLSELECTED, и он будет учитывать срезы. Один узор, полдюжины скоб для приборной панели."
  },
{id:605, unit:"Глава 5: От вопроса к метрике", title:"Преобразование воронки с помощью CALCULATE", sub:"Выделите пользователей на каждом этапе, затем DIVIDE соседние этапы.",
   story:"Команда продукта спрашивает: «Из всех посетителей сколько зарегистрировались, активировали аккаунт и оплатили?» Это воронка: количество уникальных пользователей уменьшается на каждом этапе, а между этапами рассчитывается конверсия. Для каждого шага DISTINCTCOUNT считается в контексте фильтра CALCULATE; коэффициент конверсии — отношение текущего этапа к предыдущему, вычисляемое через DIVIDE. Этих мер обычно достаточно, чтобы увидеть, на каком шаге теряются пользователи.",
   ral:{code:"Посещено =\nDISTINCTCOUNT(Events[UserID])\n\nActivated =\nCALCULATE(DISTINCTCOUNT(Events[UserID]),\n    Events[Step] IN { \"activate\", \"pay\" })\n\nActivation % =\nDIVIDE([Activated Users], [Visited Users])", say:"Подсчитайте отдельных пользователей в целом, затем посчитайте отдельных пользователей, чей шаг активен или глубже, и разделите более глубокий этап на более широкий для коэффициента конверсии.",
     lines:[["Посещено = DISTINCTCOUNT(Events[UserID])","DISTINCTCOUNT (подсчитывать каждое значение один раз) — каждый пользователь учитывал один раз, сколько бы событий он ни вызвал."],["Activated = CALCULATE(DISTINCTCOUNT(Events[UserID]),","тот же отдельный счетчик, повторный запуск под следующим ступенчатым фильтром"],["Events[Step] IN { \"activate\", \"pay\" }","IN (соответствует любому значению в списке) — оставляйте строки на этом этапе или глубже, чтобы каждый уровень воронки оставался подмножеством предыдущего."],["Activation % = DIVIDE([Activated Users], [Visited Users])","разделите более глубокий счет на более широкий — преобразование между этапами"]]},
   notes:"DISTINCTCOUNT считает людей, а не события, поэтому подходит для воронки; обычный COUNTROWS завысит число на каждом этапе. Важно сохранять накопительный принцип: набор пользователей на каждом этапе должен включать всех, кто дошёл до следующих шагов. Иначе пользователь, сразу перешедший к оплате, не попадёт в промежуточные этапы.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">категория</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Воронка регистрации (отдельные пользователи)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Посетил</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">12,000</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Зарегистрировался</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4,200 · 35%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Активировано</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">2,100 · 50%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">оплаченный</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">760 · 36%</td></tr></tbody></table></div>", caption:"Воронка регистрации (отдельные пользователи)"},
   quiz:{q:"Почему мера «Активировано» фильтрует события[Шаг] IN { «активировать», «платить» }, а не просто «активировать»?", opts:["DAX не может фильтровать по одному значению","Таким образом, пользователи, которые заплатили, по-прежнему считаются активированными.","Чтобы ускорить оценку меры","IN-наборы требуются DISTINCTCOUNT"], ans:1, exp:"Воронка должна сжиматься на каждом этапе: каждый, кто заплатил, обязательно прошел активацию. Фильтрация только по «активации» исключит платящих пользователей из активированного этапа, в результате чего более поздний этап превзойдет более ранний. Включение всех более глубоких шагов сохраняет монотонность воронки."},
   parsons:{prompt:"Установите показатель «Активированная стадия» — счетчик с областью действия «активировать или глубже».",lines:["Activated =","CALCULATE(","DISTINCTCOUNT(Events[UserID]),","Events[Step] IN { \"activate\", \"pay\" })"],answer:[0,1,2,3]},
   explain:{is:"Воронка измеряет, сколько разных людей достигает каждого этапа, а затем делит один этап на предыдущий, чтобы получить соотношение между ними.",
     use:"Каждая встреча по продукту требует этого. Хитрость в том, что любой, кто достиг более поздней стадии, также прошел и предыдущую, поэтому фильтр каждой стадии должен включать в себя все, что глубже, чем он сам.",
     like:"Очередь в ночной клуб. Танцующие люди раньше тоже были людьми, стоящими на тротуаре — забудьте об этом, и вы придете к выводу, что никто не прошел мимо двери."},
   build:{q:"Посещенные и активированные существуют как меры. Какой мерой является коэффициент конверсии активации?",opts:["Activation % = [Activated Users] - [Visited Users]","Activation % = DIVIDE([Activated Users], [Visited Users])","Activation % = DIVIDE([Visited Users], [Activated Users])","Activation % = DISTINCTCOUNT(События)"],ans:1,exp:"Конверсия — это более глубокий этап по сравнению с более широким: «Активировано» или «Посещено», с DIVIDE для безопасности. Изменение соотношения дает число, превышающее 100%, а вычитание дает количество пользователей, а не показатель."},
   close:"Вы можете построить воронку, о которой спрашивает каждая встреча по продукту — отдельные пользователи на каждом этапе и ставки между ними. Далее: краеугольный камень, удержание когорты.",
   unlock:"The widest gap between two funnel stages is where the business is leaking — and pointing at it is how a dashboard drives a decision. 'Activation to paid is our weakest step at 36%' starts a roadmap conversation; a wall of counts doesn't."
  },
{id:606, unit:"Глава 5: От вопроса к метрике", title:"Удержание когорты", sub:"Отметьте когорту подписавшихся, а затем нормализуйте активных пользователей до нулевого месяца.",
   story:"Рост может скрыть отток: вы добавляете клиентов каждый месяц, а старые незаметно уходят. Когортный анализ это улавливает. Вы отмечаете каждого клиента с месяцем его регистрации (столбец когорты) и подсчитываете, сколько из них активны в каждом месяце, а затем делите на начальный размер когорты, чтобы получить показатель удержания. Прочитайте колонку, и вы увидите, сохраняются ли новые когорты лучше, чем старые. Это краеугольный камень: производное измерение, смещение по времени и нормализованная скорость.",
   ral:{code:"-- вычисляемый столбец по Клиентам:\nКогорта Месяц =\nSTARTOFMONTH(Customers[SignupDate])\n\n-- показатель удержания, нормированный по размеру когорты:\nУдержание % =\nVAR Active = DISTINCTCOUNT(Активность[CustomerID])\nРазмер ВАР =\n    CALCULATE(DISTINCTCOUNT(Активность[CustomerID]),\n        'Смещение'[MonthsSince] = 0)\nRETURN РАЗДЕЛЕНИЯ (Активный, Размер)", say:"Отметьте каждого клиента месяцем, в котором они подписались, подсчитайте, сколько членов когорты активны в каждом месяце с момента смещения, и разделите на размер когорты за месяц 0, чтобы превратить подсчеты в коэффициент удержания.",
     lines:[["Месяц когорты = STARTOFMONTH(Customers[SignupDate])","STARTOFMONTH (привязка к первому числу месяца) — вычисляемый столбец, в котором для каждого клиента указывается месяц регистрации."],["VAR Active = DISTINCTCOUNT(Activity[CustomerID])","подсчитайте отдельных активных клиентов когорты в контексте текущих месяцев с момента"],["VAR Size = CALCULATE(DISTINCTCOUNT(Activity[CustomerID]),","тот же счетчик, повторите запуск с последующим фильтром"],["'Смещение'[МесяцевС] = 0)","вернуть смещение обратно на 0 — начальный размер когорты в том месяце, когда они присоединились"],["RETURN DIVIDE(Active, Size)","разделите активную группу на начальный размер — уровень удержания каждой когорты, по которому можно сравнить"]]},
   notes:"Представьте спортзал, который отдельно отслеживает новых участников января и февраля и каждый месяц проверяет, кто из них продолжает ходить. Это когортная матрица. Технически это разбиение по месяцу регистрации с добавлением количества месяцев после регистрации — так можно сравнить удержание разных когорт.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">когорта</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Месяц 0</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">месяц 1</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">месяц 2</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">3 месяц</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Ян</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">62%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">48%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">41%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">февраль</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">66%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">53%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">47%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Мар</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">71%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">59%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">—</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">апрель</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">74%</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">—</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">—</td></tr></tbody></table></div>"},
   quiz:{q:"Зачем делить количество активных участников каждой когорты на ее собственный размер за нулевой месяц (VAR размера)?", opts:["Ранжировать когорты от самой большой к самой маленькой.","Таким образом, когорты разного размера сопоставимы.","Чтобы удалить когорты с отсутствующими месяцами","Чтобы свести все когорты в одну"], ans:1, exp:"Необработанные данные о количестве активных пользователей нельзя сравнивать в когортах разного размера — большая когорта всегда показывает более высокие цифры. Деление на количество нулевых месяцев каждой когорты приводит к масштабированию каждой когорты до 100 % в начале, превращая показатели в коэффициенты удержания, которые можно прочитать в столбце."},
   parsons:{prompt:"Настройте показатель удержание %: активы, затем размер месяца-0, затем нормализуйте.",lines:["Удержание % =","VAR Active = DISTINCTCOUNT(Activity[CustomerID])","VAR Size = CALCULATE(DISTINCTCOUNT(Activity[CustomerID]), 'Offset'[MonthsSince] = 0)","RETURN DIVIDE(Active, Size)"],answer:[0,1,2,3]},
   explain:{is:"Когорта — это все, кто присоединился в одном месяце. Удержание отслеживает, сколько участников этой группы все еще активны позже, как долю от того, сколько из них началось.",
     use:"Это отличает действительно улучшающийся продукт от продукта, который просто привлекает больше людей. Деление на собственный начальный размер каждой группы — это то, что делает январскую группу сопоставимой с июньской.",
     like:"Беговой клуб, который записывает месяц, в котором каждый участник впервые пришел. Двадцать человек, которые все еще появляются, кажутся здоровыми, пока вы не узнаете, началось ли это с двадцати пяти или с двухсот."},
   build:{q:"Какая функция помечает каждого клиента вычисляемым столбцом «Месяц когорты»?",opts:["Месяц когорты = TOTALYTD(Клиенты[Дата регистрации])","Месяц когорты = STARTOFMONTH(Customers[SignupDate])","Месяц когорты = DATEADD(Клиенты[Дата регистрации], -1, MONTH)","Месяц когорты = MAX(Customers[SignupDate])"],ans:1,exp:"STARTOFMONTH сворачивает любую дату регистрации до первого числа месяца — каждый клиент, присоединившийся в марте, получает одну и ту же мартовскую марку, что и делает их когортой. TOTALYTD накапливает показатели, DATEADD сдвигает, MAX суммирует."},
   close:"Вы построили когортную матрицу — производное измерение, смещение по времени и нормализованную ставку, работающие вместе. На этом трек «От вопроса к метрике» завершен. Далее: Финансовый анализ.",
   unlock:"Вертикальное прочтение — это то, что отличает аналитиков в интервью: в ряду показано ухудшение состояния одной когорты (ожидаемое), а в нижнем столбце сравниваются когорты одного и того же возраста — если удержание в течение 1-го месяца превышает когорту, независимо от того, изменился ли продукт, работает. Скажите это без подсказки, и комната заметит."
  },
{id:701, unit:"Глава 6: Финансовый анализ", title:"Постройте прибыль и убытки с помощью CALCULATE", sub:"Каждая строка оператора является мерой; промежуточные итоги ссылаются на них.",
   story:"В таблице главной книги хранятся все транзакции, помеченные строкой выписки — доход, себестоимость, эксплуатационные расходы. Вам нужен отчет о прибылях и убытках на карточке или в матрице: выручка, себестоимость товаров к валовой прибыли, операционные расходы к операционному доходу. В DAX каждая строка является мерой — CALCULATE фильтрует реестр по этой строке — а промежуточные итоги — это меры, которые ссылаются на другие. Создайте их один раз, и они будут пересчитаны для любого среза по месяцам, регионам или продуктам.",
   ral:{code:"Доход = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = «Доход»)\nCOGS = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = \"COGS\")\nЭксплуатационные расходы = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = \"Операционные расходы\")\n\nGross Profit = [Revenue] - [COGS]\nOperating Income = [Gross Profit] - [Operating Expenses]", say:"Напишите по одному показателю для каждой строки отчета, который фильтрует бухгалтерскую книгу по этой строке и суммирует ее, а затем строит валовую прибыль и операционный доход как показатели, которые вычитают один строковый показатель из другого.",
     lines:[["Доход = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = «Доход»)","просуммируйте суммы книги с контекстом фильтра, установленным только на строку «Доход»"],["Себестоимость/эксплуатационные расходы","повторяется тот же однострочный шаблон — каждая строка оператора получает свою собственную отфильтрованную меру"],["Gross Profit = [Revenue] - [COGS]","вычесть одну меру из другой — никакого нового агрегирования, просто измерять арифметические действия"],["Operating Income = [Gross Profit] - [Operating Expenses]","каскад продолжается со ссылкой на предыдущий промежуточный итог — срез за месяц, и каждая строка пересчитывается"]]},
   notes:"Отчет о прибылях и убытках представляет собой каскад промежуточных итогов — выручка — себестоимость = валовая прибыль, — операционные расходы = операционный доход, — проценты и налоги = чистая прибыль — и каждый из них изолирует отдельный вопрос. CALCULATE — это механизм: он устанавливает контекст фильтра так, чтобы SUM суммировал только строки для одной строки. Построение промежуточных итогов в виде показателей, ссылающихся на другие показатели (а не на новые вызовы CALCULATE), сохраняет модель СУХОЙ, а логику — читабельной — исправьте показатель «Доход» один раз, и за ним последуют все зависимые числа. Поскольку это показатели, весь отчет о прибылях и убытках в реальном времени реагирует на любой срез отчета.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Шаг</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Количество</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Выручка</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">760 тысяч долларов</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">COGS</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">−300</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Валовая прибыль</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">460 тысяч долларов</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Операционные расходы</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">−290</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Операционная прибыль</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">170 тысяч долларов</td></tr></tbody></table></div>", caption:"Собственный визуальный элемент водопада Power BI рисует именно это: каждая серая привязка представляет собой промежуточный показатель, каждая красная полоса — это стоимость, вычитаемая из строки выше. Разрезаем по месяцам и весь каскад перерисовывается."},
   quiz:{q:"Зачем записывать валовую прибыль как [Выручка] - [COGS] вместо нового CALCULATEА по бухгалтерской книге?", opts:["CALCULATE нельзя использовать дважды в одной модели","Он повторно использует линейные размеры, поэтому исправления проходят через","Вычитание выполняется быстрее, чем любое агрегирование.","Меры не могут напрямую ссылаться на столбец таблицы."], ans:1, exp:"Ссылка на существующие показатели [Выручка] и [COGS] сохраняет модель СУХОЙ: исправьте определение выручки один раз, и валовая прибыль, операционный доход и каждая построенная на их основе маржа обновятся автоматически. Отдельный вызов CALCULATE будет дублировать логику фильтра и приведет к рассинхронизации."},
   parsons:{prompt:"Организуйте каскад прибылей и убытков: сначала линейные показатели, затем промежуточные итоги, которые ссылаются на них.",lines:["Доход = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = «Доход»)","COGS = CALCULATE(SUM(Ledger[Amount]), Ledger[Line] = \"COGS\")","Gross Profit = [Revenue] - [COGS]","Operating Income = [Gross Profit] - [Operating Expenses]"],answer:[0,1,2,3]},
   explain:{is:"Каждая строка отчета о прибылях и убытках становится отдельной мерой, которая фильтрует бухгалтерскую книгу по этой строке, а каждый промежуточный итог представляет собой показатели, вычтенные из показателей.",
     use:"Построенный таким образом, весь оператор пересчитывается под любым срезом — по региону, по месяцу — вместо статического экспорта. Промежуточный итог ни в коем случае не должен повторно возвращаться в бухгалтерскую книгу, иначе он уйдет за пределы строк над ним.",
     like:"Кухонный блокнот, в котором «то, что осталось» получается из строк, написанных над ним, а не из-за повторного открытия банковского приложения. Проработайте это дважды, и оба ответа в конечном итоге разойдутся."},
   build:{q:"Вы исправили ошибку определения в показателе [Выручка]. Что происходит с валовой прибылью, операционным доходом и маржой?",opts:["Ничего — каждая мера хранит свою копию логики.","Все они обновляются автоматически — они ссылаются на [Выручка]","Только обновления валовой прибыли","Модель необходимо сначала переопубликовать"],ans:1,exp:"В этом и заключается преимущество мер, ссылающихся на меры: исправление мгновенно проходит через весь каскад. Если бы каждый промежуточный итог имел свой собственный CALCULATE в бухгалтерской книге, вы бы искали каждую копию логики фильтра — и пропустили бы одну."},
   close:"Вы можете построить отчет о прибылях и убытках в реальном времени — линейные показатели, каскадные промежуточные итоги, пересчет с помощью любого среза. Далее: поля, где эти линии становятся сопоставимыми.",
   unlock:"Матрица прибылей и убытков, разбитая по месяцам, представляет собой отчет, который фактически открывают финансовые директора. Индекс DAX скромен: самое впечатляющее — это форма: строки заявлений в качестве показателей означают, что одна модель отображает общее представление о компании, представление по регионам и представление по каждому продукту без изменения формулы."
  },
{id:702, unit:"Глава 6: Финансовый анализ", title:"Поля с DIVIDE", sub:"Каждая линия прибыли превышает выручку — безопасно с помощью DIVIDE.",
   story:"Две линейки продуктов приносят доход по 760 тысяч долларов каждая. Один держит 22 цента за доллар, другой — 6 центов. Выручка не может отличить их друг от друга, а маржа может. Маржа — это линия прибыли по сравнению с доходом, и в DAX вы пишете ее с помощью DIVIDE, а не с помощью оператора косой черты, поэтому фильтр, который доводит доход до нуля или пустого значения, вместо ошибки возвращает чистое пустое значение. Отформатируйте показатель в процентах, и он будет выглядеть как отчет.",
   ral:{code:"Валовая прибыль % = DIVIDE([Валовая прибыль], [Выручка])\nОперационная маржа % = DIVIDE([Операционная прибыль], [Выручка])\nЧистая прибыль % = DIVIDE([Чистая прибыль], [Выручка])\n\n-- установите Формат в Процент для каждой меры", say:"Разделите каждый показатель прибыли на доход, используя DIVIDE — валовую, операционную и чистую прибыль, — и отформатируйте результат в процентах, чтобы узнать, сколько центов прибыли приходится на доллар продаж.",
     lines:[["Валовая прибыль % = DIVIDE([Валовая прибыль], [Выручка])","разделите валовую прибыль на выручку — эффективность производства продукта"],["Операционная маржа % = DIVIDE([Операционная прибыль], [Выручка])","то же деление на строчку ниже — рентабельность основного бизнеса до вычета процентов и налогов"],["Чистая прибыль % = DIVIDE([Чистая прибыль], [Выручка])","чистая прибыль как доля продаж — то, что выживает после каждой затраты"],["Формат ▸ Процент","установите формат каждой меры в процентах — числа читаются как цент на доллар продаж."]]},
   notes:"Каждая маржа устраняет еще один уровень затрат, поэтому они уходят вниз: валовая ≥ операционная ≥ чистая. Валовая прибыль зависит от цен и затрат на вводимые ресурсы; операционная маржа накладных расходов; чистая маржа по долгу и налогам. Специфическая для DAX привычка: всегда используйте DIVIDE(числитель, знаменатель) поверх косой черты — в матрице некоторые ячейки не будут иметь дохода в контексте, и DIVIDE возвращает там пустое значение, а / выдает ошибку, которая очищает весь визуальный элемент. Установите формат показателя «Процент», чтобы модель сохраняла соотношение и в отчете отображалось 22%.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">категория</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Маржа в 2024 г. (% от выручки)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Валовой</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">60%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Операционная</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">22%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Сеть</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">14%</td></tr></tbody></table></div>", caption:"Маржа в 2024 г. (% от выручки)"},
   quiz:{q:"Зачем писать маржу с помощью DIVIDE([Прибыль],[Выручка]) вместо [Прибыль]/[Выручка]?", opts:["DIVIDE автоматически форматирует результат как процент","Возвращает пустое значение, если доход равен нулю или пуст.","Оператор косой черты не является допустимым синтаксисом DAX.","DIVIDE обязательно нужно использовать внутри каждого вызова CALCULATE"], ans:1, exp:"В матрице некоторые строки не будут иметь дохода в контексте своего фильтра. DIVIDE обрабатывает это изящно — нулевой или пустой знаменатель дает пустое значение, а не ошибку — поэтому визуальный элемент продолжает рендеринг. Оператор косой черты вызывает ошибку деления на ноль, которая может очистить весь визуальный элемент."},
   parsons:{prompt:"Расположите лестницу маржи так, чтобы прибыль и убытки уходили вниз, а затем отформатируйте ее.",lines:["Валовая прибыль % = DIVIDE([Валовая прибыль], [Выручка])","Операционная маржа % = DIVIDE([Операционная прибыль], [Выручка])","Чистая прибыль % = DIVIDE([Чистая прибыль], [Выручка])","Установите формат каждой меры в процентах."],answer:[0,1,2,3]},
   explain:{is:"Маржа — это одна строка прибыли, разделенная на выручку — пенсы, удерживаемые с каждого проданного фунта на каждом уровне затрат.",
     use:"Маржа позволяет сравнить магазин на углу с супермаркетом в одном масштабе. Валовая, операционная и чистая прибыль идут в том же порядке, что и оператор, каждый из которых удаляет еще один слой, поэтому валовая прибыль всегда должна быть самой большой.",
     like:"Два человека управляют рыночными прилавками. Один берет десять тысяч фунтов в день, другой — двести, но пока не узнаешь, что держит каждый из них, ты не представляешь, кем из них быть."},
   build:{q:"Валовая прибыль составляет 60%, а операционная рентабельность — 22%. Что живет в разрыве в 38 очков?",opts:["Проценты и налоги","Операционные расходы (операционные расходы)","Стоимость проданного товара","Ошибка округления DIVIDE"],ans:1,exp:"Переход от валовой прибыли к операционной устраняет операционные расходы — накладные расходы на ведение бизнеса. COGS уже исчезла до валовой прибыли, а проценты и налоги учитываются позже, между операционной и чистой прибылью."},
   close:"Вы можете сравнивать предприятия любого размера в одном и том же масштабе — цент, оставленный за доллар на каждом уровне затрат. Далее: балансовые коэффициенты.",
   unlock:"Прибыль – это вопрос «какая линейка продуктов лучше?» решается: две линии с одинаковым доходом могут различаться в 3 раза по тому, что они сохраняют. Представление маржи рядом с выручкой в ​​той же матрице незаметно перенаправляет встречу с вопроса «кто продал больше всего» на «кто больше всего заработал»."
  },
{id:703, unit:"Глава 6: Финансовый анализ", title:"Ликвидность и коэффициенты кредитного плеча", sub:"Три балансовых коэффициента как меры.",
   story:"В отчете о прибылях и убытках указывается, прибыльны ли вы; балансовый отчет показывает, переживете ли вы этот квартал. Два вопроса решают это. Ликвидность: можете ли вы покрыть предстоящие платежи тем, что скоро превратится в наличные? Кредитное плечо: какая часть компании работает на заемные деньги? Три показателя — каждый из которых представляет собой РАЗДЕЛЕНИЕ двух показателей баланса — отвечают на оба показателя и определяют карты KPI, которые кредитор или финансовый директор проверяют в первую очередь.",
   ral:{code:"Текущий коэффициент = DIVIDE([Текущие активы], [Текущие обязательства])\nКоэффициент быстрой ликвидности = DIVIDE([Текущие активы] - [Запасы], [Текущие обязательства])\nДолг к собственному капиталу = DIVIDE([Общий долг], [Общий капитал])", say:"Разделите текущие активы на текущие обязательства для коэффициента текущей ликвидности (то же самое, без запасов для коэффициента быстрой ликвидности), и общий долг на общий капитал для кредитного плеча — каждый с DIVIDE.",
     lines:[["Текущий коэффициент = DIVIDE([Текущие активы], [Текущие обязательства])","разделить краткосрочные активы на краткосрочные векселя — значение выше 1,0 означает, что векселя покрыты"],["Коэффициент быстрой ликвидности = DIVIDE([Текущие активы] - [Запасы], [Текущие обязательства])","тот же тест с вычетом запасов сначала — более строгая версия, не требующая продажи"],["Долг к собственному капиталу = DIVIDE([Общий долг], [Общий капитал])","разделите заемные доллары на доллары владения — получится значение кредитного плеча"],["форматировать как десятичный","показывать 1,80, а не 180% — коэффициенты читаются как кратные, а не процентные."]]},
   notes:"Коэффициент означает только что-то по сравнению с эталоном. Коэффициент текущей ликвидности 1,5–3 комфортен для большинства отраслей; намного выше может означать, что деньги простаивают. Коэффициент быстрой ликвидности исключает запасы — самый медленный оборотный актив, превращающийся в наличные, — чтобы задаться вопросом, сможете ли вы заплатить, если полки не очистятся. Отношение долга к собственному капиталу выше примерно 2 указывает на высокий финансовый риск для большинства нефинансовых компаний. Поскольку эти меры реагируют на срез даты, вы можете отслеживать соотношение по кварталам на линейном графике — гораздо более красноречиво, чем одно статическое число.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">соотношение</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">ценить</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">здоровый диапазон</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">читать</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Коэффициент текущей ликвидности</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.80</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.5 – 3.0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Комфортный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Быстрый коэффициент</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.10</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">≥ 1.0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Покрывает счета без инвентаря</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Отношение долга к собственному капиталу</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0.70</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">< 2.0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Умеренное кредитное плечо</td></tr></tbody></table></div>", caption:"Каждое соотношение представляет собой одно считывание DIVIDE относительно контрольного показателя. В качестве показателей они имеют тенденцию с течением времени в соответствии с срезом даты: реальным предупреждением является падение коэффициента текущей ликвидности по кварталам, а не его уровень в каком-либо отдельном квартале."},
   quiz:{q:"Какое преимущество дает вам использование их в качестве показателей, а не фиксированных цифр?", opts:["Соотношения автоматически форматируются в процентах.","Они пересчитывают и формируют тренды под срезом даты.","Им больше не нужно значение знаменателя","Они не позволяют пользователям фильтровать отчет."], ans:1, exp:"Мера — это рецепт, а не сохраненный ответ: она пересчитывается в любом контексте фильтра, который предоставляется в отчете. Поместите срез даты на страницу, и один и тот же коэффициент текущей ликвидности будет измерять тенденции по кварталам, чтобы вы могли наблюдать за снижением ликвидности с течением времени, а не судить по одному статическому снимку."},
   parsons:{prompt:"Расположите три коэффициента — свободный тест, строгий тест, затем кредитное плечо — и правило формата.",lines:["Текущий коэффициент = DIVIDE([Текущие активы], [Текущие обязательства])","Коэффициент быстрой ликвидности = DIVIDE([Текущие активы] - [Запасы], [Текущие обязательства])","Долг к собственному капиталу = DIVIDE([Общий долг], [Общий капитал])","Формат в виде десятичных дробей — соотношения читаются как кратные, а не в процентах."],answer:[0,1,2,3]},
   explain:{is:"Три проверки баланса: текущие активы над текущими обязательствами, то же самое с удалением запасов и общий долг над общим капиталом.",
     use:"Они отвечают, выживет ли бизнес в следующем квартале и какая часть его займа. В строгой версии товарные запасы не учитываются, поскольку запасы на полке превращаются в деньги медленнее всего.",
     like:"Решаем, сможете ли вы покрыть счета за этот месяц. Сначала со всем, что у вас есть, затем снова притворитесь, что никто не покупает машину, потому что подъездная дорога, полная вещей, стоящих денег, — это не то же самое, что деньги."},
   build:{q:"Почему коэффициент быстрой ликвидности вычитает запасы из оборотных активов?",opts:["Запасы — это пассив, а не актив","Запасы медленнее всего превращаются в денежные средства","Запасы всегда завышены","DIVIDE не может обработать три меры"],ans:1,exp:"Коэффициент быстрой ликвидности спрашивает, сможете ли вы покрыть краткосрочные счета, даже если на полках ничего не будет продано. Запасы — это настоящий оборотный актив, но он медленнее всего конвертируется в деньги — их удаление превращает комфортную проверку в строгую."},
   close:"Вы можете узнать, выживет ли компания в этом квартале — охват и кредитное плечо как живые, модные показатели. Далее: NPV, где у DAX нет встроенной функции, и вы ее создаете.",
   unlock:"Тенденция превышает уровень: текущий коэффициент 1,6 выглядит хорошо на карте, но 2,4 → 2,0 → 1,6 за три квартала является предупреждением. Отношения как меры в срезе даты дают вам траекторию бесплатно — чтение статического снимка электронной таблицы не может предложить."
  },
{id:704, unit:"Глава 6: Финансовый анализ", title:"Временная стоимость денег: NPV в DAX", sub:"Нет собственной чистой приведенной стоимости — создайте ее с помощью SUMX и коэффициента дисконтирования.",
   story:"Сегодня проект стоит 500 тысяч долларов и окупается в течение пяти лет. Стоит ли финансировать это? Доллар в пятом году стоит меньше, чем доллар сегодня, поэтому вы дисконтируете каждый поток перед суммированием. Excel имеет =NPV; DAX нет — поэтому вы его создаете, и это действительно впечатляющая вещь, которую можно показать в интервью. SUMX просматривает таблицу денежных потоков построчно, дисконтируя каждую сумму по году, и складывает их.",
   ral:{code:"NPV =\nVAR Rate = 0.10\nRETURN\n    SUMX(\n        CashFlows,\n        DIVIDE(CashFlows[Amount], (1 + Rate) ^ CashFlows[Year])\n    )\n-- Year 0 row holds -500000; (1+Rate)^0 = 1, so it isn't discounted", say:"Пройдите по таблице денежных потоков с помощью SUMX, разделив сумму каждой строки на единицу плюс ставка, повышенную к году этой строки, и просуммируйте дисконтированный поток в сегодняшние доллары.",
     lines:[["VAR Rate = 0.10","сохраните 10-процентную барьерную ставку один раз под именем"],["SUMX(Денежные потоки,","СУММХ (обход таблицы построчно) — оцените выражение для каждой строки, затем сложите результаты."],["DIVIDE(Денежные потоки[Сумма],","разделите сумму денежных средств каждой строки на коэффициент дисконтирования, построенный следующим"],["(1 + Ставка) ^ Денежные потоки[Год])","1,10 повышен до года этой строки — коэффициент растет с годом, еще больше сокращая дальние потоки"],["Год 0 строка","удерживает авансовый платеж в размере -500 000; (1 + Ставка) ^ 0 = 1, поэтому скидка не учитывается."]]},
   notes:"DAX не предоставляет функции NPV или IRR, поэтому вы создаете NPV с помощью итератора: SUMX оценивает выражение скидки для каждой строки таблицы денежных потоков и суммирует результаты. Итерация контекста строк — это ключевая идея DAX: SUMX выполняет математические вычисления для каждой строки, чего не может сделать простая SUM. Привяжите ставку к параметру «что, если», и в отчете NPV будет пересчитываться в реальном времени, когда пользователь перетаскивает барьерную ставку. IRR — показатель, при котором NPV достигает нуля — требует итерации для расчета и в какой-то мере непрактичен, поэтому представьте NPV по выбранной ставке и отметьте IRR отдельно, если спросят.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Год</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Денежный поток</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">factor (10%)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Текущая стоимость</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">−500,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.00</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">−500,000</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">150,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.10</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">136,364</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">2</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">160,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.21</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">132,231</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">3</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">170,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.33</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">127,724</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">180,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.46</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">122,940</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">5</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">190,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1.61</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">117,971</td></tr></tbody></table></div>", caption:"SUMX дисконтирует каждую строку на (1,10)^год и суммирует столбец текущей стоимости до ≈ +137 230 долларов США — положительное значение, поэтому проект преодолевает барьер в 10%. Подключите скорость к ползунку «что, если», и она будет пересчитана в реальном времени."},
   quiz:{q:"Почему NPV строится с помощью SUMX, а не простой суммы по таблице денежных потоков?", opts:["SUM не может читать столбец с отрицательными числами","SUMX сначала дисконтирует каждую строку по её собственному году","SUM всегда игнорирует строку для нулевого года","SUMX — единственная функция, которую разрешено использовать внутри VAR"], ans:1, exp:"Перед добавлением каждый денежный поток необходимо дисконтировать по соответствующему году, что является математическим расчетом для каждой строки. SUMX предоставляет контекст строки для оценки суммы/(1+ставка)^год для каждой строки, а затем суммирует результаты. Обычная СУММА может суммировать только необработанные суммы — у нее нет возможности применять разные коэффициенты дисконтирования для каждой строки."},
   parsons:{prompt:"Организуйте показатель NPV: назовите ставку, затем повторите потоки, дисконтируя каждый по году.",lines:["ЧПС =","VAR Rate = 0.10","RETURN SUMX(","Денежные потоки,","DIVIDE(CashFlows[Amount], (1 + Rate) ^ CashFlows[Year]))"],answer:[0,1,2,3,4]},
   explain:{is:"Деньги, поступающие через пять лет, стоят меньше, чем деньги сегодня, поэтому каждая будущая сумма делится на коэффициент роста, приведённый к соответствующему году, прежде чем что-либо складывать.",
     use:"DAX не предоставляет функции NPV, поэтому вы создаете ее с помощью SUMX, просматривая таблицу денежных потоков строка за строкой. Именно так первоначальные затраты на проект честно сопоставляются с доходами, распределенными в течение десятилетия.",
     like:"Тебе предложат сто фунтов сейчас или сто фунтов на твой следующий день рождения. На странице написана одна и та же цифра, и все берут первую — в этом пробеле и заключается вся идея."},
   build:{q:"В строке «Год 0» содержится авансовая стоимость —500 000. Что с этим делает коэффициент дисконтирования?",opts:["Скидка на 10%, как и на любую другую строку.","Ничего — все в степени 0 равно 1.","Полностью исключает эту строку из SUMX","Преобразует его в положительное число"],ans:1,exp:"Все, что находится в нулевой степени, равно 1, поэтому поток года 0 делится на 1 и проходит без дисконтирования — и это совершенно верно: сегодняшние доллары уже выражены в сегодняшних терминах. Скидка кусается только по мере роста года."},
   close:"Вы создали финансовую функцию, которую DAX не предоставляет — SUMX выполняет математические вычисления для каждой строки, а простая SUM не может. Далее: бюджет и факт, где вердикт зависит от контекста.",
   unlock:"«DAX не имеет NPV, поэтому я построил его с помощью SUMX» — это двойной сигнал интервью: он доказывает, что вы знаете реальные преимущества инструмента, И что итераторы (SUMX, семейство X) разблокируют логику для каждой строки. Подключите ставку к ползунку «что если», и она станет живой демонстрацией."
  },
{id:705, unit:"Глава 6: Финансовый анализ", title:"Бюджет и факт: анализ отклонений", sub:"Меры дисперсии и вердикт, который читает строку в контексте.",
   story:"Каждый месяц FP&A сравнивает бюджет с фактом в матрице: бюджет, факт и отклонение. Важно определить, благоприятно отклонение или нет, и здесь есть ловушка — знак зависит от типа показателя. Превышение плана по выручке хорошо, а превышение плана по расходам плохо. Мера оценки должна учитывать тип строки; SELECTEDVALUE извлекает его из текущего контекста фильтра.",
   ral:{code:"Отклонение = [Факт] – [Бюджет]\nОтклонение % = DIVIDE([Факт] – [Бюджет], [Бюджет])\n\nВердикт =\nIF(\n    SELECTEDVALUE(Lines[Type]) = \"Доход\",\n    IF([Дисперсия] >= 0, «Благоприятный», «Неблагоприятный»),\n    IF([Дисперсия] <= 0, «Благоприятный», «Неблагоприятный»)\n)", say:"Вычтите бюджет из фактического для отклонения и разделите на процент, затем в вердикте прочитайте тип текущей строки с SELECTEDVALUE, так что доход по сравнению с планом будет считаться благоприятным, а затраты по сравнению с планом — неблагоприятным.",
     lines:[["Отклонение = [действительный] - [бюджет]","вычесть бюджет из фактического — долларовый разрыв по сравнению с планом"],["Отклонение % = DIVIDE([действительный] - [бюджет], [Бюджет])","тот же разрыв, разделенный на бюджет: 10 тысяч долларов читают по-разному на 1 миллион долларов, чем на 20 тысяч долларов."],["SELECTEDVALUE(Lines[Type])","SELECTEDVALUE (читать одно значение в контексте) — тип строки, доход или стоимость текущей строки."],["IF(… \"Favorable\", \"Unfavorable\")","IF(выбор по условию) — вложенный, поэтому доход по сравнению с планом выглядит благоприятным, а затраты по сравнению с планом — неблагоприятным."]]},
   notes:"Отклонение в долларах без учета благоприятного/неблагоприятного тега неоднозначно: перерасход и перезаработок являются положительными числами, и их разделяет только тип строки. SELECTEDVALUE — это шаг, который делает вердикт контекстно-зависимым: в матрице, разрезанной по строкам, он возвращает тип одной строки для текущей строки (и запасной вариант, когда контекст не является одним значением). Закодируйте суждение в показателе, чтобы матрицу нельзя было неправильно прочитать, а затем отсортируйте по существенности — отклонениям, которые велики как в долларах, так и в процентах.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Линия</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">бюджет</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">действительный</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">дисперсия</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Вердикт</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Выручка</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1,000,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1,080,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">+80,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Благоприятный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">COGS</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">400,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">445,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">+45,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Неблагоприятный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Маркетинг</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">120,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">104,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">−16,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Благоприятный</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Численность персонала</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">260,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">290,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">+30,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Неблагоприятный</td></tr></tbody></table></div>", caption:"В строках 1 и 2 показано положительное отклонение, однако одна из них благоприятная, а другая нет: выручка сверх плана — это хорошо, затраты выше плана — плохо. SELECTEDVALUE позволяет мере вердикта узнать, на какой строке она находится."},
   quiz:{q:"Что делает SELECTEDVALUE(Линии[Тип]) внутри меры Вердикт?", opts:["Суммирование каждого типа линий по матрице","Чтение типа одной строки текущей строки","Сортировка строк по доходам, а затем по затратам","Заставить дисперсию всегда быть положительной"], ans:1, exp:"В матрице, разрезанной по строкам, контекст фильтра каждой строки сужается до одного типа строки. SELECTEDVALUE возвращает это единственное значение — «Доход» или «Стоимость» — поэтому IF может применить правильное соглашение о знаках для каждой строки. Без него эта мера не могла бы определить, была ли положительная дисперсия хорошей или плохой."},
   parsons:{prompt:"Составьте набор отклонений: доллары, проценты, затем контекстно-зависимый вердикт.",lines:["Отклонение = [Факт] – [Бюджет]","Отклонение % = DIVIDE([Факт] – [Бюджет], [Бюджет])","Вердикт = IF(SELECTEDVALUE(Линии[Тип]) = \"Доход\",","IF([Дисперсия] >= 0, «Благоприятный», «Неблагоприятный»),","IF([Variance] <= 0, \"Favorable\", \"Unfavorable\"))"],answer:[0,1,2,3,4]},
   explain:{is:"Отклонение — это то, что произошло на самом деле, за вычетом запланированного, выраженное как в сумме, так и в процентах.",
     use:"Загвоздка в том, что этот знак означает противоположные вещи по разным причинам: расходы по плану — это хорошая новость, а заработок по плану — нет. Кодирование этого решения в мере останавливает чтение матрицы в обратном направлении.",
     like:"Придешь домой раньше или позже, чем ты обещал. Приветствуется ли это, полностью зависит от того, были ли вы на работе или в пабе."},
   build:{q:"COGS превысила бюджет на 45 тысяч долларов. Что возвращает мера Вердикт и почему?",opts:["Благоприятно — больше расходов означает больше активности.","Неблагоприятное — линия затрат выше плана — это плохо.","Благоприятный — дисперсия положительная.","Пусто — SELECTEDVALUE не работает в строках затрат."],ans:1,exp:"Для линий затрат соглашение о знаках меняется: превышение плана является неблагоприятным. Вот и вся причина, по которой вердикт читает тип строки: отклонение +45 тысяч долларов отлично подходит для выручки и является проблемой для COGS, и только контекст различает их."},
   close:"Вы можете сопоставить план с реальностью и закодировать суждение, чтобы матрицу нельзя было неправильно прочитать. Далее: юнит-экономика — взгляд на единицу.",
   unlock:"FP&A сортирует отклонения по существенности — большие как в долларах, так и в процентах. Отклонение в 40% на линии в 2 тысячи долларов — это шум; 4% на линию в 10 миллионов долларов — это реальный разговор. Добавьте флаг существенности рядом с вердиктом, и ваша матрица предварительно отсортирует повестку дня собрания."
  },
{id:706, unit:"Глава 6: Финансовый анализ", title:"Юнит-экономика: маржа вклада и безубыточность", sub:"Прибыль на единицу и объем, покрывающий фиксированную базу.",
   story:"Прежде чем получить чистую прибыль и убытки, задайте вопрос в расчете на единицу продукции: принесет ли еще одна продажа деньги после увеличения затрат? Маржа вклада — это цена минус переменные затраты — то, что каждая единица вносит в постоянные затраты и прибыль. Разделите на него постоянные затраты, и вы получите безубыточность: единицу измерения, при которой бизнес перестает терять деньги. В качестве мер они приводят в действие панель ценообразования, где ползунок цен «что, если» движется в режиме безубыточности.",
   ral:{code:"CM за единицу = [Цена] – [Переменная стоимость]\nКоэффициент CM = DIVIDE([Цена] – [Переменная стоимость], [Цена])\n\nЕдиницы безубыточности =\nROUNDUP(DIVIDE([Постоянные затраты], [Цена] – [Переменная стоимость]), 0)", say:"Вычтите переменные затраты из цены вклада за единицу, выразите их как долю от цены с помощью DIVIDE, затем разделите на них постоянные затраты и округлите до значения безубыточности.",
     lines:[["CM за единицу = [Цена] – [Переменная стоимость]","вычесть переменные затраты из цены — какой вклад каждая продажа вносит в постоянные затраты и прибыль."],["Коэффициент CM = DIVIDE([Цена] – [Переменная стоимость], [Цена])","тот же вклад, разделенный на цену — вклад как доля от каждого доллара продаж"],["DIVIDE([Fixed Costs], [Price] - [Variable Cost])","разделите постоянные затраты на вклад на единицу — сколько продаж покрывает постоянную базу"],["ROUNDUP(…, 0)","ОКРУГЛ ВВЕРХ (округление до целых единиц) — на части продажи невозможно выйти в ноль."]]},
   notes:"Разделение «сделай или сломай» является фиксированным и переменным: только переменные затраты вычитают маржу вклада, потому что только они масштабируются с каждой единицей — вместо этого в знаменателе безубыточности находятся постоянные затраты. Пройдя точку безубыточности, каждая дополнительная единица снижает всю свою маржинальную прибыль прямо в прибыль; это операционный рычаг. В качестве меры привяжите цену к параметру «что, если», и отчет покажет движение безубыточности по мере тестирования цен — инструмент ценообразования в реальном времени. Маржа вклада также отвечает на вопрос: «Должны ли мы принять этот заказ со скидкой?»: если цена по-прежнему превышает переменные издержки, она вносит вклад в фиксированную базу.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Период</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Revenue ($K)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Общая стоимость (тысяч долларов)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">60</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">200</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">40</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">84</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">400</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">80</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">108</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">600</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">120</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">132</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">800</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">160</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">156</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">1,000</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">200</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">180</td></tr></tbody></table></div>", caption:"Безубыточность: общие затраты против выручки"},
   quiz:{q:"Какие затраты входят в знаменатель безубыточности как часть маржи вклада?", opts:["Фиксированная стоимость, так как это самые большие расходы","Переменная стоимость, которая масштабируется с каждой единицей","Обе затраты суммируются за единицу проданной продукции.","Ни то, ни другое — для достижения безубыточности используется только выручка."], ans:1, exp:"Маржа вклада — это цена минус переменные издержки, поскольку с каждой единицей меняются только переменные издержки. Фиксированные затраты не входят в маржу на единицу — они находятся в числителе формулы безубыточности, которая делит общие постоянные затраты на вклад на единицу, чтобы определить, сколько единиц их покрывает."},
   parsons:{prompt:"Организуйте построение юнит-экономики: маржа на единицу, ее соотношение, затем безубыточность.",lines:["CM за единицу = [Цена] – [Переменная стоимость]","Коэффициент CM = DIVIDE([Цена] – [Переменная стоимость], [Цена])","Единицы безубыточности =","ROUNDUP(DIVIDE([Fixed Costs], [Price] - [Variable Cost]), 0)"],answer:[0,1,2,3]},
   explain:{is:"Вклад — это то, что оставляет после себя одна продажа после затрат, возникающих только из-за этой продажи. Безубыточность — это то, сколько из них необходимо, чтобы покрыть затраты, которые вы в любом случае заплатите.",
     use:"Он отвечает: «Должны ли мы принять этот заказ со скидкой?». Как только фиксированная база покрыта, все, что превышает стоимость продажи, сразу же падает, поэтому сравнение проводится с этой стоимостью, а не с прейскурантной ценой.",
     like:"Рыночный прилавок с платой за подачу. Каждый шарф, который вы продаете сверх того, что он стоил, вам отчисляется в виде комиссии, и как только комиссия уйдет, остаток дня будет вашим."},
   build:{q:"Покупатель предлагает купить со скидкой: ниже прейскурантной цены, но все же выше переменных издержек. Постоянные расходы уже покрыты в этом месяце. Возьми?",opts:["Нет — никогда не продавайте ниже прейскурантной цены.","Да, все, что превышает переменные издержки, увеличивает прибыль.","Нет — скидки всегда теряют деньги.","Только если это повысит среднюю цену продажи."],ans:1,exp:"При покрытии постоянных издержек каждая продажа, превышающая переменные издержки, полностью снижает свой вклад в прибыль — это операционный рычаг. Важное сравнение — это цена и переменные затраты, а не цена и список."},
   close:"Вы можете ответить на вопросы, касающиеся каждой единицы товара: какой вклад приносит каждая продажа и сколько продаж покрывает базу. На этом курс финансового анализа завершен. Далее: Набор инструментов для продвинутого аналитика.",
   unlock:"Принцип безубыточности переводит разговоры о ценах с мнений на арифметику: «При цене 49 долларов нам нужно 1224 единицы, при цене 59 долларов нам нужно 968» — это предложение, которое завершает дебаты. Прикрепите цену к ползунку «что, если», и заинтересованные стороны смогут спорить с ползунком, а не с вами."
  },
{id:801, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Сначала профилируйте данные", sub:"Панели профилирования Power Query + проверки DAX, прежде чем вы станете доверять таблице.",
   story:"Набор данных попадает в модель, и кто-то хочет получить отчет к концу дня. Не начинайте перетаскивать поля — сначала профилируйте. В Power Query есть панель профилирования, созданная именно для этого: качество столбца (действительный/ошибочный/пустой), распределение столбцов и профиль столбца с минимальным, максимальным и отдельным количеством. Подкрепите это тремя показателями DAX, и вы узнаете размер, полноту и уникальность таблицы, прежде чем доверять одному визуальному элементу.",
   ral:{code:"// Power Query ▸ Просмотр ▸ поставить галочку Качество столбца + Распределение столбцов\n// ▸ установить в строке состояния значение «на основе всего набора данных»\n\nСтроки = СЧЕТЧИКИ(Заказы)\nПробелы электронной почты = COUNTBLANK(Заказы[Электронная почта])\nDistinct Cust = DISTINCTCOUNT(Заказы[CustomerID])", say:"Включите панели качества и распределения столбцов Power Query, чтобы увидеть значения NULL и форму для каждого столбца, а затем подтвердите их с помощью DAX — COUNTROWS для размера, COUNTBLANK для пробелов, DISTINCTCOUNT для уникальных объектов.",
     lines:[["Посмотреть ▸ Качество колонки + распространение","панели Power Query — действительные, ошибочные и пустые проценты, а также отдельные значения для каждого столбца, формула не требуется"],["\"на основе всего набора данных\"","расширить профиль за пределы первых 1000 строк по умолчанию — классическая ловушка"],["Строки = СЧЕТЧИКИ(Заказы)","посчитайте каждую строку — размер таблицы, знаменатель всего остального"],["Пробелы электронной почты = COUNTBLANK(Заказы[Электронная почта])","COUNTBLANK (подсчитайте пустые ячейки) в столбце «Электронная почта» — знайте пробелы, прежде чем группировать их по этому полю."],["Отличительный каст = DISTINCTCOUNT(Заказы[CustomerID])","подсчитайте каждого клиента один раз — уникальные объекты вместо необработанных строк"]]},
   notes:"Панели профилирования Power Query — самый быстрый профилировщик в стеке, но самая большая ловушка — это строка состояния, отображающая «на основе 1000 верхних строк». Для таблицы с миллионом строк это вводящая в заблуждение выборка; всегда переключайте его на «весь набор данных», прежде чем доверять процентам. Трио DAX (COUNTROWS, COUNTBLANK, DISTINCTCOUNT) делает одни и те же проверки активными и нарезаемыми, поэтому вы можете профилировать столбец в любом фильтре. DISTINCTCOUNT под COUNTROWS — это ваш первый сигнал о проблеме с зерном, которую мы решим в следующем уроке.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Проверить</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Результат</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">читать</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">COUNTROWS</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">96,420</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">размер стола</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">бланки электронной почты</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">3,805</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Отсутствует ~4% — обработайте перед нарезкой по электронной почте.</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">DISTINCTCOUNT(CustomerID)</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">31,544</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">намного ниже рядов — клиенты повторяют</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">DISTINCTCOUNT(OrderID)</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">также под рядами — уровень детализации выглядит более мелким</td></tr></tbody></table></div>", caption:"Оба отдельных счетчика находятся ниже количества строк — клиенты повторяются (ожидается), как и идентификаторы заказов (флаг зернистости). Профилирование поверхностей до того, как поверх них будет записана какая-либо мера."},
   quiz:{q:"По умолчанию профиль столбца Power Query отображает статистику только для 1000 строк. Как вы профилируете всю таблицу?", opts:["Выберите режим профилирования «по всему набору данных»","Повторно импортируйте источник в виде файла CSV.","Сначала добавьте в модель меру COUNTROWS.","Отсортировать столбец по возрастанию"], ans:0, exp:"В строке состояния профилирования по умолчанию отображаются 1000 верхних строк, что может сильно искажать большую таблицу. Нажав на нее и выбрав «на основе всего набора данных», профилируйте каждую строку — это важно, прежде чем вы доверяете качеству и процентам распределения."},
   parsons:{prompt:"Организуйте трио профилирования DAX, а затем прочтите, что связывает их вместе.",lines:["Строки = СЧЕТЧИКИ(Заказы)","Пробелы электронной почты = COUNTBLANK(Заказы[Электронная почта])","Отличительный каст = DISTINCTCOUNT(Заказы[CustomerID])","Прочтите все три вместе, прежде чем создавать единое визуальное представление."],answer:[0,1,2,3]},
   explain:{is:"Три однострочные проверки описывают таблицу, которую вы никогда не открывали: сколько строк в ней содержится, сколько записей пусто и сколько различных сущностей появляется.",
     use:"Вы запускаете их, прежде чем доверять чему-либо. Ничего не значит много само по себе: 3805 пустых писем — это ошибка округления в 96 420 строках и катастрофа в 4000.",
     like:"Заходим на незнакомую кухню перед приготовлением. Насколько оно велико, чего не хватает и сколько людей в нем уже есть — три взгляда, прежде чем вы определитесь с меню."},
   build:{q:"DISTINCTCOUNT(Orders[CustomerID]) — 31 544, а COUNTROWS(Заказы) — 96 420. Чему вы научились?",opts:["Треть строк не удалось загрузить","Клиенты повторяют заказы","Столбец идентификатор клиента поврежден.","Ничего — цифры не связаны между собой."],ans:1,exp:"Отдельные объекты намного ниже количества строк означают, что ключ повторяется — каждый клиент здесь в среднем делает около трех заказов. Ожидается для таблицы фактов, но она сообщает вам, что идентификатор клиента не может быть «единственной» стороной отношения без дедуплицированного измерения."},
   close:"Вы можете оценить неизвестную таблицу по трем показателям и одной панели профилирования. Далее: проверьте уровень детализации, прежде чем строить на нем.",
   unlock:"Профилирование в режиме реального времени в DAX (а не только в Power Query) имеет скрытое преимущество: меры реагируют на срезы, поэтому вы можете профилировать ВНУТРИ сегмента — «насколько полной является электронная почта среди корпоративных учетных записей?» — вопрос, на который панель статического профилирования не может ответить."
  },
{id:802, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Подтвердить уровень детализации", sub:"«Одна» сторона отношений должна быть уникальной — докажите это.",
   story:"В каждой таблице есть уровень детализации — то, что представляет одна строка, — и в модели Power BI это имеет двойное значение: неправильное уровень детализации увеличивает ваши итоговые значения, И «единая» сторона каждого отношения должна иметь уникальный ключ, иначе модель сломается. Прежде чем строить связь со столбцом, докажите его уникальность: сравните количество строк с количеством уникальных значений этого ключа.",
   ral:{code:"Количество строк = COUNTROWS (заказы)\nРазличные ключи = DISTINCTCOUNT(Заказы[OrderID])\nGrain OK = [Количество строк] = [Различные ключи] // ИСТИНА, только если в заказе одна строка", say:"Сравните количество строк с количеством уникальных ключей — если они равны, зернистость составляет одну строку на порядок, а если количество строк превышает количество отдельных ключей, ключ повторяется, и любые отношения, построенные на нем, будут разветвляться.",
     lines:[["Количество строк = COUNTROWS (заказы)","посчитать каждую строку в таблице"],["Различные ключи = DISTINCTCOUNT(Заказы[OrderID])","каждый ID заказа считать один раз — количество уникальных ключей"],["Уровень детализации ОК = [Количество строк] = [Отдельные ключи]","сравнить две меры — TRUE, только если каждая строка имеет свой собственный ключ, одна строка на заказ"],["строки > отдельные ключи","ключ повторяется; уровень детализации тоньше, чем предполагалось, и отношения, построенные на нем, будут разветвляться"]]},
