<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дашборды Power BI — практика без установки</title>
<link rel="canonical" href="https://analytikos.duckdns.org/powerbi/">
<meta name="description" content="Создавайте информационные панели Power BI с нуля. Бесплатная интерактивная практика. Изучите DAX, визуализацию и моделирование данных. Установка не требуется.">
<link rel="stylesheet" href="../assets/grain/grain.css">
<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. The kit's own semantic vars are re-pointed onto Grain
   tokens (assets/grain/) — no one-off hex. :root = warm dark variant;
   .light = the full Grain cream look (toggled via JS class). A dedicated
   Grain dark palette is a later token job (out of scope). */
:root{
  --bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);
  --accent:var(--clay-400);--accent2:var(--clay-300);
  --text:var(--stone-50);--muted:var(--stone-300);--border:var(--stone-700);
  --red:var(--rust-400);--green:var(--leaf-400);--yellow:var(--amber-300);--warn:var(--amber-400);
  --font:var(--font-sans);--mono:var(--font-mono);
  /* --dim was used 30 times and defined nowhere, so those colours fell back
     to inherited text. It is the same role as --muted; alias it. */
  --dim:var(--muted);
  --r:var(--radius-lg);--r2:var(--radius-sm);--shadow:var(--shadow-lg);
}
.light{
  --bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);
  --accent:var(--clay-500);--accent2:var(--clay-600);
  --text:var(--stone-900);--muted:var(--stone-600);--border:var(--stone-200);
  --red:var(--rust-500);--green:var(--leaf-500);--yellow:var(--amber-600);--warn:var(--amber-600);
  --dim:var(--muted);
  --shadow:var(--shadow-md);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* NAV */
nav{background:var(--surf);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;position:sticky;top:0;z-index:100;height:56px}
.nav-brand{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text);padding:0 10px 0 0;margin-right:6px;border-right:1px solid var(--border);white-space:nowrap;display:inline-flex;align-items:center;gap:9px;letter-spacing:var(--tracking-tight)}
.nav-logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.nav-logo-mark .lucide{width:17px;height:17px}
.ws-spot{cursor:pointer;transition:background .15s,outline .15s}
.ws-spot:hover{outline:2px solid var(--accent);outline-offset:-2px}
.ws-spot.lit{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(47,109,240,.16)!important}
.ws-spot.good{outline:2px solid #2e9e6b;outline-offset:-2px;background:rgba(46,158,107,.20)!important}
.ws-spot.bad{outline:2px solid #c0392b;outline-offset:-2px;background:rgba(192,57,43,.18)!important}
.nav-btn{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:14px 10px;cursor:pointer;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.nav-spacer{flex:1}
.nav-icon{font-size:16px;padding:14px 8px}

/* LAYOUT */
main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
h1{font-size:1.6rem;font-weight:700;margin-bottom:6px}
h2{font-size:1.15rem;font-weight:600;margin-bottom:14px}
h3{font-size:1rem;font-weight:600;margin-bottom:10px}
p{margin-bottom:12px;color:var(--muted)}
p strong{color:var(--text)}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-sm{padding:14px 18px}
.card-accent{border-color:var(--accent)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r2);font:600 14px var(--font);cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text)}
.btn-sm{padding:7px 14px;font-size:13px}
.flag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--border);cursor:pointer}
.flag-row:hover .flag-row-title{color:var(--accent)}

/* BADGE / PILL */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-unit{background:var(--surf2);color:var(--muted)}
.badge-done{background:var(--leaf-50);color:var(--leaf-700)}

/* PROGRESS BAR */
/* Track is --border, NOT --surf2 — see the .pmap:before note below: --surf2
   and --bg are the same value in light mode, so a --surf2 track vanishes. */
.prog-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.prog-bar{height:100%;background:var(--accent);border-radius:3px;transition:.4s}

/* HOME — resume card */
.resume-card{background:var(--accent);border-radius:var(--r);padding:24px 28px;margin-bottom:20px;color:#fff}
.resume-card h2{color:#fff;margin-bottom:4px}
.resume-card p{color:rgba(255,255,255,.8);margin:0 0 16px}
.resume-card .btn{background:rgba(255,255,255,.15);color:#fff}
.resume-card .btn:hover{background:rgba(255,255,255,.28)}

/* HOME — path grid */
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.path-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:.15s;text-align:center}
.path-tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.path-tile .icon{font-size:1.8rem;margin-bottom:8px;color:var(--accent);line-height:1}
.drill-tile .icon{font-size:1.6rem;margin-bottom:8px;color:var(--accent);line-height:1}
.path-tile h3{font-size:.95rem;margin:0 0 4px}
.path-tile p{font-size:12px;margin:0}

/* LESSON LIST */
.unit-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 0 4px;margin-top:8px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:8px;cursor:pointer;transition:.15s}
.lesson-row:hover{border-color:var(--accent);transform:translateX(3px)}
.lesson-num{width:28px;height:28px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.lesson-num.done{background:var(--accent);color:#fff}
.lesson-info{flex:1}
.lesson-title{font-weight:600;font-size:14px}
.lesson-sub{font-size:12px;color:var(--muted)}
.lesson-arrow{color:var(--muted);font-size:18px}

/* PATH MAP (playtest Batch 5) — Duolingo-style vertical rail. States are
   done / current / upcoming; upcoming is DIMMED, never locked (soft-guide).
   Rail is --border, NOT --surf2: zinc-sky sets --color-bg to --stone-100, the
   same value light mode gives --surf2, so a --surf2 rail vanishes on light. */
.pmap{position:relative}
.pmap:before{content:'';position:absolute;left:24px;top:8px;bottom:8px;width:3px;background:var(--border);border-radius:2px}
.pmap-unit{display:flex;align-items:center;gap:12px;position:relative;padding:16px 0 8px;margin-top:6px}
.pmap-unit-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pmap-unit-sub{font-size:12px;color:var(--muted)}
.pmap-ring{flex-shrink:0;background:var(--bg);border-radius:50%;position:relative;z-index:1;margin-left:8px}
.pmap-node{display:flex;gap:14px;align-items:flex-start;position:relative;padding:10px 12px 10px 0;margin:4px 0;cursor:pointer;border-radius:var(--r2);transition:.15s}
.pmap-node:hover .pmap-title{color:var(--accent)}
.pmap-dot{width:34px;height:34px;border-radius:50%;background:var(--surf2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;border:2px solid var(--border);position:relative;z-index:1;margin-left:8px}
.pmap-node.done .pmap-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.pmap-node.current{background:var(--surf);border:1px solid var(--accent);padding:12px;margin-left:-4px;box-shadow:var(--shadow)}
.pmap-node.current .pmap-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%, transparent)}
.pmap-node.up{opacity:.55}
.pmap-node.up:hover{opacity:.9}
.pmap-title{font-weight:600;font-size:14px}
.pmap-sub{font-size:12px;color:var(--muted)}

/* MASTERY BADGES (playtest Batch 5) — competence-framed, visible progress */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.badge-tile{border:1px solid var(--border);border-radius:var(--r2);padding:12px 8px;text-align:center;background:var(--surf2);opacity:.75}
.badge-tile.got{background:var(--surf);border-color:var(--accent);opacity:1}
.badge-tile.secret{border-style:dashed}
.badge-ico{font-size:22px;line-height:1.2}
.badge-name{font-size:12px;font-weight:700;margin-top:4px}
.badge-prog{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* STREAK + REVIEW CHIPS on the resume card (playtest Batch 5) */
.loop-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:12.5px;font-weight:600;color:#fff;margin:0 6px 10px 0}

/* READ-ALOUD → Grain "Say It Out Loud" card */
.ral-block{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:0;box-shadow:var(--shadow)}
.ral-head{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surf2);border-bottom:1px solid var(--border);font-family:var(--font);font-weight:600;font-size:13px;color:var(--text)}
.ral-head .lucide{width:16px;height:16px;color:var(--accent)}
/* The dark block, and one code line inside it. .ral-sql is the block; .ral-code
   is a single line of DAX within it, and it is the element carrying
   white-space:pre — which is why the mobile rule below has to wrap BOTH. */
.ral-sql{font-family:var(--mono);font-size:13px;background:var(--stone-900);color:var(--stone-100);padding:16px 18px;margin:0;white-space:normal;overflow-x:auto;line-height:1.7}
.ral-code{white-space:pre;color:var(--stone-100)}

/* Grain lesson-view helpers (story bridge, section eyebrow, auto-miss panel) */
.lesson-story{display:flex;gap:11px;align-items:flex-start;background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--r2);padding:13px 15px;margin-bottom:18px;font-size:.9rem;line-height:1.65;color:var(--stone-800)}
.lesson-story .lucide{width:18px;height:18px;color:var(--amber-600);flex-shrink:0;margin-top:2px}
.lesson-eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted);margin:0 0 9px;display:flex;align-items:center;gap:7px}
.lesson-eyebrow .lucide{width:15px;height:15px;color:var(--accent)}
.card h3 .lucide{width:17px;height:17px;color:var(--accent);vertical-align:-3px;margin-right:6px}
.quiz-wrap h3 .lucide{width:17px;height:17px;color:var(--accent);vertical-align:-3px;margin-right:6px}
/* Auto-recorded misses (replaces the old self-rating). */
.miss-panel{background:var(--surf);border:1px solid var(--border,var(--bord));border-radius:10px;padding:18px 20px;margin-top:16px}
.miss-panel.is-clean{border-color:var(--green,var(--ok,var(--success)))}
.miss-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text,var(--ink,var(--txt)));margin-bottom:4px}
.miss-head .lucide{width:17px;height:17px;color:var(--accent);flex-shrink:0}
.miss-panel.is-clean .miss-head .lucide{color:var(--green,var(--ok,var(--success)))}
.miss-sub{font-size:13.5px;line-height:1.55;color:var(--muted,var(--dim,var(--txt2)));margin:0}
.miss-items{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.miss-items li{font-size:14.5px;line-height:1.5;color:var(--text,var(--ink,var(--txt)))}
.miss-clear{margin-top:14px}
/* Task instructions. Mobile learning apps keep the prompt large, full-contrast
   and pinned to the top of the exercise so it stays readable while you work;
   16-18px at ~1.5 line-height is the mobile body-copy floor for readability. */
.drill-instruction{font-size:17px;line-height:1.55;color:var(--text,var(--ink,var(--txt)));font-weight:500;margin:0 0 14px}
@media(max-width:640px){
  .drill-instruction{position:sticky;top:56px;z-index:90;background:var(--surf);padding:10px 0 9px;border-bottom:1px solid var(--border,var(--bord))}
}

/* QUIZ */
.quiz-wrap{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-top:20px}
.quiz-wrap h3{margin-bottom:14px}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:11px 16px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);transition:.15s;overflow-wrap:anywhere}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:var(--leaf-50);border-color:var(--green);color:var(--leaf-700)}
.quiz-opt.wrong{background:var(--rust-50);border-color:var(--red);color:var(--rust-700)}
/* The result carries a mark as well as a hue, so it does not depend on telling
   green from red (9d43ede's second half). */
.quiz-opt.correct::after{content:"\2713";float:right;font-weight:800;margin-left:10px}
.quiz-opt.wrong::after{content:"\2715";float:right;font-weight:800;margin-left:10px}
.quiz-exp{margin-top:12px;padding:12px 14px;background:var(--surf);border-radius:var(--r2);font-size:13px;color:var(--muted);display:none}
.quiz-exp.show{display:block}

/* PRACTICE */
.drill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.drill-tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:.15s;text-align:center}
.drill-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.drill-tile .icon{font-size:1.6rem;margin-bottom:8px}
.drill-tile h3{font-size:.9rem;margin:0 0 4px}
.drill-tile p{font-size:11px;margin:0}
.drill-count{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px}

/* FILLS */
/* overflow-x:auto, because white-space:pre with nothing to catch it is how a
   long DAX line pushes the WHOLE PAGE sideways rather than scrolling inside its
   own block. Twelve of the fill drills did that at 375px. */
.fill-partial{font-family:var(--mono);font-size:13px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;margin-bottom:16px;white-space:pre;overflow-x:auto}

/* BUGS */
.code-broken{font-family:var(--mono);font-size:13px;background:var(--rust-50);border:1px solid var(--red);border-radius:var(--r2);padding:14px 16px;margin:10px 0;white-space:pre;overflow-x:auto;color:var(--rust-700)}
.code-fixed{font-family:var(--mono);font-size:13px;background:var(--leaf-50);border:1px solid var(--green);border-radius:var(--r2);padding:14px 16px;margin:10px 0;white-space:pre;overflow-x:auto;color:var(--leaf-700);display:none}
.code-fixed.show{display:block}
.bug-issue{font-size:13px;color:var(--red);margin:8px 0}
.hint-btn{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.hint-text{font-size:13px;color:var(--yellow);margin-top:8px;display:none}
.hint-text.show{display:block}

/* PARSONS */
.parsons-wrap{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap}
.parsons-col{flex:1;min-width:200px}
.parsons-col label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.parsons-pool,.parsons-answer{min-height:80px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:8px;display:flex;flex-direction:column;gap:6px}
.parsons-answer{border-color:var(--accent)}

/* DAX LAB */
.dax-search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:11px 14px;color:var(--text);font:inherit;font-size:14px;outline:none;margin-bottom:16px;transition:.15s}
.dax-search:focus{border-color:var(--accent)}
.dax-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:12px;cursor:pointer;transition:.15s}
.dax-item:hover{border-color:var(--accent)}
.dax-item-header{display:flex;align-items:center;gap:10px;margin-bottom:0}
.dax-item.open .dax-item-body{display:block}
.dax-item-name{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent)}
.dax-item-desc{font-size:13px;color:var(--muted);margin-left:auto}
.dax-item-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.dax-syntax{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px;white-space:pre;overflow-x:auto;color:var(--text)}
.dax-example{font-family:var(--mono);font-size:12px;background:var(--surf2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 var(--r2) var(--r2) 0;margin-bottom:8px;white-space:pre;overflow-x:auto;color:var(--accent)}
.dax-note{font-size:13px;color:var(--muted)}
.dax-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surf2);color:var(--muted);border:1px solid var(--border);margin-right:4px}

/* FLASHCARDS */
.flashcard-outer{perspective:1000px;height:200px;margin:20px 0;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.5s;border-radius:var(--r)}
.flashcard-inner.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.flashcard-front{background:var(--surf);border:1px solid var(--border)}
.flashcard-back{background:var(--surf2);border:1px solid var(--accent);transform:rotateY(180deg)}
.flashcard-term{font-size:1.2rem;font-weight:700}
.flashcard-def{font-size:.95rem;color:var(--muted);line-height:1.7}
.flashcard-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:12px}
.fc-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* GLOSSARY */
.gloss-search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:11px 14px;color:var(--text);font:inherit;font-size:14px;outline:none;margin-bottom:16px}
.gloss-search:focus{border-color:var(--accent)}
.gloss-item{border-bottom:1px solid var(--border);padding:14px 0}

.target-count{font-size:12px;color:var(--muted);margin-bottom:16px}
.skill-row2{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--border);cursor:pointer;transition:.15s;border-radius:6px}
.skill-row2:hover{background:var(--surf2)}
.skill-row2.is-near{background:var(--surf2);box-shadow:inset 3px 0 0 var(--accent)}
.sr-tick{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);font-family:var(--mono)}
.skill-row2.is-done .sr-tick{background:var(--green);border-color:var(--green);color:#fff}
.skill-row2.is-near .sr-tick{border-color:var(--accent);color:var(--accent)}
.sr-name{flex:1;font-size:13.5px;font-weight:600;min-width:130px}
.skill-row2.is-done .sr-name{color:var(--muted);font-weight:500}
.sr-meta{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
.sr-reps{font-size:11px;color:var(--muted);opacity:.8;white-space:nowrap}
/* The next-up rows on Home were inline-styled divs with an onclick and no
   class, so the keyboard upgrade could not select them. */
.next-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-top:1px solid var(--border);cursor:pointer}
.next-row:hover{background:var(--surf2)}
/* The unit's skill, on the path map's unit header. */
.pmap-unit-skill{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:2px}
.pmap-unit-skill.is-ready{color:var(--green)}

/* HELP LADDER - the partial answer: what you have been given, and the gap you
   still have to close yourself. */
.ladder-partial{font-family:var(--mono);font-size:13px;background:var(--stone-900);color:var(--stone-100);border-radius:var(--r2);padding:12px 14px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.ladder-partial .lp-gap{color:var(--clay-300);border-bottom:1.5px dashed var(--clay-400);padding:0 2px}
.ladder-step{font-size:12px;color:var(--muted);margin-top:8px}
/* Coach replies are escaped and then given back bold, italic and code, so they
   carry markup now and must not also be pre-wrapped. */
.v2-coach-resp code{font-family:var(--mono);font-size:12.5px;background:var(--surf2);padding:1px 5px;border-radius:4px}

/* Keyboard users have to be able to see where they are. Every clickable div in
   the kit gets role=button and tabindex=0 from upgradeClickables(). */
.pmap-node:focus-visible,.ord-chip:focus-visible,.skill-row2:focus-visible,.skill-strip:focus-visible,
.quiz-opt:focus-visible,.bug-choice:focus-visible,.flag-row:focus-visible,.next-row:focus-visible,
.path-tile:focus-visible,.drill-tile:focus-visible,.dax-item:focus-visible,.ws-spot:focus-visible,
.flashcard-outer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media(max-width:640px){
  .directive{padding:9px 0 8px;gap:7px}
  .directive .d-eyebrow{display:none}
  .directive p{font-size:16px;line-height:1.4}
  /* The directive owns the sticky slot under the nav now. .drill-instruction
     also goes sticky at top:56px on mobile, and a drill body still uses it for
     its secondary line ("Нажмите на фрагмент, который заполняет пропуск"), so without this
     two elements pin to the same offset and overlap. */
  .directive ~ .drill-instruction,.directive ~ * .drill-instruction{position:static;background:none;border-bottom:none;padding:0}
  /* .ral-code is the element carrying white-space:pre, so wrapping only its
     .ral-sql parent leaves a long DAX line sticking out of a 375px viewport and
     pushing the whole page sideways. Both wrap here, and .ral-sql keeps the
     overflow-x:auto from its base rule, so anything that still cannot wrap
     scrolls inside its own block rather than moving the page. */
  .ral-sql,.ral-code,.ladder-partial,.fill-partial{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
}

const DATA = {

LESSONS: [
  // UNIT 0
  {id:101, unit:"Часть 0: Прежде чем строить", title:"Как Power BI видит данные (таблица и зернистость)", sub:"Таблицы, строки и то, что представляет одна строка.",
   story:"Ваш менеджер говорит, что команда переходит на Power BI для создания всей отчетности. Прежде чем перетаскивать одно поле на холст, вам необходимо понять, как Power BI думает о данных: таблицах. Все — продажи, клиенты, продукты — живет в таблице, и в каждой таблице есть уровень детализации: что означает одна строка. Получите правильное уровень детализации, и каждая последующая мера и визуальный эффект будут иметь смысл.",
   intro:"Power BI работает с таблицами точно так же, как база данных или электронная таблица. Каждый источник данных, к которому вы подключаетесь, становится таблицей в вашей модели. Каждая таблица имеет строки (записи) и столбцы (поля). И в каждой таблице есть уровень детализации: что представляет собой одна строка. Одна строка = одна продажа? Одна строка = один клиент? Неправильная идентификация зерна является основной причиной большинства неверных показателей Power BI, особенно двойного подсчета в DAX.",
   ral:{code:"Таблица продаж: одна строка = одна транзакция\nКлиенты: одна строка = один уникальный клиент.\nТовары: одна строка = один артикул товара\nЕжедневный_Агг: одна строка = итоги за один день.",
     say:"Каждый стол имеет одно задание. Прежде чем строить какие-либо меры, изложите суть.",
     lines:[["Таблица","двумерная сетка: строки × столбцы — базовая единица данных в Power BI."],["Row (record)","одно наблюдение — одна продажа, один клиент, один продукт"],["Column (field)","один атрибут — Регион, Доход, Дата, Идентификатор продукта"],["Grain","что представляет собой одна строка — укажите это, прежде чем писать какую-либо меру"],["Двойной счет","что происходит, когда вы объединяете таблицы с разной степенью зернистости"]]},
   notes:"Представьте себе чек из магазина: чек — это одна покупка, но каждая строка в нем — это один товар — «уровень детализации» — это именно то, что обозначает строка. Звездообразная схема Power BI (одна таблица фактов + несколько таблиц измерений) разработана для обеспечения единообразия этой структуры. Ваша таблица продаж должна находиться на уровне транзакций; Таблицы «Продукты» и «Клиенты» имеют свою структуру. Правильное связывание их в представлении модели предотвращает двойной учет.",
   viz:{bars:[{label:"Продажи",value:90,display:"1 ряд = 1 продажа"},{label:"Клиенты",value:60,display:"1 строка = 1 клиент"},{label:"Товары",value:40,display:"1 ряд = 1 SKU"}],title:"Каждый стол — одно уровень детализации",caption:"Три стола, три зерна. Строки продаж находятся на уровне транзакции; Клиенты и продукты находятся на уровне организации. Свяжите их с их общими ключами, и меры останутся верными."},
   quiz:{q:"В вашей таблице «Продажи» есть одна строка для каждой позиции заказа, а не для каждого заказа. Где это уровень детализации действительно становится опасным?",opts:["В связях — объединение по ID заказа размножает строки и завышает итоги","В обычных мерах SUM — повторный подсчёт строк завышает итог","Везде — зернистость отдельных позиций всегда неверна для таблицы фактов.","Нигде — зернистость никогда не влияет на модель Power BI."],ans:0,exp:"Обычная сумма безопасна при любой зернистости — она добавляет каждую строку строки, поэтому итоговые суммы остаются правильными. Опасность носит реляционный характер: свяжите другую таблицу с ID заказа (который повторяется в разных позициях), и строки разветвятся, увеличивая каждую меру, пересекающую эту связь. Детализация отдельных позиций — это хорошая, даже стандартная, уровень детализации таблицы фактов; вам просто нужно связать ключи, которые уникальны с одной стороны."},

     like:"Стопка чеков и стопка сумок с покупками описывают один и тот же поход в магазин, но один листок бумаги — это целый визит, а одна сумка — один перевозчик. Прежде чем начинать складывать вещи, скажите, какую стопку вы держите в руках."},
   build:{q:"Вы подозреваете, что таблица «Продажи» содержит детализацию по позициям, а не по заказам. Какая пара мер доказывает это?",opts:["COUNTROWS(Sales) vs DISTINCTCOUNT(Sales[OrderID])","SUM(Sales[Revenue]) vs AVERAGE(Sales[Revenue])","COUNT(Sales[OrderID]) vs COUNTROWS(Sales) — всегда равно","MAX(Sales[OrderID]) vs MIN(Sales[OrderID])"],ans:0,exp:"COUNTROWS считает каждую строку; DISTINCTCOUNT подсчитывает уникальные идентификаторы заказов. Если они различаются, один заказ охватывает несколько строк — детализацию позиций. СУММА/СРЗНАЧ/МАКС говорят о значениях, а не о зернистости."},

  {id:102, unit:"Часть 0: Прежде чем строить", title:"Типы данных и почему они важны в Power BI", sub:"Почему несоответствия типов молча нарушают агрегаты.",
   story:"У вас есть концепция стола и зерна. Теперь следующее, что Power BI проверяет, прежде чем что-либо сделать: тип данных. Число, сохраненное в виде текста, не суммируется. Столбец даты, распознанный как текст, не позволит вам использовать аналитику времени. Power BI обозначает цветом каждый тип столбца в представлениях «Данные» и «Модель» — ранняя проверка и исправление типов избавит вас от путаницы на несколько часов позже.",
   intro:"Power BI назначает тип данных каждому столбцу: целое число, десятичное число, текст, дата, дата/время, правда/ложь и т. д. Тип определяет, что вы можете делать: вы можете суммировать числа, вы можете фильтровать дату по году, вы можете объединять текст. Неправильный тип = молчаливые ошибки — ваша СУММА возвращает пустое значение, ваш анализ времени не работает, ваша диаграмма ничего не показывает. Исправляйте типы в Power Query до того, как они достигнут вашей модели.",
   ral:{code:"Целое число → количество, идентификаторы, количества\nДесятичная дробь → цены, ставки, проценты\nТекст → имена, коды, категории\nДата → даты (не дата-время, если вам не нужно время)\nИстина/Ложь → логические флаги",
     say:"Прежде чем создавать показатели, проверьте тип каждого столбца. Число, хранящееся в виде текста, невидимо для SUM.",
     lines:[["Целое число","целые числа — количество, идентификаторы, количества"],["Десятичное число","с плавающей запятой — цены, курсы, вычисляемые поля"],["Текст","строки — имена, коды, метки регионов"],["Дата","календарные даты — включает функции анализа времени"],["Неправильный тип","столбец дохода, набранный как «Текстовые суммы», должен быть пустым — нет ошибки, просто неправильно"]]},
   notes:"Флаги Power Query указывают на проблемы со значком заголовка столбца. Желтый треугольник означает несовпадающий или предполагаемый тип. Всегда проверяйте типы на этапе «Измененный тип» — не доверяйте автоматическому обнаружению Power BI импортированных данных, особенно из CSV или Excel, где числа часто импортируются в виде текста.",

   parsons:{prompt:"Доход импортирован в виде текста. Организуйте ремонт, от начала до конца.",lines:["Открыть Power Query (преобразование данных)","Выберите столбец Выручка","Тип изменения: Текст → Десятичное число.","Закрыть и применить"],answer:[0,1,2,3]},
   explain:{is:"Power BI помечает каждый столбец типом данных — целое число, десятичное число, текст, дата — и эта метка определяет, какие действия разрешено делать столбцу.",
     use:"Вы проверяете типы в Power Query в тот момент, когда появляется источник, особенно все, что получено из CSV или Эксель. Столбец дохода с надписью «Текст» вообще ничего не дает, и никаких ошибок, о которых вы могли бы предупредить, нет.",
     like:"Почтовые отделения относятся к посылке и письму по-разному, даже если они весят одинаково. Поместите что-то не в тот слот, и оно не придет в норму — оно просто тихо никогда не придет."},
   build:{q:"Столбец «Дата» импортирован как «Текст», поэтому анализ времени невозможен. Где вы это исправляете?",opts:["Напишите вычисляемый столбец DAX, который преобразует текст в дату.","В Power Query измените тип столбца на Дата, затем нажмите «Закрыть и применить»","В визуализации измените способ агрегирования поля","Переименуйте столбец в «Дата», чтобы Power BI его обнаружил."],ans:1,exp:"Исправления типов относятся к Power Query, этапу Форма. Столбец преобразования DAX работает, но в вашей модели остается неработающий текстовый столбец и удваивается объем хранилища. Имя столбца не имеет ничего общего с его типом."},

   unlock:"Автоматическая вставка шага «Измененный тип» Power Query — это снимок его догадок, а не истины. Опытные аналитики воспринимают этот шаг как контрольный список для каждого нового источника — именно здесь импорт CSV незаметно превращает доходы в текст."
  },
  {id:103, unit:"Часть 0: Прежде чем строить", title:"Что означает «агрегат» в Power BI", sub:"Единственная идея, лежащая в основе каждой карты KPI и гистограммы.",
   story:"Ваша модель содержит много строк — по одной на каждую транзакцию, — а руководителю нужен общий доход. Агрегация объединяет их в один показатель: SUM складывает значения, COUNT подсчитывает значения, а AVERAGE вычисляет среднее. Визуализация Power BI показывает агрегированный результат, рассчитанный по строкам исходной таблицы. Эта идея лежит в основе мер DAX.",
   intro:"Каждая визуализация Power BI агрегирует строки в сводку. Например, диаграмма выручки по регионам показывает SUM(Sales[Revenue]) при фильтре Sales[Region] = \"Запад\". Карточка KPI без фильтра по региону показывает ту же меру по всей таблице. Агрегация выполняется и без явной формулы; меры DAX позволяют управлять ею явно.",
   ral:{code:"Общий доход = SUM(Sales[Revenue]) – явное агрегирование\nКоличество заказов = COUNTROWS(Sales) – подсчет строк = подсчет заказов\nСредний заказ = AVERAGE(Sales[Revenue]) – среднее значение по всем строкам.",
     say:"Мера — это именованная совокупность. Power BI сравнивает его с текущим контекстом фильтра — выбранным регионом, активным диапазоном дат, строкой в ​​таблице.",
     lines:[["Общий доход =","назовите меру — текст слева от знака равенства — это имя, которое вы увидите на панели «Поля»."],["SUM(Sales[Revenue])","СУММИРОВАНИЕ (сложение) каждого значения в столбце «Доход» таблицы «Продажи» — многие строки сворачиваются в одну сумму."],["Количество заказов = COUNTROWS(Продажи)","COUNTROWS (подсчитать количество строк) таблицы «Продажи» — одна строка на заказ, то есть это количество заказов."],["Средний заказ = AVERAGE(Sales[Revenue])","AVERAGE(взять среднее значение) столбца «Доход» — сумма, деленная на количество непустых строк."],["Контекст фильтра","активные фильтры — каждая мера, указанная выше, повторно оценивается по запросу среза, страницы или панели."]]},
   notes:"Когда вы перетаскиваете числовой столбец непосредственно в визуальный элемент, Power BI применяет неявное агрегирование (обычно SUM). Часто это то, чего вы хотите, но не всегда. Если вы перетаскиваете столбец «Доход», и в каждой строке вместо общего числа отображается одно число, Power BI выбирает «Не суммировать». Щелкните правой кнопкой мыши поле → Суммировать → Сумма, чтобы исправить это.",
   viz:{bars:[{label:"Запад",value:412},{label:"Восток",value:388},{label:"Север",value:195},{label:"Юг",value:284}],title:"SUM (Доход) по регионам — каждый столбец представляет собой агрегацию.",caption:"Каждая полоса сводит все строки транзакций для этого региона в одну СУММУ. Визуальный элемент не показывает необработанные строки — он показывает агрегацию. Это каждый визуальный элемент Power BI, каждый раз."},
   quiz:{q:"Вы перетаскиваете доход в поле «Значения» гистограммы и видите один отдельный столбец для каждой строки транзакции вместо одного общего столбца для каждого региона. Что случилось?",opts:["Вам необходимо добавить поле «Регион» в ось.","Для дохода установлено значение «Не суммировать».","Модель данных не имеет отношений","Сначала вам нужно написать меру DAX"],ans:1,exp:"«Не суммировать» означает, что Power BI рассматривает столбец как идентификатор строки, а не как агрегат. Щелкните правой кнопкой мыши поле «Доход» в разделе «Значения» и измените суммирование на «Сумма», чтобы получить один агрегированный столбец для каждой категории."},
   parsons:{prompt:"Расположите, что на самом деле происходит, когда гистограмма показывает доход Уэста — от необработанных строк до цифр на экране.",lines:["Каждая строка в таблице «Продажи»","Оставьте только те строки, где Регион = \"West\".","SUM(Sales[Revenue]) по сохранившимся строкам","Одна цифра — высота западной планки"],answer:[0,1,2,3]},
   explain:{is:"Агрегирование — это свертывание множества строк в одно число — сумму, количество, среднее значение — поэтому на диаграмме может отображаться один столбец вместо десяти тысяч.",
     use:"Каждая карточка KPI и каждая полоска, которую вы строите, представляют собой совокупность всего, что отфильтровано в данный момент. Зная это, вы объясняете, почему один показатель показывает разные числа на каждом столбце одной и той же диаграммы.",
     like:"Учитель, наблюдающий за тем, как четыреста детей собираются в собрание, не описывает каждого ребенка. Она поворачивается к голове и произносит одно предложение: «Они все подходят»."},
   build:{q:"Перетаскивание доходов в значения дает вам неявную СУММУ. Какая мера является явной версией того же самого?",opts:["Доход = Продажи[Выручка]","Общий доход = SUM(Sales[Revenue])","Общий доход = COUNTROWS(Продажи)","Общий доход = AGGREGATE(Продажи[Выручка])"],ans:1,exp:"SUM(Sales[Revenue]) — это именно то, что делает неявное агрегирование, записанное там, где вы можете его видеть и контролировать. Ссылка на пустой столбец не является допустимой мерой, COUNTROWS подсчитывает строки вместо суммирования, а AGGREGATE не является функцией DAX."},
   close:"Теперь вы можете увидеть агрегацию внутри каждого визуального элемента — свертывание множества строк в одно число. Далее: трехфазный цикл, который организует каждый проект Power BI.",
   unlock:"Как только вы прочитаете каждый визуальный элемент как «контекст фильтра + агрегирование», отладка перевернется: неправильное число никогда не будет загадочным — либо неправильные строки прошли фильтр, либо к ним применялись неправильные математические вычисления. Каждая ошибка DAX — одна из этих двух."
  },
  {id:104, unit:"Часть 0: Прежде чем строить", title:"Загрузка, форма и анализ (цикл Power BI)", sub:"Трехэтапный рабочий процесс, которому следует каждый проект Power BI.",
   story:"Вы понимаете агрегацию. Теперь цикл Power BI, на котором построена каждая панель мониторинга: «Загрузка» (внесение данных с помощью «Получить данные»), «Формирование» (очистка и преобразование в Power Query), «Анализ» (создание показателей и визуальных элементов на холсте отчета). На каждом этапе есть свои инструменты и свои ошибки. Знание того, на каком этапе вы находитесь, подскажет вам, куда смотреть, если что-то пойдет не так.",
   intro:"Power BI состоит из трех этапов: 1. <strong>Нагрузка</strong> — подключитесь к источнику (Excel, CSV, SQL, SharePoint, API) через Получите данные. 2. <strong>Форма</strong> — очистка и преобразование в Power Query (переименовывание столбцов, исправление типов, удаление пробелов, отключение сводных таблиц). 3. <strong>Анализировать</strong> — постройте модель данных (отношения), напишите показатели DAX и разместите визуальные элементы на холсте отчета. Каждый этап — это подходящее место для конкретных задач — редактирование имени столбца принадлежит Power Query, а не DAX.",
   ral:{code:"Этап 1 — Загрузка: Главная страница → Получить данные → выбрать источник.\nЭтап 2. Форма: редактор Power Query → преобразование\nЭтап 3. Анализ: представление модели + холст отчета + DAX",
     say:"Нагрузка переносит данные. Форма делает их чистыми и правильными. Анализ строит показатели и визуальные эффекты. Делайте все в таком порядке: исправить неправильную фазу всегда сложнее.",
     lines:[["Получить данные","Фаза загрузки — подключение к CSV, Excel, SQL, SharePoint, API."],["Power Query","Фаза формирования — преобразуйте до того, как данные достигнут вашей модели."],["Вид модели","Фаза анализа — определение связей между таблицами (звездообразная схема)"],["DAX-мера","Фаза анализа — запись агрегатов и вычислений."],["Неправильная фаза","очистка данных в DAX вместо Power Query = медленные, нестабильные отчеты"]]},
   notes:"Самая распространенная ошибка — выполнение работы с фигурой на этапе анализа. Добавление вычисляемого столбца очистки в DAX, хотя вы должны были исправить его в Power Query, делает вашу модель более тяжелой и ее сложнее поддерживать. Спросите: «Изменяет ли это данные до того, как они достигнут моей модели?» Если да — Мощность запроса. Если нет — DAX.",
   viz:{html:`<div style="display:flex;gap:8px;font-size:11px;flex-wrap:wrap"><div style="flex:1;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:10px"><div style="font-weight:700;color:var(--accent);margin-bottom:6px">1. Загрузка</div><div style="color:var(--txt2)">Получить данные → подключиться к источнику → таблицы появятся в вашей модели.</div></div><div style="font-size:16px;color:var(--accent);align-self:center">→</div><div style="flex:1;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:10px"><div style="font-weight:700;color:var(--accent);margin-bottom:6px">2. Форма</div><div style="color:var(--txt2)">Power Query → исправить типы, очистить столбцы, удалить пробелы</div></div><div style="font-size:16px;color:var(--accent);align-self:center">→</div><div style="flex:1;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:10px"><div style="font-weight:700;color:var(--accent);margin-bottom:6px">3. Анализируйте</div><div style="color:var(--txt2)">Представление модели → отношения · DAX → меры · Холст отчета → визуальные элементы</div></div></div>`,caption:"Трехфазная петля. Загрузить → Форма → Анализировать. Выполнение действий не по порядку (исправление данных в DAX, построение визуальных элементов до установки связей) вызывает наиболее распространенные разочарования в Power BI."},
   quiz:{q:"Вы заметили, что столбец называется «dt_order» и должен быть «Дата заказа». Куда его переименовать?",opts:["В вычисляемом столбце DAX: Дата заказа = [dt_order]","В Power Query переименуйте столбец на этапе преобразования данных","На холсте отчёта переименуйте подпись визуализации","В представлении модели переименуйте таблицу"],ans:1,exp:"Переименование столбца — это задача Форма: оно должно произойти в Power Query до того, как данные достигнут вашей модели. Выполнение этого в DAX создает дублирующийся столбец; выполнение этого на холсте отчета изменяет только метку одного визуального элемента, а не имя поля повсюду."},
   parsons:{prompt:"Расположите три этапа каждого проекта Power BI в том порядке, в котором они происходят.",lines:["Загрузка: Получить данные → подключиться к источнику","Форма: Power Query → исправить типы, очистить столбцы, удалить пробелы.","Анализ: отношения, показатели DAX, визуальные эффекты на холсте."],answer:[0,1,2]},
   explain:{is:"Каждый проект Power BI выполняет одни и те же три этапа в одном и том же порядке: загрузка вводит данные, форма очищает их, анализ строит показатели и визуальные элементы.",
     use:"Вы называете фазу, прежде чем что-либо исправить. Неправильный номер в отчете прослеживается в обратном порядке через три, и устранение проблемы с формой с помощью DAX на этапе анализа всегда требует больше усилий, чем исправление ее с того места, где она началась.",
     like:"Приготовление еды: покупки, затем измельчение, затем сковорода. Никто не режет по дороге домой из магазина и не спасает немытый лук-порей, когда он уже жарится."},
   build:{q:"В импортированном CSV-файле внизу есть 40 пустых строк, которые загрязняют ваши подсчеты. Какая фаза их удаляет?",opts:["Загрузить — выберите другой разъем","Форма — удалите пустые строки в Мощность запроса.","Анализируйте — напишите меру DAX, которая пропускает пробелы.","Анализируйте — фильтруйте каждый визуальный элемент, чтобы исключить пробелы."],ans:1,exp:"Удаление ненужных строк — это задача Форма: выполните ее один раз в Power Query, и она будет выполняться повторно при каждом обновлении. Обходной путь DAX или визуальный фильтр приходится повторять повсюду, в результате чего в вашей модели остаются грязные строки."},
   close:"Вы можете указать, к какой фазе относится любая задача, и это подскажет вам, где что исправить. Это модуль 0: зернистость, типы, агрегация и цикл. Далее: обзор интерфейса рабочего стола, где все это происходит.",
   unlock:"«К какой фазе это относится?» также ответ на собеседовании. На вопрос, как вы будете очищать беспорядочные данные в Power BI, начиная с «в Power Query, прежде чем они достигнут модели — чтобы очистка повторялась при обновлении», означает, что вы действительно отправили отчеты."
  },
  // UNIT 1
  {id:1, unit:"Глава 1: Интерфейс и данные", title:"Интерфейс Power BI", sub:"Управляйте рабочим столом как профессионал",
   story:"У вас есть ментальная модель: таблицы с зернистостью, типами, агрегацией, трехфазным циклом. Теперь откройте Рабочий стол Power BI и сориентируйтесь. Три представления слева — Отчет, Данные, Модель. Панель полей справа. Изучите планировку прямо сейчас, чтобы перестать искать вещи, когда начнется настоящая работа.",
   intro:"Рабочий стол Power BI похож на мастерскую с тремя столами: один для просмотра данных, другой для соединения таблиц и третий для составления отчета. Рабочий стол Power BI имеет три представления и набор панелей, которые управляют всем. Прежде чем что-либо строить, зная <em>где живут вещи</em> экономит часы поиска.",
   ral:{
     code:"Просмотр отчета → холст + визуализации\nПросмотр данных → просмотр необработанных данных таблицы\nПредставление модели → управление связями между таблицами",
     say:"Три представления в Рабочий стол Power BI: представление отчета — это холст, представление данных — необработанные таблицы, а представление модели — место, где вы управляете связью таблиц.",
     lines:[
       ["Просмотр отчета","где вы создаете и размещаете визуальные эффекты на холсте"],
       ["Просмотр данных","показывает фактические строки и столбцы загруженных таблиц"],
       ["Вид модели","где вы рисуете отношения и управляете ими — вид диаграммы"],
       ["Панель полей","правая часть — все ваши таблицы и столбцы, перетащить отсюда"],
       ["Панель визуализаций","правая часть — выбор типа диаграммы, настройка полевых скважин"]
     ]
   },
   notes:"Панель «Фильтры» (справа) имеет три уровня: визуальный, страница и отчет. Фильтр, примененный на уровне отчета, влияет на каждую страницу. Начните с фильтров на уровне отчета для вашего диапазона дат.",
   viz:{title:"Рабочий стол Power BI",html:`<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:11px;display:flex">
     <div style="flex:1;padding:26px 10px;text-align:center;color:var(--dim);border-right:1px solid var(--border)">🖼️ Холст отчета — сюда помещаются ваши визуальные эффекты.</div>
     <div style="width:104px;padding:9px;border-right:1px solid var(--border);background:var(--surf2)"><div style="font-weight:700">Визуализации</div><div style="margin-top:6px;color:var(--dim)">📊 📈 🥧 🔢</div><div style="color:var(--dim);margin-top:6px">Ось/Значения/Легенда</div></div>
     <div style="width:96px;padding:9px;background:var(--surf2)"><div style="font-weight:700">поля</div><div style="margin-top:6px;color:var(--dim)">▸ Продажи</div><div style="color:var(--dim)">▸ Клиенты</div><div style="color:var(--dim)">▸ Дата</div></div>
   </div>`,caption:"Три панели, которые вы будете использовать постоянно: холст отчета (в центре), где находятся визуальные элементы, панель «Визуализации» (выберите диаграмму, заполните ее поля) и панель «Поля», в которой перечислены все таблицы и столбцы."},
   quiz:{q:"Какое представление Рабочий стол Power BI позволяет видеть и управлять связью таблиц друг с другом?",opts:["Просмотр отчета","Просмотр данных","Вид модели","Панель фильтров"],ans:2,exp:"Представление модели отображает диаграмму отношений. Здесь вы перетаскиваете ключевые столбцы, чтобы создавать или редактировать связи."},
   parsons:{prompt:"Свежие данные только что загружены. Организуйте путь проверки работоспособности через три представления: сначала необработанные строки, затем отношения, затем построение.",lines:["Просмотр данных — выборочная проверка загруженных строк и типов.","Представление модели — убедитесь, что отношения соединяются правильно.","Представление отчета — создайте визуальный элемент на холсте."],answer:[0,1,2]},
   explain:{is:"Рабочий стол Power BI имеет три представления: представление отчета — это холст, на котором размещаются визуальные элементы, представление данных — необработанные таблицы, а представление модели — это место, где таблицы связаны друг с другом.",
     use:"Вы постоянно перемещаетесь между всеми тремя. Когда визуальный элемент показывает число, которое выглядит неправильно, вы идете назад — необработанные строки в представлении данных, затем связь в представлении модели — прежде чем прикоснуться к самой диаграмме.",
     like:"В гараже есть выставочный зал, складское помещение и мастерская. Клиенты видят только первую из них, но ничто на этой площадке не заслуживает доверия, если кто-нибудь не побывал в двух других."},
   build:{q:"Вам необходимо подключить Продажи[идентификатор клиента] к Клиенты[идентификатор клиента]. Куда ты идешь?",opts:["Просмотр отчета — перетащите оба поля в один визуальный элемент.","Просмотр данных — отсортируйте обе таблицы по Идентификатор клиента.","Представление модели — перетащите между двумя ключевыми столбцами.","Панель «Фильтры» — добавьте фильтр по Идентификатор клиента."],ans:2,exp:"Отношения создаются в представлении модели путем перетаскивания между ключевыми столбцами. Размещение полей в одном визуальном элементе не связывает таблицы — без связи визуальный элемент отображает одну и ту же повторяющуюся сумму вместо количества по каждому клиенту."},
   close:"Вы знаете, где все находится: отчет для построения, данные для проверки, модель для связи. Далее: получение данных — Получить данные и Мощность запроса.",
   unlock:"Самая быстрая привычка интерфейса — это не сочетание клавиш, а проверка представления модели сразу после загрузки данных. Почти каждая проблема «моё изображение повторяет одно и то же число» видна здесь как отсутствующая линия связи, прежде чем вы потратите время на восстановление диаграмм."
  },
  {id:2, core:true, unit:"Глава 1: Интерфейс и данные", title:"Подключение к данным", sub:"Получите основы данных и Power Query",
   story:"Вы знаете планировку. Первый шаг в каждом проекте: получение данных — укажите Power BI на источник (CSV, Excel, SQL, SharePoint) и извлеките таблицы. Power Query — это уровень формирования, который открывается автоматически — переименовывайте столбцы, исправляйте типы, удаляйте пробелы — прежде чем данные когда-либо коснутся вашей модели.",
   intro:"Загрузка данных похожа на разбор покупок: команда Получить данные («Получить данные») загружает источники, а Редактор Power Query — рабочая поверхность, где данные очищают до их попадания в модель. Power BI умеет читать данные из множества источников. Сначала загрузите их, затем приведите в порядок в редакторе Мощность запроса.",
   ral:{
     code:"Главная → Получение данных → Excel/SQL Server/Веб/...\n↓\nРедактор Power Query (преобразование данных)\n↓\nЗакрыть и применить → данные поступают в модель",
     say:"На ленте «Главная» нажмите «Получить данные» для загрузки из Excel, SQL Server, Интернета или других источников. Данные проходят через Power Query для очистки и преобразования, а затем метод Закрыть & Применить фиксирует их в модели.",
     lines:[
       ["Получить данные","точка входа — выберите тип источника"],
       ["Редактор Power Query","полная среда ETL — переименовывайте столбцы, фильтруйте строки, изменяйте типы"],
       ["Применяемые шаги","каждое преобразование записывается как шаг — неразрушающий метод"],
       ["Закрыть и применить","сохраняет ваш запрос и загружает данные в модель"],
       ["Обновить","повторно запускает ваш запрос к источнику, чтобы получить новые данные"]
     ]
   },
   notes:"Всегда проверяйте типы данных в Power Query — столбец даты, загруженный как текст, нарушит работу каждой функции DAX с анализом времени. Найдите значок типа слева от имени каждого столбца.",
   viz:{title:"Редактор Power Query",html:`<div style="display:grid;grid-template-columns:160px 1fr;gap:10px;font-size:11px">
     <div style="border:1px solid var(--border);border-radius:6px;padding:9px;background:var(--surf2)"><div style="font-weight:700">Применяемые шаги</div><div style="margin-top:6px;color:var(--dim)">1. Источник</div><div style="color:var(--dim)">2. Продвигаемые заголовки</div><div style="color:var(--dim)">3. Измененный тип</div><div style="color:var(--dim)">4. Удалены дубликаты</div></div>
     <div style="border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--dim);display:flex;align-items:center">🔧 Очистите и измените данные здесь, затем <b style="color:var(--accent);margin:0 4px">Закрыть и применить</b> загружает его в модель.</div>
   </div>`,caption:"Power Query — это место, где данные очищаются еще до того, как они попадут в ваш отчет. Каждое преобразование записывается как «Прикладной шаг», поэтому вся очистка автоматически повторяется при каждом обновлении данных."},
   quiz:{q:"Где вы очищаете и преобразуете данные перед их загрузкой в ​​модель Power BI?",opts:["Холст просмотра отчета","Вид модели","Редактор Power Query","Строка формул DAX"],ans:2,exp:"Редактор Power Query (преобразование данных) — это уровень ETL. Изменения здесь записываются как «Примененные шаги» и повторяются при каждом обновлении."},
   parsons:{prompt:"Организуйте рабочий процесс загрузки данных от первого клика до получения свежих данных в следующем месяце.",lines:["Главная → Получить данные → выбрать источник","Редактор Power Query — очистка и преобразование","Закрыть и применить — загрузить в модель","Обновить — повторно выполнить шаги для новых данных."],answer:[0,1,2,3]},
   explain:{is:"Получение данных подключает Power BI к источнику — Excel, SQL Server, веб-странице — и все, что вы затем делаете для его очистки, записывается в Power Query в виде списка прикладных шагов.",
     use:"Поскольку очистка записывается, а не выполняется вручную, Обновить воспроизводит каждый шаг с учетом новых данных. В этом разница между отчетом, который поддерживается сам по себе, и отчетом, который вы перестраиваете каждый понедельник утром.",
     like:"Записывайте рецепт по мере его приготовления. На следующей неделе вам не придется вспоминать, что вы сделали — вы снова зайдете на ту же страницу и получите тот же ужин."},
   build:{q:"В исходном CSV-файле неправильно названы столбцы и введены текстовые числа. Когда вы их исправите?",opts:["После загрузки — исправьте их с помощью вычисляемых столбцов DAX.","В Power Query до нажатия «Закрыть и применить»","На панели форматирования каждой визуализации","Редактируйте CSV вручную перед каждым обновлением."],ans:1,exp:"Исправьте это один раз в Power Query, и прикладные шаги будут повторяться при каждом обновлении. DAX исправляет раздувание модели, визуальное форматирование маскирует только одну диаграмму, а ручное редактирование источника прекращается при первом обновлении кем-то другим."},
   close:"Вы можете загружать данные и очищать их таким образом, чтобы они выдерживали каждое обновление. Далее: ваш первый визуальный элемент — тип диаграммы и полевые колодцы.",
   unlock:"Прикладные шаги делают Power Query самодокументируемым: список шагов ЯВЛЯЕТСЯ контрольным журналом всего, что делается с данными. Когда заинтересованная сторона спрашивает: «Вы исключили тестовые заказы?», ответом является название шага, а не воспоминание."
  },
  {id:3, unit:"Глава 1: Интерфейс и данные", title:"Создайте свой первый визуальный элемент", sub:"Перетаскивайте и настраивайте",
   story:"Данные загружаются и формируются. Теперь основной ход Power BI: щелкните нужный тип визуального элемента, затем перетащите поля, чтобы назначить их. Для гистограммы требуется категория на оси и показатель в значениях. Power BI выполняет агрегацию автоматически. На практике это этап анализа.",
   intro:"Создание визуального элемента похоже на заполнение формы: выберите диаграмму, а затем поместите поля в ее пустые поля (поля). Все визуальные элементы в Power BI начинаются одинаково: выберите тип диаграммы, затем перетащите поля в три области полей — «Ось», «Значения» и «Легенда». Остальное форматирование.",
   ral:{
     code:"1. Щелкните тип диаграммы на панели «Визуализации».\n2. Перетащите поле на Ось → по чему группировать\n3. Перетащите поле в «Значения» → что измерять.\n4. Перетащите поле в Легенду → как назначить цветовую маркировку",
     say:"Выберите тип диаграммы на панели «Визуализации», перетащите поле в «Ось», чтобы указать, по чему вы группируете, перетащите поле в «Значения», чтобы указать, что вы измеряете, затем перетащите поле в «Легенду», чтобы задать цветовой код по третьему измерению.",
     lines:[
       ["ось","группировка по оси X — обычно категория или дата"],
       ["Значения","показатель по оси Y — обычно число для агрегирования"],
       ["Легенда","разбивает визуальное изображение на серии с цветовой кодировкой"],
       ["Стрелки детализации","появиться в правом верхнем углу визуального элемента — развернуть иерархию дат"],
       ["Визуальная панель «Формат»","значок кисти — цвета, метки, заголовки, границы"]
     ]
   },
   notes:"Если вы перетащите числовой столбец в ось вместо значений, Power BI попытается агрегировать его. Используйте раскрывающийся список рядом с полем в лунке, чтобы изменить агрегацию (Сумма, Среднее, Количество и т. д.).",
   viz:{title:"Доход по регионам",bars:[{label:"Запад",value:412,display:"$412"},{label:"Восток",value:388,display:"$388"},{label:"Юг",value:284,display:"$284"},{label:"Север",value:195,display:"$195"}],caption:"Перетащите регион на ось и доход в значения. Power BI рисует для вас эту гистограмму без ввода формул."},
   quiz:{q:"В полевых колодцах Power BI какая скважина контролирует ось Y (что измеряется)?",opts:["ось","Значения","Легенда","Подсказки"],ans:1,exp:"Значения — это место, куда вы помещаете измеряемое числовое поле. Power BI автоматически агрегирует их (по умолчанию сумма). Ось управляет группировкой (ось X)."},
   parsons:{prompt:"Постройте «Доход по регионам, с разделением по каналам» — расставьте шаги.",lines:["Щелкните значок гистограммы на панели «Визуализации».","Перетащите регион на ось","Перетащите доход в значения","Перетащите канал в легенду"],answer:[0,1,2,3]},
   explain:{is:"Визуальный элемент — это тип диаграммы плюс три области полей: ось — это то, по чему вы группируете, значения — это то, что вы измеряете, легенда — это необязательное разделение цветов.",
     use:"Эти три области используются почти в каждой диаграмме; меняется только значок. В выпадающем меню поля в области «Значения» можно переключить сумму на среднее — эту настройку часто упускают.",
     like:"Выбираем объектив, затем решаем, где стоять и на что наводить. Замена объектива не меняет того, что находится перед вами, а положение в неправильном месте портит снимок, какой бы объектив вы ни выбрали."},
   build:{q:"Вам нужна средняя стоимость заказа по регионам, но на диаграмме показан суммарный доход. Что вы меняете?",opts:["Переместите доход из значений в ось","Переключите раскрывающийся список «Значения дохода» на «Среднее»","Перетащите регион в легенду вместо оси","Добавьте второе поле «Доход» в «Значения»."],ans:1,exp:"Агрегация находится в поле в колодце «Значения» — в раскрывающемся списке сумма переключается на «Среднее», «Количество», «Мин» или «Макс». Перемещение полей между скважинами меняет то, что сгруппировано или измерено, а не то, как это агрегируется."},
   close:"Вы можете создать визуальный элемент и сознательно управлять его агрегацией. Далее: отношения — использование полей из нескольких таблиц в одном визуальном элементе.",
   unlock:"Колодец легенды — это самый дешевый множитель аналитической информации в Power BI: одно перетаскивание превращает «доход по регионам» в «доход по регионам И каналам» — представление сравнения, которое заинтересованные стороны обычно хотели, но не знали, о чем просить."
  },
  {id:4, core:true, unit:"Глава 1: Интерфейс и данные", title:"Отношения и модель данных", sub:"Схема «звезда» и как Power BI объединяет таблицы",
   story:"Вы можете строить визуальные эффекты из одной таблицы. Но в вашей таблице продаж нет категории продуктов — она находится в отдельной таблице продуктов. Модель данных — это место, где вы сообщаете Power BI, как связаны таблицы. Соедините идентификатор продукта заказа с идентификатором продукта (схема «звезда»), и каждый визуальный элемент сможет использовать поля из обеих таблиц без какого-либо синтаксиса соединения.",
   intro:"Модель данных подобна узловому аэропорту: одна центральная таблица фактов посередине, таблицы измерений в качестве пунктов назначения, и все они связаны прямыми маршрутами (ключами). Модель данных — это несколько таблиц, соединенных ключами. Power BI использует звездообразную схему — одну центральную таблицу фактов, окруженную таблицами измерений. Сделайте это правильно, и каждый визуальный эффект будет работать.",
   ral:{
     code:"Таблица фактов: продажи (идентификатор заказа, идентификатор клиента, идентификатор продукта, сумма, дата)\n      │ │ │\n  Клиенты Продукты Даты\n  (идентификатор клиента, Имя) (Идентификатор продукта, Имя) (Дата, Месяц, Год)",
     say:"Звездчатая схема помещает таблицу фактов продаж посередине (события: кто и когда купил) с соединяющимися таблицами измерений — «Клиенты», «Продукты», «Даты» — которые содержат описательные детали.",
     lines:[
       ["Таблица фактов","большая таблица с числовыми событиями — строки продаж, транзакции"],
       ["Таблица размеров","таблицы поиска — кто, что, когда — используются для фильтрации и группировки"],
       ["отношение","линия между таблицами по общему ключу — стандартно один ко многим"],
       ["Один ко многим","одна строка измерения связана со многими строками таблицы фактов"],
       ["Направление перекрестного фильтра","контролирует, какая таблица фильтрует другую — обычно одну (тусклый → факт)"]
     ]
   },
   notes:"Когда каждая из двух таблиц может соответствовать множеству строк в другой, Power BI похож на почтового перевозчика с двумя допустимыми маршрутами к одному и тому же дому — он не может быть уверен, по какому пути должен пройти фильтр. По возможности избегайте отношений «многие ко многим»; они вызывают именно такую ​​двусмысленность. Если обеим таблицам фактов требуется измерение даты, создайте отдельную таблицу дат и свяжите с ней каждую таблицу фактов.",
   viz:{title:"Схема звезды",html:`<div style="text-align:center;font-size:11px">
     <div style="display:flex;justify-content:center;gap:22px;margin-bottom:10px"><div style="border:1px solid var(--dim-blue);border-radius:6px;padding:6px 11px;color:var(--dim-blue)">📋 Клиенты</div><div style="border:1px solid var(--dim-blue);border-radius:6px;padding:6px 11px;color:var(--dim-blue)">📋 Дата</div></div>
     <div style="border:2px solid var(--accent);border-radius:6px;padding:8px 16px;display:inline-block;color:var(--accent);font-weight:700">⭐ Продажи (факт)</div>
     <div style="display:flex;justify-content:center;gap:22px;margin-top:10px"><div style="border:1px solid var(--dim-blue);border-radius:6px;padding:6px 11px;color:var(--dim-blue)">📋 Продукты</div><div style="border:1px solid var(--dim-blue);border-radius:6px;padding:6px 11px;color:var(--dim-blue)">📋 Регион</div></div>
   </div>`,caption:"Звездообразная схема: одна центральная таблица фактов (Продажи — измеряемые вами цифры), окруженная таблицами измерений (Клиенты, Товары, Дата, Регион — описания). Их связывают отношения, поэтому срез по любому измерению фильтрует факты."},
   quiz:{q:"Что представляет собой таблица фактов в звездообразной схеме?",opts:["Таблица поиска с названиями категорий","Центральная таблица транзакций","Таблица измерений даты","Любая таблица с первичным ключом"],ans:1,exp:"Таблица фактов содержит измеримые события — строки продаж, клики, заказы. Таблицы измерений (клиенты, товары, даты) подключаются к нему через ключи и используются для фильтрации и группировки."},
   parsons:{prompt:"Организуйте построение звездообразной схемы: от идентификации таблиц до настройки направления фильтра.",lines:["Определите таблицу фактов: Продажи — числовые события.","Определите измерения: клиенты, продукты, даты.","Свяжите ключ каждого измерения с соответствующим столбцом «Продажи».","Установить направление перекрестного фильтра: одиночное, измерение → факт."],answer:[0,1,2,3]},
   explain:{is:"Звездообразная схема помещает одну таблицу фактов событий посередине — продажи, клики, заказы — с таблицами измерений описаний, присоединяющимися к ней по общим ключам.",
     use:"You build it in Model View before you build a single visual. Get the one-to-many directions right and fields from different tables combine correctly in one chart; get them wrong and totals inflate with no error appearing.",
     like:"Представьте журнал регистрации в центре стойки, а по бокам — список номеров и график сотрудников. Журнал фиксирует события, а два других списка поясняют, кто участвовал и где это произошло."},
   build:{q:"Клиенты имеют одну строку для каждого клиента; В разделе «Продажи» имеется много строк для каждого клиента. Какие отношения Power BI должен создать с идентификатор клиента?",opts:["Многие ко многим, в обоих направлениях","Один ко многим, клиенты на одной стороне","Один к одному — каждая таблица хранит свои строки.","Нет связи — вместо этого используйте объединенную таблицу"],ans:1,exp:"Одна строка на каждого клиента на стороне измерения, множество строк продаж на стороне факта — классический подход «один ко многим». Связь «многие-ко-многим» с фильтрацией в обоих направлениях создает неоднозначные пути, а объединение таблиц отбрасывает звездообразную схему."},
   close:"Вы можете связать звездообразную схему: факты посередине, измерения вокруг них, фильтры, действующие в одну сторону. Вот и закончился модуль 1. Далее: DAX — вычисляемые столбцы и меры.",
   unlock:"Когда модель ведет себя некорректно, старшие аналитики считывают маркеры 1 и * на линиях связи, прежде чем прикасаться к любому DAX. Знак * там, где должна быть 1, означает дублирование клавиш на стороне «единицы» — разветвление из урока 1, нарисованное прямо на диаграмме."
  },
  // UNIT 2
  {id:5, core:true, unit:"Глава 2: DAX и меры", title:"Вычисляемые столбцы и меры", sub:"Контекст строки и контекст фильтра",
   story:"Ваша модель подключена. Теперь есть два способа создания новых значений в Power BI: вычисляемый столбец выполняется построчно и сохраняет результат в таблице — как заполненная формула Эксель. Мера запускается во время запроса и учитывает все активные фильтры. Показатели почти всегда соответствуют ключевым показателям эффективности и агрегатам.",
   intro:"Вычисляемые столбцы и меры аналогичны приготовлению еды или приготовлению еды на заказ: столбец заранее подготавливает значение для каждой строки и сохраняет его; мера готовит на месте только то, что просит визуал. Это самое важное концептуальное различие в DAX. Вычисляемые столбцы вычисляются построчно при загрузке данных. Меры вычисляются во время запроса на основе того, что в данный момент отфильтровано. <em>Если синтаксис DAX выглядит незнакомым, значит, он во многом заимствован из формул Excel — просмотрите комплект Excel, если хотите освежить знания перед тем, как приступить к делу.</em>",
   ral:{
     code:"-- Вычисляемый столбец (хранится в таблице, строка за строкой)\nПрибыль = Sales[Revenue] – Sales[Cost]\n\n-- Измерение (вычисляется динамически в контексте фильтра)\nОбщая прибыль = SUM(Sales[Profit])",
     say:"Вычисляемый столбец выполняется построчно, когда данные загружаются и сохраняются — например, прибыль равна доходу минус затраты. Показатель вычисляется «на лету» в соответствии с текущим контекстом фильтра — например, «Общая прибыль» равна сумме столбца «Прибыль».",
     lines:[
       ["-- Расчетный столбец","комментарий отмечает первый шаблон: хранится в таблице, вычисляется построчно при загрузке данных"],
       ["Прибыль =","назовите новый столбец — он появится в таблице «Продажи» как любое другое поле."],
       ["Sales[Revenue] - Sales[Cost]","вычтите (уберите) стоимость этой строки из дохода этой строки — контекст строки предоставляет одно значение для каждой строки"],
       ["-- Мера","второй шаблон: ничего не сохраняется — вычисляется заново каждый раз, когда визуальный элемент запрашивает"],
       ["Общая прибыль = SUM(Sales[Profit])","СУММИРУЙТЕ (складывайте) сохраненные значения прибыли во всех строках, которые пропускает текущий контекст фильтра."]
     ]
   },
   notes:"Вычисляемый столбец записывает результат в каждую строку — как подпись на папке в картотеке. Мера вычисляет результат заново при каждом запросе. Используйте меры для агрегатов (SUM, COUNT, AVERAGE), а вычисляемые столбцы — для классификации отдельных строк.",
   viz:{title:"вычисляемый столбец и мера",html:`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;font-size:11px">
     <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
       <div style="background:var(--surf2);padding:5px 10px;font-weight:700;border-bottom:1px solid var(--border)">Вычисляемый столбец — сохраняется для каждой строки</div>
       <table style="border-collapse:collapse;font-family:var(--mono)"><thead><tr><th style="padding:4px 10px;text-align:left;color:var(--dim)">Выручка</th><th style="padding:4px 10px;text-align:left;color:var(--dim)">Затраты</th><th style="padding:4px 10px;text-align:left;color:var(--accent)">Прибыль</th></tr></thead><tbody>
       <tr><td style="padding:4px 10px">200</td><td style="padding:4px 10px">120</td><td style="padding:4px 10px;color:var(--accent)">80</td></tr>
       <tr><td style="padding:4px 10px">150</td><td style="padding:4px 10px">90</td><td style="padding:4px 10px;color:var(--accent)">60</td></tr></tbody></table>
     </div>
     <div style="border:1px solid var(--accent);border-radius:8px;padding:14px 18px;min-width:150px;text-align:center">
       <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)">Мера — рассчитывается на лету</div>
       <div style="font-size:1.6rem;font-weight:700;color:var(--accent);margin-top:4px">$140</div>
       <div style="color:var(--dim);margin-top:2px">Общая прибыль = SUM (прибыль)</div>
     </div>
   </div>`,caption:"Две разные вещи: вычисляемый столбец хранит прибыль в каждой строке (слева), а показатель оперативно агрегирует все, что отображается на визуальном элементе (общая прибыль, справа)."},
   quiz:{q:"Мера в DAX оценивается на основе…",opts:["Каждая строка таблицы при загрузке данных","Текущий контекст фильтра во время запроса","Первичный ключ таблицы фактов","Порядок сортировки визуального элемента"],ans:1,exp:"Мера похожа на калькулятор, который повторяет математические вычисления каждый раз, когда меняется вопрос: щелкните срез, и он тут же пересчитает. Именно это делает меры эффективными для интерактивных отчетов."},
   parsons:{prompt:"Расположите два определения: сначала столбец «строка за строкой», затем меру, которая его агрегирует.",lines:["Прибыль = Продажи[Выручка] – Продажи[Затраты]","-- сохраняется для каждой строки при загрузке данных (контекст строки)","Общая прибыль = SUM(Sales[Profit])","-- вычисляется для каждого визуального элемента во время запроса (контекст фильтра)"],answer:[0,1,2,3]},
   explain:{is:"Вычисляемый столбец обрабатывается построчно при загрузке данных и сохраняется в таблице. Мера разрабатывается на лету, в зависимости от того, что фильтруется прямо сейчас.",
     use:"Столбцы для элементов, которые вы хотите сгруппировать или разделить, например уровень клиентов. Меры для чисел, которые должны реагировать на клики пользователя. Неправильный выбор либо раздувает модель, либо дает вам то, чего слайсер не сможет коснуться.",
     like:"День рождения, напечатанный в чьем-то паспорте, против его сегодняшнего возраста. Один впечатывается однажды и никогда не меняется; другой должен быть разработан заново каждый раз, когда вы спрашиваете."},
   build:{q:"Вам нужна карточка KPI, показывающая общий доход, соответствующий срезу региона. Что вы создаете?",opts:["Расчетный столбец: Общий доход = Продажи[Выручка]","Мера: общий доход = SUM(Sales[Revenue]).","Расчетный столбец: Итого = SUM(Sales[Revenue]).","Новая таблица с одной строкой на регион."],ans:1,exp:"Ключевые показатели эффективности, которые реагируют на срезы, являются мерами — они пересчитываются в соответствии с текущим контекстом фильтра. Вычисляемый столбец сохраняет значения построчно во время загрузки и не может реагировать на срез; размещение СУММ в столбце просто повторяет общую сумму в каждой строке."},
   close:"Вы можете выбрать правильный инструмент: столбцы для значений на уровне строк, по которым вы группируете, меры для чисел, которые реагируют на фильтры. Далее: повседневные агрегаты DAX.",
   unlock:"Совет по обзору размера модели: сортируйте таблицы по количеству столбцов и ищите вычисляемые столбцы, которые предоставляют только один визуальный элемент. Каждый из них записывается в ОЗУ при загрузке; Преобразование агрегированных показателей в меры — это самое быстрое похудение, которое может получить раздутая модель."
  },
  {id:6, core:true, unit:"Глава 2: DAX и меры", title:"Базовые агрегаты DAX", sub:"SUM, COUNT, AVERAGE, DIVIDE",
   story:"Вы понимаете, когда использовать меру. Теперь напишите свои первые в DAX: SUM, COUNT, AVERAGE, DIVIDE. Синтаксис DAX похож на формулы Excel — Общий доход = SUM(Sales[Revenue]) — с одним ключевым отличием: каждая мера оценивается в соответствии с текущим контекстом фильтра, поэтому одна и та же мера возвращает разные числа в зависимости от того, какой срез или строка активны.",
   intro:"Основной мерой является карманный калькулятор для столбца: наведите его на числа, и он суммирует, усредняет или подсчитывает их. Большинство мер, которые вы напишете, представляют собой простые агрегаты по столбцу. DAX имеет те же строительные блоки, что и агрегаты SQL, но с несколькими важными отличиями.",
   ral:{
     code:"Общий доход = SUM(Sales[Revenue])\nКоличество заказов = COUNTROWS(Sales)\nСредний заказ = AVERAGE(Sales[Revenue])\nМаржа % = DIVIDE([Total Revenue] - [Total Cost], [Total Revenue])",
     say:"Общий доход суммирует столбец «Доход». Подсчет заказов подсчитывает строки в разделе «Продажи». Средний порядок — средний. Процент маржи использует DIVIDE для безопасного деления — возвращает пустое значение вместо ошибки, если знаменатель равен нулю.",
     lines:[
       ["Общий доход = SUM(Sales[Revenue])","просуммируйте столбец Доход — ежедневный итог"],
       ["Количество заказов = COUNTROWS(Продажи)","подсчитайте строки таблицы «Продажи» — строки, а не значения, поэтому пробелы по-прежнему учитываются"],
       ["Средний заказ = AVERAGE(Sales[Revenue])","возьмите среднее значение дохода — сумму, разделенную на количество непустых значений"],
       ["Маржа % = DIVIDE([Total Revenue] - [Общая стоимость], [Total Revenue])","DIVIDE (безопасное деление) прибыли на выручку — возвращает пустое значение вместо ошибки, когда знаменатель равен нулю."],
       ["[Total Revenue]","только квадратные скобки ссылаются на показатель — Продажи[Выручка] с именем таблицы является столбцом"]
     ]
   },
   notes:"Используйте DIVIDE() вместо / для всех делений в DAX. Если знаменатель когда-либо равен нулю или пуст, / выдает ошибку, которая нарушает ваше визуальное представление. DIVIDE возвращает пустой или необязательный альтернативный результат.",
   viz:{title:"DAX-агрегации",html:`<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px">${[["SUM","$1,279","Общий доход"],["AVERAGE","$256","среднее значение соли"],["COUNTROWS","25","количество продаж"],["DISTINCTCOUNT","4","уникальные регионы"]].map(c=>`<div style="border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:106px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)">${c[0]}</div><div style="font-size:1.3rem;font-weight:700;color:var(--accent);margin-top:2px">${c[1]}</div><div style="color:var(--dim)">${c[2]}</div></div>`).join('')}</div>`,caption:"Четыре повседневных агрегата DAX в одной и той же таблице Продажи: итоги SUM, средние значения AVERAGE, COUNTROWS подсчитывают строки и DISTINCTCOUNT подсчитывают уникальные значения — каждый возвращает одно число, пересчитываемое для всего, что находится в визуальном элементе."},
   quiz:{q:"Почему вам следует использовать DIVIDE() вместо / в DAX?",opts:["DIVIDE быстрее","DIVIDE безопасно обрабатывает деление на ноль.","Оператор / работает только в вычисляемых столбцах","DIVIDE работает с текстовыми столбцами"],ans:1,exp:"DIVIDE(числитель, знаменатель, [альтернативныйрезультат]) возвращает пустое значение (или альтернативный результат), если знаменатель равен нулю или пуст. Оператор / выдает ошибку, которая может испортить визуальные эффекты."},
   parsons:{prompt:"Упорядочите показатель маржи в %: сначала DIVIDE, затем числитель, затем знаменатель.",lines:["Маржа % = DIVIDE(","[Total Revenue] – [Общая стоимость],","[Total Revenue]",")"],answer:[0,1,2,3]},
   explain:{is:"Большую часть работы выполняют четыре повседневные функции DAX: SUM добавляет столбец, COUNTROWS подсчитывает строки, AVERAGE берет среднее значение, а DIVIDE безопасно делит одно на другое.",
     use:"Эти меры лежат почти в каждой карточке реального отчета. РАЗДЕЛЕНИЕ имеет значение, потому что простое деление вызывает ошибку в тот момент, когда знаменатель достигает нуля, и одна ошибка уничтожает весь визуальный элемент.",
     like:"Чайник, который выключается сам, когда в нем ничего нет. Тот, у кого нет этой защиты, не просто не закипает — он сгорает и забирает с собой утро."},
   build:{q:"Какая мера подсчитывает количество заказов в таблице «Продажи»?",opts:["Количество заказов = COUNTROWS(Продажи)","Количество заказов = SUM(Sales[OrderID])","Количество заказов = COUNT(Sales)","Количество заказов = COUNTROWS(Продажи[ID заказа])"],ans:0,exp:"COUNTROWS берет таблицу и подсчитывает ее строки. СУММА в столбце идентификатора складывает идентификаторы — бессмысленная сумма. COUNT принимает столбец, а не таблицу, а COUNTROWS принимает таблицу, а не столбец."},
   close:"Вы можете записать четыре ежедневных меры и безопасно разделить их. Далее: CALCULATE, функция, которая изменяет контекст фильтра по вашему желанию.",
   unlock:"Соглашение о квадратных скобках представляет собой договор читаемости: Продажи[Выручка] — это столбец, [Total Revenue] — показатель. Эталонные показатели внутри других показателей (например, % маржи), а логическое исправление в [Общем доходе] проходит через каждую построенную на нем меру — версия DAX, позволяющая не повторяться."
  },
  {id:7, core:true, unit:"Глава 2: DAX и меры", title:"CALCULATE И Фильтрация контекста", sub:"Самая мощная функция в DAX",
   story:"Вы можете писать базовые агрегаты DAX. Теперь самая мощная функция в DAX: CALCULATE. Он оценивает любое выражение внутри измененного контекста фильтра. CALCULATE(SUM(Revenue), Регион = 'Запад') возвращает доход на западе независимо от того, что говорит активный срез. Понимание CALCULATE открывает доступ к продвинутому DAX.",
   intro:"CALCULATE похож на смену телеканала до того, как вы прочтете руководство: сначала меняется контекст фильтра, а затем считывается результат. <code>CALCULATE</code> делает две вещи: оценивает выражение И позволяет изменять контекст фильтра, в котором оно выполняется. Его использует почти каждая расширенная мера DAX.",
   ral:{
     code:"West Revenue = CALCULATE(\n    SUM(Sales[Revenue]),\n    Sales[Region] = \"Запад\"\n)",
     say:"Западный доход использует CALCULATE для изменения контекста фильтра — он суммирует доход, но только для строк, где регион равен \"West\". ВЫЧИСЛЕНИЕ — это способ переопределить естественный фильтр для вычисления чего-то конкретного.",
     lines:[
       ["West Revenue = CALCULATE(","ВЫЧИСЛИТЬ (повторно выполнить под измененными фильтрами) — оценить выражение, следующее за измененным контекстом фильтра."],
       ["SUM(Sales[Revenue]),","выражение — суммируйте столбец «Доход», как и любой базовый показатель."],
       ["Sales[Region] = \"West\"","аргумент фильтра — сохранять только строки, в которых регион равен \"West\", переопределяя все, что говорит срез"],
       [")","закрыть CALCULATE — результат равен сумме Уэста, независимо от того, что показывает остальная часть отчета"]
     ]
   },
