   ral:{code:"Средний заказ = СРЕДНИЙ(Заказы[Сумма])\nМедианный заказ = МЕДИАНА(Заказы[Сумма])\nСпред (SD) = STDEV.P(Заказы[Сумма])\nФлаг отклонения = IF([Средний порядок] > 1,2 * [Медианный порядок], «сдвиг вправо», «~симметричный»)", say:"Покажите среднее значение и медиану рядом со стандартным отклонением разброса и отметьте столбец как перекошенный вправо, когда среднее значение находится значительно выше медианы.",
     lines:[["Средний заказ = СРЕДНИЙ(Заказы[Сумма])","взять среднее значение суммы — сумма по подсчету"],["Медианный заказ = МЕДИАНА(Заказы[Сумма])","МЕДИАНА (берём середину) — половина ордеров находится выше неё, половина ниже."],["Спред (SD) = STDEV.P(Заказы[Сумма])","STDEV.P (измерить спред) — насколько суммы разбросаны вокруг среднего значения"],["ЕСЛИ([Средний порядок] > 1,2 * [Медианный порядок],…)","отмечайте «перекос вправо», когда среднее значение превышает медиану более чем на 20 процентов — простое и оправданное эмпирическое правило"]]},
   notes:"В DAX встроены значения MEDIAN, AVERAGE и STDEV.P, поэтому одинокому среднему показателю с искажением нет оправдания. Когда среднее значение и медиана расходятся, медиана является более честной «типичной» — она не подвержена крайностям. Визуальный элемент гистограммы (или панель распределения Power Query) отображает фигуру напрямую; длинный правый хвост – это то, что тянет среднее вверх. Выбросы — это вопрос, а не приговор: корпоративный кит реален, и его стоит сохранить, но сегментируйте его, чтобы он не искажал повседневное представление, которое подразумевает карта.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Bin</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Count</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">140</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$40</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">170</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$80</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">95</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$120</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">44</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$160</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">20</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">$200+</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">9</td></tr></tbody></table></div>", caption:"Распределение стоимости заказа (с перекосом вправо)"},
   quiz:{q:"Показатель показывает, что СРЕДНЯЯ стоимость заказа значительно превышает МЕДИАННУЮ стоимость заказа. Что это означает?", opts:["Правильный перекос из-за нескольких крупных заказов","Идеально симметричный разброс","Ошибка в показателе STDEV.P.","Никаких отклонений в данных"], ans:0, exp:"Среднее положение выше медианы является признаком перекоса вправо: несколько крупных ордеров поднимают среднее значение вверх, в то время как медиана — истинная средняя точка — остается рядом с местом падения большинства ордеров. Покажите медиану рядом со средним значением, чтобы карта не ввела в заблуждение."},
   parsons:{prompt:"Расположите честно-средний комплект: дважды по центру, разворот, затем перекошенный флажок.",lines:["Средний заказ = СРЕДНИЙ(Заказы[Сумма])","Медианный заказ = МЕДИАНА(Заказы[Сумма])","Спред (SD) = STDEV.P(Заказы[Сумма])","Флаг отклонения = IF([Средний порядок] > 1,2 * [Медианный порядок], «сдвиг вправо», «~симметричный»)"],answer:[0,1,2,3]},
   explain:{is:"Среднее значение подрывается крайностями; медиана является средней записью и игнорирует их. Показ обоих плюс спред подскажет вам, какому из них верить.",
     use:"Когда среднее значение значительно превышает медиану, несколько очень крупных записей тянут его вверх, поэтому утверждение «типичный заказ составляет 86 фунтов» — это утверждение, которое вы не можете защитить. Держите и то, и другое в отчете, и пусть сравнение сделает свою работу.",
     like:"Десять человек в пабе, и один из них миллиардер. На бумаге там все чрезвычайно богаты, и ни один из них не может купить ни одного раунда."},
   build:{q:"Средняя стоимость заказа — 86 долларов США, медиана — 52 доллара США. Какая цифра стоит в заголовке и почему?",opts:["Среднее значение — оно использует каждую точку данных","Медиана — она сопротивляется крайностям","Оба одинаково репрезентативны","Ни то, ни другое — используйте максимум"],ans:1,exp:"Среднее значение намного выше медианного означает, что несколько китов затягивают его — типичный клиент тратит около 52 долларов, а не 86 долларов. Медиана сопротивляется крайностям. Держите среднее значение видимым для финансовой точки зрения, но «типичное» утверждение принадлежит медиане."},
   close:"Вы можете определить, когда среднее значение лжет, и показать рядом с ним честную цифру. Далее: Парето — поиск немногих жизненно важных.",
   unlock:"Выбросы — это вопрос, а не приговор: корпоративный заказ на сумму 9 980 долларов — это реальный доход, а не ошибка, которую нужно удалить. Плюсом является сегментация: сообщайте «типичный заказ (исключая предприятие)» и «предприятие» отдельно, чтобы ни одно из представлений не искажало другое."
  },
{id:804, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Парето / ABC-анализ", sub:"Показатель текущей доли, который ранжирует немногих жизненно важных.",
   story:"Около 80% дохода обычно приходится на 20% продукции. Анализ Парето (ABC) превращает длинный список в короткий, над которым стоит действовать. В DAX вы строите показатель совокупной доли: для каждого продукта суммируйте доход каждого продукта, имеющего рейтинг выше него или выше, а затем делите его на общую сумму. Поместите его на диаграмму, отсортированную по доходам, и совокупная линия покажет, как мало продуктов достигают большей части продаж.",
   ral:{code:"Совокупный доход =\nДА Курс = [Доход]\nВОЗВРАТ\n    СУММ(\n        FILTER(ALLSELECTED(Продукт[Имя]), [Доход] >= Дядя),\n        [Доход]\n    )\n\nСовокупный % =\nРАЗДЕЛИТЬ([Совокупный доход], РАСЧЕТ([Доход], ВСЕ ВЫБРАННЫЕ(Продукт[Имя])))", say:"Для каждого продукта просуммируйте доход от каждого продукта, который имеет как минимум такой же высокий рейтинг, а затем разделите его на общую сумму по всем выбранным продуктам — текущую долю, которая составляет диаграмму Парето.",
     lines:[["VAR cur = [Revenue]","сохранить доход от этого продукта до изменения фильтра"],["FILTER(ALLSELECTED(Продукт[Имя]), [Доход] >= Дядя)","ALLSELECTED (расширить до каждого продукта, выбранного пользователем), затем оставьте те, у которых доход не ниже этого — продукты, имеющие рейтинг на уровне или выше него."],["СУММ(…, [Доход])","пройдите этот ранжированный набор и добавьте свой доход — совокупный итог вниз по рейтингу"],["РАЗДЕЛИТЬ([Совокупный доход], РАССЧИТАТЬ([Доход], ВСЕ ВЫБРАННЫЕ(…)))","разделить на общую сумму по всем выбранным продуктам — текущую долю, которая рисует кривую Парето."]]},
   notes:"Вы не можете оценить одного бегуна, не видя всего забега, а показатель, расположенный в строке продукта, обычно видит только этот продукт. Это канонический шаблон DAX с промежуточным итогом по рейтингу, и ALLSELECTED является ключевым: он удаляет фильтр текущего продукта (чтобы показатель мог видеть все другие продукты, по которым можно ранжироваться), сохраняя при этом все срезы, установленные пользователем. Выигрыш — это сосредоточенность — действуйте на пунктах А, приносящих большую часть стоимости, управляйте длинным хвостом С в порядке исключения. Отсортируйте изображение по убыванию дохода и добавьте строку «Совокупный %»; если вместо этого эта линия поднимается по прямой диагонали Если рано сдаться, ни одна маленькая группа не доминирует, и Парето не является подходящей линзой.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Category</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Выручка (тысяч долларов)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Совокупный %</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">A</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">600</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">50%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">B</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">290</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">74%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">C</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">130</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">85%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">D</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">95</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">93%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">E</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">55</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">98%</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">F</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">30</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">100%</td></tr></tbody></table></div>", caption:"Доход по продуктам с совокупным %"},
   quiz:{q:"В совокупном показателе ALLSELECTED(Продукт[имя]) используется так, что:", opts:["При ранжировании игнорируется собственный фильтр продуктов строки.","Срезы навсегда удаляются из отчета.","Возвращается только один товар","Показатель пересчитывается быстрее"], ans:0, exp:"Чтобы оценить, насколько велик один кусок, вам нужно увидеть всю диаграмму — и чтобы ранжировать продукт по сравнению с другими, мера должна выходить за рамки одного продукта в контексте текущей строки. ALLSELECTED поднимает собственный фильтр этой строки — предоставляя все продукты для сравнения — при этом учитываются все срезы, примененные пользователем, а это именно то, что нужно для кумулятивного ранжирования."},
   parsons:{prompt:"Определите показатель совокупного дохода: возьмите этот продукт, затем просуммируйте всех, кто находится на его уровне или выше.",lines:["Совокупный доход =","VAR cur = [Revenue]","RETURN SUMX(","FILTER(ALLSELECTED(Продукт[Имя]), [Доход] >= Дядя),","[Доход])"],answer:[0,1,2,3,4]},
   explain:{is:"Парето сначала ранжирует самые крупные элементы и отслеживает текущую долю целого, так что вы можете увидеть, как немногие из них несут большую часть этого.",
     use:"Именно так вы решаете, на что обратить внимание — какие продукты, клиенты или коды ошибок заслуживают внимания. Если линия поднимается по прямой диагонали, а не изгибается раньше, ничто не доминирует, и это само по себе является открытием.",
     like:"Ваш гардероб. Четыре-пять вещей носятся постоянно, а остальные висят там круглый год, и зная, что есть, единственный способ упаковать небольшой чемодан."},
   build:{q:"На диаграмме Парето кумулятивная линия % поднимается по почти прямой диагонали, а не изгибается раньше времени. Что читать?",opts:["Мера нарушена","Ни одна маленькая группа не доминирует над ценностью","Отсутствует верхний продукт","Данные необходимо пересортировать"],ans:1,exp:"Ранний поворот — это сигнал Парето — несколько предметов захватывают большую часть стоимости. Прямая диагональ означает, что каждый элемент вносит примерно равный вклад, поэтому принцип «сосредоточиться на немногих жизненно важных» не применим; это само по себе открытие, а не провал."},
   close:"Вы можете ранжировать немногих жизненно важных и доказать, какую долю от общего числа они несут. Далее: корреляция — и заявления, которые вы никогда не должны делать на ее основе.",
   unlock:"ABC-анализ имеет место и на другом конце: C-хвосте. Сотня продуктов, приносящих 5 % дохода, каждый из которых стоит реального каталога, запасов и накладных расходов на поддержку. «Управляйте по исключению или выведите из эксплуатации» — это рекомендация, которую совокупная линия предоставляет вам бесплатно."
  },
{id:805, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Корреляция ≠ Причинно-следственная связь", sub:"В DAX нет CORR — используйте разброс + линию тренда и никогда не преувеличивайте.",
   story:"Кто-то спрашивает, что приносит доход. Корреляция — это первый инструмент, но вот честный факт о DAX, о котором стоит узнать в интервью: встроенной функции CORR() не существует. Ежедневное движение представляет собой разбросанный визуальный элемент с линией тренда на панели «Аналитика», которая с первого взгляда показывает направление и напряженность. Коэффициент Пирсона можно построить вручную в качестве меры, но это продвинутая модель — и в любом случае корреляция никогда не является причинно-следственной связью.",
   ral:{code:"// DAX не отправляет CORR(). Ежедневное чтение:\n// Визуализация разброса: X = SUM(Расходы), Y = SUM(Доход), детали = Неделя\n// Панель аналитики ▸ Линия тренда (направление + степень соответствия)\n//\n// Для числа Пирсон р является мерой, созданной вручную\n// (ковариация ÷ произведение двух стандартных отклонений) —\n// расширенный шаблон; всегда читайте его рядом с разбросом.", say:"Постройте разброс расходов и доходов по неделям и добавьте линию тренда, чтобы увидеть взаимосвязь, а для коэффициента знайте, что существует закономерность Пирсона, но никогда не сообщайте об этом, не обращая внимания на разброс, и никогда не называйте причинно-следственную связь.",
     lines:[["Разброс + линия тренда на панели аналитики","Краткий обзор направления и плотности — повседневная корреляция, читаемая в Power BI"],["нет встроенного CORR()","R Пирсона — это измеряемый вручную показатель (ковариация ÷ SD·SD) — впечатляющий момент для интервью."],["прочитай число рядом с разбросом","один выброс может подделать коэффициент — график защищает от этого"],["Корреляция ≠ Причинно-следственная связь","скрытая третья переменная может управлять обоими — первое, что следует заподозрить"]]},
   notes:"То, что в DAX нет CORR(), действительно полезно знать — как и NPV, это мера, которую вы конструируете, а не вызываете, и это сигнализирует о том, что вы действительно работаете с инструментом. Для повседневного анализа линии разброса и тренда достаточно, чтобы ранжировать потенциальных водителей. Предостережение является самым важным в аналитике: назовите три ловушки: путаница (третья переменная управляет обеими), обратная причинно-следственная связь и совпадение. Сильный тренд требует контролируемого теста, а не причинно-следственной связи, а разброс рядом с числом защищает от единственного выброса, создающего связь, которой нет.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Расходы на маркетинг (тысяч долларов)</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">Выручка (тысяч долларов)</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">10</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">54</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">14</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">60</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">18</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">69</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">22</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">73</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">25</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">85</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">30</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">93</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">34</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">104</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">39</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">116</td></tr></tbody></table></div>", caption:"Линия тренда резко поднимается вверх (р ≈ 0,98). Но в напряженные недели расходы и доходы могут вырасти — разброс позволяет провести контролируемый тест, а не утверждение «тратьте больше, зарабатывайте больше»."},
   quiz:{q:"В DAX нет CORR(). Чтобы быстро понять, как связаны две меры, повседневный шаг заключается в следующем:", opts:["Используйте визуальный разброс с линией тренда.","Доверяйте номеру одной карты KPI","Сортировка одного из столбцов по убыванию","Сложите две меры вместе"], ans:0, exp:"При отсутствии встроенной функции корреляции практическое значение представляет собой точечную диаграмму (расходы по одной оси, доходы по другой) плюс линию тренда на панели «Аналитика» — она сразу показывает направление и плотность. Существует созданная вручную мера Пирсона, но ее всегда следует читать рядом с этим разбросом."},
   parsons:{prompt:"Организуйте корреляционное чтение, от построения наглядности до дисциплины в конце.",lines:["Постройте разброс: X = СУММА(Расходы), Y = СУММА(Доход), детали = Неделя.","Панель «Аналитика» ▸ добавьте линию тренда.","Чтение направления и плотности — внимание к выбросам","Подозревайте, что кто-то вмешивается, прежде чем делать какие-либо причинно-следственные претензии."],answer:[0,1,2,3]},
   explain:{is:"Две вещи, движущиеся вместе, — это отношения. Это не является доказательством того, что один из них является причиной другого.",
     use:"Power BI дает вам разброс и линию тренда; это не помешает вам преувеличивать. Плотное соответствие требует контролируемого теста, а не предложения, начинающегося с «расходовать больше средств». Всегда смотрите на картинку, ведь за одну крайнюю неделю можно изготовить выкройку, которой нет.",
     like:"Продажи мороженого и число случаев утопления растут вместе каждое лето. Ни один другому ничего не делает — на улице просто жарко."},
   build:{q:"Линия тренда показывает, что расходы и доходы растут вместе (р ≈ 0,98). Что это дает?",opts:["Утверждение: «Большие расходы приводят к большему доходу»","Контролируемый тест — третья переменная может управлять обоими","Немедленное увеличение бюджета","Ничего — корреляция бессмысленна"],ans:1,exp:"Сильная корреляция требует эксперимента, а не причинно-следственной связи. Напряженный сезон может привести к одновременному увеличению расходов и доходов (смешение), а целевые показатели доходов могут привести к увеличению расходов (обратная причинно-следственная связь). Эта тенденция является реальным свидетельством того, что отношения заслуживают проверки, а не проверенного рычага."},
   close:"Вы можете честно прочитать взаимосвязь — разброс, линию тренда и три названные ловушки. Далее: финальная дисциплина, сверка перед публикацией.",
   unlock:"«DAX не имеет CORR()» — это своего рода знания конкретного инструмента, которые можно услышать на собеседованиях. Это показывает, что вы действительно достигли этого. То же самое происходит и с называнием ловушек без подсказки: путаница, обратная причинно-следственная связь, совпадение. По одному предложению на каждое, и вы говорите как человек, которого как следует обожгли."
  },
{id:806, unit:"Модуль 7: Набор инструментов для продвинутого аналитика", title:"Проверка здравомыслия и согласование", sub:"Прежде чем публиковать отчет, привяжите свою меру к надежному элементу управления.",
   story:"Последний шаг перед публикацией отчета — это тот, который младшие специалисты пропускают: имеет ли число смысл и связано ли оно с чем-то, кому уже доверяют? Создайте сверку: поместите показатель вашей модели рядом с контрольным показателем из отдельной доверенной таблицы, вычтите и отметьте пробел. Ноль означает, что вы проиграли. Все остальное означает «остановись и найди это», потому что заинтересованная сторона сделает это в тот момент, когда панель управления будет опубликована.",
   ral:{code:"Вычисленный = [Доход] // итог вашей модели\nКонтроль = SUM(Контрольные итоги[Количество]) // доверенная цифра\nОтклонение = [Вычисляемое] – [Контрольное]\nПроверка ничьей = IF(ABS([Дисперсия]) < 1, «✓ ничья», «✕ проверка»)", say:"Поместите показатель вашей модели рядом с надежным контрольным итогом из отдельной таблицы, вычтите дисперсию и отметьте все, что не привязано к нулю, перед публикацией отчета.",
     lines:[["Рассчитано = [Доход]","число, которое выдает ваша модель"],["Контроль = СУММ(КонтрольИтоги[Количество])","просуммировать независимо доверенные цифры, загруженные как отдельная таблица"],["Отклонение = [Вычисляемое] – [Контрольное]","вычесть контрольное значение из вычисленного: ноль — это цель, а ненулевое отклонение — это флаг, а не оправдание округления."],["Проверка связи = IF(ABS([Дисперсия]) < 1, …)","ABS (опустите знак) — под долларом в любом случае написано ✓ ничьи, все остальное помечается перед отправкой отчета."]]},
   notes:"A measure that matches a known control earns trust; one that doesn't is a bug you haven't found yet. Loading the control figures as their own table lets the reconciliation live on the report and refresh with the data — it can't be forgotten. When the variance is non-zero, the usual suspects are this unit's whole syllabus: a relationship that fanned out (grain), a filter or slicer that dropped rows, or duplicates. A variance that's a clean multiple of the truth screams grain. The ABS(...) < 1 tolerance avoids a false flag from sub-dollar rounding.",
   viz:{html:"<div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%\"><thead><tr><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">metric</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">computed</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">control</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">variance</th><th style=\"text-align:left;padding:6px 12px;border-bottom:2px solid var(--accent);color:var(--accent);white-space:nowrap\">status</th></tr></thead><tbody><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Модельный доход</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4,021,880</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">4,021,880</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✓ галстуки</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Количество заказов</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">96,420</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">+48,210</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✕ ровно 2× — зерно</td></tr><tr><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">Customers</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">31,544</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">31,544</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">0</td><td style=\"padding:5px 12px;border-bottom:1px solid var(--border);white-space:nowrap\">✓ галстуки</td></tr></tbody></table></div>", caption:"Доходы и клиенты связаны друг с другом; количество ордеров ровно в два раза превышает контрольное значение — чистое кратное, которое сигнализирует о разветвленной взаимосвязи (строки ордеров считаются ордерами). Выверка произошла еще до отправки отчета."},
   quiz:{q:"[Дисперсия] = [Вычисляемое] — [Контроль] возвращает чистое 2× элемента управления. Что нужно проверить в первую очередь?", opts:["Отношения, в которых разбрасывалось зерно","Изменились ли цвета темы отчета","Скрыт ли где-нибудь слайсер от просмотра","Размер шрифта на карте"], ans:0, exp:"Чистая 2-кратная дисперсия — это классический признак проблемы зернистости — обычно это отношение «один ко многим» в более детализированной таблице (например, строках заказов), в которой каждый заказ разделяется на две строки. Это не имеет ничего общего с форматированием; проверьте зернистость и кардинальность каждого отношения, которое пересекает мера."},

// ─── KEYBOARD REACH ──────────────────────────────────────────
// The path nodes, home tiles, ordering chips, skill rows, DAX Lab rows,
// workspace hotspots and the flashcard were all divs with an onclick and no
// role or tabindex, so none of them could be reached, focused or pressed from
// a keyboard. They get role=button, tabindex=0, Enter/Space and a focus ring
// from ONE observer, not from fifteen render sites — a fix applied at the
// render site is a fix the next new render site does not get.
//
// This kit renders everything into #main, exactly like the SQL prototype, so
// the observer has one target. Real <button> elements are deliberately NOT in
// the selector: they already handle Enter, and a second handler on top would
// fire the click twice.
//
// The lucide refresher below also observes #main. That is safe because it
// strips data-lucide off its own output, so it never re-triggers itself, and
// this one sets attributes rather than replacing nodes.
const CLICKABLE_DIVS = '.pmap-node,.ord-chip,.skill-row2,.skill-strip,.flag-row,.next-row,.path-tile,.drill-tile,.dax-item,.ws-spot,.flashcard-outer';
function upgradeClickables(root){
  (root || document).querySelectorAll(CLICKABLE_DIVS).forEach(el => {
    if(el.dataset.kbd) return;
    el.dataset.kbd = '1';
    if(!el.getAttribute('role')) el.setAttribute('role','button');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    el.addEventListener('keydown', ev => {
      if(ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
      ev.preventDefault();   // Space would otherwise scroll the page
      el.click();
    });
  });
}
(function(){
  upgradeClickables(document);
  // de-test.mjs has no MutationObserver stub, so guard rather than assume it.
  if(!('MutationObserver' in window)) return;
  const target = document.getElementById('main');
  if(!target) return;
  let queued = false;
  new MutationObserver(() => {
    if(queued) return; queued = true;
    queueMicrotask(() => { queued = false; upgradeClickables(target); });
  }).observe(target, {childList:true, subtree:true});
})();

// ─── SAY IT OUT LOUD ────────────────────────────────────────────────────────
// Each piece's meaning sits directly under the line of code it explains, inside
// the same block. It used to keep the DAX in the dark block and its
// explanations in a list underneath, so reading one meant holding the other in
// your head. Splitting things you have to use together across two places
// measurably costs learning (Chandler & Sweller 1992, British Journal of
// Educational Psychology 62(2):233-246), and the cost is worst where the parts
// interact, which is every argument of a CALCULATE (Sweller & Chandler 1994,
// Cognition and Instruction 12(3):185-233).
//
// Pieces are located by scanning the code text, forward from the last match so
// a repeated token lands on the right one, then from the start because a few
// lessons list their pieces out of order. Anything not literally in the code
// keeps its own row underneath — that is most of Unit 0, whose lines are
// definitions rather than parts of an expression.
//
// One shared renderer. There were three copies: the home demo, the pre-v2
// lesson body and the Worked Example stage, and the home one had drifted into
// advertising a shape the kit no longer had.
//
// This kit's block is `l.ral`, an OBJECT with `.code`, not an array of blocks —
// so the call site is ralBlockHTML(l.ral), never l.ral.map(...).
function ralBlockHTML(r){
  const code = String((r && (r.code ?? r.formula)) || '');
  const codeLines = code.split('\n');
  const perLine = codeLines.map(()=>[]);
  const tail = [];
  let cursor = 0;
  const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, m => '\\' + m);
  ((r && r.lines) || []).forEach(pair => {
    const chunk = String(pair[0] ?? ''), desc = pair[1];
    let at = chunk.trim() ? code.indexOf(chunk, cursor) : -1;
    if(at === -1 && chunk.trim()) at = code.indexOf(chunk);
    let len = chunk.length;
    // Third try, whitespace-insensitive. Power BI's worked examples align their
    // equals signs — "Order Count   = COUNTROWS(Sales)" — while the piece is
    // written with single spaces, so a literal search misses and the meaning
    // falls to the tail instead of sitting on the line it explains. That is the
    // whole point of the block, and it was happening to 38 of 177 pieces.
    if(at === -1 && chunk.trim()){
      const re = new RegExp(chunk.trim().split(/\s+/).map(rx).join('\\s+'));
      const near = re.exec(code.slice(cursor));
      const m = near || re.exec(code);
      if(m){ at = (near ? cursor : 0) + m.index; len = m[0].length; }
    }
    if(at === -1){ tail.push([chunk, desc]); return; }
    cursor = at + len;
    perLine[code.slice(0, at).split('\n').length - 1].push([chunk, desc]);
  });
  // A note whose second half is missing is printed as one line, not as a chunk
  // followed by the word "undefined".
  const note = (c, d, cls) => d == null
    ? `<div class="ral-note${cls||''}"><span class="ral-note-desc">${_escHTML(c)}</span></div>`
    : `<div class="ral-note${cls||''}"><span class="ral-note-chunk">${_escHTML(c)}</span><span class="ral-note-desc">${d}</span></div>`;
  const rows = codeLines.map((line, i) =>
    `<div class="ral-code">${_escHTML(line) || '&nbsp;'}</div>` + perLine[i].map(p => note(p[0], p[1])).join('')
  ).join('');
  return `<div class="ral-block">
      <div class="ral-head"><i data-lucide="megaphone"></i>Скажи это вслух</div>
      <div class="ral-sql">${r && r.say ? `<div class="ral-say-inline">${r.say}</div>` : ''}${rows}${tail.map(p => note(p[0], p[1], ' ral-note-tail')).join('')}</div>
    </div>`;
}

// ─── THE TARGET, AND THE EIGHT SKILLS THAT ADD UP TO IT ─────────────────────
// The kit counted lessons and never said what finishing them buys you, so there
// was progress but nothing to be making progress TOWARD. A specific named goal
// beats "do your best" by a wide margin (Locke & Latham 2002, American
// Psychologist 57(9):705-717), and a big goal works when it splits into named
// sub-goals — a label saying what a group of steps ACHIEVES, not what topic it
// covers (Catrambone 1998, J Experimental Psychology: General 127(4):355-376).
// So each unit gets a sentence a learner could say out loud in an interview.
const KIT_TARGET = "ответить на вопросы Power BI, которые задаются на собеседовании с аналитиком начального уровня";
const SKILLS = [
  {unit:"Часть 0: Прежде чем строить",          name:"Скажите, что означает одна строка таблицы, прежде чем что-либо строить на ее основе."},
  {unit:"Глава 1: Интерфейс и данные",      name:"Загрузите файл в Рабочий стол Power BI и соедините таблицы вместе."},
  {unit:"Глава 2: DAX и меры",            name:"Напишите меру, которая по-прежнему возвращает правильное число при любом фильтре."},
  {unit:"Модуль 3: Отчеты и аналитика",        name:"Создайте страницу отчета, отвечающую на заданный вопрос."},
  {unit:"Модуль 4: Миграция данных",            name:"Переместите набор данных в новую систему и докажите, что ничего не потеряно"},
  {unit:"Глава 5: От вопроса к метрике",   name:"Превратите расплывчатый вопрос в показатель, который можно защитить"},
  {unit:"Глава 6: Финансовый анализ",        name:"Отвечайте на вопросы о деньгах из бухгалтерской книги"},
  {unit:"Модуль 7: Набор инструментов для продвинутого аналитика",  name:"Проверьте свои номера, прежде чем это сделает кто-то другой"}
];
const _SKILL_BY_UNIT = {}; SKILLS.forEach((sk,i)=>{ sk.n = i+1; _SKILL_BY_UNIT[sk.unit] = sk; });

// Progress for a drill is stored under the ITEM'S OWN id, which is index+1 in
// this kit — markDone('doneFills', f.id), not the index. LESSON_DRILLS points
// at indexes. Reading state.doneFills for an index would report the wrong drill
// done and never throw, so every lookup goes through here.
const _SKILL_DONE_KEY = {fills:'doneFills', parsons:'doneParsons', bugs:'doneBugs'};
const _DRILL_DATA = {fills:'FILLS', parsons:'PARSONS', bugs:'BUGS'};
function _drillItemId(type, idx){
  const arr = DATA[_DRILL_DATA[type]];
  const item = arr && arr[idx];
  return item ? item.id : null;
}
function stepIsDone(step){
  const key = _SKILL_DONE_KEY[step[0]];
  if(!key) return false;
  const id = _drillItemId(step[0], step[1]);
  return id != null && (state[key] || []).includes(id);
}

// One skill's state, read straight off the progress keys that already existed —
// nothing new is stored, and nothing is awarded that was not earned. A head
// start people can see they did not earn buys no extra effort (Nunes & Dreze
// 2006, J Consumer Research 32(4):504-512), which is also why the bar starts at
// zero. Practice reps are shown as EVIDENCE, never as a gate: only lessons 1-12
// carry drills, so gating a skill on practice would strand Units 4-7 forever.
function skillState(unit){
  const sk = _SKILL_BY_UNIT[unit];
  if(!sk) return null;
  const ls = DATA.LESSONS.filter(l => l.unit === unit);
  const doneL = ls.filter(l => state.doneLessons.includes(l.id));
  let reps = 0, repsTotal = 0;
  ls.forEach(l => (LESSON_DRILLS[l.id] || []).forEach(step => {
    if(!_SKILL_DONE_KEY[step[0]]) return;   // a handoff is a pointer, not a rep
    repsTotal++;
    if(stepIsDone(step)) reps++;
  }));
  return {n:sk.n, name:sk.name, unit:unit, done:doneL.length, total:ls.length,
          ready: ls.length > 0 && doneL.length === ls.length,
          reps:reps, repsTotal:repsTotal,
          next: ls.find(l => !state.doneLessons.includes(l.id)) || null};
}
function skillsReady(){
  return SKILLS.reduce((n,sk) => { const st = skillState(sk.unit); return n + (st && st.ready ? 1 : 0); }, 0);
}
// The skill to name next: one already started, else the one with fewest lessons
// left. People speed up as a goal gets visibly nearer (Kivetz, Urminsky & Zheng
// 2006, J Marketing Research 43(1):39-58), so the nearest sub-goal is the one
// worth putting on screen — not the distant total.
function nearestSkill(){
  const open = SKILLS.map(sk => skillState(sk.unit)).filter(st => st && st.total && !st.ready);
  if(!open.length) return null;
  const started = open.filter(st => st.done > 0);
  return (started.length ? started : open).reduce((a,b) =>
    (b.total - b.done) < (a.total - a.done) ? b : a);
}
// The one line that rides at the top of every lesson and every practice step.
// This is where the variation between screens comes from: lesson 12 does not
// look like lesson 3 because eleven more things are done, not because a
// different picture loaded.
function skillStripHTML(unit){
  const st = skillState(unit);
  if(!st) return '';
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  return `<div class="skill-strip${st.ready ? ' is-ready' : ''}" onclick="navigate('lessons')" title="See the whole path">
    <span class="ss-n">Skill ${st.n}<span class="ss-of">/${SKILLS.length}</span></span>
    <span class="ss-name">${st.name}</span>
    <span class="ss-bar"><i style="width:${pct}%"></i></span>
    <span class="ss-count">${st.ready ? 'Ready' : st.done + ' of ' + st.total}</span>
  </div>`;
}
// The home block that names the target and shows the eight skills under it.
function targetCardHTML(){
  const ready = skillsReady(), near = nearestSkill();
  const rows = SKILLS.map(sk => {
    const st = skillState(sk.unit);
    if(!st || !st.total) return '';
    const isNear = near && near.unit === st.unit;
    const target = st.next ? `navigate('lesson',${st.next.id})` : `navigate('lessons')`;
    return `<div class="skill-row2${st.ready ? ' is-done' : ''}${isNear ? ' is-near' : ''}" onclick="${target}">
      <span class="sr-tick">${st.ready ? '&#10003;' : st.n}</span>
      <span class="sr-name">${st.name}</span>
      ${st.reps ? `<span class="sr-reps">${st.reps} rep${st.reps === 1 ? '' : 's'}</span>` : ''}
      <span class="sr-meta">${st.ready ? 'Ready' : st.done + '/' + st.total}</span>
    </div>`;
  }).join('');
  const pips = SKILLS.map(sk => {
    const st = skillState(sk.unit);
    const cls = st && st.ready ? 'on' : (near && st && near.unit === st.unit ? 'near' : '');
    return `<span class="${cls}"></span>`;
  }).join('');
  // Name what is left in the nearest skill, not what is left in the kit. A
  // 39-lesson total is a number nobody acts on; "2 lessons left" is.
  const nearLine = near
    ? `<p class="target-count" style="margin:14px 0 0">Ближайший: <strong style="color:var(--text)">${near.name}</strong> — ${near.total - near.done} lesson${near.total - near.done === 1 ? '' : 's'} левый.</p>`
    : `<p class="target-count" style="margin:14px 0 0">Все восемь навыков готовы. Возьмите их холодными в <a href="../final/#exam-powerbi">Заключительный экзамен</a>.</p>`;
  return `<div class="card">
    <div class="target-eyebrow">К чему вы стремитесь</div>
    <p class="target-line">Когда эти восемь будут готовы, вы сможете <strong>${KIT_TARGET}</strong>.</p>
    <div class="target-pips">${pips}</div>
    <div class="target-count">${ready} of ${SKILLS.length} навыки готовы</div>
    ${rows}
    ${nearLine}
  </div>`;
}

// ─── LESSONS LIST ──────────────────────────────────────────────────────────
function lessonPos(id){return DATA.LESSONS.findIndex(l=>l.id===id);}
function nextLessonId(id){const p=lessonPos(id);return(p>=0&&p<DATA.LESSONS.length-1)?DATA.LESSONS[p+1].id:null;}
// Playtest Batch 5: the Lessons view is a Duolingo-style vertical path map.
// One rail, one node per lesson — done / current / upcoming, where upcoming is
// dimmed, NEVER locked (soft-guide rule); the current node carries Continue.
// No unit-lab nodes here: Power BI has no UNIT_LABS slices yet (B2/B3 work).
function _ringSVG(done, total){
  // Unfilled track is --border, not --surf2 — see the .pmap:before note above.
  const r=14, c=2*Math.PI*r, p=total?done/total:0;
  return `<svg class="pmap-ring" width="34" height="34" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 17 17)"/>
    ${p>=1?'<text x="17" y="21" text-anchor="middle" font-size="13" fill="var(--accent)">✓</text>':''}
  </svg>`;
}
function renderLessons(){
  const cur = DATA.LESSONS.find(l => !state.doneLessons.includes(l.id));
  const units = [...new Set(DATA.LESSONS.map(l=>l.unit))];
  let html = `<h1>Твой учебный маршрут</h1>
    <p class="text-sm text-muted" style="margin:-6px 0 14px">Шаг за шагом, сверху вниз. Ничего впереди не заблокировано — затемнение означает, что оно приближается. Выделенный узел — ваш следующий шаг.</p>
    <div class="pmap">`;
  units.forEach(u => {
    const ls = DATA.LESSONS.filter(l=>l.unit===u);
    const d = ls.filter(l=>state.doneLessons.includes(l.id)).length;
    const sk = skillState(u);
    html += `<div class="pmap-unit">${_ringSVG(d, ls.length)}<div>
      <div class="pmap-unit-name">${u}</div>
      ${sk?`<div class="pmap-unit-skill${sk.ready?' is-ready':''}">${sk.ready?'&#10003; ':''}Skill ${sk.n}: ${sk.name}</div>`:''}
      <div class="pmap-unit-sub">${d}/${ls.length} lessons</div></div></div>`;
    ls.forEach(l => {
      const done = state.doneLessons.includes(l.id);
      const isCur = cur && l.id === cur.id;
      html += `<div class="pmap-node ${done?'done':isCur?'current':'up'}" onclick="navigate('lesson',${l.id})">
        <div class="pmap-dot">${done?'✓':lessonPos(l.id)+1}</div>
        <div class="pmap-info">
          <div class="pmap-title">${l.title}</div>
          <div class="pmap-sub">${l.sub}</div>
          ${isCur?`<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="event.stopPropagation();navigate('lesson',${l.id})">▶ Продолжить</button>`:''}
        </div>
      </div>`;
    });
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

// ─── LESSON ────────────────────────────────────────────────────────────────
// ─── ONE FRAME FOR A LESSON AND ITS PRACTICE ────────────────────────────────
// A lesson and the practice that followed it were two differently-shaped pages.
// Crossing the seam the title vanished, the unit badge vanished, the six-dot
// stage bar was replaced by a second pager in a different style, and the header
// controls changed — the content changed AND the machinery changed in the same
// moment. Disjointed material imposes extraneous load for no benefit (Paas,
// Renkl & Sweller 2003, Educational Psychologist 38(1):1-4), and the fast,
// low-friction transition is what earns the near-transfer gain (Renkl,
// Atkinson, Maier & Staley 2002, Instructional Science 30:105-119).
//
// The title, skill strip, back control and stage bar now hold their exact
// position from the first stage of a lesson to the last drill of its practice,
// and the bar is ONE run of dots: six lesson stages, then one per practice step,
// drawn as rings so you can still see where the reading stops and the doing
// starts. This kit already rendered one stage at a time, which is the half of
// this Excel had to build from scratch.
const STAGE_LABELS = ['Orient',"Пример","Попробовать","Собрать","Проверить","Закрыть"];
const STAGE_ASK = ["посмотреть, для чего это нужно","прочитайте рабочий пример","расставь строки по порядку","построить меру","ответить на чек","посмотри, что ты можешь теперь сделать"];
const STEP_ASK = {fills:"Заполните пробел", parsons:"Наведите порядок", bugs:"найди ошибку",
                  cards:"вспомнить это по памяти", workspace:"Найдите его в рабочей области",
                  lab:"Посмотрите это в лаборатории DAX."};
const STEP_DOT_LABEL = {fills:"Заполнение", parsons:"Порядок", bugs:"Ошибка", cards:"Вспомнить",
                        workspace:'Workspace', lab:"Практикум DAX"};
// One forward label everywhere, and it names what is coming. Naming the next
// task measurably reduces switch cost, though it never removes it (Monsell 2003,
// Trends in Cognitive Sciences 7(3):134-140).
function fwdLabel(ask){ return `Next: ${ask} &rarr;`; }

// gpos === null while in the lesson; a number once the learner is in practice.
function unifiedStageBar(l, stage, gpos){
  const seq = l ? guidedSeqFor(l.id) : [];
  const inPractice = gpos !== null && gpos !== undefined;
  const active = inPractice ? STAGE_LABELS.length + gpos : stage;
  const done = l ? state.doneLessons.includes(l.id) : false;
  const cells = [];
  STAGE_LABELS.forEach((L,i) => {
    const isDone = i < active, isActive = i === active;
    const can = l && (done || inPractice || i < stage) && !isActive;
    cells.push(`<div class="v2-stage-dot${isDone?' done':isActive?' active':''}" title="${L}"${
      can ? ` style="cursor:pointer" onclick="setPbiStage(${l.id},${i})"` : ''}></div>`);
  });
  seq.forEach((step,i) => {
    const idx = STAGE_LABELS.length + i;
    const isActive = idx === active;
    const isDone = idx < active || stepIsDone(step);
    cells.push(`<div class="v2-stage-dot is-practice${isDone?' done':isActive?' active':''}" title="${STEP_DOT_LABEL[step[0]]||'Practice'}"></div>`);
  });
  // Clamped, so a stage index past the last label can never print "undefined"
  // into the one line that is supposed to say where you are.
  const label = inPractice
    ? (STEP_DOT_LABEL[(seq[gpos]||[])[0]] || 'Practice')
    : STAGE_LABELS[Math.min(Math.max(stage,0), STAGE_LABELS.length-1)];
  return `<div class="v2-stage-bar">${cells.join('')}<span class="v2-stage-label">${label} · ${active+1} of ${cells.length}</span></div>`;
}
// The header every lesson stage and every practice step shares, in that order,
// in those slots. Nothing above the body moves between them.
function lessonFrameHTML(l, done, bar){
  const unit = l ? l.unit : ((guided && guided.reviewUnit) || "Повторение всех тем");
  return `<div class="row mb">
      <button class="btn btn-ghost btn-sm" onclick="navigate('lessons')">← Уроки</button>
      <span class="badge badge-unit">${unit}</span>
      ${done?"<span class=\"badge badge-done\">✓ Готово</span>":''}
      ${done&&l?`<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="resetLesson(${l.id})" title="Clear this lesson's progress and reopen it at the start">↺ Сбросить</button>`:''}
    </div>
    <div class="text-sm text-muted" style="margin-bottom:2px">${l ? `Lesson ${lessonPos(l.id)+1} of ${DATA.LESSONS.length}` : "Взято из предыдущих уроков"}</div>
    <h1>${l ? l.title : "Повторение всех тем"}</h1>
    ${skillStripHTML(l ? l.unit : ((guided && guided.reviewUnit) || ''))}
    ${bar||''}`;
}
function directiveHTML(text){

function renderLesson(id){
  const l = DATA.LESSONS.find(x => x.id === id);

// ─── AUTO MISS CAPTURE ─────────────────────────────────────────
// Replaces the old "how well do you have this?" self-rating. People are poor
// judges of their own recall, and the kit already watches every answer — so it
// records what was actually missed and schedules THAT, instead of asking. Same
// shape PrepLoop reads for its miss sweeps.
// One-time carry-over: the self-rating is gone, but someone who had already
// rated lessons "Not yet"/"Almost" should keep the review list they built.
// Convert those to a recorded miss, then drop the dead key.
function _migrateConfidence(){
  const c = state.confidence;
  if(!c || typeof c !== 'object') return;
  state.misses = state.misses || {};
  const touched = [];
  Object.keys(c).forEach(id=>{
    if((c[id]==='low'||c[id]==='mid') && !(state.misses[id]||[]).length){
      state.misses[id] = ["Перенесено с момента, когда вы оценили это \""+(c[id]==='low'?'Not yet':'Almost')+'"'];
      touched.push(+id);
    }
  });
  delete state.confidence;
  saveState();
  touched.forEach(id=>{
    const l = DATA.LESSONS.find(x=>x.id===id);
    if(l) _queueRecalls(id, l);
  });
}
function missesFor(id){ return (state.misses||{})[id]||[]; }
function recordMiss(lessonId, cue){
  if(lessonId==null) return;
  state.misses = state.misses || {};
  const arr = state.misses[lessonId] = state.misses[lessonId] || [];
  const c = String(cue||'').replace(/<[^>]*>/g,'').trim();
  if(c && !arr.includes(c)) arr.push(c);
  saveState();
  const l = DATA.LESSONS.find(x=>x.id===lessonId);
  if(l) _queueRecalls(lessonId, l);
}
function missGotIt(lessonId){
  state.misses = state.misses || {};
  delete state.misses[lessonId];
  saveState();
  const l = DATA.LESSONS.find(x=>x.id===lessonId);
  if(l) _queueRecalls(lessonId, l);
  if(typeof renderFlagged==='function') renderFlagged();
}

}

// ─── INLINE-SVG CHARTS (Medium #6: real visuals on chart-centric lessons) ────
// Zero-dependency parametric SVG (same generators as the SQL kit — PBI is a
// SQL-clone so the CSS vars match). Rendered in the Worked Example stage AFTER
// the output table — the table stays the ground truth; the chart is what an
// analyst would put on the report page.
const _svgNS='xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif" style="width:100%;height:auto;max-width:520px;display:block"';
function _chartScale(vals, H, pad){
  const max=Math.max(...vals,0), min=Math.min(...vals,0), span=(max-min)||1;
  return { y:v=>pad+(max-v)/span*(H-2*pad), zero:pad+(max-0)/span*(H-2*pad), max, min };
}
function svgLineChart(c){
  const W=520,H=280,P=36,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), x=i=>L+i*(W-L-20)/(n-1);
  const pts=vals.map((v,i)=>`${x(i)},${s.y(v).toFixed(1)}`).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${s.y(v).toFixed(1)}" r="3.5" fill="var(--accent)"/><text x="${x(i)}" y="${(s.y(v)-10).toFixed(1)}" fill="var(--text)" font-size="11" text-anchor="middle">${c.fmt?c.fmt(v):v}</text>`).join('');
  const lbls=c.labels.map((t,i)=>`<text x="${x(i)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text><line x1="${L}" y1="${H-P+6}" x2="${W-16}" y2="${H-P+6}" stroke="var(--border)" stroke-width="1.5"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}${lbls}</svg>`;
}
function svgBarChart(c){
  const W=520,H=280,P=40,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), bw=Math.min(72,(W-L-24)/n*0.62), gap=(W-L-24)/n;
  const bars=vals.map((v,i)=>{
    const bx=L+12+i*gap+(gap-bw)/2, y0=s.zero, y1=s.y(v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y0-y1));
    const col=c.colors?`var(--${c.colors[i]})`:'var(--accent)';
    return `<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}"/>
      <text x="${(bx+bw/2).toFixed(1)}" y="${(top-6).toFixed(1)}" fill="var(--text)" font-size="11" text-anchor="middle">${c.fmt?c.fmt(v):v}</text>
      <text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${c.labels[i]}</text>`;
  }).join('');
  const zero=`<line x1="${L}" y1="${s.zero.toFixed(1)}" x2="${W-12}" y2="${s.zero.toFixed(1)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text>${zero}${bars}</svg>`;
}
function svgParetoChart(c){
  const W=520,H=280,P=40,L=64,vals=c.values,n=vals.length;
  const s=_chartScale(vals,H,P), gap=(W-L-24)/n, bw=Math.min(64,gap*0.62);
  const yPct=p=>P+(100-p)/100*(H-2*P);
  const bars=vals.map((v,i)=>{
    const bx=L+12+i*gap+(gap-bw)/2;
    return `<rect x="${bx.toFixed(1)}" y="${s.y(v).toFixed(1)}" width="${bw}" height="${(s.zero-s.y(v)).toFixed(1)}" rx="2" fill="var(--accent)"/><text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${c.labels[i]}</text>`;
  }).join('');
  const cx=i=>L+12+i*gap+gap/2;
  const line=c.cumPct.map((p,i)=>`${cx(i).toFixed(1)},${yPct(p).toFixed(1)}`).join(' ');
  const dots=c.cumPct.map((p,i)=>`<circle cx="${cx(i).toFixed(1)}" cy="${yPct(p).toFixed(1)}" r="3" fill="var(--warn)"/><text x="${cx(i).toFixed(1)}" y="${(yPct(p)-8).toFixed(1)}" fill="var(--warn)" font-size="10" text-anchor="middle">${p}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" ${_svgNS} role="img"><title>${c.title}</title><text x="${L}" y="20" fill="var(--text)" font-size="12" font-weight="600">${c.title}</text><line x1="${L}" y1="${s.zero.toFixed(1)}" x2="${W-12}" y2="${s.zero.toFixed(1)}" stroke="var(--muted)" stroke-width="1.5"/>${bars}<polyline points="${line}" fill="none" stroke="var(--warn)" stroke-width="2"/>${dots}</svg>`;
}
function pbiChartHTML(c){
  const svg = c.type==='line'?svgLineChart(c) : c.type==='bar'?svgBarChart(c) : c.type==='pareto'?svgParetoChart(c) : '';
  if(!svg) return '';
  return `<div class="card" style="margin-top:16px"><div class="lesson-eyebrow"><i data-lucide="bar-chart-3"></i> Посмотреть диаграмму</div>${svg}${c.caption?`<p class="text-muted text-sm" style="margin:10px 0 0">${c.caption}</p>`:''}</div>`;
}

  7:[

     a:"Он оценивает выражение в фильтрах, которые вы меняете — добавляя, заменяя или удаляя их. Это единственная функция, которая изменяет контекст фильтра, поэтому ее использует почти каждая расширенная мера."},
    {q:"Скажите меру, которая считает только строки региона «Запад», используя команду CALCULATE.",
     a:"Западные заказы = РАСЧЕТ(COUNTROWS(Продажи), Продажи[Регион] = \"Запад\"). Сначала идет выражение, потом фильтр — замена их местами — обычная синтаксическая ошибка."}],
  8:[
    {q:"Что нужно TOTALYTD помимо меры для работы?",
     a:"Столбец даты из специальной таблицы дат: TOTALYTD([Общий доход], Даты[Дата]). Эта таблица должна быть без пробелов и помечена как таблица дат."},
    {q:"Почему для анализа времени требуется правильная таблица дат?",
     a:"Функции просматривают таблицу дат по дате, чтобы определить «с начала года» или «тот же период прошлого года». Пробел в календаре или забывание пометить его как таблицу дат прерывает прогулку и возвращает неправильные, но правдоподобные числа."}],
  9:[
    {q:"В чем разница между слайсером и фильтром-панелью?",
     a:"Срез – это визуальный элемент на холсте, на который щелкают зрители. Фильтры-панели фильтров устанавливаются вами, автором, и невидимы для большинства зрителей."},
    {q:"Когда вы будете использовать фильтр на уровне страницы или на уровне визуального представления?",
     a:"Охват визуального уровня на одну диаграмму; уровень страницы применяется к каждому визуальному элементу на этой странице. Используйте уровень страницы, когда вся страница имеет один и тот же контекст, или визуальный уровень, когда необходимо сузить только одну диаграмму."}],
  10:[
    {q:"Что дает детализация для целевой страницы?",
     a:"Значение, которое пользователь щелкнул правой кнопкой мыши, применяется к странице сведений через поле «Детализация» — щелкните правой кнопкой мыши панель «Запад», и страница сведений откроется, отфильтрованная по западу."},
    {q:"Что такое перекрестная фильтрация — что происходит, когда вы щелкаете полосу в одном визуальном элементе?",
     a:"The other visuals on the same page filter or highlight to match your selection. It's on by default; Edit Interactions is where you disable it or switch it to highlight."}],
  11:[
    {q:"Назовите два принципа проектирования информационной панели, которые уменьшают усилия читателя.",
     a:"Иерархия — заголовок KPI вверху слева, самый крупный, на который взгляд попадает в первую очередь. Цветовая сдержанность — один или два акцента с серым для контекста, поэтому важно то число, которое выделяется."},
    {q:"Почему самое важное число должно быть читаемо за пять секунд?",
     a:"Люди читают информационную панель в виде F-образца и просматривают информацию задолго до того, как приступить к изучению. Если заголовок занимает больше времени, чем просмотр, отчет не привыкнет."}],
  12:[
    {q:"В чем разница между публикациями и общим доступом в Power BI?",
     a:"Опубликовать отправляет ваш .pbix с рабочего стола в рабочую область в службе Мощность БИ. Затем «Поделиться» дает конкретным людям доступ к просмотру того, что уже есть."},
    {q:"Что дает зрителям приложение рабочей области, чего нет в общем отчете?",
     a:"Приложение — это упакованный пакет содержимого рабочей области, доступный только для чтения и имеющий собственную аудиторию. Это наиболее чистая доставка для конечных пользователей. Публикация отчета дает доступ только к этому одному отчету."}],
  401:[
    {q:"В каком представлении Power Query показано качество, распределение и профиль столбцов?",
     a:"На ленте «Вид» установите галочки «Качество столбца», «Распределение столбца» и «Профиль столбца». Вы получаете проценты действительных/ошибочных/пустых значений, количество уникальных и уникальных значений, а также полную статистику для выбранного столбца."},
    {q:"Зачем профилировать исходные данные ПЕРЕД загрузкой их в модель?",
     a:"Он превращает «выглядит нормально» в точные подсчеты, в то время как до исправления остается один шаг Мощность запроса. Сначала переключите строку состояния на профилирование всего набора данных — по умолчанию выбирается только 1000 верхних строк."}],
  402:[
    {q:"Где находится «Удалить дубликаты» и что он включает?",
     a:"Главная ▸ Удалить строки ▸ Удалить дубликаты. Он накладывает ключи на выбранные вами столбцы, сохраняя первое вхождение каждого ключа и удаляя остальные."},
    {q:"Зачем проверять, какие столбцы определяют уникальность, прежде чем удалять дубликаты?",
     a:"Он действует только на выбранные столбцы, поэтому неправильный выбор удаляет реальные строки. Используйте «Домой» ▸ «Сохранить строки» ▸ «Сохранить дубликаты», чтобы сначала просмотреть повторы — они часто указывают на проблему с зерном выше по потоку."}],
  403:[
    {q:"Какие преобразования Power Query стандартизируют беспорядочный текст?",
     a:"Преобразовать ▸ Формат — обрезать начальные и конечные пробелы, «Очистить» удаляет непечатаемые символы, такие как разрывы строк и табуляции, а «ВЕРХНИЕ ПРОПИСА» обеспечивает один согласованный регистр."},
    {q:"Зачем обрезать и нормализовать регистр перед объединением текстового столбца?",
     a:"Два значения, которые печатаются одинаково, могут отличаться конечным пробелом или регистром, и сопоставление не будет выполнено автоматически. «Запад» и «ЗАПАД» объединяются только после того, как они будут стандартизированы."}],
  404:[
    {q:"Что делает функция «Заменить значения» с нулями и когда вы ее используете по сравнению с функцией «Удалить строки»?",
     a:"Параметр «Заменить значения» заменяет значение «нулевое» на значение по умолчанию — «Нулевой регион» становится «Неназначенным» — и строка сохраняет свой доход. Используйте функцию «Удалить строки» только в том случае, если строка действительно нежелательна; удаление строк приводит к удалению реальных данных."},
    {q:"Зачем исправлять тип столбца в Power Query, а не в DAX?",
     a:"Тип должен быть правильным до того, как данные поступят в модель — текстовая дата нарушает все меры временной аналитики. Изменение типа Power Query — это прикладной шаг, который повторно запускается при обновлении; обходной путь DAX просто скрывает источник."}],
  405:[
    {q:"Какие две суммы вы сравниваете между исходной и загруженной моделью?",
     a:"Количество строк (СЧЕТЧИКИ с обеих сторон) и контрольная сумма (СУММА суммы с обеих сторон). Подсчет доказывает, что прибыла каждая строка; Сумма доказывает, что ценности сохранились в целости и сохранности."},
    {q:"Что означает несоответствие количества строк после загрузки, что вам следует проверить в первую очередь?",
     a:"Эти строки не были перенесены — запустите Объединение запросов ▸ Левый анти источника против цель, чтобы получить список точных исходных строк, не имеющих совпадений. Это дает имена недостающим записям, а не угадывает их."}],
  601:[
    {q:"Прежде чем писать DAX, назовите три вещи, которые определяет определение меры.",
     a:"Что вы агрегируете (СУММА продаж [сумма]), какие строки учитываются (статус = «Оплачено») и временной интервал (какой квартал, прочтите в отмеченной таблице дат). Все трое живут в аргументах CALCULATE."},
    {q:"Почему две страницы отчета расходятся во мнениях по поводу «активных клиентов» одной и той же модели?",
     a:"Они кодируют разные определения — другой фильтр строк или другое временное окно. Модель не является ошибочной; никто не закрепил это определение до написания DAX."}],
  602:[
    {q:"Как SWITCH(TRUE()) превращает условия в именованные сегменты?",
     a:"Он проверяет каждое условие сверху вниз и возвращает метку первого из них, которое является истинным: Расходы за весь срок, равный 1000 или более, дает «Высокий», затем 250 или более дает «Средний», в противном случае — «Низкий»."},
    {q:"Почему SWITCH(TRUE()) превосходит вложенные IF при группировании?",
     a:"Он читается как плоский список «порог-затем-метка», поэтому добавление уровня — это еще одна строка вместо повторного вложения. Порядок по-прежнему имеет значение: сначала укажите самый строгий порог, иначе клиент стоимостью 5000 долларов попадет в Середина."}],
  603:[
    {q:"Что означает РАСЧЕТ руки DATEADD(Даты[Дата],-1,MONTH)?",
     a:"Те же даты сдвинуты на один месяц назад, поэтому CALCULATE повторно выполняет измерение за предыдущий месяц. Ему нужна непрерывная помеченная таблица дат, иначе она вернет пустое значение."},
    {q:"Какие два показателя разделяют ежемесячные темпы роста?",
     a:"Разница по сравнению с предыдущим месяцем: DIVIDE(Дядя - предыдущий, предыдущий), где Дядя — [Общий объем продаж] за этот месяц, а предыдущий — тот же показатель с датами, сдвинутыми назад на DATEADD."}],
  604:[
    {q:"Что накапливает TOTALYTD, а что сбрасывает?",
     a:"Он суммирует показатели по каждой дате с начала года до текущей точки контекста. 1 января обнуляет его, как переворачивается счетчик пробега автомобиля."},
    {q:"Чем промежуточный итог отличается от простого показателя СУММА?",
     a:"Обычная СУММА суммирует только строки в текущем контексте, поэтому каждый месяц показывает только этот месяц. Промежуточная сумма суммирует все до текущей даты, поэтому она увеличивается в течение года."}],
  605:[
    {q:"Как CALCULATE подсчитывает пользователей на каждом этапе воронки?",
     a:"Он оборачивает отдельный счетчик фильтром на шаге: Активировано = CALCULATE(DISTINCTCOUNT(События[ID пользователя]), События[Шаг] IN {...}). DISTINCTCOUNT подсчитывает людей, а не события — подходящее зерно для воронки."},
    {q:"Какие два показателя делит коэффициент конверсии шага?",
     a:"Более глубокий этап от более широкого — DIVIDE([Активирован], [Посещен]). Набор IN каждого этапа должен включать все более глубокие шаги, иначе тот, кто сразу перешел к оплате, выпадет из середины."}],
  606:[
    {q:"Что определяет когорту пользователей в матрице удержания?",
     a:"Месяц регистрации, сохраненный в виде столбца: Месяц когорты = STARTOFMONTH(Клиенты[Дата регистрации]). Все, кто присоединился в январе, навсегда принадлежат к этой когорте."},
    {q:"Зачем сравнивать когорты по месяцам с момента присоединения, а не по календарным месяцам?",
     a:"Он выстраивает группы одного возраста, поэтому третий месяц января находится рядом с третьим месяцем февраля. По календарному месяцу вы будете сравнивать трехмесячную группу с совершенно новой."}],
  701:[
    {q:"Как РАССЧИТАТЬ строки сводной книги в строки прибылей и убытков?",
     a:"Одна мера на строку оператора, каждая из которых фильтрует реестр по этой строке и суммирует его: Доход = РАСЧЕТ(SUM(Книга[Сумма]), Книга[Строка] = «Доход»). Промежуточные итоги представляют собой показатели, построенные на основе этих показателей."},
    {q:"Какие два поля бухгалтерской книги определяют каждую строку отчета о прибылях и убытках?",
     a:"Леджер[линия] выбирает, какие строки принадлежат этой строке оператора, а Леджер[Количество] — это число, которое суммируется."}],
  702:[
    {q:"Зачем использовать DIVIDE вместо / для полей?",
     a:"РАЗДЕЛИТЬ возвращает пустое значение (или альтернативный результат), если доход равен нулю или пуст; косая черта выдает ошибку, которая нарушает весь визуальный элемент. В матрице какая-то ячейка почти всегда имеет пустой знаменатель."},
    {q:"Валовая, операционная, чистая — что исключает каждая маржа?",
     a:"В валовую прибыль включаются себестоимость проданных товаров, в операционную также включаются накладные расходы, а в чистую также включаются проценты и налоги. Каждый снимает еще один слой, поэтому они уходят в сторону: брутто — это, по крайней мере, операционная, которая, по крайней мере, чистая."}],
  703:[
    {q:"На какой вопрос отвечает коэффициент текущей ликвидности?",
     a:"Покрывают ли текущие активы текущие обязательства — сможет ли бизнес выплатить причитающуюся сумму в следующем году? Примерно от 1,5 до 3 комфортно для большинства отраслей; намного выше может означать, что деньги простаивают."},
    {q:"Что соотношение долга к собственному капиталу говорит о том, как финансируется компания?",
     a:"Какая часть финансирования заимствована по сравнению с собственными деньгами владельцев — РАЗДЕЛИТЬ([Общий долг], [Общий капитал]). Чем выше значение, тем больше кредитное плечо, что увеличивает как доходность, так и риск."}],
  704:[
    {q:"Почему доллар в следующем году стоит меньше, чем доллар сегодня, с точки зрения NPV?",
     a:"Сегодняшний доллар можно инвестировать и получить доход, поэтому будущие денежные средства дисконтируются на (1 + ставка), увеличенную до года этой строки. Строка Год 0 не учитывается, поскольку все, что находится в степени 0, равно 1."},
    {q:"Что говорит отрицательная NPV о проекте?",
     a:"Ее дисконтированные денежные потоки оказываются меньше, чем она стоит, поэтому при такой ставке дисконтирования она уничтожает стоимость. DAX не предоставляет функции NPV — вы создаете ее с помощью SUMX, просматривая строки денежного потока."}],
  705:[
    {q:"Отклонение = факт минус бюджет. Когда положительное отклонение ПЛОХО?",
     a:"Что касается затрат: расходы больше, чем планировалось, являются положительным числом, но неблагоприятным. По выручке положительное означает превышение плана и благоприятное — единственное, что их разделяет, — тип линии."},
    {q:"Зачем сообщать об отклонении как в долларах, так и в процентах от бюджета?",
     a:"Доллары показывают размер промаха, проценты показывают, насколько он велик по сравнению с планом. Промах в 10 тысяч долларов — это шум на линии на 2 миллиона долларов и тревожный сигнал на линии на 20 тысяч долларов."}],
  706:[
    {q:"Что такое маржа вклада и какие затраты она игнорирует?",
     a:"Цена минус переменные затраты — то, что вносит каждая единица после оплаты затрат, которые масштабируются вместе с ней. Он игнорирует постоянные затраты, которые не меняются на единицу продукции."},
    {q:"Назовите формулу безубыточности в единицах.",
     a:"Постоянные затраты, разделенные на маржу вклада на единицу, округленные в большую сторону: ROUNDUP(DIVIDE([Постоянные затраты], [Цена] - [Переменная стоимость]), 0). После этого момента каждая дополнительная единица теряет свой полный вклад в прибыль."}],
  801:[
    {q:"Какие несколько показателей позволяют оценить форму и состояние стола за один проход?",
     a:"COUNTROWS для размера, COUNTBLANK для пробелов в столбце и DISTINCTCOUNT для количества уникальных объектов, которые он содержит. Панели качества столбцов и распределения Power Query визуально дают одинаковое чтение."},
    {q:"Зачем профилировать таблицу, прежде чем доверять любому отчету, построенному на ее основе?",
     a:"Нулевые значения, повторяющиеся ключи и нечетные распределения меняют значение меры, и они становятся невидимыми, когда строки объединяются в столбец. Сначала переключите профилирование на весь набор данных — по умолчанию оно выбирает 1000 верхних строк."}],
  802:[
    {q:"Как доказать, что представляет собой одна строка в модели?",
     a:"Сравните COUNTROWS(Заказы) с DISTINCTCOUNT(Заказы[ID заказа]). Равно означает одну строку на заказ; больше строк, чем отдельных ключей, означает, что ключ повторяется."},
    {q:"Что произойдет с вашими итоговыми значениями, если зерно окажется мельче, чем вы предполагали?",
     a:"Неуникальный ключ распространяется на все отношения и расширяет каждую меру, построенную с его помощью. Строки отдельных позиций рассматриваются так, как если бы они были заказами с двойным подсчетом."}],
  803:[
    {q:"Когда средние значения в столбце лгут — и что вы читаете вместо этого?",
     a:"Когда данные искажены, несколько очень крупных ордеров поднимают среднее значение вверх. Рядом с ним прочитайте МЕДИАНУ(Заказы[Сумма]) — медиана не подвержена крайним значениям, поэтому она является более честным «типичным»."},
    {q:"Как вывести строки за пределы типичного диапазона?",
     a:"Используйте разворот — STDEV.P(Заказы[Количество]) — чтобы увидеть ширину столбца, а также гистограмму или панель распределения Power Query, чтобы напрямую увидеть форму и ее хвост."}],
  804:[
    {q:"Что ранжирует и накапливает анализ Парето/ABC?",

// ─── SPACED RECALL QUEUE (Phase D port from Excel: +1/+3/+7 lesson positions) ─
let _pendingRecalls = [], _recallLesson = null;
function _getRecallQ(){ return JSON.parse(localStorage.getItem('pbikt-recalls')||'[]'); }
function _saveRecallQ(a){ localStorage.setItem('pbikt-recalls',JSON.stringify(a)); }
function _queueRecalls(id, l){
  if(!l.reinforces||!l.reinforces.length) return;
  let arr=_getRecallQ().filter(e=>e.srcId!==id);
  if(missesFor(id).length){
    const pos=lessonPos(id);
    for(const off of [1,3,7]) arr.push({cues:l.reinforces, srcId:id, dueAt:pos+off});
  }
  _saveRecallQ(arr);
}
// Dequeue only when the viewed lesson changes — stage advances re-render the
// same lesson and must not re-consume the queue.
function _syncRecalls(id, l){
  if(_recallLesson===id) return;
  if(l) _queueRecalls(id, l);
  // Recall cards no longer interrupt a lesson (2026-07-27). The queue is only
  // ever filled here; it is answered in the Review view, which is also what
  // PrepLoop's miss list reads.
  _pendingRecalls = [];
  _recallLesson = id;
}
function _recallsHTML(){
  // Cues may be legacy strings (question only) or {q,a} pairs. Answer reveal is
  // Anki-style flip: attempt first, then the answer inline — never a dead end.
  return _pendingRecalls.map((e,i)=>{
    // Prefer the cue set the lesson carries TODAY. Entries queued before answers
    // were authored stored bare strings, and a stored snapshot can never gain an
    // answer - which is why Tableau's cards showed no answers while Excel's did
    // (playtest T6). Fall back to the snapshot if the lesson is gone.
    const _live = (DATA.LESSONS.find(l=>l.id===e.srcId)||{}).reinforces;
    const cues = ((_live&&_live.length)?_live:e.cues).map(c=>typeof c==='string'?{q:c,a:null}:c);
    const open = !!e._open;
    const hasAns = cues.some(c=>c.a);
    return `<div class="recall-card">
    <div class="recall-header"><i data-lucide="repeat-2"></i> Быстрый вызов — без подглядывания</div>
    <ul class="recall-cues">${cues.map(c=>`<li>${c.q}${open&&c.a?`<div class="recall-ans">${c.a}</div>`:''}</li>`).join('')}</ul>
    ${open&&!hasAns?`<p class="text-muted text-sm" style="margin:0 0 10px">Этот вариант предшествует сохраненным ответам — он есть в уроке ниже.</p>`:''}
    ${open?`<div style="margin-bottom:10px"><button class="btn btn-ghost btn-sm" onclick="recallOpenLesson(${i})">Открыть этот урок →</button></div>`:''}
    <div class="recall-btns">
      ${open
        ? `<button class="btn btn-primary btn-sm" onclick="recallGotNow(${i})">Получил это сейчас</button>
           <span class="text-muted" style="font-size:12px;align-self:center">Этот придет завтра для настоящей проверки.</span>`
        : `<button class="btn btn-primary btn-sm" onclick="recallGotIt(${i})">Я вспомнил это</button>
           <button class="btn btn-ghost btn-sm" onclick="recallShowAns(${i})">Показать ответ</button>`}
    </div>
  </div>`;}).join('');
}
function _refreshRecalls(){
  // One home: the on-demand Review view. The old inline lesson host was removed
  // 2026-07-27 — recalls no longer interrupt a lesson.
  const el=document.getElementById('review-recalls');
  if(!el) return;
  if(!_pendingRecalls.length){
    if(el.id==='review-recalls'){ el.innerHTML=_reviewEmptyHTML(); }
    else el.style.display='none';
    if(window.lucide) lucide.createIcons();
    return;
  }
  el.innerHTML=_recallsHTML();
  if(window.lucide) lucide.createIcons();
}

// ─── REVIEW NOW (on-demand recall surface) ─────────────────────────────────
// Recalls normally fire when the path reaches their due position — which also
// means a skipped position strands them silently. This view pulls everything
// due (dueAt <= current position) on demand, and can pull the rest early.
function renderReview(){
  const p=_pathPos(), q=_getRecallQ();
  // Entries stay in storage until actually answered (_consumeStored) — closing
  // the tab mid-review must not lose them.
  _pendingRecalls=q.filter(e=>e.dueAt<=p);
  // "Got it now" re-queues relative to this lesson; anchor it at the path front.
  const next=DATA.LESSONS.find(l=>!state.doneLessons.includes(l.id));
  _recallLesson=next?next.id:DATA.LESSONS[DATA.LESSONS.length-1].id;
  document.getElementById('main').innerHTML=`
    <div class="row mb">
      <button class="btn btn-ghost btn-sm" onclick="navigate('home')">← Главная</button>
    </div>
    <h1>Review</h1>
    <p class="text-muted" style="margin-bottom:16px">Все необходимые отзывные сведения собраны в одном месте — сначала отвечайте по памяти, переворачивайте, если не можете.</p>
    <div id="review-recalls"></div>`;
  _refreshRecalls();
}
function _reviewEmptyHTML(){
  const n=_getRecallQ().length;
  return n>0
    ? `<div class="card"><p style="margin:0 0 10px">🎉 Сейчас ничего не подлежит оплате — ${n} review${n>1?'s':''} поставлен в очередь на более поздние места на пути.</p>
       <button class="btn btn-primary btn-sm" onclick="reviewAhead()">Практика впереди — обзор ${n>1?'them':'it'} early</button></div>`
    : `<div class="card"><p style="margin:0">🎉 Ничего в очереди. Если вы пропустите вопрос на уроке, комплект автоматически сохранит его здесь — с интервалом в несколько следующих уроков.</p></div>`;
}
function reviewAhead(){
  _pendingRecalls=_getRecallQ().slice();
  _refreshRecalls();
}
// Remove ONE stored copy of an answered entry. In the lesson flow entries were
// already dequeued from storage, so this is a no-op there; in the Review view
// they stay stored until answered, and this is what consumes them.
function _consumeStored(e){
  const arr=_getRecallQ();
  const i=arr.findIndex(x=>x.srcId===e.srcId&&x.dueAt===e.dueAt);
  if(i>=0){ arr.splice(i,1); _saveRecallQ(arr); }
}
function recallGotIt(i){
  const e=_pendingRecalls.splice(i,1)[0];
  if(e) _consumeStored(e);
  const w=parseInt(localStorage.getItem('pbikt-recall-wins')||'0')+1;
  localStorage.setItem('pbikt-recall-wins',String(w));
  _refreshRecalls();
}
function recallShowAns(i){
  if(_pendingRecalls[i]) _pendingRecalls[i]._open = true;
  _refreshRecalls();
}
function recallOpenLesson(i){
  const e=_pendingRecalls[i];
  if(e && e.srcId!=null) navigate('lesson', e.srcId);
}
// A revealed answer is not a successful recall: it re-queues for one more
// spaced check and does NOT count toward the recall-wins streak.
function recallGotNow(i){
  const e=_pendingRecalls.splice(i,1)[0];
  _consumeStored(e);
  const arr=_getRecallQ();
  arr.push({cues:e.cues, srcId:e.srcId, dueAt:lessonPos(_recallLesson)+1});
  _saveRecallQ(arr);
  _refreshRecalls();
}

// ─── RETURN LOOP + MASTERY BADGES (playtest Batch 5) ────────────────────────
// Review-due queue is the primary return hook (spaced retrieval is real
// learning); streak with one free freeze/week is secondary. All localStorage.

// The recall queue is keyed by LESSON POSITION (dueAt = pos + 1/3/7), so
// "due" means: will surface on or before the lesson you'd open next.
function _pathPos(){
  const n = DATA.LESSONS.find(l => !state.doneLessons.includes(l.id));
  return n ? lessonPos(n.id) : DATA.LESSONS.length;
}
function reviewsDue(){
  const p = _pathPos(), q = _getRecallQ();
  return {
    now:  q.filter(e => e.dueAt <= p).length,      // fires on your next lesson
    soon: q.filter(e => e.dueAt <= p + 1).length,  // fires within the next two
  };
}

// Streak: one count per LOCAL calendar day the kit is opened. A single missed
// day is absorbed by one free freeze per rolling week (gentle copy — a broken
// streak should never feel like a reset of the learning itself).
function getStreak(){
  try { return JSON.parse(localStorage.getItem('pbikt-streak')) || {}; } catch(e){ return {}; }
}
function _localDay(d = new Date()){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _dayDiff(a, b){ return Math.round((new Date(b+'T12:00') - new Date(a+'T12:00')) / 86400000); }
function bumpStreak(){
  const s = getStreak(), today = _localDay();
  if(s.last === today) return s;
  delete s.froze;
  if(!s.last){ s.n = 1; }
  else {
    const gap = _dayDiff(s.last, today);
    if(gap === 1) s.n = (s.n||0) + 1;
    else if(gap === 2 && (!s.lastFreeze || _dayDiff(s.lastFreeze, today) >= 7)){
      s.n = (s.n||0) + 1; s.lastFreeze = today; s.froze = true; // freeze absorbed the missed day
    }
    else s.n = 1;
  }
  s.last = today;
  localStorage.setItem('pbikt-streak', JSON.stringify(s));
  return s;
}
