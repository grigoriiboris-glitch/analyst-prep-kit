    {q:"Что означает слово «агрегат», когда Power BI помещает поле в визуальный элемент?",
     a:"Он объединяет множество строк в одно число: SUM суммирует значения, COUNT подсчитывает их, а AVERAGE вычисляет среднее. Каждая полоса и карточка KPI показывают агрегированные данные по соответствующим строкам."},
    {q:"Почему в одном и том же столбце «Продажи» на разных изображениях отображаются разные цифры?",
     a:"Контекст фильтра сужает строки перед выполнением математических вычислений. Полоса \"West\" суммирует только строки \"West\"; та же SUM(Sales[Revenue]) без фильтра дает общий итог."}],
  104:[
    {q:"Назовите три шага цикла Power BI и что происходит на каждом из них.",
     a:"Нагрузка вводит данные через Получить данные; Форма очищает и преобразует ее в Power Query; Анализ выстраивает связи, показатели DAX и визуальные элементы на холсте. Выполнять их не по порядку — это всегда больше работы."},
    {q:"Какой инструмент формирует данные до того, как они попадут в модель — и зачем чистить именно там, а не в визуальных элементах?",
     a:"Мощность запроса. Его прикладные шаги автоматически повторяются при каждом обновлении, поэтому очистка является постоянной; то же исправление в DAX приводит к раздуванию модели, и его приходится повторять для каждого визуального элемента."}],
  1:[
    {q:"Назовите три основных представления на левой панели Рабочий стол Power BI и укажите, для чего предназначено каждое из них.",
     a:"Представление отчета — это холст, на котором вы создаете визуальные элементы, представление данных показывает необработанные загруженные строки, а представление модели — это диаграмма, на которой вы рисуете связи и управляете ими."},
    {q:"Где расположены панели «Поля», «Визуализации» и «Фильтры» и что содержит каждая из них?",
     a:"Все трое сидят справа. В разделе «Поля» перечислены все таблицы и столбцы для перетаскивания, в «Визуализациях» выбирается тип диаграммы и сохраняются поля полей, а в «Фильтрах» содержатся фильтры на уровне визуальных элементов, страниц и отчетов."}],
  2:[
    {q:"Пройдемся по подключению к файлу Excel: какая кнопка, что потом?",
     a:"Главная ▸ Получить данные ▸ Excel, выберите нужный файл и таблицы, затем преобразуйте данные, чтобы очистить их в Мощность запроса. Закрывать & Применить загружает результат в модель."},
    {q:"В чем разница между импортом и ДиректЗапрос?",
     a:"При импорте данные копируются в модель, поэтому отчеты создаются быстро, но для отображения новых данных требуется обновление. ДиректЗапрос оставляет данные в источнике и запрашивает их в реальном времени — всегда актуально, но медленнее и более ограниченно."}],
  3:[
    {q:"Как построить гистограмму из ничего — какие два тянут?",
     a:"Щелкните значок гистограммы на панели «Визуализации», перетащите «Регион» на «Ось», затем перетащите «Доход» на «Значения». Power BI агрегирует доход, сумма по умолчанию."},
    {q:"Что определяет, будет ли поле располагаться по оси или правильно ли будут отображаться значения?",
     a:"Что вы хотите от него: ось — это то, по чему вы группируете (регион, дата), значения — измеряемое число (доход). Легенда — это необязательное разделение цветов."}],
  4:[
    {q:"Какова связь между двумя таблицами и какие столбцы она соединяет?",
     a:"Линия, проведенная в представлении модели между общим ключом — Продажи[идентификатор клиента] и Клиенты[идентификатор клиента]. Как только он существует, один визуальный элемент может использовать поля из обеих таблиц без синтаксиса соединения."},
    {q:"Почему схема «звезда» превосходит одну гигантскую плоскую таблицу в Power BI?",
     a:"Одна таблица фактов («Продажи»), окруженная измерениями («Клиенты», «Продукты», «Даты»), сохраняет каждую таблицу в индивидуальном порядке и позволяет фильтрам работать в одном направлении, от измерения к факту. Плоская таблица повторяет данные и делает фильтрацию неоднозначной."}],
  5:[
    {q:"Когда вы используете вычисляемый столбец, а не меру?",
     a:"Используйте вычисляемый столбец для значения уровня строки, которое вы хотите сгруппировать, разрезать или поместить на ось. Используйте меру для любого числа, которое должно реагировать на фильтры, например карточку KPI за срезом региона."},
    {q:"Какой из них вычисляется построчно при обновлении, а какой — во время запроса?",
     a:"Вычисляемый столбец вычисляет построчно при загрузке данных и сохраняется в таблице. Эта мера вычисляет новые данные во время запроса относительно текущего контекста фильтра и ничего не сохраняет."}],
  6:[
    {q:"Скажем, базовую меру DAX, которая суммирует продажи.",
     a:"Общий доход = SUM(Sales[Revenue]). Имя слева от знака равенства — это то, что вы увидите на панели «Поля»."},
    {q:"В чем разница между SUM и SUMX?",
     a:"СУММ добавляет один столбец вверх. SUMX просматривает таблицу строку за строкой, вычисляет выражение для каждой строки, а затем складывает результаты — это необходимо, когда математические вычисления выполняются для каждой строки, например дисконтирование каждого денежного потока по его собственному году."}],
  7:[
    {q:"Что делает CALCULATE для фильтрации контекста?",
     a:"Он оценивает выражение в фильтрах, которые вы меняете — добавляя, заменяя или удаляя их. Это единственная функция, которая изменяет контекст фильтра, поэтому ее использует почти каждая расширенная мера."},
    {q:"Скажите меру, которая считает только строки региона \"West\", используя команду CALCULATE.",
     a:"West Orders = CALCULATE(COUNTROWS(Sales), Sales[Region] = \"West\"). Сначала идет выражение, потом фильтр — замена их местами — обычная синтаксическая ошибка."}],
  8:[
    {q:"Что нужно TOTALYTD помимо меры для работы?",
     a:"Столбец даты из специальной таблицы дат: TOTALYTD([Total Revenue], 'Date'[Date]). Эта таблица должна быть без пробелов и помечена как таблица дат."},
    {q:"Почему для анализа времени требуется правильная таблица дат?",
     a:"Функции просматривают таблицу дат по дате, чтобы определить «с начала года» или «тот же период прошлого года». Пробел в календаре или забывание пометить его как таблицу дат прерывает прогулку и возвращает неправильные, но правдоподобные числа."}],
  9:[
    {q:"В чем разница между слайсером и фильтром-панелью?",
     a:"Срез – это визуальный элемент на холсте, на который щелкают зрители. Фильтры-панели фильтров устанавливаются вами, автором, и невидимы для большинства зрителей."},
    {q:"Когда вы будете использовать фильтр на уровне страницы или на уровне визуального представления?",
     a:"Охват визуального уровня на одну диаграмму; уровень страницы применяется к каждому визуальному элементу на этой странице. Используйте уровень страницы, когда вся страница имеет один и тот же контекст, или визуальный уровень, когда необходимо сузить только одну диаграмму."}],
  10:[
    {q:"Что дает детализация для целевой страницы?",
     a:"Значение, которое пользователь щелкнул правой кнопкой мыши, применяется к странице сведений через поле «Детализация» — щелкните правой кнопкой мыши панель \"West\", и страница сведений откроется, отфильтрованная по западу."},
    {q:"Что такое перекрестная фильтрация — что происходит, когда вы щелкаете полосу в одном визуальном элементе?",
     a:"Другие визуализации на этой же странице фильтруются или подсвечиваются в соответствии с выбранным элементом. Это поведение включено по умолчанию; в разделе «Изменить взаимодействия» (Редактировать взаимодействия) его можно отключить или заменить подсветкой."}],
  11:[
    {q:"Назовите два принципа проектирования информационной панели, которые уменьшают усилия читателя.",
     a:"Иерархия — заголовок KPI вверху слева, самый крупный, на который взгляд попадает в первую очередь. Цветовая сдержанность — один или два акцента с серым для контекста, поэтому важно то число, которое выделяется."},
    {q:"Почему самое важное число должно быть читаемо за пять секунд?",
     a:"Люди читают информационную панель в виде F-образца и просматривают информацию задолго до того, как приступить к изучению. Если заголовок занимает больше времени, чем просмотр, отчет не привыкнет."}],
  12:[
    {q:"В чем разница между публикациями и общим доступом в Power BI?",
     a:"Опубликовать отправляет ваш .pbix с рабочего стола в рабочую область в службе Power BI. Затем «Поделиться» дает конкретным людям доступ к просмотру того, что уже есть."},
    {q:"Что дает зрителям приложение рабочей области, чего нет в общем отчете?",
     a:"Приложение — это упакованный пакет содержимого рабочей области, доступный только для чтения и имеющий собственную аудиторию. Это наиболее чистая доставка для конечных пользователей. Публикация отчета дает доступ только к этому одному отчету."}],
  401:[
    {q:"В каком представлении Power Query показано качество, распределение и профиль столбцов?",
     a:"На ленте «Вид» установите галочки «Качество столбца», «Распределение столбца» и «Профиль столбца». Вы получаете проценты действительных/ошибочных/пустых значений, количество уникальных и уникальных значений, а также полную статистику для выбранного столбца."},
    {q:"Зачем профилировать исходные данные ПЕРЕД загрузкой их в модель?",
     a:"Он превращает «выглядит нормально» в точные подсчеты, в то время как до исправления остается один шаг Мощность запроса. Сначала переключите строку состояния на профилирование всего набора данных — по умолчанию выбирается только 1000 верхних строк."}],
  402:[
    {q:"Где находится «Удалить дубликаты» и что он включает?",
     a:"Главная ▸ Удалить строки ▸ Удалить дубликаты. Он накладывает ключи на выбранные вами столбцы, сохраняя первое вхождение каждого ключа и удаляя остальные."},
    {q:"Зачем проверять, какие столбцы определяют уникальность, прежде чем удалять дубликаты?",
     a:"Он действует только на выбранные столбцы, поэтому неправильный выбор удаляет реальные строки. Используйте «Домой» ▸ «Сохранить строки» ▸ «Сохранить дубликаты», чтобы сначала просмотреть повторы — они часто указывают на проблему с зерном выше по потоку."}],
  403:[
    {q:"Какие преобразования Power Query стандартизируют беспорядочный текст?",
     a:"Преобразовать ▸ Формат — обрезать начальные и конечные пробелы, «Очистить» удаляет непечатаемые символы, такие как разрывы строк и табуляции, а «ВЕРХНИЕ ПРОПИСА» обеспечивает один согласованный регистр."},
    {q:"Зачем обрезать и нормализовать регистр перед объединением текстового столбца?",
     a:"Два значения, которые печатаются одинаково, могут отличаться конечным пробелом или регистром, и сопоставление не будет выполнено автоматически. \"West\" и «ЗАПАД» объединяются только после того, как они будут стандартизированы."}],
  404:[
    {q:"Что делает функция «Заменить значения» с нулями и когда вы ее используете по сравнению с функцией «Удалить строки»?",
     a:"Параметр «Заменить значения» заменяет значение «нулевое» на значение по умолчанию — «Нулевой регион» становится «Неназначенным» — и строка сохраняет свой доход. Используйте функцию «Удалить строки» только в том случае, если строка действительно нежелательна; удаление строк приводит к удалению реальных данных."},
    {q:"Зачем исправлять тип столбца в Power Query, а не в DAX?",
     a:"Тип должен быть правильным до того, как данные поступят в модель — текстовая дата нарушает все меры временной аналитики. Изменение типа Power Query — это прикладной шаг, который повторно запускается при обновлении; обходной путь DAX просто скрывает источник."}],
  405:[
    {q:"Какие две суммы вы сравниваете между исходной и загруженной моделью?",
     a:"Количество строк (СЧЕТЧИКИ с обеих сторон) и контрольная SUM(СУММА суммы с обеих сторон). Подсчет доказывает, что прибыла каждая строка; Сумма доказывает, что ценности сохранились в целости и сохранности."},
    {q:"Что означает несоответствие количества строк после загрузки, что вам следует проверить в первую очередь?",
     a:"Эти строки не были перенесены — запустите Объединение запросов ▸ Левый анти источника против цель, чтобы получить список точных исходных строк, не имеющих совпадений. Это дает имена недостающим записям, а не угадывает их."}],
  601:[
    {q:"Прежде чем писать DAX, назовите три вещи, которые определяет определение меры.",
     a:"Что вы агрегируете (СУММА продаж [сумма]), какие строки учитываются (статус = «Оплачено») и временной интервал (какой квартал, прочтите в отмеченной таблице дат). Все трое живут в аргументах CALCULATE."},
    {q:"Почему две страницы отчета расходятся во мнениях по поводу «активных клиентов» одной и той же модели?",
     a:"Они кодируют разные определения — другой фильтр строк или другое временное окно. Модель не является ошибочной; никто не закрепил это определение до написания DAX."}],
  602:[
    {q:"Как SWITCH(TRUE()) превращает условия в именованные сегменты?",
     a:"Он проверяет каждое условие сверху вниз и возвращает метку первого из них, которое является истинным: Расходы за весь срок, равный 1000 или более, дает «Высокий», затем 250 или более дает «Средний», в противном случае — «Низкий»."},
    {q:"Почему SWITCH(TRUE()) превосходит вложенные IF при группировании?",
     a:"Он читается как плоский список «порог-затем-метка», поэтому добавление уровня — это еще одна строка вместо повторного вложения. Порядок по-прежнему имеет значение: сначала укажите самый строгий порог, иначе клиент стоимостью 5000 долларов попадет в Середина."}],
  603:[
    {q:"Что возвращает выражение CALCULATE([Продажи], DATEADD('Date'[Date], -1, MONTH))?",
     a:"Те же даты сдвинуты на один месяц назад, поэтому CALCULATE повторно выполняет измерение за предыдущий месяц. Ему нужна непрерывная помеченная таблица дат, иначе она вернет пустое значение."},
    {q:"Какие два показателя разделяют ежемесячные темпы роста?",
     a:"Месячный рост можно вычислить так: DIVIDE([Продажи] - [Продажи за предыдущий месяц], [Продажи за предыдущий месяц]), где [Продажи] — мера продаж за текущий месяц, а [Продажи за предыдущий месяц] — та же мера для предыдущего месяца, выбранного с помощью DATEADD."}],
  604:[
    {q:"Что накапливает TOTALYTD, а что сбрасывает?",
     a:"Он суммирует показатели по каждой дате с начала года до текущей точки контекста. 1 января обнуляет его, как переворачивается счетчик пробега автомобиля."},
    {q:"Чем промежуточный итог отличается от простого показателя СУММА?",
     a:"Обычная SUM складывает строки только в текущем контексте фильтра, поэтому для каждого месяца показывает итог только этого месяца. Накопительный итог суммирует значения с начала года до текущей даты и растёт в течение года."}],
  605:[
    {q:"Как CALCULATE подсчитывает пользователей на каждом этапе воронки?",
     a:"Он оборачивает отдельный счетчик фильтром на шаге: Activated = CALCULATE(DISTINCTCOUNT(Events[UserID]), Events[Step] IN {...}). DISTINCTCOUNT подсчитывает людей, а не события — подходящее уровень детализации для воронки."},
    {q:"Какие два показателя делит коэффициент конверсии шага?",
     a:"Более глубокий этап от более широкого — DIVIDE([Активирован], [Посещен]). Набор IN каждого этапа должен включать все более глубокие шаги, иначе тот, кто сразу перешел к оплате, выпадет из середины."}],
  606:[
    {q:"Что определяет когорту пользователей в матрице удержания?",
     a:"Месяц регистрации, сохраненный в виде столбца: Месяц когорты = STARTOFMONTH(Customers[SignupDate]). Все, кто присоединился в январе, навсегда принадлежат к этой когорте."},
    {q:"Зачем сравнивать когорты по месяцам с момента присоединения, а не по календарным месяцам?",
     a:"Он выстраивает группы одного возраста, поэтому третий месяц января находится рядом с третьим месяцем февраля. По календарному месяцу вы будете сравнивать трехмесячную группу с совершенно новой."}],
  701:[
    {q:"Как CALCULATE строки сводной книги в строки прибылей и убытков?",
     a:"Одна мера на строку оператора, каждая из которых фильтрует реестр по этой строке и суммирует его: Доход = CALCULATE(SUM(Книга[Сумма]), Ledger[Line] = «Доход»). Промежуточные итоги представляют собой показатели, построенные на основе этих показателей."},
    {q:"Какие два поля бухгалтерской книги определяют каждую строку отчета о прибылях и убытках?",
     a:"Ledger[Line] выбирает, какие строки принадлежат этой строке оператора, а Ledger[Amount] — это число, которое суммируется."}],
  702:[
    {q:"Зачем использовать DIVIDE вместо / для полей?",

// ─── SPACED RECALL QUEUE (Phase D port from Excel: +1/+3/+7 lesson positions) ─
let _pendingRecalls = [], _recallLesson = null;
function _getRecallQ(){ return JSON.parse(localStorage.getItem('pbikt-recalls')||'[]'); }
function _saveRecallQ(a){ localStorage.setItem('pbikt-recalls',JSON.stringify(a)); }
function _queueRecalls(id, l){
  if(!l.reinforces||!l.reinforces.length) return;
  let arr=_getRecallQ().filter(e=>e.srcId!==id);
  if(missesFor(id).length){
    const pos=lessonPos(id);
    for(const off of [1,3,7]) arr.push({cues:l.reinforces, srcId:id, dueAt:pos+off});
  }
  _saveRecallQ(arr);
}
// Dequeue only when the viewed lesson changes — stage advances re-render the
// same lesson and must not re-consume the queue.
function _syncRecalls(id, l){
  if(_recallLesson===id) return;
  if(l) _queueRecalls(id, l);
  // Recall cards no longer interrupt a lesson (2026-07-27). The queue is only
  // ever filled here; it is answered in the Review view, which is also what
  // PrepLoop's miss list reads.
  _pendingRecalls = [];
  _recallLesson = id;
}
function _recallsHTML(){
  // Cues may be legacy strings (question only) or {q,a} pairs. Answer reveal is
  // Anki-style flip: attempt first, then the answer inline — never a dead end.
  return _pendingRecalls.map((e,i)=>{
    // Prefer the cue set the lesson carries TODAY. Entries queued before answers
    // were authored stored bare strings, and a stored snapshot can never gain an
    // answer - which is why Tableau's cards showed no answers while Excel's did
    // (playtest T6). Fall back to the snapshot if the lesson is gone.
    const _live = (DATA.LESSONS.find(l=>l.id===e.srcId)||{}).reinforces;
    const cues = ((_live&&_live.length)?_live:e.cues).map(c=>typeof c==='string'?{q:c,a:null}:c);
    const open = !!e._open;
    const hasAns = cues.some(c=>c.a);
    return `<div class="recall-card">
    <div class="recall-header"><i data-lucide="repeat-2"></i> Быстрый вызов — без подглядывания</div>
    <ul class="recall-cues">${cues.map(c=>`<li>${c.q}${open&&c.a?`<div class="recall-ans">${c.a}</div>`:''}</li>`).join('')}</ul>
    ${open&&!hasAns?`<p class="text-muted text-sm" style="margin:0 0 10px">Этот вариант предшествует сохраненным ответам — он есть в уроке ниже.</p>`:''}
    ${open?`<div style="margin-bottom:10px"><button class="btn btn-ghost btn-sm" onclick="recallOpenLesson(${i})">Открыть этот урок →</button></div>`:''}
    <div class="recall-btns">
      ${open
        ? `<button class="btn btn-primary btn-sm" onclick="recallGotNow(${i})">Получил это сейчас</button>
           <span class="text-muted" style="font-size:12px;align-self:center">Этот придет завтра для настоящей проверки.</span>`
        : `<button class="btn btn-primary btn-sm" onclick="recallGotIt(${i})">Я вспомнил это</button>
           <button class="btn btn-ghost btn-sm" onclick="recallShowAns(${i})">Показать ответ</button>`}
    </div>
  </div>`;}).join('');
}
function _refreshRecalls(){
  // One home: the on-demand Review view. The old inline lesson host was removed
  // 2026-07-27 — recalls no longer interrupt a lesson.
  const el=document.getElementById('review-recalls');
  if(!el) return;
  if(!_pendingRecalls.length){
    if(el.id==='review-recalls'){ el.innerHTML=_reviewEmptyHTML(); }
    else el.style.display='none';
    if(window.lucide) lucide.createIcons();
    return;
  }
  el.innerHTML=_recallsHTML();
  if(window.lucide) lucide.createIcons();
}

// ─── REVIEW NOW (on-demand recall surface) ─────────────────────────────────
// Recalls normally fire when the path reaches their due position — which also
// means a skipped position strands them silently. This view pulls everything
// due (dueAt <= current position) on demand, and can pull the rest early.
function renderReview(){
  const p=_pathPos(), q=_getRecallQ();
  // Entries stay in storage until actually answered (_consumeStored) — closing
  // the tab mid-review must not lose them.
  _pendingRecalls=q.filter(e=>e.dueAt<=p);
  // "Got it now" re-queues relative to this lesson; anchor it at the path front.
  const next=DATA.LESSONS.find(l=>!state.doneLessons.includes(l.id));
  _recallLesson=next?next.id:DATA.LESSONS[DATA.LESSONS.length-1].id;
  document.getElementById('main').innerHTML=`
    <div class="row mb">
      <button class="btn btn-ghost btn-sm" onclick="navigate('home')">← Главная</button>
    </div>
    <h1>Повторение</h1>
    <p class="text-muted" style="margin-bottom:16px">Все карточки для повторения собраны здесь. Сначала попробуйте ответить по памяти, затем откройте карточку и проверьте себя.</p>
    <div id="review-recalls"></div>`;
  _refreshRecalls();
}
function _reviewEmptyHTML(){
  const n=_getRecallQ().length;
  return n>0
    ? `<div class="card"><p style="margin:0 0 10px">🎉 Сейчас ничего не подлежит оплате — ${n}Повторение${n>1?'s':''} поставлен в очередь на более поздние места на пути.</p>
       <button class="btn btn-primary btn-sm" onclick="reviewAhead()">Практика впереди — обзор ${n>1?'them':'it'} рано</button></div>`
    : `<div class="card"><p style="margin:0">🎉 Ничего в очереди. Если вы пропустите вопрос на уроке, комплект автоматически сохранит его здесь — с интервалом в несколько следующих уроков.</p></div>`;
}
function reviewAhead(){
  _pendingRecalls=_getRecallQ().slice();
  _refreshRecalls();
}
// Remove ONE stored copy of an answered entry. In the lesson flow entries were
// already dequeued from storage, so this is a no-op there; in the Review view
// they stay stored until answered, and this is what consumes them.
function _consumeStored(e){
  const arr=_getRecallQ();
  const i=arr.findIndex(x=>x.srcId===e.srcId&&x.dueAt===e.dueAt);
  if(i>=0){ arr.splice(i,1); _saveRecallQ(arr); }
}
function recallGotIt(i){
  const e=_pendingRecalls.splice(i,1)[0];
  if(e) _consumeStored(e);
  const w=parseInt(localStorage.getItem('pbikt-recall-wins')||'0')+1;
  localStorage.setItem('pbikt-recall-wins',String(w));
  _refreshRecalls();
}
function recallShowAns(i){
  if(_pendingRecalls[i]) _pendingRecalls[i]._open = true;
  _refreshRecalls();
}
function recallOpenLesson(i){
  const e=_pendingRecalls[i];
  if(e && e.srcId!=null) navigate('lesson', e.srcId);
}
// A revealed answer is not a successful recall: it re-queues for one more
// spaced check and does NOT count toward the recall-wins streak.
function recallGotNow(i){
  const e=_pendingRecalls.splice(i,1)[0];
  _consumeStored(e);
  const arr=_getRecallQ();
  arr.push({cues:e.cues, srcId:e.srcId, dueAt:lessonPos(_recallLesson)+1});
  _saveRecallQ(arr);
  _refreshRecalls();
}

// ─── RETURN LOOP + MASTERY BADGES (playtest Batch 5) ────────────────────────
// Review-due queue is the primary return hook (spaced retrieval is real
// learning); streak with one free freeze/week is secondary. All localStorage.

// The recall queue is keyed by LESSON POSITION (dueAt = pos + 1/3/7), so
// "due" means: will surface on or before the lesson you'd open next.
function _pathPos(){
  const n = DATA.LESSONS.find(l => !state.doneLessons.includes(l.id));
  return n ? lessonPos(n.id) : DATA.LESSONS.length;
}
function reviewsDue(){
  const p = _pathPos(), q = _getRecallQ();
  return {
    now:  q.filter(e => e.dueAt <= p).length,      // fires on your next lesson
    soon: q.filter(e => e.dueAt <= p + 1).length,  // fires within the next two
  };
}

// Streak: one count per LOCAL calendar day the kit is opened. A single missed
// day is absorbed by one free freeze per rolling week (gentle copy — a broken
// streak should never feel like a reset of the learning itself).
function getStreak(){
  try { return JSON.parse(localStorage.getItem('pbikt-streak')) || {}; } catch(e){ return {}; }
}
function _localDay(d = new Date()){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _dayDiff(a, b){ return Math.round((new Date(b+'T12:00') - new Date(a+'T12:00')) / 86400000); }
function bumpStreak(){
  const s = getStreak(), today = _localDay();
  if(s.last === today) return s;
  delete s.froze;
  if(!s.last){ s.n = 1; }
  else {
    const gap = _dayDiff(s.last, today);
    if(gap === 1) s.n = (s.n||0) + 1;
    else if(gap === 2 && (!s.lastFreeze || _dayDiff(s.lastFreeze, today) >= 7)){
      s.n = (s.n||0) + 1; s.lastFreeze = today; s.froze = true; // freeze absorbed the missed day
    }
    else s.n = 1;
  }
  s.last = today;
  localStorage.setItem('pbikt-streak', JSON.stringify(s));
  return s;
}

// Competence-framed mastery badges: each marks something you can now DO, with
// visible progress toward it. A few surprise badges (hidden until earned) for
// delight. Deliberately NO attendance trinkets — the streak above is shown as
// a count, never converted into a reward.
// they get no unit badge — a free learner can still fill the whole board.
function _unitProg(re){
  let d=0, t=0;
  DATA.LESSONS.forEach(l => { if(re.test(l.unit)){ t++; if(state.doneLessons.includes(l.id)) d++; } });
  return [d, t];
}

  {id:'u1',      icon:'🖥️', label:"Нативный для рабочего стола",   desc:"Завершите каждый урок «Интерфейс и данные».", prog:()=>_unitProg(/Unit 1:/)},
  {id:'u2',      icon:'🧮', label:"Спикер DAX",      desc:"Завершите каждый урок DAX & Меры.",       prog:()=>_unitProg(/Unit 2:/)},
  {id:'u3',      icon:'📊', label:"Построитель отчетов",   desc:"Завершите каждый урок Отчеты & Идеи.",   prog:()=>_unitProg(/Unit 3:/)},
  {id:'drills',  icon:'🛠️', label:"Дрель-полировщик",   desc:"Выполните все упражнения по заполнению, поиску ошибок и заказу.",
    prog:()=>[state.doneFills.length + state.doneBugs.length + state.doneParsons.length,
              DATA.FILLS.length + DATA.BUGS.length + DATA.PARSONS.length]},
  {id:'recall25',icon:'🧠', label:"Стальная ловушка",       desc:"Выполните 25 проверок интервального вспоминания по памяти.",
    prog:()=>[Math.min(25, parseInt(localStorage.getItem('pbikt-recall-wins')||'0')), 25]},
  {id:'early',   icon:'🌅', label:"Ранняя пташка",       desc:"Закончить урок до 8 утра",   secret:true, prog:()=>[(state.badgeMarks||{}).early?1:0, 1]},
  {id:'night',   icon:'🌙', label:"Ночная сова",        desc:"Закончить урок после 22:00",   secret:true, prog:()=>[(state.badgeMarks||{}).night?1:0, 1]},
  {id:'weekend', icon:'🧺', label:"Аналитик выходного дня",  desc:"Закончить урок на выходных", secret:true, prog:()=>[(state.badgeMarks||{}).weekend?1:0, 1]},
];
function checkBadges(quiet){
  state.badgesEarned = state.badgesEarned || [];
  let changed = false;
  BADGES.forEach(b => {
    const [d, t] = b.prog();
    if(t > 0 && d >= t && !state.badgesEarned.includes(b.id)){
      state.badgesEarned.push(b.id);
      changed = true;
      if(!quiet) showToast(`${b.icon} Значок получен: ${b.label}!`);
    }
  });
  if(changed) saveState();
}
function badgesCardHTML(){
  const earned = state.badgesEarned || [];
  const tiles = BADGES.filter(b => !b.secret || earned.includes(b.id)).map(b => {
    const [d, t] = b.prog();
    const got = earned.includes(b.id) || (t > 0 && d >= t);
    return `<div class="badge-tile${got?' got':''}" title="${b.desc}">
      <div class="badge-ico">${got ? b.icon : '○'}</div>
      <div class="badge-name">${b.label}</div>
      <div class="badge-prog">${got ? 'Earned' : d+'/'+t}</div>
    </div>`;
  }).join('');
  const secretN = BADGES.filter(b => b.secret && !earned.includes(b.id)).length;
  return `<div class="card">

// The More detail / Less detail toggle was removed 2026-07-27 (roadmap P8). Focus mode
// is the only mode now: the lesson is concept, directive, do it, with nothing folded
// one tap behind a button. The lesson `notes` ("Watch out") no longer render here; if
// they earn a place anywhere it is P3's wrap-up, after the learner has succeeded.

let _v2ParsAttempt = {};
let _v2ParsWasWrong = {};

// ─── ONE ORDERING EXERCISE ──────────────────────────────────────────────────
// The lesson Try stage and the Practice "Put in Order" drill were two builds of
// the same interaction: different chip classes, different placement bookkeeping
// (the lesson moved DOM nodes by tap, the drill dragged them), different pool
// labels, nudge controls on one and not the other, and two different checkers.
// Same problem, same pieces, same answer, built twice.
//
// Everything the learner touches now comes from here. What genuinely differs
// stays at the call site: a lesson does not scaffold, a drill does. That is
// content, not machinery.
const Ord = {
  pool: k => document.getElementById('ord-pool-' + k),
  ans:  k => document.getElementById('ord-ans-' + k),

  // `lines` is the exercise's own array; `order` is the display order of the
  // pool. Every chip carries its index into `lines`, which is what both callers
  // compare against their answer.
  html(key, lines, order){
    const seq = order || lines.map((_, i) => i);
    const chips = seq.map(i =>
      `<div class="ord-chip" draggable="true" data-line="${i}" onclick="Ord.tap('${key}',this)"
         ondragstart="Ord.dragStart(event)" ondragover="Ord.dragOver(event)"
         ondrop="Ord.drop(event,'${key}','pool')"><span class="pars-txt">${lines[i]}</span></div>`).join('');
    return `<div class="parsons-wrap">
      <div class="parsons-col">
        <label>Коснитесь фигуры, чтобы переместить ее между пулом и вашим ответом.</label>
        <div class="parsons-pool" id="ord-pool-${key}" ondragover="Ord.dragOver(event)" ondrop="Ord.drop(event,'${key}','pool')">${chips}</div>
      </div>
      <div class="parsons-col">
        <label>Ваш ответ сверху вниз</label>
        <div class="parsons-answer" id="ord-ans-${key}" ondragover="Ord.dragOver(event)" ondrop="Ord.drop(event,'${key}','ans')"></div>
      </div>
    </div>`;
  },

  // Tap a pool chip and it joins the answer; tap a placed chip and it goes back
  // to the pool in the pool's original line order, so returning a piece never
  // reshuffles what is left. Scaffolded chips are locked and ignore taps.
  tap(key, chip){
    if(chip.getAttribute('draggable') === 'false') return;
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    if(chip.parentElement === pool){ ans.appendChild(chip); }
    else {
      const line = +chip.dataset.line;
      const after = [...pool.querySelectorAll('.ord-chip')].find(c => +c.dataset.line > line);
      pool.insertBefore(chip, after || null);
    }
    Ord.sync(key);
  },

  // Nudge a placed piece: fixing one out-of-order line costs one tap instead of
  // clearing the answer and re-tapping everything (playtest S3, 2026-07-20).
  move(key, ev, dir){
    ev.stopPropagation();
    const chip = ev.currentTarget.closest('.ord-chip');
    if(!chip) return;
    const sib = dir < 0 ? chip.previousElementSibling : chip.nextElementSibling;
    if(!sib) return;
    if(dir < 0) chip.parentElement.insertBefore(chip, sib);
    else chip.parentElement.insertBefore(sib, chip);
    Ord.sync(key);
  },
  sync(key){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(pool) pool.querySelectorAll('.pars-move').forEach(m => m.remove());
    if(!ans) return;
    const chips = [...ans.querySelectorAll('.ord-chip')];
    chips.forEach((c, i) => {
      const locked = c.getAttribute('draggable') === 'false';
      let ctl = c.querySelector('.pars-move');
      if(locked){ if(ctl) ctl.remove(); return; }
      if(!ctl){
        ctl = document.createElement('span');
        ctl.className = 'pars-move';
        ctl.innerHTML = "<button type=\"button\" aria-label=\"Move this piece earlier\">↑</button>" +
                        "<button type=\"button\" aria-label=\"Move this piece later\">↓</button>";
        ctl.children[0].onclick = e => Ord.move(key, e, -1);
        ctl.children[1].onclick = e => Ord.move(key, e, 1);
        c.appendChild(ctl);
      }
      ctl.children[0].disabled = i === 0;
      ctl.children[1].disabled = i === chips.length - 1;
    });
  },

  // What the learner has placed, as indices into `lines`, and as text.
  placed(key){ const a = Ord.ans(key); return a ? [...a.querySelectorAll('.ord-chip')].map(c => +c.dataset.line) : []; },
  texts(key){ const a = Ord.ans(key); return a ? [...a.querySelectorAll('.ord-chip')].map(c => (c.querySelector('.pars-txt')||c).textContent) : []; },
  clear(key){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    [...ans.querySelectorAll('.ord-chip')].forEach(c => {
      c.setAttribute('draggable','true'); c.classList.remove('is-locked');
      const line = +c.dataset.line;
      const after = [...pool.querySelectorAll('.ord-chip')].find(x => +x.dataset.line > line);
      pool.insertBefore(c, after || null);
    });
    Ord.sync(key);
  },

  // Place the first `count` pieces of the correct answer, locked, and return the
  // rest to the pool in original line order so the remaining ordering is not
  // given away. The pool order stays put for the whole exercise.
  scaffold(key, lines, answer, count){
    const pool = Ord.pool(key), ans = Ord.ans(key);
    if(!pool || !ans) return;
    const all = {};
    [...pool.querySelectorAll('.ord-chip'), ...ans.querySelectorAll('.ord-chip')]
      .forEach(c => { all[+c.dataset.line] = c; });
    pool.innerHTML = ''; ans.innerHTML = '';
    const placed = new Set();
    for(let i = 0; i < count; i++) placed.add(answer[i]);
    for(let i = 0; i < count; i++){
      const chip = all[answer[i]];
      if(!chip) continue;
      chip.setAttribute('draggable','false');
      chip.classList.add('is-locked');
      ans.appendChild(chip);
    }
    lines.forEach((_, i) => {
      if(placed.has(i)) return;
      const chip = all[i];
      if(!chip) return;
      chip.setAttribute('draggable','true');
      chip.classList.remove('is-locked');
      pool.appendChild(chip);
    });
    Ord.sync(key);
  },

  _dragged: null,
  dragStart(e){ Ord._dragged = e.target.closest('.ord-chip'); if(Ord._dragged) Ord._dragged.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; },
  dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; },
  drop(e, key, zone){
    e.preventDefault();
    if(!Ord._dragged) return;
    Ord._dragged.classList.remove('dragging');
    const el = zone === 'pool' ? Ord.pool(key) : Ord.ans(key);
    if(el) el.appendChild(Ord._dragged);
    Ord._dragged = null;
    Ord.sync(key);
  }
};

// The two words a result is allowed to use, with a glyph as well as a colour so
// it never depends on seeing colour. The explanation under a check was
// byte-identical either way, so the only way to learn your own result was to
// notice which buttons appeared.
function verdictHTML(ok){
  return ok
    ? "<div style=\"font-size:13px;margin:10px 0 4px;color:var(--green);font-weight:600\">✓ Правильно</div>"
    : "<div style=\"font-size:13px;margin:10px 0 4px;color:var(--red);font-weight:600\">✗ Не совсем</div>";
}

function v2ParsCheck(lid){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l||!l.parsons) return;
  const key = 'l'+lid;
  if(!Ord.ans(key)) return;
  const placed = Ord.placed(key);
  const fb = document.getElementById('v2pbi-pars-fb-'+lid);
  if(placed.length !== l.parsons.answer.length){
    if(fb) fb.innerHTML=`<span style="color:var(--warn);font-size:13px">Переместить все ${l.parsons.answer.length} части к вашему ответу в первую очередь.</span>`;
    return;
  }
  const correct = l.parsons.answer.every((v,i)=>v===placed[i]);
  _v2ParsAttempt[lid] = {lines: Ord.texts(key)};
  _v2ParsWasWrong[lid] = !correct;
  if(correct){
    delete _v2ParsWasWrong[lid];
    celebrate();
    if(fb) fb.innerHTML="<span style=\"color:var(--green);font-size:13px;font-weight:600\">✓ Правильно</span> <span style=\"color:var(--muted);font-size:12px\">— это правильный порядок.</span>";
    // Check and Skip are moot once it is solved, so the row swaps in place and
    // the forward press is the only obvious next tap.
    const actions = document.getElementById('v2pbi-pars-actions-'+lid);
    if(actions) actions.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lid},1)">← Назад</button>
      <button class="btn btn-primary" onclick="setPbiStage(${lid},3)">${fwdLabel(STAGE_ASK[3])}</button>`;
  } else {
    recordMiss(lid, l.parsons.prompt);
    // The pieces STAY where the learner put them. A wrong ordering is only good
    // for looking at, so wiping it throws away the one thing it bought.
    if(fb) fb.innerHTML="<span style=\"color:var(--red);font-size:13px;font-weight:600\">✗ Не совсем — попробуйте изменить порядок частей.</span>";
    const btn = document.getElementById('v2pbi-stuck-try-'+lid);
    if(btn) btn.style.display='';
    if(window.lucide) lucide.createIcons();
  }
}

// ─── HELP THAT HELPS ────────────────────────────────────────────────────────
// A real hint, from the lesson's own content, with no key and no network.
// "Stuck? Get a hint" appears exactly when a learner has just failed, and it
// used to answer "Add your Anthropic API key in Settings" — a dead affordance
// at the moment of maximum frustration. Every lesson already carries an opening
// line, a worked example and a close, so there is always something honest to
// say. The API coach is the optional SECOND step for people who have set a key,
// not the only step.
function stuckHint(lid, stageName){
  const l = DATA.LESSONS.find(x=>x.id===lid);
  if(!l) return;
  const isTry = stageName==='try';
  const el = document.getElementById(`v2pbi-hint-${isTry?'try':'build'}-${lid}`);
  if(!el) return;
  let html='';
  if(isTry){
    // For an ordering puzzle the honest nudge is the rule that decides the
    // order, plus the shape of the worked example. It says how many steps there
    // are and what each one starts with, without saying which piece is which.
    const shape=(l.ral && (l.ral.code || l.ral.formula))||'';
    html += `<p style="margin:0 0 8px">Каждая строка может использовать только то, что уже определено в строках выше, поэтому порядок является порядком зависимости, а не предпочтения. Вот форма проработанного примера, который вы только что прочитали.</p>`;
    if(shape) html += `<div class="ladder-partial">${_escHTML(_hintShape(shape))}</div>`;
  } else {
    html += `<p style="margin:0 0 8px">${l.intro || l.sub || l.close || l.title}</p>`;
  }
  // The way out of being stuck is the worked example, not a stronger hint.
  html += `<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lid},1)">Еще раз покажите рабочий пример</button>
  </div>`;
  if(getCoachKey()){
    html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <button class="btn btn-ghost btn-sm" onclick="v2CoachStuck(${lid},'${stageName}')"><i data-lucide="sparkles" style="width:13px;height:13px;vertical-align:-2px"></i> Спросите также тренера по искусственному интеллекту.</button>
    </div>`;
  }
  el.innerHTML=html;
  el.classList.add('show');
  if(window.lucide) lucide.createIcons();
}
// The worked example with each line's body blanked. The skeleton, not the
// answer.
function _hintShape(code){
  return String(code||'').split('\n').map(line=>{
    const m = line.match(/^(\s*)(\S+)([\s\S]*)$/);
    if(!m) return line;
    return m[1] + m[2] + (m[3].trim() ? ' ___' : '');
  }).join('\n');
}
// The model answers in Markdown, and the response used to go through
// textContent, so a learner pressing the button at the moment they are most
// stuck read a literal "**Hint:** ... what does CALCULATE *filter*". Rendering
// the raw response as HTML instead would be an injection hole on a public page,
// so the text is escaped FIRST and only then are bold, italic and inline code
// turned back into tags. Nothing else in Markdown is honoured, on purpose:
// three replacements cannot smuggle a tag through, a full parser might.
function _hintMD(t){
  return _escHTML(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\n/g, '<br>');
}

// Hints — Mode 1 (Haiku, stuck-help) + Mode 3 (Sonnet, gap analysis)
// Shares the Anthropic key with the Excel & Python kits via localStorage['apk-coach-key'].
function getCoachKey(){ return localStorage.getItem('apk-coach-key')||''; }
function setCoachKey(k){ localStorage.setItem('apk-coach-key', k.trim()); showToast("Ключ сохранен."); }

async function _v2CoachCall(prompt, model, targetId){
  const key = getCoachKey();
  const el = document.getElementById(targetId);
  if(!key){
    // Only reachable if the key is cleared between opening the hint and
    // pressing this, but it names what is still on screen BEFORE what is not.
    if(el){ el.innerHTML="Подсказка выше и рабочий пример все еще здесь. Тренеру ИИ поверх них нужен ключ API Антропный, который вы можете добавить в «Настройки» → «Подсказки»."; el.classList.add('show'); }
    return;
  }
  if(el){ el.textContent="Думая…"; el.classList.add('show'); }
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':"Верно"},
      body:JSON.stringify({model,max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(el) el.innerHTML = _hintMD(data.content?.[0]?.text || "Нет ответа — проверьте свой ключ.");
  } catch(e){ if(el) el.textContent="Запрос не выполнен — проверьте ключ в настройках."; }
}

Доступные линии:
${p.lines.map((t,i)=>`${i}: ${t}`).join('\n')}
Дайте ОДНУ короткую подсказку (1–2 предложения), которая подтолкнет их к правильному порядку, не раскрывая его.`
    : `Вы краткий преподаватель Power BI и DAX. Студент ответил на вопрос с несколькими вариантами ответов о «${l.title}" неправильно. Вопрос: "${l.build.q}"

// One stage on screen at a time, and the stage's own ask moves out of the card
// and into the pinned directive bar, so it is said once, in the slot the learner
// has been reading from since stage one. Returns the body; the frame around it
// is renderLesson's, and it is the same frame the practice steps get.
// No guide row inside the block, unlike the SQL kit's version: this kit already
// puts guideLinkHTML under every stage and every practice step, so a fourth link
// in the same viewport would be the same offer made twice.
//
// Stays above the directive, so the last thing read before acting is still the
// instruction (CURRICULUM_STANDARD, directive always visible).
function lessonExplainHTML(l){
  const e = l.explain;
  if(!e) return '';
  return `<div class="lx">
      ${e.is  ? `<div><span class="lx-k">Что это такое.</span> ${e.is}</div>` : ''}

// ─── GUIDED PATH (lesson → its drills → next lesson) ────────────────────────
// Every drill linked to the FIRST lesson it applies to — all 36 (FILLS/BUGS/
// PARSONS ×12) appear exactly once HERE. The lesson PATH is a filtered view of
// this map, not the whole of it: guidedSeqFor keeps fills, parsons and the two
// hand-offs and drops bugs, so lessons 3, 4, 11 and 12 have no path and the
// flow advances straight past them. Bug Hunt is unchanged on the Practice tab.
const LESSON_DRILLS = {
  1:  [['workspace']],
  2:  [['parsons',8]],
  3:  [],
  4:  [['bugs',11]],
  5:  [['fills',8],['fills',11],['bugs',0],['bugs',2],['bugs',4],['bugs',7]],
  6:  [['fills',0],['fills',1],['fills',2],['fills',6],['fills',7],['fills',10],['bugs',1],['bugs',6],['parsons',0],['parsons',2],['parsons',5],['parsons',10],['lab']],
  7:  [['fills',3],['fills',9],['bugs',5],['bugs',9],['parsons',1],['parsons',7]],
  8:  [['fills',4],['fills',5],['bugs',3],['bugs',8],['bugs',10],['parsons',3],['parsons',4],['parsons',6]],
  9:  [['parsons',9]],
  10: [['parsons',11]],
  11: [],
  12: []
};

// Flashcards per lesson. NOT read by the path any more — cards came out of the
// lesson sequence and stay a whole feature on the Cards tab. Kept, and kept
// accurate, because this map plus one concat in guidedSeqFor is all it takes to
// put them back: indices are 0-based into DATA.CARDS, every card tagged to the
// FIRST lesson that teaches its concept, all 28 appearing exactly once. Unit 0
// and Units 4-7 are concept/scenario lessons with no cards of their own.
const LESSON_CARDS = {
  1:[0,1,2], 2:[3,4], 3:[26], 4:[5,6,7],
  5:[8,9,10,11], 6:[14,17,18], 7:[12,13], 8:[15,16,24],
  9:[19,25], 10:[20,21], 11:[], 12:[22,23,27]
};

// ─── GUIDED PATH (lesson → its drills → hand-off → next lesson) ─────────────
let guided = null;         // { lessonId, seq:[[type,idx]], pos, review?, reviewUnit?, nextLid? }
// Declared here, next to `guided`, and not down by the functions that use it:
// a `let` used by a function defined above it is a temporal-dead-zone trap in a
// single script block.
let _handoffReturn = null; // {lessonId, pos, key, view} — where the path was when it handed off

const _HANDOFFS = {
  workspace: {title:"Найдите его в рабочей области", copy:"Просмотрите реальный макет Power BI — панели, области полей, холст — затем вернитесь и продолжайте.", btn:"Открыть рабочую область →", view:'workspace'},
  lab: {title:"Посмотрите это в лаборатории DAX.", copy:"Просмотрите функции DAX, которые вы только что использовали в справочнике с возможностью поиска, затем вернитесь и продолжите.", btn:"Открыть лабораторию DAX →", view:'lab'}
};

// Cards and Bug Hunt are deliberately NOT in this sequence. Both are still
// whole features on the Practice tab, and Cards on its own tab as well; nothing
// is deleted. They came out because of what they do to the step AFTER them, not
// because of what they are.
//
// Every step the path keeps has the same shape: you produce a line of DAX, you
// press one button, the check tells you if it is right. A card has no answer
// box and no check, and Bug Hunt asks you to find a fault rather than produce a
// line, so each one moved four of six machinery slots on the way in and four on
// the way out. Switching the machinery is a cost that buys no retention
// (Monsell 2003, Trends in Cognitive Sciences 7(3):134-140). Switching the
// topic is what buys it, and the path still does that on every step.
//
// The two hand-off steps stay: they end in something you looked at and came
// back from, the same way SQL keeps its lab node. To put cards or bugs back,
// add the line to M and re-concat — renderGuidedStep still handles every step
// type, so nothing else has to change.
function guidedSeqFor(lessonId){
  const M = {fills:'FILLS', parsons:'PARSONS'};
  const all = LESSON_DRILLS[lessonId] || [];
  const drills = all.filter(s => M[s[0]] && DATA[M[s[0]]] && DATA[M[s[0]]][s[1]]);
  const hand = all.filter(s => _HANDOFFS[s[0]]);
  return drills.concat(hand);
}
function startGuided(lessonId){
  const seq = guidedSeqFor(lessonId);
  if(!seq.length){ gotoNextLesson(lessonId); return; }
  guided = {lessonId, seq, pos:0};
  // The practice steps render in the LESSON view now, in the lesson's own
  // frame, so the Lessons tab is the one that stays lit. The standalone
  // Practice tab is unchanged.
  _markNav(1);
  renderGuidedStep();
}
function _markNav(i){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const b = document.querySelectorAll('.nav-btn')[i]; if(b) b.classList.add('active');
}

// Mixed review node at a unit boundary: four items pulled from EARLIER lessons
// (interleaved retrieval — Rohrer/Cepeda). Soft-guide: fully skippable, never
// blocks the next lesson.
function startUnitReview(finishedUnit, nextLid){
  const nextPos = lessonPos(nextLid);
  const priorLessons = DATA.LESSONS.filter((l,i) => i < nextPos);
  // Same rule as guidedSeqFor: this node is in the path, so it holds the same
  // shape as every other step. It used to be three cards then three drills,
  // which put the biggest machinery change in the whole run at a unit boundary,
  // where the point is to mix topics and not to mix formats.
  const M = {fills:'FILLS', parsons:'PARSONS'};
  let drillPool = [];
  priorLessons.forEach(l => {
    (LESSON_DRILLS[l.id] || []).forEach(st => { if(M[st[0]] && DATA[M[st[0]]] && DATA[M[st[0]]][st[1]]) drillPool.push(st); });
  });
  const pick = (pool,n) => { const out=[]; while(pool.length && out.length<n){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); } return out; };
  // Round-robin by type so no two review items in a row are the same type. The
  // old pass only guaranteed the FIRST few were distinct, which is fine while
  // five types are in the pool and produces runs like parsons,parsons,parsons
  // once it holds two. The topics still mix; that is the part worth keeping.
  const pickDrills = (pool,n) => {
    const buckets={}; pick(pool,pool.length).forEach(st=>{ (buckets[st[0]]=buckets[st[0]]||[]).push(st); });
    const keys=Object.keys(buckets), out=[];
    while(out.length<n && keys.some(k=>buckets[k].length)){
      for(const k of keys){ if(out.length>=n) break; if(buckets[k].length) out.push(buckets[k].shift()); }
    }
    return out; };
  const seq = pickDrills(drillPool,4);
  if(!seq.length){ navigate('lesson', nextLid); return; }
  guided = {lessonId:null, seq, pos:0, review:true, reviewUnit:finishedUnit, nextLid};
  _markNav(1);
  renderGuidedStep();
}

// One card, one shape, everywhere the guide is offered. `kind` changes the
// eyebrow and nothing else: 'stage' stands under a lesson step, 'miss' prints
// under a wrong answer while the learner still wants it, 'lx' is the last row
// of the "What this is" block, and 'close' sits on the Done card.
function guideCardHTML(slug, label, kind){
  kind = kind || 'close';
  const t = GUIDE_TEASER[slug];
  const eyebrow = kind === 'miss'  ? "Все еще нечетко? Прочтите это"
                : kind === 'close' ? "Идите глубже"
                : "Полное руководство";
  const cls = kind === 'lx' ? "комплект-гид лк-гид" : "Руководство по комплекту Руководство по комплекту" + kind;
  const id  = kind === 'stage' ? ' id="kit-guide-stage"' : '';
  return `<a${id} class="${cls}" href="../guides/${slug}/" target="_blank" rel="noopener">`
    + `<span class="kg-ico"><i data-lucide="book-open"></i></span>`
    + `<span class="kg-body">`
    +   `<span class="kg-eyebrow">${eyebrow}</span>`
    +   `<span class="kg-title">${label}</span>`
    +   (t ? `<span class="kg-teaser">${t}</span>` : '')
    + `</span>`
    + `<span class="kg-go"><i data-lucide="arrow-right"></i></span>`
    + `</a>`;
}

// Stands under every step of a lesson, and under every step of its practice.
// It stays a link and never expands into a block of its own: help that carries
// a novice starts costing that same person once they know it (Kalyuga, Ayres,
// Chandler & Sweller 2003), and an offer taken on demand charges nothing to
// the learner who walks past it.
function guideLinkHTML(lid){
  const g = LESSON_GUIDE[lid];
  if(!g) return '';
  return guideCardHTML(g[0], g[1], 'stage');
}

// The lesson's frame, carrying a practice step. Same header row, same title,
// same skill strip, same unbroken stage bar — only the body between the
// directive and the Back/Next row swaps.
function renderGuidedStep(){
  if(!guided) return;
  const {seq, pos, lessonId, review} = guided;
  const step = seq[pos];
  const lesson = review ? null : DATA.LESSONS.find(l => l.id === lessonId);
  const isLast = pos === seq.length-1;
  let body = '';
  if(step[0]==='cards') body = guidedCardBody(step[1]);
  else if(_HANDOFFS[step[0]]) body = guidedHandoffBody(step[0]);
  else if(step[0]==='fills') body = fillBody(step[1]);
  else if(step[0]==='bugs') body = bugBody(step[1]);
  else if(step[0]==='parsons') body = parsonsBody(step[1]);
  // Say what the NEXT step asks for, so an advance is never a surprise.
  const nextLabel = isLast
    ? (review ? fwdLabel("закончить обзор") : fwdLabel("следующий урок"))
    : fwdLabel(STEP_ASK[(seq[pos+1]||[])[0]] || "продолжать идти");
  const backNav = pos > 0
    ? `<button class="btn btn-ghost btn-sm" onclick="guidedPrev()">← Назад</button>`
    : (review
      ? `<button class="btn btn-ghost btn-sm" onclick="guidedSkipAll()">Пропустить проверку</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="setPbiStage(${lessonId},5)">← Урок</button>`);
  // The mixed-review bar is the same component the lesson uses, in the same
  // slot — it just has no single lesson behind it, and says so.
  const bar = review
    ? `<div class="v2-stage-bar">${seq.map((st,i)=>
        `<div class="v2-stage-dot is-practice${i<pos?' done':i===pos?' active':''}" title="${STEP_DOT_LABEL[st[0]]||'Practice'}"></div>`).join('')
      }<span class="v2-stage-label">${STEP_DOT_LABEL[step[0]]||'Practice'} · ${pos+1} из ${seq.length}</span></div>
      <p class="retrieval-note">Взято из предыдущих уроков. Смешанный обзор кажется сложнее, чем новая практика, и именно здесь он прилипает.</p>`
    : unifiedStageBar(lesson, STAGE_LABELS.length, pos);
  // Review mixes several lessons, so it has no single guide and shows none.
  document.getElementById('main').innerHTML =
    lessonFrameHTML(lesson, lesson ? state.doneLessons.includes(lesson.id) : false, bar)
    + directiveHTML(guidedDirective(step))
    + body
    + (review ? '' : guideLinkHTML(lessonId))
    + `<div class="row" style="justify-content:space-between;gap:10px;margin-top:20px">
        ${backNav}
        <button class="btn btn-primary" onclick="guidedNext()">${nextLabel}</button>
      </div>`;
  if(step[0]==='parsons') initParsons(step[1]);
  if(window.lucide) lucide.createIcons();
  window.scrollTo(0,0);
}

// The ask for a practice step, in the lesson's directive bar. Reads the drill's
// own prompt so there is one sentence, not the drill's heading plus its prompt
// plus a mechanic line.
function guidedDirective(step){
  const [kind, i] = step;
  if(_HANDOFFS[kind]) return _HANDOFFS[kind].copy;
  if(kind === 'fills')   return (DATA.FILLS[i]   || {}).q;
  if(kind === 'bugs')    return (DATA.BUGS[i]    || {}).prompt;
  if(kind === 'parsons') return (DATA.PARSONS[i] || {}).prompt;
  if(kind === 'cards')   return "Произнесите это вслух по памяти, а затем проверьте себя.";
  return '';
}

// ─── HAND-OFF STEPS ─────────────────────────────────────────────────────────
// Two of them: the Workspace and the DAX Lab. Each ends in something you went
// and looked at, so the path hands off, records exactly where it was, shows a
// crumb on the target view, and picks up from the same position when you press
// it. navigate() clears `guided` on purpose — a normal navigation IS leaving
// the path — so the return pointer is kept separately and survives exactly one
// hop, to its own target view and nowhere else.
function guidedHandoffBody(key){
  const h = _HANDOFFS[key];
  return `<div class="v2-stage-card">
    <h3><i data-lucide="compass"></i> ${h.title}</h3>
    <p style="margin:0 0 12px;color:var(--muted)">${h.copy}</p>
    <button class="btn btn-primary" onclick="openGuidedHandoff('${key}')">${h.btn}</button>
  </div>`;
}
function openGuidedHandoff(key){
  const h = _HANDOFFS[key];
  if(!h) return;
  if(guided) _handoffReturn = {lessonId: guided.lessonId, pos: guided.pos, key: key, view: h.view};
  navigate(h.view);
}
function resumeGuidedFromHandoff(){
  const r = _handoffReturn; _handoffReturn = null;
  if(!r || r.lessonId == null) return navigate('lessons');
  guided = {lessonId: r.lessonId, seq: guidedSeqFor(r.lessonId), pos: r.pos};
  _markNav(1);
  guidedNext();   // the hand-off step is the thing that was just done
}
// The crumb that rides on top of the Workspace or the DAX Lab while a return
// context is live. Rendered from navigate(), so it survives coming back to the
// view a second time rather than only appearing on the first hop.
function pathCrumbHTML(){
  if(!_handoffReturn) return '';
  const l = DATA.LESSONS.find(x => x.id === _handoffReturn.lessonId);
  return `<div class="card card-sm" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--accent);margin-bottom:14px">
    <span class="text-sm">Ориентированный путь · ${l ? 'Lesson: ' + l.title : 'lesson'} · тогда посмотри</span>
    <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="resumeGuidedFromHandoff()">Продолжить путь →</button>
  </div>`;
}

// "Recall — no peeking" flashcard step: term shown, learner recalls out loud,
// then flips to check (retrieval practice, not re-reading).
function guidedCardBody(i){
  const [term, def] = DATA.CARDS[i];
  state.cardsReviewed = state.cardsReviewed || [];
  if(!state.cardsReviewed.includes(i)){ state.cardsReviewed.push(i); saveState(); }
  return `<div class="card" style="text-align:center;padding:28px">
    <span class="badge badge-unit" style="margin-bottom:12px;display:inline-block">Напомним — не подглядывать</span>
    <h2 style="margin-bottom:10px">${term}</h2>
    <p class="text-muted text-sm" style="margin-bottom:14px">Скажите вслух, что он делает (и одну распространенную ловушку), а затем проверьте себя.</p>
    <div id="gcBack" style="display:none;text-align:left;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.6">${def}</div>
    <button id="gcFlip" class="btn btn-ghost btn-sm" onclick="document.getElementById('gcBack').style.display='block';this.style.display='none'">Проверьте себя →</button>
  </div>`;
}

// The unit-boundary moment: name the skill that just went ready, then keep
// going. The kit never said what finishing a unit bought you.
function finishUnitBoundary(unit, nextLid){
  state.unitEndSeen = state.unitEndSeen || [];
  const sk = skillState(unit);
  if(sk && !state.unitEndSeen.includes(unit)){
    state.unitEndSeen.push(unit); saveState();
    const nxt = DATA.LESSONS.find(l => l.id === nextLid);
    const ready = skillsReady();
    guided = null; _handoffReturn = null;
    _markNav(1);
    const _due = reviewsDue();
    document.getElementById('main').innerHTML = `
      <div class="card" style="text-align:center;padding:30px">
        <span class="badge badge-unit" style="margin-bottom:12px;display:inline-block">${unit} · полный</span>
        <h2>Навык ${sk.n} готовый: ${sk.name}</h2>
        <p style="max-width:520px;margin:10px auto 6px">Это <strong>${ready} из ${SKILLS.length}</strong> навыки готовы. Все восемь и ты сможешь ${KIT_TARGET}.</p>
        ${_due.soon ? `<p class="text-sm text-muted" style="margin:4px auto 0">Приходи завтра — ${_due.soon} быстрый обзор${_due.soon>1?'s':''} будет ждать.</p>` : ''}
        <div class="row" style="justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="navigate('lesson',${nextLid})">Следующий: ${nxt?nxt.title:"продолжать идти"} →</button>
          <button class="btn btn-ghost btn-sm" onclick="navigate('lessons')">Все уроки</button>
        </div>
      </div>`;
    if(window.lucide) lucide.createIcons();
    window.scrollTo(0,0);
    return;
  }
  navigate('lesson', nextLid);
}

function guidedNext(){
  if(!guided) return;
  if(guided.pos < guided.seq.length-1){ guided.pos++; renderGuidedStep(); }
  else if(guided.review){ const nl = guided.nextLid, u = guided.reviewUnit; guided = null; celebrate(); finishUnitBoundary(u, nl); }
  else {
    const lid = guided.lessonId; guided = null;
    // The lesson-done reward moment lives here, AFTER the retrieval practice
    // that just ran — not at the quiz, before practice happened.
    celebrate();
    gotoNextLesson(lid);
  }
}
function guidedPrev(){ if(guided && guided.pos > 0){ guided.pos--; renderGuidedStep(); } }
function guidedSkipAll(){
  if(!guided) return;
  const g = guided; guided = null;
  if(g.review) finishUnitBoundary(g.reviewUnit, g.nextLid); else gotoNextLesson(g.lessonId);
}
function gotoNextLesson(lid){
  guided = null; _handoffReturn = null;
  const _nxt=nextLessonId(lid);
  if(_nxt===null){ navigate('home'); showToast("Вы прошли все уроки Power BI!"); return; }
  const cur = DATA.LESSONS.find(l => l.id === lid), nxt = DATA.LESSONS.find(l => l.id === _nxt);
  state.unitReviewsDone = state.unitReviewsDone || [];
  if(cur && nxt && cur.unit !== nxt.unit){
    // Unit boundary → one skippable mixed-review node (once per unit), whose
    // finish flows into the skill-ready card.
    if(!state.unitReviewsDone.includes(cur.unit)){
      state.unitReviewsDone.push(cur.unit); saveState();
      startUnitReview(cur.unit, _nxt);
      return;
    }
    // Review already done — still name the skill that just went ready, once.
    if(!(state.unitEndSeen||[]).includes(cur.unit)){ finishUnitBoundary(cur.unit, _nxt); return; }
  }
  navigate('lesson', _nxt);
}

// A drill opened from the path drops its own heading and its own prompt: the
// ask is said once, in the directive bar the learner has been reading from
// since stage one. Opened standalone from the Practice tab it is unchanged,
// because there the heading is the only thing naming the exercise.
function _inGuided(){ return !!guided; }
function _drillHead(title, prompt){
  return _inGuided() ? '' : `<h2>${title}</h2>${prompt?`<p class="drill-instruction">${prompt}</p>`:''}`;
}

// ─── FILL DRILL ────────────────────────────────────────────────────────────
// Body-only markup — in the path the LESSON's frame supplies the header, the
// skill strip, the stage bar, the directive and the bottom nav, so the drill
// returns just its card. renderFill() wraps it for standalone use.
function fillBody(idx){
  const f = DATA.FILLS[idx];
  if(!f) return '';
  _hd={hint:f.hint,ans:f.ans,state:0,kind:'fills',idx:idx};
  const done = state.doneFills.includes(f.id);
  return `
    <div class="card">
      ${_drillHead("Заполните пробел", f.q)}
      <div class="fill-partial">${f.partial}</div>

      <div id="fillChoices" style="display:flex;flex-direction:column;gap:8px">
        ${_shuf(f.choices).map(c=>`<button class="bug-choice${done&&c===f.choices[0]?' is-answered':''}" data-correct="${c===f.choices[0]?1:0}" style="text-align:left;white-space:normal;padding:10px 14px;border:1.5px solid rgba(47,109,240,.4);border-radius:8px;background:rgba(47,109,240,.08);color:var(--accent);font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer" onclick="pickFill(this,${idx})" ${done?'disabled':''}>${c}</button>`).join('')}

    </div>`;
}
function renderFill(idx){
  if(!DATA.FILLS[idx]) return navigate('practice');

  document.getElementById('main').innerHTML = `
    <div class="row mb">
      <button class="btn btn-ghost btn-sm" onclick="navigate('practice')">← Практика</button>
      ${done ? '<span class="badge badge-done">✓</span>' : ''}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto"><span class="text-muted text-sm">${idx+1} / ${DATA.FILLS.length}</span></div>
    </div>
    ${fillBody(idx)}`;

}

// Fill in the Blank — tap the correct piece (no free typing).
// In the path the lesson frame's bottom bar advances, so no inline button.
function _fillAdvance(idx){
  return guided
    ? ''
    : idx+1 < DATA.FILLS.length
      ? `<button class="btn btn-primary btn-sm" onclick="navigate('fill',${idx+1})">${fwdLabel(STEP_ASK.fills)}</button>`
      : `<button class="btn btn-primary btn-sm" onclick="navigate('practice')">Все готово →</button>`;
}
// Drills reached from the guided path belong to that lesson; standalone
// practice has no lesson to file the miss against, so it records nothing.
function _drillLesson(){ return guided && guided.lessonId!=null ? guided.lessonId : null; }
function pickFill(btn, idx){
  const f = DATA.FILLS[idx];
  const res = document.getElementById('fill-result');
  if(btn.dataset.correct === '1'){

    celebrate();
    markDone('doneFills', f.id);
    document.getElementById('fill-next').innerHTML = _fillAdvance(idx);
  } else {
    recordMiss(_drillLesson(), f.q);
    btn.style.background='rgba(207,34,46,.12)'; btn.style.borderColor='var(--red,#cf222e)'; btn.style.color='var(--red,#cf222e)'; btn.style.opacity='.8'; btn.disabled=true;
    res.innerHTML = `<span style="color:var(--red)">✗ Не совсем — попробуйте другой или сделайте шаг вверх по лестнице подсказок.</span>`;
    _ladderBump();
  }
}

function renderBug(idx){

    </div>

// Bug Hunt — tap the correct fix (no free typing).
function _shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Answered-drill state: a done drill shows its answer highlighted and stays
// re-answerable — a silent disabled lockout reads as a frozen page on revisit.
function _answeredNote(choicesId,noteId){
  return `<span style="color:var(--green);font-weight:600">✓ Вы ответили на этот вопрос — правильный выбор выделен.</span>
    <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="retryDrill('${choicesId}','${noteId}')">Попробовать ещё раз</button>`;
}
function retryDrill(choicesId,noteId){
  const c=document.getElementById(choicesId);
  if(c) c.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('is-answered');b.style.background='';b.style.color='';b.style.borderColor='';b.style.opacity='';});
  const n=document.getElementById(noteId); if(n) n.innerHTML='';
}
function _bugAdvance(idx){
  return guided
    ? ''
    : idx+1 < DATA.BUGS.length
      ? `<button class="btn btn-primary btn-sm" onclick="navigate('bug',${idx+1})">Следующая ошибка →</button>`
      : `<button class="btn btn-primary btn-sm" onclick="navigate('practice')">Все готово →</button>`;
}
function pickBugFix(btn, idx){
  const b = DATA.BUGS[idx];
  const res = document.getElementById('bug-result');
  if(btn.dataset.correct === '1'){
    btn.style.background='var(--green,#1a7f37)'; btn.style.color='#fff'; btn.style.borderColor='var(--green,#1a7f37)';
    document.querySelectorAll('#bugChoices .bug-choice').forEach(x=>x.disabled=true);
    document.getElementById('bug-fix').classList.add('show');
    const iss = document.getElementById('bug-issue'); if(iss) iss.style.display='';
    res.innerHTML = `<span style="color:var(--green);font-weight:600">✓ Правильно</span>`;
    celebrate();
    markDone('doneBugs', b.id);
    document.getElementById('bug-next').innerHTML = _bugAdvance(idx);
  } else {

/* -- ONE HELP LADDER ACROSS THE KIT --------------------------------------
   The old hint control had two rungs: the drill's hint, then the whole answer.
   Nothing, then everything. It now releases the answer in graded steps — the
   hint, then half of it, then three quarters, then all of it — and it NEVER
   completes the action for you. Even on the last rung the choices stay live and
   you still have to find and press the right one, because the pick is the rep.

   A miss climbs one rung on its own, so help arrives at the moment it is
   needed; the button climbs it on demand. One ladder runs Fill in the Blank,
   Bug Hunt and the Put in Order drill. */
function _escHTML(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var _hd={hint:'',ans:'',state:0,kind:'',idx:0};
var LADDER=[
  {label:"Показать подсказку"},
  {label:"Показать половину ответа"},
  {label:"Показать три четверти"},
  {label:"Показать весь ответ"}
];
function _ladderShellHTML(){
  return '<button class="hint-cycle-btn" id="hint-cycle-btn" onclick="cycleHint()"><i data-lucide="lightbulb" style="width:13px;height:13px;vertical-align:-2px"></i> '+LADDER[0].label+'</button>'
    +'<div class="hint-panel" id="drill-hint"></div>'
    +'<div class="answer-panel" id="drill-answer"></div>';
}
// A wrong answer climbs the ladder one rung, unprompted.
function _ladderBump(){ if(_hd.state < LADDER.length) cycleHint(); }
// The answer with only the first `frac` of it revealed. The rest is dotted out
// character for character, so the shape and the length are both still readable.
function _ladderPartial(ans, frac){
  var str=String(ans||'');
  if(str.length<2) return _escHTML(str);
  var n=Math.min(str.length-1, Math.max(1, Math.round(str.length*frac)));
  return _escHTML(str.slice(0,n))+'<span class="lp-gap">'+str.slice(n).replace(/[^\s]/g,'\u00b7')+'</span>';
}
function cycleHint(){
  if(_hd.state >= LADDER.length) return;
  _hd.state++;
  var rung=_hd.state;                    // 1..4
  var hp=document.getElementById('drill-hint');
  var ap=document.getElementById('drill-answer');
  var btn=document.getElementById('hint-cycle-btn');
  if(rung===1){
    if(hp){ hp.textContent='\u{1F4A1} '+(_hd.hint||"Прочитайте строку слева направо и скажите, для чего предназначена каждая часть."); hp.classList.add('show'); }
  } else if(rung===2 || rung===3){
    if(ap){
      ap.innerHTML='<pre class="ladder-partial">'+_ladderPartial(_hd.ans, rung===2?0.5:0.75)+'</pre>'
        +'<div class="ladder-step">'+(rung===2?"Половина этого.":"Три четверти этого.")+" Разберитесь с остальным, прежде чем смотреть дальше.</div>";
      ap.classList.add('show');
    }
  } else {
    var esc=_escHTML(_hd.ans);
    var match=findGlossaryTerm(_hd.ans+'');
    var matchTerm=match?(match.term!==undefined?match.term:match[0]):null;
    var learnHtml=matchTerm?'<button class="learn-more-link" onclick="openGlossaryFor(\''+matchTerm.replace(/'/g,"\\'")+'\')">&#x1F4D6; '+matchTerm+'</button>':'';
    if(ap){
      ap.innerHTML='<pre class="answer-code">'+esc+'</pre>'
        +"<div class=\"ladder-step\">Отображается, а не нажимается — найдите его выше и коснитесь сами. Это представитель.</div>"
        +(learnHtml?'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">'+learnHtml+'</div>':'');
      ap.classList.add('show');
    }
  }
  if(btn){
    var nxt=LADDER[rung] ? LADDER[rung].label : '';

}
function findGlossaryTerm(ansText){
